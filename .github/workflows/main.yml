          if ($cfg.roots) { foreach ($r in $cfg.roots) { if ($r.path -and (Test-Path $r.path)) { & icacls.exe $r.path /grant "*S-1-5-18:(OI)(CI)R" 2>$null | Out-Null } }; $LASTEXITCODE = 0; Write-Host "[perms] SYSTEM read granted on watcher roots" }
