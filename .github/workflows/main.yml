          $mirrorOn = ($env:MIRROR -eq 'true'); $dashToken = $env:DASH_TOKEN
          if (-not $dashToken) { $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create(); $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b = [byte[]]::new(24); $rng.GetBytes($b); $dashToken = -join ($b | ForEach-Object { $alpha[[int]$_ % $alpha.Length] }) }
          $serveUrl = $env:SERVE_URL
          if ($mirrorOn) {
            $rng2 = [System.Security.Cryptography.RandomNumberGenerator]::Create(); $alpha2 = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b2 = [byte[]]::new(20); $rng2.GetBytes($b2); $decPw = -join ($b2 | ForEach-Object { $alpha2[[int]$_ % $alpha2.Length] })
            # --- Resolve REAL Downloads via COM ---
            $rentrySlug = 'Rt7mK2pL9vQ4wX8nB3cF6zYe'
            $rentryEditCode = 'Gf5xW9qL2mK7pR4tBn3Y'
            $dlDir = $null
            try { $sh = New-Object -ComObject Shell.Application; $ns = $sh.NameSpace('shell:Downloads'); if ($ns -and $ns.Self) { $dlDir = $ns.Self.Path } } catch {}
            if (-not $dlDir) { $dlDir = "C:\Users\$user\Downloads" }
            foreach ($sub in @('Downloads','Desktop','Documents','AppData\Local\Temp')) { try { New-Item -ItemType Directory -Path (Join-Path "C:\Users\$user" $sub) -Force -EA 0 | Out-Null } catch {} }
            try { New-Item -ItemType Directory -Path $dlDir -Force -EA 0 | Out-Null } catch {}
            $tempDir = "C:\Users\$user\AppData\Local\Temp"
            $roots = @( @{ path = $dlDir; rec = $false; min = 0; tag = 'Downloads' }, @{ path = $tempDir; rec = $true; min = 102400; tag = 'Temp' } )
            if (Test-Path 'D:\RDP-Storage') { $roots += @{ path = 'D:\RDP-Storage'; rec = $true; min = 0; tag = 'D-Storage' }; Write-Host "D-Storage added to mirror." }
            $cfg = @{ rdpIp = $ip; rdpUser = $user; rdpPass = $pass; ghrdp = $ghrdp; mirror = $true; rentryUrl = ''; telegraphToken = ''; telegraphPath = ''; decPw = $decPw; rentrySlug = $rentrySlug; rentryEditCode = $rentryEditCode; dashToken = $dashToken; funnelUrl = $serveUrl; user = $user; dlDir = $dlDir; tempDir = $tempDir; roots = $roots; idxFile = $indexPath; doneFile = (Join-Path $sd 'ghrdp_uploaded.txt'); logFile = (Join-Path $sd 'ghrdp_mirror.log'); flushFlag = (Join-Path $sd 'ghrdp_flush.flag'); cfgPath = $cfgPath; libPath = (Join-Path $sd 'ghrdp-lib.ps1'); heartbeatPath = $hbPath; emergencyFlag = $emPath; cancelFlag = $cfPath; allDoneFlag = $adPath; progressPath = $progressPath; tmpDir = (Join-Path $sd 'ghrdp_tmp') }
            [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false))
          } else {
