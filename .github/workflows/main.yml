          html[data-theme="dark"] .pv-body,html[data-theme=dark] .pv-body{--pv-bg:#1b1b1b}
          .pv-spinner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:inherit;font-size:12px;color:var(--pv-mt,#616161)}.pv-spinner[hidden]{display:none}
          .pv-ring{width:34px;height:34px;border-radius:50%;border:3px solid var(--pv-bd,#ccc);border-top-color:var(--accent,#0067C0);animation:pvSpin .8s linear infinite}
          @keyframes pvSpin{to{transform:rotate(360deg)}}
          .pv-content{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:16px;gap:12px}
          .pv-content img{max-width:100%;max-height:60vh;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
          .pv-content video,.pv-content audio{max-width:100%;max-height:60vh;border-radius:4px;outline:none}
          .pv-content iframe{width:100%;height:60vh;border:0;border-radius:4px;background:#fff}
          .pv-content pre{width:100%;max-height:60vh;overflow:auto;margin:0;padding:12px;border-radius:4px;align-self:stretch;background:var(--pv-cd,#1e1e1e);color:#d4d4d4;font:12px/1.5 Consolas,'Cascadia Mono',monospace;white-space:pre-wrap;word-break:break-word}
          .pv-edit{width:100%;min-height:55vh;resize:vertical;padding:12px;border-radius:4px;align-self:stretch;outline:none;border:1px solid var(--pv-bd,#ccc);background:var(--pv-cd,#1e1e1e);color:#d4d4d4;font:12px/1.5 Consolas,'Cascadia Mono',monospace;white-space:pre-wrap;word-break:break-word}
          .pv-fallback{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px;text-align:center}
