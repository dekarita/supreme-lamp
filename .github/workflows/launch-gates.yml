          if [ -d payloads/search-sources ]; then echo 'F58: payloads/search-sources is F56-b territory' >&2; exit 1; fi
          # §2 ONE reusable form, mounted at exactly TWO surfaces, writing ONE store.
          test "$(grep -c '<SourceForm' src/pages/Settings.tsx)" -eq 1
          test "$(grep -c '<SourceForm' src/pages/search/v2/AdvancedPanel.tsx)" -eq 1
          grep -qF 'export const customSources = createCustomSourceStore()' "$store"
          grep -qF 'store = customSources' "$form"
          if grep -nE 'surface === "(settings|advanced)"' "$form"; then
            echo 'F58: the shared form must not branch on its mount point' >&2; exit 1
          fi
          # §1 store contract literals: runner path, operator-store env seam, the
          # fail-closed startup ladder and the single-write confirmations.
          for tok in '~/.ghrdp/sources' 'TS_SOURCES_URL' 'concurrency: 1' 'requestsPerMinute: 60' 'requestTimeoutSec: 30' 'FAN_OUT_CAP' 'overridable: false' 'decrypt-failed' 'cache-read-only' 'store-read-only' 'runtime-discovery-refused' 'remove-confirmation-mismatch' 'persist-verify'; do
            grep -qF "$tok" "$store" "$core" || { echo "F58: missing literal: $tok" >&2; exit 1; }
          done
          grep -qF 'provenance-incomplete: ' "$core"
          grep -qF 'signature-unverifiable: ' "$core"
          grep -qF 'redirect-off-allowlist' "$core"
          # §1 encrypted at rest, no plaintext fallthrough, no cache retry in the clear.
          for fn in Protect-F58Blob Unprotect-F58Blob Write-F58StoreFile Read-F58StoreFile Get-F58OperatorBlob Invoke-F58Startup New-F58PerRunKey; do
            grep -qF "function $fn" "$mod" || { echo "F58: $mod lost $fn" >&2; exit 1; }
          done
          grep -qF 'no plaintext fallthrough' "$mod"
          # [F97] the blob envelope must AUTHENTICATE: the inner F58A1 HMAC
          # framing + its domain-separated key + the lab's deterministic tamper
          # cell are pinned here, so the ~1/256 PKCS7 coin flip that reddened
          # windows-native/WRONG-KEY-REFUSED on main can never come back.
          grep -qF 'function Get-F58MacKey' "$mod"
          grep -qF 'F58MacTag' "$mod"
          grep -qF 'if ($tag -cne $expect)' "$mod"
          grep -qF 'instead of depending on PKCS7 padding luck' "$mod"
          grep -qF 'AUTH-TAMPER-REFUSED' "$lab"
          grep -qF "sources-url-not-https" "$mod"
          grep -qF 'sources-url-ip-literal' "$mod"
          if grep -nE 'ConvertFrom-SecureString|ClipBoard|ExportClixml|ConvertTo-SecureString' "$mod"; then
            echo 'F58: the store must not use an exportable/clipboard credential path' >&2; exit 1
          fi
          if grep -nE 'powershell\.exe|-ExecutionPolicy|Invoke-Expression|-EncodedCommand|mshta|wscript|cscript' "$mod" "$lab"; then
            echo 'F58: script-host execution token in the new surfaces' >&2; exit 1
          fi
          # §3 presets: pinned per-host allowlists, wildcard-free, redirect fence.
          test "$(grep -c 'presetId: "code-hosting/' "$core")" -eq 4
          if grep -nE 'allowedDomains: \[[^]]*\*' "$core"; then
            echo 'F58: wildcard domain in a preset (the frozen schema rejects it)' >&2; exit 1
          fi
          grep -qF 'requireAllowlisted: true' "$core"
          # §3 hard rate limits are applied, not advertised: the clamp is reported.
          grep -qF 'clamped to ' "$core"
          # §2 the form is UI-only: no storage, no credential, no endpoint literal.
          if grep -nE 'localStorage|sessionStorage|indexedDB|Authorization|password' "$store" "$core" "$presets" "$form" "$list"; then
            echo 'F58: the registry must persist nothing in the browser and hold no credential' >&2; exit 1
          fi
          if grep -rn '/api/fetch' src/search src/components/search; then
            echo 'F58: the fetch backend literal leaked into the F58 surface (F56-d owns it)' >&2; exit 1
          fi
          # mirror stays out of scope: default-OFF preserved, no new wiring.
          grep -qF 'enabled = $false' payloads/ghrdp-mirror.ps1
          if grep -nE 'mirror_enable|Get-F46DefaultHost|Set-F46|ghrdp-mirror' "$store" "$core" "$presets" "$form" "$list" "$mod"; then
            echo 'F58: touched the mirror surface' >&2; exit 1
          fi
          # no piracy index, no crawler, no scraper anywhere in the F58 surfaces
          if grep -rniE '1337x|thepiratebay|pirate ?bay|rarbg|kickass|torrentz|crawler|scrape|Spider\.'               src/search src/components/search payloads/user-sources "$mod" "$lab"; then
            echo 'F58: a banned surface appeared' >&2; exit 1
          fi
          # §4 i18n: 56 registry keys, byte-identical key sets, both languages.
          python3 - <<'PY'
          import json, hashlib
          def flat(d, p=''):
              out = {}
              for k, v in d.items():
                  if isinstance(v, dict): out.update(flat(v, p + k + '.'))
                  else: out[p + k] = v
              return out
          en = json.load(open('src/i18n/en.json', encoding='utf-8'))
          si = json.load(open('src/i18n/si.json', encoding='utf-8'))
          re_, rs = flat(en['search']['registry']), flat(si['search']['registry'])
          assert sorted(re_) == sorted(rs), 'registry key sets differ'
          # [F70 §3.2] 56 -> 60: the four intended deep-probe keys
          # (probe.approveRequired/override/approved/warned, en+si parity
          # asserted by i18n-f56-parity.test.ts).
          assert len(re_) == 60, ('registry key count', len(re_))
          assert all(v.strip() for v in rs.values()), 'empty si value'
          assert any(chr(0x0d80) <= c <= chr(0x0dff) for v in rs.values() for c in v), 'si registry must carry Sinhala'
          raw = open('docs/f56/schema.json', 'rb').read()
          assert hashlib.sha256(raw).hexdigest() == 'c33601d94e55bab77cf940918c2949430ba5db19faf3314049f6dedb882336c8', 'frozen schema moved'
          sch = json.loads(raw)
          assert len(sch['required']) == 16 and sch['additionalProperties'] is False
          for f in ('addedAt', 'source', 'enableState'):
              assert f not in sch['properties'], 'F58 must not widen the frozen schema'
          # the 219 id lock stays one-directional; F58 ids live in the additive file
          parent = set(__import__('re').findall(r"'([^']+)'", open('src/lib/regression-ids.ts', encoding='utf-8').read()))
          assert len(parent) == 219, 'frozen 219 changed'
          ids = __import__('re').findall(r'"(f56\.search\.v2\.[A-Za-z0-9.]+)"', open('src/pages/search/v2/ids.ts', encoding='utf-8').read())
          import re as _re
          txt = open('src/pages/search/v2/ids.ts', encoding='utf-8').read()
          m = _re.search(r'F58_SEARCH_IDS = \[(.*?)\] as const;', txt, _re.S)
          f58 = _re.findall(r'"(f5[67]\.[A-Za-z0-9.]+)"', m.group(1))
          assert 5 <= len(f58) <= 40, ('f58 id lock size', len(f58))
          assert len(set(f58)) == len(f58), 'duplicate f58 id'
          for i in f58:
              assert i not in parent and i.replace('.', '-') not in parent, ('219 collision', i)
          print('F58 registry i18n + schema + id locks OK (%d keys, %d ids)' % (len(re_), len(f58)))
          PY
          # the node lab is the loader-vs-freeze proof (also run by the Node step)
          node --test tests/f58-descriptor-loader.test.js
          echo 'F58 gates PASS'

      # [F56-d] TRANSPORT LANE (aria2c + /api/fetch + roots=6 + search_enable)
