          html[data-theme=dark]{--mica:#202020;--acrylic:rgba(40,40,40,.75);--surface:#282828;--surface2:#2d2d2d;--text:#fff;--text2:#a6a6a6;--border:#333;--hover:rgba(255,255,255,.08);--sel:rgba(0,103,192,.35)}
