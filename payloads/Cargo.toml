[package]
name = "ghrdp-dash"
version = "1.0.0"
edition = "2021"
description = "GHRDP real-time Mission Control dashboard (Axum + WebSocket + notify)"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
notify = "6"
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
