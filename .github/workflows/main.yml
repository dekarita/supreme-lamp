          $crx='https://edge.microsoft.com/extensionwebstorebase/v1/crx'
          New-ItemProperty -Path $edgePol -Name '1' -Value "odfafepnkmbhccpbejgmiehpchacaeak;$crx" -PropertyType String -Force|Out-Null
          New-ItemProperty -Path $edgePol -Name '2' -Value "ifoakfbpdcdoeenechcleahebpibofpc;$crx" -PropertyType String -Force|Out-Null
          $fav='[{"name":"FMHY Torrenting","url":"https://fmhy.net/torrenting"},{"name":"GitHub RDP Mirror","url":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe"}]'
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value $fav -PropertyType String -Force|Out-Null
          $ffdist='C:\Program Files\Mozilla Firefox\distribution'; New-Item -ItemType Directory -Path $ffdist -Force|Out-Null
          $ffpol='{"policies":{"Bookmarks":[{"Title":"FMHY Torrenting","URL":"https://fmhy.net/torrenting","Placement":"toolbar"},{"Title":"GitHub RDP Mirror","URL":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe","Placement":"toolbar"}]}}'
          Set-Content -Path (Join-Path $ffdist 'policies.json') -Value $ffpol -Encoding UTF8
          try { winget install --id qBittorrent.qBittorrent -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null; Write-Host "qBittorrent installed." } catch { Write-Host "qBittorrent winget failed (non-fatal)." }; Reset-Exit
          try { winget install --id Parsec.Parsec -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null; Write-Host "Parsec installed." } catch { Write-Host "Parsec winget failed (non-fatal)." }; Reset-Exit
          $pcfg='C:\ProgramData\Parsec'; New-Item -ItemType Directory -Path $pcfg -Force|Out-Null
          "app_host = 1`r`nprivacy_mode = 0`r`nserver_resolution = 1920x1080" | Set-Content (Join-Path $pcfg 'config.txt') -Encoding ASCII -ErrorAction SilentlyContinue
          if(Test-Path 'C:\Program Files\Parsec\parsecd.exe'){ New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'ParsecAuto' -Value '"C:\Program Files\Parsec\parsecd.exe"' -PropertyType String -Force -ErrorAction SilentlyContinue|Out-Null; Write-Host "Parsec autolaunch set." } else { Write-Host "Parsec exe not found - skipped autolaunch." }
          Reset-Exit
          $sd=$env:RUNNER_TEMP
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'
          $launcher=Join-Path $sd 'ghrdp-launcher.ps1'
          $ps="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          $args = "-NoExit -ExecutionPolicy Bypass -File `"$launcher`" -CfgPath `"$cfgPath`" -Port 7331"
          foreach($desk in @("C:\Users\Public\Desktop","C:\Users\$($env:RDP_USER)\Desktop")){
            try { New-Item -ItemType Directory -Path $desk -Force -EA 0 | Out-Null; $ws=New-Object -ComObject WScript.Shell; $sc=$ws.CreateShortcut((Join-Path $desk 'Mission Control.lnk')); $sc.TargetPath=$ps; $sc.Arguments=$args; $sc.WindowStyle=1; $sc.Description='Start RDP dashboard + mirror + Funnel (live console)'; $sc.Save(); Write-Host "Mission Control shortcut -> $desk" } catch { Write-Host "shortcut err $desk : $_" }
          }
          & (Join-Path $sd 'ghrdp-summary.ps1') $cfgPath
          "### Theme + Bookmarks + qBittorrent + Parsec + Mission Control + Funnel + ONE-CLICK RDP Ready" >> $env:GITHUB_STEP_SUMMARY
          "Dark mode, bookmarks, qBittorrent, Parsec installed. **ONE-CLICK RDP link is in the Summary tab** - click it on your pc and RDP auto-connects with zero typing (first time tick 'Always allow' on the browser prompt)." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Configure step complete (exit forced 0)."
          exit 0

      - name: Prepare dashboard + mirror config (incl. random dashboard token)
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        run: |
          $ts="C:\Program Files\Tailscale\tailscale.exe"; $ip=(& $ts ip -4).Trim(); $user=$env:RDP_USER; $pass=$env:RDP_PASS
          $eu=[uri]::EscapeDataString($user); $ep=[uri]::EscapeDataString($pass); $ghrdp="ghrdp://$ip/$eu/$ep"; $sd=$env:RUNNER_TEMP
          New-Item -ItemType Directory -Path (Join-Path $sd 'ghrdp_tmp') -Force | Out-Null
          $indexPath=Join-Path $sd 'ghrdp_mirror_index.json'; $progressPath=Join-Path $sd 'ghrdp_progress.json'
          $hbPath=Join-Path $sd 'ghrdp_heartbeat.txt'; $emPath=Join-Path $sd 'ghrdp_emergency.flag'; $cfPath=Join-Path $sd 'ghrdp_cancel.flag'; $adPath=Join-Path $sd 'ghrdp_alldone.flag'
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $mirrorOn=($env:MIRROR -eq 'true')
          $dashToken = $env:DASH_TOKEN
          if(-not $dashToken){ $rng=[System.Security.Cryptography.RandomNumberGenerator]::Create(); $alpha='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b=[byte[]]::new(24); $rng.GetBytes($b); $dashToken=-join ($b|%{$alpha[[int]$_ % $alpha.Length]}) }
          $serveUrl = $env:SERVE_URL
          if($mirrorOn){
            $b2=[byte[]]::new(20); $rng.GetBytes($b2); $decPw=-join ($b2|%{$alpha[[int]$_ % $alpha.Length]})
            $dlDir="C:\Users\$user\Downloads"; $tempDir="C:\Users\$user\AppData\Local\Temp"
            $roots=@(@{path=$dlDir;rec=$false;min=0;tag='Downloads'},@{path=$tempDir;rec=$true;min=102400;tag='Temp'})
            if(Test-Path 'D:\RDP-Storage'){ $roots += @{path='D:\RDP-Storage';rec=$true;min=0;tag='D-Storage'}; Write-Host "D-Storage added to mirror." }
            $cfg=@{ rdpIp=$ip; rdpUser=$user; rdpPass=$pass; ghrdp=$ghrdp; mirror=$true; rentryUrl='https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe'; editCode='Gf5xW9qL2mK7pR4tBn3Y'; slug='Rt7mK2pL9vQ4wX8nB3cF6zYe'; decPw=$decPw; dashToken=$dashToken; funnelUrl=$serveUrl; user=$user; dlDir=$dlDir; tempDir=$tempDir; roots=$roots; idxFile=$indexPath; doneFile=(Join-Path $sd 'ghrdp_uploaded.txt'); logFile=(Join-Path $sd 'ghrdp_mirror.log'); flushFlag=(Join-Path $sd 'ghrdp_flush.flag'); cfgPath=$cfgPath; libPath=(Join-Path $sd 'ghrdp-lib.ps1'); heartbeatPath=$hbPath; emergencyFlag=$emPath; cancelFlag=$cfPath; allDoneFlag=$adPath; progressPath=$progressPath; tmpDir=(Join-Path $sd 'ghrdp_tmp') }
            $cfg | ConvertTo-Json -Depth 6 | Set-Content $cfgPath -Encoding UTF8
          } else {
            @{ rdpIp=$ip; rdpUser=$user; rdpPass=$pass; ghrdp=$ghrdp; mirror=$false; rentryUrl=''; dashToken=$dashToken; funnelUrl=$serveUrl } | ConvertTo-Json -Depth 4 | Set-Content $cfgPath -Encoding UTF8
          }
          Write-Host "Config written. mirror=$mirrorOn. Funnel + ONE-CLICK link set by Mission Control launcher."
          & (Join-Path $sd 'ghrdp-summary.ps1') $cfgPath

      - name: Keep Alive (5h30) - hosts dashboard + watcher (so local-pc web link works)
        run: |
          $sd=$env:RUNNER_TEMP
          & (Join-Path $sd 'ghrdp-summary.ps1') (Join-Path $sd 'ghrdp_cfg.json')
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $serverScript=Join-Path $sd 'rdp-redirect-server.ps1'; $watcherScript=Join-Path $sd 'ghrdp-watcher.ps1'
          $progressPath=Join-Path $sd 'ghrdp_progress.json'; $emFlag=Join-Path $sd 'ghrdp_emergency.flag'; $flushFlag=Join-Path $sd 'ghrdp_flush.flag'; $okFile=Join-Path $sd 'ghrdp_server_ok.txt'
          $cfg=Get-Content $cfgPath -Raw|ConvertFrom-Json
          Remove-Item $okFile -Force -EA 0
          $wjob=$null
          if($cfg.mirror -and (Test-Path $watcherScript)){ try{ $wjob=Start-Job -FilePath $watcherScript -ArgumentList $cfgPath; Write-Host "[watcher] job $($wjob.Id)" }catch{ Write-Host "[watcher] err $_" } }
          $sjob=$null
          try{ $sjob=Start-Job -ScriptBlock { param($ss,$port,$bind,$uidir,$prog,$cfgp,$em,$fl,$ok) $ErrorActionPreference='Continue'; try{ . $ss; Start-GhrdpServer -Port $port -BindAddress $bind -UiDir $uidir -ProgressPath $prog -CfgPath $cfgp -EmergencyFlagPath $em -FlushFlagPath $fl -OkFile $ok }catch{ Set-Content $ok ("JOB_EXCEPTION: $_") -Encoding ascii } } -ArgumentList $serverScript,7331,'0.0.0.0',$sd,$progressPath,$cfgPath,$emFlag,$flushFlag,$okFile; Write-Host "[server] job $($sjob.Id)" }catch{ Write-Host "[server] err $_" }
          for($i=0;$i -lt 30;$i++){ if((Test-Path $okFile) -and ((Get-Content $okFile -Raw) -match 'LISTENING')){ Write-Host "[server] up on 7331"; break }; Start-Sleep -Milliseconds 500 }
          Write-Host "Dashboard alive: 127.0.0.1:7331 (inside RDP) AND the tailnet web link printed in earlier steps. Keeping alive 5h30..."
          $limit=New-TimeSpan -Hours 5 -Minutes 30; $start=Get-Date
          while(((Get-Date)-$start) -lt $limit){
            if($sjob -and $sjob.State -ne 'Running'){ Write-Host "[server] died: $(Receive-Job $sjob -EA 0)" }
            if($wjob -and $wjob.State -ne 'Running'){ Write-Host "[watcher] died: $(Receive-Job $wjob -EA 0)" }
            Start-Sleep -Seconds 60
          }

      - name: Emergency upload on cancel (always)
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        env:
          STATUS: ${{ job.status }}
        run: |
          $sd=$env:RUNNER_TEMP
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $lib=Join-Path $sd 'ghrdp-lib.ps1'
          if(-not ((Test-Path $cfgPath) -and (Test-Path $lib))){ Write-Host "no mirror cfg/lib - skip"; exit 0 }
          $emf=Join-Path $sd 'ghrdp_emergency.flag'; $progressPath=Join-Path $sd 'ghrdp_progress.json'
          Set-Content $emf (Get-Date -f o) -Encoding ascii
          Write-Host "EMERGENCY (status=$env:STATUS) - signalled watcher; monitoring live progress..."
          $deadline=(Get-Date).AddMinutes(12); $watcherSeen=$false
          while((Get-Date) -lt $deadline){
            $prog=$null; if(Test-Path $progressPath){ try{ $prog=Get-Content $progressPath -Raw|ConvertFrom-Json -ErrorAction Stop }catch{} }
            if($prog -and $prog.ts){ $age=[int]((Get-Date)-(Get-Date $prog.ts)).TotalSeconds; if($age -lt 15){ $watcherSeen=$true } else { Write-Host "watcher stale (${age}s) - fallback."; break } }
            if($prog -and $prog.agg){ $u=[int]$prog.agg.active; $f=[int]$prog.agg.failed; $d=[int]$prog.agg.done; $pct=$prog.agg.overallPct; Write-Host "...done=$d active=$u failed=$f overall=${pct}% (watcher alive=$watcherSeen)" }
            if($watcherSeen -and $prog -and $prog.agg -and [int]$prog.agg.active -eq 0 -and [int]($prog.agg.tracked) -gt 0 -and [int]($prog.agg.done) -ge ([int]($prog.agg.tracked)-[int]($prog.agg.failed))){ Write-Host "Watcher finished all transfers."; break }
            Start-Sleep -Seconds 5
          }
          $needFallback = -not $watcherSeen
          if(-not $needFallback -and (Test-Path $progressPath)){ try{ $pp=Get-Content $progressPath -Raw|ConvertFrom-Json -ErrorAction Stop; if($pp.agg -and [int]$pp.agg.active -gt 0){ $needFallback=$true } }catch{} }
          if($needFallback){
            Write-Host "DIRECT fallback upload (streaming, lock-safe)..."
            $env:GHRDP_CFG=$cfgPath; . $lib; $cfg=Read-Cfg; $env:GHRDP_LOG=$cfg.logFile; Init-Progress $progressPath
            foreach($p in @('qbittorrent','qbittorrent-nox')){ Get-Process -Name $p -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 4
            $junk=@('.tmp','.crdownload','.partial','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak')
            $done=@{}; if(Test-Path $cfg.doneFile){ Get-Content $cfg.doneFile | %{$done[$_]=$true} }
            $idx=Load-Index $cfg
            foreach($r in $cfg.roots){
              if(-not (Test-Path $r.path)){ continue }
              $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending}
              foreach($fi in $items){
                if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}
                if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}
                $len=$fi.Length; $safe=$fi.Name -replace '\|','_'; $disp=($safe -replace '[^\x20-\x7E]','_')
                $ex=$idx | ?{$_.name -eq $safe -and $_.src -eq $r.tag} | select -First 1
                if(-not $ex){ $ex=@{name=$safe;src=$r.tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss')}; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len }
                $ex.status='uploading'; $enc=Join-Path $cfg.tmpDir ('em_'+[guid]::NewGuid().ToString('N')+'.enc'); $gf=$null
                Set-Active $disp 'encrypt' $len; try{ Encrypt-File $fi.FullName $enc $cfg.decPw }catch{}
                Set-Active $disp 'upload' $len; try{ $gf=Upload-Gofile-Streamed $enc $disp }catch{}
                Remove-Item $enc -Force -ErrorAction SilentlyContinue
                if($gf){ $ex.payload=B64U ($gf+'|'+$cfg.decPw+'|'+$safe); $ex.gofile=$gf; $ex.status='ok'; $ex.time=(Get-Date -f 'HH:mm:ss'); $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Write-Host "DIRECT OK $($fi.Name) ($len bytes)" }
                else { $ex.status='limit'; Write-Host "DIRECT LIMIT $($fi.Name)" }
                Set-Active '' 'idle' 0
              }
            }
            Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null
            Write-Host "DIRECT fallback upload complete."
          }
          Write-Host "Emergency handling complete. (A 2nd Cancel force-kills immediately.)"

      - name: Secure Cleanup (wipe all data)
        if: ${{ always() }}
        run: |
          $ml=Join-Path $env:RUNNER_TEMP 'ghrdp_mirror.log'; if(Test-Path $ml){ Write-Host "----- mirror log (tail) -----"; Get-Content $ml -Tail 120 | %{Write-Host $_} }
          foreach($p in @('chrome','msedge','firefox','iexplore','brave','opera','qbittorrent')){ Get-Process -Name $p -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          foreach($p in @("$env:LOCALAPPDATA\Google\Chrome\User Data","$env:LOCALAPPDATA\Microsoft\Edge\User Data","$env:APPDATA\Mozilla\Firefox\Profiles","$env:LOCALAPPDATA\Mozilla\Firefox\Profiles","$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data","$env:APPDATA\Opera Software\Opera Stable")){ if(Test-Path $p){ try{Remove-Item -Path $p -Recurse -Force -ErrorAction Stop}catch{Start-Sleep 2;Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue} } }
          foreach($p in @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Documents")){ if(Test-Path $p){Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue} }
          if($env:RDP_USER){ foreach($s in @('Downloads','AppData\Local\Temp')){ $d="C:\Users\$($env:RDP_USER)\$s"; if(Test-Path $d){Remove-Item "$d\*" -Recurse -Force -ErrorAction SilentlyContinue} } }
          if(Test-Path 'D:\RDP-Storage'){ Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -ErrorAction SilentlyContinue }
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Microsoft\Windows\Recent\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU' -Name '*' -ErrorAction SilentlyContinue
          Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths' -ErrorAction SilentlyContinue
          Set-Clipboard -Value "" -ErrorAction SilentlyContinue; Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          wevtutil el 2>$null | %{wevtutil cl "$_" 2>$null}; $LASTEXITCODE = 0
          & "C:\Program Files\Tailscale\tailscale.exe" funnel --bg 7331 off 2>$null | Out-Null; $LASTEXITCODE=0
          & "C:\Program Files\Tailscale\tailscale.exe" serve reset 2>$null | Out-Null; $LASTEXITCODE=0
          "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY
          "VM wiped (incl D-RDP-Storage). Mirror copies (AES) + rentry index remain if mirror ON. Funnel turned off. No GitHub secrets - recoverable from script." >> $env:GITHUB_STEP_SUMMARY

      - name: Overwrite free space (skip on cancel)
        if: ${{ always() && !cancelled() }}
        run: |
          Write-Host "Overwriting free space (cipher /w)..."
          cipher /w:C:\
          $LASTEXITCODE = 0
          "Free-space overwrite complete." >> $env:GITHUB_STEP_SUMMARY
