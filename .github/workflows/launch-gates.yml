          grep -qF '"tailnetRegex"' "$pol" || { echo 'F56-d: the policy has no tailnet predicate' >&2; exit 1; }
          # Semantic, not textual: the SAME regex the lanes compile, exercised here.
          python3 - <<'PYEOF'
          import json, re
          pol = json.load(open('payloads/ghrdp-qbt-policy.json'))
          rx = re.compile(pol['tailnetRegex'])
          def ok(ip):
              return bool(rx.match(ip))
          assert ok('100.64.0.1') and ok('100.100.100.100') and ok('100.127.255.254'), 'tailnet literals rejected'
          for bad in ('100.63.255.255', '100.128.0.1', '10.0.0.1', '192.168.1.5', '8.8.8.8', '100.64.0.1evil', '::1', '*', '0.0.0.0'):
              assert not ok(bad), bad
          PYEOF
          grep -qF 'tailnet-ip-unavailable' "$qbt" || { echo 'F56-d: the bind ladder must fail closed' >&2; exit 1; }
          # Preset families + operator own URLs + the magnet refusal.
          for preset in linux-distros blender-open-movie ia-torrents; do
            grep -qF "\"$preset\"" "$pol" || { echo "F56-d: torrent preset $preset missing" >&2; exit 1; }
          done
          grep -qF 'operator-own-url' "$qbt" || { echo 'F56-d: operator own URLs are not a preset' >&2; exit 1; }
