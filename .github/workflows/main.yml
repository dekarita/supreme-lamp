              if(String(c.enc)==="true")mi("Copy decrypt command",function(){cpTxt("powershell -c \"& { $p=Read-Host 'Password'; $s=[IO.File]::ReadAllBytes($args[0]); $kdf=[Security.Cryptography.Rfc2898DeriveBytes]::new($p,$s[0..15],100000,'SHA256'); $a=[Security.Cryptography.Aes]::Create(); $a.Key=$kdf.GetBytes(32); $a.IV=$s[16..31]; $d=$a.CreateDecryptor(); $ms=[IO.MemoryStream]::new(); $cs=[Security.Cryptography.CryptoStream]::new($ms,$d,'Write'); $cs.Write($s,32,$s.Length-32); $cs.FlushFinalBlock(); [IO.File]::WriteAllBytes(($args[0] -replace '\\.ghenc$',''), $ms.ToArray()) }\" "+c.name);});
              mi("Properties",function(){alert("Name: "+c.name+"\nType: "+typeOf(c.name)+"\nSize: "+fmt(c.size)+"\nModified: "+(c.dateModified||"-")+"\nEncrypted: "+c.enc);});
