name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Desktop+Documents+Temp+D-Storage (AES-256) to gofile + telegraph. PUBLIC index. default OFF'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Download Tailscale
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"; $out = "tailscale-setup.msi"; $ok = $false
          for ($a = 1; $a -le 4; $a++) { Remove-Item $out -Force -EA 0; & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null; $LASTEXITCODE = 0; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; break }; Start-Sleep (3 * $a) }
          if (-not $ok) { for ($a = 1; $a -le 3; $a++) { try { Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; break } } catch {}; Start-Sleep (3 * $a) } }
          if (-not $ok) { throw "Could not download Tailscale MSI." }
      - name: Install Tailscale
        shell: pwsh
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'; Start-Sleep 5
      - name: Tailscale login (auto if TS_AUTHKEY, else clickable link + help links)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState) { $ok = $true; break } } catch {}; if ($i -eq 3) { Start-Service Tailscale -EA 0 }; Start-Sleep 2 }
          if (-not $ok) { throw "tailscaled not started." }
          $S = $env:GITHUB_STEP_SUMMARY
          if ($env:TS_AUTHKEY) {
            & $ts up --authkey=$env:TS_AUTHKEY --accept-dns=true 2>$null | Out-Null
            $ok = $false; for ($i = 0; $i -lt 60; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $ok = $true; break } } catch {}; Start-Sleep 2 }
            if (-not $ok) { throw "TS_AUTHKEY login failed." }
            "### Tailscale auto-logged-in via TS_AUTHKEY ✅" >> $S
          } else {
            $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"; $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process $ts -ArgumentList "up" -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru
            $url = $null
            for ($i = 0; $i -lt 90; $i++) { $t = ""; foreach ($f in @($upLog,$upErr)) { if (Test-Path $f) { try { $t += (Get-Content $f -Raw -EA 0) } catch {} } }; if ($t -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }; Start-Sleep 2 }
            if (-not $url) { throw "Tailscale sign-in link not found." }
            $keysPage = "https://login.tailscale.com/admin/settings/keys"; $secretPage = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"; $aclPage = "https://login.tailscale.com/admin/acls"
            Write-Host "TAILSCALE SIGN-IN LINK: $url"
            Write-Host "ONE-TIME: 1) $keysPage (reusable key) 2) $secretPage (TS_AUTHKEY) 3) re-run => hands-free forever"
            $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8
            "### Tailscale Sign-in (click now)" >> $S; "" >> $S; "**[$url]($url)**" >> $S; "" >> $S
            "### Hands-free next run" >> $S; "1. **[$keysPage]($keysPage)** reusable key" >> $S; "2. **[$secretPage]($secretPage)** add TS_AUTHKEY" >> $S; "3. Re-run" >> $S; "Funnel ACL manual: **[$aclPage]($aclPage)** add nodeAttrs funnel" >> $S
          }
      - name: Wait for Tailscale sign-in
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $a = $false
          for ($i = 0; $i -lt 120; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $a = $true; break } } catch {}; Start-Sleep 5 }
          if (-not $a) { throw "Tailscale sign-in timeout." }
          Write-Host "Tailscale connected. IP=$((& $ts ip -4).Trim())"
      - name: Auto-enable Funnel (optional TS_API_KEY)
        env:
          TS_KEY: ${{ secrets.TS_API_KEY }}
        shell: pwsh
        run: |
          $tok = $env:TS_KEY
          if (-not $tok) { Write-Host "TS_API_KEY not set - skipping Funnel auto-enable (Serve still works on tailnet)."; exit 0 }
          $base = 'https://api.tailscale.com/api/v2/tailnet/-/acl'; $h = @{ Authorization = "Bearer $tok"; Accept = 'application/json' }
          $txt = $null; try { $txt = (Invoke-WebRequest $base -Headers $h -UseBasicParsing -TimeoutSec 30).Content } catch { Write-Host "[acl] GET failed"; exit 0 }
          $clean = $txt -replace '/\*[\s\S]*?\*/',''; $clean = ($clean -split "`n" | ForEach-Object { $_ -replace '//[^\r\n]*','' }) -join "`n"; $clean = $clean -replace ',(\s*[\]}])','$1'
          $acl = $null; try { $acl = $clean | ConvertFrom-Json -EA Stop } catch { exit 0 }
          $na = @(); if ($acl.PSObject.Properties['nodeAttrs'] -and $acl.nodeAttrs) { $na = @($acl.nodeAttrs) }
          $has = $false; foreach ($n in $na) { if ((@($n.target) -contains '*') -and (@($n.attr) -contains 'funnel')) { $has = $true } }
          if (-not $has) { $na = $na + ,@{target=@('*');attr=@('funnel')}; if ($acl.PSObject.Properties['nodeAttrs']) { $acl.nodeAttrs = $na } else { $acl | Add-Member -NotePropertyName 'nodeAttrs' -NotePropertyValue $na -Force }; try { Invoke-WebRequest $base -Headers (@{Authorization="Bearer $tok";'Content-Type'='application/json'}) -Method Post -Body ([Text.Encoding]::UTF8.GetBytes(($acl|ConvertTo-Json -Depth 12 -Compress))) -UseBasicParsing -TimeoutSec 30 | Out-Null; Write-Host "[acl] funnel added" } catch { Write-Host "[acl] POST failed" } }
      - name: Setup tailnet web link (Serve)
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create(); $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b = [byte[]]::new(24); $rng.GetBytes($b); $dashToken = -join ($b | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
          Add-Content $env:GITHUB_ENV ("DASH_TOKEN=" + $dashToken)
          $so = Join-Path $env:RUNNER_TEMP 'serve.out'; $se = Join-Path $env:RUNNER_TEMP 'serve.err'; Remove-Item $so,$se -Force -EA 0
          try { Start-Process $ts -ArgumentList @('serve','--bg','7331') -RedirectStandardOutput $so -RedirectStandardError $se -WindowStyle Hidden | Out-Null } catch {}
          $serveUrl = ''; $dns = ''; $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) { $stj = $null; try { $j = Start-Job { param($t) & $t status --json 2>$null } -ArgumentList $ts; if (Wait-Job $j -Timeout 4) { $stj = Receive-Job $j | ConvertFrom-Json -EA 0 }; Remove-Job $j -Force -EA 0 } catch {}; if ($stj -and $stj.Self.DNSName) { $dns = $stj.Self.DNSName.TrimEnd('.'); break }; Start-Sleep 2 }
          if ($dns) { $serveUrl = "https://$dns/?key=$dashToken" }
          Add-Content $env:GITHUB_ENV ("SERVE_URL=" + $serveUrl)
          if ($serveUrl) { "**[>>> OPEN RDP WEB-APP <<<]($serveUrl)**" >> $env:GITHUB_STEP_SUMMARY } else { "_Serve not ready - use ghrdp paste link._" >> $env:GITHUB_STEP_SUMMARY }
      - name: Enable RDP + harden + open dashboard port
        shell: pwsh
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty $rdp fDenyTSConnections 0; Set-ItemProperty "$rdp\WinStations\RDP-Tcp" UserAuthentication 1; Set-ItemProperty "$rdp\WinStations\RDP-Tcp" SecurityLayer 2; Set-ItemProperty "$rdp\WinStations\RDP-Tcp" MinEncryptionLevel 3
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -EA 0
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -EA 0 | Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -EA 0
          Remove-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0; New-NetFirewallRule -DisplayName 'ghrdp-dash' -Direction Inbound -LocalPort 7331 -Protocol TCP -Action Allow -Profile Any -Enabled True -EA 0 | Out-Null
          & netsh advfirewall firewall add rule name="ghrdp-dash-netsh" dir=in action=allow protocol=TCP localport=7331 enable=yes | Out-Null; $LASTEXITCODE = 0
      - name: Create RDP account (never-throw groups; NO pre-created profile folders)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create(); $hb = [byte[]]::new(4); $rng.GetBytes($hb); $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))
          function New-SafePassword([string]$U,[int]$L){ $lo='abcdefghijkmnopqrstuvwxyz';$up='ABCDEFGHJKLMNPQRSTUVWXYZ';$di='23456789';$sp='!@^-_+~';$all=$lo+$up+$di+$sp;$b4=[byte[]]::new(4); for($a=0;$a -lt 500;$a++){ $arr=[char[]]::new($L); for($i=0;$i -lt $L;$i++){ $rng.GetBytes($b4); $arr[$i]=$all[([BitConverter]::ToUInt32($b4,0) % $all.Length)] }; $arr[0]=$lo[([BitConverter]::ToUInt32(($rng.GetBytes($b4)),0) % $lo.Length)]; $arr[1]=$up[([BitConverter]::ToUInt32(($rng.GetBytes($b4)),0) % $up.Length)]; $arr[2]=$di[([BitConverter]::ToUInt32(($rng.GetBytes($b4)),0) % $di.Length)]; $arr[3]=$sp[([BitConverter]::ToUInt32(($rng.GetBytes($b4)),0) % $sp.Length)]; $c=-join $arr; $low=$c.ToLower(); $ok=$true; $u=$U.ToLower(); for($i=0;$i -le ($u.Length-3);$i++){ if($low.Contains($u.Substring($i,3))){$ok=$false;break} }; if($ok){return $c} }; throw 'pwd gen failed' }
          $created = $false; $pass = $null
          for ($try = 0; $try -lt 6; $try++) { $pass = New-SafePassword $user (24 + $try); try { New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -EA Stop | Out-Null; $created = $true; break } catch { if ($_.ToString() -match 'InvalidPasswordException') { Write-Host "pwd rejected $try" } else { throw } } }
          if (-not $created) { throw "New-LocalUser failed." }
          # NEVER throw on group add: "already a member" == success
          foreach ($g in @('Administrators','Remote Desktop Users')) { try { Add-LocalGroupMember -Group $g -Member $user -EA SilentlyContinue } catch {} }
          if (Test-Path 'D:\') { $big = 'D:\RDP-Storage'; New-Item -ItemType Directory $big -Force | Out-Null; & icacls $big /grant "${user}:(OI)(CI)F" 2>$null | Out-Null; $LASTEXITCODE = 0; $ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk"); $sc.TargetPath = $big; $sc.Save() }
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"; Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"
          Write-Host "Created account: $user (profile created at first logon - NOT pre-created)"
      - name: Show RDP credentials
        shell: pwsh
        run: |
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim(); $u = $env:RDP_USER; $p = $env:RDP_PASS
          $ghrdp = "ghrdp://$ip/" + [uri]::EscapeDataString($u) + "/" + [uri]::EscapeDataString($p)
          Add-Content $env:GITHUB_ENV ("GHRDP_NOW=" + $ghrdp)
          Write-Host "RDP IP=$ip USER=$u PASS=$p"; if ($env:SERVE_URL) { Write-Host "WEBAPP: $($env:SERVE_URL)" }; Write-Host "PASTE: $ghrdp"
      - name: Write mirror lib (gofile NEW endpoint + 4 fallbacks + telegraph index)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'LIBEOF'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ErrorActionPreference = 'SilentlyContinue'
          function Read-Cfg { $b = [IO.File]::ReadAllBytes($env:GHRDP_CFG); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length-1)] }; return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json) }
          function Save-Cfg($c) { [IO.File]::WriteAllText($c.cfgPath, ($c | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false)) }
          function B64U($s) { $x = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($s)); return $x.Replace('+','-').Replace('/','_').TrimEnd('=') }
          $global:GHRDP_PROG = @{ ts=''; alive=$true; active=@{name='';phase='idle';bytesDone=0;bytesTotal=0;pct=0;speedBps=0}; agg=@{done=0;active=0;failed=0;tracked=0;bytesDone=0;bytesTotal=0;overallPct=0;speedBps=0}; files=@(); log=@(); scan=@{} }
          $global:GHRDP_PROG_PATH=$null; $global:GHRDP_LASTFLUSH=0; $global:GHRDP_DONE_BYTES=0; $global:GHRDP_TOTAL_BYTES=0; $global:GHRDP_SP=@{t=0;b=0}; $global:GHRDP_SP_A=@{t=0;b=0}
          function Init-Progress($p){ $global:GHRDP_PROG_PATH=$p; $n=[datetime]::Now.Ticks; $global:GHRDP_SP=@{t=$n;b=0}; $global:GHRDP_SP_A=@{t=$n;b=0} }
          function Set-Active($n,$ph,$t){ $a=$global:GHRDP_PROG.active; $a.name=$n; $a.phase=$ph; $a.bytesDone=0; $a.bytesTotal=[long]$t; $a.pct=0; $a.speedBps=0; $global:GHRDP_SP_A=@{t=[datetime]::Now.Ticks;b=0} }
          function Tick-Bytes($n){ $p=$global:GHRDP_PROG; $p.active.bytesDone += [long]$n; $now=[datetime]::Now.Ticks; if(($now-$global:GHRDP_LASTFLUSH) -gt 2000000){ Flush-Progress $false } }
          function Flush-Progress($force){ $now=[datetime]::Now.Ticks; if(-not $force -and ($now-$global:GHRDP_LASTFLUSH) -lt 2000000){ return }; $global:GHRDP_LASTFLUSH=$now; $p=$global:GHRDP_PROG; $p.ts=[datetime]::Now.ToString('o'); $comp=$global:GHRDP_DONE_BYTES + $(if($p.active.phase -eq 'upload'){$p.active.bytesDone}else{0}); $dt=($now-$global:GHRDP_SP.t)/1e7; if($dt -gt 0.5){ $p.agg.speedBps=[math]::Max(0,[math]::Round(($comp-$global:GHRDP_SP.b)/$dt)); $global:GHRDP_SP=@{t=$now;b=$comp} }; if($p.active.bytesTotal -gt 0){ $p.active.pct=[math]::Round(100.0*$p.active.bytesDone/$p.active.bytesTotal,1) }else{ $p.active.pct=0 }; $p.agg.bytesDone=$comp; if($p.agg.bytesTotal -gt 0){ $p.agg.overallPct=[math]::Round(100.0*$comp/$p.agg.bytesTotal,1) }else{ $p.agg.overallPct=0 }; if($global:GHRDP_PROG_PATH){ try{ $t=$global:GHRDP_PROG_PATH+'.tmp'; [IO.File]::WriteAllText($t,($p|ConvertTo-Json -Depth 6 -Compress),(New-Object System.Text.UTF8Encoding $false)); [IO.File]::Move($t,$global:GHRDP_PROG_PATH,$true) }catch{} } }
          function Encrypt-File($in,$out,$pw){ $a=[Security.Cryptography.Aes]::Create(); $a.KeySize=256; $a.Mode='CBC'; $a.Padding='PKCS7'; $salt=[byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt); $a.IV=[byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($a.IV); $k=New-Object Security.Cryptography.Rfc2898DeriveBytes($pw,$salt,100000,[Security.Cryptography.HashAlgorithmName]::SHA256); $a.Key=$k.GetBytes(32); $of=[IO.File]::Create($out); $of.Write($salt,0,16); $of.Write($a.IV,0,16); $cs=New-Object Security.Cryptography.CryptoStream($of,$a.CreateEncryptor(),[Security.Cryptography.CryptoStreamMode]::Write); $inf=[IO.File]::Open($in,'Open','Read','ReadWrite'); $buf=New-Object byte[] 65536; $r=1; while($r -gt 0){ $r=$inf.Read($buf,0,$buf.Length); if($r -gt 0){ $cs.Write($buf,0,$r); Tick-Bytes $r } }; $inf.Close(); $cs.Close(); $of.Close(); $a.Clear() }
          function Upload-Gofile-Streamed($enc,$disp){
            $eps = @('https://upload.gofile.io/uploadfile','https://store1.gofile.io/contents/uploadfile','https://store-na-phx.gofile.io/contents/uploadfile','https://store-eu-par.gofile.io/contents/uploadfile','https://store-ap-sgp.gofile.io/contents/uploadfile')
            for ($a = 1; $a -le 4; $a++) {
              foreach ($ep in $eps) {
                try {
                  $raw = & curl.exe -sS --max-time 1800 -X POST $ep -F "file=@$enc;filename=$disp" 2>$null
                  $uj = $raw | ConvertFrom-Json -EA Stop
                  if ($uj.status -eq 'ok') { if ($uj.data.downloadPage) { return $uj.data.downloadPage }; if ($uj.data.code) { return "https://gofile.io/d/$($uj.data.code)" }; if ($uj.data.id) { return "https://gofile.io/d/$($uj.data.id)" } }
                  "gofile $ep a$a status=$($uj.status)" | Out-File $env:GHRDP_LOG -Append
                } catch { "gofile $ep a$a err $_" | Out-File $env:GHRDP_LOG -Append }
              }
              $LASTEXITCODE = 0; Start-Sleep (5 * $a)
            }
            return $null
          }
          function Load-Index($c){ if(Test-Path $c.idxFile){ try{ return [Collections.ArrayList]@(Get-Content $c.idxFile -Raw|ConvertFrom-Json -EA Stop) }catch{} }; return (New-Object Collections.ArrayList) }
          function Save-Index($c,$i){ [IO.File]::WriteAllText($c.idxFile,($i|ConvertTo-Json -Depth 5),(New-Object System.Text.UTF8Encoding $false)) }
          function Build-IndexText($c,$i){ $L=New-Object Collections.ArrayList; [void]$L.Add('# GitHub RDP - mirrored files'); [void]$L.Add('Decrypt password: '+$c.decPw); if($i.Count -eq 0){[void]$L.Add('_(no files yet)_')}; $n=1; foreach($it in $i){ $line="$n. $($it.name) [$($it.status)] ($($it.src))"; if($it.gofile){ $line+=' -> '+$it.gofile }; [void]$L.Add($line); $n++ }; return ($L -join "`r`n") }
          function Build-IndexNodes($text){ $nodes=New-Object Collections.ArrayList; foreach($ln in ($text -split "`r?`n")){ if($ln -match '^\s*$'){continue}; if($ln -match '^#\s*(.*)$'){[void]$nodes.Add(@{tag='h3';children=@($Matches[1])})}else{[void]$nodes.Add(@{tag='p';children=@($ln)})} }; return ($nodes|ConvertTo-Json -Depth 8 -Compress) }
          function Push-Index($c,$text){ $title='GitHub RDP - mirrored files'; if(-not $c.telegraphToken){ try{ $acc=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createAccount' -Body @{short_name='ghrdp';author_name='ghrdp'} -TimeoutSec 30; if($acc.ok){$c.telegraphToken=$acc.result.access_token} }catch{ return $false } }; if(-not $c.telegraphToken){ return $false }; try{ if(-not $c.telegraphPath){ $pg=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createPage' -Body @{access_token=$c.telegraphToken;title=$title;content=$text;return_content='false'} -TimeoutSec 30; if($pg.ok){$c.telegraphPath=$pg.result.path;$c.rentryUrl=$pg.result.url} } else { $pg=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/editPage' -Body @{access_token=$c.telegraphToken;path=$c.telegraphPath;title=$title;content=$text;return_content='false'} -TimeoutSec 30; if($pg.ok){$c.rentryUrl=$pg.result.url} } }catch{ return $false }; Save-Cfg $c; return [bool]$c.rentryUrl }
          LIBEOF
      - name: Write dashboard server (no gate + self-heal friendly)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'SERVEREOF'
          function Start-GhrdpServer {
            param([int]$Port,[string]$BindAddress,[string]$UiDir,[string]$ProgressPath,[string]$CfgPath,[string]$EmergencyFlagPath,[string]$FlushFlagPath,[string]$OkFile,[int]$LimitMinutes=330)
            $ErrorActionPreference='SilentlyContinue'
            $uiPath=Join-Path $UiDir 'ghrdp-ui.html'
            $uiBytes=if(Test-Path $uiPath){[IO.File]::ReadAllBytes($uiPath)}else{[Text.Encoding]::UTF8.GetBytes('<h1>ui missing</h1>')}
            function ReadJsonSafe($p,[ref]$e){ if(-not (Test-Path $p)){$e.Value='file-missing';return $null}; try{ $fs=[IO.File]::Open($p,'Open','Read','ReadWrite'); $ms=New-Object IO.MemoryStream; $fs.CopyTo($ms); $fs.Close(); $b=$ms.ToArray(); $ms.Close(); if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){$b=$b[3..($b.Length-1)]}; return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF))|ConvertFrom-Json -EA Stop) }catch{ $e.Value=('parse: '+$_.Exception.Message); return $null } }
            function WriteResp($s,$code,$ct,$bb){ $st=if($code -eq 200){'OK'}else{'ERR'}; $h="HTTP/1.1 $code $st`r`nContent-Type: $ct`r`nContent-Length: $($bb.Length)`r`nConnection: close`r`nCache-Control: no-store`r`nAccess-Control-Allow-Origin: *`r`n`r`n"; $hb=[Text.Encoding]::ASCII.GetBytes($h); $s.Write($hb,0,$hb.Length); if($bb.Length -gt 0){$s.Write($bb,0,$bb.Length)}; $s.Flush() }
            $ipObj=[Net.IPAddress]::Parse($BindAddress); $listener=New-Object Net.Sockets.TcpListener $ipObj,([int]$Port)
            try{ $listener.Start() }catch{ Set-Content $OkFile ("LISTEN_FAIL $_") -Encoding ascii; throw }
            Set-Content $OkFile "LISTENING" -Encoding ascii
            $start=Get-Date; $limit=(New-TimeSpan -Minutes $LimitMinutes)
            while(((Get-Date)-$start) -lt $limit){
              if(Test-Path $FlushFlagPath){ Remove-Item $FlushFlagPath -Force -EA 0 }
              while($listener.Pending()){ $c=$null; try{$c=$listener.AcceptTcpClient()}catch{}; if($c){ try{ $stream=$c.GetStream(); $stream.ReadTimeout=5000; $acc=New-Object Text.StringBuilder; $buf=New-Object byte[] 4096; while($true){ $n=0; try{$n=$stream.Read($buf,0,$buf.Length)}catch{break}; if($n -le 0){break}; [void]$acc.Append([Text.Encoding]::ASCII.GetString($buf,0,$n)); if($acc.ToString().Contains("`r`n`r`n")){break}; if($acc.Length -gt 16384){break} }; $req=$acc.ToString(); $path='/'; if($req -match '(?m)^GET\s+(\S+)'){ $path=($Matches[1] -split '\?')[0] }; $loop=$false; try{$loop=$c.Client.RemoteEndPoint.Address.IsLoopback}catch{}; $cfgErr=[ref]''; $cfg=ReadJsonSafe $CfgPath $cfgErr; if($path -eq '/emergency'){ Set-Content $EmergencyFlagPath (Get-Date -f o) -Encoding ascii; WriteResp $stream 200 'application/json' ([Text.Encoding]::UTF8.GetBytes('{"ok":true}')) } elseif($path -eq '/progress'){ $pe=[ref]''; $prog=ReadJsonSafe $ProgressPath $pe; if(-not $prog){$prog=@{alive=$false}}; $obj=@{ts=(Get-Date -f o);viaLoopback=$loop;mirror=$(if($cfg){[bool]$cfg.mirror}else{$false});ghrdp=$(if($cfg){$cfg.ghrdp}else{''});rentry=$(if($cfg){$cfg.rentryUrl}else{''});creds=@{ip=$(if($cfg){$cfg.rdpIp}else{''});user=$(if($cfg){$cfg.rdpUser}else{''});pass=$(if($cfg){$cfg.rdpPass}else{''})};ts=$prog.ts;alive=$prog.alive;active=$prog.active;agg=$prog.agg;files=$prog.files;scan=$prog.scan;log=$prog.log}; WriteResp $stream 200 'application/json' ([Text.Encoding]::UTF8.GetBytes(($obj|ConvertTo-Json -Depth 8 -Compress))) } else { $html=[Text.Encoding]::UTF8.GetString($uiBytes); $st=if($loop){'0'}else{'1'}; $html=$html.Replace('__STATIC__',$st).Replace('__IP__',$(if($cfg){[string]$cfg.rdpIp}else{''})).Replace('__USER__',$(if($cfg){[string]$cfg.rdpUser}else{''})).Replace('__PASS__',$(if($cfg){[string]$cfg.rdpPass}else{''})).Replace('__GHRDP__',$(if($cfg){[string]$cfg.ghrdp}else{''})); WriteResp $stream 200 'text/html; charset=utf-8' ([Text.Encoding]::UTF8.GetBytes($html)) } }catch{}; try{$c.Close()}catch{} } }
              Start-Sleep -Milliseconds 200
            }
            try{$listener.Stop()}catch{}
          }
