          <style>
          :root{--bg:#080b10;--panel:#10161d;--panel2:#0c1117;--line:#1f2b35;--line2:#2a3a47;--ink:#eef3f7;--mut:#8298a6;--teal:#34d3b6;--teal-d:#0d3a32;--amber:#f4ad3c;--amber-d:#3a2c0e;--red:#ef5d45;--red-d:#3a1712;--green:#43d98f;--violet:#9b8cff;--mono:'JetBrains Mono',ui-monospace,monospace;--disp:'Space Grotesk',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif}
          *{box-sizing:border-box;margin:0;padding:0}
          html,body{height:100%}
          body{font-family:var(--body);color:var(--ink);min-height:100vh;padding:22px 18px 60px;position:relative;overflow-x:hidden;background:radial-gradient(1100px 600px at 8% -10%,rgba(52,211,182,.10),transparent 60%),radial-gradient(900px 700px at 102% 8%,rgba(244,173,60,.07),transparent 55%),radial-gradient(800px 800px at 50% 120%,rgba(155,140,255,.06),transparent 60%),linear-gradient(rgba(255,255,255,.020) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.020) 1px,transparent 1px),var(--bg);background-size:auto,auto,auto,30px 30px,30px 30px,auto}
          body::before{content:"";position:fixed;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--red),var(--violet));opacity:.9;z-index:50}
