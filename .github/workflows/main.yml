name: Windows RDP - Tailscale Mission Control (6h ephemeral)
on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: 'Runner: windows-latest = US Azure (fast DL, ~260ms RDP) | self-hosted-windows-near = your nearby runner (10-60ms RDP)'
        type: choice
        options:
          - windows-latest
          - self-hosted-windows-near
        default: windows-latest
      encrypt_mode:
        description: 'none = upload original files unencrypted (streamable on gofile); media-plain = video/audio plain, rest AES-256; all = encrypt everything (.ghenc suffix)'
        type: choice
        options:
          - none
          - media-plain
          - all
        default: none

permissions:
  contents: write   # push docs/search.html from the watcher
  pages: write      # enable/configure GitHub Pages via API
  id-token: write   # optional, harmless; needed only if you later use OIDC

jobs:
  rdp:
    runs-on: ${{ github.event.inputs.runner_target || 'windows-latest' }}
    timeout-minutes: 357
    env:
      GHRDP_EPHEMERAL: 'true'
      ENCRYPT_MODE: ${{ github.event.inputs.encrypt_mode || 'none' }}
      RENTRY_MAIN_URL: 'https://rentry.co/myurl0'
      RENTRY_MAIN_EDIT: ''
      RUN_STARTED_AT: ${{ github.run_started_at || '' }}
      # [F9b] opt-in MagicDNS auto-enable: empty unless the user sets both
      # secrets; the gates then POST /dns/preferences before halting.
      TS_API_TOKEN: ${{ secrets.TS_API_TOKEN }}
      TS_TAILNET_NAME: ${{ secrets.TS_TAILNET_NAME }}

    steps:
      - name: Checkout repo (payloads)
        uses: actions/checkout@v4

      - name: Record job start time
        shell: pwsh
        run: |
          $startedAt = (Get-Date).ToUniversalTime().ToString('o')
          Add-Content -Path $env:GITHUB_ENV -Value ("JOB_STARTED_AT=" + $startedAt)
          Write-Host ('[init] job started at ' + $startedAt)
          exit 0

      - name: Auto-deploy Web UI, Worker, and Status Logic (Zero-Touch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Publish-GitHubFile {
              param([string]$RelPath, [string]$Content, [string]$Msg)
              $repo = $env:GITHUB_REPOSITORY
              $api = "https://api.github.com/repos/$repo/contents/$RelPath"
              $H = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'ghrdp-runner' }
              $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($Content))
              $sha = $null
              try { $g = Invoke-RestMethod -Uri ($api + '?ref=main') -Headers $H -ErrorAction Stop; $sha = $g.sha } catch { }
              # [F10-4c §5] skip the Pages-affecting PUT entirely when the
              # remote docs content is byte-identical (no commit => no Pages
              # rebuild for unchanged docs).
              if ($sha -and $g.PSObject.Properties['content']) {
                  try {
                      $remote = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($g.content -replace "`n",'')))
                      if ($remote -eq $Content) { Write-Host "[deploy] Unchanged ${RelPath} - skipped (no Pages redeploy)"; return }
                  } catch { }
              }
              $body = @{ message = ($Msg + ' ' + (Get-Date -Format o)); content = $b64; branch = 'main' }
              if ($sha) { $body.sha = $sha }
              try {
                  Invoke-RestMethod -Uri $api -Headers $H -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null
                  Write-Host "[deploy] Committed $RelPath"
              } catch { Write-Host "[deploy] Failed to commit ${RelPath}: $($_.Exception.Message)" }
          }
          $statusObj = [ordered]@{
              ts = (Get-Date -Format o)
              runId = [string]$env:GITHUB_RUN_ID
              runUrl = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
              runStatus = 'in_progress'
              startedAt = (Get-Date -Format o)
              sessionStartedAt = ''
              watcherAlive = $false
              speedBps = 0
              overallPct = 0.0
              filesDone = 0
              filesTotal = 0
              missionControlUrl = ''
              tailnetUrl = ''
              rustUrl = ''
              funnelUrl = ''
              mirrorKey = ''
              legacyKey = ''
              telegraphUrl = ''
              rentryNewUrl = ''
              egressIp = ''
              encryptMode = 'none'
              files = @()
              logTail = @()
              history = @()
              runnerIp = ''
              epoch = (Get-Date).ToUniversalTime().ToString('o')
              serverPort = 7331
          }
          Publish-GitHubFile -RelPath 'docs/status.json' -Content ($statusObj | ConvertTo-Json -Depth 20 -Compress) -Msg 'chore: initial status.json [skip ci]'
          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine('function Publish-StatusToGhPages {')
          [void]$sb.AppendLine('    param([string]$JsonText)')
          [void]$sb.AppendLine('    $repo = $env:GITHUB_REPOSITORY')
          [void]$sb.AppendLine('    $token = ""')
          [void]$sb.AppendLine('    try { $token = ([System.IO.File]::ReadAllText("C:\ghrdp\gh-pages-token.txt")).Trim() } catch { }')
          [void]$sb.AppendLine('    if (-not $token) { try { $token = [string]$env:GITHUB_TOKEN } catch { } }')
          [void]$sb.AppendLine('    if (-not $token) { return }')
          [void]$sb.AppendLine('    $api = "https://api.github.com/repos/$repo/contents/docs/status.json"')
          [void]$sb.AppendLine('    $H = @{ Authorization = ("Bearer " + $token); Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28"; "User-Agent" = "ghrdp-runner" }')
          [void]$sb.AppendLine('    $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($JsonText))')
          [void]$sb.AppendLine('    $sha = $null')
          [void]$sb.AppendLine('    try { $g = Invoke-RestMethod -Uri ($api + "?ref=main") -Headers $H -ErrorAction Stop; $sha = $g.sha } catch { }')
          [void]$sb.AppendLine('    $body = @{ message = ("status update " + (Get-Date -Format o)); content = $b64; branch = "main" }')
          [void]$sb.AppendLine('    if ($sha) { $body.sha = $sha }')
          [void]$sb.AppendLine('    for ($attempt = 1; $attempt -le 3; $attempt++) {')
          [void]$sb.AppendLine('        try {')
          [void]$sb.AppendLine('            Invoke-RestMethod -Uri $api -Headers $H -Method Put -ContentType "application/json" -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null')
          [void]$sb.AppendLine('            return')
          [void]$sb.AppendLine('        } catch {')
          [void]$sb.AppendLine('            if ($attempt -lt 3) { Start-Sleep -Seconds (2 * $attempt) }')
          [void]$sb.AppendLine('        }')
          [void]$sb.AppendLine('    }')
          [void]$sb.AppendLine('}')
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'publish-status.ps1'), $sb.ToString(), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host '[deploy] publish-status.ps1 helper saved to RUNNER_TEMP'
          Write-Host '[deploy] auto-deploy complete'
          exit 0

      # [F10-4c §5] setup-phase caches: TightVNC MSI, noVNC tree, pip wheel
      # cache (websockify/vncdotool), cargo target (Rust dash). Keep-alive is
      # untouched. One composite key; Cargo.toml changes bust the whole set by
      # design (simple, conservative). First run warms the caches; subsequent
      # dispatches skip ~1-2 min of downloads/compiles.
      - uses: actions/cache@v4
        name: Setup-phase caches (F10-4c)
        with:
          path: |
            C:\ghrdp\cache
            C:\ghrdp\novnc
            ~\AppData\Local\pip\Cache
            ${{ runner.temp }}\ghrdp-rust\target
          key: f10-setup-${{ runner.os }}-${{ hashFiles('payloads/Cargo.toml') }}-v1
          restore-keys: |
            f10-setup-${{ runner.os }}-
      - name: Pre-create cache directories (F10-4c)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'C:\ghrdp\cache' -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\ghrdp\novnc' -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\pip\Cache" -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'ghrdp-rust\target') -Force | Out-Null
          Write-Host '[cache] setup-phase cache dirs ensured'
      - name: Validate required secret (RENTRY_EDIT_PASSWORD) - fail fast, NO bypass
        env:
          RENTRY_EDIT_PASSWORD: ${{ secrets.RENTRY_EDIT_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $mirrorOn = ($env:MIRROR_INPUT -eq 'true')
          $secret = [string]$env:RENTRY_EDIT_PASSWORD
          $link = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/settings/secrets/actions/new'
          if ($mirrorOn -and -not $secret) {
              Write-Host '============================================================'
              Write-Host '  MISSING REQUIRED SECRET: RENTRY_EDIT_PASSWORD'
              Write-Host ('  Add it here: ' + $link)
              Write-Host '    Name  : RENTRY_EDIT_PASSWORD'
              Write-Host '    Value : the edit code of https://rentry.co/myurl0'
              Write-Host '  Mirror is ENABLED but the secret is missing.'
              Write-Host '  NO BYPASS: refusing to publish Rentry anonymously. Failing now.'
              Write-Host '============================================================'
              Write-Host '[validate] RENTRY_EDIT_PASSWORD not set - OK (myurl0 is frozen; github.io is the primary index).'
          }
          if (-not $mirrorOn) {
              Write-Host '[validate] mirror is OFF this run - RENTRY_EDIT_PASSWORD not required.'
          } else {
              Write-Host '[validate] RENTRY_EDIT_PASSWORD present - myurl0 will be edited with it (append-only, no bypass).'
          }
          exit 0

      - name: Download Tailscale installer (curl retries, IWR fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          $out = 'tailscale-setup.msi'
          $ok = $false
          for ($a = 1; $a -le 4; $a++) {
              Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
              & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null
              $LASTEXITCODE = 0
              if ((Test-Path $out) -and ((Get-Item $out).Length -gt 1000000)) {
                  $ok = $true
                  Write-Host ('[ts] downloaded via curl, attempt {0}, size={1}' -f $a, (Get-Item $out).Length)
                  break
              }
              Write-Host ('[ts] curl attempt {0} failed; retrying' -f $a)
              Start-Sleep -Seconds (3 * $a)
          }
          if (-not $ok) {
              for ($a = 1; $a -le 3; $a++) {
                  try {
                      Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 300 -ErrorAction Stop
                      if ((Test-Path $out) -and ((Get-Item $out).Length -gt 1000000)) {
                          $ok = $true
                          Write-Host ('[ts] downloaded via Invoke-WebRequest, attempt {0}' -f $a)
                          break
                      }
                  } catch {
                      Write-Host ('[ts] Invoke-WebRequest attempt {0} failed: {1}' -f $a, $_.Exception.Message)
                  }
                  Start-Sleep -Seconds (3 * $a)
              }
          }
          if (-not $ok) { throw 'Could not download the Tailscale MSI after retries. Re-run the workflow.' }
          exit 0

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'tailscale-setup.msi', '/quiet', '/norestart'
          Start-Sleep -Seconds 5
          Write-Host '[ts] Tailscale MSI install finished'
          exit 0

      # [F9k] Fail-closed secrets framework. TS_AUTHKEY is REQUIRED: a missing
      # or rejected key HALTS the run here with a clickable admin-keys link and
      # numbered fix steps (::error:: + step summary + config.json tsReason).
      # There is NO interactive sign-in fallback anymore - the old silent
      # 'no sign-in link' throw is replaced by a classified, actionable halt.
      # The raw key is never printed: every emitted line passes the redactor.
      - name: Tailscale up (TS_AUTHKEY fail-closed, halt-with-link)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $S = $env:GITHUB_STEP_SUMMARY
          $keysUrl = 'https://login.tailscale.com/admin/settings/keys'
          # [F9k] Redactor: strips the injected secret VALUE(s) plus any
          # tskey-*/ghp_*/github_pat_* token shape from every printed line.
          function ConvertTo-Redacted([string]$Text) {
              $t = [string]$Text
              foreach ($v in @($env:TS_AUTHKEY, $env:VNC_PASS)) {
                  if ($v -and $v.Length -ge 4) { $t = $t.Replace($v, '<redacted>') }
              }
              $t = [regex]::Replace($t, 'tskey-[A-Za-z0-9][A-Za-z0-9\-]*', 'tskey-<redacted>')
              $t = [regex]::Replace($t, '(ghp_[A-Za-z0-9]{8,}|github_pat_[A-Za-z0-9_]{8,})', '<redacted>')
              return $t
          }
          # [F9k] Generic halt helper (reusable for TS_AUTHKEY / VNC_PASS /
          # TS_API_TOKEN): writes '::error::', a step-summary card with a
          # CLICKABLE admin link + numbered fix steps (+ optional redacted log
          # tail), stamps config.json tsReason/tsAuthAdminUrl, then throws.
          function Emit-SecretHalt([string]$What, [string]$AdminUrl, [string]$Reason, [string[]]$Steps, [string]$Detail = '') {
              Write-Host (ConvertTo-Redacted ('::error::' + $What + ' - ' + $Reason + '. Fix: ' + $AdminUrl))
              $md = @('### ' + $What + ' - halted by design', '', '**[' + $AdminUrl + '](' + $AdminUrl + ')**', '')
              for ($si = 0; $si -lt $Steps.Count; $si++) { $md += ((($si + 1) -as [string]) + '. ' + $Steps[$si]) }
              if ($Detail) { $md += @('', '```text', $Detail, '```') }
              foreach ($line in $md) {
                  $line = ConvertTo-Redacted $line
                  Write-Host ('[halt] ' + $line)
                  if ($S) { $line | Add-Content -Path $S }
              }
              try {
                  $cfgPathH = 'C:\ghrdp\config.json'
                  $encH = New-Object System.Text.UTF8Encoding($false)
                  $cfgH = $null
                  if (Test-Path -LiteralPath $cfgPathH) {
                      $cfgH = [System.IO.File]::ReadAllText($cfgPathH) | ConvertFrom-Json
                  } else {
                      New-Item -ItemType Directory -Path 'C:\ghrdp' -Force | Out-Null
                      $cfgH = [pscustomobject]@{}
                  }
                  $cfgH | Add-Member -NotePropertyName tsReason -NotePropertyValue $Reason -Force
                  $cfgH | Add-Member -NotePropertyName tsAuthAdminUrl -NotePropertyValue $AdminUrl -Force
                  [System.IO.File]::WriteAllText($cfgPathH, ($cfgH | ConvertTo-Json -Depth 10), $encH)
              } catch { Write-Host ('[halt] config.json stamp failed: ' + $_.Exception.Message) }
              throw (ConvertTo-Redacted ($What + ' (' + $Reason + ') - halted by design. Open ' + $AdminUrl))
          }

          $daemonOk = $false
          for ($i = 0; $i -lt 30; $i++) {
              try {
                  $j = (& $ts status --json 2>$null) | ConvertFrom-Json -ErrorAction Stop
                  if ($j -and $j.BackendState) { $daemonOk = $true; break }
              } catch { }
              if ($i -eq 3) { Start-Service Tailscale -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds 2
          }
          if (-not $daemonOk) { throw 'tailscaled did not start; check the Tailscale install step.' }
          $hostname = 'ghrdp-' + ([guid]::NewGuid().ToString('N').Substring(0, 6))

          # One fixed, numbered regeneration procedure reused by every halt
          # below (missing / invalid / ratelimited / unknown).
          $authSteps = @(
              ('Open the Tailscale admin keys page (link above): ' + $keysUrl)
              'Click "Generate auth key" with Reusable = ON and Expiry = 90 days'
              'Copy the generated tskey-auth-... value'
              'Set repo secret TS_AUTHKEY to that value (GitHub repo -> Settings -> Secrets and variables -> Actions: https://github.com/dekarita/supreme-lamp/settings/secrets/actions)'
              'Re-dispatch this workflow (Actions -> Windows RDP -> Run workflow)'
          )

          # [F9k] Missing key = halt by design. No interactive fallback.
          if (-not $env:TS_AUTHKEY) {
              Emit-SecretHalt 'TS_AUTHKEY missing' $keysUrl 'ts-authkey-missing' $authSteps
          }

          Write-Host '[ts] TS_AUTHKEY secret found - attempting automatic login (key value is never printed)'
          $upLog = Join-Path $env:RUNNER_TEMP 'ts-up.log'
          $upErr = Join-Path $env:RUNNER_TEMP 'ts-up.err'
          $ok = $false
          for ($attempt = 1; $attempt -le 2 -and -not $ok; $attempt++) {
              Remove-Item $upLog, $upErr -Force -ErrorAction SilentlyContinue
              Start-Process -FilePath $ts -ArgumentList @('up', ('--authkey=' + $env:TS_AUTHKEY), '--accept-dns=true', ('--hostname=' + $hostname)) -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden | Out-Null
              $fatalHit = $false
              # Poll status --json <= 90 s for Running; break EARLY on a fatal
              # authkey rejection (no need to burn the full window).
              for ($i = 0; $i -lt 45; $i++) {
                  try {
                      $j = (& $ts status --json 2>$null) | ConvertFrom-Json -ErrorAction Stop
                      if ($j -and ($j.BackendState -eq 'Running')) { $ok = $true; break }
                  } catch { }
                  $allNow = ''
                  try { if (Test-Path -LiteralPath $upErr) { $allNow += [System.IO.File]::ReadAllText($upErr) } } catch { }
                  try { if (Test-Path -LiteralPath $upLog) { $allNow += "`n" + [System.IO.File]::ReadAllText($upLog) } } catch { }
                  if ($allNow -match 'invalid|expired|revoked|not a valid|unauthorized|forbidden|already been used|consumed') { $fatalHit = $true; break }
                  Start-Sleep -Seconds 2
              }
              if ($ok -or $fatalHit) { break }
              # ONE retry, after 10 s, for transient control-plane errors only.
              $transientNow = ''
              try { if (Test-Path -LiteralPath $upErr) { $transientNow = [System.IO.File]::ReadAllText($upErr) } } catch { }
              if ($attempt -eq 1 -and $transientNow -match 'timeout|timed out|temporar|unavailable|connection (refused|reset)|EOF|50[0-9]|try again') {
                  Write-Host '[ts] transient control-plane error - retrying once after 10 s'
                  Start-Sleep -Seconds 10
              } else { break }
          }
          if ($ok) {
              Write-Host '[ts] auto-login OK via TS_AUTHKEY'
              if ($S) { '### Tailscale: auto-logged-in via TS_AUTHKEY' | Add-Content -Path $S }
              exit 0
          }

          # Failure: read the last 25 lines of the PAIRED logs, redact, then
          # classify per F9k before halting with the same 5 fix steps.
          $tail = @()
          foreach ($f in @($upLog, $upErr)) {
              try { if (Test-Path -LiteralPath $f) { $tail += ([System.IO.File]::ReadAllText($f) -split "`r?`n") } } catch { }
          }
          $tail = @($tail | Where-Object { $_ } | Select-Object -Last 25 | ForEach-Object { ConvertTo-Redacted $_ })
          $tailText = ($tail -join "`n")
          Write-Host '[ts] tailscale up failed - last 25 log lines (redacted):'
          foreach ($l in $tail) { Write-Host ('[ts]   ' + $l) }
          $reason = 'ts-authkey-unknown'
          if ($tailText -match 'invalid|expired|revoked|not a valid') { $reason = 'ts-authkey-invalid' }
          elseif ($tailText -match 'rate|limit') { $reason = 'ts-authkey-ratelimited' }
          if ($reason -eq 'ts-authkey-unknown' -and -not $tailText) { Write-Host '[ts] note: tailscale up produced no log output; treating as unclassified failure.' }
          Emit-SecretHalt 'TS_AUTHKEY login failed' $keysUrl $reason $authSteps $tailText

      - name: Wait for Tailscale connected
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $authed = $false
          for ($i = 0; $i -lt 180; $i++) {
              try {
                  $j = (& $ts status --json 2>$null) | ConvertFrom-Json -ErrorAction Stop
                  if ($j -and ($j.BackendState -eq 'Running')) { $authed = $true; break }
              } catch { }
              Start-Sleep -Seconds 5
          }
          if (-not $authed) { throw 'Tailscale sign-in timeout (15 min).' }
          $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim()
          $LASTEXITCODE = 0
          Write-Host ('[ts] connected. Tailscale IP = ' + $ip)
          $dnsName = ''
          try { $dnsName = ([string]$j.Self.DNSName).TrimEnd('.') } catch { }
          # [F9b] opt-in auto-enable: only when BOTH TS_API_TOKEN and
          # TS_TAILNET_NAME are set. The token travels in the Authorization
          # header only and is never printed. Secrets absent -> silent skip.
          if ($dnsName -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$' -and $env:TS_API_TOKEN -and $env:TS_TAILNET_NAME) {
              $null = & curl.exe -sS --fail -X POST ('https://api.tailscale.com/api/v2/tailnet/' + $env:TS_TAILNET_NAME + '/dns/preferences') -H ('Authorization: Bearer ' + $env:TS_API_TOKEN) -H 'Content-Type: application/json' -d '{"magicDNSEnabled":true}' --max-time 30 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host '[ts] F9b: opt-in MagicDNS auto-enable POST accepted' } else { Write-Host ('[ts] F9b: MagicDNS auto-enable API call failed (curl exit ' + $LASTEXITCODE + ') - check TS_API_TOKEN scope; token never printed') }
              $LASTEXITCODE = 0
              Start-Sleep -Seconds 5
              try { $j = (& $ts status --json 2>$null) | ConvertFrom-Json; $dnsName = ([string]$j.Self.DNSName).TrimEnd('.'); $LASTEXITCODE = 0 } catch { }
          }
          # [F9a] MagicDNS OFF = halt by design. Before throwing, the step
          # summary gets the clickable admin link, the log echoes the same
          # lines, and the thrown message repeats the URL. Never continues.
          if ($dnsName -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              $f9a = @(
                  '### MagicDNS is OFF - workflow halted by design'
                  '[Enable MagicDNS now (Tailscale admin -> DNS)](https://login.tailscale.com/admin/dns)'
                  'Toggle MagicDNS ON, Save, then re-run this workflow. Runs stay halted until enabled.'
              )
              Write-Host '[ts] FATAL: MagicDNS is OFF (Self.DNSName empty or not *.ts.net). One-click fix: https://login.tailscale.com/admin/dns -> toggle MagicDNS ON, Save, then re-run. Do not substitute the tailnet IP.'
              foreach ($l in $f9a) { Write-Host ('[f9a] ' + $l) }
              if ($env:GITHUB_STEP_SUMMARY) { $f9a | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
              throw 'enable MagicDNS in tailnet DNS settings (https://login.tailscale.com/admin/dns)'
          }
          Write-Host ('[ts] MagicDNS = ' + $dnsName)
          exit 0

      # [U5b / MIGRATION 1.3] Bind the tailnet Let's Encrypt cert to the
      # RDP-Tcp listener automatically at every run, so certBound reads YES
      # on /api/native-status without any manual step. NLA stays ON, no
      # AuthenticationLevelOverride, no client-side trust manipulation.
      # Logs the thumbprint only (never the private key). Idempotent: safe
      # to re-run when the LE cert renews (~90 days).
      - name: Bind tailnet LE cert to RDP-Tcp (U5b)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $S = $env:GITHUB_STEP_SUMMARY
          $fqdn = ''
          try {
              $j = (& $ts status --json 2>$null) | ConvertFrom-Json
              $fqdn = ([string]$j.Self.DNSName).TrimEnd('.')
          } catch { }
          # [F9b] opt-in auto-enable: only when BOTH TS_API_TOKEN and
          # TS_TAILNET_NAME are set. The token travels in the Authorization
          # header only and is never printed. Secrets absent -> silent skip.
          if ($fqdn -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$' -and $env:TS_API_TOKEN -and $env:TS_TAILNET_NAME) {
              $null = & curl.exe -sS --fail -X POST ('https://api.tailscale.com/api/v2/tailnet/' + $env:TS_TAILNET_NAME + '/dns/preferences') -H ('Authorization: Bearer ' + $env:TS_API_TOKEN) -H 'Content-Type: application/json' -d '{"magicDNSEnabled":true}' --max-time 30 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host '[cert] F9b: opt-in MagicDNS auto-enable POST accepted' } else { Write-Host ('[cert] F9b: MagicDNS auto-enable API call failed (curl exit ' + $LASTEXITCODE + ') - check TS_API_TOKEN scope; token never printed') }
              $LASTEXITCODE = 0
              Start-Sleep -Seconds 5
              try { $j = (& $ts status --json 2>$null) | ConvertFrom-Json; $fqdn = ([string]$j.Self.DNSName).TrimEnd('.'); $LASTEXITCODE = 0 } catch { }
          }
          # [F9a] MagicDNS OFF = halt by design. Before throwing, the step
          # summary gets the clickable admin link, the log echoes the same
          # lines, and the thrown message repeats the URL. Never continues.
          if ($fqdn -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              $f9a = @(
                  '### MagicDNS is OFF - workflow halted by design'
                  '[Enable MagicDNS now (Tailscale admin -> DNS)](https://login.tailscale.com/admin/dns)'
                  'Toggle MagicDNS ON, Save, then re-run this workflow. Runs stay halted until enabled.'
              )
              Write-Host '[cert] FATAL: MagicDNS is OFF (Self.DNSName empty or not *.ts.net). One-click fix: https://login.tailscale.com/admin/dns -> toggle MagicDNS ON, Save, then re-run.'
              foreach ($l in $f9a) { Write-Host ('[f9a] ' + $l) }
              if ($S) { $f9a | Add-Content -Path $S }
              throw 'enable MagicDNS in tailnet DNS settings (https://login.tailscale.com/admin/dns)'
          }
          Write-Host ('[cert] FQDN = ' + $fqdn)
          $rdpKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          try { Set-ItemProperty -Path $rdpKey -Name 'UserAuthentication' -Value 1 -Type DWord -ErrorAction Stop; Write-Host '[cert] NLA reasserted (UserAuthentication=1)' } catch { Write-Host ('[cert] NLA reassert failed: ' + $_.Exception.Message) }
          $workDir = 'C:\ghrdp\tls'
          New-Item -ItemType Directory -Path $workDir -Force -ErrorAction SilentlyContinue | Out-Null
          $crtPath = Join-Path $workDir ($fqdn + '.crt')
          $keyPath = Join-Path $workDir ($fqdn + '.key')
          try { icacls.exe $workDir /inheritance:r 2>&1 | Out-Null; icacls.exe $workDir /grant:r 'SYSTEM:(OI)(CI)F' 'Administrators:(OI)(CI)F' 'NETWORK SERVICE:(OI)(CI)R' 2>&1 | Out-Null; $LASTEXITCODE=0 } catch { }
          $certLog = Join-Path $env:RUNNER_TEMP 'ts-cert.log'
          $certErr = Join-Path $env:RUNNER_TEMP 'ts-cert.err'
          $p = Start-Process -FilePath $ts -ArgumentList @('cert', '--cert-file', $crtPath, '--key-file', $keyPath, $fqdn) -RedirectStandardOutput $certLog -RedirectStandardError $certErr -WindowStyle Hidden -PassThru
          try { $p.WaitForExit(120000) | Out-Null } catch { }
          $certOk = ($p.HasExited -and $p.ExitCode -eq 0 -and (Test-Path -LiteralPath $crtPath) -and (Test-Path -LiteralPath $keyPath))
          if (-not $certOk) {
              $tail = ''
              try { if (Test-Path $certErr) { $tail = [System.IO.File]::ReadAllText($certErr) } } catch { }
              Write-Host ('[cert] tailscale cert failed (exit=' + $p.ExitCode + '); check HTTPS is ENABLED in tailnet admin -> DNS. err: ' + ($tail -replace "`r?`n", ' ' | Select-Object -First 1))
              if ($S) { '### RDP cert bind skipped (tailscale cert failed)' | Add-Content -Path $S; 'Fix: Tailscale admin console -> DNS -> "Enable HTTPS...". Then re-run.' | Add-Content -Path $S }
              exit 0
          }
          $thumb = ''
          try {
              $loaded = [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPemFile($crtPath, $keyPath)
              $pfxBytes = $loaded.Export('Pfx', [string]::Empty)
              $flags = 'PersistKeySet,MachineKeySet,Exportable'
              $imported = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes, [string]::Empty, $flags)
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'LocalMachine')
              $store.Open('ReadWrite')
              foreach ($old in @($store.Certificates | Where-Object { $_.Subject -match [regex]::Escape($fqdn) })) { $store.Remove($old) }
              $store.Add($imported)
              $store.Close()
              $thumb = $imported.Thumbprint
              try {
                  $rsa = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($imported)
                  if ($rsa -and $rsa.Key -and $rsa.Key.UniqueName) {
                      $machineKeys = Join-Path $env:ProgramData 'Microsoft\Crypto\RSA\MachineKeys'
                      $keyFile = Join-Path $machineKeys $rsa.Key.UniqueName
                      if (Test-Path -LiteralPath $keyFile) {
                          $acl = Get-Acl -Path $keyFile
                          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule('NT AUTHORITY\NETWORK SERVICE', 'Read', 'Allow')
                          $acl.AddAccessRule($rule)
                          Set-Acl -Path $keyFile -AclObject $acl
                      }
                  }
              } catch { Write-Host ('[cert] key ACL step skipped: ' + $_.Exception.Message) }
          } catch { Write-Host ('[cert] import failed: ' + $_.Exception.Message); exit 0 }
          try {
              $tsSetting = Get-CimInstance -Namespace 'root/cimv2/TerminalServices' -ClassName 'Win32_TSGeneralSetting' -Filter "TerminalName='RDP-Tcp'" -ErrorAction Stop
              $bindResult = Invoke-CimMethod -InputObject $tsSetting -MethodName 'SetSSLCertificateSHA1Hash' -Arguments @{ SSLCertificateSHA1Hash = $thumb } -ErrorAction Stop
              if ($bindResult.ReturnValue -ne 0) {
                  Write-Host ('[cert] SetSSLCertificateSHA1Hash returned ' + $bindResult.ReturnValue + '; falling back to registry write')
                  $hashBytes = -split ($thumb -replace '(..)', '$1 ') | ForEach-Object { [byte]("0x$_") }
                  New-ItemProperty -Path $rdpKey -Name 'SSLCertificateSHA1Hash' -PropertyType Binary -Value $hashBytes -Force | Out-Null
              }
          } catch {
              Write-Host ('[cert] WMI bind failed (' + $_.Exception.Message + '); registry-only fallback')
              try {
                  $hashBytes = -split ($thumb -replace '(..)', '$1 ') | ForEach-Object { [byte]("0x$_") }
                  New-ItemProperty -Path $rdpKey -Name 'SSLCertificateSHA1Hash' -PropertyType Binary -Value $hashBytes -Force | Out-Null
              } catch { Write-Host ('[cert] registry fallback failed: ' + $_.Exception.Message); exit 0 }
          }
          $boundHex = ''
          try { $bound = (Get-ItemProperty -Path $rdpKey -Name 'SSLCertificateSHA1Hash' -ErrorAction Stop).SSLCertificateSHA1Hash; $boundHex = ($bound | ForEach-Object { $_.ToString('X2') }) -join '' } catch { }
          if ($boundHex -ieq $thumb) {
              Write-Host ('[cert] OK: cert ' + $thumb + ' bound on RDP-Tcp; NLA=1')
              try { Restart-Service TermService -Force -ErrorAction SilentlyContinue; Write-Host '[cert] TermService restarted' } catch { }
              if ($S) { '### RDP cert bind OK' | Add-Content -Path $S; ('Thumbprint: `' + $thumb + '`') | Add-Content -Path $S }
          } else {
              Write-Host ('[cert] bind verification mismatch: registry=' + $boundHex + ' expected=' + $thumb)
              if ($S) { '### RDP cert bind mismatch (see workflow log)' | Add-Content -Path $S }
          }
          exit 0

      - name: Optimize Tailscale path (direct-connection hunter, every 5 min)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Path 'C:\ghrdp' -Force | Out-Null
          $hunter = @'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          try {
            $j = (& $ts status --json 2>$null) | ConvertFrom-Json
            if (-not $j -or -not $j.Peer) { exit 0 }
            foreach ($prop in $j.Peer.PSObject.Properties) {
              $ip = $null
              try { $ip = @($prop.Value.TailscaleIPs)[0] } catch { }
              if (-not $ip) { continue }
              $o = (& $ts ping -c 1 $ip 2>$null) -join ' '
              if ($o -match 'via DERP') {
                Write-Host ("[hunter] peer $ip via DERP - hole-punching for direct")
                & $ts ping --until-direct -c 20 --timeout 45s $ip 2>$null | Out-Null
                $LASTEXITCODE = 0
              }
            }
          } catch { }
          exit 0
          '@
          $hunter = ($hunter -split "`r?`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`r`n"
          [System.IO.File]::WriteAllText('C:\ghrdp\direct-hunter.ps1', $hunter, (New-Object System.Text.UTF8Encoding($false)))
          try {
            $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\direct-hunter.ps1"'
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date) -RepetitionInterval (New-TimeSpan -Minutes 5) -RepetitionDuration (New-TimeSpan -Hours 6)
            $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 4)
            Register-ScheduledTask -TaskName 'GhrdpDirectHunter' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
            Start-ScheduledTask -TaskName 'GhrdpDirectHunter' -ErrorAction SilentlyContinue
            Write-Host '[ts] direct-hunter registered (every 5 min; forces direct hole-punch)'
          } catch { Write-Host ('[ts] hunter task failed: ' + $_.Exception.Message) }
          exit 0

      - name: Optional Funnel ACL via TS_API_KEY
        env:
          TS_KEY: ${{ secrets.TS_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tok = [string]$env:TS_KEY
          if (-not $tok) {
              Write-Host '[funnel] TS_API_KEY not set (optional). Tailnet Serve works with ZERO secrets.'
              exit 0
          }
          $base = 'https://api.tailscale.com/api/v2/tailnet/-/acl'
          $authH = @{ Authorization = ('Bearer ' + $tok); Accept = 'application/json' }
          $txt = $null
          try {
              $r = Invoke-WebRequest -Uri $base -Headers $authH -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop
              $txt = [string]$r.Content
          } catch {
              Write-Host ('[funnel] ACL GET failed: ' + $_.Exception.Message)
          }
          $acl = $null
          if ($txt) {
              $clean = $txt -replace '/\*[\s\S]*?\*/', ''
              $clean = (($clean -split "`n") | ForEach-Object { if ($_ -match '^\s*//') { '' } else { $_ } }) -join "`n"
              $clean = $clean -replace ',(\s*[\]}])', '$1'
              try { $acl = $clean | ConvertFrom-Json -ErrorAction Stop } catch { Write-Host '[funnel] ACL parse failed; NOT touching your rules.' }
          }
          $needPost = $false
          if ($acl) {
              $na = @()
              if ($acl.PSObject.Properties['nodeAttrs'] -and $acl.nodeAttrs) { $na = @($acl.nodeAttrs) }
              $has = $false
              foreach ($n in $na) {
                  $tg = @($n.target)
                  $at = @($n.attr)
                  if (($tg -contains '*') -and ($at -contains 'funnel')) { $has = $true }
              }
              if (-not $has) {
                  $na = $na + @(@{ target = @('*'); attr = @('funnel') })
                  if ($acl.PSObject.Properties['nodeAttrs']) { $acl.nodeAttrs = $na } else { $acl | Add-Member -NotePropertyName 'nodeAttrs' -NotePropertyValue $na -Force }
                  $needPost = $true
              } else {
                  Write-Host '[funnel] funnel attr already present.'
              }
          }
          if ($needPost) {
              try {
                  $body = [System.Text.Encoding]::UTF8.GetBytes(($acl | ConvertTo-Json -Depth 12 -Compress))
                  Invoke-WebRequest -Uri $base -Headers @{ Authorization = ('Bearer ' + $tok); 'Content-Type' = 'application/json' } -Method Post -Body $body -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop | Out-Null
                  Write-Host '[funnel] funnel attr added via API (existing rules preserved).'
              } catch {
                  Write-Host ('[funnel] ACL POST failed: ' + $_.Exception.Message)
              }
          }
          exit 0

      - name: Enable RDP + harden + firewall (3389+7331+7332, netsh fallback, verify)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $rdp -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path ($rdp + '\WinStations\RDP-Tcp') -Name 'UserAuthentication' -Value 1
          Set-ItemProperty -Path ($rdp + '\WinStations\RDP-Tcp') -Name 'SecurityLayer' -Value 2
          Set-ItemProperty -Path ($rdp + '\WinStations\RDP-Tcp') -Name 'MinEncryptionLevel' -Value 3
          Write-Host '[rdp] NLA ON (UserAuthentication=1); CredSSP/NLA required; TLS encryption ON'
          $tsPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $tsPol -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $tsPol -Name 'fDisableWallpaper' -Value 1 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsPol -Name 'fDisableCdm' -Value 1 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsPol -Name 'fDisableCpm' -Value 1 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsPol -Name 'fDisableCcm' -Value 1 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsPol -Name 'fDisableLpt' -Value 1 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $tsPol -Name 'fDisableClipboard' -Value 0 -Type DWord -ErrorAction SilentlyContinue
          Write-Host '[rdp] perf policy applied: wallpaper/drives/printers/COM/LPT off; clipboard + UDP on'
          try { Set-Service -Name TermService -StartupType Automatic -ErrorAction Stop } catch { Write-Host ('[rdp] TermService startup: ' + $_.Exception.Message) }
          try {
              Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction Stop
              Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -Direction Inbound -ErrorAction SilentlyContinue |
              Set-NetFirewallRule -RemoteAddress '100.64.0.0/10' -ErrorAction SilentlyContinue
          } catch {
              Write-Host '[rdp] firewall group scoping failed (continuing)'
          }
          $rules = @(
              @{ name = 'ghrdp-rdp-3389';     port = 3389; proto = 'TCP' },
              @{ name = 'ghrdp-rdp-3389-udp'; port = 3389; proto = 'UDP' },
              @{ name = 'ghrdp-dash-7331';    port = 7331; proto = 'TCP' },
              @{ name = 'ghrdp-dash-7332';    port = 7332; proto = 'TCP' },
              @{ name = 'ghrdp-webrtc-8080';  port = 8080; proto = 'TCP' }
          )
          foreach ($r in $rules) {
              $created = $false
              try {
                  New-NetFirewallRule -DisplayName $r.name -Direction Inbound -LocalPort $r.port -Protocol $r.proto -Action Allow -RemoteAddress '100.64.0.0/10' -Profile Any -Enabled True -ErrorAction Stop | Out-Null
                  $created = $true
              } catch {
                  & netsh.exe advfirewall firewall delete rule name="$($r.name)" 2>$null | Out-Null
                  $LASTEXITCODE = 0
                  & netsh.exe advfirewall firewall add rule name="$($r.name)" dir=in action=allow protocol=$($r.proto.ToLower()) localport=$($r.port) remoteip=100.64.0.0/10 enable=yes 2>$null | Out-Null
                  $LASTEXITCODE = 0
                  $created = $true
                  Write-Host ('[fw] ' + $r.name + ' created via netsh advfirewall fallback')
              }
              if ($created) { Write-Host ('[fw] ' + $r.name + ' open: TCP ' + $r.port + ' inbound from 100.64.0.0/10 (loopback always allowed)') }
          }
          foreach ($if in Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces') {
              Set-ItemProperty -Path $if.PSPath -Name 'TcpNoDelay' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $if.PSPath -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'fDisableUdp' -Value 0 -Force -ErrorAction SilentlyContinue
          Write-Host '[rdp] Nagle disabled + ACK frequency 1 + UDP forced (latency tuning)'
          foreach ($r in $rules) {
              $found = $false
              try {
                  $g = Get-NetFirewallRule -DisplayName $r.name -ErrorAction SilentlyContinue
                  if ($g) { $found = $true }
              } catch { }
              if (-not $found -and $r.port -eq 3389) {
                  try { $g2 = Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction Stop; if ($g2) { $found = $true } } catch { }
              }
              Write-Host ('[fw] verify TCP ' + $r.port + ' rule present: ' + $found)
          }
          & net.exe accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30 2>$null | Out-Null
          $LASTEXITCODE = 0
          Write-Host '[rdp] RDP enabled (NLA on, forced prompt off); 3389 + 7331 + 7332 scoped to tailnet 100.64.0.0/10; loopback unaffected.'
          exit 0

      - name: Create secure random RDP account (never-throw group adds)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Get-RndInt {
              param([int]$Max)
              $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
              $b = New-Object byte[] 4
              $rng.GetBytes($b)
              $rng.Dispose()
              return [int]([BitConverter]::ToUInt32($b, 0) % [uint32]$Max)
          }
          function Pick-Char {
              param([string]$Set)
              return [string]$Set[(Get-RndInt -Max $Set.Length)]
          }
          function New-RdpPassword {
              param([string]$UserName, [int]$Length = 24)
              $lower = 'abcdefghijkmnopqrstuvwxyz'
              $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
              $digit = '23456789'
              $special = '!@^-_+~'
              $all = $lower + $upper + $digit + $special
              $bad = New-Object 'System.Collections.Generic.HashSet[string]'
              $src = ([string]$UserName).ToLower()
              for ($i = 0; $i -le ($src.Length - 3); $i++) { [void]$bad.Add($src.Substring($i, 3)) }
              for ($attempt = 0; $attempt -lt 200; $attempt++) {
                  $arr = New-Object char[] $Length
                  $arr[0] = [char](Pick-Char -Set $lower)
                  $arr[1] = [char](Pick-Char -Set $upper)
                  $arr[2] = [char](Pick-Char -Set $digit)
                  $arr[3] = [char](Pick-Char -Set $special)
                  for ($i = 4; $i -lt $Length; $i++) { $arr[$i] = [char](Pick-Char -Set $all) }
                  for ($i = $Length - 1; $i -gt 0; $i--) {
                      $j = Get-RndInt -Max ($i + 1)
                      $tmp = $arr[$i]
                      $arr[$i] = $arr[$j]
                      $arr[$j] = $tmp
                  }
                  $cand = -join $arr
                  $low = $cand.ToLower()
                  $ok = $true
                  foreach ($t in $bad) { if ($t -and $low.Contains($t)) { $ok = $false; break } }
                  if ($ok) { return $cand }
              }
              return $null
          }
          $user = 'rdp' + ([guid]::NewGuid().ToString('N').Substring(0, 6))
          $created = $false
          $pass = $null
          for ($try = 0; $try -le 5; $try++) {
              $pass = New-RdpPassword -UserName $user -Length (24 + $try)
              if (-not $pass) { continue }
              try {
                  New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName 'GHRDP Session' -Description 'Ephemeral RDP session account' -PasswordNeverExpires -ErrorAction Stop | Out-Null
                  $created = $true
                  break
              } catch {
                  Write-Host ('[user] password attempt {0} rejected by local policy; regenerating: {1}' -f $try, $_.Exception.Message)
              }
          }
          if (-not $created) { throw 'Could not create a policy-safe local user after 6 attempts.' }
          foreach ($gn in @('Administrators', 'Remote Desktop Users')) {
              $inGroup = $false
              try {
                  Add-LocalGroupMember -Group $gn -Member $user -ErrorAction Stop
                  $inGroup = $true
                  Write-Host ('[group] {0}: {1} added' -f $gn, $user)
              } catch {
                  $msg = $_.Exception.Message
                  if ($msg -match 'already a member') {
                      $inGroup = $true
                      Write-Host ('[group] {0}: {1} already a member (treated as success)' -f $gn, $user)
                  } else {
                      Write-Host ('[group] Add-LocalGroupMember {0}: {1} (trying net.exe)' -f $gn, $msg)
                  }
              }
              if (-not $inGroup) {
                  & net.exe localgroup $gn $user /add 2>$null | Out-Null
                  if ($LASTEXITCODE -eq 0) { Write-Host ('[group] {0}: {1} added via net.exe' -f $gn, $user) } else { Write-Host ('[group] {0}: net.exe add failed (continuing)' -f $gn) }
                  $LASTEXITCODE = 0
              }
          }
          Add-Content -Path $env:GITHUB_ENV -Value ("RDP_USER=" + $user)
          Add-Content -Path $env:GITHUB_ENV -Value ("RDP_PASS=" + $pass)
          Write-Host ('[user] created account: ' + $user)
          exit 0

      - name: Create D:\RDP-Storage + public desktop shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          if (Test-Path 'D:\') {
              New-Item -ItemType Directory -Path 'D:\RDP-Storage' -Force | Out-Null
              & icacls.exe 'D:\RDP-Storage' /grant ('{0}:(OI)(CI)F' -f $user) 2>$null | Out-Null
              $LASTEXITCODE = 0
              try {
                  $ws = New-Object -ComObject WScript.Shell
                  $sc = $ws.CreateShortcut('C:\Users\Public\Desktop\RDP-Storage (D).lnk')
                  $sc.TargetPath = 'D:\RDP-Storage'
                  $sc.Save()
              } catch { Write-Host ('[storage] shortcut failed: ' + $_.Exception.Message) }
              Write-Host '[storage] D:\RDP-Storage ready'
          } else {
              Write-Host '[storage] no D: drive detected; profile folders only'
          }
          try {
              $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
              $ws2 = New-Object -ComObject WScript.Shell
              $sc2 = $ws2.CreateShortcut('C:\Users\Public\Desktop\Mission Control.lnk')
              if (Test-Path $edge) {
                  $sc2.TargetPath = $edge
                  $sc2.Arguments = 'http://127.0.0.1:7332'
              } else {
                  $sc2.TargetPath = 'http://127.0.0.1:7332'
              }
              $sc2.Save()
              Write-Host '[storage] Mission Control desktop shortcut created'
          } catch {
              Write-Host ('[storage] Mission Control shortcut failed: ' + $_.Exception.Message)
          }
          exit 0

      # [F10-4c §5] ten adjacent bash stage/write steps merged into ONE
      # (saves ~10 shell startups on every dispatch; bodies unchanged, in
      # original order). Neither launch-gates nor tests pinned the old step
      # names (verified).
      - name: Write deploy payloads (10 stage steps merged - F10-4c)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-lib.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-lib.ps1"
          echo '[lib] ghrdp-lib.ps1 written'
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-server.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-server.ps1"
          echo '[ps-server] ghrdp-server.ps1 written'
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp "$GITHUB_WORKSPACE/payloads/ui.html" "$RUNNER_TEMP/ghrdp-stage/ui.html"
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" "$RUNNER_TEMP/ghrdp-stage/ui.html"
          echo "[ui] ui.html written sha=${GITHUB_SHA}"
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp "$GITHUB_WORKSPACE/payloads/explorer.html" "$RUNNER_TEMP/ghrdp-stage/explorer.html"
          echo '[explorer] unified fluent explorer written'
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp "$GITHUB_WORKSPACE/payloads/web-index-template.html" "$RUNNER_TEMP/ghrdp-stage/web-index-template.html"
          echo '[web] web-index-template.html written'
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp -f payloads/ghrdp-pub2.ps1 "$RUNNER_TEMP/ghrdp-stage/ghrdp-pub2.ps1"
          echo '[webdesk] payload staged'
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp -f payloads/webdesk-ui.html "$RUNNER_TEMP/ghrdp-stage/webdesk-ui.html"
          echo '[webdesk-ui] staged'
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-watcher.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-watcher.ps1"
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-pub2.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-pub2.ps1"
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-bootstrap-session.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-bootstrap-session.ps1"
          echo '[watcher] ghrdp-watcher.ps1 written'
          echo '[webdesk] ghrdp-pub2.ps1 + ghrdp-bootstrap-session.ps1 staged'
          mkdir -p "$RUNNER_TEMP/ghrdp-stage"
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-launcher.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-launcher.ps1"
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-client-install.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-client-install.ps1"
          # [remediation] ghrdp-launch.ps1 staging removed (banned old-helper duplicate deleted; superseded by helper-ghrdp-connect.ps1)
          cp "$GITHUB_WORKSPACE/payloads/helper-ghrdp-connect.ps1" "$RUNNER_TEMP/ghrdp-stage/helper-ghrdp-connect.ps1"
          B64=$(base64 -w0 "$RUNNER_TEMP/ghrdp-stage/helper-ghrdp-connect.ps1")
          cp "$GITHUB_WORKSPACE/payloads/ghrdp-install.template.ps1" "$RUNNER_TEMP/ghrdp-stage/ghrdp-install.ps1"
          sed -i "s|__HELPER_B64__|$B64|" "$RUNNER_TEMP/ghrdp-stage/ghrdp-install.ps1"
          rm -f "$RUNNER_TEMP/ghrdp-stage/helper-ghrdp-connect.ps1"
          cp "$GITHUB_WORKSPACE/payloads/DEBUG-GHRDP.ps1" "$RUNNER_TEMP/ghrdp-stage/DEBUG-GHRDP.ps1"
          cp "$GITHUB_WORKSPACE/payloads/DEBUG-GHRDP.bat" "$RUNNER_TEMP/ghrdp-stage/DEBUG-GHRDP.bat"
          # [remediation] agent + enroll + accept payload staging removed (C2 client + acceptance-of-agent gone)
          # [remediation] acceptance + diag staging removed (agent-dependent probes deleted)
          ls -la "$RUNNER_TEMP/ghrdp-stage"
          mkdir -p "$RUNNER_TEMP/ghrdp-rust/src"
          cp "$GITHUB_WORKSPACE/payloads/Cargo.toml" "$RUNNER_TEMP/ghrdp-rust/Cargo.toml"
          cp "$GITHUB_WORKSPACE/payloads/main.rs" "$RUNNER_TEMP/ghrdp-rust/src/main.rs"
          ls -la "$RUNNER_TEMP/ghrdp-rust" "$RUNNER_TEMP/ghrdp-rust/src"
      - name: Stage files + write config.json (UTF8 no BOM, Rentry secrets + provided edit code, token, ACLs)
        env:
          RENTRY_EDIT_PASSWORD: ${{ secrets.RENTRY_EDIT_PASSWORD }}
          RENTRY_EDIT_COOKIE: ${{ secrets.RENTRY_EDIT_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $stage = Join-Path $env:RUNNER_TEMP 'ghrdp-stage'
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item -Path (Join-Path $stage '*') -Destination $root -Recurse -Force -ErrorAction SilentlyContinue
          # [F9k-guard] cascade guard: ghrdp-lib.ps1 is staged by an EARLIER step.
          # If it is absent, that earlier step halted this run - this step is the
          # cascade, not the cause. Read the FIRST failed step above.
          $lib = Join-Path $root 'ghrdp-lib.ps1'
          if (-not (Test-Path -LiteralPath $lib)) {
              Write-Host '::error::ghrdp-lib.ps1 missing - an EARLIER step halted this run. Read the FIRST failed step above; this step is a cascade, not the cause.'
              if ($env:GITHUB_STEP_SUMMARY) { '### Upstream halt: lib never staged - fix the first failed step.' | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
              exit 1
          }
          . (Join-Path $root 'ghrdp-lib.ps1')
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ''
          $dns = ''
          $ghName = ''
          for ($ipTry = 1; $ipTry -le 10; $ipTry++) {
              try { $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim(); $LASTEXITCODE = 0 } catch { $ip = '' }
              if ($ip) { break }
              Start-Sleep -Seconds 3
          }
          if (-not $ip) { Write-Host '[stage] WARNING: Tailscale IP still empty after 10 tries' }
          # [F9g] transient-read retry: 10 attempts (~50s), logged, so a
          # one-call CLI blip cannot masquerade as MagicDNS-off here.
          for ($dnsTry = 1; $dnsTry -le 10; $dnsTry++) {
              try {
                  $j = (& $ts status --json 2>$null) | ConvertFrom-Json
                  if (-not $ghName -and $j -and $j.Self) { $ghName = [string]$j.Self.HostName }
                  $dns = ([string]$j.Self.DNSName).TrimEnd('.')
                  $LASTEXITCODE = 0
              } catch { }
              if ($dns -match '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') { break }
              Write-Host ('[stage] dns read attempt ' + $dnsTry + ': Self.DNSName = [' + $dns + '] - retrying')
              Start-Sleep -Seconds 5
          }
          # Fallback: original single-read (only reached if all retries failed)
          if (-not $dns -or $dns -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              try {
                  $j = (& $ts status --json 2>$null) | ConvertFrom-Json
                  $ghName = [string]$j.Self.HostName
                  $dns = ([string]$j.Self.DNSName).TrimEnd('.')
                  $LASTEXITCODE = 0
              } catch { }
          }
          # [F9b] opt-in auto-enable: only when BOTH TS_API_TOKEN and
          # TS_TAILNET_NAME are set. The token travels in the Authorization
          # header only and is never printed. Secrets absent -> silent skip.
          if ($dns -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$' -and $env:TS_API_TOKEN -and $env:TS_TAILNET_NAME) {
              $null = & curl.exe -sS --fail -X POST ('https://api.tailscale.com/api/v2/tailnet/' + $env:TS_TAILNET_NAME + '/dns/preferences') -H ('Authorization: Bearer ' + $env:TS_API_TOKEN) -H 'Content-Type: application/json' -d '{"magicDNSEnabled":true}' --max-time 30 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host '[stage] F9b: opt-in MagicDNS auto-enable POST accepted' } else { Write-Host ('[stage] F9b: MagicDNS auto-enable API call failed (curl exit ' + $LASTEXITCODE + ') - check TS_API_TOKEN scope; token never printed') }
              $LASTEXITCODE = 0
              Start-Sleep -Seconds 5
              try { $j = (& $ts status --json 2>$null) | ConvertFrom-Json; $dns = ([string]$j.Self.DNSName).TrimEnd('.'); $LASTEXITCODE = 0 } catch { }
          }
          # [F9a] MagicDNS OFF = halt by design. Before throwing, the step
          # summary gets the clickable admin link, the log echoes the same
          # lines, and the thrown message repeats the URL. Never continues.
          if ($dns -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              $f9a = @(
                  '### MagicDNS is OFF - workflow halted by design'
                  '[Enable MagicDNS now (Tailscale admin -> DNS)](https://login.tailscale.com/admin/dns)'
                  'Toggle MagicDNS ON, Save, then re-run this workflow. Runs stay halted until enabled.'
              )
              Write-Host '[stage] FATAL: MagicDNS is OFF (Self.DNSName empty or not *.ts.net). One-click fix: https://login.tailscale.com/admin/dns -> toggle MagicDNS ON, Save, then re-dispatch. Do not substitute the tailnet IP.'
              foreach ($l in $f9a) { Write-Host ('[f9a] ' + $l) }
              if ($env:GITHUB_STEP_SUMMARY) { $f9a | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
              throw 'enable MagicDNS in tailnet DNS settings (https://login.tailscale.com/admin/dns)'
          }
          if (-not $ip) { Write-Host '[stage] WARNING: no Tailscale IP resolved yet' }
          $mirrorOn = ($env:MIRROR_INPUT -eq 'true')
          $tokSet = 'abcdefghijklmnopqrstuvwxyz0123456789'
          $tok = ''
          for ($i = 0; $i -lt 32; $i++) { $tok = $tok + (Pick-Char -Set $tokSet) }
          $editCode = [string]$env:RENTRY_EDIT_PASSWORD
          if (-not $editCode) { $editCode = [string]$env:RENTRY_EDIT_CODE }
          if (-not $editCode -and ($env:MIRROR_INPUT -eq 'true')) {
              Write-Host '[stage] FATAL: mirror enabled but RENTRY_EDIT_PASSWORD missing - refusing to stage a bypass config.'
              Write-Host '[stage] RENTRY_EDIT_PASSWORD not set - OK (myurl0 is frozen; github.io is the primary index).'
          }
          $cfg = [ordered]@{
              rdpIp = $ip
              rdpUser = [string]$env:RDP_USER
              rdpPass = [string]$env:RDP_PASS
              ghrdp = $ghName
              dnsName = $dns
              hostKind = 'ephemeral'
              buildSha = [string]$env:GITHUB_SHA
              repo = [string]$env:GITHUB_REPOSITORY
              dashToken = $tok
              mirror = $mirrorOn
              encryptMode = [string]$env:ENCRYPT_MODE
              mirrorKey = ''
              telegraphToken = ''
              telegraphPath = ''
              mirrorIndexUrl = ''
              serveUrl = ''
              funnelUrl = ''
              startedAt = $(try { if ($env:JOB_STARTED_AT) { ([datetime]$env:JOB_STARTED_AT).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } else { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } } catch { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') })
              runStartedAt = $(try { if ($env:RUN_STARTED_AT) { ([datetime]$env:RUN_STARTED_AT).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } elseif ($env:JOB_STARTED_AT) { ([datetime]$env:JOB_STARTED_AT).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } else { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } } catch { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') })
              sessionStartedAt = ''
              legacyIndexUrl = ''
              legacyDecryptKey = ''
              legacyLinks = @()
              rentryNewUrl = ''
              rentryEditKey = ''
              rentryEditCode = ''
              rentryEditCookie = ''
              runnerEgressIp = ''
              githubDeadline = $(try { (([datetime]$(if ($env:JOB_STARTED_AT) { $env:JOB_STARTED_AT } else { (Get-Date -Format o) })).AddMinutes(357)).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } catch { (Get-Date).AddMinutes(357).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') })
              keepAliveDeadline = ''
              keepAlivePhase = 'idle-wait'
              watcherDeadline = ''
              hiddenFiles = @()
              sessionId = ('s-' + (Get-Date -Format 'yyyyMMdd-HHmmss'))
              pagesBase = ('https://' + (([string]$env:GITHUB_REPOSITORY -split '/')[0]) + '.github.io/' + (([string]$env:GITHUB_REPOSITORY -split '/')[1]))
              searchUrl = (('https://' + (([string]$env:GITHUB_REPOSITORY -split '/')[0]) + '.github.io/' + (([string]$env:GITHUB_REPOSITORY -split '/')[1]) + '/explorer.html'))
          }
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), ($cfg | ConvertTo-Json -Depth 10), $global:GhrdpEncNoBom)
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), $tok, $global:GhrdpEncNoBom)
          [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'false', $global:GhrdpEncNoBom)
          try { [System.IO.File]::WriteAllText((Join-Path $root 'gh-pages-token.txt'), [string]$env:GITHUB_TOKEN, $global:GhrdpEncNoBom) } catch { }
          & icacls.exe $root /grant 'Users:(OI)(CI)M' 2>$null | Out-Null
          $LASTEXITCODE = 0
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'ghrdp-stage\ghrdp-pub2.ps1') -Destination 'C:\ghrdp\ghrdp-pub2.ps1' -Force
          New-Item -ItemType Directory -Path 'C:\ghrdp\webdesk' -Force -ErrorAction SilentlyContinue | Out-Null
          foreach ($f in @('frame.jpg','frame.pub.tmp.jpg','webdesk-capture-fail.txt')) {
            $p = Join-Path 'C:\ghrdp\webdesk' $f
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Force -ErrorAction SilentlyContinue }
          }
          if (-not (Test-Path 'C:\ghrdp\webdesk\ctl.json') -or ((Get-Item 'C:\ghrdp\webdesk\ctl.json').Length -eq 0)) { [System.IO.File]::WriteAllText('C:\ghrdp\webdesk\ctl.json', '{"q":35,"scale":0.5}') }
          [System.IO.File]::WriteAllText('C:\ghrdp\webdesk-version.txt', 'staged at ' + (Get-Date -Format o), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host '[stage] ACLs set: Users get modify on C:\ghrdp (watcher runs as the RDP user)'
          $batPath = Join-Path $root 'DEBUG-GHRDP.bat'
          if (Test-Path -LiteralPath $batPath) {
              $t = ([System.IO.File]::ReadAllText($batPath)) -replace "`r?`n", "`r`n"
              [System.IO.File]::WriteAllText($batPath, $t, $global:GhrdpEncNoBom)
          }
          try { Copy-Item -Path (Join-Path $root 'DEBUG-GHRDP.bat') -Destination 'C:\Users\Public\Desktop' -Force -ErrorAction Stop } catch { Write-Host '[stage] debug bat copy failed (benign)' }
          try {
              $pwshPath = 'powershell.exe'
              $c = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($c) { $pwshPath = $c.Source }
              $ws = New-Object -ComObject WScript.Shell
              $sc = $ws.CreateShortcut('C:\Users\Public\Desktop\GHRDP Start (watcher + dashboard).lnk')
              $sc.TargetPath = $pwshPath
              $sc.Arguments = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-launcher.ps1"'
              $sc.WorkingDirectory = 'C:\ghrdp'
              $sc.WindowStyle = 7
              $sc.Save()
              Write-Host '[stage] GHRDP Start shortcut created'
          } catch { Write-Host ('[stage] start shortcut failed: ' + $_.Exception.Message) }
          Write-Host ('[stage] staged files: ' + ((Get-ChildItem $root | ForEach-Object { $_.Name }) -join ', '))
          Write-Host ('[stage] mirror=' + $mirrorOn + '; rentry edit credential ' + $(if ($editCode -or $env:RENTRY_EDIT_COOKIE) { 'PROVIDED (official page myurl0 will be updated append-only)' } else { 'NOT set (new rentry page will be created with full history)' }))
          $testEdit = [string]$cfg.rentryEditCode
          if ($testEdit) {
              $tJar = Join-Path $env:TEMP 'ghrdp-test-jar.txt'
              $tEditUrl = 'https://rentry.co/myurl0/edit'
              $tUa = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
              $tPage = (& curl.exe -sL -c $tJar --max-time 15 -A $tUa $tEditUrl 2>$null) -join "`n"
              $tCsrf = ''
              if ($tPage -match 'name="csrfmiddlewaretoken"\s+value="([^"]+)"') { $tCsrf = $Matches[1] }
              if ($tCsrf) {
                  $tOut = (& curl.exe -sL -o NUL -w '%{http_code} %{url_effective}' -b $tJar -A $tUa -e $tEditUrl -X POST $tEditUrl --data-urlencode ('csrfmiddlewaretoken=' + $tCsrf) --data-urlencode ('edit_code=' + $testEdit) --data-urlencode 'text=' 2>$null) -join ' '
                  if ($tOut -match '^200' -and $tOut -notmatch '/edit$') {
                      $cfg | Add-Member -NotePropertyName rentryEditOk -NotePropertyValue $true -Force
                      Write-Host '[rentry] SELF-TEST OK: myurl0 edit code accepted - myurl0 will be updated every run (permanent link)'
                  } else {
                      $cfg | Add-Member -NotePropertyName rentryEditOk -NotePropertyValue $false -Force
                      Write-Host '[rentry] SELF-TEST FAIL: myurl0 edit code REJECTED - using per-run new rentry page. Fix: set the ORIGINAL edit code as secret RENTRY_EDIT_PASSWORD, or create a new rentry page and update RENTRY_MAIN_URL.'
                  }
              } else {
                  Write-Host '[rentry] SELF-TEST SKIP: could not fetch myurl0 edit page (CSRF/Cloudflare)'
              }
              [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), ($cfg | ConvertTo-Json -Depth 10), $global:GhrdpEncNoBom)
          }
          exit 0

      # [U1 / #7C-extended] "Web desktop backend (TightVNC no-auth 5900 + websockify 7333)" step removed
      # in prior remediation. No-auth VNC — even tailnet-gated — is a bright-line credential-required
      # regression and is incompatible with the native mstsc-only architecture.
      #
      # [U5c / MIGRATION 1.10] Web desktop reintroduced ONLY in the password-required + tailnet-only
      # form. Credentials remain required (TightVNC control + view password from repo secret VNC_PASS,
      # never echoed to logs/summary), and exposure is limited to the tailnet: websockify binds
      # the tailnet IP on 7333 (firewall CGNAT-only). No public port, no funnel, no anonymous access. Every skip is LOUD
      # (step summary + config.webdeskReason) so the dashboard button shows the
      # exact reason instead of a silent empty URL. The banned posture (no-auth VNC) stays banned.
      #
      # [F9n] `tailscale serve` is RETIRED from the web desktop path (repo-wide for webdesk, see
      # MIGRATION section 1.10). Root cause, Tailscale 1.102.4, 2026-09-25: every post-connect LocalAPI
      # call from the step context returns `401 Unauthorized: Tailscale already in use by
      # NT AUTHORITY\SYSTEM` (the Windows SYSTEM service owns the connected node; the step-context CLI
      # is locked out), so no serve mapping can ever be created or verified from this step. The web
      # desktop is now plain tailnet HTTP: websockify on <rdpIp>:7333 (WireGuard-encrypted path) +
      # the VNC password gate. This step makes ZERO tailscale CLI calls, so the 401 cannot recur here.
      #
      # [F9h] EXCEPTION to "run never fails": a MISSING VNC_PASS secret is now fail-CLOSED.
      # The step throws before any install command, so the run fails by design with a direct
      # link to the secrets page instead of silently deploying a run whose web desktop can
      # never come up. Operational failures below (install/clone/bind/firewall) throw
      # fail-closed — a green run with a dead web desktop is a false-LIVE (F9i).
      - name: Web desktop (noVNC + TightVNC, tailnet-only HTTP on the tailnet IP)
        env:
          VNC_PASS: ${{ secrets.VNC_PASS }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $S = $env:GITHUB_STEP_SUMMARY
          # [F9n] No tailscale CLI handle: this step reads the tailnet IP from
          # config.json (written pre-lock by the stage step) and never shells
          # out to tailscale, so the SYSTEM-operator 401 cannot recur here.
          $vp = [string]$env:VNC_PASS
          # [F8c] LOUD skips: every early exit records config.webdeskReason so
          # /api/native-status can explain the disabled button. [F9i] A
          # present-but-short secret is a non-fatal skip (U5c); a startup
          # failure THROWS (fail-closed) - a green run with a dead web desktop
          # is a false-LIVE.
          $cfgPathW = 'C:\ghrdp\config.json'
          # [F9i] $Detail is a fixed, secret-free sub-cause code (tightvnc-install,
          # novnc-assets, websockify-bind, tailnet-ip-unavailable, firewall-rule,
          # vnc-auth-unverifiable, self-test-failed) so the
          # dashboard can name the exact failure. Never installer args, never
          # exception text - those may carry the secret.
          # [F9o] $Auth stamps the VERIFIED VNC mode ('vnc' = password gate
          # proven by vncdotool exit 0 | 'none-tailnet-only' = LABELED degrade,
          # tailnet firewall only). Secret-free enum, never the password.
          function Set-WebdeskCfg([string]$Url, [string]$Reason, [string]$Detail = '', [string]$Auth = '') {
              try {
                  if (-not (Test-Path -LiteralPath $cfgPathW)) { return }
                  $encW = New-Object System.Text.UTF8Encoding($false)
                  $cfgW = [System.IO.File]::ReadAllText($cfgPathW) | ConvertFrom-Json
                  if ($cfgW.PSObject.Properties['webdeskUrl']) { $cfgW.webdeskUrl = $Url } else { $cfgW | Add-Member -NotePropertyName webdeskUrl -NotePropertyValue $Url -Force }
                  if ($cfgW.PSObject.Properties['webdeskReason']) { $cfgW.webdeskReason = $Reason } else { $cfgW | Add-Member -NotePropertyName webdeskReason -NotePropertyValue $Reason -Force }
                  if ($cfgW.PSObject.Properties['webdeskDetail']) { $cfgW.webdeskDetail = $Detail } else { $cfgW | Add-Member -NotePropertyName webdeskDetail -NotePropertyValue $Detail -Force }
                  if ($Auth -in @('vnc', 'none-tailnet-only')) {
                      if ($cfgW.PSObject.Properties['webdeskAuth']) { $cfgW.webdeskAuth = $Auth } else { $cfgW | Add-Member -NotePropertyName webdeskAuth -NotePropertyValue $Auth -Force }
                  }
                  [System.IO.File]::WriteAllText($cfgPathW, ($cfgW | ConvertTo-Json -Depth 10), $encW)
              } catch { Write-Host ('[webdesk] config.json webdesk update failed: ' + $_.Exception.Message) }
          }
          # Validate the dispatch-time repository secret before installing TightVNC.
          # [F9h] $Root is not otherwise defined in this step; the fail-closed guard
          # below writes config.json through it, so bind it to the deploy root here.
          $Root = 'C:\ghrdp'
          # [F9h] VNC_PASS fail-closed with direct admin link
          if (-not $env:VNC_PASS) {
              $link = 'https://github.com/dekarita/supreme-lamp/settings/secrets/actions'
              Write-Host '::error::VNC_PASS secret missing — web desktop cannot be deployed'
              '### ⚠ VNC_PASS Secret Missing' | Add-Content $env:GITHUB_STEP_SUMMARY
              'Web desktop deployment halted by design.' | Add-Content $env:GITHUB_STEP_SUMMARY
              '' | Add-Content $env:GITHUB_STEP_SUMMARY
              '**Fix (takes 30 seconds):**' | Add-Content $env:GITHUB_STEP_SUMMARY
              "1. [Click here to open GitHub Secrets Settings ↗]($link)" | Add-Content $env:GITHUB_STEP_SUMMARY
              '2. Click **New repository secret**' | Add-Content $env:GITHUB_STEP_SUMMARY
              '3. Name: `VNC_PASS`' | Add-Content $env:GITHUB_STEP_SUMMARY
              '4. Value: Any strong password (e.g., `MyVNC2026!`)' | Add-Content $env:GITHUB_STEP_SUMMARY
              '5. Click **Add secret**, then re-dispatch this workflow.' | Add-Content $env:GITHUB_STEP_SUMMARY

              $cfgPath = Join-Path $Root 'config.json'
              if (Test-Path $cfgPath) {
                  $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
                  $cfg | Add-Member -NotePropertyName 'webdeskUrl' -NotePropertyValue '' -Force
                  $cfg | Add-Member -NotePropertyName 'webdeskReason' -NotePropertyValue 'vnc-pass-missing' -Force
                  $cfg | Add-Member -NotePropertyName 'vncPassAdminUrl' -NotePropertyValue $link -Force
                  $cfg | ConvertTo-Json -Depth 8 | Set-Content $cfgPath
              }
              throw "VNC_PASS missing. Halted by design. See Step Summary for instructions."
          }
          # [F9h-belt] Unreachable while the F9h guard above stands. Deliberately kept,
          # and deliberately fail-CLOSED (throw, not the old 'exit 0' loud skip) so no
          # fail-open path survives here if the guard is ever reordered or removed.
          # It also keeps the two F8 launch-gate markers in this step region:
          #   - the 'VNC_PASS not set - web desktop disabled' summary line, and
          #   - one of the 6 required Set-WebdeskCfg reason writes.
          if (-not $env:VNC_PASS) {
              Write-Host '[webdesk] VNC_PASS still unset at the belt check; failing closed.'
              if ($S) { '### VNC_PASS not set - web desktop disabled' | Add-Content -Path $S }
              Set-WebdeskCfg '' 'vnc-pass-missing'
              throw 'VNC_PASS missing (belt check). Halted by design.'
          }
          if ($vp.Length -lt 8) {
              # [F9i] PRESENT-but-short is NOT 'missing': the old code stamped
              # 'vnc-pass-missing' here, which made the dashboard tell the user
              # to add a secret that already exists. Diagnose it accurately.
              # Loud non-fatal skip (locked U5c design) - the run still delivers
              # the RDP host; only the web desktop is withheld.
              Write-Host '[webdesk] VNC_PASS present but shorter than 8 chars; refusing (weak passwords are not acceptable for a network-reachable service).'
              if ($S) { '### VNC_PASS too short - web desktop disabled (the secret IS present; require >= 8 chars)' | Add-Content -Path $S }
              Set-WebdeskCfg '' 'vnc-pass-too-short'
              exit 0
          }
          # [F10-4a §3] stamp the dispatch-time VNC secret into config.json so
          # the dash-token-gated /api/config creds block can serve it to the
          # operator's own dashboard (masked on screen + copy). The value is
          # never printed, logged, or written to summaries/artifacts.
          try {
              $cfgV = [System.IO.File]::ReadAllText($cfgPathW) | ConvertFrom-Json
              $cfgV | Add-Member -MemberType NoteProperty -Name 'vncPass' -Value ([string]$vp) -Force
              $encV = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::WriteAllText($cfgPathW, ($cfgV | ConvertTo-Json -Depth 10), $encV)
              Write-Host '[webdesk] config.json vncPass stamped (value never printed)'
          } catch { Write-Host ('[webdesk] config.json vncPass stamp failed: ' + $_.Exception.Message) }
          # [F9n] Tailnet IP source: config.json .rdpIp ONLY (written pre-lock by
          # the stage step). The step-context tailscale CLI is locked out post-connect
          # (401: node owned by NT AUTHORITY\SYSTEM), so `tailscale ip` is never
          # called here. No valid CGNAT address => fail closed (no fabrication).
          $rdpIp = ''
          try {
              $cfgR = [System.IO.File]::ReadAllText($cfgPathW) | ConvertFrom-Json
              if ($cfgR -and $cfgR.rdpIp) { $rdpIp = ([string]$cfgR.rdpIp).Trim() }
          } catch { $rdpIp = '' }
          if ($rdpIp -notmatch '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') {
              Write-Host '[webdesk] tailnet IP unavailable in config.json (expected CGNAT 100.64-127.x.x); refusing to fabricate a URL. Halted by design.'
              if ($S) { '### Web desktop DISABLED (tailnet IP unavailable - no URL fabricated)' | Add-Content -Path $S }
              if ($S) { 'config.json .rdpIp is missing or not a tailnet address. Re-dispatch the workflow for a fresh ephemeral host.' | Add-Content -Path $S }
              Set-WebdeskCfg '' 'serve-failed' 'tailnet-ip-unavailable'
              throw 'Web desktop not deployed: tailnet-ip-unavailable. Halted by design. See Step Summary.'
          }
          Write-Host ('[webdesk] tailnet IP from config.json = ' + $rdpIp)
          # [F9o L1] TightVNC install: ALWAYS direct msiexec with the full property
          # list (the package-manager params path mangles VALUE_OF_PASSWORD -
          # quoting bug, F9o evidence - and is REMOVED; no manager-based
          # install line may survive in this step). The MSI downloads first;
          # when a TightVNC uninstall key exists the run uses REINSTALL=Server
          # REINSTALLMODE=omus so the password properties re-apply to the
          # existing service, otherwise plain /i. Installer arguments carry
          # VNC_PASS and are NEVER printed (only the msiexec exit code).
          $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
          New-Item -ItemType Directory -Path $diagDir -Force -ErrorAction SilentlyContinue | Out-Null
          $webdeskAuth = ''
          $vncProbeCodes = @()
          $msiUrl = 'https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi'
          # [F10-4c §5] MSI lives in the actions/cache-backed dir so subsequent
          # dispatches skip the download entirely (validated by size below).
          $msi = 'C:\ghrdp\cache\tightvnc-2.8.85.msi'
          # [F9o] VNC auth probe: vncdotool capture against 127.0.0.1:5900.
          # THE SAME TEXT IS DEFINED IN THE DEPLOY STEP AND IN THE SELF-TEST
          # STEP - keep both copies in sync (like Start-Websockify).
          # Contract: capture one frame via vncdotool; return the process exit
          # code as [int] (0 = auth verified). $Password carries VNC_PASS and
          # is NEVER printed: argument lists are not logged, captured
          # stdout/stderr files are redacted in place, and only tag + exit code
          # reach the log. Empty $Password = no -p flag (degraded-mode probe).
          # A 60s Wait-Process timeout prevents hangs (124 on timeout).
          function Invoke-VncAuthProbe([string]$Password, [string]$Tag) {
              $png = Join-Path $env:RUNNER_TEMP ('vncprobe-' + $Tag + '.png')
              $outF = Join-Path $env:RUNNER_TEMP ('vncprobe-' + $Tag + '.out')
              $errF = Join-Path $env:RUNNER_TEMP ('vncprobe-' + $Tag + '.err')
              Remove-Item -LiteralPath $png, $outF, $errF -Force -ErrorAction SilentlyContinue
              $code = -1
              try {
                  $vncExe = $null
                  try { $vncExe = (Get-Command vncdotool -ErrorAction Stop).Source } catch { }
                  if (-not $vncExe) { try { $vncExe = (Get-Command vncdo -ErrorAction Stop).Source } catch { } }
                  if ($vncExe) {
                      if ($Password) { $a = @('-s', '127.0.0.1::5900', '-p', $Password, 'capture', $png) }
                      else { $a = @('-s', '127.0.0.1::5900', 'capture', $png) }
                      $pr = Start-Process -FilePath $vncExe -ArgumentList $a -PassThru -NoNewWindow -RedirectStandardOutput $outF -RedirectStandardError $errF
                      try { $pr | Wait-Process -Timeout 60 -ErrorAction Stop; $code = [int]$pr.ExitCode } catch { try { $pr.Kill() } catch { }; $code = 124 }
                  } else {
                      try {
                          if ($Password) { $a = @('-m', 'vncdotool', '-s', '127.0.0.1::5900', '-p', $Password, 'capture', $png) }
                          else { $a = @('-m', 'vncdotool', '-s', '127.0.0.1::5900', 'capture', $png) }
                          $pr2 = Start-Process -FilePath python -ArgumentList $a -PassThru -NoNewWindow -RedirectStandardOutput $outF -RedirectStandardError $errF
                          try { $pr2 | Wait-Process -Timeout 60 -ErrorAction Stop; $code = [int]$pr2.ExitCode } catch { try { $pr2.Kill() } catch { }; $code = 124 }
                      } catch { $code = -1 }
                  }
              } catch { $code = -1 }
              try {
                  if ($Password) {
                      foreach ($f in @($outF, $errF)) {
                          if (Test-Path -LiteralPath $f) {
                              $t = [System.IO.File]::ReadAllText($f)
                              if ($t.Contains($Password)) { [System.IO.File]::WriteAllText($f, $t.Replace($Password, '[redacted]')) }
                          }
                      }
                  }
              } catch { }
              Write-Host ('[webdesk] vnc-auth-probe tag=' + $Tag + ' exit=' + $code)
              return [int]$code
          }
          function Install-TightVncMsi([string]$MsiPath, [string]$Password, [bool]$ForceFresh) {
              $props = @('ADDLOCAL=Server', 'SERVER_REGISTER_AS_SERVICE=1', 'SERVER_ADD_FIREWALL_EXCEPTION=0', 'SET_USEVNCAUTHENTICATION=1', 'VALUE_OF_USEVNCAUTHENTICATION=1', 'SET_PASSWORD=1', ('VALUE_OF_PASSWORD=' + $Password), 'SET_USECONTROLAUTHENTICATION=1', 'VALUE_OF_USECONTROLAUTHENTICATION=1', 'SET_CONTROLPASSWORD=1', ('VALUE_OF_CONTROLPASSWORD=' + $Password))
              $reinstall = $false
              if (-not $ForceFresh) {
                  try {
                      $un = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like '*TightVNC*' }
                      if ($un) { $reinstall = $true }
                  } catch { }
              }
              if ($reinstall) { $margs = @('/i', $MsiPath, '/quiet', '/norestart', 'REINSTALL=Server', 'REINSTALLMODE=omus') + $props }
              else { $margs = @('/i', $MsiPath, '/quiet', '/norestart') + $props }
              $p = Start-Process -FilePath 'msiexec.exe' -ArgumentList $margs -Wait -PassThru -NoNewWindow
              Write-Host ('[webdesk] tightvnc msiexec exit=' + $p.ExitCode + ' reinstall=' + $reinstall)
              return [int]$p.ExitCode
          }
          $inst = $false
          try {
              # [F10-4c §5] MSI download runs as a background job in PARALLEL
              # with the pip installs (independent); cache hit skips it.
              $msiJob = $null
              $needMsi = $true
              try { if ((Test-Path -LiteralPath $msi) -and ((Get-Item -LiteralPath $msi).Length -gt 1MB)) { $needMsi = $false; Write-Host ('[webdesk] tightvnc msi cache hit (' + (Get-Item -LiteralPath $msi).Length + ' bytes)') } } catch { }
              if ($needMsi) {
                  $msiJob = Start-Job -ScriptBlock { param($u,$o) Invoke-WebRequest -Uri $u -OutFile $o -UseBasicParsing -TimeoutSec 120 } -ArgumentList $msiUrl, $msi
              }
              & python -m pip install --disable-pip-version-check --quiet vncdotool 2>&1 | Select-Object -Last 3 | Out-Null
              if ($msiJob) {
                  [void](Wait-Job $msiJob -Timeout 150)
                  if ($msiJob.State -eq 'Failed') { throw ('tightvnc msi download job failed') }
                  Receive-Job $msiJob | Out-Null; Remove-Job $msiJob -Force
                  if (-not (Test-Path -LiteralPath $msi) -or ((Get-Item -LiteralPath $msi).Length -le 1MB)) { throw ('tightvnc msi download invalid after job wait') }
                  Write-Host '[webdesk] tightvnc msi downloaded (parallel job joined)'
              }
              [void](Install-TightVncMsi -MsiPath $msi -Password $vp -ForceFresh $false)
              # [F9o L2] Restart + registry: VNC loopback-only, auth ON,
              # SecurityTypes pinned to VncAuth, then verify the Password blob
              # the installer must have written (>=8 bytes). The blob VALUE is
              # never printed (only its length + ok as bool).
              $tvKey = 'HKLM:\SOFTWARE\TightVNC\Server'
              if (Test-Path -LiteralPath $tvKey) {
                  Set-ItemProperty -Path $tvKey -Name 'AcceptRfbConnections' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'UseVncAuthentication' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'AllowLoopback' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'LoopbackOnly' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'AlwaysShared' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'RemoveWallpaper' -Value 0 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'SecurityTypes' -Value 'VncAuth' -Type String -ErrorAction SilentlyContinue
                  # [F10-4a §2.3] latency tuning: poll the window under the
                  # cursor + foreground only (skip pricey full-screen polls),
                  # framebuffer compare on. TightVNC 2.8 has no server-side
                  # 'PreferZlib' key - the zlib preference is enforced
                  # client-side via the noVNC URL (compression=6, F10-3).
                  Set-ItemProperty -Path $tvKey -Name 'PollUnderCursor' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'PollForeground' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'PollFullScreen' -Value 0 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'PollConsoleOnly' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $tvKey -Name 'CompareFB' -Value 1 -Type DWord -ErrorAction SilentlyContinue
              }
              try { Restart-Service -Name 'tvnserver' -Force -ErrorAction Stop; $inst = $true } catch { Write-Host ('[webdesk] tvnserver service restart failed: ' + $_.Exception.Message) }
              try {
                  $pwdBlob = (Get-ItemProperty -Path $tvKey -Name 'Password' -ErrorAction SilentlyContinue).Password
                  $pwdLen = 0
                  if ($null -ne $pwdBlob) { $pwdLen = [int]$pwdBlob.Length }
                  Write-Host ('[webdesk] tightvnc Password blob length=' + $pwdLen + ' ok=' + ($pwdLen -ge 8))
              } catch { Write-Host '[webdesk] tightvnc Password blob read failed' }
          } catch { Write-Host '[webdesk] TightVNC install error (details withheld: installer arguments may contain VNC_PASS).' }
          if (-not $inst) {
              # [F9i] fail-closed: a GREEN run with a dead web desktop is a
              # false-LIVE (F9h rationale) - the step throws instead of exit 0.
              # Detail carries a fixed code only; installer args / exception
              # text are withheld because they may contain the secret.
              Write-Host '[webdesk] TightVNC install failed; web desktop DISABLED. Halted by design.'
              if ($S) { '### Web desktop DISABLED (TightVNC install failed; secret NOT leaked)' | Add-Content -Path $S }
              if ($S) { 'Re-dispatch the workflow for a fresh ephemeral host.' | Add-Content -Path $S }
              Set-WebdeskCfg '' 'serve-failed' 'tightvnc-install'
              throw 'Web desktop not deployed: TightVNC install failed. Halted by design. See Step Summary.'
          }
          # Install noVNC + websockify. Python is preinstalled on the runner.
          $novncDir = 'C:\ghrdp\novnc'
          try {
              if (-not (Test-Path -LiteralPath (Join-Path $novncDir 'vnc.html'))) {
                  New-Item -ItemType Directory -Path 'C:\ghrdp' -Force -ErrorAction SilentlyContinue | Out-Null
                  # [F10-4c §5] noVNC tree is cache-backed; on a cache MISS the
                  # pre-created empty dir breaks `git clone $dir` (dir must not
                  # exist) - clone into a temp dir and move the contents in.
                  $novncTmp = Join-Path $env:RUNNER_TEMP ('novnc-clone-' + [guid]::NewGuid().ToString('N'))
                  & git.exe clone --depth 1 https://github.com/novnc/noVNC.git $novncTmp 2>&1 | Select-Object -Last 3 | Out-Null
                  if (Test-Path -LiteralPath (Join-Path $novncTmp 'vnc.html')) { Copy-Item -Path (Join-Path $novncTmp '*') -Destination $novncDir -Recurse -Force; Remove-Item -LiteralPath $novncTmp -Recurse -Force -ErrorAction SilentlyContinue }
              }
              & python -m pip install --disable-pip-version-check --quiet websockify 2>&1 | Select-Object -Last 3 | Out-Null
          } catch { Write-Host ('[webdesk] noVNC/websockify install error: ' + $_.Exception.Message) }
          if (-not (Test-Path -LiteralPath (Join-Path $novncDir 'vnc.html'))) {
              # [F9i] fail-closed (see tightvnc-install block above).
              Write-Host '[webdesk] noVNC assets missing; web desktop DISABLED. Halted by design.'
              if ($S) { '### Web desktop DISABLED (noVNC clone failed)' | Add-Content -Path $S }
              if ($S) { 'Re-dispatch the workflow for a fresh ephemeral host.' | Add-Content -Path $S }
              Set-WebdeskCfg '' 'serve-failed' 'novnc-assets'
              throw 'Web desktop not deployed: noVNC/websockify assets unavailable. Halted by design. See Step Summary.'
          }
          # [F11-2 §2.1] Deploy the VNC password shim INTO the served noVNC copy.
          # The shim is written verbatim from payloads/ghrdp-cred-shim.js and a
          # single <script src> tag plus the EXACT dashboard origin (as a meta
          # tag) are injected before </body> of vnc.html. Idempotent (the marker
          # is skipped when present). No password is part of the injection, and
          # no launch URL ever carries 'password=' (launch-gates F11 enforces
          # both). The shim only accepts postMessage from that exact origin with
          # window.opener as the source.
          try {
              $shimSrc = Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-cred-shim.js'
              $shimDst = Join-Path $novncDir 'ghrdp-cred-shim.js'
              Copy-Item -LiteralPath $shimSrc -Destination $shimDst -Force
              $credOrigin = ('http://' + $rdpIp + ':7331')
              $inject = ('<meta name="ghrdp-cred-origin" content="' + $credOrigin + '"><script src="ghrdp-cred-shim.js"></script>')
              foreach ($page in @('vnc.html', 'vnc_lite.html')) {
                  $pg = Join-Path $novncDir $page
                  if (-not (Test-Path -LiteralPath $pg)) { continue }
                  $html = [System.IO.File]::ReadAllText($pg)
                  if ($html.Contains('ghrdp-cred-shim.js')) { continue }
                  if ($html.Contains('</body>')) { $html = $html.Replace('</body>', ($inject + '</body>')) } else { $html = $html + $inject }
                  [System.IO.File]::WriteAllText($pg, $html, (New-Object System.Text.UTF8Encoding($false)))
              }
              Write-Host ('[webdesk] cred shim injected: script=' + (Test-Path -LiteralPath $shimDst) + '; allowed origin=' + $credOrigin)
          } catch { Write-Host ('[webdesk] cred shim injection failed: ' + $_.Exception.Message) }
          # Wait for VNC 5900 to be LISTENING on loopback before starting websockify.
          $vncUp = $false
          for ($i = 0; $i -lt 30; $i++) {
              $c = Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue
              if ($c) { $vncUp = $true; break }
              Start-Sleep -Seconds 1
          }
          if (-not $vncUp) { Write-Host '[webdesk] VNC 5900 did not reach LISTEN in 30s' }
          # [F9o L3] AUTH PROBE: real RFB login via vncdotool. Exit 0 = the VNC
          # password gate is VERIFIED (noVNC will prompt and accept VNC_PASS).
          # Only exit codes are logged; VNC_PASS never appears in any output.
          $probeL3 = Invoke-VncAuthProbe -Password $vp -Tag 'l3'
          $vncProbeCodes += ('l3=' + $probeL3)
          $vncAuthVerified = ($probeL3 -eq 0)
          Write-Host ('[webdesk] L3 auth probe verified=' + $vncAuthVerified)
          if (-not $vncAuthVerified) {
              # [F9o L4] Probe failed: remove any manager-held TightVNC (if
              # present), fresh plain-/i msiexec with the full property list,
              # restart, re-pin registry, wait, probe again.
              Write-Host '[webdesk] L3 probe failed; L4 fresh reinstall + re-probe'
              try { & choco uninstall tightvnc -y --no-progress --limit-output 2>&1 | Select-Object -Last 5 | Out-Null } catch { }
              $LASTEXITCODE = 0
              try {
                  [void](Install-TightVncMsi -MsiPath $msi -Password $vp -ForceFresh $true)
                  $tvKey4 = 'HKLM:\SOFTWARE\TightVNC\Server'
                  if (Test-Path -LiteralPath $tvKey4) {
                      Set-ItemProperty -Path $tvKey4 -Name 'UseVncAuthentication' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                      Set-ItemProperty -Path $tvKey4 -Name 'SecurityTypes' -Value 'VncAuth' -Type String -ErrorAction SilentlyContinue
                      Set-ItemProperty -Path $tvKey4 -Name 'LoopbackOnly' -Value 1 -Type DWord -ErrorAction SilentlyContinue
                  }
                  try { Restart-Service -Name 'tvnserver' -Force -ErrorAction Stop } catch { Write-Host ('[webdesk] L4 tvnserver restart failed: ' + $_.Exception.Message) }
                  for ($i = 0; $i -lt 30; $i++) {
                      $c4 = Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue
                      if ($c4) { break }
                      Start-Sleep -Seconds 1
                  }
              } catch { Write-Host '[webdesk] L4 reinstall error (details withheld: installer arguments may contain VNC_PASS).' }
              $probeL4 = Invoke-VncAuthProbe -Password $vp -Tag 'l4'
              $vncProbeCodes += ('l4=' + $probeL4)
              $vncAuthVerified = ($probeL4 -eq 0)
              Write-Host ('[webdesk] L4 re-probe verified=' + $vncAuthVerified)
          }
          if ($vncAuthVerified) { $webdeskAuth = 'vnc' }
          else {
              # [F9o L5] LABELED DEGRADE (never silent): the password gate could
              # not be applied after a fresh reinstall. Disable VNC auth,
              # restart, and probe WITHOUT a password. Success stamps
              # webdeskAuth='none-tailnet-only' + a Step Summary WARNING; the
              # tailnet firewall (100.64.0.0/10) remains the ONLY gate. If even
              # the no-password probe fails, fail closed (vnc-auth-unverifiable).
              Write-Host '[webdesk] L5 labeled degrade: disabling VNC auth, probing without password'
              try {
                  $tvKey5 = 'HKLM:\SOFTWARE\TightVNC\Server'
                  if (Test-Path -LiteralPath $tvKey5) {
                      Set-ItemProperty -Path $tvKey5 -Name 'UseVncAuthentication' -Value 0 -Type DWord -ErrorAction SilentlyContinue
                      Set-ItemProperty -Path $tvKey5 -Name 'SecurityTypes' -Value 'None' -Type String -ErrorAction SilentlyContinue
                  }
                  try { Restart-Service -Name 'tvnserver' -Force -ErrorAction Stop } catch { Write-Host ('[webdesk] L5 tvnserver restart failed: ' + $_.Exception.Message) }
                  for ($i = 0; $i -lt 30; $i++) {
                      $c5 = Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue
                      if ($c5) { break }
                      Start-Sleep -Seconds 1
                  }
              } catch { Write-Host '[webdesk] L5 degrade error (details withheld).' }
              $probeL5 = Invoke-VncAuthProbe -Password '' -Tag 'l5-none'
              $vncProbeCodes += ('l5-none=' + $probeL5)
              if ($probeL5 -eq 0) {
                  $webdeskAuth = 'none-tailnet-only'
                  Write-Host '::warning::VNC password gate could not be applied; access limited to tailnet firewall 100.64.0.0/10; rotate VNC_PASS and re-dispatch to restore the gate'
                  if ($S) { '### WARNING: VNC password gate could not be applied; access limited to tailnet firewall 100.64.0.0/10; rotate VNC_PASS and re-dispatch to restore the gate' | Add-Content -Path $S }
                  Write-Host '[webdesk] L5 degraded mode verified (no-password probe exit 0); continuing tailnet-only'
              } else {
                  Write-Host '[webdesk] VNC auth unverifiable in either mode; web desktop DISABLED. Halted by design.'
                  if ($S) { '### Web desktop DISABLED (VNC auth unverifiable; secret NOT leaked)' | Add-Content -Path $S }
                  if ($S) { 'Re-dispatch the workflow for a fresh ephemeral host.' | Add-Content -Path $S }
                  try { Set-Content -LiteralPath (Join-Path $diagDir 'vncprobe-codes.txt') -Value ($vncProbeCodes -join ' ') -ErrorAction SilentlyContinue } catch { }
                  Set-WebdeskCfg '' 'serve-failed' 'vnc-auth-unverifiable'
                  throw 'Web desktop not deployed: VNC auth unverifiable. Halted by design. See Step Summary.'
              }
          }
          try { Set-Content -LiteralPath (Join-Path $diagDir 'vncprobe-codes.txt') -Value ($vncProbeCodes -join ' ') -ErrorAction SilentlyContinue } catch { }
          # [F9o] TightVNC evidence tail (secret-free: service state + registry
          # presence/length only, never the Password VALUE; any VNC_PASS
          # occurrence redacted before writing).
          try {
              $tvEv = @()
              try { $tvSvc = Get-Service -Name 'tvnserver' -ErrorAction Stop; $tvEv += ('service=' + $tvSvc.Status + '/' + $tvSvc.StartType) } catch { $tvEv += 'service=(missing)' }
              try {
                  $tvP = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\TightVNC\Server' -ErrorAction Stop)
                  $tvEv += ('UseVncAuthentication=' + $tvP.UseVncAuthentication)
                  $tvEv += ('SecurityTypes=' + $tvP.SecurityTypes)
                  $tvEv += ('LoopbackOnly=' + $tvP.LoopbackOnly)
                  $pl = 0; if ($null -ne $tvP.Password) { $pl = [int]$tvP.Password.Length }
                  $tvEv += ('PasswordBlobLength=' + $pl)
              } catch { $tvEv += 'registry=(unreadable)' }
              try {
                  $logFiles = @('C:\Program Files\TightVNC\tvnserver.log', 'C:\Program Files (x86)\TightVNC\tvnserver.log')
                  $found = $false
                  foreach ($lf in $logFiles) {
                      if (Test-Path -LiteralPath $lf) {
                          $found = $true
                          $tlines = [System.IO.File]::ReadAllLines($lf) | Select-Object -Last 25
                          $tvEv += ('logfile=' + $lf)
                          foreach ($ln in $tlines) { $tvEv += ('log|' + $ln) }
                      }
                  }
                  if (-not $found) { $tvEv += 'logfile=(none found under Program Files TightVNC)' }
              } catch { $tvEv += 'logfile=(read error)' }
              try {
                  $evts = Get-WinEvent -LogName Application -MaxEvents 60 -ErrorAction Stop | Where-Object { $_.ProviderName -like '*ightVNC*' -or $_.ProviderName -like '*tvnserver*' } | Select-Object -First 8
                  foreach ($e in $evts) {
                      $m = ([string]$e.Message -replace '\s+', ' ').Trim()
                      if ($m.Length -gt 200) { $m = $m.Substring(0, 200) }
                      $tvEv += ('event|' + $m)
                  }
                  if (-not $evts) { $tvEv += 'event=(no TightVNC provider events in last 60 Application records)' }
              } catch { $tvEv += 'event=(unavailable)' }
              $tvTxt = ($tvEv -join "`n")
              if ($vp -and $tvTxt.Contains($vp)) { $tvTxt = $tvTxt.Replace($vp, '[redacted]') }
              Set-Content -LiteralPath (Join-Path $diagDir 'tightvnc-tail.txt') -Value $tvTxt -ErrorAction SilentlyContinue
          } catch { }
          # Start websockify on <rdpIp>:7333, bridging to 127.0.0.1:5900, serving noVNC.
          # [F9n] Idempotent websockify launcher (tailnet-IP bind; serve retired).
          # THE SAME TEXT IS DEFINED IN THE DEPLOY STEP AND IN THE SELF-TEST STEP -
          # the launch gate diffs the two copies, so edit both or neither.
          # Contract: kill any stale python process serving/targeting 7333, start
          # websockify on <BindIp>:7333 (noVNC dir -> VNC 127.0.0.1:5900) with
          # PAIRED redirect files, then wait up to $TimeoutSec for a LISTEN socket
          # on LocalAddress <BindIp> + LocalPort 7333 SPECIFICALLY (any other
          # interface, including loopback or 0.0.0.0, is NOT this backend).
          # Returns [bool] $true only when that tailnet listener is up.
          # $BindIp MUST be a CGNAT tailnet address (100.64-127.x.x): loopback,
          # wildcard and public binds are refused (fail-closed $false).
          # [F9i] -RedirectStandardOutput and -RedirectStandardError MUST name two
          # DIFFERENT files: Windows opens each redirect target exclusively
          # (FileShare.None), so pointing both at one file makes Start-Process
          # throw BEFORE python starts - websockify then never binds 7333 and the
          # run degrades to 'serve-failed'. websockify never receives the VNC
          # password, so neither log can carry it (argument list = dir + tailnet
          # bind + loopback VNC target + module name only).
          function Start-Websockify([int]$TimeoutSec = 20, [string]$NoVncDir = 'C:\ghrdp\novnc', [string]$BindIp = '') {
              if ($BindIp -notmatch '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') {
                  Write-Host '[webdesk] Start-Websockify: refusing to bind a non-tailnet address.'
                  return $false
              }
              $wsDir = 'C:\ghrdp\webdesk'
              $wsLog = Join-Path $wsDir 'websockify.log'
              $wsErr = Join-Path $wsDir 'websockify.err.log'
              New-Item -ItemType Directory -Path $wsDir -Force -ErrorAction SilentlyContinue | Out-Null
              # 1) stale-process cleanup: idempotent re-entry (deploy step, self-test
              #    recovery, re-dispatch on a warm host).
              try {
                  Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue |
                      Where-Object { $_.CommandLine -like '*websockify*7333*' } |
                      ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
              } catch { }
              for ($i = 0; $i -lt 10; $i++) {
                  $still = Get-NetTCPConnection -LocalAddress $BindIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
                  if (-not $still) { break }
                  Start-Sleep -Milliseconds 500
              }
              # 2) start (paired redirect files - never the same file twice).
              try {
                  Start-Process -FilePath python -ArgumentList @('-m','websockify','--web', $NoVncDir, ($BindIp + ':7333'), '127.0.0.1:5900') -RedirectStandardOutput $wsLog -RedirectStandardError $wsErr | Out-Null
              } catch {
                  Write-Host ('[webdesk] websockify start failed: ' + $_.Exception.Message)
                  return $false
              }
              # 3) wait for LISTEN on <BindIp>:7333 specifically.
              for ($i = 0; $i -lt $TimeoutSec; $i++) {
                  $c = Get-NetTCPConnection -LocalAddress $BindIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($c) { return $true }
                  Start-Sleep -Seconds 1
              }
              return $false
          }
          $wsUp = Start-Websockify -BindIp $rdpIp
          Write-Host ('[webdesk] websockify ' + $rdpIp + ':7333 LISTEN after Start-Websockify: ' + $wsUp)
          if (-not $wsUp) {
              # [F9i] fail-closed (see tightvnc-install block above). The
              # .log/.err files under C:\ghrdp\webdesk are host-local only and
              # are named in the summary so a re-dispatch can be diagnosed
              # without any secret-bearing text.
              Write-Host '[webdesk] websockify 7333 did not reach LISTEN in 20s; web desktop DISABLED. Halted by design. Logs: C:\ghrdp\webdesk\websockify.log / websockify.err.log'
              if ($S) { '### Web desktop DISABLED (websockify did not bind 7333)' | Add-Content -Path $S }
              if ($S) { 'Inspect C:\ghrdp\webdesk\websockify.log and websockify.err.log on the host for the websockify error, then re-dispatch the workflow.' | Add-Content -Path $S }
              Set-WebdeskCfg '' 'serve-failed' 'websockify-bind'
              throw ('Web desktop not deployed: websockify did not bind ' + $rdpIp + ':7333. Halted by design. See Step Summary.')
          }
          # [F9n] Tailnet-only exposure WITHOUT serve: websockify already binds
          # the tailnet address; Windows Firewall scopes inbound TCP 7333 to the
          # CGNAT range so only tailnet peers can reach it. Idempotent: the
          # same-name rule is removed first (re-dispatch on a warm host).
          try {
              Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
              New-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -Direction Inbound -Protocol TCP -LocalPort 7333 -RemoteAddress '100.64.0.0/10' -Action Allow -Profile Any -Enabled True -ErrorAction Stop | Out-Null
              Write-Host '[webdesk] firewall: GHRDP-Webdesk inbound TCP 7333 from 100.64.0.0/10 ALLOW'
          } catch {
              Write-Host ('[webdesk] firewall rule failed: ' + $_.Exception.Message)
              if ($S) { '### Web desktop DISABLED (firewall rule failed)' | Add-Content -Path $S }
              if ($S) { 'Re-dispatch the workflow for a fresh ephemeral host.' | Add-Content -Path $S }
              Set-WebdeskCfg '' 'serve-failed' 'firewall-rule'
              throw 'Web desktop not deployed: firewall-rule. Halted by design. See Step Summary.'
          }
          # [F9n] The advertised URL is built directly from the validated tailnet
          # IP - no serve mapping to verify, no fabrication beyond the validated
          # config value. [F9o] The auth mode ($webdeskAuth) was VERIFIED by the
          # ladder above: 'vnc' = password gate proven, 'none-tailnet-only' =
          # labeled degrade (firewall only, WARNING already in the summary).
          $webdeskUrl = 'http://' + $rdpIp + ':7333/vnc.html?autoconnect=1&resize=remote'
          # Write config.webdeskUrl + clear webdeskReason (safe: no password in URL).
          # Server re-reads config per request (F8a), so it sees this immediately.
          # [F9o] Stamp the VERIFIED auth mode alongside the URL.
          if (-not $webdeskAuth) { $webdeskAuth = 'vnc' }
          Set-WebdeskCfg $webdeskUrl '' '' $webdeskAuth
          Write-Host ('[webdesk] web desktop URL = ' + $webdeskUrl + ' auth=' + $webdeskAuth)
          # [F9n] diagnostics payload (secret-free) for the 'webdesk-diag'
          # artifact: the advertised URL, the bind result and the firewall rule
          # as the host sees them, plus a one-line deploy record.
          # [F9o] vncprobe-codes.txt + tightvnc-tail.txt were written by the
          # ladder above and ride along via the staging step.
          try {
              $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
              New-Item -ItemType Directory -Path $diagDir -Force -ErrorAction SilentlyContinue | Out-Null
              Add-Content -LiteralPath (Join-Path $diagDir 'deploy-verbose.txt') -Value ('webdeskUrl=' + $webdeskUrl + ' websockifyListen7333=' + $wsUp + ' webdeskAuth=' + $webdeskAuth + ' vncprobes=' + ($vncProbeCodes -join ',')) -ErrorAction SilentlyContinue
              try { (Get-NetTCPConnection -LocalPort 7333 -State Listen -ErrorAction Stop | ForEach-Object { $_.LocalAddress + ':' + $_.LocalPort + '/' + $_.OwningProcess } | Out-String) | Set-Content -LiteralPath (Join-Path $diagDir 'listener.txt') -ErrorAction SilentlyContinue } catch { }
              try { (Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction Stop | Out-String) | Set-Content -LiteralPath (Join-Path $diagDir 'firewall.txt') -ErrorAction SilentlyContinue } catch { }
          } catch { }
          Write-Host ('::notice title=Webdesk deploy::websockify ' + $rdpIp + ':7333 LISTEN=' + $wsUp + '; tailnet HTTP URL advertised: ' + [bool]$webdeskUrl + '; webdeskAuth=' + $webdeskAuth + '; vncprobes=' + ($vncProbeCodes -join ','))
          if ($S) {
              if ($webdeskAuth -eq 'none-tailnet-only') { '### Web desktop LIVE (tailnet-only, PASSWORD GATE DEGRADED - see WARNING above)' | Add-Content -Path $S }
              else { '### Web desktop LIVE (tailnet-only, VNC-password-gated)' | Add-Content -Path $S }
              ('URL: ' + $webdeskUrl) | Add-Content -Path $S
              ('Auth mode: ' + $webdeskAuth + ' (vncdotool probe exit 0)') | Add-Content -Path $S
              'transport: tailnet HTTP (WireGuard-encrypted path) + VNC password gate; tailscale serve retired due to Windows SYSTEM operator lock (401)' | Add-Content -Path $S
              'Credentials: VNC password from repo secret VNC_PASS (never printed).' | Add-Content -Path $S
              'Diagnostics artifact: webdesk-diag (staged in the workspace + uploaded after the self-test; survives a halt).' | Add-Content -Path $S
          }
          exit 0

      # [F8d] Web desktop self-test: prove the advertised tailnet-HTTP URL returns noVNC HTML
      # AND the VNC leg authenticates (F9o). Reads config.webdeskUrl (written by
      # the previous step), curls the EXACT advertised URL expecting 'noVNC',
      # then requires the mode-matching vncdotool probe (VNC_PASS in mode vnc,
      # no password in mode none-tailnet-only). PASS/FAIL + codes go to the
      # summary. FAIL clears config.webdeskUrl and sets webdeskReason=
      # serve-failed (detail self-test-failed) so the dashboard cannot claim
      # ready on a dead URL, then halts the run by design (F9i fail-closed).
      # [F9n] Classified, self-healing web-desktop self-test (serve retired).
      #  A: curl the ADVERTISED URL 3x5s, capturing status code, headers
      #     and the first 200 body bytes. HTTP-PASS = 200 + noVNC marker, then
      #     the F9o mode-matching VNC probe must ALSO exit 0 (PROOF C leg).
      #  B: advertised URL failed -> check LISTEN on <rdpIp>:7333; if the
      #     listener is gone, Start-Websockify (identical function text)
      #     rebinds it -> re-curl the advertised URL once (-> VNC probe on HTTP-PASS).
      #  C: still failing -> curl the backend ROOT http://<rdpIp>:7333/ once
      #     (same socket, evidence for the classifier).
      #  D: classify (backend-dead | firewall | marker-missing | vnc-auth),
      #     write the classification + secret-free tails to the Step Summary,
      #     write the 'webdesk-diag' payload, then halt fail-closed with
      #     webdeskReason='serve-failed' / webdeskDetail='self-test-failed'
      #     (F9l-4: the dashboard contract is unchanged - it was already right;
      #     the classification stays diagnostic-only).
      # [F9o] VNC_PASS IS referenced here (mode-matching probe) but NEVER
      # printed: probe args are not logged and outputs are redacted in place.
      # No tailscale CLI calls anywhere in this step: the 401 SYSTEM-operator lock cannot recur here.
      - name: Web desktop self-test (classified - tailnet HTTP, self-heal)
        env:
          VNC_PASS: ${{ secrets.VNC_PASS }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F9n] Classified advertised-URL -> backend-root self-test with self-heal (A/B/C/D above).
          # [F9o] Mode-matching VNC probe required on every HTTP-PASS path.
          $S = $env:GITHUB_STEP_SUMMARY
          $cfgPath = 'C:\ghrdp\config.json'
          $novncDir = 'C:\ghrdp\novnc'
          $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
          New-Item -ItemType Directory -Path $diagDir -Force -ErrorAction SilentlyContinue | Out-Null
          $verbosePath = Join-Path $diagDir 'selftest-verbose.txt'
          Set-Content -LiteralPath $verbosePath -Value ('# webdesk self-test verbose log (secret-free) ' + (Get-Date).ToUniversalTime().ToString('o')) -ErrorAction SilentlyContinue
          function VLog([string]$m) {
              Write-Host $m
              try { Add-Content -LiteralPath $verbosePath -Value (((Get-Date).ToUniversalTime().ToString('o')) + ' ' + $m) -ErrorAction SilentlyContinue } catch { }
          }
          # [F9n] Idempotent websockify launcher (tailnet-IP bind; serve retired).
          # THE SAME TEXT IS DEFINED IN THE DEPLOY STEP AND IN THE SELF-TEST STEP -
          # the launch gate diffs the two copies, so edit both or neither.
          # Contract: kill any stale python process serving/targeting 7333, start
          # websockify on <BindIp>:7333 (noVNC dir -> VNC 127.0.0.1:5900) with
          # PAIRED redirect files, then wait up to $TimeoutSec for a LISTEN socket
          # on LocalAddress <BindIp> + LocalPort 7333 SPECIFICALLY (any other
          # interface, including loopback or 0.0.0.0, is NOT this backend).
          # Returns [bool] $true only when that tailnet listener is up.
          # $BindIp MUST be a CGNAT tailnet address (100.64-127.x.x): loopback,
          # wildcard and public binds are refused (fail-closed $false).
          # [F9i] -RedirectStandardOutput and -RedirectStandardError MUST name two
          # DIFFERENT files: Windows opens each redirect target exclusively
          # (FileShare.None), so pointing both at one file makes Start-Process
          # throw BEFORE python starts - websockify then never binds 7333 and the
          # run degrades to 'serve-failed'. websockify never receives the VNC
          # password, so neither log can carry it (argument list = dir + tailnet
          # bind + loopback VNC target + module name only).
          function Start-Websockify([int]$TimeoutSec = 20, [string]$NoVncDir = 'C:\ghrdp\novnc', [string]$BindIp = '') {
              if ($BindIp -notmatch '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') {
                  Write-Host '[webdesk] Start-Websockify: refusing to bind a non-tailnet address.'
                  return $false
              }
              $wsDir = 'C:\ghrdp\webdesk'
              $wsLog = Join-Path $wsDir 'websockify.log'
              $wsErr = Join-Path $wsDir 'websockify.err.log'
              New-Item -ItemType Directory -Path $wsDir -Force -ErrorAction SilentlyContinue | Out-Null
              # 1) stale-process cleanup: idempotent re-entry (deploy step, self-test
              #    recovery, re-dispatch on a warm host).
              try {
                  Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue |
                      Where-Object { $_.CommandLine -like '*websockify*7333*' } |
                      ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
              } catch { }
              for ($i = 0; $i -lt 10; $i++) {
                  $still = Get-NetTCPConnection -LocalAddress $BindIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
                  if (-not $still) { break }
                  Start-Sleep -Milliseconds 500
              }
              # 2) start (paired redirect files - never the same file twice).
              try {
                  Start-Process -FilePath python -ArgumentList @('-m','websockify','--web', $NoVncDir, ($BindIp + ':7333'), '127.0.0.1:5900') -RedirectStandardOutput $wsLog -RedirectStandardError $wsErr | Out-Null
              } catch {
                  Write-Host ('[webdesk] websockify start failed: ' + $_.Exception.Message)
                  return $false
              }
              # 3) wait for LISTEN on <BindIp>:7333 specifically.
              for ($i = 0; $i -lt $TimeoutSec; $i++) {
                  $c = Get-NetTCPConnection -LocalAddress $BindIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($c) { return $true }
                  Start-Sleep -Seconds 1
              }
              return $false
          }
          # curl probe: returns status code, headers, first 200 body bytes,
          # curl stderr and the curl exit code (6 = resolve failure, 7/28 =
          # connect/timeout) - all secret-free. Plain HTTP: the tailnet path is
          # already WireGuard-encrypted below this socket.
          function Invoke-Probe([string]$Target, [string]$Tag) {
              $body = Join-Path $env:RUNNER_TEMP ('ws-probe-' + $Tag + '.body')
              $hdr = Join-Path $env:RUNNER_TEMP ('ws-probe-' + $Tag + '.hdr')
              $codeF = Join-Path $env:RUNNER_TEMP ('ws-probe-' + $Tag + '.code')
              $errF = Join-Path $env:RUNNER_TEMP ('ws-probe-' + $Tag + '.err')
              Remove-Item -LiteralPath $body, $hdr, $codeF, $errF -Force -ErrorAction SilentlyContinue
              $rc = -1
              try {
                  & curl.exe -s --max-time 20 -D $hdr -o $body -w '%{http_code}' $Target 1> $codeF 2> $errF
                  $rc = $LASTEXITCODE
                  $LASTEXITCODE = 0
              } catch { }
              $code = ''
              try { if (Test-Path -LiteralPath $codeF) { $code = ([System.IO.File]::ReadAllText($codeF)).Trim() } } catch { }
              $head = ''
              try { if (Test-Path -LiteralPath $hdr) { $head = ((([System.IO.File]::ReadAllLines($hdr)) | Select-Object -First 6) -join ' | ') } } catch { }
              $first = ''
              try {
                  if (Test-Path -LiteralPath $body) {
                      $t = [System.IO.File]::ReadAllText($body)
                      if ($t.Length -gt 200) { $t = $t.Substring(0, 200) }
                      $first = ($t -replace '\s+', ' ')
                  }
              } catch { }
              $err = ''
              try { if (Test-Path -LiteralPath $errF) { $err = (([System.IO.File]::ReadAllText($errF)) -replace '\s+', ' ').Trim() } } catch { }
              return [pscustomobject]@{ Code = [string]$code; Head = [string]$head; First = [string]$first; Err = [string]$err; Rc = [int]$rc }
          }
          # [F9o] VNC auth probe: vncdotool capture against 127.0.0.1:5900.
          # THE SAME TEXT IS DEFINED IN THE DEPLOY STEP AND IN THE SELF-TEST
          # STEP - keep both copies in sync (like Start-Websockify).
          # Contract: capture one frame via vncdotool; return the process exit
          # code as [int] (0 = auth verified). $Password carries VNC_PASS and
          # is NEVER printed: argument lists are not logged, captured
          # stdout/stderr files are redacted in place, and only tag + exit code
          # reach the log. Empty $Password = no -p flag (degraded-mode probe).
          # A 60s Wait-Process timeout prevents hangs (124 on timeout).
          function Invoke-VncAuthProbe([string]$Password, [string]$Tag) {
              $png = Join-Path $env:RUNNER_TEMP ('vncprobe-' + $Tag + '.png')
              $outF = Join-Path $env:RUNNER_TEMP ('vncprobe-' + $Tag + '.out')
              $errF = Join-Path $env:RUNNER_TEMP ('vncprobe-' + $Tag + '.err')
              Remove-Item -LiteralPath $png, $outF, $errF -Force -ErrorAction SilentlyContinue
              $code = -1
              try {
                  $vncExe = $null
                  try { $vncExe = (Get-Command vncdotool -ErrorAction Stop).Source } catch { }
                  if (-not $vncExe) { try { $vncExe = (Get-Command vncdo -ErrorAction Stop).Source } catch { } }
                  if ($vncExe) {
                      if ($Password) { $a = @('-s', '127.0.0.1::5900', '-p', $Password, 'capture', $png) }
                      else { $a = @('-s', '127.0.0.1::5900', 'capture', $png) }
                      $pr = Start-Process -FilePath $vncExe -ArgumentList $a -PassThru -NoNewWindow -RedirectStandardOutput $outF -RedirectStandardError $errF
                      try { $pr | Wait-Process -Timeout 60 -ErrorAction Stop; $code = [int]$pr.ExitCode } catch { try { $pr.Kill() } catch { }; $code = 124 }
                  } else {
                      try {
                          if ($Password) { $a = @('-m', 'vncdotool', '-s', '127.0.0.1::5900', '-p', $Password, 'capture', $png) }
                          else { $a = @('-m', 'vncdotool', '-s', '127.0.0.1::5900', 'capture', $png) }
                          $pr2 = Start-Process -FilePath python -ArgumentList $a -PassThru -NoNewWindow -RedirectStandardOutput $outF -RedirectStandardError $errF
                          try { $pr2 | Wait-Process -Timeout 60 -ErrorAction Stop; $code = [int]$pr2.ExitCode } catch { try { $pr2.Kill() } catch { }; $code = 124 }
                      } catch { $code = -1 }
                  }
              } catch { $code = -1 }
              try {
                  if ($Password) {
                      foreach ($f in @($outF, $errF)) {
                          if (Test-Path -LiteralPath $f) {
                              $t = [System.IO.File]::ReadAllText($f)
                              if ($t.Contains($Password)) { [System.IO.File]::WriteAllText($f, $t.Replace($Password, '[redacted]')) }
                          }
                      }
                  }
              } catch { }
              Write-Host ('[webdesk] vnc-auth-probe tag=' + $Tag + ' exit=' + $code)
              return [int]$code
          }
          $url = ''
          $rdpIp = ''
          $authMode = ''
          $vpSelf = [string]$env:VNC_PASS
          $verdictOverride = ''
          $selfVncCodes = @()
          try { & python -m pip install --disable-pip-version-check --quiet vncdotool 2>&1 | Select-Object -Last 2 | Out-Null } catch { }
          try { $cfgT = [System.IO.File]::ReadAllText($cfgPath) | ConvertFrom-Json; if ($cfgT -and $cfgT.webdeskUrl) { $url = [string]$cfgT.webdeskUrl }; if ($cfgT -and $cfgT.rdpIp) { $rdpIp = ([string]$cfgT.rdpIp).Trim() }; if ($cfgT -and $cfgT.webdeskAuth) { $authMode = [string]$cfgT.webdeskAuth } } catch { }
          if (-not $url) {
              Write-Host '[webdesk-test] SKIP: config.webdeskUrl empty (web-desktop step skipped; see its summary).'
              if ($S) { '### Web desktop self-test SKIP (no URL advertised)' | Add-Content -Path $S }
              exit 0
          }
          VLog ('[webdesk-test] advertised URL = ' + $url)
          # Backend identity: the tailnet IP from config (validated); falls back to
          # the advertised URL host when config drifted (defensive only - the deploy
          # step builds the URL from this same value).
          $checkIp = ''
          if ($rdpIp -match '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') { $checkIp = $rdpIp }
          else {
              try {
                  $uh = ([uri]$url).Host
                  if ($uh -match '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') { $checkIp = $uh }
              } catch { }
              VLog ('[webdesk-test] WARNING: config.rdpIp is not a tailnet IP; backend checks use [' + $checkIp + ']')
          }
          $backendRoot = ''
          if ($checkIp) { $backendRoot = 'http://' + $checkIp + ':7333/' }
          $listenNow = $false
          if ($checkIp) { $listenNow = [bool](Get-NetTCPConnection -LocalAddress $checkIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1) }
          $pidsNow = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | Select-Object -ExpandProperty ProcessId)
          VLog ('[webdesk-test] pre-check: tailnet-listen-7333(' + $checkIp + ')=' + $listenNow + ' websockify-pids=' + ($pidsNow -join ','))
          # A - advertised URL, 3 tries x 5s.
          $advertisedCode = ''
          $probeS = $null
          for ($i = 1; $i -le 3; $i++) {
              $probeS = Invoke-Probe $url ('advertised-' + $i)
              $advertisedCode = $probeS.Code
              VLog ('[webdesk-test] A advertised probe ' + $i + ' HTTP [' + $advertisedCode + '] curl-exit=' + $probeS.Rc + ' headers=' + $probeS.Head)
              VLog ('[webdesk-test] A advertised probe ' + $i + ' first200=' + $probeS.First)
              if ($advertisedCode -eq '200' -and $probeS.First -match 'noVNC') { break }
              Start-Sleep -Seconds 5
          }
          if ($advertisedCode -eq '200' -and $probeS.First -match 'noVNC') {
              # [F9o] HTTP marker OK - now require the mode-matching VNC probe
              # (F9o evidence: the page can load while RFB auth fails, so the
              # marker alone is NOT proof). vnc mode => VNC_PASS, degraded
              # mode => no password. Only the exit code is logged.
              $pwA = $vpSelf
              $tagA = 'selftest-vnc'
              if ($authMode -eq 'none-tailnet-only') { $pwA = ''; $tagA = 'selftest-none' }
              $codeA = Invoke-VncAuthProbe -Password $pwA -Tag $tagA
              $selfVncCodes += ($tagA + '=' + $codeA)
              try { Add-Content -LiteralPath (Join-Path $diagDir 'vncprobe-codes.txt') -Value (' ' + $tagA + '=' + $codeA) -ErrorAction SilentlyContinue } catch { }
              VLog ('[webdesk-test] A vnc-probe tag=' + $tagA + ' exit=' + $codeA + ' mode=' + $authMode)
              if ($codeA -eq 0) {
                  Write-Host ('[webdesk-test] PASS: advertised URL HTTP ' + $advertisedCode + ' with noVNC marker + VNC probe exit 0 (mode ' + $authMode + ')')
                  if ($S) { '### Web desktop self-test PASS (advertised URL HTTP 200, noVNC marker present, VNC probe exit 0)' | Add-Content -Path $S }
                  # Annotation channel: the check-run annotations are readable through
                  # the GitHub API even when the runner log zip is not, so a green
                  # self-test is provable without downloading logs.
                  Write-Host ('::notice title=Webdesk self-test PASS::advertised URL HTTP ' + $advertisedCode + ' with noVNC marker + VNC probe exit 0; tailnet listener on ' + $checkIp + ':7333 present: ' + $listenNow)
                  exit 0
              }
              $verdictOverride = 'vnc-auth'
              VLog ('[webdesk-test] A HTTP marker OK but VNC probe failed; falling through to D as vnc-auth')
          }
          # B - self-heal: listener gone -> rebind with the production launcher.
          $listenAfter = $listenNow
          if (-not $listenAfter -and $checkIp) {
              VLog '[webdesk-test] B tailnet listener missing - calling Start-Websockify (F9n)'
              $started = Start-Websockify -BindIp $checkIp
              VLog ('[webdesk-test] B Start-Websockify returned ' + $started)
              $listenAfter = [bool](Get-NetTCPConnection -LocalAddress $checkIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1)
              VLog ('[webdesk-test] B listener present after heal: ' + $listenAfter)
              if ($listenAfter) {
                  $probeS = Invoke-Probe $url 'advertised-healed'
                  $advertisedCode = $probeS.Code
                  VLog ('[webdesk-test] B advertised re-probe HTTP [' + $advertisedCode + '] curl-exit=' + $probeS.Rc + ' first200=' + $probeS.First)
                  if ($advertisedCode -eq '200' -and $probeS.First -match 'noVNC') {
                      # [F9o] Healed HTTP marker OK - the VNC probe is still required.
                      $pwB = $vpSelf
                      $tagB = 'selftest-vnc-healed'
                      if ($authMode -eq 'none-tailnet-only') { $pwB = ''; $tagB = 'selftest-none-healed' }
                      $codeB = Invoke-VncAuthProbe -Password $pwB -Tag $tagB
                      $selfVncCodes += ($tagB + '=' + $codeB)
                      try { Add-Content -LiteralPath (Join-Path $diagDir 'vncprobe-codes.txt') -Value (' ' + $tagB + '=' + $codeB) -ErrorAction SilentlyContinue } catch { }
                      VLog ('[webdesk-test] B vnc-probe tag=' + $tagB + ' exit=' + $codeB + ' mode=' + $authMode)
                      if ($codeB -eq 0) {
                          Write-Host ('[webdesk-test] PASS after websockify rebind: HTTP ' + $advertisedCode + ' + noVNC marker + VNC probe exit 0')
                          if ($S) { '### Web desktop self-test PASS after websockify rebind (HTTP 200, noVNC marker present, VNC probe exit 0)' | Add-Content -Path $S }
                          Write-Host ('::notice title=Webdesk self-test PASS (self-healed)::advertised URL HTTP ' + $advertisedCode + ' with noVNC marker + VNC probe exit 0 after the websockify rebind')
                          exit 0
                      }
                      $verdictOverride = 'vnc-auth'
                      VLog '[webdesk-test] B healed HTTP marker OK but VNC probe failed; falling through to D as vnc-auth'
                  }
              }
          }
          # C - backend root probe (same socket, path /): evidence for D.
          $probeR = $null
          if ($backendRoot) {
              $probeR = Invoke-Probe $backendRoot 'backend-root'
              VLog ('[webdesk-test] C backend-root probe HTTP [' + $probeR.Code + '] curl-exit=' + $probeR.Rc + ' first200=' + $probeR.First)
          } else {
              VLog '[webdesk-test] C backend-root probe skipped (no tailnet IP to target)'
          }
          # D - classify, record, then halt fail-closed.
          $rcS = -1
          $errS = ''
          if ($probeS) { $rcS = [int]$probeS.Rc; $errS = [string]$probeS.Err }
          $verdict = 'marker-missing'
          if (-not $listenAfter) { $verdict = 'backend-dead' }
          elseif ($rcS -in @(7, 28) -or $advertisedCode -eq '') { $verdict = 'firewall' }
          if ($verdictOverride -eq 'vnc-auth') { $verdict = 'vnc-auth' }
          VLog ('[webdesk-test] D classification = ' + $verdict + ' (advertisedHttp=[' + $advertisedCode + '] advertisedCurlExit=' + $rcS + ' listenAfterHeal=' + $listenAfter + ' checkIp=' + $checkIp + ' authMode=' + $authMode + ')')
          $evLines = @()
          $evLines += ('classification=' + $verdict)
          $evLines += ('advertisedUrl=' + $url)
          $evLines += ('advertisedHttpCode=' + $advertisedCode)
          $evLines += ('backendRoot=' + $backendRoot)
          $evLines += ('tailnetListenAfterHeal=' + $listenAfter)
          $evLines += ('checkIp=' + $checkIp)
          $evLines += ('tailnetListenPre=' + $listenNow)
          $evLines += ('websockifyPidsPre=' + ($pidsNow -join ','))
          $evLines += ('webdeskAuthMode=' + $authMode)
          $evLines += ('selftestVnc=' + ($selfVncCodes -join ','))
          if ($probeS) {
              $evLines += ('advertisedProbeHeaders=' + $probeS.Head)
              $evLines += ('advertisedProbeFirst200=' + $probeS.First)
              $evLines += ('advertisedProbeCurlExit=' + $probeS.Rc)
              $evLines += ('advertisedProbeErr=' + $probeS.Err)
          }
          if ($probeR) {
              $evLines += ('backendRootHttpCode=' + $probeR.Code)
              $evLines += ('backendRootFirst200=' + $probeR.First)
              $evLines += ('backendRootCurlExit=' + $probeR.Rc)
          }
          try {
              $fwTxt = ((Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction Stop | Out-String) -replace '\s+', ' ').Trim()
              if ($fwTxt.Length -gt 300) { $fwTxt = $fwTxt.Substring(0, 300) }
              $evLines += ('firewallRule=' + $fwTxt)
          } catch { $evLines += 'firewallRule=(GHRDP-Webdesk rule missing)' }
          try { Set-Content -LiteralPath (Join-Path $diagDir 'classification.txt') -Value ($evLines -join "`n") -ErrorAction SilentlyContinue } catch { }
          $errTail = $errS
          if ($errTail.Length -gt 160) { $errTail = $errTail.Substring(0, 160) }
          if ($S) {
              ('### Web desktop self-test FAIL (classified: ' + $verdict + ')') | Add-Content -Path $S
              if ($verdict -eq 'vnc-auth') {
                  ('VNC probe failed in mode [' + $authMode + '] although the HTTP marker was OK (selftestVnc=' + ($selfVncCodes -join ',') + '). See vncprobe-codes.txt + tightvnc-tail.txt in webdesk-diag.') | Add-Content -Path $S
              } else {
                  ('Advertised URL: ' + $url + ' -> HTTP [' + $advertisedCode + '] (curl exit ' + $rcS + ')') | Add-Content -Path $S
                  ('Backend root: ' + $backendRoot + ' (listener on ' + $checkIp + ':7333 after heal: ' + $listenAfter + ')') | Add-Content -Path $S
              }
              ('Firewall rule GHRDP-Webdesk present: ' + ([bool](Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction SilentlyContinue))) | Add-Content -Path $S
              ('Tail (secret-free): ' + $errTail) | Add-Content -Path $S
              'Diagnostics artifact: webdesk-diag (websockify.log, websockify.err.log, selftest-verbose.txt, classification.txt, listener.txt, firewall.txt, vncprobe-codes.txt, tightvnc-tail.txt)' | Add-Content -Path $S
              'Advertised URL cleared; reason=serve-failed, detail=self-test-failed. Halted by design - fix the classified leg and re-dispatch.' | Add-Content -Path $S
          }
          # [F9l-4] LOCKED contract - fail-closed, and the classification stays
          # OUT of the dashboard-facing codes: config.webdeskReason is exactly
          # 'serve-failed' and config.webdeskDetail is exactly 'self-test-failed'
          # (the codes /api/native-status and ui.html already render). The
          # backend-dead | firewall | marker-missing | vnc-auth classification
          # is diagnostic only - it lives in the Step Summary, the annotation
          # and the 'webdesk-diag' artifact, never in config.json, so the
          # dashboard messaging does not oscillate.
          if ($verdict -eq 'vnc-auth') { Write-Host '[webdesk-test] FAIL (classified: vnc-auth): HTTP marker OK but the mode-matching VNC probe failed; clearing advertised URL. Halted by design.' }
          else { Write-Host ('[webdesk-test] FAIL (classified: ' + $verdict + '): advertised URL did not serve noVNC after self-heal; clearing advertised URL. Halted by design.') }
          # Annotation channel for the classification (survives the missing
          # runner-log zip and is visible in the Checks tab next to the run).
          Write-Host ('::error title=Webdesk self-test FAIL (classified: ' + $verdict + ')::' + ($evLines -join ' | '))
          try {
              $encT = New-Object System.Text.UTF8Encoding($false)
              $cfgF = [System.IO.File]::ReadAllText($cfgPath) | ConvertFrom-Json
              if ($cfgF.PSObject.Properties['webdeskUrl']) { $cfgF.webdeskUrl = '' } else { $cfgF | Add-Member -NotePropertyName webdeskUrl -NotePropertyValue '' -Force }
              if ($cfgF.PSObject.Properties['webdeskReason']) { $cfgF.webdeskReason = 'serve-failed' } else { $cfgF | Add-Member -NotePropertyName webdeskReason -NotePropertyValue 'serve-failed' -Force }
              if ($cfgF.PSObject.Properties['webdeskDetail']) { $cfgF.webdeskDetail = 'self-test-failed' } else { $cfgF | Add-Member -NotePropertyName webdeskDetail -NotePropertyValue 'self-test-failed' -Force }
              if ($cfgF.PSObject.Properties['webdeskAuth']) { $cfgF.webdeskAuth = '' }
              [System.IO.File]::WriteAllText($cfgPath, ($cfgF | ConvertTo-Json -Depth 10), $encT)
          } catch { Write-Host ('[webdesk-test] config clear failed: ' + $_.Exception.Message) }
          # [F9n] listener snapshot into the artifact payload (replaces the retired
          # serve-status refresh: no tailscale CLI calls anywhere in this step).
          try { (Get-NetTCPConnection -LocalPort 7333 -State Listen -ErrorAction Stop | ForEach-Object { $_.LocalAddress + ':' + $_.LocalPort + '/' + $_.OwningProcess } | Out-String) | Set-Content -LiteralPath (Join-Path $diagDir 'listener.txt') -ErrorAction SilentlyContinue } catch { }
          # [F9o] TightVNC service snapshot on the FAIL path (secret-free).
          try {
              $tvS = ''
              try { $s9 = Get-Service -Name 'tvnserver' -ErrorAction Stop; $tvS = ('tvnserver=' + $s9.Status) } catch { $tvS = 'tvnserver=(missing)' }
              Add-Content -LiteralPath (Join-Path $diagDir 'classification.txt') -Value $tvS -ErrorAction SilentlyContinue
          } catch { }
          throw ('Web desktop self-test FAILED (classified: ' + $verdict + '): advertised URL did not verify (HTTP marker + mode-matching VNC probe). Halted by design. See Step Summary + webdesk-diag artifact.')
      # [F9l-3] Survivable diagnostics. Two steps: stage the payload inside the
      # WORKSPACE (upload-artifact v4 refuses absolute paths outside its root
      # directory - proven by the lab: "rootDirectory D:\a\... is not a parent
      # directory of the file C:\ghrdp\webdesk\websockify.log"), then upload it
      # with `if: always()` so it exists even when the deploy step or the
      # self-test halts the run (the F9l post-mortem was blind precisely
      # because the ephemeral VM took its logs with it and nothing was
      # uploaded). Secret-free by construction: websockify never receives the
      # VNC password, and every staged file is produced by code that prints
      # only redacted/plaintext diagnostics (URLs, HTTP codes, curl exits,
      # listener + firewall snapshots, vncdotool exit codes, TightVNC tails).
      - name: Web desktop diagnostics staging (workspace-relative)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'webdesk-diag'
          New-Item -ItemType Directory -Path $stage -Force -ErrorAction SilentlyContinue | Out-Null
          $manifest = @()
          $manifest += ('staged-at=' + (Get-Date).ToUniversalTime().ToString('o'))
          foreach ($f in @('C:\ghrdp\webdesk\websockify.log', 'C:\ghrdp\webdesk\websockify.err.log')) {
              try {
                  if (Test-Path -LiteralPath $f) {
                      $dest = Join-Path $stage ([System.IO.Path]::GetFileName($f))
                      Copy-Item -LiteralPath $f -Destination $dest -Force -ErrorAction Stop
                      $manifest += ('host-file=' + $f + ' bytes=' + (Get-Item -LiteralPath $dest).Length)
                  } else { $manifest += ('host-file=' + $f + ' MISSING') }
              } catch { $manifest += ('host-file=' + $f + ' copy-error=' + $_.Exception.Message) }
          }
          try {
              if (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'webdesk-diag')) {
                  Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'webdesk-diag\*') -Destination $stage -Force -Recurse -ErrorAction SilentlyContinue
              }
          } catch { }
          # [F9n] listener + firewall snapshots (serve retired: no tailscale CLI).
          # [F9o] vncprobe-codes.txt + tightvnc-tail.txt ride along from RUNNER_TEMP.
          foreach ($vf in @('vncprobe-codes.txt', 'tightvnc-tail.txt')) {
              if (Test-Path -LiteralPath (Join-Path $stage $vf)) { $manifest += ($vf + '=present') }
              else { $manifest += ($vf + '=missing') }
          }
          try {
              (Get-NetTCPConnection -LocalPort 7333 -State Listen -ErrorAction Stop | ForEach-Object { $_.LocalAddress + ':' + $_.LocalPort + '/' + $_.OwningProcess } | Out-String) | Set-Content -LiteralPath (Join-Path $stage 'listener.txt') -ErrorAction SilentlyContinue
              $manifest += 'listener=refreshed'
          } catch { $manifest += 'listener=unavailable' }
          try {
              (Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction Stop | Out-String) | Set-Content -LiteralPath (Join-Path $stage 'firewall.txt') -ErrorAction SilentlyContinue
              $manifest += 'firewall=refreshed'
          } catch { $manifest += 'firewall=unavailable' }
          Set-Content -LiteralPath (Join-Path $stage 'MANIFEST.txt') -Value ($manifest -join "`n") -ErrorAction SilentlyContinue
          Write-Host ('[webdesk-diag] staged ' + (Get-ChildItem -LiteralPath $stage -ErrorAction SilentlyContinue).Count + ' file(s) in ' + $stage)

      - name: Web desktop diagnostics artifact (survives halts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdesk-diag
          if-no-files-found: warn
          retention-days: 14
          path: webdesk-diag

      - name: Start Mission Control dashboard EARLY (PS 7331, SYSTEM task, confirm LISTENING)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $okFile = Join-Path $root 'server-ok.txt'
          Remove-Item -LiteralPath $okFile -Force -ErrorAction SilentlyContinue
          $pwshPath = 'powershell.exe'
          try { $c = Get-Command pwsh.exe -ErrorAction Stop; if ($c) { $pwshPath = $c.Source } } catch { }
          $argLine = ('-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f (Join-Path $root 'ghrdp-server.ps1'))
          try {
              $action = New-ScheduledTaskAction -Execute $pwshPath -Argument $argLine
              $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(2)
              $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpServer' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              Start-ScheduledTask -TaskName 'GhrdpServer' -ErrorAction Stop
              Write-Host '[dashboard] GhrdpServer SYSTEM task started'
          } catch {
              Write-Host ('[dashboard] task registration failed: ' + $_.Exception.Message + ' (falling back to background process)')
          }
          $listening = $false
          for ($i = 0; $i -lt 30; $i++) {
              if (Test-Path -LiteralPath $okFile) {
                  $txt = ''
                  try { $txt = [System.IO.File]::ReadAllText($okFile) } catch { }
                  if ($txt.StartsWith('LISTENING')) { $listening = $true; break }
                  if ($txt.StartsWith('LISTEN_FAIL')) { break }
              }
              $tcp = $null
              try { $tcp = Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction SilentlyContinue } catch { }
              if ($tcp) { $listening = $true; break }
              Start-Sleep -Seconds 2
          }
          if (-not $listening) {
              try {
                  Start-Process -FilePath $pwshPath -ArgumentList $argLine -WindowStyle Hidden
                  Write-Host '[dashboard] background fallback process launched'
              } catch {
                  Write-Host ('[dashboard] background fallback failed: ' + $_.Exception.Message)
              }
              for ($i = 0; $i -lt 30; $i++) {
                  if (Test-Path -LiteralPath $okFile) {
                      $txt = ''
                      try { $txt = [System.IO.File]::ReadAllText($okFile) } catch { }
                      if ($txt.StartsWith('LISTENING')) { $listening = $true; break }
                  }
                  $tcp = $null
                  try { $tcp = Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction SilentlyContinue } catch { }
                  if ($tcp) { $listening = $true; break }
                  Start-Sleep -Seconds 2
              }
          }
          if ($listening) {
              Write-Host '[dashboard] CONFIRMED PowerShell dashboard listening on 0.0.0.0:7331 (before any public link is printed)'
          } else {
              Write-Host '[dashboard] WARNING: 7331 listener not confirmed; Serve setup will still be attempted. RDP itself is unaffected.'
          }
          exit 0

      - name: Start Rust WebSocket dashboard (build, verify, GhrdpRustDash, acceptance, advertise)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $rustSrc = Join-Path $env:RUNNER_TEMP 'ghrdp-rust'
          $exe = Join-Path $rustSrc 'target\release\ghrdp-dash.exe'
          $okFile = Join-Path $root 'rust-ok.txt'
          Remove-Item -LiteralPath $okFile -Force -ErrorAction SilentlyContinue
          try { Unregister-ScheduledTask -TaskName 'GhrdpRustDash' -Confirm:$false -ErrorAction SilentlyContinue } catch { }
          $built = $false
          if (Test-Path -LiteralPath (Join-Path $rustSrc 'Cargo.toml')) {
              & rustup.exe default stable 2>$null
              $LASTEXITCODE = 0
              for ($a = 1; $a -le 2; $a++) {
                  Push-Location $rustSrc
                  try {
                      & cargo.exe build --release 2>&1 | ForEach-Object { Write-Host $_ }
                      $code = $LASTEXITCODE
                      $LASTEXITCODE = 0
                      Write-Host ('[rust] cargo build --release attempt {0} exit={1}' -f $a, $code)
                      if ($code -eq 0) { $built = $true }
                  } catch {
                      Write-Host ('[rust] build attempt {0} error: {1}' -f $a, $_.Exception.Message)
                  } finally {
                      Pop-Location
                  }
                  if ($built) { break }
                  Start-Sleep -Seconds 5
              }
          } else {
              Write-Host ('[rust] ERROR: Cargo.toml not found in ' + $rustSrc + ' - the Rust source step did not run or failed')
          }
          $exeOk = $false
          if ($built -and (Test-Path -LiteralPath $exe)) {
              $size = (Get-Item -LiteralPath $exe).Length
              if ($size -gt 100KB) {
                  $exeOk = $true
                  Write-Host ('[rust] exe verified: {0} bytes' -f $size)
              } else {
                  Write-Host ('[rust] exe too small ({0} bytes) - treating as build failure' -f $size)
              }
          }
          if (-not $exeOk) {
              Write-Host '[rust] HONEST DEGRADATION: Rust build failed - NO 7332 URL will be printed or advertised anywhere; the PowerShell dashboard on 7331 serves this run.'
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_AVAILABLE=false'
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_URL='
              [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'false', (New-Object System.Text.UTF8Encoding($false)))
              exit 0
          }
          New-Item -ItemType Directory -Path (Join-Path $root 'rust') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'rust\static') -Force | Out-Null
          Copy-Item -Path $exe -Destination (Join-Path $root 'rust\ghrdp-dash.exe') -Force
          if (Test-Path -LiteralPath (Join-Path $root 'ui.html')) {
              Copy-Item -Path (Join-Path $root 'ui.html') -Destination (Join-Path $root 'rust\static\index.html') -Force -ErrorAction SilentlyContinue
          }
          & icacls.exe (Join-Path $root 'rust') /grant 'Users:(OI)(CI)RX' 2>$null | Out-Null
          $LASTEXITCODE = 0
          $rustExe = Join-Path $root 'rust\ghrdp-dash.exe'
          $started = $false
          try {
              $action = New-ScheduledTaskAction -Execute $rustExe -Argument '' -WorkingDirectory $root
              $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(2)
              $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpRustDash' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              Start-ScheduledTask -TaskName 'GhrdpRustDash' -ErrorAction Stop
              $started = $true
              Write-Host '[rust] GhrdpRustDash SYSTEM task started'
          } catch {
              Write-Host ('[rust] task registration failed: ' + $_.Exception.Message + ' (falling back to background process)')
              try {
                  Start-Process -FilePath $rustExe -WorkingDirectory $root -WindowStyle Hidden
                  $started = $true
                  Write-Host '[rust] background fallback process launched'
              } catch {
                  Write-Host ('[rust] background fallback failed: ' + $_.Exception.Message)
              }
          }
          $listening = $false
          if ($started) {
              for ($i = 0; $i -lt 30; $i++) {
                  if (Test-Path -LiteralPath $okFile) {
                      $txt = ''
                      try { $txt = [System.IO.File]::ReadAllText($okFile) } catch { }
                      if ($txt.StartsWith('LISTENING')) { $listening = $true; break }
                      if ($txt.StartsWith('BIND_FAIL')) { Write-Host ('[rust] bind failure marker: ' + $txt); break }
                  }
                  $tcp = $null
                  try { $tcp = Get-NetTCPConnection -LocalPort 7332 -State Listen -ErrorAction SilentlyContinue } catch { }
                  if ($tcp) { $listening = $true; break }
                  Start-Sleep -Seconds 2
              }
          }
          Write-Host ('[rust] listening={0}' -f $listening)
          $tncOk = $false
          $healthOk = $false
          if ($listening) {
              Write-Host '[accept] on runner: Test-NetConnection 127.0.0.1 -Port 7332 ...'
              $tnc = $null
              try { $tnc = Test-NetConnection -ComputerName 127.0.0.1 -Port 7332 -WarningAction SilentlyContinue } catch { }
              if ($tnc -and $tnc.TcpTestSucceeded) { $tncOk = $true }
              Write-Host ('[accept] runner TCP 127.0.0.1:7332 -> ' + $tncOk)
              Write-Host '[accept] on runner: curl.exe -s http://127.0.0.1:7332/health ...'
              $h = & curl.exe -s --max-time 5 http://127.0.0.1:7332/health 2>$null
              $LASTEXITCODE = 0
              $hTxt = [string]($h -join '')
              Write-Host ('[accept] runner /health -> ' + $hTxt)
              if ($hTxt -match '"ok"\s*:\s*true') { $healthOk = $true }
              Write-Host ('[accept] /health ok:true -> ' + $healthOk)
          }
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ''
          try { $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim(); $LASTEXITCODE = 0 } catch { }
          if ($listening -and $tncOk -and $healthOk) {
              $rustUrl = ''
              if ($ip) { $rustUrl = 'http://' + $ip + ':7332/' }
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_AVAILABLE=true'
              Add-Content -Path $env:GITHUB_ENV -Value ("RUST_URL=" + $rustUrl)
              [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'true', (New-Object System.Text.UTF8Encoding($false)))
              Write-Host ('[rust] VERIFIED LISTENING + healthy: ' + $rustUrl + '  (tailnet-only; NOT funneled)')
          } else {
              Write-Host ('[rust] HONEST DEGRADATION: listening={0} tcp={1} health={2} - NO 7332 URL will be advertised; PowerShell dashboard on 7331 serves this run.' -f $listening, $tncOk, $healthOk)
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_AVAILABLE=false'
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_URL='
              [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'false', (New-Object System.Text.UTF8Encoding($false)))
          }
          exit 0

      - name: Expose dashboard via Tailscale Serve/Funnel + print all links
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $S = $env:GITHUB_STEP_SUMMARY
          $root = 'C:\ghrdp'
          # [F9k-guard] cascade guard: ghrdp-lib.ps1 is staged by an EARLIER step.
          # If it is absent, that earlier step halted this run - this step is the
          # cascade, not the cause. Read the FIRST failed step above.
          $lib = Join-Path $root 'ghrdp-lib.ps1'
          if (-not (Test-Path -LiteralPath $lib)) {
              Write-Host '::error::ghrdp-lib.ps1 missing - an EARLIER step halted this run. Read the FIRST failed step above; this step is a cascade, not the cause.'
              if ($env:GITHUB_STEP_SUMMARY) { '### Upstream halt: lib never staged - fix the first failed step.' | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
              exit 1
          }
          . (Join-Path $root 'ghrdp-lib.ps1')
          $cfg = Read-MirrorCfg -Path (Join-Path $root 'config.json')
          $ip = [string]$cfg.rdpIp
          $user = [string]$cfg.rdpUser
          $pass = [string]$cfg.rdpPass
          $tok = [string]$cfg.dashToken
          $keyPart = ''
          if ($tok) { $keyPart = '?key=' + $tok }
          $rustOn = ($env:RUST_AVAILABLE -eq 'true')
          $rustUrl = [string]$env:RUST_URL
          if (-not [string]$cfg.legacyIndexUrl) {
              try { $leg = Invoke-LegacyScrape -Url $global:GhrdpLegacyUrl } catch { $leg = @{ ok = $false; key = ''; links = @() }; Write-Host '[expose] legacy scrape disabled per remediation' }
              $cfg.legacyIndexUrl = $global:GhrdpLegacyUrl
              if ($leg.ok) {
                  $cfg.legacyDecryptKey = [string]$leg.key
                  $cfg.legacyLinks = @($leg.links)
                  Write-Host ('[index] legacy rentry scraped: key ' + $(if ($leg.key) { 'recovered' } else { 'not found' }) + ', ' + @($leg.links).Count + ' legacy links')
              } else {
                  Write-Host '[index] legacy page unreachable (continuing without legacy)'
              }
          }
          if (-not [string]$cfg.runnerEgressIp) {
              $eg = Get-RunnerEgressIp
              if ($eg) {
                  $cfg.runnerEgressIp = $eg
                  Write-Host ('[net] runner egress IP: ' + $eg)
              } else {
                  Write-Host '[net] runner egress IP lookup failed - uploads still run on the runner'
              }
          }
          Save-MirrorCfg -Cfg $cfg -Path (Join-Path $root 'config.json')
          $legacyUrl = [string]$cfg.legacyIndexUrl
          if (-not $legacyUrl) { $legacyUrl = 'https://rentry.co/myurl0' }
          $legacyKey = [string]$cfg.legacyDecryptKey
          $rentryNew = [string]$cfg.rentryNewUrl
          $telegraph = [string]$cfg.mirrorIndexUrl
          $egress = [string]$cfg.runnerEgressIp
          $serveOk = $false
          $serveUrl = ''
          foreach ($argSet in @(
              @('--bg', 'http://127.0.0.1:7331'),
              @('--bg', '7331')
          )) {
              try {
                  $outTxt = (& $ts serve @argSet 2>$null) -join ' '
                  $code = $LASTEXITCODE
                  $LASTEXITCODE = 0
                  Write-Host ('[serve] tailscale serve {0} -> exit {1} {2}' -f ($argSet -join ' '), $code, $outTxt)
                  if ($code -eq 0) { $serveOk = $true; break }
              } catch {
                  Write-Host ('[serve] attempt error: ' + $_.Exception.Message)
              }
          }
          if ($serveOk) {
              try {
                  $st = (& $ts serve status 2>$null) -join ' '
                  $LASTEXITCODE = 0
                  $m = [regex]::Match($st, 'https://[A-Za-z0-9.\-]+\.ts\.net')
                  if ($m.Success) { $serveUrl = $m.Value }
              } catch { }
              if (-not $serveUrl -and $cfg.dnsName) { $serveUrl = 'https://' + [string]$cfg.dnsName }
          } else {
              Write-Host '[serve] tailscale serve did not succeed (dashboard still reachable at http://<ts-ip>:7331 over the tailnet)'
          }
          $funnelOk = $false
          $funnelUrl = ''
          if ($serveOk) {
              foreach ($argSet in @(
                  @('--bg', '7331'),
                  @('--bg', 'http://127.0.0.1:7331')
              )) {
                  try {
                      $outTxt = (& $ts funnel @argSet 2>$null) -join ' '
                      $code = $LASTEXITCODE
                      $LASTEXITCODE = 0
                      Write-Host ('[funnel] tailscale funnel {0} -> exit {1} {2}' -f ($argSet -join ' '), $code, $outTxt)
                      if ($code -eq 0) { $funnelOk = $true; break }
                  } catch {
                      Write-Host ('[funnel] attempt error: ' + $_.Exception.Message)
                  }
              }
          }
          if ($funnelOk) {
              if ($serveUrl) { $funnelUrl = $serveUrl } elseif ($cfg.dnsName) { $funnelUrl = 'https://' + [string]$cfg.dnsName }
              Write-Host ('[funnel] public funnel active: ' + $funnelUrl)
          } else {
              Write-Host '[funnel] Funnel not enabled (optional). Tailnet Serve already works with ZERO secrets.'
          }
          if ($cfg) {
              $cfg | Add-Member -NotePropertyName serveUrl -NotePropertyValue $serveUrl -Force
              $cfg | Add-Member -NotePropertyName funnelUrl -NotePropertyValue $funnelUrl -Force
              Save-MirrorCfg -Cfg $cfg -Path (Join-Path $root 'config.json')
          }
          $runUrl = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID
          $cancelCli = 'gh run cancel ' + $env:GITHUB_RUN_ID + ' -R ' + $env:GITHUB_REPOSITORY
          Write-Host '============================================================'
          Write-Host '  MISSION CONTROL READY  (PS 7331 verified; Rust 7332 gated)'
          Write-Host '------------------------------------------------------------'
          Write-Host ('  Tailscale IP ........: ' + $ip)
          Write-Host ('  RDP ................: mstsc /v:' + $ip + '   (user: ' + $user + ')')
          # [remediation 8D] RDP password print removed (Mission Control still serves creds host-only over tailnet).
          Write-Host ('  Dashboard (PS) .....: http://' + $ip + ':7331/' + $keyPart)
          if ($rustOn -and $rustUrl) {
              Write-Host ('  Dashboard (real-time) : ' + $rustUrl + '   (Rust, WebSocket; tailnet-only, NOT funneled)')
          } else {
              Write-Host '  Dashboard (real-time): unavailable this run (PowerShell dashboard on 7331 is serving)'
          }
          if ($serveUrl) { Write-Host ('  Dashboard (serve) ..: ' + $serveUrl + $keyPart + '   (tailnet only)') }
          if ($funnelUrl) { Write-Host ('  Dashboard (funnel) .: ' + $funnelUrl + $keyPart + '   (public)') }
          # [remediation 8D] INDEXES & KEYS banner (Legacy/New Rentry, Telegraph, decrypt keys) removed - dead mirror.
          Write-Host '  ---- EMERGENCY STOP --------------------------------------'
          Write-Host ('  web : open ' + $runUrl + '  and press "Cancel workflow"')
          Write-Host ('  cli : ' + $cancelCli + '   (copy: triple-click + Ctrl+C)')
          Write-Host '============================================================'
          if ($S) {
              '## Mission Control READY' | Add-Content -Path $S
              ('- **Tailscale IP**: ' + $ip) | Add-Content -Path $S
              # [remediation 8D] RDP password + mirror index/key lines removed from job summary.
              ('- **RDP**: `mstsc /v:' + $ip + '` as `' + $user + '` (password shown host-only in Mission Control)') | Add-Content -Path $S
              ('- **Dashboard (PS)**: http://' + $ip + ':7331/' + $keyPart) | Add-Content -Path $S
              if ($rustOn -and $rustUrl) { ('- **Dashboard (real-time)**: ' + $rustUrl) | Add-Content -Path $S } else { '- **Dashboard (real-time)**: unavailable this run (PowerShell dashboard on 7331 is serving)' | Add-Content -Path $S }
              if ($serveUrl) { ('- **Dashboard (serve)**: ' + $serveUrl + $keyPart) | Add-Content -Path $S }
              if ($funnelUrl) { ('- **Dashboard (funnel)**: ' + $funnelUrl + $keyPart) | Add-Content -Path $S }
              if ($egress) { ('- Uploads execute ON THE RUNNER (egress IP ' + $egress + ')') | Add-Content -Path $S }
              ('- Emergency stop: open the run page and Cancel workflow, or run `' + $cancelCli + '`') | Add-Content -Path $S
          }
          exit 0


      - name: Verify Pages site responds 200 (print remediation if 404)
