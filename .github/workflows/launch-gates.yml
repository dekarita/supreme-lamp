            echo 'F57: a credential appears in a URL expression' >&2; exit 1
          fi
          # §5 id lock: additive, namespaced, collision-free vs the frozen 219 and
          # every earlier additive array (raw AND dashed forms).
          python3 - <<'PY'
          import re
          def arr(path, name):
              text = open(path, encoding='utf-8').read()
              return re.findall(r'"(f5[0-9]\.[A-Za-z0-9.]+)"', re.search(name + r' = \[(.*?)\] as const;', text, re.S).group(1))
          ops = arr('src/pages/file-explorer/ids.ops.ts', 'F57_OPS_IDS')
          assert 30 <= len(ops) <= 80, ('F57 ops id lock size', len(ops))
          assert len(set(ops)) == len(ops), 'duplicate F57 ops id'
          earlier = []
          for path, name in [
              ('src/pages/search/ids.ts', 'F56_SEARCH_IDS'),
              ('src/pages/file-explorer/ids.ts', 'F57_EXPLORER_IDS'),
              ('src/pages/search/v2/ids.ts', 'F56C_V2_SEARCH_IDS'),
              ('src/pages/search/v2/ids.ts', 'F57_EXPLORER_V2_IDS'),
              ('src/pages/search/v2/ids.ts', 'F56C_V3_SEARCH_IDS'),
              ('src/pages/search/v2/ids.ts', 'F58_SEARCH_IDS'),
              ('src/pages/search/v2/ids.ts', 'F56D_SEARCH_IDS'),
          ]:
              earlier += arr(path, name)
          parent = set(re.findall(r"'([^']+)'", open('src/lib/regression-ids.ts', encoding='utf-8').read()))
          assert len(parent) == 219, ('frozen 219 changed', len(parent))
          for i in ops:
