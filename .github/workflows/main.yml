          function showCtx(ev,c){
            var m=document.getElementById("ctx");m.innerHTML="";
            function mi(label,fn,sub){var d=document.createElement("div");d.className="mi";d.tabIndex=0;d.textContent=label;d.onclick=function(e){e.stopPropagation();m.style.display="none";if(fn)fn();};d.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();d.click();}};if(sub){var s=document.createElement("div");s.className="sub";sub.forEach(function(x){var sd=document.createElement("div");sd.className="mi";sd.tabIndex=0;sd.textContent=x[0];sd.onclick=function(e){e.stopPropagation();m.style.display="none";if(x[1])x[1]();};s.appendChild(sd);});d.appendChild(s);d.onmouseenter=function(){d.classList.add("open");};}m.appendChild(d);return d;}
            if(c&&c.type==="file"){
