          vm=$(grep -nF 'name: Create the warm VM' "$wf" | head -1 | cut -d: -f1)
          test -n "$nsg" && test -n "$vm" && test "$nsg" -lt "$vm" || { echo "F60: the NSG lockdown must precede the VM create" >&2; exit 1; }
          # masking must precede the command that CONSUMES each secret value
          mask_use() {
            secret="$1"; use="$2"
            grep -qF "echo \"::add-mask::\${$secret}\"" "$wf" || { echo "F60: $secret is not add-masked" >&2; exit 1; }
            m=$(grep -nF "::add-mask::\${$secret}" "$wf" | head -1 | cut -d: -f1)
            u=$(grep -nF -- "$use" "$wf" | head -1 | cut -d: -f1)
            test -n "$m" && test -n "$u" && test "$m" -lt "$u" || { echo "F60: $secret is consumed ($use) before it is masked" >&2; exit 1; }
            echo "F60 masking OK: $secret masked at line $m, consumed at line $u ($use)"
          }
          mask_use VM_ADMIN_PASSWORD '--admin-password'
          mask_use TAILSCALE_AUTHKEY 'TailscaleAuthKey='
          mask_use GHRDP_RELEASE_READONLY_TOKEN 'RepoAccessToken='
          tok=$(grep -nF '::add-mask::$tok' "$wf" | head -1 | cut -d: -f1)
          env_line=$(grep -nF 'RUNNER_TOKEN<<F60EOF' "$wf" | head -1 | cut -d: -f1)
          test -n "$tok" && test -n "$env_line" && test "$tok" -lt "$env_line" || { echo "F60: the registration token must be masked before it is persisted" >&2; exit 1; }
          # the run-command parameters must include the spec'd set and fail closed on markers
          rc=$(awk '/name: Run scripts\/f60-bootstrap.ps1/,/name: Scrub the Run Command parameter files/' "$wf")
          for tok in "TailscaleAuthKey=" "RunnerToken=" "RepoUrl=https://github.com/" "UiReleaseTag=" "RepoRef=" "UiBundleSha=" "RepoAccessToken=" "grep -q 'BOOTSTRAP_FAILED'" "grep -q 'BOOTSTRAP_OK'"; do
            printf '%s' "$rc" | grep -qF -- "$tok" || { echo "F60: run-command step missing: $tok" >&2; exit 1; }
          done
          bs=scripts/f60-bootstrap.ps1
          for tok in "[string]\$TailscaleAuthKey" "[string]\$RunnerToken" "[string]\$RepoUrl" "[string]\$UiReleaseTag" "\$ErrorActionPreference = 'Stop'" "\$ProgressPreference = 'SilentlyContinue'" "BOOTSTRAP_OK" "BOOTSTRAP_FAILED: " "MAGICDNS=" "EMPTY sha256 pin" "SHA-256 MISMATCH for" "Test-F59AssetSha256" "--auth-key=file:" "--advertise-tags=" "tag:ghrdp-warm" "--hostname=" "--accept-routes=false" "aria2c-nssm" "qbittorrent-nssm" "ghrdp-ui-nssm" "ghrdp-server-nssm" "SERVICE_AUTO_START" "LocalSystem" "--runasservice" "--unattended" "self-hosted,windows,sl-warm" "idempotent" "Clear-F60RunCommandSecrets" "Initialize-GhrdpQbt" "Install-F60ActionsRunner" "config.cmd" "ui-dist-" "Get-F60ReleaseAsset"; do
            grep -qF -- "$tok" "$bs" || { echo "F60: f60-bootstrap.ps1 missing: $tok" >&2; exit 1; }
          done
          # no Chocolatey / ARC / K8s anywhere in the provisioning lane
          for f in "$wf" "$bs" .github/workflows/f60-warm-pins-bootstrap.yml; do
            ! grep -qiE "choco install|chocolatey install|arc generate|az aks|helm install|actions-runner-controller|larger-runner" "$f" || { echo "F60: banned approach in $f (no Chocolatey / ARC / K8s / Larger Runners)" >&2; exit 1; }
          done
          # the bootstrap must never print a secret parameter
          ! grep -nE "(Write-Host|Write-Output|Add-Content).*(\\\$TailscaleAuthKey|\\\$RunnerToken|\\\$RepoAccessToken)" "$bs" || { echo "F60: a secret parameter appears in an output statement" >&2; exit 1; }
          # the pin file must be fail-closed shaped
          python3 - <<'PYEOF'
          import json, re, sys
          pins = json.load(open('payloads/f60-warm-pins.json'))
          if pins.get('schema') != 'ghrdp-f60-warm-pins/1':
              print('F60: unexpected pins schema'); sys.exit(1)
          for name in ['tailscale_msi', 'nssm', 'node_win_x64_zip', 'actions_runner_win_x64_zip']:
              a = pins['assets'].get(name)
              if not a:
                  print('F60: pins.assets.' + name + ' missing'); sys.exit(1)
              sha = a.get('sha256', '')
              state = a.get('pin_state', '')
              if state == 'bootstrap':
                  if sha:
                      print('F60: ' + name + ' is a bootstrap pin but carries a digest (either commit the real one or empty it)'); sys.exit(1)
                  if 'bootstrap' not in (a.get('bootstrap_note') or ''):
                      print('F60: ' + name + ' must document how its pin gets filled'); sys.exit(1)
              elif not re.fullmatch(r'[0-9a-f]{64}', sha):
                  print('F60: ' + name + ' has an invalid sha256 (' + repr(sha) + ')'); sys.exit(1)
              url = a.get('url', '')
              if url:
                  if not url.startswith('https://'):
                      print('F60: ' + name + ' URL is not https'); sys.exit(1)
                  if '-latest-' in url or '/latest/' in url:
                      print('F60: ' + name + ' uses a moving latest URL - pins need an explicit version'); sys.exit(1)
          ar = pins['assets']['actions_runner_win_x64_zip']
          if ar.get('pin_state') != 'pinned':
              print('F60: the actions/runner digest is already public in the release notes - commit it'); sys.exit(1)
          if 'actions-runner-win-x64-' + ar['version'] + '.zip' not in ar['url']:
              print('F60: the runner URL does not match the pinned version'); sys.exit(1)
          reused = pins['reused_f59_assets']
          if reused.get('ui_release_tag') != 'ui-dist' or reused.get('pins_file') != 'payloads/f59-prebuilt-pins.json':
              print('F60: the F59 reuse block must keep pointing at the committed pins + the ui-dist release'); sys.exit(1)
          if reused.get('ui_verifier') != 'scripts/f59-verify-sha256.mjs':
              print('F60: the UI bundle must be verified by the shipped F59 verifier'); sys.exit(1)
          f59 = json.load(open('payloads/f59-prebuilt-pins.json'))
          for k in ['aria2c', 'qbittorrent']:
              if not re.fullmatch(r'[0-9a-f]{64}', f59['assets'][k]['sha256']):
                  print('F60: the F59 ' + k + ' pin must stay committed'); sys.exit(1)
          print('F60 pin-file gate PASS (4 F60 assets + 2 reused F59 assets, fail-closed shapes)')
          PYEOF
          # the one-time pin-recording workflow must cross-check two sources for Node
          pb=.github/workflows/f60-warm-pins-bootstrap.yml
          for tok in "SHASUMS256.txt" "Node digest CROSS-CHECK FAILED" "BEGIN SHA win-x64" "actions/runner pin MISMATCH" "f60-warm-pins.observed.json" "checksums.txt" "gh release upload warm-pins" "contents: write"; do
            grep -qF -- "$tok" "$pb" || { echo "F60: f60-warm-pins-bootstrap.yml missing: $tok" >&2; exit 1; }
          done
          # the operator doc: the 10-minute path AND the preserved manual 7 steps
          d=docs/F60-OPERATOR-SETUP.md
          for tok in "10-minute path" "sl-warm-rg" "az ad sp create-for-rbac" "--scopes /subscriptions/<SUB_ID>/resourceGroups/sl-warm-rg" "tag:ghrdp-warm" "openssl rand -base64 32" "AZURE_CREDENTIALS" "TAILSCALE_AUTHKEY" "VM_ADMIN_PASSWORD" "GHRDP_RELEASE_READONLY_TOKEN" "runner_token" "RUNNER_REGISTRATION_TOKEN" "Standard_B2s" "20-30 min" "MagicDNS" "Appendix A - manual 7-step setup" "Appendix B" "Appendix C" "HALT and STOP conditions" "deallocate"; do
            grep -qF -- "$tok" "$d" || { echo "F60: F60-OPERATOR-SETUP.md missing: $tok" >&2; exit 1; }
          done
          for n in 1 2 3 4 5 6 7; do
            grep -qE "^${n}\. \*\*" "$d" || { echo "F60: the manual appendix lost step $n" >&2; exit 1; }
          done
          echo 'F60-P gate PASS: the provisioning lane is dispatch-only, SP-scope-guarded, fully masked, pin-fail-closed and documented'
          node --test tests/f60-provision-contract.test.js
      # ---- F60 GATE 2 (counted): the warm runtime lane. Budget <60000 ms measured ----
      # ---- to a real HTTP 200, three-strike STOP on the VM, health probe fail-closed ----
      # ---- and injectable, labeled windows-latest fallback, and F59 untouched. ----
      - name: F60 warm-dispatch + health + fallback gates
        shell: bash
        run: |
          set -euo pipefail
          echo '===== F60 gate: warm dispatch lane (<60s budget, 3-strike STOP, labeled fallback) ====='
          for f in .github/workflows/warm-dispatch.yml scripts/f60-health.ps1 scripts/f60-stage-and-start.ps1 payloads/f59-timing.ps1 scripts/f59-verify-sha256.mjs; do
            test -f "$f" || { echo "F60: $f missing" >&2; exit 1; }
          done
          wf=.github/workflows/warm-dispatch.yml
          for tok in "workflow_dispatch:" "force_fallback" "budget_ms" "restart_services" "default: '60000'" "contents: read" "runs-on: [self-hosted, windows, sl-warm]" "timeout-minutes: 20" "needs: warm" "runs-on: windows-latest" "f59-windows-latest" "'-Mode', 'warm'" "'-Mode', 'cold'" "startup-timing-f60.jsonl" "Get-F60WarmBudgetVerdict" "f60-warm-strikes.json" "-MaxStrikes 3" "F60 STOP" "stay on f59-windows-latest" "RUNNER_TRACKING_ID" "scripts/f60-health.ps1" "F60_HEALTH_FAILED" "F60_HEALTH_OK" "name: startup-timing-f60-warm" "name: startup-timing-f60-fallback" "BOTH LANES RED" "report:"; do
            grep -qF -- "$tok" "$wf" || { echo "F60: warm-dispatch.yml missing: $tok" >&2; exit 1; }
          done
          # the warm lane must not read any provisioning secret and must not dispatch main.yml
          for s in TAILSCALE_AUTHKEY VM_ADMIN_PASSWORD AZURE_CREDENTIALS GHRDP_RELEASE_READONLY_TOKEN; do
            ! grep -qF "secrets.$s" "$wf" || { echo "F60: warm-dispatch.yml reads the provisioning secret $s" >&2; exit 1; }
          done
          ! grep -qE "gh workflow run|workflow: main.yml" "$wf" scripts/f60-stage-and-start.ps1 scripts/f60-health.ps1 scripts/f60-bootstrap.ps1 || { echo "F60: F60 must never dispatch another workflow" >&2; exit 1; }
          # main.yml stays untouched by F60 (additive only)
          ! grep -qF "sl-warm" .github/workflows/main.yml || { echo "F60: main.yml must not mention the warm runner" >&2; exit 1; }
          ! grep -qF "warm-dispatch" .github/workflows/main.yml || { echo "F60: main.yml must not reference the F60 lane" >&2; exit 1; }
          # the F59 rdp job must still default to windows-latest (rdp: is the last
          # job in main.yml, so compare line numbers instead of an awk range)
          rdp_line=$(grep -n '^  rdp:$' .github/workflows/main.yml | head -1 | cut -d: -f1)
          runs_line=$(grep -nF "runner_target || 'windows-latest'" .github/workflows/main.yml | head -1 | cut -d: -f1)
          test -n "$rdp_line" && test -n "$runs_line" && test "$runs_line" -gt "$rdp_line" || { echo "F60: the F59 rdp job lost its windows-latest default" >&2; exit 1; }
          echo "F60 additive check OK: main.yml rdp job (line $rdp_line) still defaults to windows-latest (line $runs_line)"
          # (main.yml legitimately names self-hosted in the dispatch CHOICE list at
          # the top of the file; the ban is on the rdp JOB, exactly like the F59 gate)
          if sed -n '/^  rdp:/,/^  [a-z][a-z-]*:/p' .github/workflows/main.yml | grep -qF 'self-hosted'; then echo 'F60: the rdp job gained a self-hosted runner' >&2; exit 1; fi
          h=scripts/f60-health.ps1
          for tok in "F60_HEALTH_OK" "F60_HEALTH_FAILED: " "f60-health.json" "[int]\$DashPort = 7331" "[int]\$UiPort = 4173" "[int]\$Aria2Port = 6800" "aria2.getVersion" "status --json" "Invoke-F60RedactText" "[scriptblock]\$ServiceProbe" "[scriptblock]\$HttpProbe" "[scriptblock]\$TailscaleProbe" "[scriptblock]\$Aria2Probe" "[switch]\$DefineOnly" "\$global:F60HealthExit" "function Get-F60WarmBudgetVerdict" "[int]\$MaxStrikes = 3" "maxStrikes = \$MaxStrikes" "stop       = (\$strikes -ge \$MaxStrikes)" "if (\$history.Count -gt 20)"; do
            grep -qF -- "$tok" "$h" || { echo "F60: f60-health.ps1 missing: $tok" >&2; exit 1; }
          done
          # the F9n lesson: `tailscale ip` 401s post-connect, so it must never be called
          # (the file's header comment names `tailscale ip` to explain why it is NOT
          # called, so only executable lines are inspected)
          if grep -vE '^[[:space:]]*#' "$h" | grep -nE "tailscale(\.exe)?[\"']? +ip\b"; then echo "F60: the health probe calls 'tailscale ip' (F9n: it 401s when the node is owned by another account)" >&2; exit 1; fi
          grep -qF 'status --json' "$h" || { echo "F60: the tailscale probe must read 'status --json' (Online + DNSName + TailscaleIPs)" >&2; exit 1; }
          s=scripts/f60-stage-and-start.ps1
          for tok in "[ValidateSet('warm', 'cold')]" "f59-verify-sha256.mjs" "Initialize-GhrdpQbt" "Get-F60ReleaseAssetInfo" "Import-F60Transport" "startup-timing-f60.jsonl" "GHRDP_F59_TIMING" "Stop-F59Step -Step 'dispatch-to-dashboard'" "ui-v2.html" "server-ok.txt" "F60_STAGE_RESULT" "\$script:F60UiFacingServices" "Start-F60ColdProcesses" "function Get-F60PayloadList"; do
            grep -qF -- "$tok" "$s" || { echo "F60: f60-stage-and-start.ps1 missing: $tok" >&2; exit 1; }
          done
          ! grep -qE "0\.0\.0\.0'\)|Address' = '0\.0\.0\.0" "$s" || { echo "F60: the stager must never bind the qBittorrent WebUI to a wildcard" >&2; exit 1; }
          # the payload list must be ONE list across the bootstrap and the stager
          python3 - <<'PYEOF'
          import re, sys
          def lst(text, marker):
              i = text.index(marker)
              j = re.search(r'\n\s*\)', text[i:])
              seg = text[i:i + j.start()]
              return re.findall(r"'([^']+)'", seg)
          boot = open('scripts/f60-bootstrap.ps1', encoding='utf-8').read()
          stage = open('scripts/f60-stage-and-start.ps1', encoding='utf-8').read()
          bl = lst(boot, 'function Get-F60StageList')
          bp = sorted(x for x in bl if x.startswith('payloads/'))
          sp = sorted(lst(stage, '$script:F60PayloadList = @('))
          st = lst(stage, '$script:F60ToolList = @(')
          bs = [x for x in bl if x.startswith('scripts/')]
          if bp != sp:
              print('F60: payload-list drift between the bootstrap and the stager'); sys.exit(1)
          missing = [x for x in st if x not in bs]
          if missing:
              print('F60: the stager needs on the VM: ' + ', '.join(missing)); sys.exit(1)
          import os
          for rel in bp + st:
              if not os.path.exists(rel):
                  print('F60: staged file does not exist: ' + rel); sys.exit(1)
          main = open('.github/workflows/main.yml', encoding='utf-8').read()
          staged = set(re.findall(r'cp (?:-f )?"?\$GITHUB_WORKSPACE/(payloads/[^"\s]+)"?', main))
          staged |= set(re.findall(r"cp -f (payloads/[^'\"\s]+)", main))
          staged |= set(re.findall(r"Copy-Item -Path '(payloads/[^']+)'", main))
          excluded = {'payloads/Cargo.toml', 'payloads/main.rs'}
          gap = sorted(x for x in staged if x not in set(sp) and x not in excluded and not x.endswith('/'))
          if gap:
              print('F60: main.yml stages payloads the F60 lane would not: ' + ', '.join(gap)); sys.exit(1)
          print('F60 stage-list gate PASS (' + str(len(bp)) + ' payloads identical, ' + str(len(st)) + ' tools, Rust exclusions documented)')
          PYEOF
          echo 'F60-W gate PASS: warm budget <60000 ms to a real HTTP 200, 3-strike STOP, fail-closed health, labeled fallback, F59 untouched'
          node --test tests/f60-warm-dispatch.test.js
      # [F62] ADDITIVE: ONE new counted bash gate. main.yml's ui-prebuilt step runs
      # from $RUNNER_TEMP/ui-dl; its repo scripts must be invoked by absolute path
      # and must resolve repo files from their own location, not CWD.
      - name: F62 build-ui script path (cwd-independent gate scripts)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/f62-build-ui-script-path.test.js
          d=$(mktemp -d); (cd "$d" && node "$GITHUB_WORKSPACE/scripts/check-regression-ids.mjs" && node "$GITHUB_WORKSPACE/scripts/check-bottom-bar-time.mjs"); rm -rf "$d"
          echo 'F62 gate PASS'

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # [F57] ADDITIVE ONLY: the Explorer real-ops live file-op lab. Every root
      # that exists on the runner gets a real new/rename/move/delete cycle and the
      # walk the watcher scan uses has to see all four states; absent roots are
      # labeled skips. The check-run annotation budget is spent by the earlier
      # mirror labs and a raw log download is not reachable from every loop, so the
      # decisive line is published as ONE commit status (context 'f57-explorer-lab')
      # on success AND failure - the same lesson the F56-d qbt step documents.
      - name: F57 explorer real-ops lab (watcher roots=6 live file ops)
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script:F57Failure = ''
          $outText = ''
          foreach ($f in @('payloads\ghrdp-watcher.ps1', 'tests\f57-explorer-ops.ps1')) {
              $errs = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $f), [ref]$null, [ref]$errs)
              if ($errs) {
                  foreach ($e in @($errs)) { Write-Host ('::error title=F57 parse::' + $f + ':' + $e.Extent.StartLineNumber + ':' + $e.Extent.StartColumnNumber + ' ' + $e.Message) }
                  $script:F57Failure = ('syntax error in ' + $f)
              }
          }
          if (-not $script:F57Failure) {
              try {
                  $outText = (& (Join-Path $env:GITHUB_WORKSPACE 'tests\f57-explorer-ops.ps1') *>&1 | Out-String)
                  $rc = $LASTEXITCODE
                  if ($rc -ne 0) { throw ('the lab exited ' + $rc) }
              } catch {
                  $script:F57Failure = $_.Exception.Message
                  $outText = ($outText + "`n" + ($_ | Out-String))
              }
          }
          Write-Host $outText
          $lines = @(($outText -split "`r?`n") | Where-Object { $_.Trim() -ne '' })
          $decisive = @($lines | Where-Object { $_ -match '::error|FAIL|ABORT' } | Select-Object -Last 1)
          if (@($decisive).Count -eq 0) { $decisive = @($lines | Select-Object -Last 1) }
          $desc = (([string](@($decisive) -join ' | ')) -replace '::error[^:]*::', '').Trim()
          if (-not $script:F57Failure) { $desc = 'watcher roots=6 live file ops lab PASS' }
          if ($desc.Length -gt 130) { $desc = $desc.Substring(0, 130) }
          if ($env:GH_TOKEN) {
              try {
                  $st = @{
                      context = 'f57-explorer-lab'
                      state = $(if ($script:F57Failure) { 'failure' } else { 'success' })
                      description = $desc
                      target_url = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
                  } | ConvertTo-Json -Compress
                  Invoke-RestMethod -Uri ('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/statuses/' + $env:GITHUB_SHA) -Method Post -Headers @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'User-Agent' = 'ghrdp-f57' } -Body $st -ContentType 'application/json' -TimeoutSec 30 | Out-Null
              } catch {
                  $detail = ''
                  try { $detail = [string]$_.ErrorDetails.Message } catch { }
                  Write-Host ('::warning title=F57 status::publish failed: ' + $_.Exception.Message + ' ' + $detail)
              }
          }
          if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## F57 explorer real-ops lab'
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('```' + "`n" + (@($lines | Select-Object -Last 40) -join "`n") + "`n" + '```')
          }
          if ($script:F57Failure) {
              Write-Host ('::error title=F57 lab::' + $script:F57Failure)
              throw ('F57: explorer real-ops lab FAILED - ' + $script:F57Failure)
          }
          Write-Host 'F57 explorer ops lab PASS'
      # [F56-d §2] ADDITIVE ONLY: the torrent lane lab. The qBittorrent cells that
      # need a live tailnet daemon report a labeled SKIP (a CI runner is not on the
      # operator's tailnet); everything policy-shaped is proven for real.
      - name: F56-d torrent lane lab (qBittorrent-nox Tailnet-only)
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The check-run annotation budget is spent by the earlier mirror labs and a
          # raw log download is not reachable from every environment (the loop-3/4
          # lesson), so the decisive line is published as ONE commit status
          # (context 'f56d-qbt-lab') on success AND failure.
          $script:QbtFailure = ''
          $outText = ''
          Push-Location $env:GITHUB_WORKSPACE
