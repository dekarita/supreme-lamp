          $ip = $cfg.rdpIp; $user = $cfg.rdpUser; $pass = $cfg.rdpPass; $ghrdp = $cfg.ghrdp; $funnel = $cfg.funnelUrl; $S = $env:GITHUB_STEP_SUMMARY
          Write-Host '============================================================'; Write-Host ('  RDP READY  IP=' + $ip + '  USER=' + $user + '  PASS=' + $pass)
