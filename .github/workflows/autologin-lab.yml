      # [F30] TLS/CIPHER HANDSHAKE FIX + CREDENTIAL TYPE NORMALIZATION + STALE
      # ENTRY PURGE - the five lab cells the F30 spec names, proven on a real
      # Windows host: (a) cipher-suite ORDER verified, (b) TLS 1.2/1.3 registry
      # keys present, (c) the launcher's purge+write cycle against MIXED
      # LegacyGeneric/Domain entries in the REAL credential store, (d) the .rdp
      # written from the SHIPPED template is > 400 bytes, (e) synthetic RDP
      # Operational events -> the collector's reason codes -> the shipped
      # dashboard row. Nothing here weakens NLA/CredSSP/cert validation, and no
      # real credential is ever created (the purge cell uses synthetic values and
      # deletes them in a finally block).
      - name: "X: F30 cipher order + TLS registry + purge cycle + .rdp floor + connLog"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          function X-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[X] stage=' + $Stage + ' :: ' + $Detail)
              'X_result=fail' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
              exit 1
          }
          $srv = [System.IO.File]::ReadAllText((Join-Path $ws 'payloads\ghrdp-server.ps1'))
          $wf  = [System.IO.File]::ReadAllText((Join-Path $ws '.github\workflows\main.yml'))
          # --- (a)/(b) the SHIPPED normalization block, parsed and DRIVEN -------
          $a = $wf.IndexOf('# [F30 §1 normalize-begin]')
          $b = $wf.IndexOf('# [F30 §1 normalize-end]')
          if ($a -lt 0 -or $b -le $a) { X-Fail 'extract' 'the F30 normalize markers are missing from main.yml' }
          $block = $wf.Substring($a, $b - $a)
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($block, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) { X-Fail 'parse' ('the normalize block has ' + $errors.Count + ' syntax error(s): ' + $errors[0].Message) }
          . ([scriptblock]::Create($block))
          if (-not (Get-Command Invoke-F30TlsNormalize -ErrorAction SilentlyContinue)) { X-Fail 'extract' 'Invoke-F30TlsNormalize was not defined by the extracted block' }
          # (a) FIXTURE FIRST: a CBC/3DES-first list must be reordered and must
          # then pass its own verdict - and the CBC-first input must FAIL it (a
          # verdict that passes everything would be vacuous).
          $fixture = @('TLS_RSA_WITH_AES_256_CBC_SHA', 'TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256', 'TLS_AES_128_GCM_SHA256', 'TLS_RSA_WITH_3DES_EDE_CBC_SHA')
          if (Test-F30Order -List $fixture -Suites $script:F30Suites) { X-Fail 'order-fixture' 'a CBC-first fixture PASSED the order verdict (vacuous)' }
          $ordered = @(Get-F30OrderedFunctions -Current $fixture -Suites $script:F30Suites)
          if (-not (Test-F30Order -List $ordered -Suites $script:F30Suites)) { X-Fail 'order-fixture' 'the reordered fixture does not satisfy the order verdict' }
          for ($i = 0; $i -lt $script:F30Suites.Count; $i++) {
              if ($ordered[$i] -ne $script:F30Suites[$i]) { X-Fail 'order-fixture' ('position ' + $i + ' is ' + $ordered[$i] + ', expected ' + $script:F30Suites[$i]) }
          }
          Write-Host '[X] (a) PASS: fixture-driven order verdict - CBC/3DES-first is rejected, GCM/ChaCha20 are moved to the front in the declared order'
          # the REAL run on this host (the windows runner is admin)
          $statePath = Join-Path $env:RUNNER_TEMP 'f30-tls-norm.json'
          $backupPath = Join-Path $env:RUNNER_TEMP 'f30-cipher-functions-original.txt'
          $r = Invoke-F30TlsNormalize -Suites $script:F30Suites -StatePath $statePath -BackupPath $backupPath -SkipServiceRestart
          Write-Host ('::notice::[X] normalize: enabled=' + $r.enabled.Count + ' failed=' + $r.failed.Count + ' orderOk=' + $r.order.ok + ' tls12Sides=' + $r.tls12Sides + ' tls13Sides=' + $r.tls13Sides + ' securityLayer=' + $r.securityLayer + ' minEncryptionLevel=' + $r.minEncryptionLevel)
          if (-not $r.order.ok) { X-Fail 'cipher-order' ('the live Schannel Functions list is not ordered: ' + $r.order.why + ' :: ' + $r.order.after) }
          $live = @()
          try { $live = @(Get-F30SuiteNames -Items @(Get-TlsCipherSuite -ErrorAction Stop)) } catch { }
          # The cmdlet view is HOST-DEPENDENT: a build that does not expose a
          # suite (typically the TLS 1.3 set) omits it from Get-TlsCipherSuite
          # entirely, so "absent from the cmdlet" is NOT "not normalized". The
          # DEFINITIVE ordered list is the Schannel Functions value this cell
          # just wrote and re-read; the cmdlet is an ADDITIONAL witness. A suite
          # the cmdlet DOES know must have been enabled, or the applier promise
          # is broken and the cell fails.
          $fnLive = @()
          try { $fnLive = @(Get-F30SuiteNames -Items @((Get-ItemProperty -Path $script:F30FunctionsKey -Name 'Functions' -ErrorAction Stop).Functions)) } catch { }
          $missingFn = @($script:F30Suites | Where-Object { $fnLive -notcontains $_ })
          if ($fnLive.Count -eq 0 -or $missingFn.Count -gt 0) { X-Fail 'cipher-live' ('the Schannel Functions list lacks ' + ($missingFn -join ', ') + ' (read back ' + $fnLive.Count + ' entries)') }
          if (-not (Test-F30Order -List $fnLive -Suites $script:F30Suites)) { X-Fail 'cipher-live' 'the Schannel Functions list is not in the declared GCM/ChaCha20-first order' }
          $missingLive = @()
          foreach ($s in $script:F30Suites) { if (-not (Test-F30SuiteIn -Items $live -Suite $s)) { $missingLive += $s } }
          $liveProbe = ('count=' + @($live).Count + ' first=<' + ([string](@($live)[0])) + '>')
          foreach ($suite in $script:F30Suites) {
              if ((Test-F30SuiteIn -Items $live -Suite $suite) -and ($r.enabled -notcontains $suite)) { X-Fail 'cipher-enable' ('the cmdlet knows ' + $suite + ' but enabling it failed :: ' + ($r.failed -join ' ; ')) }
          }
          if ($live.Count -eq 0) {
              Write-Host '::notice::[X] (a2) Get-TlsCipherSuite enumerated NOTHING on this host - the Schannel Functions read-back carries all 5 suites in the declared order'
          } elseif ($missingLive.Count -eq 0) {
              Write-Host ('::notice::[X] (a2) live Get-TlsCipherSuite carries all 5 ordered suites (cmdlet ' + $liveProbe + ')')
          } else {
              Write-Host ('::notice::[X] (a2) Get-TlsCipherSuite omits ' + ($missingLive -join ', ') + ' on this build; the Schannel Functions read-back carries all 5 in the declared order (normalize enabled=' + $r.enabled.Count + ' failed=' + $r.failed.Count + '; cmdlet ' + $liveProbe + ')')
          }
          if (-not (Test-Path -LiteralPath $statePath)) { X-Fail 'state' 'the normalization state file was not written' }
          # (b) TLS 1.2 AND 1.3, Client + Server, Enabled=1, DisabledByDefault=0
          $protoRoot = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols'
          foreach ($ver in @('TLS 1.2', 'TLS 1.3')) {
              foreach ($side in @('Client', 'Server')) {
                  $pp = Join-Path $protoRoot ($ver + '\' + $side)
                  $en = $null; $dbd = $null
                  try { $en = (Get-ItemProperty -Path $pp -Name 'Enabled' -ErrorAction Stop).Enabled } catch { X-Fail 'tls-registry' ('Enabled missing for ' + $ver + ' ' + $side) }
                  try { $dbd = (Get-ItemProperty -Path $pp -Name 'DisabledByDefault' -ErrorAction Stop).DisabledByDefault } catch { X-Fail 'tls-registry' ('DisabledByDefault missing for ' + $ver + ' ' + $side) }
                  if ($en -ne 1 -or $dbd -ne 0) { X-Fail 'tls-registry' ($ver + ' ' + $side + ' = Enabled:' + $en + ' DisabledByDefault:' + $dbd) }
              }
          }
          if ($r.securityLayer -ne 2 -or $r.minEncryptionLevel -lt 3) { X-Fail 'rdp-layer' ('SecurityLayer=' + $r.securityLayer + ' MinEncryptionLevel=' + $r.minEncryptionLevel) }
          Write-Host '[X] (b) PASS: TLS 1.2 + 1.3 Enabled=1/DisabledByDefault=0 on BOTH sides; RDP-Tcp SecurityLayer=2 + MinEncryptionLevel=3 read back'
          # --- (c) purge + write cycle against MIXED LegacyGeneric/Domain -------
          $cs = [System.IO.File]::ReadAllText((Join-Path $ws 'payloads\ghrdp-rdp-launcher.cs'))
          if ($cs -match 'cmdkey\s+\S*\s*/delete') { X-Fail 'delete-verb' 'the launcher shells out a cmdkey delete' }
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          if (-not (Test-Path -LiteralPath $csc)) { X-Fail 'csc' 'the in-box csc.exe is missing' }
          $exe = Join-Path $env:RUNNER_TEMP 'ghrdp-rdp-launcher-f30.exe'
          $cscOut = (& $csc /nologo /target:winexe /out:$exe /r:System.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll (Join-Path $ws 'payloads\ghrdp-rdp-launcher.cs') 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { X-Fail 'compile' ('csc exit ' + $LASTEXITCODE + ' :: ' + $cscOut.Trim()) }
          $purgeOut = Join-Path $env:RUNNER_TEMP 'ghrdp-f30-purge.txt'
          if (Test-Path -LiteralPath $purgeOut) { Remove-Item -LiteralPath $purgeOut -Force }
          $env:GHRDP_LAB_OUT = $purgeOut
          $pp2 = Start-Process -FilePath $exe -ArgumentList '--purge-selftest' -PassThru
          $pp2.WaitForExit()
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $purgeOut); $i++) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path -LiteralPath $purgeOut)) { X-Fail 'purge-selftest' ('--purge-selftest exit ' + $pp2.ExitCode + ' and it wrote no matrix file') }
          $pTxt = (Get-Content -LiteralPath $purgeOut -Raw).Trim()
          Write-Host $pTxt
          if ($pp2.ExitCode -ne 0) { X-Fail 'purge-selftest' ('--purge-selftest exit ' + $pp2.ExitCode + ' :: ' + $pTxt) }
          foreach ($want in @('mixedPlanted=true', 'replanted=true', 'before=domain:1+generic:1', 'purgeStale=2', 'afterPurge=domain:0+generic:0',
                             'purgeInWrite=1', 'final=domain:1+generic:1', 'domainUser=f30-fresh-user', 'genericUser=f30-fresh-user',
                             'beacon="purged 2 stale entries, wrote new as Domain"', 'verdict=pass', 'mstscLaunched=0 cmdkeyCalled=0')) {
              if (-not $pTxt.Contains($want)) { X-Fail 'purge-selftest' ('purge matrix line missing: ' + $want + ' :: ' + $pTxt) }
          }
          Write-Host '[X] (c) PASS: a LegacyGeneric(type 1) + Domain(type 2) pair planted for one fqdn was PURGED (2/2, nothing of either type left) and the fresh entry is DomainPassword with the new user; no mstsc, no cmdkey'
          # --- (d) the SHIPPED .rdp template, written the way the launcher does
          $type = [Reflection.Assembly]::LoadFrom($exe).GetType('GhrdpRdpLauncher')
          $flags = [Reflection.BindingFlags]'Static,NonPublic'
          $lines = @($type.GetMethod('RdpLines', $flags).Invoke($null, @('f30-lab.dekarita.tailnet-lab.ts.net', 'rdpuser')))
          if ($lines.Count -lt 19) { X-Fail 'rdp-template' ('the template has only ' + $lines.Count + ' directives') }
          $rdpPath = Join-Path $env:RUNNER_TEMP 'f30-lab.rdp'
