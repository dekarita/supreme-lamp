      - name: Keep Alive (5h30) - server SYSTEM task + watchdog + watcher ONLOGON
        shell: pwsh
        run: |
          & schtasks /End /TN ghrdpserver 2>$null|Out-Null; & schtasks /Delete /TN ghrdpserver /F 2>$null|Out-Null; & schtasks /End /TN ghrdpwatcher 2>$null|Out-Null; & schtasks /Delete /TN ghrdpwatcher /F 2>$null|Out-Null; $LASTEXITCODE=0
          $sd=$env:RUNNER_TEMP; $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $serverScript=Join-Path $sd 'rdp-redirect-server.ps1'; $watcherScript=Join-Path $sd 'ghrdp-watcher.ps1'; $progressPath=Join-Path $sd 'ghrdp_progress.json'; $emFlag=Join-Path $sd 'ghrdp_emergency.flag'; $flushFlag=Join-Path $sd 'ghrdp_flush.flag'; $okFile=Join-Path $sd 'ghrdp_server_ok.txt'
          Remove-Item $okFile -Force -EA 0
          $srvRun=Join-Path $sd 'ghrdp-server-run.ps1'
          $srvTpl="`$ErrorActionPreference='Continue'`r`n. '<<SS>>'`r`nStart-GhrdpServer -Port 7331 -BindAddress '0.0.0.0' -UiDir '<<SD>>' -ProgressPath '<<PR>>' -CfgPath '<<CF>>' -EmergencyFlagPath '<<EM>>' -FlushFlagPath '<<FL>>' -OkFile '<<OK>>' -LimitMinutes 330`r`n"
          $srvTpl=$srvTpl.Replace('<<SS>>',$serverScript).Replace('<<SD>>',$sd).Replace('<<PR>>',$progressPath).Replace('<<CF>>',$cfgPath).Replace('<<EM>>',$emFlag).Replace('<<FL>>',$flushFlag).Replace('<<OK>>',$okFile)
          [IO.File]::WriteAllText($srvRun,$srvTpl,(New-Object System.Text.UTF8Encoding $false))
          foreach($f in @($cfgPath,$serverScript,$watcherScript,$progressPath,$emFlag,$flushFlag,$okFile,(Join-Path $sd 'ghrdp-lib.ps1'),(Join-Path $sd 'ghrdp-ui.html'),(Join-Path $sd 'ghrdp-install.ps1'),$srvRun,(Join-Path $sd 'ghrdp-launcher.ps1'))){ if(Test-Path $f){ & icacls $f /grant "*S-1-5-18:(R)" 2>$null|Out-Null } }
          & icacls $sd /grant "*S-1-5-18:(OI)(CI)R" 2>$null|Out-Null; $LASTEXITCODE=0
          if($env:RDP_USER){ & icacls $sd /grant "$($env:RDP_USER):(OI)(CI)M" 2>$null|Out-Null; $LASTEXITCODE=0 }
          $ps="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          $srvTr="`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$srvRun`""
