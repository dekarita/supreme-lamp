      - name: Migrate myurl0 history into Pages archive (one-time, read-only on rentry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = $env:GITHUB_REPOSITORY
          $hdr = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$repo/contents/docs/archive.json"
          $sha = $null; $existing = $null
          try { $g = Invoke-RestMethod -Uri $api -Headers $hdr -ErrorAction Stop; $sha = $g.sha; $existing = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($g.content)) } catch { }
          if ($existing) {
              $arch = $existing | ConvertFrom-Json
              foreach ($s in @($arch.sessions)) { if ([string]$s.id -eq 'legacy-myurl0') { Write-Host '[migrate] legacy-myurl0 already in archive - skipping'; exit 0 } }
          }
          $raw = ''
          try { $raw = (Invoke-WebRequest -Uri 'https://rentry.co/myurl0/raw' -UseBasicParsing -TimeoutSec 20).Content } catch { }
          if (-not $raw) { Write-Host '[migrate] myurl0 unreachable - nothing to migrate'; exit 0 }
          $files = @()
          foreach ($m in [regex]::Matches($raw, '\[(?:open|download)\]\((https?://[^)]+)\)')) {
              $u = $m.Groups[1].Value
              $nm = [uri]::UnescapeDataString(($u -split '/')[-1])
              $files += [ordered]@{ n = $nm; s = [long]0; l = $u; e = 'false'; f = '.' }
          }
          $key = ''
          if ($raw -match 'LEGACY\s+decrypt\s+key[^A-Za-z0-9]{0,40}([A-Za-z0-9]{16,64})') { $key = $Matches[1] }
          elseif ($raw -match 'Current\s+decrypt\s+key[^A-Za-z0-9]{0,40}([A-Za-z0-9]{16,64})') { $key = $Matches[1] }
          elseif ($raw -match 'decrypt\s+(?:password|pw|key)[^A-Za-z0-9]{0,40}([A-Za-z0-9]{16,64})') { $key = $Matches[1] }
          $rec = [ordered]@{ id = 'legacy-myurl0'; date = ('migrated ' + (Get-Date -Format 'yyyy-MM-dd HH:mm:ss')); filesCount = $files.Count; bytes = [long]0; key = $key; telegraph = ''; rentry = 'https://rentry.co/myurl0'; files = $files }
          $sessions = @()
          if ($existing) { $sessions = @(($existing | ConvertFrom-Json).sessions) }
          $sessions = $sessions + @($rec)
          $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes((@{ sessions = $sessions } | ConvertTo-Json -Depth 8 -Compress)))
          $body = @{ message = 'migrate myurl0 history (append-only)'; content = $b64 }
          if ($sha) { $body.sha = $sha }
          Invoke-RestMethod -Uri $api -Headers $hdr -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null
          Write-Host ('[migrate] imported ' + $files.Count + ' legacy entries from myurl0 into archive.json (myurl0 untouched)')
          exit 0

      - name: Register watcher autostart (ONLOGON)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          $pwshPath = 'powershell.exe'
          try { $c = Get-Command pwsh.exe -ErrorAction Stop; if ($c) { $pwshPath = $c.Source } } catch { }
          $argLine = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-watcher.ps1"'
          $registered = $false
          try {
              $action = New-ScheduledTaskAction -Execute $pwshPath -Argument $argLine
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $user
              $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpWatcher' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              $registered = $true
              Write-Host '[watcher] GhrdpWatcher ONLOGON task registered for the RDP user'
          } catch {
              Write-Host ('[watcher] Register-ScheduledTask failed: ' + $_.Exception.Message)
          }
          if (-not $registered) {
              try {
                  & schtasks.exe /Create /F /SC ONLOGON /TN GhrdpWatcher /TR ('"{0}" {1}' -f $pwshPath, $argLine) 2>$null
                  $LASTEXITCODE = 0
                  Write-Host '[watcher] schtasks ONLOGON fallback registered'
              } catch {
                  Write-Host ('[watcher] schtasks fallback failed: ' + $_.Exception.Message)
              }
          }
          Write-Host '[watcher] autostart coverage (3 mechanisms):'
          Write-Host '  (a) startup-folder shortcut - created by the watcher itself at first logon'
          Write-Host '  (b) ONLOGON scheduled task running as the RDP user (above)'
          Write-Host '  (c) dashboard Start-watcher button + servers auto-heal the task every 60s'
          exit 0

      - name: Machine personalization + apps (Edge/Chrome/Firefox extensions + bookmarks, qBittorrent, Parsec, VB-CABLE)
        env:
          PARSEC_TOKEN: ${{ secrets.PARSEC_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ''
          try { $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim(); $LASTEXITCODE = 0 } catch { }
          $cfgPath = 'C:\ghrdp\config.json'
          $cfg = @{}
          if (Test-Path $cfgPath) { try { $cfg = Get-Content -LiteralPath $cfgPath -Raw | ConvertFrom-Json } catch { } }
          $pagesBase = [string]$cfg.pagesBase
          $defTheme = 'Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $defTheme -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $defTheme -Name 'AppsUseLightTheme' -Value 0 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $defTheme -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -ErrorAction SilentlyContinue
          $defDwm = 'Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\DWM'
