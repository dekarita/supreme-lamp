name: launch-gates
on:
  pull_request:
  push:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: D/E launch gates
        shell: bash
        run: |
          set -euo pipefail
          if grep -E -n 'powershell|-ExecutionPolicy' payloads/ui.html; then
            echo 'ui.html still contains a script-host launch' >&2
            exit 1
          fi
          if grep -E -n 'dnsName = \$ip|dnsName = \[string\]\$ip' .github/workflows/main.yml; then
            echo 'dnsName assigned from an IP' >&2
            exit 1
          fi
          if grep -E -n 'fqdnN = \[string\]\$cfgN.rdpIp|rdpTarget = \[string\]\$cfgC.rdpIp' payloads/ghrdp-server.ps1; then
            echo 'native target still falls back to rdpIp' >&2
            exit 1
          fi
          grep -q 'hostKind = $hostKind' payloads/ghrdp-server.ps1
          grep -q "hostKind = 'ephemeral'" .github/workflows/main.yml
          if grep -E -n 'RUN SETUP|RUN INSTALL' payloads/ui.html; then
            echo 'ui.html still references RUN SETUP / RUN INSTALL buttons' >&2
            exit 1
          fi
          if grep -E -n "reasons \+= 'handler-not-seen'|handler-not-seen'" payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 still builds a handler-hello reason' >&2
            exit 1
          fi
      - name: F8 web-desktop honesty gates
        shell: bash
        run: |
          set -euo pipefail
          # UI must not claim ready without a webdeskUrl: every non-comment
          # 'WEB DESKTOP ready' line must reference webdeskUrl on the same line.
          if grep -n 'WEB DESKTOP ready' payloads/ui.html | grep -v '^[0-9]*:[[:space:]]*//' | grep -v 'webdeskUrl'; then
            echo 'ui.html can claim WEB DESKTOP ready without webdeskUrl' >&2
            exit 1
          fi
          grep -q 'web desktop not deployed' payloads/ui.html
          grep -q 'webdeskReason' payloads/ui.html
          grep -q 'webdeskReason' payloads/ghrdp-server.ps1
          grep -q "webdeskReason = \$wdr" payloads/ghrdp-server.ps1
          # Web-desktop step must fail LOUD: all 6 skip paths record a reason.
          grep -q 'webdeskReason' .github/workflows/main.yml
          grep -q 'VNC_PASS not set - web desktop disabled' .github/workflows/main.yml
          step=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          n=$(printf '%s' "$step" | grep -c "Set-WebdeskCfg ''" || true)
          if [ "$n" -lt 6 ]; then
            echo "web-desktop step has silent skip paths (only $n reason writes)" >&2
            exit 1
          fi
          # No fabricated serve URL: a URL needs a real serve mapping.
          if grep -n "serveUrl = 'https://' + \$fq" .github/workflows/main.yml; then
            echo 'web-desktop step fabricates a serve URL without a mapping' >&2
            exit 1
          fi
          # Self-test step must exist and gate on the noVNC marker.
          grep -q 'Web desktop self-test' .github/workflows/main.yml
          teststep=$(awk '/Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          printf '%s' "$teststep" | grep -q 'noVNC'
          printf '%s' "$teststep" | grep -q 'self-test PASS'
          printf '%s' "$teststep" | grep -q 'self-test FAIL'
      - name: F9l web-desktop self-heal + diagnostics gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          # Region = the self-test step through the diagnostics steps (ends at
          # the dashboard step, exactly like the F8 gate).
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF")
          # Assert against CODE, never against prose: comment text must not be
          # able to satisfy (or mask) a gate.
          code=$(printf '%s' "$teststep" | grep -vE '^[[:space:]]*#')
          # A) The self-test must probe the BACKEND root directly on the tailnet
          #    bind address. An advertised-URL-only test cannot distinguish a dead
          #    websockify from a dropped tailnet path (the pre-F9n post-mortems
          #    failed exactly this way).
          if ! printf '%s' "$code" | grep -qF "'http://' + \$bindIp + ':7333/'"; then
            echo 'self-test lacks the direct backend root curl on the tailnet address' >&2
            exit 1
          fi
          # B) Dead backend must be healed by CALLING the idempotent launcher
          #    (the function definition alone proves nothing).
          if ! printf '%s' "$teststep" | grep -qF '$started = Start-Websockify'; then
            echo 'self-test cannot heal the backend leg ($started = Start-Websockify missing)' >&2
            exit 1
          fi
          # C) A failing advertised URL with a live listener must re-assert the
          #    CGNAT-only firewall rule (the leg that makes 7333 reachable from
          #    the tailnet at all).
          if ! printf '%s' "$code" | grep -qF -- '$fwHeal = Set-WebdeskFirewall'; then
            echo 'self-test does not re-assert the GHRDP-Webdesk firewall rule when healing' >&2
            exit 1
          fi
          # D) The classification tokens must exist (diagnosis, not guessing).
          for tok in backend-dead firewall marker-missing; do
            if ! printf '%s' "$code" | grep -q "$tok"; then
              echo "self-test cannot classify: '$tok' missing" >&2
              exit 1
            fi
          done
          # E) Fail-closed: the halt must still write the locked codes + throw.
          if ! printf '%s' "$code" | grep -q "\$cfgF.webdeskReason = 'serve-failed'"; then
            echo 'self-test halt no longer writes webdeskReason=serve-failed' >&2
            exit 1
          fi
          if ! printf '%s' "$code" | grep -q "throw ('Web desktop self-test FAILED"; then
            echo 'self-test halt no longer throws (fail-closed)' >&2
            exit 1
          fi
          # F) The F9l-1 launcher must exist in BOTH steps as byte-identical text
          #    (a divergent copy silently changes recovery behaviour).
          n=$(grep -c '^          function Start-Websockify(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Start-Websockify copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Start-Websockify\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Start-Websockify copies diverged - edit both or neither' >&2
            exit 1
          fi
          launcher=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF")
          if printf '%s' "$launcher" | grep -Fq -- '-WindowStyle Hidden'; then
            echo 'Start-Websockify must not hide the websockify process window' >&2
            exit 1
          fi
          # F2) The CGNAT-only firewall helper must also exist twice, identically.
          nfw=$(grep -c '^          function Set-WebdeskFirewall {' "$WF" || true)
          if [ "$nfw" -ne 2 ]; then
            echo "expected 2 Set-WebdeskFirewall copies (deploy + self-test), found $nfw" >&2
            exit 1
          fi
          fw1=$(awk '/^          function Set-WebdeskFirewall \{/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          fw2=$(awk 'BEGIN{c=0} /^          function Set-WebdeskFirewall \{/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$fw1" != "$fw2" ]; then
            echo 'the two Set-WebdeskFirewall copies diverged - edit both or neither' >&2
            exit 1
          fi
          # F3) The launcher must bind the tailnet address and refuse everything else.
          if ! printf '%s' "$launcher" | grep -qF -- "(\$BindIp + ':7333')"; then
            echo 'Start-Websockify does not bind <tailnet ip>:7333' >&2
            exit 1
          fi
          if ! printf '%s' "$launcher" | grep -qF -- '100\.(6[4-9]'; then
            echo 'Start-Websockify does not refuse non-CGNAT bind addresses' >&2
            exit 1
          fi
          if printf '%s' "$launcher" | grep -qF -- "'127.0.0.1:7333'"; then
            echo 'Start-Websockify still binds loopback:7333 - the advertised tailnet URL would be dead' >&2
            exit 1
          fi
          # G) Survivable diagnostics: the webdesk steps must stage + upload the
          #    'webdesk-diag' artifact, and the upload path must stay inside the
          #    workspace - upload-artifact v4 rejects absolute host paths
          #    (proven by the first lab run: 'rootDirectory ... is not a parent
          #    directory of the file C:\ghrdp\webdesk\websockify.log').
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          if ! printf '%s' "$webdesk_all" | grep -q 'actions/upload-artifact'; then
            echo 'web-desktop steps do not upload the diagnostics artifact' >&2
            exit 1
          fi
          if ! printf '%s' "$webdesk_all" | grep -qE '^[[:space:]]+name: webdesk-diag[[:space:]]*$'; then
            echo "web-desktop steps do not upload the 'webdesk-diag' artifact" >&2
            exit 1
          fi
          upload=$(awk '/Web desktop diagnostics artifact/{f=1} f && /^      - name: / && !/Web desktop diagnostics artifact/{exit} f' "$WF")
          if ! printf '%s' "$upload" | grep -q 'if: always()'; then
            echo 'the diagnostics upload must use if: always() (it must survive a halt)' >&2
            exit 1
          fi
          if ! printf '%s' "$upload" | grep -qE '^[[:space:]]+path: webdesk-diag[[:space:]]*$'; then
            echo 'the diagnostics upload must use the workspace-relative staging dir' >&2
            exit 1
          fi
          if printf '%s' "$upload" | grep -qE 'C:\\+ghrdp|runner\.temp'; then
            echo 'diagnostics upload uses absolute paths - upload-artifact v4 will fail (stage inside the workspace instead)' >&2
            exit 1
          fi
      - name: F9n tailnet-HTTP webdesk transport gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          SRV=payloads/ghrdp-server.ps1
          UI=payloads/ui.html
          # Region = the deploy step through the diagnostics steps (the same
          # bounds the F8 and F9l gates use).
          region=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF")
          code=$(printf '%s' "$region" | grep -vE '^[[:space:]]*#')
          # 1) The serve proxy is RETIRED from the web desktop path (Windows SYSTEM
          #    operator lock => 401 on every post-connect LocalAPI call). The one
          #    permitted mention is the mandated transport note that documents WHY
          #    it was retired; every other occurrence - a CLI invocation, a status
          #    dump, a mapping helper - fails the gate.
          if printf '%s' "$code" | grep -v 'transport: tailnet HTTP' | grep -qi 'tailscale serve'; then
            echo 'webdesk step still invokes the retired tailscale serve transport' >&2
            exit 1
          fi
          for banned in '$ts serve' 'serve set-raw' 'serve status' 'Get-WebdeskServeUrl' 'serve --help' "'--bg'"; do
            if printf '%s' "$code" | grep -qF -- "$banned"; then
              echo "webdesk step still carries serve-path code: $banned" >&2
              exit 1
            fi
          done
          # 2) The tailnet-only firewall rule must exist, be CGNAT-scoped and be
          #    idempotent (same-name rule removed first).
          if ! printf '%s' "$code" | grep -qF -- "New-NetFirewallRule -DisplayName \$fwName -Direction Inbound -Protocol TCP -LocalPort 7333 -RemoteAddress '100.64.0.0/10' -Action Allow"; then
            echo 'webdesk step lacks the GHRDP-Webdesk inbound TCP 7333 rule scoped to 100.64.0.0/10' >&2
            exit 1
          fi
          if ! printf '%s' "$code" | grep -qF -- "Remove-NetFirewallRule -DisplayName \$fwName"; then
            echo 'GHRDP-Webdesk rule is not idempotent (the same-name rule must be removed first)' >&2
            exit 1
          fi
          # 3) 7333 may never be exposed beyond the tailnet (no 0.0.0.0 bind, no
          #    any-remote rule, no funnel).
          if printf '%s' "$WF" | grep -qE '0\.0\.0\.0:7333'; then
            echo 'websockify is bound to 0.0.0.0:7333 - public exposure of the bridge' >&2
            exit 1
          fi
          if printf '%s' "$region" | grep -qE 'RemoteAddress +(Any|0\.0\.0\.0)'; then
            echo 'the 7333 firewall rule admits more than 100.64.0.0/10' >&2
            exit 1
          fi
          if printf '%s' "$region" | grep -qiE 'remoteip=(any|0\.0\.0\.0)'; then
            echo 'the netsh firewall fallback admits more than 100.64.0.0/10' >&2
            exit 1
          fi
          if printf '%s' "$code" | grep -qF 'netsh.exe advfirewall firewall add rule' && ! printf '%s' "$code" | grep -qF 'remoteip=100.64.0.0/10'; then
            echo 'the netsh firewall fallback is not scoped to the tailnet' >&2
            exit 1
          fi
          # 4) The bind address must be read from config.json .rdpIp, validated
          #    against 100.64.0.0/10, and an invalid value must fail closed -
          #    never a fabricated URL.
          if ! printf '%s' "$code" | grep -qF -- '$cW.rdpIp'; then
            echo 'webdesk step does not read the tailnet address from config.json .rdpIp' >&2
            exit 1
          fi
          if ! printf '%s' "$code" | grep -qF -- '100\.(6[4-9]'; then
            echo 'webdesk step does not validate the bind address against 100.64.0.0/10' >&2
            exit 1
          fi
          if ! printf '%s' "$code" | grep -qF -- "Set-WebdeskCfg '' 'serve-failed' 'tailnet-ip-unavailable'"; then
            echo 'webdesk step does not record tailnet-ip-unavailable' >&2
            exit 1
          fi
          if ! printf '%s' "$code" | grep -qF -- "throw 'tailnet-ip-unavailable"; then
            echo 'tailnet-ip-unavailable is not fail-closed' >&2
            exit 1
          fi
          # 5) The advertised URL must be built from the validated bind address.
          if ! printf '%s' "$code" | grep -qF -- "'http://' + \$bindIp + ':7333/' + 'vnc.html?autoconnect=1&resize=remote'"; then
            echo 'webdeskUrl is not built from the validated tailnet bind address' >&2
            exit 1
          fi
          # 6) The mandated transport note must reach the Step Summary.
          if ! printf '%s' "$region" | grep -qF -- 'transport: tailnet HTTP (WireGuard-encrypted path) + VNC password gate; tailscale serve retired due to Windows SYSTEM operator lock (401)'; then
            echo 'the webdesk summary lacks the mandated transport note' >&2
            exit 1
          fi
          # 7) Server + UI acceptance allowlist. Assert against CODE (the lines
          #    that actually test $wd / define the UI regexes), never against the
          #    prose comments that document them.
          srvcode=$(grep -F '$wd -match' "$SRV" || true)
          if [ -z "$srvcode" ]; then
            echo "$SRV has no webdeskUrl acceptance test at all" >&2
            exit 1
          fi
          if ! printf '%s' "$srvcode" | grep -qF '^http://100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}:7333/'; then
            echo 'the server allowlist does not accept the tailnet-HTTP (100.64.0.0/10:7333) shape' >&2
            exit 1
          fi
          if ! printf '%s' "$srvcode" | grep -qF '^https://[a-z0-9.-]+\.ts\.net/'; then
            echo 'the server allowlist does not accept the tailnet *.ts.net shape' >&2
            exit 1
          fi
          if ! grep -qF "invalid-webdesk-url" "$SRV"; then
            echo 'the server does not report a rejected webdeskUrl as invalid-webdesk-url' >&2
            exit 1
          fi
          uicode=$(grep -E 'WEBDESK_TAILNET_HTTP_RE=|WEBDESK_TSNET_HTTPS_RE=|deskAllowed=' "$UI" || true)
          if ! printf '%s' "$uicode" | grep -qF '100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.'; then
            echo 'ui.html does not apply the tailnet-HTTP (100.64.0.0/10:7333) allowlist' >&2
            exit 1
          fi
          if ! printf '%s' "$uicode" | grep -qF 'ts\.net\/'; then
            echo 'ui.html does not apply the tailnet *.ts.net allowlist' >&2
            exit 1
          fi
          if ! printf '%s' "$uicode" | grep -qF 'WEBDESK_TAILNET_HTTP_RE.test(rawDesk)||WEBDESK_TSNET_HTTPS_RE.test(rawDesk)'; then
            echo 'ui.html does not gate the WEB DESKTOP button on both allowlist shapes' >&2
            exit 1
          fi
          # 8) The watcher auto-heal must rebind the tailnet address (a loopback
          #    rebind would silently kill the advertised URL).
          if ! grep -qF "(\$ipWd + ':7333')" "$WF"; then
            echo 'watcher websockify auto-heal does not rebind the tailnet address' >&2
            exit 1
          fi
      - name: F9 MagicDNS halt + link gates
        shell: bash
        run: |
          set -euo pipefail
          # F9a/F9f: every MagicDNS gate (tailscale-connect, cert-bind,
          # stage/config) must carry the actionable admin link in its failure
          # output (log + step summary + thrown message) - at least one per
          # gate, so three minimum across main.yml.
          n=$(grep -c 'login.tailscale.com/admin/dns' .github/workflows/main.yml || true)
          if [ "$n" -lt 3 ]; then
            echo "main.yml carries only $n 'login.tailscale.com/admin/dns' links (need >= 3: one per MagicDNS gate)" >&2
            exit 1
          fi
          # F9f: no MagicDNS validation may pass without a non-empty *.ts.net
          # Self.DNSName. Every step that reads Self.DNSName must validate it
          # against the ts.net pattern (empty / tailnet-IP / other names halt).
          bad=$(awk '
            /^      - name: / { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; buf = "" }
            { buf = buf $0 "\n" }
            END { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; print n + 0 }
          ' .github/workflows/main.yml)
          if [ "$bad" -ne 0 ]; then
            echo 'a step reads Self.DNSName without a non-empty *.ts.net validation - a MagicDNS gate could pass on an empty or non-ts.net name' >&2
            exit 1
          fi
      - name: F9k secret-halt + cascade gates
        shell: bash
        run: |
          set -euo pipefail
          # The TS_AUTHKEY halt must carry the clickable Tailscale admin keys link.
          if ! grep -q 'login.tailscale.com/admin/settings/keys' .github/workflows/main.yml; then
            echo "main.yml lacks 'login.tailscale.com/admin/settings/keys' (TS_AUTHKEY halt link)" >&2
            exit 1
          fi
          # Secret fix instructions must link the repo secrets settings page.
          if ! grep -q 'settings/secrets/actions' .github/workflows/main.yml; then
            echo "main.yml lacks 'settings/secrets/actions' (repo secrets settings link)" >&2
            exit 1
          fi
          # Every ghrdp-lib.ps1 dot-source must carry exactly one '# [F9k-guard]'
          # cascade guard, and the gate must not be vacuous.
          guards=$(grep -cF '# [F9k-guard]' .github/workflows/main.yml || true)
          dotsrc=$(grep -c "\. (Join-Path \$root 'ghrdp-lib.ps1')" .github/workflows/main.yml || true)
          if [ "$dotsrc" -lt 1 ]; then
            echo 'no ghrdp-lib.ps1 dot-sources found - gate would be vacuous' >&2
            exit 1
          fi
          if [ "$guards" -ne "$dotsrc" ]; then
            echo "F9k guard count ($guards) != ghrdp-lib dot-source count ($dotsrc)" >&2
            exit 1
          fi
      - name: Native UI and VPS contracts (Node)
        run: node --test tests/*.test.js
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse native PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('payloads/ghrdp-server.ps1', 'payloads/Provision-GhrdpVps.ps1', 'payloads/Enable-RdpTlsCertificate.ps1', 'payloads/helper-ghrdp-connect.ps1')) {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
              if ($errors) { throw "$file has $($errors.Count) PowerShell syntax error(s): $($errors[0].Message)" }
          }
      - name: Parse web-desktop inline PowerShell from main.yml (real parser)
        shell: pwsh
        run: |
          # The web-desktop steps and the keep-alive watcher keep their PowerShell
          # INLINE in main.yml, so nothing else in CI ever parses them: a syntax
          # error there only surfaces as a failed production run. Extract each
          # `run: |` block and run it through the PowerShell parser.
          $lines = Get-Content -LiteralPath '.github/workflows/main.yml'
          $names = @('Web desktop (noVNC', 'Web desktop self-test', 'Web desktop diagnostics staging', 'Keep-alive 5h30')
          $checked = 0
          foreach ($n in $names) {
              $start = -1
              for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match ('^      - name: ' + [regex]::Escape($n))) { $start = $i; break } }
              if ($start -lt 0) { throw ("step '" + $n + "' not found in main.yml") }
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^      - name: ') { $end = $i; break } }
              $runLine = -1
              for ($i = $start; $i -lt $end; $i++) { if ($lines[$i] -match '^        run: \|') { $runLine = $i; break } }
              if ($runLine -lt 0) { throw ("step '" + $n + "' has no block run script") }
              $script = @()
              for ($i = $runLine + 1; $i -lt $end; $i++) {
                  $l = $lines[$i]
                  if ($l.Trim() -eq '') { $script += ''; continue }
                  if ($l -notmatch '^          ') { break }
                  $script += $l.Substring(10)
              }
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput(($script -join "`n"), [ref]$null, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                  throw ("main.yml step '" + $n + "' has " + $errors.Count + ' PowerShell syntax error(s): ' + $errors[0].Message)
              }
              $checked++
              Write-Host ('[parse] ' + $n + ' OK (' + $script.Count + ' lines)')
          }
          if ($checked -ne $names.Count) { throw 'not every webdesk/watcher script was parsed' }
      - name: Smoke-test VPS ACL helper in temporary files only
        shell: pwsh
        run: |
          $source = Get-Content payloads/Provision-GhrdpVps.ps1 -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$null, [ref]$null)
          $fn = $ast.Find({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Protect-Path'}, $true)
          if (-not $fn) { throw 'Protect-Path definition missing' }
          . ([scriptblock]::Create($fn.Extent.Text))
          $dir = Join-Path $env:RUNNER_TEMP ('ghrdp-acl-' + [guid]::NewGuid().ToString('N'))
          try {
              New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
              Protect-Path -Path $dir -Directory $true
              $file = Join-Path $dir 'safe.txt'
              [System.IO.File]::WriteAllText($file, 'non-secret CI test')
              Protect-Path -Path $file
              if (-not (Get-Acl $dir).AreAccessRulesProtected -or -not (Get-Acl $file).AreAccessRulesProtected) { throw 'ACL protection failed' }
          } finally { if (Test-Path $dir) { Remove-Item $dir -Recurse -Force } }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish compiled native handler
        shell: pwsh
        run: |
          dotnet run --project payloads/ghrdp-handler/GhrdpHandler.csproj -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Handler self-test failed' }
          dotnet publish payloads/ghrdp-handler/GhrdpHandler.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o "$env:RUNNER_TEMP\ghrdp-handler"
          if ($LASTEXITCODE -ne 0) { throw 'Handler publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ghrdp-handler-win-x64
          path: ${{ runner.temp }}\ghrdp-handler\GhrdpHandler.exe
