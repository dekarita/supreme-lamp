# [F9n-lab] RESERVED-ENV FALLBACK LAB (tailnet-HTTP webdesk transport proof).
#
# Intent (stated once, re-verified this session): the reserved lab env
# `dekarita/ghrdp-lab` is the intended home for this job. It is NOT reachable
# from CI tooling: `gh repo view dekarita/ghrdp-lab` -> "Could not resolve to a
# Repository with the name 'dekarita/ghrdp-lab'" (404), and creating it returns
# 403 "Resource not accessible by integration" (the token cannot read or create
# repos outside the installation's allow-list). Intent stated once + retried
# once, so this in-repo fallback is used and the F9n proof is not blocked:
#
#   * same runner class (windows-latest, Azure, ephemeral) as main.yml's rdp job
#   * REAL Tailscale login (repo secret TS_AUTHKEY) -> a REAL 100.64.0.0/10
#     address on a real WireGuard interface
#   * REAL noVNC clone + REAL websockify bound to <rdpIp>:7333
#   * REAL Windows firewall rule GHRDP-Webdesk (inbound TCP 7333,
#     RemoteAddress 100.64.0.0/10 only)
#   * the production code is NOT re-implemented here: Start-Websockify,
#     Set-WebdeskFirewall and the whole self-test step are EXTRACTED VERBATIM
#     from .github/workflows/main.yml and executed with `pwsh -File`, so the lab
#     exercises the exact shipped text (including the paired redirect files and
#     the F9n classification).
#
# Phase 1 (REPLICATE §1): bind <rdpIp>:7333 + firewall rule, then curl the
#   noVNC marker on the tailnet address. Must be GREEN before the supreme-lamp
#   PR is opened. If `tailscale ip` is refused by the SYSTEM operator lock, the
#   lab falls back to the Tailscale interface address and writes it to
#   config.rdpIp - which is exactly the production path (the webdesk step reads
#   config.rdpIp and never calls the CLI).
# Phase 2 (SELF-TEST):    the extracted production self-test must end green on
#   the advertised URL http://<rdpIp>:7333/vnc.html?autoconnect=1&resize=remote.
# Phase 3 (E):            config.webdeskUrl pointed at an unusable tailnet
#   address must classify, write the webdesk-diag payload, clear the URL and
#   halt fail-closed.
#
# LAB_REV=5 (F9n: the serve proxy is retired from the web desktop path - the
# Windows SYSTEM operator lock returns 401 for post-connect LocalAPI calls;
# transport = tailnet-HTTP websockify on <rdpIp>:7333). Evidence channel: every probe also emits a
# ::warning::/::notice:: annotation - annotations are readable through the
# ordinary GitHub API (GET /check-runs/<id>/annotations) even when the runner
# log zip is not reachable from the tooling that drives this lab.
#
# Artifacts are secret-free by construction: websockify never receives a VNC
# password (the lab runs no VNC server at all - it proves the HTTP/noVNC leg),
# and Tailscale credentials never appear in the files this job uploads.
name: webdesk-lab (F9n tailnet-HTTP transport proof)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/webdesk-lab.yml'

permissions:
  contents: read

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo (main.yml source of truth)
        uses: actions/checkout@v4

      - name: Lab bootstrap (host layout + lab hostname)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $labRoot = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $labRoot -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $labRoot 'webdesk') -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_HOST=webdesk-lab-' + $env:GITHUB_RUN_NUMBER)
          Write-Host ('[lab] hostname will be webdesk-lab-' + $env:GITHUB_RUN_NUMBER)
          exit 0

      - name: Install Tailscale (msi)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          & curl.exe -fL --retry 3 --connect-timeout 30 --max-time 300 -o tailscale-setup.msi $url 2>$null
          $LASTEXITCODE = 0
          if (-not (Test-Path 'tailscale-setup.msi')) { throw '[lab] tailscale msi download failed' }
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'tailscale-setup.msi', '/quiet', '/norestart'
          Start-Sleep -Seconds 5
          Write-Host ('[lab] tailscale installed: ' + ((& 'C:\Program Files\Tailscale\tailscale.exe' version 2>$null | Select-Object -First 1) -join ' '))
          exit 0

      - name: Tailscale up (lab node) + resolve tailnet IP into config.rdpIp
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not $env:TS_AUTHKEY) { throw '[lab] TS_AUTHKEY secret missing in dekarita/supreme-lamp - lab cannot run.' }
          $upLog = Join-Path $env:RUNNER_TEMP 'lab-ts-up.log'
          $upErr = Join-Path $env:RUNNER_TEMP 'lab-ts-up.err'
          Start-Process -FilePath $ts -ArgumentList @('up', ('--authkey=' + $env:TS_AUTHKEY), '--accept-dns=true', ('--hostname=' + $env:LAB_HOST)) -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $j = ((& $ts status --json 2>$null) -join "`n") | ConvertFrom-Json
                  if ($j.BackendState -eq 'Running') { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
          }
          if (-not $ok) {
              $tail = ''
              foreach ($f in @($upLog, $upErr)) { if (Test-Path -LiteralPath $f) { $tail += [System.IO.File]::ReadAllText($f) } }
              if ($env:TS_AUTHKEY) { $tail = $tail -replace [regex]::Escape($env:TS_AUTHKEY), '[redacted]' }
              Write-Host ('[lab] tailscale up tail: ' + (($tail -split "`r?`n" | Select-Object -Last 10) -join ' | '))
              throw '[lab] tailscale up did not reach Running'
          }
          # [F9n] Tailnet address: CLI first, interface second. Production reads
          # config.rdpIp and never calls the CLI (the SYSTEM operator lock
          # returns 401 post-connect), so writing the address into config.rdpIp
          # here is the same path the webdesk step consumes.
          $TailnetIpRe = '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}$'
          $ip = ''
          for ($i = 0; $i -lt 10; $i++) {
              try { $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim() } catch { $ip = '' }
              if ($ip -match $TailnetIpRe) { break }
              Start-Sleep -Seconds 2
          }
          $ipSrc = 'tailscale ip -4'
          if ($ip -notmatch $TailnetIpRe) {
              Write-Host ('[lab] `tailscale ip` unusable ([' + $ip + ']) - reading the Tailscale interface address instead (401 operator lock path)')
              $ipSrc = 'tailscale interface'
              try {
                  $cand = @(Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { ([string]$_.IPAddress) -match $TailnetIpRe } | Select-Object -ExpandProperty IPAddress)
                  if ($cand.Count -gt 0) { $ip = [string]$cand[0] }
              } catch { }
          }
          if ($ip -notmatch $TailnetIpRe) { throw ('[lab] no 100.64.0.0/10 address on this runner (tailnet-ip-unavailable) - got [' + $ip + ']') }
          $dns = ''
          try { $dns = ([string](((& $ts status --json 2>$null) -join "`n") | ConvertFrom-Json).Self.DNSName).TrimEnd('.') } catch { }
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_IP=' + $ip)
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_DNS=' + $dns)
          Write-Host ('[lab] tailscale Running; tailnet address ' + $ip + ' (source: ' + $ipSrc + ') dns=[' + $dns + ']')
          exit 0

      - name: Seed host layout (noVNC + websockify + config.json with rdpIp)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $novnc = Join-Path $root 'novnc'
          if (-not (Test-Path -LiteralPath (Join-Path $novnc 'vnc.html'))) {
              & git.exe clone --depth 1 https://github.com/novnc/noVNC.git $novnc 2>&1 | Select-Object -Last 2 | Out-Null
          }
          & python -m pip install --disable-pip-version-check --quiet websockify 2>&1 | Select-Object -Last 2 | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $novnc 'vnc.html'))) { throw '[lab] noVNC assets missing' }
          # Exactly the F9n advertised-URL shape.
          $url = 'http://' + $env:LAB_IP + ':7333/' + 'vnc.html?autoconnect=1&resize=remote'
          $cfg = [ordered]@{ hostKind = 'ephemeral'; hostname = $env:LAB_HOST; rdpIp = $env:LAB_IP; dnsName = $env:LAB_DNS; webdeskUrl = ''; webdeskReason = ''; webdeskDetail = '' }
          $enc = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), ($cfg | ConvertTo-Json -Depth 6), $enc)
          Write-Host ('[lab] seeded config.rdpIp = ' + $env:LAB_IP + '; advertised URL will be ' + $url)
          exit 0

      - name: Extract production webdesk code verbatim from main.yml
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $all = Get-Content -LiteralPath '.github/workflows/main.yml'
          # Extract one PowerShell function block (from its anchor line to the
          # next line that is exactly the 10-space closing brace).
          function Get-FnBlock([string]$Anchor) {
              $start = -1
              for ($i = 0; $i -lt $all.Count; $i++) { if ($all[$i].StartsWith($Anchor)) { $start = $i; break } }
              if ($start -lt 0) { throw ('[lab] anchor not found in main.yml: ' + $Anchor) }
              $body = @()
              for ($i = $start; $i -lt $all.Count; $i++) {
                  $body += $all[$i].Substring(10)
                  if ($i -gt $start -and $all[$i] -eq '          }') { break }
              }
              return ($body -join "`n")
          }
          $launcher = Get-FnBlock '          function Start-Websockify('
          $firewall = Get-FnBlock '          function Set-WebdeskFirewall {'
          $helper = Join-Path $env:RUNNER_TEMP 'extracted-webdesk-helpers.ps1'
          [System.IO.File]::WriteAllText($helper, ($launcher + "`n" + $firewall + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host ('[lab] extracted helpers: ' + ((Get-Content -LiteralPath $helper).Count) + ' lines -> ' + $helper)
          # Extract the whole self-test step `run: |` block.
          $start = -1
          for ($i = 0; $i -lt $all.Count; $i++) { if ($all[$i] -match '^      - name: Web desktop self-test') { $start = $i; break } }
          if ($start -lt 0) { throw '[lab] self-test step not found in main.yml' }
          $end = $all.Count
          for ($i = $start + 1; $i -lt $all.Count; $i++) { if ($all[$i] -match '^      - name: ') { $end = $i; break } }
          $runLine = -1
          for ($i = $start; $i -lt $end; $i++) { if ($all[$i] -match '^        run: \|') { $runLine = $i; break } }
          if ($runLine -lt 0) { throw '[lab] self-test step has no block run script' }
          $script = @()
          for ($i = $runLine + 1; $i -lt $end; $i++) {
              $l = $all[$i]
              if ($l.Trim() -eq '') { $script += ''; continue }
              if ($l -notmatch '^          ') { break }
              $script += $l.Substring(10)
          }
          $out = Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'
          [System.IO.File]::WriteAllLines($out, $script, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host ('[lab] extracted self-test: ' + $script.Count + ' lines -> ' + $out)
          if (-not ($launcher -match '\$BindIp')) { throw '[lab] extracted launcher does not bind a tailnet address' }
          if (-not ($firewall -match "RemoteAddress '100.64.0.0/10'")) { throw '[lab] extracted firewall helper is not CGNAT-scoped' }
          Write-Host '::notice title=lab extraction::production Start-Websockify + Set-WebdeskFirewall + self-test extracted verbatim from main.yml'
          exit 0

      - name: REPLICATE F9n - bind <rdpIp>:7333 + CGNAT firewall rule + curl the noVNC marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
          . (Join-Path $env:RUNNER_TEMP 'extracted-webdesk-helpers.ps1')
          $ip = $env:LAB_IP
          $lines = @()
          # Production order: firewall rule first, then the bind.
          $fw = Set-WebdeskFirewall
          $lines += ('replicate=firewall-rule-GHRDP-Webdesk=' + $fw)
          $rule = Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction SilentlyContinue
          if ($rule) {
              $af = $rule | Get-NetFirewallAddressFilter -ErrorAction SilentlyContinue
              $lines += ('replicate=firewall-scope remote=' + (($af.RemoteAddress) -join ',') + ' action=' + $rule.Action + ' dir=' + $rule.Direction)
          }
          $up = Start-Websockify $ip
          $lines += ('replicate=Start-Websockify(' + $ip + '):7333=' + $up)
          $pids = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | Select-Object -ExpandProperty ProcessId)
          $listen = [bool](Get-NetTCPConnection -LocalAddress $ip -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1)
          $lines += ('replicate=tailnet-listen-7333=' + $listen + ' pids=' + ($pids -join ','))
          $marker = 'http://' + $ip + ':7333/vnc.html'
          $body = Join-Path $env:RUNNER_TEMP 'lab-replicate.html'
          $code = ((& curl.exe -sk --max-time 25 -o $body -w '%{http_code}' $marker 2>$null) -join '').Trim()
          $LASTEXITCODE = 0
          $first = ''
          if (Test-Path -LiteralPath $body) { $t = [System.IO.File]::ReadAllText($body); if ($t.Length -gt 160) { $t = $t.Substring(0, 160) }; $first = ($t -replace '\s+', ' ') }
          $hasMarker = ($code -eq '200' -and $first -match 'noVNC')
          $lines += ('replicate=curl ' + $marker + ' -> HTTP [' + $code + '] noVNC=' + $hasMarker + ' first160=' + $first)
          $lines | ForEach-Object { Write-Host ('[lab] ' + $_) }
          Add-Content -LiteralPath (Join-Path $diagDir 'lab-replicate.txt') -Value ($lines -join "`n")
          # The advertised URL is only written after the marker is proven - the
          # same no-fabrication rule as production.
          if ($hasMarker) {
              $cfgPath = 'C:\ghrdp\config.json'
              $enc = New-Object System.Text.UTF8Encoding($false)
              $cfg = [System.IO.File]::ReadAllText($cfgPath) | ConvertFrom-Json
              $cfg.webdeskUrl = 'http://' + $ip + ':7333/' + 'vnc.html?autoconnect=1&resize=remote'
              [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 6), $enc)
              Write-Host ('[lab] config.webdeskUrl = ' + $cfg.webdeskUrl)
              Write-Host ('::notice title=lab REPLICATE F9n GREEN::firewall=' + $fw + ' listen=' + $listen + ' curl ' + $marker + ' HTTP ' + $code + ' with noVNC marker')
              exit 0
          }
          Write-Host ('::error title=lab REPLICATE F9n FAILED::' + ($lines -join ' ; '))
          throw '[lab] F9n replication failed - see the lines above (this must be GREEN before the supreme-lamp PR).'

      - name: FIX - extracted production self-test (verbatim from main.yml)
        id: fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'
          if (-not (Test-Path -LiteralPath $out)) { throw '[lab] no extracted self-test' }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $out
          $rc = $LASTEXITCODE
          Write-Host ('[lab] extracted self-test exit code = ' + $rc + ' (0 = the advertised tailnet URL served noVNC)')
          exit $rc

      - name: FIX PROBE - listener + config after the self-test
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
          $lines = @()
          $pids = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | Select-Object -ExpandProperty ProcessId)
          $listen = [bool](Get-NetTCPConnection -LocalAddress $env:LAB_IP -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1)
          $rule = [bool](Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction SilentlyContinue)
          $lines += ('probe=FIX-PROBE tailnet-listen-7333=' + $listen + ' pids=' + ($pids -join ',') + ' firewall-rule=' + $rule)
          $cfg = ''
          try { $cfg = ([System.IO.File]::ReadAllText('C:\ghrdp\config.json') -replace '\s+', ' ') } catch { }
          $lines += ('probe=FIX-PROBE config=' + $cfg)
          $sf = Join-Path $env:RUNNER_TEMP 'fix-probe-adv.html'
          $url = 'http://' + $env:LAB_IP + ':7333/vnc.html?autoconnect=1&resize=remote'
          $sc = ((& curl.exe -sk --max-time 25 -o $sf -w '%{http_code}' $url 2>$null) -join '').Trim()
          $LASTEXITCODE = 0
          $lines += ('probe=FIX-PROBE advertised-http=' + $sc + ' url=' + $url)
          $lines | ForEach-Object { Write-Host ('[lab] ' + $_) }
          Add-Content -LiteralPath (Join-Path $diagDir 'lab-fix-probe.txt') -Value ($lines -join "`n")
          Write-Host ('::notice title=lab FIX PROBE (after extracted self-test)::' + ($lines -join ' ; '))
          exit 0

      - name: E PROOF - classification path (unusable tailnet address, expect halt)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'
          if (-not (Test-Path -LiteralPath $out)) {
              Write-Host '[lab] Phase 3 SKIPPED: no extracted self-test.'
              exit 0
          }
          # Point the advertised URL at a 100.64.0.0/10 address this runner does
          # NOT own: websockify cannot bind it, so the self-test must classify,
          # write the diagnostics payload, clear the URL and throw.
          $cfgPath = 'C:\ghrdp\config.json'
          $enc = New-Object System.Text.UTF8Encoding($false)
          $cfg = [System.IO.File]::ReadAllText($cfgPath) | ConvertFrom-Json
          $cfg.webdeskUrl = 'http://100.127.254.253:7333/vnc.html?autoconnect=1&resize=remote'
          $cfg.rdpIp = '100.127.254.253'
          [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 6), $enc)
          Write-Host '[lab] Phase 3: config.rdpIp/webdeskUrl pointed at an unusable tailnet address'
          $p = Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $out) -Wait -PassThru -NoNewWindow
          Write-Host ('[lab] Phase 3: extracted self-test exit code = ' + $p.ExitCode + ' (non-zero = fail-closed halt, as designed)')
          $cl = Join-Path $env:RUNNER_TEMP 'webdesk-diag\classification.txt'
          $clTxt = ''
          if (Test-Path -LiteralPath $cl) { $clTxt = (([System.IO.File]::ReadAllText($cl)) -replace "`r?`n", ' | ') }
          else { $clTxt = 'classification.txt MISSING (diagnostics payload incomplete)' }
          Write-Host ('[lab] Phase 3 classification.txt: ' + $clTxt)
          $cfgAfter = ''
          try { $cfgAfter = ([System.IO.File]::ReadAllText($cfgPath) -replace '\s+', ' ') } catch { }
          Write-Host ('::warning title=lab Phase 3 (classification proof)::exit=' + $p.ExitCode + ' ; ' + $clTxt + ' ; config.json=' + $cfgAfter)
          exit 0

      - name: Stage diagnostics inside the workspace (upload-artifact v4 root)
        if: always()
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'webdesk-diag'
          New-Item -ItemType Directory -Path $stage -Force -ErrorAction SilentlyContinue | Out-Null
          try {
              Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'webdesk-diag\*') -Destination $stage -Force -Recurse -ErrorAction SilentlyContinue
          } catch { }
          foreach ($f in @('C:\ghrdp\webdesk\websockify.log', 'C:\ghrdp\webdesk\websockify.err.log')) {
              if (Test-Path -LiteralPath $f) { Copy-Item -LiteralPath $f -Destination (Join-Path $stage ([System.IO.Path]::GetFileName($f))) -Force -ErrorAction SilentlyContinue }
          }
          Add-Content -LiteralPath (Join-Path $stage 'MANIFEST.txt') -Value ('lab staged at ' + (Get-Date).ToUniversalTime().ToString('o'))
          Write-Host ('[lab] staged ' + (Get-ChildItem -LiteralPath $stage -ErrorAction SilentlyContinue).Count + ' file(s)')

      - name: Upload webdesk-diag artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdesk-diag
          if-no-files-found: warn
          retention-days: 14
          path: webdesk-diag

      - name: Lab teardown (logout lab node)
        if: always()
        shell: pwsh
        run: |
          try { & 'C:\Program Files\Tailscale\tailscale.exe' logout 2>&1 | Select-Object -First 3 | ForEach-Object { Write-Host ('[lab] ' + $_) } } catch { }
          exit 0
