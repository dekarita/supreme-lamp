              src/tests/smoke/file-explorer-shell.test.tsx \
              src/tests/smoke/f56c-v2-explorer.test.tsx \
              src/tests/smoke/i18n-f56-parity.test.ts \
              src/tests/smoke/f56-f57-ids.test.ts 2>&1); then
