                  if ($errs) {
                      foreach ($e in @($errs)) { Write-Host ('::error title=F56-d qbt parse::' + $f + ':' + $e.Extent.StartLineNumber + ':' + $e.Extent.StartColumnNumber + ' ' + $e.Message) }
                      throw ('PowerShell syntax error in ' + $f)
