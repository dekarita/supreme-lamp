<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHRDP Decryptor</title><style>body{font-family:system-ui,sans-serif;background:#0b0f14;color:#e8eef3;margin:0;padding:24px;max-width:720px;margin:auto}h1{font-size:22px}label{display:block;margin:12px 0}input,button{padding:10px;border-radius:8px;border:1px solid #2b3a4a;background:#101820;color:#e8eef3}button{cursor:pointer;background:#153e5c}.sub{color:#8aa0ad}#out{margin-top:14px;color:#41d18f}</style></head><body><h1>GHRDP Web Decryptor</h1><p class="sub">Decrypt .ghenc files locally in your browser. Nothing is uploaded. Key is saved on THIS device for permanent unlock.</p><div id="info"></div><label>Pick .ghenc file <input type="file" id="f" accept=".ghenc"></label><label>Decrypt key <input id="key" type="password"></label><button id="go">Decrypt &amp; Download</button><div id="out"></div><script>var params=new URLSearchParams(location.hash.slice(1));var fileUrl=params.get("file")||"",key=params.get("key")||"";if(key)document.getElementById("key").value=key;if(fileUrl){document.getElementById("info").innerHTML="Step 1: <a href=\""+fileUrl+"\" target=\"_blank\">download the .ghenc file</a>, then pick it below. Key auto-filled.";}async function sha256(buf){var d=await crypto.subtle.digest("SHA-256",buf);return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,"0")}).join("");}document.getElementById("go").onclick=async function(){var fi=document.getElementById("f").files[0];if(!fi){alert("pick a .ghenc file");return;}var buf=await fi.arrayBuffer();var u8=new Uint8Array(buf);var hash=await sha256(buf);var k=document.getElementById("key").value||localStorage.getItem("ghkey:"+hash)||"";if(!k){alert("enter decrypt key");return;}localStorage.setItem("ghkey:"+hash,k);try{var salt=u8.slice(0,16),iv=u8.slice(16,32),data=u8.slice(32);var enc=new TextEncoder();var keyMat=await crypto.subtle.importKey("raw",enc.encode(k),{name:"PBKDF2"},false,["deriveKey"]);var aes=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},keyMat,{name:"AES-CBC",length:256},false,["decrypt"]);var plain=await crypto.subtle.decrypt({name:"AES-CBC",iv:iv},aes,data);var name=fi.name.replace(/\.ghenc$/,"");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([plain]));a.download=name;a.click();document.getElementById("out").textContent="Decrypted "+name+" ("+plain.byteLength+" bytes). Key saved on this device.";}catch(e){alert("Decrypt failed: wrong key or corrupt file. "+e);}};</script></body></html>
