              $beat++
              $stamp = Get-Date -Format 'HH:mm:ss'
              $cfgNow = Read-GhrdpJson -Path $cfgPath
              $ipNow = ''
              if ($cfgNow) { $ipNow = [string]$cfgNow.rdpIp }
              $ssa = $null
              try { if ($cfgNow -and $cfgNow.sessionStartedAt) { $ssa = [datetime]$cfgNow.sessionStartedAt } } catch { }
              if ($ssa) { $sessEnd = $ssa.AddMinutes($sessionWindowMinutes); if ($sessEnd -gt $hardCap) { $sessEnd = $hardCap }; $deadline = $sessEnd; $phaseNow = 'active' } else { $deadline = $idleCap; $phaseNow = 'idle-wait' }
              try {
                if ($cfgNow) {
                  $cfgNow | Add-Member -NotePropertyName keepAliveDeadline -NotePropertyValue ($deadline.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')) -Force
                  $cfgNow | Add-Member -NotePropertyName keepAlivePhase -NotePropertyValue $phaseNow -Force
                  [System.IO.File]::WriteAllText($cfgPath, ($cfgNow | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
                }
              } catch { }
              $tsOk = Test-TsRunning
              if (-not $tsOk) {
                  if (((Get-Date) - $lastTsFix).TotalMinutes -ge 2) {
                      $lastTsFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' Tailscale NOT connected - restarting the Tailscale service')
                      try { Start-Service -Name Tailscale -ErrorAction Stop } catch { Write-Host ('   restart failed: ' + $_.Exception.Message) }
                      Start-Sleep -Seconds 8
                      $tsOk = Test-TsRunning
                      if ($tsOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' Tailscale is Running again') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' Tailscale - will retry later') }
                  }
              }
              $rdpOk = Test-PortListen -PortNum 3389
              if (-not $rdpOk) {
                  if (((Get-Date) - $lastRdpFix).TotalMinutes -ge 2) {
                      $lastRdpFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' port 3389 NOT listening - restarting TermService')
                      try { Restart-Service -Name TermService -Force -ErrorAction Stop } catch { Write-Host ('   TermService restart failed: ' + $_.Exception.Message) }
                      Start-Sleep -Seconds 8
                      $rdpOk = Test-PortListen -PortNum 3389
                      if ($rdpOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' RDP listener is back on 3389') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' RDP - will retry later') }
                  }
              }
              $psOk = Test-DashHttp
              if (-not $psOk) {
                  if (((Get-Date) - $lastPsFix).TotalMinutes -ge 2) {
                      $lastPsFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' PowerShell dashboard not responding on 7331 - restarting GhrdpServer')
                      try {
                          Start-ScheduledTask -TaskName 'GhrdpServer' -ErrorAction Stop
                      } catch {
                          Write-Host ('   task start failed: ' + $_.Exception.Message + ' - launching background process')
                          try {
                              $pwshPath2 = 'powershell.exe'
                              $c2 = Get-Command pwsh.exe -ErrorAction SilentlyContinue
                              if ($c2) { $pwshPath2 = $c2.Source }
                              Start-Process -FilePath $pwshPath2 -ArgumentList '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-server.ps1"' -WindowStyle Hidden
                          } catch { Write-Host ('   background launch failed: ' + $_.Exception.Message) }
                      }
                      Start-Sleep -Seconds 8
                      $psOk = Test-DashHttp
                      if ($psOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' PowerShell dashboard is responding again') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' PS dashboard 7331') }
                  }
              }
              $rustStr = 'OFF'
              if ($rustProbeOn) {
                  if (-not (Test-Path -LiteralPath $rustExe)) {
                      $rustProbeOn = $false
                      if (-not $rustMissingLogged) {
                          $rustMissingLogged = $true
                          Write-Host 'rust dash unavailable (build failed) - stopping 7332 probes for this run'
                      }
                      $rustStr = 'OFF'
                  } else {
                      $rustOk = Test-RustTcp
                      if (-not $rustOk) {
                          if (((Get-Date) - $lastRustFix).TotalMinutes -ge 2) {
                              $lastRustFix = Get-Date
                              Write-Host ($icons.wrench + ' ' + $stamp + ' Rust dashboard down on 7332 - restarting GhrdpRustDash')
                              $restarted = $false
                              try {
                                  Start-ScheduledTask -TaskName 'GhrdpRustDash' -ErrorAction Stop
                                  $restarted = $true
                              } catch {
                                  try {
                                      Start-Process -FilePath $rustExe -WorkingDirectory 'C:\ghrdp' -WindowStyle Hidden
                                      $restarted = $true
                                  } catch {
                                      Write-Host ('   restart failed: ' + $_.Exception.Message)
                                  }
                              }
                              if ($restarted) {
                                  Start-Sleep -Seconds 8
                                  $rustOk = Test-RustTcp
                                  if ($rustOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' Rust dashboard is listening on 7332 again') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' Rust dashboard 7332 - PowerShell fallback on 7331 is serving') }
                              }
                          }
                      }
                      if ($rustOk) { $rustStr = 'UP' } else { $rustStr = 'DOWN' }
                  }
              }
              $script:rustLast = $rustStr
              $dashShort = '(n/a)'
              if ($ipNow) {
                  if ($rustAdvertise -and ($script:rustLast -eq 'UP') -and $rustUrl) { $dashShort = $rustUrl }
                  else { $dashShort = 'http://' + $ipNow + ':7331/' }
              }
              $prog = Read-GhrdpJson -Path $progPath
              $watcherStr = 'NOT-STARTED'
              $scans = 0
              $done = 0
              $total = 0
              $failed = 0
              $spd = [long]0
              $watcherOk = $false
              if ($prog) {
                  if ($prog.agg) {
                      $done = [int]$prog.agg.done
                      $total = [int]$prog.agg.total
                      $failed = [int]$prog.agg.failed
                      $spd = [long]$prog.agg.speedBps
                  }
                  if ($prog.telemetry) { $scans = [int]$prog.telemetry.scans }
                  $age = $null
                  try { if ($prog.ts) { $age = [int]((Get-Date) - [datetime]$prog.ts).TotalSeconds } } catch { }
                  if ([bool]$prog.alive) {
                      if (($null -ne $age) -and ($age -lt 15)) {
                          $watcherOk = $true
                          $watcherStr = 'ACTIVE'
                      } elseif ($null -ne $age) {
                          $watcherStr = ('STALE (' + $age + 's)')
                      } else {
                          $watcherStr = 'STALE'
                      }
                  } elseif ($total -gt 0) {
                      $watcherStr = 'IDLE'
                  }
              }
              if (-not $watcherOk -and ($watcherStr -like 'STALE*')) {
                  if (((Get-Date) - $lastStaleFix).TotalMinutes -ge 2) {
                      $lastStaleFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' watcher STALE - nudging GhrdpWatcher (RDP user must be logged on)')
                      try { Start-ScheduledTask -TaskName 'GhrdpWatcher' -ErrorAction Stop } catch { Write-Host ('   nudge failed: ' + $_.Exception.Message) }
                  }
              }
              if (((Get-Date) - $lastWatchNudge).TotalMinutes -ge 10) {
                  $lastWatchNudge = Get-Date
                  try { Start-ScheduledTask -TaskName 'GhrdpWatcher' -ErrorAction SilentlyContinue } catch { }
              }
              $tsStr = 'OK'
              if (-not $tsOk) { $tsStr = 'DOWN' }
              $rdpStr = 'OK'
              if (-not $rdpOk) { $rdpStr = 'DOWN' }
              $psStr = 'UP'
              if (-not $psOk) { $psStr = 'DOWN' }
              $line = 'HEARTBEAT ' + $icons.hourglass + ' remaining ' + (Get-Remaining) + ' | dashboard ' + $dashShort + ' | ts:' + $tsStr + ' | rdp3389:' + $rdpStr + ' | ps7331:' + $psStr + ' | rust7332:' + $rustStr + ' | watcher:' + $watcherStr + ' (scans ' + $scans + ') | files ' + $done + '/' + $total + ' failed ' + $failed + ' | speed ' + (Get-SpeedStr -Bps $spd) + ' | Last updated: ' + $stamp
              if (-not ($tsOk -and $rdpOk -and $psOk)) { $line = $icons.warn + ' ' + $line }
              Write-Host $line
              try {
                  . (Join-Path $env:RUNNER_TEMP 'publish-status.ps1')
                  $cfg2 = $null; $prog2 = $null
                  try { if (Test-Path 'C:\ghrdp\config.json') { $cfg2 = Get-Content 'C:\ghrdp\config.json' -Raw | ConvertFrom-Json } } catch { }
                  try { if (Test-Path 'C:\ghrdp\progress.json') { $prog2 = Get-Content 'C:\ghrdp\progress.json' -Raw | ConvertFrom-Json } } catch { }
                  $agg2 = @{ total = 0; done = 0; failed = 0; overallPct = 0; speedBps = 0 }
                  if ($prog2 -and $prog2.agg) { $agg2 = $prog2.agg }
                  $files2 = @()
                  if ($prog2 -and $prog2.files) { $files2 = @($prog2.files | Select-Object -First 200 | ForEach-Object { @{ name = [string]$_.name; size = [long]$_.size; phase = [string]$_.phase; pct = [double]$_.pct; status = [string]$_.status; link = [string]$_.link; encrypted = [string]$_.encrypted } }) }
                  $tail2 = @()
                  if ($prog2 -and $prog2.log) { $tail2 = @($prog2.log | Select-Object -Last 60) }
                  $statusObj2 = [ordered]@{
                      ts = (Get-Date -Format o)
                      runId = [string]$env:GITHUB_RUN_ID
                      runUrl = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
                      runStatus = 'in_progress'
                      startedAt = $(if ($cfg2) { [string]$cfg2.startedAt } else { '' })
                      sessionStartedAt = $(if ($cfg2) { [string]$cfg2.sessionStartedAt } else { '' })
                      watcherAlive = $(if ($prog2) { [bool]$prog2.alive } else { $false })
                      speedBps = [long]$agg2.speedBps
                      overallPct = [double]$agg2.overallPct
                      filesDone = [int]$agg2.done
                      filesTotal = [int]$agg2.total
                      missionControlUrl = $(if ($cfg2 -and $cfg2.rdpIp) { 'http://' + $cfg2.rdpIp + ':7332/' } else { '' })
                      tailnetUrl = $(if ($cfg2 -and $cfg2.rdpIp) { 'http://' + $cfg2.rdpIp + ':7331/' } else { '' })
                      rustUrl = $(if ($cfg2) { [string]$cfg2.rustUrl } else { '' })
                      funnelUrl = $(if ($cfg2) { [string]$cfg2.funnelUrl } else { '' })
                      mirrorKey = $(if ($cfg2 -and [bool]$cfg2.mirror) { [string]$cfg2.mirrorKey } else { '' })
                      legacyKey = $(if ($cfg2) { [string]$cfg2.legacyDecryptKey } else { '' })
                      telegraphUrl = $(if ($cfg2) { [string]$cfg2.mirrorIndexUrl } else { '' })
                      rentryNewUrl = $(if ($cfg2) { [string]$cfg2.rentryNewUrl } else { '' })
                      egressIp = $(if ($cfg2) { [string]$cfg2.runnerEgressIp } else { '' })
                      encryptMode = $(if ($cfg2) { [string]$cfg2.encryptMode } else { '' })
                      files = $files2
                      logTail = $tail2
                      history = @()
                  }
                  Publish-StatusToGhPages -JsonText ($statusObj2 | ConvertTo-Json -Depth 20 -Compress)
              } catch { Write-Host ('[status] publish failed: ' + $_.Exception.Message) }
              if (($beat - $lastBannerBeat) -ge 10) {
                  $lastBannerBeat = $beat
                  Show-Banner -Reason ('auto-refresh, heartbeat ' + $beat)
              }
          }
          try { $cfgEnd = Read-GhrdpJson -Path $cfgPath; if ($cfgEnd) { $cfgEnd | Add-Member -NotePropertyName keepAlivePhase -NotePropertyValue 'ended' -Force; $cfgEnd | Add-Member -NotePropertyName keepAliveDeadline -NotePropertyValue ((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')) -Force; [System.IO.File]::WriteAllText($cfgPath, ($cfgEnd | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false))) } } catch { }
          Show-Banner -Reason 'keep-alive window finished - cleanup follows'
          Write-Host '[keepalive] keep-alive window complete; the cleanup steps will run now'
          exit 0

      - name: Emergency mirror pass on cancel (final index with BOTH keys + ALL links)
        if: ${{ cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $libPath = Join-Path $root 'ghrdp-lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              Write-Host '[emergency] mirror lib missing; nothing to do'
              exit 0
          }
          . $libPath
          $cfg = Read-MirrorCfg -Path (Join-Path $root 'config.json')
          if (-not $cfg) {
              Write-Host '[emergency] config missing; nothing to do'
              exit 0
          }
          $idx = Get-MirrorIndexList -IdxFile (Join-Path $root 'mirror-index.json')
          if ($null -eq $idx) { $idx = New-Object System.Collections.ArrayList }
          if (-not [bool]$cfg.mirror) {
              Write-Host '[emergency] mirror disabled for this run; republishing indexes anyway so keys+links survive'
          } else {
              Write-Host '[emergency] mirror enabled: triggering emergency upload pass'
              try {
                  [System.IO.File]::WriteAllText((Join-Path $root 'emergency.flag'), (Get-Date -Format o), $global:GhrdpEncNoBom)
              } catch { }
              try { Start-ScheduledTask -TaskName 'GhrdpWatcher' -ErrorAction Stop } catch { Write-Host ('[emergency] watcher task could not start: ' + $_.Exception.Message) }
              $limit = (Get-Date).AddMinutes(10)
              while ((Get-Date) -lt $limit) {
                  $prog = $null
                  for ($r = 0; $r -lt 3; $r++) {
                      $prog = Read-MirrorCfg -Path (Join-Path $root 'progress.json')
                      if ($prog) { break }
                      Start-Sleep -Seconds 1
                  }
                  if ($prog -and $prog.agg) {
                      $remain = [int]$prog.agg.total - [int]$prog.agg.done - [int]$prog.agg.failed
                      Write-Host ('[emergency] files remaining: ' + $remain)
                      if ($remain -le 0) { break }
                  } else {
                      Write-Host '[emergency] waiting for watcher progress ...'
                  }
                  Start-Sleep -Seconds 20
              }
              $idx = Get-MirrorIndexList -IdxFile (Join-Path $root 'mirror-index.json')
              if ($null -eq $idx) { $idx = New-Object System.Collections.ArrayList }
          }
          Write-Host '[emergency] publishing FINAL index containing BOTH decrypt keys + ALL links ...'
          try {
              Publish-TelegraphIndex -Cfg $cfg -IndexList $idx
              try { [void](Publish-GithubPagesData -Cfg $cfg -IndexList $idx) } catch { Write-Host ('[emergency] data.json push failed: ' + $_.Exception.Message) }
              try {
                  $finalBody = Build-IndexBodyText -Cfg $cfg -IndexList $idx
                  [void](Publish-MirrorRentry -Cfg $cfg -BodyText $finalBody -IndexList $idx)
                  Write-Host ('[emergency] FINAL Rentry: ' + $global:GhrdpLegacyUrl)
              } catch { Write-Host ('[emergency] rentry myurl0 edit failed: ' + $_.Exception.Message) }
              Save-MirrorCfg -Cfg $cfg -Path (Join-Path $root 'config.json')
              Write-Host ('[emergency] FINAL Telegraph: ' + [string]$cfg.mirrorIndexUrl)
              Write-Host ('[emergency] FINAL Pages: ' + [string]$cfg.pagesBase)
              Write-Host ('[emergency] LEGACY decrypt key preserved: ' + [string]$cfg.legacyDecryptKey)
              Write-Host ('[emergency] current decrypt key preserved: ' + [string]$cfg.mirrorKey)
              $all = @($idx)
              Write-Host ('[emergency] total links preserved in the indexes: ' + (@($all).Count + @($cfg.legacyLinks).Count))
          } catch {
              Write-Host ('[emergency] final publish failed: ' + $_.Exception.Message + ' | ' + $_.ScriptStackTrace)
          }
          Write-Host '[emergency] emergency pass finished'
          exit 0

      - name: Pre-cleanup final save to GitHub Pages (append-only archive + telegraph backup)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $libPath = Join-Path $root 'ghrdp-lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) { Write-Host '[final] lib missing'; exit 0 }
          . $libPath
          $cfgPath = Join-Path $root 'config.json'
          if (-not (Test-Path -LiteralPath $cfgPath)) { Write-Host '[final] config missing'; exit 0 }
          $cfg = Get-Content -LiteralPath $cfgPath -Raw | ConvertFrom-Json
          $idxPath = Join-Path $root 'mirror-index.json'
          $idx = @()
          if (Test-Path -LiteralPath $idxPath) { try { $idx = @(Get-Content -LiteralPath $idxPath -Raw | ConvertFrom-Json) } catch { } }
          $sessionId = [string]$cfg.sessionId
          if (-not $sessionId) { $sessionId = 's-unknown' }
          $totalBytes = [long]0; $totalFiles = @($idx).Count
          foreach ($e in @($idx)) { $totalBytes += [long]$e.size }
          Write-Host ('[final] session=' + $sessionId + ' files=' + $totalFiles + ' bytes=' + $totalBytes)
          try { [void](Publish-GithubPagesData -Cfg $cfg -IndexList $idx) } catch { Write-Host ('[final] data.json: ' + $_.Exception.Message) }
          try { Publish-TelegraphIndex -Cfg $cfg -IndexList $idx } catch { Write-Host ('[final] telegraph: ' + $_.Exception.Message) }
          $token = [string]$env:GITHUB_TOKEN
          $repo = [string]$env:GITHUB_REPOSITORY
          $hdr = @{ Authorization = ('Bearer ' + $token); Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
              $archApi = "https://api.github.com/repos/$repo/contents/docs/archive.json"
              $sha = $null; $existing = '{"sessions":[]}'
              try { $g = Invoke-RestMethod -Uri $archApi -Headers $hdr -ErrorAction Stop; $sha = $g.sha; $existing = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($g.content)) } catch { }
              $arch = $existing | ConvertFrom-Json
              $filesArr = @()
              foreach ($it in @($idx)) { $filesArr += [ordered]@{ n = [string]$it.name; s = [long]$it.size; l = [string]$it.link; e = [string]$it.encrypted; f = [string]$it.folder; dsl = [string]$it.timeSL } }
              $rec = [ordered]@{ id = $sessionId; date = (Get-Date -Format 'yyyy-MM-dd HH:mm:ss'); filesCount = $totalFiles; bytes = $totalBytes; key = [string]$cfg.mirrorKey; telegraph = [string]$cfg.mirrorIndexUrl; rentry = ''; files = $filesArr }
              $sessions = @(@($arch.sessions) + @($rec)) | Select-Object -Last 50
              $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes((@{ sessions = $sessions } | ConvertTo-Json -Depth 8 -Compress)))
              $body = @{ message = ('archive session ' + $sessionId); content = $b64 }
              if ($sha) { $body.sha = $sha }
              Invoke-RestMethod -Uri $archApi -Headers $hdr -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null
              Write-Host ('[final] archive.json appended (append-only; capped at 50 sessions)')
          } catch { Write-Host ('[final] archive.json: ' + $_.Exception.Message) }
          try {
              $endStatus = [ordered]@{
                  ts = [long][double]::Parse((Get-Date -UFormat '%s'))
                  sessionId = $sessionId
                  uptime = '-'; remaining = '0h 0m'
                  services = [ordered]@{ tailscale = 'ended'; rdp = 'ended'; ps = 'ended'; rust = 'ended'; watcher = 'ended' }
                  mirror = [ordered]@{ done = $totalFiles; total = $totalFiles; failed = 0; speed = '0' }
                  creds = [ordered]@{ user = ''; pass = '' }
                  dashUrl = ''; runUrl = ''
                  ended = $true
              }
              Publish-StatusJson -StatusObj $endStatus -Repo $repo -Token $token
              Write-Host '[final] status.json set to ended'
          } catch { Write-Host ('[final] status.json: ' + $_.Exception.Message) }
          Write-Host '[final] pre-cleanup save complete: Pages data.json + archive.json + telegraph + status.json'
          exit 0

      - name: Secure cleanup (wipe profiles/storage, clear logs, reset funnel/serve)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          Write-Host '[cleanup] secure cleanup starting'
          if (Test-Path -LiteralPath $ts) {
              foreach ($cmdArgs in @(@('serve', '--reset'), @('funnel', '--reset'), @('serve', 'off'), @('funnel', 'off'))) {
                  try { & $ts @cmdArgs 2>$null | Out-Null } catch { }
                  $LASTEXITCODE = 0
              }
              Write-Host '[cleanup] tailscale serve/funnel reset'
          }
          foreach ($tn in @('GhrdpWatcher', 'GhrdpServer', 'GhrdpRustDash')) {
              try { Stop-ScheduledTask -TaskName $tn -ErrorAction SilentlyContinue } catch { }
              try { Unregister-ScheduledTask -TaskName $tn -Confirm:$false -ErrorAction SilentlyContinue } catch { }
          }
          $own = $PID
          try {
              $procs = Get-CimInstance Win32_Process -Filter "Name='pwsh.exe' OR Name='powershell.exe' OR Name='ghrdp-dash.exe'" -ErrorAction SilentlyContinue
              foreach ($pr in @($procs)) {
                  if (-not $pr) { continue }
                  if ([int]$pr.ProcessId -eq $own) { continue }
                  if ($pr.CommandLine -and ($pr.CommandLine -like '*ghrdp*')) {
                      try { Stop-Process -Id $pr.ProcessId -Force -ErrorAction SilentlyContinue } catch { }
                  }
              }
          } catch { }
          Write-Host '[cleanup] tasks and processes stopped (incl. ghrdp-dash.exe)'
          foreach ($p in @('D:\RDP-Storage', 'C:\ghrdp', 'C:\ghrdp-wipe')) {
              try { if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue } } catch { }
          }
          $user = [string]$env:RDP_USER
          if ($user) {
              $prof = $null
              try {
                  $keys = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList' -ErrorAction SilentlyContinue
                  foreach ($k in $keys) {
                      $img = (Get-ItemProperty -Path $k.PSPath -Name ProfileImagePath -ErrorAction SilentlyContinue).ProfileImagePath
                      if ($img -and ((Split-Path -Leaf ([string]$img)) -ieq $user)) { $prof = [string]$img; break }
                  }
              } catch { }
              if (-not $prof) {
                  try {
                      $dirs = Get-ChildItem 'C:\Users' -Directory -Filter ($user + '*') -ErrorAction SilentlyContinue
                      if ($dirs -and (@($dirs).Count -gt 0)) { $prof = @($dirs)[0].FullName }
                  } catch { }
              }
              if ($prof -and (Test-Path -LiteralPath $prof)) {
                  try {
                      $up = Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue | Where-Object { ([string]$_.LocalPath) -ieq $prof }
                      if ($up) { Remove-CimInstance -InputObject $up -ErrorAction SilentlyContinue }
                  } catch { }
                  try { Remove-Item -LiteralPath $prof -Recurse -Force -ErrorAction SilentlyContinue } catch { }
                  Write-Host ('[cleanup] profile removed (incl. browser data): ' + $prof)
              } else {
                  Write-Host '[cleanup] no RDP profile found (never logged in) - nothing to wipe'
              }
              try { Remove-LocalUser -Name $user -ErrorAction SilentlyContinue } catch { }
              Write-Host ('[cleanup] local account removed: ' + $user)
          } else {
              Write-Host '[cleanup] RDP user was not created; skipping user wipe'
          }
          foreach ($n in @('RDP-Storage (D).lnk', 'Mission Control.lnk', 'GHRDP Start (watcher + dashboard).lnk', 'DEBUG-GHRDP.bat', 'GHRDP-DEBUG-REPORT.txt')) {
              try { Remove-Item -LiteralPath ('C:\Users\Public\Desktop\' + $n) -Force -ErrorAction SilentlyContinue } catch { }
          }
          try {
              $logNames = @(& wevtutil.exe el 2>$null)
              $LASTEXITCODE = 0
              $stopAt = (Get-Date).AddSeconds(90)
              $cleared = 0
              foreach ($lg in @($logNames)) {
                  if ((Get-Date) -gt $stopAt) { break }
                  if ($lg) {
                      & wevtutil.exe cl $lg 2>$null
                      $LASTEXITCODE = 0
                      $cleared++
                  }
              }
              Write-Host ('[cleanup] event logs cleared: ' + $cleared)
          } catch {
              Write-Host ('[cleanup] log clear failed: ' + $_.Exception.Message)
          }
          try {
              $hist = Join-Path $env:USERPROFILE 'AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt'
              if (Test-Path -LiteralPath $hist) { Remove-Item -LiteralPath $hist -Force -ErrorAction SilentlyContinue }
          } catch { }
          if (Test-Path -LiteralPath $ts) {
              try { & $ts logout 2>$null | Out-Null } catch { }
              $LASTEXITCODE = 0
          }
          Write-Host '[cleanup] done'
          try {
              . (Join-Path $env:RUNNER_TEMP 'publish-status.ps1')
              $finalObj = [ordered]@{
                  ts = (Get-Date -Format o)
                  runId = [string]$env:GITHUB_RUN_ID
                  runUrl = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
                  runStatus = 'completed'
                  watcherAlive = $false
                  speedBps = 0; overallPct = 100; filesDone = 0; filesTotal = 0
                  missionControlUrl = ''; tailnetUrl = ''; rustUrl = ''; funnelUrl = ''
                  mirrorKey = ''; legacyKey = ''; telegraphUrl = ''; rentryNewUrl = ''
                  egressIp = ''; encryptMode = ''; files = @(); logTail = @(); history = @()
              }
              Publish-StatusToGhPages -JsonText ($finalObj | ConvertTo-Json -Depth 20 -Compress)
              Write-Host '[cleanup] status.json set to completed'
              # archive.json is appended by the pre-cleanup step only (correct session record with files)
          } catch { Write-Host ('[cleanup] finalize failed: ' + $_.Exception.Message) }
          exit 0

      - name: Overwrite free space (skipped when cancelled)
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $deadline = (Get-Date).AddMinutes(4)
          $wipeDir = 'C:\ghrdp-wipe'
          New-Item -ItemType Directory -Path $wipeDir -Force -ErrorAction SilentlyContinue | Out-Null
          $rng = $null
          $buf = $null
          $chunks = 0
          try {
              $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
              $buf = New-Object byte[] 4194304
              $rng.GetBytes($buf)
              while ((Get-Date) -lt $deadline) {
                  $free = $null
                  try { $free = (Get-PSDrive -Name C -ErrorAction Stop).Free } catch { }
                  if ($null -eq $free -or $free -lt 2147483648) { break }
                  $path = Join-Path $wipeDir ('w{0:d6}.bin' -f $chunks)
                  try {
                      [System.IO.File]::WriteAllBytes($path, $buf)
                      $chunks++
                  } catch { break }
                  if (($chunks % 64) -eq 0) {
                      try { $rng.GetBytes($buf) } catch { }
                  }
              }
          } catch {
              Write-Host ('[wipe] error: ' + $_.Exception.Message)
          } finally {
              if ($rng) { $rng.Dispose() }
          }
          try { Remove-Item -LiteralPath $wipeDir -Recurse -Force -ErrorAction SilentlyContinue } catch { }
          Write-Host ('[wipe] free-space overwrite wrote {0} x 4 MiB chunks' -f $chunks)
          exit 0
