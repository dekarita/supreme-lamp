          $mAcc = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Accent'; if (-not (Test-Path $mAcc)) { New-Item -Path $mAcc -Force | Out-Null }
          New-ItemProperty -Path $mAcc -Name 'AccentColorMenu' -Value 0x8c2bc4 -PropertyType DWord -Force | Out-Null; New-ItemProperty -Path $mAcc -Name 'StartColor' -Value 0x8c2bc4 -PropertyType DWord -Force | Out-Null; New-ItemProperty -Path $mAcc -Name 'AccentColor' -Value 0xffc42b8c -PropertyType DWord -Force | Out-Null
          Write-Host "Machine-wide dark mode + accent set."
          $edgePol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'; if (-not (Test-Path $edgePol)) { New-Item -Path $edgePol -Force | Out-Null }
          $crx = 'https://edge.microsoft.com/extensionwebstorebase/v1/crx'; New-ItemProperty -Path $edgePol -Name '1' -Value "odfafepnkmbhccpbejgmiehpchacaeak;$crx" -PropertyType String -Force | Out-Null; New-ItemProperty -Path $edgePol -Name '2' -Value "ifoakfbpdcdoeenechcleahebpibofpc;$crx" -PropertyType String -Force | Out-Null
          $fav = '[{"name":"FMHY Torrenting","url":"https://fmhy.net/torrenting"},{"name":"GitHub RDP Mirror","url":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe"}]'; New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value $fav -PropertyType String -Force | Out-Null
          $ffdist = 'C:\Program Files\Mozilla Firefox\distribution'; New-Item -ItemType Directory -Path $ffdist -Force | Out-Null; $ffpol = '{"policies":{"Bookmarks":[{"Title":"FMHY Torrenting","URL":"https://fmhy.net/torrenting","Placement":"toolbar"},{"Title":"GitHub RDP Mirror","URL":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe","Placement":"toolbar"}]}}'; Set-Content -Path (Join-Path $ffdist 'policies.json') -Value $ffpol -Encoding UTF8
          try { winget install --id qBittorrent.qBittorrent -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null | Out-Null; Write-Host "qBittorrent installed." } catch { Write-Host "qBittorrent winget failed." }; Reset-Exit
          try { winget install --id Parsec.Parsec -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null | Out-Null; Write-Host "Parsec installed." } catch { Write-Host "Parsec winget failed." }; Reset-Exit
          $pcfg = 'C:\ProgramData\Parsec'; New-Item -ItemType Directory -Path $pcfg -Force | Out-Null; "app_host = 1`r`nprivacy_mode = 0`r`nserver_resolution = 1920x1080" | Set-Content (Join-Path $pcfg 'config.txt') -Encoding ASCII -ErrorAction SilentlyContinue
          if (Test-Path 'C:\Program Files\Parsec\parsecd.exe') { New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'ParsecAuto' -Value '"C:\Program Files\Parsec\parsecd.exe"' -PropertyType String -Force -ErrorAction SilentlyContinue | Out-Null; Write-Host "Parsec autolaunch set." }; Reset-Exit
          $sd = $env:RUNNER_TEMP; $cfgPath = Join-Path $sd 'ghrdp_cfg.json'; $launcher = Join-Path $sd 'ghrdp-launcher.ps1'; $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"; $user = $env:RDP_USER
