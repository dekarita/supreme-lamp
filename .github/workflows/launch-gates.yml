          # 'WEB DESKTOP ready' line must reference webdeskUrl on the same line.
          if grep -n 'WEB DESKTOP ready' payloads/ui.html | grep -v '^[0-9]*:[[:space:]]*//' | grep -v 'webdeskUrl'; then
            echo 'ui.html can claim WEB DESKTOP ready without webdeskUrl' >&2
            exit 1
          fi
          grep -q 'web desktop not deployed' payloads/ui.html
          grep -q 'webdeskReason' payloads/ui.html
          grep -q 'webdeskReason' payloads/ghrdp-server.ps1
          grep -q "webdeskReason = \$wdr" payloads/ghrdp-server.ps1
          # Web-desktop step must fail LOUD: all 6 skip paths record a reason.
          grep -q 'webdeskReason' .github/workflows/main.yml
          grep -q 'VNC_PASS not set - web desktop disabled' .github/workflows/main.yml
          step=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          # NOTE (all gates in this file): grep the shell variables via
          # herestring, NEVER via `printf '%s' "$var" | grep -q`. Under
          # `set -o pipefail`, grep -q's early exit SIGPIPEs printf (141),
          # which pipefail propagates, so `if ! ...` fails DESPITE the match.
          # It is scheduler-dependent (flaky across identical runs).
          n=$(grep -c "Set-WebdeskCfg ''" <<< "$step" || true)
          if [ "$n" -lt 6 ]; then
            echo "web-desktop step has silent skip paths (only $n reason writes)" >&2
            exit 1
          fi
          # No fabricated serve URL: a URL needs a real serve mapping.
          if grep -n "serveUrl = 'https://' + \$fq" .github/workflows/main.yml; then
            echo 'web-desktop step fabricates a serve URL without a mapping' >&2
            exit 1
          fi
          # Self-test step must exist and gate on the noVNC marker.
          grep -q 'Web desktop self-test' .github/workflows/main.yml
          teststep=$(awk '/Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          grep -q 'noVNC' <<< "$teststep"
          grep -q 'self-test PASS' <<< "$teststep"
          grep -q 'self-test FAIL' <<< "$teststep"
      - name: F9l web-desktop self-heal + diagnostics gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          # Region = the self-test step through the diagnostics steps (ends at
          # the dashboard step, exactly like the F8 gate).
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF")
          # Assert against CODE, never against prose: comment text must not be
          # able to satisfy (or mask) a gate.
          code=$(grep -vE '^[[:space:]]*#' <<< "$teststep")
          # A) [F9n] The self-test must curl the EXACT advertised URL (the value
          #    the dashboard opens) plus the backend root on the tailnet IP.
          if ! grep -qF 'Invoke-Probe $url' <<< "$code"; then
            echo 'self-test does not curl the exact advertised URL (Invoke-Probe $url missing)' >&2
            exit 1
          fi
          if ! grep -qF -- "'backend-root'" <<< "$code"; then
            echo 'self-test lacks the backend-root probe' >&2
            exit 1
          fi
          # B) Dead backend must be healed by CALLING the idempotent launcher
          #    (the function definition alone proves nothing).
          if ! grep -qF '$started = Start-Websockify' <<< "$teststep"; then
            echo 'self-test cannot heal the backend leg ($started = Start-Websockify missing)' >&2
            exit 1
          fi
          # C) [F9n] serve is retired: no mapping reset may survive, and the
          #    classifier must capture firewall evidence (the GHRDP-Webdesk
          #    rule state) instead of serve status.
          if grep -qF -- "'--bg'" <<< "$code"; then
            echo 'self-test still carries a retired serve reset form' >&2
            exit 1
          fi
          if ! grep -q 'GHRDP-Webdesk' <<< "$code"; then
            echo 'self-test does not capture GHRDP-Webdesk firewall evidence' >&2
            exit 1
          fi
          # D) [F9n] The classification tokens must exist (diagnosis, not guessing).
          for tok in backend-dead firewall marker-missing; do
            if ! grep -q "verdict = '$tok'" <<< "$code"; then
              echo "self-test cannot classify: '$tok' missing" >&2
              exit 1
            fi
          done
          # E) Fail-closed: the halt must still write the locked codes + throw.
          if ! grep -q "\$cfgF.webdeskReason = 'serve-failed'" <<< "$code"; then
            echo 'self-test halt no longer writes webdeskReason=serve-failed' >&2
            exit 1
          fi
          if ! grep -q "throw ('Web desktop self-test FAILED" <<< "$code"; then
            echo 'self-test halt no longer throws (fail-closed)' >&2
            exit 1
          fi
          # F) The F9l-1 launcher must exist in BOTH steps as byte-identical text
          #    (a divergent copy silently changes recovery behaviour).
          n=$(grep -c '^          function Start-Websockify(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Start-Websockify copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Start-Websockify\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Start-Websockify copies diverged - edit both or neither' >&2
            exit 1
          fi
          launcher=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF")
          # [F11-5.3] SUPERSEDES the F9n 'must not hide' rule: websockify is a
          # host helper, so it MUST launch hidden - the first interactive RDP
          # session must show no stray console window. The byte-identical
          # two-copy contract above is unchanged.
          if ! grep -Fq -- '-WindowStyle Hidden' <<< "$launcher"; then
            echo 'Start-Websockify must launch hidden (F11-5.3: no console window in the interactive session)' >&2
            exit 1
          fi
          # G) Survivable diagnostics: the webdesk steps must stage + upload the
          #    'webdesk-diag' artifact, and the upload path must stay inside the
          #    workspace - upload-artifact v4 rejects absolute host paths
          #    (proven by the first lab run: 'rootDirectory ... is not a parent
          #    directory of the file C:\ghrdp\webdesk\websockify.log').
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          if ! grep -q 'actions/upload-artifact' <<< "$webdesk_all"; then
            echo 'web-desktop steps do not upload the diagnostics artifact' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+name: webdesk-diag[[:space:]]*$' <<< "$webdesk_all"; then
            echo "web-desktop steps do not upload the 'webdesk-diag' artifact" >&2
            exit 1
          fi
          upload=$(awk '/Web desktop diagnostics artifact/{f=1} f && /^      - name: / && !/Web desktop diagnostics artifact/{exit} f' "$WF")
          if ! grep -q 'if: always()' <<< "$upload"; then
            echo 'the diagnostics upload must use if: always() (it must survive a halt)' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+path: webdesk-diag[[:space:]]*$' <<< "$upload"; then
            echo 'the diagnostics upload must use the workspace-relative staging dir' >&2
            exit 1
          fi
          if grep -qE 'C:\\+ghrdp|runner\.temp' <<< "$upload"; then
            echo 'diagnostics upload uses absolute paths - upload-artifact v4 will fail (stage inside the workspace instead)' >&2
            exit 1
          fi
      - name: F9n tailnet-HTTP transport gates (serve retired for webdesk)
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          # 1) tailscale serve is retired in the webdesk path: no invocation or
          #    serve machinery may survive. The single allowed mention is the
          #    mandated retirement transport note in the deploy summary.
          rest=$(grep -v 'tailscale serve retired' <<< "$webdesk_all")
          if grep -q 'tailscale serve' <<< "$rest"; then
            echo "webdesk steps still use 'tailscale serve' (retired: Windows SYSTEM operator lock 401)" >&2
            exit 1
          fi
          for tok in 'serve status' 'set-raw' 'Get-WebdeskServeUrl' "'--bg'"; do
            if grep -qF -- "$tok" <<< "$webdesk_all"; then
              echo "webdesk steps still carry retired serve machinery: $tok" >&2
              exit 1
            fi
          done
          # 2) the CGNAT-only firewall rule must be created (idempotent) + evidenced.
          if ! grep -q "New-NetFirewallRule.*GHRDP-Webdesk" <<< "$webdesk_all"; then
            echo 'webdesk deploy step lacks the GHRDP-Webdesk firewall rule' >&2
            exit 1
          fi
          if ! grep -q "RemoteAddress '100.64.0.0/10'" <<< "$webdesk_all"; then
            echo 'GHRDP-Webdesk rule is not scoped to 100.64.0.0/10' >&2
            exit 1
          fi
          if ! grep -q "LocalPort 7333" <<< "$webdesk_all"; then
            echo 'GHRDP-Webdesk rule does not target port 7333' >&2
            exit 1
          fi
          # 3) the tailnet IP must come from config.rdpIp with CGNAT validation
          #    (fail-closed, no fabrication). [F25] The read is now a L1/L2/L3
          #    ladder over config.json + step env (see the F25 gate below); the
          #    `tailscale ip` LocalAPI fallback is still banned, so the 401 the
          #    F9n evidence documents cannot recur here.
          if ! grep -q 'cfgR.rdpIp' <<< "$webdesk_all"; then
            echo 'webdesk deploy step does not read config.rdpIp' >&2
            exit 1
          fi
          if ! grep -q 'tailnet-ip-unavailable' <<< "$webdesk_all"; then
            echo 'webdesk deploy step lacks the tailnet-ip-unavailable fail-closed path' >&2
            exit 1
          fi
          # 4) the server must enforce the webdeskUrl acceptance allowlist.
          if ! grep -q 'F9n] webdeskUrl acceptance allowlist' payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 lacks the F9n webdeskUrl acceptance allowlist' >&2
            exit 1
          fi
          if ! grep -q "6\[4-9\]" payloads/ghrdp-server.ps1; then
            echo 'server allowlist lacks the CGNAT 100.64-127 pattern' >&2
            exit 1
          fi
          if ! grep -q 'ts\\.net/' payloads/ghrdp-server.ps1; then
            echo 'server allowlist lacks the legacy https ts.net alternative' >&2
            exit 1
          fi
      - name: F25 tailnet IP ladder + writer assertion gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          # The two steps F25 changes, isolated as regions so a marker found in
          # some other step cannot satisfy a gate.
          webdesk=$(awk '/^      - name: Web desktop \(noVNC/{f=1} /^      - name: Web desktop self-test/{f=0} f' "$WF")
          stage=$(awk '/^      - name: Stage files \+ write config\.json/{f=1} /^      - name: RDP listener self-probe/{f=0} f' "$WF")
          if [ -z "$webdesk" ]; then echo 'webdesk deploy step not found' >&2; exit 1; fi
          if [ -z "$stage" ]; then echo 'stage config writer step not found' >&2; exit 1; fi

          # --- 1) the L1/L2/L3 ladder exists and every rung is CGNAT-validated --
          for tok in 'cfgR.rdpIp' 'cfgR.runnerResolvedIP' 'env:RUNNER_RESOLVED_IP' 'Resolve-DnsName'; do
            if ! grep -qF -- "$tok" <<< "$webdesk"; then
              echo "webdesk step lacks ladder source: $tok" >&2; exit 1
            fi
          done
          # Each rung is gated on the ONE shared CGNAT pattern AND on "not already
          # won", which is what makes this an ordered, first-valid-wins ladder.
          for tok in 'if ($rawL1.Trim() -match $cgnat)' \
                     '-not $rdpIp -and $rawL2.Trim() -match $cgnat' \
                     '-not $rdpIp -and $dnsCand -match $cgnat' \
                     '-not $rdpIp -and $rawL3.Trim() -match $cgnat'; do
            if ! grep -qF -- "$tok" <<< "$webdesk"; then
              echo "webdesk IP rung missing or not CGNAT-validated: $tok" >&2; exit 1
            fi
          done
          if ! grep -qF -- '100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.' <<< "$webdesk"; then
            echo 'webdesk ladder lost the CGNAT 100.64.0.0/10 pattern' >&2; exit 1
          fi
          # Anchored at BOTH ends. The bare §2 prefix form also accepts
          # "100.83.13.45evil" / "100.83.13.45.attacker.tld", and this is the one
          # place where the accepted value is pasted into the advertised webdesk
          # URL and the websockify BindIp (§6: no URL fabrication).
          if ! grep -qE "\\\$cgnat = '\^100.*\\\$'" <<< "$webdesk"; then
            echo 'the ladder CGNAT pattern must be anchored at both ends (^...$)' >&2; exit 1
          fi
          # [F9n] preserved: `tailscale ip` must STILL never be CALLED in this step
          # (post-connect LocalAPI returns 401 - node owned by NT AUTHORITY\SYSTEM).
          # Comments may still discuss the command, so strip them before checking.
          webdesk_code=$(grep -vE '^[[:space:]]*#' <<< "$webdesk")
          if grep -qE 'tailscale(\.exe)? ip' <<< "$webdesk_code"; then
            echo 'webdesk step calls `tailscale ip` (F9n SYSTEM-operator 401 lock)' >&2; exit 1
          fi

          # --- 2) the per-source diagnostic dump on the fail-closed path --------
          # The dump string is composed at runtime, so pin the CONSTRUCTION:
          # the 'L1 .. | L2 .. | L3 ..' assembly plus each per-source raw label.
          for tok in 'tailnet-ip-source-dump' \
                     "\$ipDump = ('L1 ' + \$ipDiag.L1 + ' | L2 ' + \$ipDiag.L2 + ' | L3 ' + \$ipDiag.L3)" \
                     "('rdpIp=' + \$(if (\$rawL1)" \
                     "('runnerResolvedIP=' + \$(if (\$rawL2)" \
                     "('env=' + \$(if (\$rawL3)" \
                     'PSObject.Properties' 'tailnet-ip-unavailable' \
                     'tailnet-ip-sources.txt'; do
            if ! grep -qF -- "$tok" <<< "$webdesk"; then
              echo "webdesk step lacks the per-source diagnostic dump token: $tok" >&2; exit 1
            fi
          done
          # The dump must be printed BEFORE the throw, so a halting run still
          # shows which source was empty (the F25 post-mortem requirement).
          dump_line=$(grep -nF -- 'tailnet-ip-source-dump' <<< "$webdesk" | head -1 | cut -d: -f1)
          throw_line=$(grep -nF -- "throw 'Web desktop not deployed: tailnet-ip-unavailable" <<< "$webdesk" | head -1 | cut -d: -f1)
          if [ -z "$dump_line" ] || [ -z "$throw_line" ] || [ "$dump_line" -ge "$throw_line" ]; then
            echo 'per-source dump must be emitted before the tailnet-ip-unavailable throw' >&2; exit 1
          fi

          # --- 3) the stage step READS BACK what it wrote -----------------------
          for tok in 'config-writer lost tailnet IP' 'F25 read-back assertion PASS' \
                     'ReadAllText($cfgPathStage)' 'runnerResolvedIP'; do
            if ! grep -qF -- "$tok" <<< "$stage"; then
              echo "stage step lacks the F25 read-back assertion token: $tok" >&2; exit 1
            fi
          done
          wr_line=$(grep -nF -- "WriteAllText((Join-Path \$root 'config.json')" <<< "$stage" | head -1 | cut -d: -f1)
          rd_line=$(grep -nF -- 'ReadAllText($cfgPathStage)' <<< "$stage" | head -1 | cut -d: -f1)
          if [ -z "$wr_line" ] || [ -z "$rd_line" ] || [ "$rd_line" -le "$wr_line" ]; then
            echo 'stage read-back must read config.json AFTER the write' >&2; exit 1
          fi

          # --- 4) no overwrite-style config.json writer (§3.2/§3.3) -------------
          # Every step region that WRITES config.json must also READ it in the
          # same region. An overwrite-style writer rebuilds config.json from a
          # partial object and drops properties - the F25 failure class.
          python3 tests/config-writer-audit.py "$WF"
      - name: F9o TightVNC password-ladder gates (auth probe + labeled degrade)
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          deploy=$(awk '/Web desktop \(noVNC/{f=1} /^      - name: Web desktop self-test/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          # 1) the password mangler must be gone: no package-manager install of
          #    TightVNC may survive in EITHER webdesk step (deploy or self-test).
          for region in deploy teststep; do
            if grep -q 'choco install tightvnc' <<< "${!region}"; then
              echo "webdesk $region still carries the password-mangling install path" >&2
              exit 1
            fi
          done
          # 2) L1: ALWAYS direct msiexec with the full property list (download
          #    first; REINSTALL pair when the uninstall key exists).
          if ! grep -q 'tightvnc-2.8.85-gpl-setup-64bit.msi' <<< "$deploy"; then
            echo 'deploy step does not download the TightVNC MSI first (L1)' >&2
            exit 1
          fi
          for prop in 'VALUE_OF_PASSWORD=' 'VALUE_OF_CONTROLPASSWORD=' 'SET_PASSWORD=1' 'SET_CONTROLPASSWORD=1' 'REINSTALL=Server' 'REINSTALLMODE=omus'; do
            if ! grep -qF -- "$prop" <<< "$deploy"; then
              echo "L1 msiexec property missing: $prop" >&2
              exit 1
            fi
          done
          # 3) L2: restart + registry pin (SecurityTypes=VncAuth) + Password blob check.
          if ! grep -q "SecurityTypes.*VncAuth" <<< "$deploy"; then
            echo 'L2 must pin SecurityTypes to VncAuth' >&2
            exit 1
          fi
          if ! grep -q 'Password.*Length.*-ge 8\|\$pwdLen -ge 8\|-ge 8' <<< "$deploy"; then
            echo 'L2 must verify the Password blob length >= 8' >&2
            exit 1
          fi
          # 4) L3/L4: the REAL auth probe (vncdotool vs 127.0.0.1:5900) must exist
          #    in the deploy step, with redaction and a reinstall retry.
          if ! grep -q 'vncdotool' <<< "$deploy"; then
            echo 'deploy step lacks the vncdotool auth probe (L3)' >&2
            exit 1
          fi
          if ! grep -q '127.0.0.1::5900' <<< "$deploy"; then
            echo 'auth probe must target 127.0.0.1::5900' >&2
            exit 1
          fi
          if ! grep -q '\[redacted\]' <<< "$deploy"; then
            echo 'auth probe lacks password redaction' >&2
            exit 1
          fi
          if ! grep -q 'choco uninstall tightvnc' <<< "$deploy"; then
            echo 'L4 retry lacks the manager-held uninstall + fresh msiexec path' >&2
            exit 1
          fi
          # 5) L5: LABELED degrade - the exact WARNING string + the auth stamp +
          #    the fail-closed unverifiable detail. Never silent, never hidden.
          if ! grep -qF 'VNC password gate could not be applied; access limited to tailnet firewall 100.64.0.0/10; rotate VNC_PASS and re-dispatch to restore the gate' <<< "$deploy"; then
            echo 'L5 degrade path lacks the mandated summary WARNING string' >&2
            exit 1
          fi
          if ! grep -q "none-tailnet-only" <<< "$deploy"; then
            echo "L5 must stamp webdeskAuth='none-tailnet-only'" >&2
            exit 1
          fi
          if ! grep -q 'vnc-auth-unverifiable' <<< "$deploy"; then
            echo 'deploy step lacks the vnc-auth-unverifiable fail-closed path' >&2
            exit 1
          fi
          # 6) self-test: HTTP marker AND the mode-matching VNC probe (vnc-auth
          #    verdict on mismatch), with probe codes in the artifact payload.
          if ! grep -q 'vncdotool' <<< "$teststep"; then
            echo 'self-test lacks the vncdotool probe' >&2
            exit 1
          fi
          if ! grep -q 'webdeskAuth' <<< "$teststep"; then
            echo 'self-test lacks mode-matching (webdeskAuth)' >&2
            exit 1
          fi
          if ! grep -q "verdict = 'vnc-auth'" <<< "$teststep"; then
            echo "self-test lacks the 'vnc-auth' verdict" >&2
            exit 1
          fi
          if ! grep -q 'vncprobe-codes.txt' <<< "$teststep"; then
            echo 'self-test does not record vncprobe-codes.txt' >&2
            exit 1
          fi
          if ! grep -q 'tightvnc-tail.txt' <<< "$teststep"; then
            echo 'artifact payload lacks tightvnc-tail.txt' >&2
            exit 1
          fi
          # 7) the two probe copies must be byte-identical (like Start-Websockify).
          n=$(grep -c '^          function Invoke-VncAuthProbe(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Invoke-VncAuthProbe copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Invoke-VncAuthProbe\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Invoke-VncAuthProbe\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Invoke-VncAuthProbe copies diverged - edit both or neither' >&2
            exit 1
          fi
          # 8) server + UI must expose the verified auth mode.
          if ! grep -q 'webdeskAuth' payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 does not expose webdeskAuth' >&2
            exit 1
          fi
          if ! grep -q "webdeskAuth = \$wda" payloads/ghrdp-server.ps1; then
            echo 'native-status does not return webdeskAuth' >&2
            exit 1
          fi
          if ! grep -q 'VNC auth mode' payloads/ui.html; then
            echo 'ui.html lacks the VNC auth mode row' >&2
            exit 1
          fi
          if ! grep -q 'webdeskAuthAdvisory' payloads/ui.html; then
            echo 'ui.html lacks the degraded-mode advisory' >&2
            exit 1
          fi
      - name: F9 MagicDNS halt + link gates
        shell: bash
        run: |
          set -euo pipefail
          # F9a/F9f: every MagicDNS gate (tailscale-connect, cert-bind,
          # stage/config) must carry the actionable admin link in its failure
          # output (log + step summary + thrown message) - at least one per
          # gate, so three minimum across main.yml.
          n=$(grep -c 'login.tailscale.com/admin/dns' .github/workflows/main.yml || true)
          if [ "$n" -lt 3 ]; then
            echo "main.yml carries only $n 'login.tailscale.com/admin/dns' links (need >= 3: one per MagicDNS gate)" >&2
            exit 1
          fi
          # F9f: no MagicDNS validation may pass without a non-empty *.ts.net
          # Self.DNSName. Every step that reads Self.DNSName must validate it
          # against the ts.net pattern (empty / tailnet-IP / other names halt).
          bad=$(awk '
            /^      - name: / { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; buf = "" }
            { buf = buf $0 "\n" }
            END { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; print n + 0 }
          ' .github/workflows/main.yml)
          if [ "$bad" -ne 0 ]; then
            echo 'a step reads Self.DNSName without a non-empty *.ts.net validation - a MagicDNS gate could pass on an empty or non-ts.net name' >&2
            exit 1
          fi
      - name: F9k secret-halt + cascade gates
        shell: bash
        run: |
          set -euo pipefail
          # The TS_AUTHKEY halt must carry the clickable Tailscale admin keys link.
          if ! grep -q 'login.tailscale.com/admin/settings/keys' .github/workflows/main.yml; then
            echo "main.yml lacks 'login.tailscale.com/admin/settings/keys' (TS_AUTHKEY halt link)" >&2
            exit 1
          fi
          # Secret fix instructions must link the repo secrets settings page.
          if ! grep -q 'settings/secrets/actions' .github/workflows/main.yml; then
            echo "main.yml lacks 'settings/secrets/actions' (repo secrets settings link)" >&2
            exit 1
          fi
          # Every ghrdp-lib.ps1 dot-source must carry exactly one '# [F9k-guard]'
          # cascade guard, and the gate must not be vacuous.
          guards=$(grep -cF '# [F9k-guard]' .github/workflows/main.yml || true)
          dotsrc=$(grep -c "\. (Join-Path \$root 'ghrdp-lib.ps1')" .github/workflows/main.yml || true)
          if [ "$dotsrc" -lt 1 ]; then
            echo 'no ghrdp-lib.ps1 dot-sources found - gate would be vacuous' >&2
            exit 1
          fi
          if [ "$guards" -ne "$dotsrc" ]; then
            echo "F9k guard count ($guards) != ghrdp-lib dot-source count ($dotsrc)" >&2
            exit 1
          fi
      - name: F27 ticket and password-sink gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/f27-copy.test.js tests/f27-handoff.test.js
      # [F28] Close the logon-result loop + one-click recovery + the fallback gap.
      # Every assertion below is on a SHIPPED surface (server, page, launcher) and
      # fails on the specific regression it names - the lab cell V + the Windows
      # lane then drive the same code with synthetic events / real csc.
      - name: F28 logon-result loop + one-click recovery + fallback-gap gates
        shell: bash
        run: |
          set -euo pipefail
          srv=payloads/ghrdp-server.ps1
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          wf=.github/workflows/main.yml
          blk() { awk -v b="$2" -v e="$3" 'index($0,b){f=1} f{print} f&&index($0,e){exit}' "$1"; }
          # --- §1 server-side 30s logon scanner (from SERVER START) -------------
          scan=$(blk "$srv" '# [F28 §1 scanner-begin]' '# [F28 §1 scanner-end]')
          test -n "$scan" || { echo 'F28: the server-side logon scanner block is missing' >&2; exit 1; }
          for tok in '$script:F28IntervalSec = 30' '$script:F28StaleSec = 90' \
                     'function Get-RdpLogonEventFields' 'function Get-RdpLogonAuthLast' \
                     'function Update-RdpLogonAuthLast' 'function Get-RdpLogonCollectorState' \
                     "Id = @(4624, 4625)" 'LogonType 10' "'security-log-unreadable'" \
                     'result      = $result' 'sub         = $sub' 'eventTs     = $eventTs' \
                     'scanTs      = $scanTs' 'windowStart' 'count4624' 'subMeaning'; do
            grep -qF -- "$tok" <<< "$scan" || { echo "F28: scanner block missing token: $tok" >&2; exit 1; }
          done
          # scanTs is stamped BEFORE any verdict branch: every path carries it, so
          # "no scanTs" can only ever mean a dead collector - never a quiet window.
          s_scan=$(grep -nF '$scanTs = (Get-Date)' <<< "$scan" | head -1 | cut -d: -f1)
          s_res=$(grep -nF "\$result = 'none'" <<< "$scan" | head -1 | cut -d: -f1)
          test -n "$s_scan" && test -n "$s_res" && test "$s_scan" -lt "$s_res" || { echo 'F28: scanTs is not stamped before the verdict branches' >&2; exit 1; }
          # secret-free: the scanner may carry codes/target account only.
          if grep -Eq 'SubjectUserName|IpAddress|"Password"|ChangePassword' <<< "$scan"; then
            echo 'F28: the logon scanner references subject/address/password fields' >&2; exit 1
          fi
          # the tick is IN the server process (start + 30s interval), never in the
          # workflow keep-alive step - that dependency is the F24 defect this closes.
          grep -qF '$script:ServerStartedUtc = (Get-Date).ToUniversalTime()' "$srv" || { echo 'F28: the server start clock is missing' >&2; exit 1; }
          grep -qF 'try { Update-RdpLogonAuthLast -StatePath $script:LogonStatePath -ScanStartedUtc $script:ServerStartedUtc | Out-Null } catch { }' "$srv" || { echo 'F28: the startup scan is missing' >&2; exit 1; }
          grep -qF 'if (((Get-Date) - $lastLogonScan).TotalSeconds -ge $script:F28IntervalSec)' "$srv" || { echo 'F28: the 30s tick is missing from the accept loop' >&2; exit 1; }
          if grep -q 'Update-RdpLogonAuthLast' "$wf"; then
            echo 'F28: the logon scan leaked into the keep-alive workflow (must be server-side only)' >&2; exit 1
          fi
          # served surface + the collector liveness the page needs
          for tok in 'rdpListener = $rlOut' '-NotePropertyName authLast' '-NotePropertyName logonCollector' \
                     '-NotePropertyName credsspLive' '$logonState.authLast' '$logonState.logonCollector' \
                     'alive       = $alive' 'uptimeSec   = $uptime' 'lastScanAgeSec = $ageSec'; do
            grep -qF -- "$tok" "$srv" || { echo "F28: native-status wiring missing: $tok" >&2; exit 1; }
          done
          # --- §1.2 page: verbatim row + RED collector-dead ---------------------
          grep -qF 'logon collector not running' "$ui" || { echo 'F28: the collector-dead render is missing' >&2; exit 1; }
          grep -qF "scanned '+authLast.scanTs" "$ui" || { echo 'F28: the LAST RDP LOGON row does not render scanTs' >&2; exit 1; }
          grep -qF "if(!authLast.scanTs){ return {text:'logon collector not running" "$ui" || { echo 'F28: a missing scanTs must render as collector-dead' >&2; exit 1; }
          grep -qF 'function logonRowText(authLast,collector,nowMs)' "$ui" || { echo 'F28: logonRowText is missing' >&2; exit 1; }
          # --- §1.3/§2 correlator + one-click recovery --------------------------
          grep -qF 'function recoveryDecision(authLast,chain,nowMs)' "$ui" || { echo 'F28: the recovery correlator is missing' >&2; exit 1; }
          grep -qF "String(authLast.sub||'').toUpperCase()!=='0XC000006A'" "$ui" || { echo 'F28: the recovery correlator does not gate on the wrong-password sub-status' >&2; exit 1; }
          grep -qF '/^mstsc-started/' "$ui" || { echo 'F28: the recovery correlator does not require an mstsc-started beacon' >&2; exit 1; }
          grep -qF 'if(dtSec>120)' "$ui" || { echo 'F28: the recovery correlator has no 120s window' >&2; exit 1; }
          grep -qF 'id="recoveryRow"' "$ui" || { echo 'F28: the RECOVERY card is missing' >&2; exit 1; }
          grep -qF 'id="btnFixReconnect"' "$ui" || { echo 'F28: the FIX & RECONNECT button is missing' >&2; exit 1; }
          grep -qF 'FIX &amp; RECONNECT' "$ui" || { echo 'F28: the button label is not FIX & RECONNECT' >&2; exit 1; }
          grep -qF 'Password rejected by the host' "$ui" || { echo 'F28: the recovery card text is missing' >&2; exit 1; }
          grep -qF "POST /api/rdp-token" "$ui" && grep -qF "apiBase()+'/api/rdp-token'" "$ui" || { echo 'F28: the recovery click does not mint a fresh ticket' >&2; exit 1; }
          # the recovery URL: ticket + identity ONLY, and the click appends t.
          ru=$(blk "$ui" '[F28 §2 recovery-url-begin]' '[F28 §2 recovery-url-end]')
          test -n "$ru" || { echo 'F28: the recovery URL region is missing' >&2; exit 1; }
          grep -qF "ghrdp://recred?server=" <<< "$ru" || { echo 'F28: the recovery URL is not ghrdp://recred' >&2; exit 1; }
          grep -qF "&user=" <<< "$ru" || { echo 'F28: the recovery URL drops the user' >&2; exit 1; }
          if grep -Eq "pass=|password=|pwd=|passwd=|key=|token=|secret=|apikey=" <<< "$ru"; then
            echo 'F28: the recovery URL can carry a password (tickets only)' >&2; exit 1
          fi
          # [F37 §3] the trace is minted first; the bearer ticket stays LAST and
          # stays the only credential-shaped parameter.
          grep -qE "ghrdpRecredUrl\(fqdn,user\)\+traceParam\(\)\+'&t='" "$ui" || { echo 'F28: the recovery click does not append the ticket (after the F37 trace)' >&2; exit 1; }
          # the card is copy-only apart from the single button (handler attached in JS)
          card=$(awk '/id="recoveryRow"/{f=1} f{print} f&&/id="btnFixReconnect"/{exit}' "$ui")
          handlers=$(grep -o 'onclick="[^"]*"' <<< "$card" || true)
          if [ -n "$handlers" ] && grep -qv 'onclick="copyById(' <<< "$handlers"; then
            echo 'F28: a non-copy control appeared in the recovery card' >&2; exit 1
          fi
          grep -qF "copyById('recoveryCmdkey'" "$ui" || { echo 'F28: the manual cmdkey escape hatch copy-line is missing' >&2; exit 1; }
          grep -qF "cmdkey /generic:TERMSRV/" "$ui" || { echo 'F28: the valueless cmdkey prompt line is missing' >&2; exit 1; }
          # --- §3 launcher: recred + the closed fallback gap --------------------
          grep -qF 'if (verb == "recred") { return RecredStep(' "$cs" || { echo 'F28: the recred verb is not implemented' >&2; exit 1; }
          grep -qF '"recred-redeemed"' "$cs" || { echo 'F28: the recovery beacon chain start is missing' >&2; exit 1; }
          grep -qF 'private static string CredentialFallbackDecision(bool storeMissing, bool ticketPresent, bool retryOk)' "$cs" || { echo 'F28: the shared fallback decision function is missing' >&2; exit 1; }
          grep -qF 'if (storeOutcome == "stored") { return MstscStep(server, user, host, port); }' "$cs" || { echo 'F28: the stored-path launch is missing' >&2; exit 1; }
          grep -qF 'if (storeOutcome == "abort") { return 1; }' "$cs" || { echo 'F28: an aborted credential prompt must not launch mstsc' >&2; exit 1; }
          grep -qF 'CredentialFallbackDecision(true, ticketPresent, retryOk)' "$cs" || { echo 'F28: the stored=false path does not use the decision function' >&2; exit 1; }
          grep -qF 'retrying the one-time ticket redemption ONCE (F28 fallback-gap)' "$cs" || { echo 'F28: the single ticket retry is missing' >&2; exit 1; }
          # the native-prompt BEACON must precede the launch it announces
          ms=$(awk '/private static int MstscStep/{f=1} f{print} /private static int DoWork/{exit}' "$cs")
          b=$(grep -nF 'fallback-mstsc-native-prompt' <<< "$ms" | head -1 | cut -d: -f1)
          l=$(grep -nF 'new ProcessStartInfo("mstsc.exe"' <<< "$ms" | head -1 | cut -d: -f1)
          test -n "$b" && test -n "$l" && test "$b" -lt "$l" || { echo 'F28: the native-prompt beacon is not emitted before the mstsc launch' >&2; exit 1; }
          grep -qF 'process.ArgumentList' "$cs" 2>/dev/null || true
          grep -qF '/prompt' "$cs" || { echo 'F28: the native credential prompt launch flag is missing' >&2; exit 1; }
          grep -qF 'private static int FallbackSelfTestMain()' "$cs" || { echo 'F28: the decision selftest harness is missing' >&2; exit 1; }
          # beacon allowlist on the server side accepts both new details
          grep -qF 'recred-redeemed' "$srv" || { echo 'F28: the beacon allowlist lacks recred-redeemed' >&2; exit 1; }
          grep -qF 'fallback-mstsc-native-prompt' "$srv" || { echo 'F28: the beacon allowlist lacks fallback-mstsc-native-prompt' >&2; exit 1; }
          # refusals stay refused (re-asserted here so an F28 edit cannot reopen them)
          if grep -nE '/pass:[^[:space:]"]' "$cs"; then echo 'F28: a value-bearing /pass: switch appeared' >&2; exit 1; fi
          if grep -nE 'cmdkey[^"]*/delete' "$cs"; then echo 'F28: the launcher gained a credential-deletion verb' >&2; exit 1; fi
          # --- §4 CREDSSP row: live probe primary, stamp secondary ---------------
          grep -qF 'function credsspVerdict(rl)' "$ui" || { echo 'F28: the shared CredSSP verdict function is missing' >&2; exit 1; }
          grep -qF 'var credsspOk=credsspVerdict(rl).ok;' "$ui" || { echo 'F28: the listener gate does not use the shared verdict' >&2; exit 1; }
          grep -qF "cse.textContent='OK (live probe)'+stampTxt" "$ui" || { echo 'F28: the CREDSSP row does not render the live probe' >&2; exit 1; }
          grep -qF "stampTxt=' (stamp: '+(csStamp||'none')+')'" "$ui" || { echo 'F28: the CREDSSP row does not show the config stamp as secondary' >&2; exit 1; }
          grep -qF "rdpListener.credsspLive==='warn'" "$ui" || { echo 'F28: the live-probe warn branch is missing' >&2; exit 1; }
          # the pending render survives ONLY for the no-probe-no-stamp case: the
          # node matrix (F28-4) drives a live probe and asserts it can never print.
          grep -qF "if(csLive==='ok')" "$ui" || { echo 'F28: the live branch is not first' >&2; exit 1; }
          echo 'F28 gates PASS'
      # [F30] TLS/CIPHER HANDSHAKE FIX + CREDENTIAL TYPE NORMALIZATION + STALE
      # ENTRY PURGE. Every assertion names the regression it blocks; the §5
      # checks here are the static half, and tests/f30-tls-cipher.test.js EXECUTES
      # the shipped renderer + bounded surfaces (then the Windows lane + lab cell
      # X drive the same code with real cipher suites / credential store / events).
      - name: F30 TLS/cipher + purge + connlog gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          cs=payloads/ghrdp-rdp-launcher.cs
          srv=payloads/ghrdp-server.ps1
          ui=payloads/ui.html
          # --- §1 the normalization step sits after cert bind, before advertise --
          cert_line=$(grep -n 'name: Bind tailnet LE cert to RDP-Tcp' "$wf" | head -1 | cut -d: -f1)
          f30_line=$(grep -n 'name: TLS/cipher normalization (F30' "$wf" | head -1 | cut -d: -f1)
          adv_line=$(grep -n 'name: RDP listener self-probe (F17' "$wf" | head -1 | cut -d: -f1)
          test -n "$cert_line" && test -n "$f30_line" && test -n "$adv_line" || { echo 'F30: a required main.yml step is missing' >&2; exit 1; }
          test "$cert_line" -lt "$f30_line" || { echo 'F30: normalization must run AFTER cert bind' >&2; exit 1; }
          test "$f30_line" -lt "$adv_line" || { echo 'F30: normalization must run BEFORE the host is advertised' >&2; exit 1; }
          # the ordered suite list is declared verbatim AND in the spec order -
          # a reordered list is the exact regression this gate exists for.
          blk() { awk -v b="$2" -v e="$3" 'index($0,b){f=1} f{print} f&&index($0,e){exit}' "$1"; }
          nb=$(blk "$wf" '# [F30 §1 normalize-begin]' '# [F30 §1 normalize-end]')
          test -n "$nb" || { echo 'F30: the extractable normalize block is missing' >&2; exit 1; }
          prev=0
          for suite in TLS_AES_256_GCM_SHA384 TLS_CHACHA20_POLY1305_SHA256 TLS_AES_128_GCM_SHA256 TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256; do
            ln=$(grep -n "'$suite'" <<< "$nb" | head -1 | cut -d: -f1)
            test -n "$ln" || { echo "F30: cipher suite missing from the ordered list: $suite" >&2; exit 1; }
            test "$ln" -gt "$prev" || { echo "F30: cipher suite OUT OF ORDER: $suite" >&2; exit 1; }
            prev=$ln
          done
          grep -qF 'Enable-TlsCipherSuite' <<< "$nb" || { echo 'F30: no cipher suite is ever enabled' >&2; exit 1; }
          grep -qF 'Set-F30CipherOrder' <<< "$nb" || { echo 'F30: the suite ORDER is never enforced' >&2; exit 1; }
          grep -qF 'Test-F30Order' <<< "$nb" || { echo 'F30: the order verdict is missing' >&2; exit 1; }
          grep -qF "HKLM:\SYSTEM\CurrentControlSet\Control\Cryptography\Configuration\Local\SSL\00010002" <<< "$nb" || { echo 'F30: the Schannel Functions key is not addressed' >&2; exit 1; }
          grep -qF "PropertyType MultiString" <<< "$nb" || { echo 'F30: the ordered Functions list is never written back' >&2; exit 1; }
          # --- §1 TLS 1.2 AND 1.3 registry writes (Client + Server) --------------
          grep -qF "foreach (\$proto in @('TLS 1.2', 'TLS 1.3'))" <<< "$nb" || { echo 'F30: TLS 1.2 + 1.3 are not both written' >&2; exit 1; }
          grep -qF "foreach (\$side in @('Client', 'Server'))" <<< "$nb" || { echo 'F30: Client/Server writes are missing' >&2; exit 1; }
          grep -qF "Set-ItemProperty -Path \$p -Name 'Enabled' -Value 1 -Type DWord -ErrorAction Stop" <<< "$nb" || { echo 'F30: Enabled=1 write missing' >&2; exit 1; }
          grep -qF "Set-ItemProperty -Path \$p -Name 'DisabledByDefault' -Value 0 -Type DWord -ErrorAction Stop" <<< "$nb" || { echo 'F30: DisabledByDefault=0 write missing' >&2; exit 1; }
          grep -qF "SecurityLayer' -Value 2 -Type DWord" <<< "$nb" || { echo 'F30: RDP SecurityLayer=2 (TLS only) write missing' >&2; exit 1; }
          grep -qF "MinEncryptionLevel' -Value 3 -Type DWord" <<< "$nb" || { echo 'F30: MinEncryptionLevel=3 write missing' >&2; exit 1; }
          grep -qF "foreach (\$svc in @('TermService', 'WinRM'))" <<< "$nb" || { echo 'F30: TermService/WinRM restart missing' >&2; exit 1; }
          # no weakening anywhere in the normalize block (NLA/CredSSP/cert bypass)
          if grep -nEi 'AuthenticationLevelOverride|AllowEncryptionOracle.{0,10}(1|2)|EnableCredSspSupport.{0,5}0|UserAuthentication.{0,6}0|bypass' <<< "$nb"; then
            echo 'F30: the normalization block weakens NLA/CredSSP/cert validation' >&2; exit 1
          fi
          # --- §2.1 launcher: purge BEFORE write, store API only -----------------
          pb=$(blk "$cs" '// [F30 §2.1 purge-begin]' '// [F30 §2.1 purge-end]')
          test -n "$pb" || { echo 'F30: the launcher purge block is missing' >&2; exit 1; }
          grep -qF 'CredEnumerateW' <<< "$pb" || { echo 'F30: CredEnumerate is not used' >&2; exit 1; }
          grep -qF 'CredDeleteW' <<< "$pb" || { echo 'F30: CredDelete is not used' >&2; exit 1; }
          grep -qF 'CredEnumerate("TERMSRV/*", 0, out count, out array)' <<< "$pb" || { echo 'F30: the TERMSRV filter is missing' >&2; exit 1; }
          grep -qF 'CredDelete(target, c.Type, 0)' <<< "$pb" || { echo 'F30: the purge does not delete the enumerated entry type' >&2; exit 1; }
          grep -qF 'c.Type != 2 && c.Type != 1' <<< "$pb" || { echo 'F30: only Domain+LegacyGeneric shapes may be purged' >&2; exit 1; }
          grep -qF 'OrdinalIgnoreCase' <<< "$pb" || { echo 'F30: the target match must be case-insensitive' >&2; exit 1; }
          wcblk=$(awk '/private static int WriteCredential/{f=1} f{print} /\/\/ Only redemption errors/{exit}' "$cs")
          p_ln=$(grep -n 'PurgeStaleTermsvr(fqdn)' <<< "$wcblk" | head -1 | cut -d: -f1)
          w_ln=$(grep -n 'CredWrite(ref c, 0)' <<< "$wcblk" | head -1 | cut -d: -f1)
          test -n "$p_ln" && test -n "$w_ln" && test "$p_ln" -lt "$w_ln" || { echo 'F30: the purge must run BEFORE the fresh CredWrite' >&2; exit 1; }
          grep -qF 'c.Type = 2; // CRED_TYPE_DOMAIN_PASSWORD' <<< "$wcblk" || { echo 'F30: the fresh entry must be DomainPassword type' >&2; exit 1; }
          grep -qF 'return "purged " + purged + " stale entries, wrote new as Domain"' "$cs" || { echo 'F30: the purge beacon text is missing' >&2; exit 1; }
          if grep -nE 'cmdkey[^\\n]*/delete' "$cs"; then echo 'F30: the launcher must never shell out a cmdkey delete' >&2; exit 1; fi
          grep -qF 'purged [0-9]+ stale entries, wrote new as Domain' "$srv" || { echo 'F30: the server beacon allowlist rejects the purge beacon' >&2; exit 1; }
          grep -qF 'rdp-truncated' "$srv" || { echo 'F30: the server beacon allowlist rejects rdp-truncated' >&2; exit 1; }
          # --- §2.2 server purge endpoint (dash-token gated, one line) -----------
          grep -qF '# [F30 §2.2 purge-cmd-begin]' "$srv" || { echo 'F30: the purge-command block is missing' >&2; exit 1; }
          grep -qF "-eq '/api/purge-stale-creds')" "$srv" || { echo 'F30: the purge endpoint is missing' >&2; exit 1; }
          grep -qF 'DateTime.FromFileTimeUtc(c.LastWritten)' "$srv" || { echo 'F30: the 7-day filter does not use LastWritten' >&2; exit 1; }
          grep -qF 'olderThanDays = 7' "$srv" || { echo 'F30: the 7-day window is not reported' >&2; exit 1; }
          purgeroute=$(grep -A 25 -F "-eq '/api/purge-stale-creds')" "$srv")
          grep -qF 'Test-TicketBearer' <<< "$purgeroute" || { echo 'F30: the purge endpoint is not dash-token gated' >&2; exit 1; }
          grep -qF 'Code 401' <<< "$purgeroute" || { echo 'F30: the purge endpoint has no 401 branch' >&2; exit 1; }
          # --- §2.3 .rdp completeness -------------------------------------------
          grep -qF 'private const int RdpMinBytes = 400;' "$cs" || { echo 'F30: the .rdp byte floor constant is missing' >&2; exit 1; }
          grep -qF 'File.ReadAllText(rdp)' "$cs" || { echo 'F30: the .rdp is never read back' >&2; exit 1; }
          grep -qF 'bytes <= RdpMinBytes' "$cs" || { echo 'F30: the byte floor is never asserted' >&2; exit 1; }
          grep -qF 'rdp-file-truncated' "$cs" || { echo 'F30: a truncated .rdp must be named' >&2; exit 1; }
          for d in 'screen mode id:i:2' 'redirectclipboard:i:1' 'drivestoredirect:s:*' 'audiocapturemode:i:1' 'compression:i:1' 'autoreconnection enabled:i:1'; do
            grep -qF "$d" "$cs" || { echo "F30: the rdp template lost a directive: $d" >&2; exit 1; }
          done
          # --- §3 conn-log collector + row --------------------------------------
          grep -qF '# [F30 §3 connlog-begin]' "$srv" || { echo 'F30: the conn-log collector block is missing' >&2; exit 1; }
          grep -qF '$script:F30ConnLogIntervalSec = 30' "$srv" || { echo 'F30: the collector is not a 30s tick' >&2; exit 1; }
          grep -qF 'Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational' "$srv" || { echo 'F30: RdpCoreTS log not collected' >&2; exit 1; }
          grep -qF 'Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational' "$srv" || { echo 'F30: RemoteConnectionManager log not collected' >&2; exit 1; }
          grep -qF 'Get-WinEvent -FilterHashtable' "$srv" || { echo 'F30: no Get-WinEvent read' >&2; exit 1; }
          for rc in tls-forcibly-closed tls-handshake-failed cert-rejected connection-reset auth-succeeded auth-failed listener-lifecycle session-state; do
            grep -qF "'$rc'" "$srv" || { echo "F30: reason code missing: $rc" >&2; exit 1; }
          done
          grep -qF 'Update-RdpConnLog -StatePath $script:ConnLogStatePath' "$srv" || { echo 'F30: the collector tick is not wired into the server loop' >&2; exit 1; }
          grep -qF 'NotePropertyName connLog -NotePropertyValue $connState.connLog' "$srv" || { echo 'F30: connLog is not served by /api/native-status' >&2; exit 1; }
          grep -qF '# [F30 §3 keepalive-begin]' "$wf" || { echo 'F30: the keep-alive conn-log mirror is missing' >&2; exit 1; }
          grep -qF 'NotePropertyName connLog' "$wf" || { echo 'F30: config.rlpListener.connLog is never written' >&2; exit 1; }
          grep -qF '[F30] SERVER CONN LOG: ' "$wf" || { echo 'F30: the run log never prints the conn-log reason codes' >&2; exit 1; }
          grep -qF 'id="srvConnLogRow"' "$ui" || { echo 'F30: the SERVER CONN LOG row is missing' >&2; exit 1; }
          # --- F11-3 §3 usage loop is a SINGLETON -------------------------------
          # The loop is a DETACHED child: stopping the server orphans it, and two
          # loops interleave their own counters into one state file (observed as
          # the accumulator going BACKWARDS 15 -> 10). Both halves are gated: the
          # loop steps aside when a live owner exists, and a server start reaps
          # any live loop for THIS Root BEFORE launching the fresh one.
          grep -qF '[F11-3 §3 loop-owner]' "$srv" || { echo 'F30: the usage-loop owner guard is missing' >&2; exit 1; }
          grep -qF 'pid = $PID }' "$srv" || { echo 'F30: usage samples carry no owner pid (the guard cannot identify a live owner)' >&2; exit 1; }
          grep -qF '[F11-3 §3 loop-reap]' "$srv" || { echo 'F30: a server start does not reap orphaned usage loops' >&2; exit 1; }
          reap_ln=$(grep -n 'F11-3 §3 loop-reap' "$srv" | head -1 | cut -d: -f1)
          ulp_ln=$(grep -n "'-File',(Join-Path \$Root 'rdp-usage.ps1') -WindowStyle Hidden" "$srv" | head -1 | cut -d: -f1)
          test -n "$reap_ln" && test -n "$ulp_ln" && test "$reap_ln" -lt "$ulp_ln" || { echo 'F30: the reap must run BEFORE the singleton loop is launched' >&2; exit 1; }
          grep -qF '// [F30 §3 connlog-render-begin]' "$ui" || { echo 'F30: the row renderer block is missing' >&2; exit 1; }
          # --- §4 client copy-lines (copy-only; nothing executes) ---------------
          grep -qF 'id="connDiagPurgeAll"' "$ui" || { echo 'F30: the nuclear purge copy-line is missing' >&2; exit 1; }
          grep -qF 'id="connDiagServerPurge"' "$ui" || { echo 'F30: the server purge copy-line slot is missing' >&2; exit 1; }
          grep -qF 'id="connDiagCiphers"' "$ui" || { echo 'F30: the cipher copy-line is missing' >&2; exit 1; }
          grep -qF 'id="connDiagTls13"' "$ui" || { echo 'F30: the TLS1.3 copy-line is missing' >&2; exit 1; }
          grep -qF 'id="connDiagTshark"' "$ui" || { echo 'F30: the capture copy-line is missing' >&2; exit 1; }
          grep -qF 'cmdkey "/delete:$t"' "$ui" || { echo 'F30: the purge copy-line does not delete the parsed target' >&2; exit 1; }
          grep -qF "cmdkey /list | Select-String TERMSRV" "$ui" || { echo 'F30: the purge copy-line parses target= (a : split deletes the label)' >&2; exit 1; }
          grep -qF "loadServerPurgeCmd" "$ui" || { echo 'F30: the server purge command is never fetched' >&2; exit 1; }
          if grep -nE 'purge-stale-creds[^ ]*[?]key=' "$ui"; then echo 'F30: the dash token must never ride the purge URL' >&2; exit 1; fi
          # the F30 matrix must be part of the Node run (it EXECUTES the row).
          test -f tests/f30-tls-cipher.test.js || { echo 'F30: the node matrix is missing' >&2; exit 1; }
          node --test tests/f30-tls-cipher.test.js
          echo 'F30 gates PASS'
      # [F31c] TOKEN-AWARE PUSH + SELF-REPORTING DIAGNOSTIC MATRIX. The static
      # half pins the fail-loud step, the 5 card checks and the copy-only
      # checklist; tests/f31c-live-dispatch.test.js EXECUTES the shipped card.
      # Prior F27/F28/F30/F31 locks are untouched (no cred-UI automation, no
      # creds in URLs/logs, no NLA weakening, no token bypass).
      - name: F31c token diagnostic + live dispatch gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          srv=payloads/ghrdp-server.ps1
          diag_line=$(grep -n 'name: GitHub Token Diagnostic' "$wf" | head -1 | cut -d: -f1)
          checkout_line=$(grep -n 'name: Checkout repo (payloads)' "$wf" | head -1 | cut -d: -f1)
          # [F59 §2] the Tailscale MSI download moved into the parallel pre-warm step
          ts_line=$(grep -n 'name: F59 parallel pre-warm' "$wf" | head -1 | cut -d: -f1)
          test -n "$diag_line" && test -n "$checkout_line" && test -n "$ts_line" || { echo 'F31c: token diagnostic step missing' >&2; exit 1; }
          test "$diag_line" -lt "$checkout_line" || { echo 'F31c: token diagnostic must be the first step, before checkout' >&2; exit 1; }
          test "$checkout_line" -lt "$ts_line" || { echo 'F31c: token diagnostic drifted below Tailscale setup' >&2; exit 1; }
          blk=$(awk '/# \[F31c §1 token-diag-begin\]/{f=1} f{print} /# \[F31c §1 token-diag-end\]/{exit}' "$wf")
          test -n "$blk" || { echo 'F31c: the extractable token-diagnostic block is missing' >&2; exit 1; }
          grep -qF 'Testing git push access...' <<< "$blk" || { echo 'F31c: diagnostic does not announce the push probe' >&2; exit 1; }
          # Concatenate so this file does not contain a contiguous Actions expression
          # (Actions would expand it before bash runs, and the grep would miss).
          needle='git push --dry-run origin $'"{{ github.ref }}"
          grep -qF "$needle" <<< "$blk" || { echo 'F31c: dry-run push of github.ref is missing' >&2; exit 1; }
          grep -qF '::error::git push failed' <<< "$blk" || { echo 'F31c: fail-loud error annotation missing' >&2; exit 1; }
          grep -qF 'Arena Settings -> GitHub Integration -> Reconnect' <<< "$blk" || { echo 'F31c: Arena reconnect fix missing' >&2; exit 1; }
          grep -qF 'Windows Credential Manager -> git:github.com -> Remove' <<< "$blk" || { echo 'F31c: Credential Manager fix missing' >&2; exit 1; }
          grep -qF 'exit 1' <<< "$blk" || { echo 'F31c: token diagnostic does not exit 1 (token bypass)' >&2; exit 1; }
          grep -qF 'git push access confirmed' <<< "$blk" || { echo 'F31c: success confirmation missing' >&2; exit 1; }
          if grep -nE 'Write-Host[^$]*\$env:GITHUB_TOKEN|echo \$env:GITHUB_TOKEN' "$wf"; then
            echo 'F31c: the workflow prints GITHUB_TOKEN' >&2; exit 1
          fi
          # --- LIVE DISPATCH STATUS: all 5 checks, exact fixes -----------------
          grep -qF 'id="liveDispatchRow"' "$ui" || { echo 'F31c: LIVE DISPATCH STATUS card missing' >&2; exit 1; }
          grep -qF 'LIVE DISPATCH STATUS' "$ui" || { echo 'F31c: card title missing' >&2; exit 1; }
          grep -qF 'function liveDispatchStatus(s, nowMs)' "$ui" || { echo 'F31c: the decision function is missing' >&2; exit 1; }
          for name in 'Runner reachable' 'F31 bound' '36870 absent' 'Credential stored' 'Logon success'; do
            grep -qF "$name" "$ui" || { echo "F31c: card check missing: $name" >&2; exit 1; }
          done
          grep -qF 'F31 not bound => re-dispatch main.yml' "$ui" || { echo 'F31c: F31 fix hint missing' >&2; exit 1; }
          grep -qF '36870 present => key ACL dump needed => copy-line to session' "$ui" || { echo 'F31c: 36870 fix hint missing' >&2; exit 1; }
          grep -qF 'listenerHandshakeOk' "$ui" || { echo 'F31c: card does not read listenerHandshakeOk' >&2; exit 1; }
          grep -qF 'launcher.beacons' "$srv" || { echo 'F31c: server does not serve launcher.beacons' >&2; exit 1; }
          grep -qF 'setInterval(function(){ try{ nativeStatus(); }catch(_){} }, 10000);' "$ui" || { echo 'F31c: card does not poll /api/native-status every 10s' >&2; exit 1; }
          # --- MANUAL VERIFY STEPS ---------------------------------------------
          grep -qF 'id="manualVerifySteps"' "$ui" || { echo 'F31c: MANUAL VERIFY STEPS missing' >&2; exit 1; }
          grep -qF 'MANUAL VERIFY STEPS' "$ui" || { echo 'F31c: verify checklist title missing' >&2; exit 1; }
          grep -qF 'If WINDOWS AUTO-LOGIN opens a browser prompt, click OPEN and tick always-allow' "$ui" || { echo 'F31c: browser-prompt verify line missing' >&2; exit 1; }
          grep -qF 'If RDP window appears but shows 0x904/0x7, run this in PowerShell on your PC:' "$ui" || { echo 'F31c: 0x904 verify line missing' >&2; exit 1; }
          grep -qF 'cmdkey /delete:TERMSRV/' "$ui" || { echo 'F31c: cmdkey verify copy-line missing' >&2; exit 1; }
          grep -qF 'Then click WINDOWS AUTO-LOGIN again' "$ui" || { echo 'F31c: retry instruction missing' >&2; exit 1; }
          grep -qF 'If still failing, copy this and paste to the session:' "$ui" || { echo 'F31c: schannel paste instruction missing' >&2; exit 1; }
          grep -qF 'wevtutil qe System /q:"*[System[Provider[@Name='"'"'Schannel'"'"']]]" /c:10 /f:text | findstr "36870 36871"' "$ui" || { echo 'F31c: schannel copy-line missing' >&2; exit 1; }
          vblock=$(awk '/<!-- \[F31c §3 manual-verify-begin\]/{f=1} f{print} /<!-- \[F31c §3 manual-verify-end\]/{exit}' "$ui")
          test -n "$vblock" || { echo 'F31c: verify checklist markers missing' >&2; exit 1; }
          if grep -nE 'powershell\.exe|-ExecutionPolicy|Invoke-Expression|-EncodedCommand|mshta|wscript|cscript' <<< "$vblock"; then
            echo 'F31c: verify checklist executes a script host' >&2; exit 1
          fi
          if grep -oE 'onclick="[^"]*"' <<< "$vblock" | grep -v 'onclick="copyById'; then
            echo 'F31c: verify checklist has a non-copy control' >&2; exit 1
          fi
          # server merge so a live 36870 cannot hide outside connLog
          grep -qF 'Get-F31cSchannelWindow' "$srv" || { echo 'F31c: Schannel 36870 window is not read' >&2; exit 1; }
          grep -qF 'Merge-F31cConnLog' "$srv" || { echo 'F31c: 36870 events are not merged into connLog' >&2; exit 1; }
          # the matrix is executed, not merely grepped
          test -f tests/f31c-live-dispatch.test.js || { echo 'F31c: the node matrix is missing' >&2; exit 1; }
          node --test tests/f31c-live-dispatch.test.js
          echo 'F31c gates PASS'
      - name: F34 up-step IP poll + class links + IP-first stage + keep-alive skip gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          up=$(awk '/^      - name: Tailscale up \(TS_AUTHKEY fail-closed/{f=1;next} /^      - name: Wait for Tailscale connected/{f=0} f' "$wf")
          stage=$(awk '/^      - name: Wait for Tailscale connected/{f=1;next} /^      - name: Runner FQDN self-test/{f=0} f' "$wf")
          ka=$(awk '/^      - name: Keep-alive 5h30/{f=1} /^      - name: Cleanup /{f=0} f' "$wf")
          test -n "$up" && test -n "$stage" && test -n "$ka" || { echo 'F34: a step region is missing (gate would be vacuous)' >&2; exit 1; }
          # (1) up-step: the 90s window must gate on BackendState AND a CGNAT address.
          grep -qF "\$i -lt 45" <<< "$up" || { echo 'F34: up-step no longer polls 45 x 2s (90s)' >&2; exit 1; }
          grep -qF "\$j.BackendState -eq 'Running'" <<< "$up" || { echo 'F34: up-step does not read BackendState' >&2; exit 1; }
          grep -qF 'Self.TailscaleIPs' <<< "$up" || { echo 'F34: up-step does not require a tailnet IP' >&2; exit 1; }
          grep -qF 'TS_TAILNET_IP=' <<< "$up" || { echo 'F34: up-step does not publish the proven IP' >&2; exit 1; }
          # Only a CALL counts: the F34 comment explains why the CLI is avoided.
          if grep -qE '& \$ts ip -4' <<< "$up"; then echo 'F34: up-step calls `tailscale ip -4` (proved 401-prone)' >&2; exit 1; fi
          # (2) class links: table with the three classes + the two distinct links.
          for r in ts-authkey-invalid ts-authkey-ratelimited ts-control-plane; do
            grep -qF "$r" <<< "$up" || { echo "F34: classifier class missing: $r" >&2; exit 1; }
          done
          grep -qF "https://status.tailscale.com" <<< "$up" || { echo 'F34: control-plane class has no status link' >&2; exit 1; }
          grep -qF 'Emit-SecretHalt' <<< "$up" && grep -qE "Emit-SecretHalt .*\\\$haltUrl" <<< "$up" || { echo 'F34: halt does not carry the class-specific link' >&2; exit 1; }
          # (3) stage: empty IP must halt BEFORE any MagicDNS branch (line ordering).
          ipLine=$(grep -nF 'tailnet IP unavailable after sign-in' <<< "$stage" | head -1 | cut -d: -f1 || true)
          dnsLine=$(grep -nF 'enable MagicDNS in tailnet DNS settings' <<< "$stage" | head -1 | cut -d: -f1 || true)
          test -n "$ipLine" || { echo 'F34: stage step has no empty-IP halt' >&2; exit 1; }
          test -n "$dnsLine" || { echo 'F34: stage step lost its MagicDNS halt' >&2; exit 1; }
          test "$ipLine" -lt "$dnsLine" || { echo 'F34: the empty-IP halt sits AFTER the MagicDNS branch' >&2; exit 1; }
          haltBlk=$(awk -v s="$ipLine" 'NR>=s-20 && NR<=s' <<< "$stage")
          if grep -qF 'MagicDNS is OFF' <<< "$haltBlk"; then echo 'F34: the empty-IP halt emits the MagicDNS sentence' >&2; exit 1; fi
          grep -qF 'login.tailscale.com/admin/settings/keys' <<< "$haltBlk" || { echo 'F34: empty-IP halt lacks a clickable link' >&2; exit 1; }
          # (4) keep-alive: absent ghrdp-server.ps1 => quiet skip, no restart attempt.
          grep -qF "Test-Path -LiteralPath 'C:" <<< "$ka" || { echo 'F34: keep-alive does not probe for ghrdp-server.ps1' >&2; exit 1; }
          grep -qF "ghrdp-server.ps1'" <<< "$ka" || { echo 'F34: the keep-alive probe is not for ghrdp-server.ps1' >&2; exit 1; }
          grep -qF 'dashboard restart skipped (nothing to heal yet)' <<< "$ka" || { echo 'F34: keep-alive quiet-skip line missing' >&2; exit 1; }
          grep -qF 'if (-not $psOk -and -not $psSkipped) {' <<< "$ka" || { echo 'F34: the restart block is not gated on $psSkipped' >&2; exit 1; }
          # (5) the classifier/branching matrices are executed, not merely grepped.
          test -f tests/f34-up-diagnosis.test.js || { echo 'F34: the node matrix is missing' >&2; exit 1; }
          node --test tests/f34-up-diagnosis.test.js
          echo 'F34 gates PASS'
      # [F37] TELESCOPE GATES. The format has ONE implementation
      # (payloads/rdp-telescope.ps1); the client (launcher .cs), the runner
      # (ghrdp-server.ps1) and the lab (autologin-lab.yml) must all speak ITS
      # vocabulary, the lab must PRINT the telescope on every cert cell, and the
      # whole surface must stay secret-free (no password bytes, no cred UI, no
      # trust installs, no NLA weakening). tests/f37-telescope.test.js EXECUTES
      # the shipped timeline renderer and cross-checks the tokens.
      - name: F37 telescope single-source + self-explaining lab gates
        shell: bash
        run: |
          set -euo pipefail
          mod=payloads/rdp-telescope.ps1
          srv=payloads/ghrdp-server.ps1
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          lab=.github/workflows/autologin-lab.yml
          wf=.github/workflows/main.yml
          # (1) the module exists and declares its format + vocabulary
          test -f "$mod" || { echo 'F37: the telescope module (single source of truth) is missing' >&2; exit 1; }
          grep -qF '# [F37 §1 telescope-format]' "$mod" || { echo 'F37: the format header marker is missing' >&2; exit 1; }
          for t in dns tcp tls cred logon schannel listener rst-before-cert name-mismatch eku; do
            grep -qF "'$t'" "$mod" || { echo "F37: the module does not declare the token $t" >&2; exit 1; }
          done
          grep -qF 'function Select-RdpTelescopeLine' "$mod" || { echo 'F37: the field allowlist filter is missing' >&2; exit 1; }
          # (2) ALL FOUR SURFACES share the ONE parser/format
          grep -qF 'payloads/rdp-telescope.ps1' "$lab" || { echo 'F37: the lab does not load the single-source module' >&2; exit 1; }
          grep -qF 'rdp-telescope.ps1' "$srv" || { echo 'F37: the server does not load the single-source module' >&2; exit 1; }
          grep -qF '. $f37cand' "$srv" || { echo 'F37: the server must DOT-SOURCE the module, never re-implement the format' >&2; exit 1; }
          grep -qF 'payloads/rdp-telescope.ps1' "$wf" || { echo 'F37: the live probe does not load the module' >&2; exit 1; }
          grep -qF '[F37 §1 telescope-format: shared with payloads/rdp-telescope.ps1]' "$cs" || { echo 'F37: the launcher does not point at the single source of truth' >&2; exit 1; }
          for slug in telescope-dns-ok telescope-tcp-fail telescope-tls-ok telescope-rst-before-cert telescope-chain telescope-name-mismatch telescope-eku telescope-cred-missing; do
            grep -qF "\"$slug\"" "$cs" || { echo "F37: the launcher cannot emit the shared slug $slug" >&2; exit 1; }
          done
          # the runner-side slug allowlist must accept exactly those slugs
          for slug in telescope-dns-ok telescope-tcp-ok telescope-tls-ok telescope-cred-missing; do
            grep -qE "telescope-(dns|tcp|tls|cred)|\\(rst-before-cert" <<< "$(grep -F 'F37TelSlugRe' "$srv")" || { echo 'F37: the server slug allowlist drifted' >&2; exit 1; }
          done
          # [F37] the beacon STAGE is DERIVED from the shared slug: ONE table in
          # the module, the client only DECLARES it, and the server neutralizes any
          # disagreement - a mislabeled beacon can never become a timeline verdict
          # (the class that made a live diag beacon render as stage 'other').
          grep -qF '$slugStage = [ordered]@{' "$mod" || { echo 'F37: the module does not declare the slug -> stage table' >&2; exit 1; }
          grep -qF 'function Get-RdpTelescopeBeaconStage' "$mod" || { echo 'F37: the module owns no slug -> stage accessor' >&2; exit 1; }
          grep -qF 'Get-F37BeaconStageForSlug' "$srv" || { echo 'F37: the server does not derive the beacon stage' >&2; exit 1; }
          grep -qF 'Get-RdpTelescopeBeaconStage -Slug $Slug' "$srv" || { echo 'F37: the server keeps a second slug -> stage mapping' >&2; exit 1; }
          grep -qF 'if (-not $derivedT -or ($stT -and $stT -ne $derivedT))' "$srv" || { echo 'F37: a declared/derived stage mismatch is not neutralized' >&2; exit 1; }
          grep -qF 'HelloBounded(host, port, "diag", ok, slug, trace, stage)' "$cs" || { echo 'F37: the diag beacon does not declare its stage' >&2; exit 1; }
          grep -qF 'IsTelClientStage(stage)' "$cs" || { echo 'F37: the declared stage is not gated on the client token set' >&2; exit 1; }
          # (3) the failure point is NAMED on every surface
          for f in rst-before-cert name-mismatch eku; do
            grep -qF "$f" "$cs" || { echo "F37: the launcher cannot name the failure point $f" >&2; exit 1; }
          done
          grep -qF 'permissive' "$mod" || { echo 'F37: the TLS probe no longer documents its read-only permissive callback' >&2; exit 1; }
          # (4) RUNNER: 60s tick, startup scan, row fields, live preference
          grep -qF '$script:F37TelIntervalSec = 60' "$srv" || { echo 'F37: the runner telescope tick is not 60s' >&2; exit 1; }
          grep -qF 'STARTUP SCAN: the telescope stamps BEFORE the first client can poll' "$srv" || { echo 'F37: the telescope startup scan is missing' >&2; exit 1; }
          grep -qF 'telescope = $f37State.telescope' "$srv" || { echo 'F37: native-status does not serve the runner telescope' >&2; exit 1; }
          grep -qF 'telescopeClient = $f37Client' "$srv" || { echo 'F37: native-status does not serve the client beacons' >&2; exit 1; }
          grep -qF 'telescopeLive' "$srv" || { echo 'F37: bind drift cannot be rendered live' >&2; exit 1; }
          grep -qF 'boundThumb' "$ui" && grep -qF 'servedThumb' "$ui" && grep -qF 'aclSids' "$ui" && grep -qF 'schannelTail' "$ui" || { echo 'F37: the SERVER CONN LOG row lacks the bind-drift fields' >&2; exit 1; }
          # (5) CLIENT: diag verb + trace id + preflight that never breaks the
          # pinned fail-visible beacon chain
          grep -qF 'if (verb == "diag") { return DiagStep(uri, host, port); }' "$cs" || { echo 'F37: the diag verb is missing' >&2; exit 1; }
          grep -qF 'if (TraceParam(uri).Length > 0) { TelPreflight(uri, server, host, port); }' "$cs" || { echo 'F37: the preflight is not gated on the click trace' >&2; exit 1; }
          grep -qF 'endpoint = (verb == "diag") ? "/api/rdp-telescope" : "/api/handler-hello"' "$cs" || { echo 'F37: diag beacons must not enter the handler-hello chain' >&2; exit 1; }
          grep -qF "if (\$path -eq '/api/rdp-telescope' -and \$parts.method -eq 'POST')" "$srv" || { echo 'F37: the client beacon endpoint is missing' >&2; exit 1; }
          grep -qF 'telescope-unparsed' "$srv" || { echo 'F37: an unknown beacon slug must be neutralized' >&2; exit 1; }
          grep -qF 'function telescopeTimeline(s, nowMs)' "$ui" || { echo 'F37: the ONE timeline function is missing' >&2; exit 1; }
          grep -qF 'id="btnRunDiag"' "$ui" || { echo 'F37: [RUN DIAG] is missing' >&2; exit 1; }
          grep -qF 'function mintTraceId(src)' "$ui" || { echo 'F37: the client trace minter is missing' >&2; exit 1; }
          # (6) LAB: the cert is Schannel-acceptable and every cert cell PRINTS
          # the telescope - a red cert cell must never be red-without-why.
          grep -qF '2.5.29.37={text}1.3.6.1.5.5.7.3.1' "$lab" || { echo 'F37: the lab cert carries no ServerAuth EKU (the rst-before-cert class)' >&2; exit 1; }
          grep -qF '2.5.29.17={text}DNS=' "$lab" || { echo 'F37: the lab cert carries no SAN' >&2; exit 1; }
          grep -qF 'F37 lab telescope BEFORE bind' "$lab" || { echo 'F37: the lab does not telescope BEFORE the bind' >&2; exit 1; }
          grep -qF 'F37 lab telescope AFTER bind+restart' "$lab" || { echo 'F37: the lab does not telescope AFTER the bind' >&2; exit 1; }
          bindLine=$(grep -nF "New-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name 'SSLCertificateSHA1Hash'" "$lab" | head -1 | cut -d: -f1)
          beforeLine=$(grep -nF 'F37 lab telescope BEFORE bind' "$lab" | head -1 | cut -d: -f1)
          afterLine=$(grep -nF 'F37 lab telescope AFTER bind+restart' "$lab" | head -1 | cut -d: -f1)
          test -n "$bindLine" && test -n "$beforeLine" && test -n "$afterLine" || { echo 'F37: a lab anchor is missing (vacuous gate)' >&2; exit 1; }
          test "$beforeLine" -lt "$bindLine" || { echo 'F37: the BEFORE telescope runs after the bind' >&2; exit 1; }
          test "$bindLine" -lt "$afterLine" || { echo 'F37: the AFTER telescope runs before the bind' >&2; exit 1; }
          cell=$(awk -v s="$bindLine" -v e="$afterLine" 'NR>s && NR<e+60' "$lab")
          for line in $(grep -nF "R-Fail 'bind-effectiveness'" "$lab" | cut -d: -f1); do
            body=$(sed -n "${line}p" "$lab")
            grep -qF '$dump' <<< "$body" || { echo "F37: line $line can exit red without the telescope fields" >&2; exit 1; }
          done
          grep -qF 'if ($servedR -ne $boundR)' "$lab" || { echo 'F37: the lab does not gate servedThumb == boundThumb' >&2; exit 1; }
          # [F37] the CERTIFICATE's own acceptance is named, not inferred: the
          # module reads the ServerAuth EKU + SAN off the bound cert, the death
          # point prefers tls-eku over the RST symptom, and the live row says it.
          grep -qF 'hasServerAuth' "$mod" && grep -qF 'hasServerAuth' "$ui" || { echo 'F37: the ServerAuth EKU is not classified on the runner + row' >&2; exit 1; }
          grep -qF "return 'tls-eku'" "$mod" || { echo 'F37: a missing EKU cannot name the tls-eku death point' >&2; exit 1; }
          grep -qF '$fields.hasServerAuth' "$mod" || { echo 'F37: the listener verdict ignores the cert EKU' >&2; exit 1; }
          # [F37] a red cell must never be red-without-a-readable-annotation:
          # both F37 cells trap unhandled exceptions, the fail helpers collapse
          # their detail onto one line, and a forensics step re-emits the
          # telescope + the classification files whenever a cell failed.
          test "$(grep -c 'stage=unhandled' "$lab")" -ge 2 || { echo 'F37: the F37 lab cells do not trap unhandled errors' >&2; exit 1; }
          grep -qF '$f37one = ($Detail -replace' "$lab" || { echo 'F37: a lab fail helper can still emit a multi-line (dropped) annotation' >&2; exit 1; }
          grep -qF 'Q: failure forensics' "$lab" || { echo 'F37: the failure-forensics step is missing' >&2; exit 1; }
          # [F37] the persisted KEY FILE is resolved, never assumed: one resolver
          # in the module, shared by the listener and the F31 ACL helper, with
          # store candidates + hits in every failure message.
          acl=payloads/Grant-RdpKeyAccess.ps1
          grep -qF 'function Resolve-RdpTelescopeKeyFile' "$mod" || { echo 'F37: the module does not own the key-file resolver' >&2; exit 1; }
          grep -qF 'Resolve-RdpTelescopeKeyFile' "$acl" || { echo 'F37: the ACL helper assumes a key path instead of resolving it' >&2; exit 1; }
          grep -qF 'persisted key file NOT FOUND' "$mod" || { echo 'F37: a missing key file is not named with its evidence' >&2; exit 1; }
          grep -qF "\$out.pathSource = 'stem-hit'" "$mod" || { echo 'F37: a unique provider naming variant is not accepted' >&2; exit 1; }
          grep -qF "ambiguous-stem-hit" "$mod" || { echo 'F37: an ambiguous key-file match is not flagged' >&2; exit 1; }
          grep -qF "'keyFilePathSource'" "$mod" || { echo 'F37: the chosen key-file path source is not part of the format' >&2; exit 1; }
          for f in keyFileFound keyDirHits keyDirSample containerKind keyFilePathSource; do
            grep -qF "$f" "$mod" && grep -qF "$f" "$ui" || { echo "F37: $f never reaches the row" >&2; exit 1; }
          done
          # [F37] the certificate callback must be COMPILED: a PowerShell
          # scriptblock cannot run on the threadpool thread that completes the
          # handshake, and both probes then reported a false rst-before-cert.
          probe=payloads/Test-RdpListenerHandshake.ps1
          grep -qF 'public static class GhrdpTelTls' "$mod" || { echo 'F37: the compiled TLS callback shim is missing' >&2; exit 1; }
          grep -qF 'Add-RdpTelescopeTlsShim' "$probe" || { echo 'F37: the F31 probe does not share the compiled callback' >&2; exit 1; }
          if grep -nE 'RemoteCertificateValidationCallback\]\s*\{' "$mod" "$probe"; then echo 'F37: a scriptblock is still used as the TLS callback' >&2; exit 1; fi
          # [F37] the X.224 confirm / RDP_NEG_RSP layout is single-sourced and
          # the off-by-one that made a HEALTHY listener read as "did not select
          # TLS" may not come back on any surface.
          grep -qF 'function Test-RdpTelescopeX224Confirm' "$mod" || { echo 'F37: the shared X.224 validator is missing' >&2; exit 1; }
          grep -qF 'Test-RdpTelescopeX224Confirm -Response $response' "$probe" || { echo 'F37: the F31 probe hand-rolls the X.224 offsets' >&2; exit 1; }
          if grep -nE '\[6\] -ne 2|\[8\] -ne 8|\[9\] -ne 0|ToUInt32\(\$(response|Response), 10\)' "$mod" "$probe"; then
            echo 'F37: an off-by-one X.224 byte offset is back' >&2; exit 1
          fi
          # [F37] the live runner is WINDOWS POWERSHELL 5.1 (.NET Framework): a
          # .NET Core-only API degraded the whole runner telescope on the first
          # live run. No surface the server loads may use one.
          for f in "$mod" "$srv" payloads/ghrdp-lib.ps1 payloads/Grant-RdpKeyAccess.ps1 "$probe"; do
            if grep -nE 'RandomNumberGenerator\]::(GetBytes|Fill)\(|\[Convert\]::ToHexString\(|SHA(256|384|512)\]::HashData\(|\[System\.IO\.Path\]::Join\(' "$f"; then
              echo "F37: $f uses a .NET Core-only API that Windows PowerShell 5.1 does not have" >&2; exit 1
            fi
          done
          grep -qF 'RandomNumberGenerator]::Create()' "$mod" || { echo 'F37: the trace id does not use the 5.1-safe instance RNG' >&2; exit 1; }
          grep -qF 'certutil.exe -repairstore My' "$lab" || { echo 'F37: the lab never forces key persistence' >&2; exit 1; }
          grep -qF "R-Fail 'key-acl-grant'" "$lab" || { echo 'F37: the ACL grant can still die as an unhandled exit' >&2; exit 1; }
          grep -qF '::error::[forensics]' "$lab" || { echo 'F37: the forensics step emits no annotation' >&2; exit 1; }
          grep -qF 'Format-RdpTelescopeDump' "$lab" || { echo 'F37: the forensics step does not re-print the telescope' >&2; exit 1; }
          grep -qF 'Test-RdpListenerHandshake.ps1' "$lab" || { echo 'F37: the lab lost the strict F31 handshake gate' >&2; exit 1; }
          grep -qF 'node --test tests/f37-telescope.test.js' "$lab" || { echo 'F37: the lab does not run the F37 matrix over its own sample' >&2; exit 1; }
          # (7) SECRET-FREE / NO WEAKENING on every F37 surface
          if grep -nE 'Read-Host|AsPlainText|ConvertTo-SecureString|/pass:|Invoke-Expression' "$mod" "$cs"; then
            echo 'F37: a telescope surface handles a credential blob' >&2; exit 1
          fi
          if grep -nF "X509Store('Root'" "$mod" "$cs"; then echo 'F37: the telescope installs trust' >&2; exit 1; fi
          if grep -nE 'UserAuthentication.*(Set-ItemProperty|= 0)' "$mod" "$cs"; then echo 'F37: the telescope touches NLA' >&2; exit 1; fi
          if grep -nE 'password=|passwd=|pwd=' "$ui" "$cs"; then echo 'F37: a password-shaped parameter exists in a launch URL' >&2; exit 1; fi
          if grep -nF 'GHRDP_LAB_TEL_INTERVAL_SEC' "$wf"; then echo 'F37: a lab-only switch reached production main.yml' >&2; exit 1; fi
          # [F37 §4] SCOPE: the runner face (server tick + live probe) never
          # evaluates the CLIENT-owned cred stage, and says why it carries none.
          # A healthy host that reads as deathPoint=credssp is a false verdict.
          grep -qF -e "-Ip '127.0.0.1' -SkipCred" "$srv" || { echo 'F37: the live runner evaluates the client-owned cred stage' >&2; exit 1; }
          grep -qF "credScope   = 'client-only'" "$srv" || { echo 'F37: the runner sample does not name its own scope' >&2; exit 1; }
          grep -qF -e '-ExpectedThumb $certThumb -SkipLogon -SkipCred' "$wf" || { echo 'F37: the live F17 probe is not runner-scoped' >&2; exit 1; }
          grep -qF 'runner face: no stored TERMSRV target' "$mod" || { echo 'F37: an absent client credential on the runner is not a named scope fact' >&2; exit 1; }
          grep -qF -e '-Informational:$Local' "$mod" || { echo 'F37: the runner face is not informational for client-owned stages' >&2; exit 1; }
          # an absent logon window is INFORMATIONAL; only a rejection is a fault
          grep -qF 'informational: nobody has logged on yet' "$mod" || { echo 'F37: an empty logon window still reads as a red path' >&2; exit 1; }
          grep -qF 'RDP logon rejected: newest event is a 4625' "$mod" || { echo 'F37: a logon rejection is not named' >&2; exit 1; }
          if grep -qF -e "-Ok ([bool](\$id -eq '4624'))" "$mod"; then echo 'F37: the logon stage paints an empty window red again' >&2; exit 1; fi
          # probeError is the LISTENER FACE; evidence (schannel/logon) is probeWarn
          grep -qF "'telescope evidence: '" "$srv" || { echo 'F37: the runner cannot separate a fatal stage from evidence' >&2; exit 1; }
          grep -qF 'probeWarn' "$srv" && grep -qF 'probeWarn' "$ui" || { echo 'F37: the runner evidence line never reaches the row' >&2; exit 1; }
          if grep -qF '"ok":false' "$srv"; then echo 'F37: the server hand-matches the wire format instead of reading it' >&2; exit 1; fi
          # a derivation fault and the key-resolver cause are NAMED, end to end
          for f in deriveError redStages fatalStages keyTypedError typesLoader; do
            grep -qF "$f" "$mod" && grep -qF "$f" "$srv" && grep -qF "$f" "$wf" && grep -qF "$f" "$ui" || { echo "F37: $f does not travel module -> runner -> stamp -> row" >&2; exit 1; }
          done
          # [F37 §1] the key ACL is read by a LADDER, never by one cmdlet: the
          # live runner (Windows PowerShell 5.1 started by a pwsh step) could not
          # load Microsoft.PowerShell.Security, Get-Acl failed there, and the row
          # reported deathPoint=acl on a key whose NETWORK SERVICE ACE was
          # present. No host may lose that evidence to a module-load fault again.
          grep -qF 'function Get-RdpTelescopeKeyAcl' "$mod" || { echo 'F37: the module has no independent key-ACL reader' >&2; exit 1; }
          grep -qF 'function Initialize-RdpTelescopeModulePath' "$mod" || { echo 'F37: nothing repairs a host that cannot load its own modules' >&2; exit 1; }
          # $PSHOME is a read-only automatic variable and PowerShell variable
          # names are case-insensitive, so a local named $psHome assigns straight
          # into it and throws - the repair then reports 'repair-threw' on every
          # live sample and the module path is never restored.
          if grep -nE '^[[:space:]]*\$psHome[[:space:]]*=' "$mod"; then
            echo 'F37: a local named $psHome collides with the read-only automatic $PSHOME (read it with Get-Variable)' >&2; exit 1
          fi
          grep -qF "Get-Variable -Name 'PSHOME' -ValueOnly" "$mod" || { echo 'F37: the module path repair does not read $PSHOME safely' >&2; exit 1; }
          for m in "'get-acl'" "'dotnet-fileinfo'" "'acl-extensions'" "'icacls'"; do
            grep -qF "$m" "$mod" || { echo "F37: the ACL ladder lost the reader $m" >&2; exit 1; }
          done
          grep -qF '.GetAccessControl()' "$mod" || { echo 'F37: no managed ACL API is reachable without a cmdlet' >&2; exit 1; }
          if grep -nE '^[[:space:]]*\$acl = Get-Acl -LiteralPath' "$mod"; then echo 'F37: the listener stage calls Get-Acl directly again (one method, no ladder)' >&2; exit 1; fi
          for f in aclReadMethod aclModule; do
            grep -qF "$f" "$mod" && grep -qF "$f" "$srv" && grep -qF "$f" "$lab" || { echo "F37: $f does not travel module -> runner -> lab verdict" >&2; exit 1; }
          done
          grep -qF "'runner-acl-method'" "$lab" || { echo 'F37: a runner whose ACL reader failed can still pass the cell' >&2; exit 1; }
          # the resolver must work on the runtime the SERVER actually uses (5.1)
          grep -qF 'function Initialize-RdpTelescopeCryptoTypes' "$mod" || { echo 'F37: the 5.1 crypto-type loader is missing (the runner telescope degrades silently)' >&2; exit 1; }
          grep -qF 'certutil.exe -store -v My $Certificate.Thumbprint' "$mod" || { echo 'F37: the key resolver has no provider-independent fallback' >&2; exit 1; }
          grep -qF "'certutil-candidate'" "$mod" || { echo 'F37: a certutil-resolved key path is not reported as such' >&2; exit 1; }
          # the death point cannot blame the EKU when NOTHING is bound
          grep -qF "[bool]\$listenerObj.inStore -and \$listenerObj.PSObject.Properties['hasServerAuth']" "$mod" || { echo 'F37: an unbound listener still resolves tls-eku' >&2; exit 1; }
          grep -qF "return 'tls-cert' }" "$mod" || { echo 'F37: an unbound listener has no death point' >&2; exit 1; }
          # a beacon the allowlist neutralized is NOT a stage verdict
          grep -qF 'telescope-unparsed' "$ui" || { echo 'F37: the timeline treats a neutralized beacon as a verdict' >&2; exit 1; }
          # the lab proves the scope split, feeds the client diag, and spends its
          # 10-annotation forensics budget on the decisive evidence first
          grep -qF "'module-scope'" "$lab" || { echo 'F37: the lab never proves the runner/client cred scope split' >&2; exit 1; }
          grep -qF 'cmdkey.exe /generic:TERMSRV/$fqdn /user:labuser /pass:LABDUMMY-win-9876' "$lab" || { echo 'F37: the client diag has no stored target (a healthy path would read credssp)' >&2; exit 1; }
          grep -qF 'telescope-cred-ok' "$lab" || { echo 'F37: the lab does not require the client cred stage to be green' >&2; exit 1; }
          grep -qF 'Flush 9' "$lab" || { echo 'F37: the forensics step can lose its decisive annotation to the cap' >&2; exit 1; }
          grep -qF 'CLASSIFICATION:' "$lab" && grep -qF 'RUNNER-SUMMARY:' "$lab" || { echo 'F37: the forensics step does not lead with the cell verdict + runner state' >&2; exit 1; }
          # (8) the matrix is EXECUTED (the timeline runs the shipped renderer)
          test -f tests/f37-telescope.test.js || { echo 'F37: the node matrix is missing' >&2; exit 1; }
          node --test tests/f37-telescope.test.js
          # (9) STRUCTURAL AUDIT: this lane has no PowerShell interpreter, so the
          # edited .ps1 surfaces and every workflow PowerShell block are
          # tokenized and checked for brace/here-string balance and a dangling
          # catch - the failure class that otherwise costs a whole lab run.
          test -f tests/ps-balance-audit.py || { echo 'F37: the PowerShell structural audit is missing' >&2; exit 1; }
          python3 tests/ps-balance-audit.py
          echo 'F37 gates PASS'
      # [F45 S4] Explorer file-API server routes. The mjs auditor tokenizes the
      # new module (and the server that dot-sources it) exactly like the py
      # audit, then asserts the F45 contract: every documented route dispatched
      # once, the 400/401/403/404/405/413/415/416/500/502/504 status set, CSRF
      # on both POSTs, the hard-op refusal, atomic schemaVersion-2 index writes
      # with gofileHosts, the 41-value preview allowlist (compared value for
      # value against the S2 fixture), the SameSite=Strict CSRF cookie, the
      # sandbox CSP/isolation headers, and ONE redaction funnel whose marker is
      # ***REDACTED***. It also pins the deployment (main.yml stages the module
      # next to the server) and this lane's own wiring.
      - name: F45 S4 Explorer file-API route contract (structure + redaction)
        shell: bash
        run: |
          set -euo pipefail
          test -f payloads/ghrdp-fx.ps1 || { echo 'F45: the fx module is missing' >&2; exit 1; }
          test -f tests/f45-fx-server.ps1 || { echo 'F45: the fx server test is missing' >&2; exit 1; }
          test -f scripts/ps-balance-audit.mjs || { echo 'F45: the node ps auditor is missing' >&2; exit 1; }
          node scripts/ps-balance-audit.mjs
          # every route of the contract is answered by the module
          for route in '/api/fx/list' '/api/fx/meta' '/api/fx/gofile/status' '/api/fx/preview' '/api/fx/op' '/api/fx/upload' '/preview-sandbox'; do
            grep -qF "'$route'" payloads/ghrdp-fx.ps1 || { echo "F45: the module does not dispatch $route" >&2; exit 1; }
          done
          # the module logs ONLY through the redaction funnel
          grep -qF '***REDACTED***' payloads/ghrdp-fx.ps1 || { echo 'F45: no redaction marker' >&2; exit 1; }
          grep -qF 'Protect-FxText -Text $Message -Secrets $secrets' payloads/ghrdp-fx.ps1 || { echo 'F45: the audit funnel does not redact' >&2; exit 1; }
          if grep -nF 'Write-Host' payloads/ghrdp-fx.ps1; then
            echo 'F45: the module writes to the console outside the redaction funnel' >&2; exit 1
          fi
          if grep -nF 'Invoke-WebRequest' payloads/ghrdp-fx.ps1; then
            echo 'F45: the module must use its injectable HTTP seam' >&2; exit 1
          fi
          # the server cannot silently pretend the API exists
          grep -qF '[F45 S4 fx-dispatch-begin]' payloads/ghrdp-server.ps1 || { echo 'F45: the server dispatch block is missing' >&2; exit 1; }
          grep -qF 'Explorer API unavailable' payloads/ghrdp-server.ps1 || { echo 'F45: a missing module is not fail-visible' >&2; exit 1; }
          # deployment + lane wiring
          grep -qF 'payloads/ghrdp-fx.ps1' .github/workflows/main.yml || { echo 'F45: main.yml does not stage the module' >&2; exit 1; }
          grep -qF "'payloads/ghrdp-fx.ps1'" .github/workflows/launch-gates.yml || { echo 'F45: windows-native does not parse the module' >&2; exit 1; }
          grep -qF 'tests/f45-fx-server.ps1' .github/workflows/launch-gates.yml || { echo 'F45: the server test is not executed by any lane' >&2; exit 1; }
          echo 'F45 gates PASS'
      # [F46] Mirror worker reason visibility + policy-correct retries + the
      # documented gofile contract. The policy table must be the SAME table as
      # the F44/S3 TypeScript contract (pinned by
      # tests/f46-mirror-contract.test.js, which `node --test tests/*.test.js`
      # picks up in the step below), the worker must emit ONE structured line
      # per attempt, mirror stays default-OFF, the probe is read-only, and the
      # banned evasion patterns (spoofed User-Agent, proxy switching, IP
      # rotation, header spoofing) may not appear in any mirror surface.
      - name: F46 mirror reason-visibility + gofile contract gates
        shell: bash
        run: |
          set -euo pipefail
          test -f payloads/ghrdp-mirror.ps1 || { echo 'F46: the mirror module is missing' >&2; exit 1; }
          test -f tests/f46-mirror-policy.ps1 || { echo 'F46: the policy lab is missing' >&2; exit 1; }
          test -f docs/MIRROR-HOSTS.md || { echo 'F46: docs/MIRROR-HOSTS.md is missing' >&2; exit 1; }
          # one structured attempt line per attempt, produced by the module and
          # used by the worker
          grep -qF '[mirror] attempt {0} host={1} phase={2} status={3} msg={4} ms={5}' payloads/ghrdp-mirror.ps1
          grep -qF 'Format-F46AttemptLine' payloads/ghrdp-watcher.ps1
          grep -qF 'Format-F46FailureSummary' payloads/ghrdp-watcher.ps1
          # the old bare retry-exhausted message may not exist anywhere
          if grep -rnE 'upload failed after [0-9]+ tries|FAILED after .+ tries' payloads/ghrdp-watcher.ps1 payloads/ghrdp-lib.ps1; then
            echo 'F46: a bare retry-exhausted message without phase+status is forbidden' >&2
            exit 1
          fi
          # the F44/S3 policy table
          grep -qF '$script:F46FailFastStatuses = @(401, 403, 413, 415)' payloads/ghrdp-mirror.ps1
          grep -qF "\$script:F46TransientPhases = @('dns', 'tcp', 'tls', 'http')" payloads/ghrdp-mirror.ps1
          grep -qF '$script:F46MaxAttempts = 5' payloads/ghrdp-mirror.ps1
          grep -qF '$script:F46RetryAfterCapMs = 120000' payloads/ghrdp-mirror.ps1
          # the documented gofile contract (current reference + fleet form)
          grep -qF 'guest contract needs no account' payloads/ghrdp-mirror.ps1
          grep -qF "serversPath = '/servers'" payloads/ghrdp-mirror.ps1
          grep -qF "uploadPathAuto = '/uploadfile'" payloads/ghrdp-mirror.ps1
          grep -qF "uploadPathFleet = '/contents/uploadfile'" payloads/ghrdp-mirror.ps1
          grep -qF "multipartField = 'file'" payloads/ghrdp-mirror.ps1
          if grep -nF "authScheme = 'Bearer'" payloads/ghrdp-mirror.ps1; then
            echo 'F46: the account Bearer scheme returned to the host contract (F48 token-less)' >&2
            exit 1
          fi
          grep -qF "idFields = @('fileId', 'id')" payloads/ghrdp-mirror.ps1
          grep -qF "pageFields = @('downloadPage', 'directLink')" payloads/ghrdp-mirror.ps1
          # mirror stays default-OFF; the probe is read-only; no credential in a URL
          grep -qF 'enabled = $false' payloads/ghrdp-mirror.ps1
          grep -qiF 'no content is uploaded' payloads/ghrdp-mirror.ps1
          if grep -nE '\?token=' payloads/ghrdp-mirror.ps1 payloads/ghrdp-watcher.ps1; then
            echo 'F46: a credential may not appear in a URL' >&2
            exit 1
          fi
          # evasion is forbidden in every mirror surface
          if grep -nE 'Mozilla/[0-9]|X-Forwarded-For|[Ww]ebProxy|proxy *=|rotat' payloads/ghrdp-mirror.ps1 payloads/ghrdp-watcher.ps1 payloads/ghrdp-fx.ps1; then
            echo 'F46: an evasion pattern (UA spoofing / proxy / IP rotation / header spoofing) appeared' >&2
            exit 1
          fi
          # [F46 §1/§4] the UI reason column must render the FULL reason (both
          # UIs) and the card may not claim AES-256 unconditionally.
          test -f src/tests/smoke/f46-mirror-truth.test.tsx || { echo 'F46: the mirror DOM truth test is missing' >&2; exit 1; }
          if grep -nE 'error\.slice\(0, ?4?[0-9]\)|substring\(0, ?4?[0-9]\)' src/components/domain/MirrorCard.tsx payloads/ui.html; then
            echo 'F46: the mirror error column is truncated again' >&2
            exit 1
          fi
          grep -qF 'mirror-reason-full' src/components/domain/MirrorCard.tsx
          grep -qF 'errfull' payloads/ui.html
          grep -qF 'claimTitle' src/components/domain/MirrorCard.tsx
          grep -qF 'mirror.titlePlain' src/components/domain/MirrorCard.tsx
          grep -qF 'encryptMode' src/lib/domain/progress.ts
          grep -qF 'encryptedAny' src/lib/domain/progress.ts
          grep -qF '"titlePlain"' src/i18n/en.json
          # deployment + lane wiring
          grep -qF 'payloads/ghrdp-mirror.ps1' .github/workflows/main.yml
          grep -qF 'mirror-diag' .github/workflows/main.yml
          grep -qF "'payloads/ghrdp-mirror.ps1'" .github/workflows/launch-gates.yml
          grep -qF 'tests/f46-mirror-policy.ps1' .github/workflows/launch-gates.yml
          grep -qF 'and the encrypt' docs/MIRROR-HOSTS.md || true
          # [F50] streaming transport gates: the upload path must stay streamed
          # (HttpClient + MultipartFormDataContent + StreamContent(FileStream)),
          # with no whole-file buffering of any kind, and the windows lab must
          # keep the sparse-file streaming matrix + real retry paths.
          echo '[F50] streaming transport gates'
          grep -qF 'System.Net.Http.StreamContent' payloads/ghrdp-mirror.ps1
          grep -qF 'MultipartFormDataContent' payloads/ghrdp-mirror.ps1
          grep -qF 'System.Net.Http.HttpClient' payloads/ghrdp-mirror.ps1
          grep -qF '[System.IO.File]::Open($Path' payloads/ghrdp-mirror.ps1
          if awk '/^function Send-F46GofileUpload/,/^function ConvertFrom-F46UploadResponse/' payloads/ghrdp-mirror.ps1 | grep -nE 'ReadAllBytes|MemoryStream|AllowWriteStreamBuffering'; then
            echo 'F50: a whole-file buffering pattern returned to the upload path (the 2GB "Stream was too long" class)' >&2
            exit 1
          fi
          grep -qF 'fsutil file createnew' tests/f46-mirror-policy.ps1
          for f50size in 100MB 1GB 3GB 6GB; do
            grep -qF "'$f50size'" tests/f46-mirror-policy.ps1 || { echo "F50: the lab is missing the $f50size sparse-streaming cell" >&2; exit 1; }
          done
          grep -qF '429-then-success' tests/f46-mirror-policy.ps1
          grep -qF '502-budget' tests/f46-mirror-policy.ps1
          grep -qF 'ZERO network tries' tests/f46-mirror-policy.ps1
          grep -qF '$script:F46RetryAfterCapMs = 120000' payloads/ghrdp-mirror.ps1
          grep -qF '$script:F46MaxAttempts = 5' payloads/ghrdp-mirror.ps1
          # [F51] always-on Downloads gates: the override exists, is wired into
          # the scan loop, stays in-memory only, and keeps the F49 opt-in gate
          # (flags + modal) fully intact for Desktop/Documents/Temp/RDP-Storage.
          echo '[F51] always-on Downloads gates'
          grep -qF 'function Split-F51AutoQueue' payloads/ghrdp-watcher.ps1
          grep -qF 'function New-F51AutoHost' payloads/ghrdp-watcher.ps1
          grep -qF '$uploadQueue = @($f51Split.auto)' payloads/ghrdp-watcher.ps1
          grep -qF 'foreach ($f in @($uploadQueue))' payloads/ghrdp-watcher.ps1
          grep -qF '[mirror] AUTO-UPLOAD: {0} (Downloads root; F51 always-on, opt-in not required)' payloads/ghrdp-watcher.ps1
          grep -qF 'F51AutoHostLedgered' payloads/ghrdp-watcher.ps1
          grep -qF 'the new download lands in the AUTO queue by itself' tests/f46-mirror-policy.ps1
          grep -qF 'a Desktop file does NOT auto-queue' tests/f46-mirror-policy.ps1
          grep -qF 'id="mirrorOptInModal"' payloads/ui.html
          grep -qF 'F51' docs/MIRROR-HOSTS.md
          node --test tests/f50-f51-stream-auto.test.js
          echo 'F46 gates PASS'

      # [F52] socket truth, Int64, strict lanes and honest guest-cap evidence.
      - name: F52 honest mirror telemetry + Int64 + cap-proof gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/f52-mirror-telemetry.test.js
          test -f src/tests/smoke/f52-mirror-telemetry.test.tsx
          test -f payloads/ghrdp-mirror-progress.cs
          grep -qF 'ghrdp-mirror-progress.cs' .github/workflows/main.yml
          grep -qF 'F52' docs/MIRROR-HOSTS.md
          test "$(wc -l < STATE.md)" -le 60
          python3 tests/ps-balance-audit.py
          node scripts/ps-balance-audit.mjs
          echo 'F52 RESULT=PASS source/DOM/window/cap contracts; native cells remain mandatory'

      # [F53] declared multipart length is the container formula; retries show 0%.
      - name: F53 content-length truth + retry honesty gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/f53-content-length.test.js
          test -f src/tests/smoke/f53-queue-progress.test.tsx
          test -f tests/f53-content-length.ps1
          test -f tests/f53-content-length.cs
          grep -qF 'class ContainerLength' payloads/ghrdp-mirror-progress.cs
          grep -qF 'new SnapshotReadStream' payloads/ghrdp-mirror-progress.cs
          grep -qF 'Get-F53DeclaredPartLength' payloads/ghrdp-mirror.ps1
          grep -qF 'Set-F53PendingRetry' payloads/ghrdp-watcher.ps1
          grep -qF 'framingMode = '"'"'content-length'"'"'' payloads/ghrdp-mirror.ps1
          grep -qF 'F53' docs/MIRROR-HOSTS.md
          test "$(wc -l < STATE.md)" -le 60
          echo 'F53 RESULT=PASS source/DOM contracts; native wire cells remain mandatory'

      # [F48] TOKEN-LESS MIRROR gates (operator directive §0/§1.6): no gofile
      # API token exists anywhere in this system - no secret read, no env
      # plumbing, no missing-token stage halt (absence is NORMAL), no auth
      # header toward the host in payloads/ or src/, guest contract + probe +
      # authMode in the schema/docs/UI. The AES-256 + probe-matrix greps from
      # F47 §3/§2 stay enforced here. No host-policy evasion.
      - name: F48 token-less mirror gates (guest contract + no-token greps)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          inblock() { awk '/^on:/{f=1} /^permissions:/{f=0} f' "$wf"; }
          # §1 the opt-in is a first-class dispatch input, default false
          inblock | grep -qE '^[[:space:]]+mirror_enable:'
          inblock | grep -qE '^[[:space:]]+mirror_encrypt:'
          # [F59 §1] dispatch defaults FLIPPED (in-place rewrite of the F48/F52
          # assertion): mirror ON, plaintext manual lane, search ON. The shipped
          # config host default and the mirror gate comparison are untouched.
          awk '/mirror_enable:/{f=1} f&&/default:/{print;exit}' "$wf" | grep -qF 'default: true' # F59: mirror ON by default
          awk '/mirror_encrypt:/{f=1} f&&/default:/{print;exit}' "$wf" | grep -qF 'default: false' # F59: plaintext default + mandatory banner
          grep -qE 'MIRROR_INPUT: \$\{\{ github\.event\.inputs\.mirror_enable == true' "$wf"
          grep -qE 'MIRROR_ENCRYPT_INPUT: \$\{\{ github\.event\.inputs\.mirror_encrypt == true' "$wf"
          # §1.6 GATE 1: the banished mirror secret name may not exist ANYWHERE
          # in the tree (the pattern uses [_] so this workflow file - which
          # spells the pattern out - never matches itself).
          hits=$(grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=ui --exclude-dir=coverage --exclude-dir=.vite 'GOFILE[_]TOKEN' . || true)
          if [ -n "$hits" ]; then
            echo 'F48: the banished mirror secret name appeared in:' >&2
            echo "$hits" >&2
            exit 1
          fi
          # §1.6 GATE 2: no Authorization / X-Gofile-Token / Cookie header may
          # target the host in payloads/ or src/. Comment lines may NAME the
          # banned headers while documenting their absence - only non-comment
          # lines count. The mirror module + watcher are 100% host-facing, so
          # ANY non-comment auth header there fails; elsewhere a hit needs a
          # gofile/accountToken target on the same line (local dash/terminal/
          # GitHub API auth is out of scope and stays).
          strip_comments() { grep -vE '^[[:space:]]*(#|//|\*|/\*)' "$1" || true; }
          for f in payloads/ghrdp-mirror.ps1 payloads/ghrdp-watcher.ps1; do
            if strip_comments "$f" | grep -nE 'Authorization|X-Gofile-Token|Cookie'; then
              echo "F48: an auth header toward the host appeared in $f" >&2
              exit 1
            fi
          done
          auth_hits=''
          while IFS= read -r -d '' f; do
            h=$(grep -nE 'Authorization|X-Gofile-Token|[Cc]ookie' "$f" 2>/dev/null \
              | grep -vE '^[0-9]+:[[:space:]]*(#|//|\*|/\*)' \
              | grep -iE 'gofile|accountToken' || true)
            if [ -n "$h" ]; then auth_hits="$auth_hits$h\n($f)\n"; fi
          done < <(find payloads src -type f \( -name '*.ps1' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.html' \) -print0 2>/dev/null)
          if [ -n "$auth_hits" ]; then
            printf '%b' "$auth_hits"
            echo 'F48: an auth header targeting the mirror host appeared in payloads/ or src/' >&2
            exit 1
          fi
          url_hits=''
          while IFS= read -r -d '' f; do
            case "$f" in src/tests/*) continue ;; esac
            h=$(grep -nE '[?&]token=|accountToken=' "$f" 2>/dev/null \
              | grep -vE '^[0-9]+:[[:space:]]*(#|//|\*|/\*)' \
              | grep -v '\*\*\*REDACTED\*\*\*' \
              | grep -iE 'gofile|accountToken' || true)
            if [ -n "$h" ]; then url_hits="$url_hits$h\n($f)\n"; fi
          done < <(find payloads src -type f \( -name '*.ps1' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.html' \) -print0 2>/dev/null)
          if [ -n "$url_hits" ]; then
            printf '%b' "$url_hits"
            echo 'F48: a credential parameter targeting the host appeared in a URL/header in payloads/ or src/' >&2
            exit 1
          fi
          # §1.6 GATE 3: a missing mirror secret may never halt staging again -
          # the F47 fail-closed halt constructs must be gone, and the validate
          # step must report token-less guest mode as the NORMAL state.
          if grep -nE "MISSING REQUIRED SECRET: GOFILE|requires the repo secret|F47 halt|repo secret GOFILE" "$wf"; then
            echo 'F48: a missing-token staging halt reappeared in main.yml' >&2
            exit 1
          fi
          grep -qF 'F48 mirror opt-in ON for this run: token-less guest mode' "$wf"
          grep -qF '[F48] mirror opt-in for THIS run' "$wf"
          # guest contract pins: no token ladder, no auth scheme, authMode field
          if grep -nE 'Get-F46HostToken|authScheme|autoAccount|tokenConfigKey|gofile-token\.txt' payloads/ghrdp-mirror.ps1 payloads/ghrdp-watcher.ps1 payloads/ghrdp-fx.ps1; then
            echo 'F48: token plumbing reappeared in a payload' >&2
            exit 1
          fi
          grep -qF "authMode = 'guest'" payloads/ghrdp-mirror.ps1
          grep -qF 'host requires account token; token-less mode unsupported' payloads/ghrdp-mirror.ps1
          grep -qF 'Format-F48AuthReason' payloads/ghrdp-mirror.ps1
          grep -qF "authMode?: 'guest' | 'requires-account'" src/components/explorer/data/schema.ts
          grep -qF 'token-less guest mode' src/i18n/en.json
          if grep -nE '[?&]token=' "$wf" payloads/ghrdp-mirror.ps1 payloads/ghrdp-watcher.ps1; then
            echo 'F48: a credential may not appear in a URL' >&2
            exit 1
          fi
          # §1.5 the secret-hygiene note is documented on the Settings page
          grep -qF 'Secret hygiene' src/pages/Settings.tsx
          # §3 real AES-256 + honest title + masked key (F47 §3, unchanged)
          grep -qF 'keyBytes = 32' payloads/ghrdp-mirror.ps1
          grep -qF "encryptedMime = 'application/x-ghrdp-mirror'" payloads/ghrdp-mirror.ps1
          grep -qF 'function Invoke-F46EncryptFile' payloads/ghrdp-mirror.ps1
          grep -qF 'function Invoke-F46DecryptFile' payloads/ghrdp-mirror.ps1
          grep -qF 'function Test-F46AesGcmUsable' payloads/ghrdp-mirror.ps1
          grep -qF 'Invoke-F46EncryptFile' payloads/ghrdp-watcher.ps1
          grep -qF 'refusing to upload plaintext' payloads/ghrdp-watcher.ps1
          grep -qF '@($mirrorKeyText)' payloads/ghrdp-watcher.ps1
          grep -qF 'Mirror - AES-256 encrypted runner upload' src/i18n/en.json
          grep -qF 'MaskedField id="mirrorKey"' src/components/domain/KeysCard.tsx
          # §2 probe matrix visible on the Mirror page + in the step summary
          grep -qF '<MirrorHostMatrix />' src/pages/Mirror.tsx
          grep -qF 'mirrorHosts' src/components/domain/MirrorHostMatrix.tsx
          grep -qF 'mirror-host-operator-options' src/components/domain/MirrorHostMatrix.tsx
          # no evasion in any mirror surface (the page component included)
          if grep -nE 'Mozilla/[0-9]|X-Forwarded-For|[Ww]ebProxy|proxy[[:space:]]*=|rotat' payloads/ghrdp-mirror.ps1 payloads/ghrdp-watcher.ps1 payloads/ghrdp-fx.ps1 src/components/domain/MirrorHostMatrix.tsx; then
            echo 'F48: an evasion pattern (UA spoofing / proxy / IP rotation / header spoofing) appeared' >&2
            exit 1
          fi
          # §3 the lab + suites exist and run
          test -f tests/f48-tokenless-mirror.test.js
          test -f src/tests/smoke/f48-tokenless-mirror.test.tsx
          grep -qF '[F48' tests/f46-mirror-policy.ps1
          # a nested try inside a finally must carry its own catch INSIDE the
          # finally - `finally { try { X } } catch { }` is a parse error.
          if grep -nE 'finally \{ try \{[^{}]*\} \} catch \{ \}' payloads/ghrdp-mirror.ps1 payloads/ghrdp-watcher.ps1 tests/f46-mirror-policy.ps1 "$wf"; then
            echo 'F48: malformed try/finally (the catch must sit inside the finally block)' >&2
            exit 1
          fi
          node --test tests/f48-tokenless-mirror.test.js
          echo 'F48 gates PASS'
      # [F49] One-click runtime opt-in for the token-less mirror: the API, the
      # banner + the modal exist in both UIs, the token bans extend to the new
      # code, and the lab + suites exist and run. The dispatch mirror_enable
      # path and the default-off gate are untouched.
      - name: F49 mirror runtime opt-in gates (API + banner + modal + token bans)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          test -f tests/f49-mirror-runtime.ps1 || { echo 'F49: the runtime lab is missing' >&2; exit 1; }
          test -f tests/f49-mirror-runtime.test.js || { echo 'F49: the node suite is missing' >&2; exit 1; }
          test -f src/tests/smoke/f49-runtime-optin.test.tsx || { echo 'F49: the DOM suite is missing' >&2; exit 1; }
          test -f src/lib/mirror.ts || { echo 'F49: the mirror API client is missing' >&2; exit 1; }
          grep -qF '/api/mirror/enable' payloads/ghrdp-server.ps1 || { echo 'F49: the enable route is missing' >&2; exit 1; }
          grep -qF '/api/mirror/disable' payloads/ghrdp-server.ps1 || { echo 'F49: the disable route is missing' >&2; exit 1; }
          grep -qF '/api/mirror/status' payloads/ghrdp-server.ps1 || { echo 'F49: the status route is missing' >&2; exit 1; }
          grep -qF 'dashboard authorization required (X-Dash-Token or Bearer)' payloads/ghrdp-server.ps1
          grep -qF 'CSRF token missing or invalid' payloads/ghrdp-server.ps1
          grep -qF 'credentials are not accepted in the query string; send X-Dash-Token' payloads/ghrdp-server.ps1
          grep -qF 'RUNTIME OPT-IN' payloads/ghrdp-mirror.ps1
          grep -qF 'RUNTIME OPT-IN' payloads/ghrdp-watcher.ps1
          grep -qF 'mirror-optin-beacon.json' payloads/ghrdp-mirror.ps1
          grep -qF 'Enable &amp; Upload' payloads/ui.html
          grep -qF '"enableUpload": "Enable & Upload"' src/i18n/en.json
          grep -qF 'mirrorOptInModal' payloads/ui.html
          grep -qF 'mirror-disabled-banner' src/components/domain/MirrorCard.tsx
          grep -qF '[F49] runtime opt-in' "$wf"
          # the shipped default is still disabled at code level (F11-5.2)
          grep -qE "enabled = \\\$false" payloads/ghrdp-mirror.ps1
          # token bans extend to the new surfaces: only the dashboard's own
          # X-Dash-Token may be named; no host token name, no credential URL.
          if grep -nE 'X-Gofile-Token|accountToken|GOFILE[_]TOKEN' src/lib/mirror.ts src/components/domain/MirrorCard.tsx; then
            echo 'F49: a host token name appeared in the new UI code' >&2
            exit 1
          fi
          if grep -nE '[?&](token|key|password)=' src/lib/mirror.ts | grep -vF '(?key=)'; then
            echo 'F49: the mirror client builds a credential URL' >&2
            exit 1
          fi
          # no evasion wording in the new surfaces either (the server block via
          # its marker range, so older unrelated lines stay out of scope)
          if grep -nE 'Mozilla/[0-9]|X-Forwarded-For|[Ww]ebProxy|proxy[[:space:]]*=|rotat|spoof' src/lib/mirror.ts src/components/domain/MirrorCard.tsx; then
            echo 'F49: an evasion pattern appeared in the new UI code' >&2
            exit 1
          fi
          if sed -n '/F49 runtime-opt-in-begin/,/F49 runtime-opt-in-end/p' payloads/ghrdp-server.ps1 | grep -nE 'Mozilla/[0-9]|X-Forwarded-For|[Ww]ebProxy|proxy[[:space:]]*=|rotat|spoof'; then
            echo 'F49: an evasion pattern appeared in the new server routes' >&2
            exit 1
          fi
          # the malformed try/finally ban covers the new lab too
          if grep -nE 'finally \\{ try \\{[^{}]*\\} \\} catch \\{ \\}' tests/f49-mirror-runtime.ps1; then
            echo 'F49: malformed try/finally (the catch must sit inside the finally block)' >&2
            exit 1
          fi
          grep -qF 'tests/f49-mirror-runtime.ps1' .github/workflows/launch-gates.yml || { echo 'F49: the runtime lab is not executed by any lane' >&2; exit 1; }
          node --test tests/f49-mirror-runtime.test.js
          echo 'F49 gates PASS'

      - name: F40 information-architecture regression lock
        shell: bash
        run: |
          test -f tests/f40-ia-gate.sh || { echo 'F40: the IA regression lock is missing' >&2; exit 1; }
          bash tests/f40-ia-gate.sh
      - name: Native UI and VPS contracts (Node)
        run: node --test tests/*.test.js
      # [F41 P1] v2 dashboard gates: the built bundle must render all 219
      # frozen regression ids (jsdom), pass the six smoke suites, carry no
      # banned green tokens, keep the bottom-bar time contract, and mount in a
      # real Chromium with zero console errors. Playwright browsers download
      # from cdn.playwright.dev (allowed on runners; blocked in some sandboxes).
      - name: F41 v2 build + smoke + regression-id gates
        run: |
          set -euo pipefail
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          export VITE_BUILD_SHA="${GITHUB_SHA:-dev}"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          node scripts/check-regression-ids.mjs
          node scripts/check-no-neon-green.mjs ui/dist/index.html
          node scripts/check-bottom-bar-time.mjs
          # [F43] flag contract: DEFAULT ON (v2), ?ui=v1 escape, staged ui-v2.html
          grep -qF '$script:UiV2Default = $true' payloads/ghrdp-server.ps1
          grep -qF '$script:UiV2Path' payloads/ghrdp-server.ps1
          grep -qF 'ui-v2.html' payloads/ghrdp-server.ps1
          grep -qF 'ui-v2.html' .github/workflows/main.yml
          grep -qF 'ui-v2.html staging failed - build artifact missing' .github/workflows/main.yml
          # [F43] build-ui job must exist in main.yml (root-cause fix)
          grep -qE '^[[:space:]]+build-ui:' .github/workflows/main.yml
          grep -qF 'needs: [build-ui]' .github/workflows/main.yml
          grep -qF 'actions/download-artifact' .github/workflows/main.yml
          grep -qF 'name: dist-ui' .github/workflows/main.yml
          grep -qF 'if ($v2len -le 51200) { throw' .github/workflows/main.yml
          if ! out=$(pnpm exec vitest run 2>&1); then
            echo "$out"
            detail=$(printf '%s' "$out" | tail -c 2200 | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')
            echo "::error title=F45 S2 smoke::${detail}"
            exit 1
          fi
      - name: F45 S1 Explorer namespace and token gates
        run: |
          set -euo pipefail
          node scripts/check-fx-ids.mjs
          if ! out=$(pnpm exec vitest run src/tests/smoke/fx-ids-regression.test.ts src/tests/smoke/fx-tokens.test.ts 2>&1); then
            echo "$out"
            detail=$(printf '%s' "$out" | tail -c 2200 | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')
            echo "::error title=F45 S1 fx-foundation::${detail}"
            exit 1
          fi
      - name: F45 S2 schema and mock-host gates (offline only)
        run: |
          set -euo pipefail
          if ! out=$(pnpm exec vitest run src/tests/smoke/fx-schema-migration.test.ts src/tests/smoke/fx-gofile-mock.test.tsx 2>&1); then
            echo "$out"
            detail=$(printf '%s' "$out" | tail -c 2200 | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')
            echo "::error title=F45 S2 data::${detail}"
            exit 1
          fi
      # [F45 S3] endpoint clients only: dash-token header transport, CSRF on
      # POST, typed §5 clients and the §5.2/§8.2 retry policy. Offline MSW; no
      # server routes (S4) and no UI (S5+) are wired yet, so the shipped bundle
      # must not gain any /api/fx code - that is asserted here too.
      - name: F45 S3 endpoint client and retry policy gates (offline only)
        run: |
          set -euo pipefail
          if ! out=$(pnpm exec vitest run src/tests/smoke/fx-retry-policy.test.ts src/tests/smoke/fx-endpoint-client.test.ts 2>&1); then
            echo "$out"
            detail=$(printf '%s' "$out" | tail -c 2200 | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')
            echo "::error title=F45 S3 endpoints::${detail}"
            exit 1
          fi
          # No credential may reach a URL in the Explorer client sources, and the
          # S3 layer must stay out of the production single-file bundle.
          if grep -RnE '\$\{[^}]*[Tt]oken[^}]*\}|\?key=' src/components/explorer/api/ ; then
            echo "::error title=F45 S3 endpoints::credential appears in an Explorer URL expression"
            exit 1
          fi
          # [F49] X-Dash-Token is a legitimate PRODUCTION header now (the Mirror
          # page sends the dash token by header); it no longer proves the S3
          # layer leaked. X-Idempotency-Key is S3-client-only, so the bundle
          # stays clean of S3 exactly as before.
          for needle in 'X-Idempotency-Key' 'api/fx/list' 'fx.err.hostBadGateway'; do
            if grep -qF "$needle" ui/dist/index.html; then
              echo "::error title=F45 S3 endpoints::S3 client code leaked into the shipped bundle ($needle)"
              exit 1
            fi
          done
          echo 'F45 S3 endpoint gates PASS'
      - name: F41 v2 e2e (playwright, real bundle)
        run: |
          set -euo pipefail
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          pnpm exec playwright install --with-deps chromium
          # Failure bridge: the sandbox authoring this cannot read runner logs
          # (blob storage blocked), so surface the report tail as ONE readable
          # ::error:: annotation on the check run.
          if ! out=$(pnpm exec playwright test 2>&1); then
            echo "$out" | tail -60
            # [F45-S2-RESUME §1.1] `tail -c 2200` kept the run SUMMARY and cut the
            # per-test detail block, which is exactly where playwright prints the
            # pending "Call log" (i.e. which await was still running when the test
            # timed out). That is why the f42 "(c)" timeout was un-diagnosable from
            # the annotation. Emit the failure block (head) PLUS the summary (tail).
            detail=$(printf '%s' "$out" | awk '/^  [0-9]+\) /{f=1} f{print}' | head -c 1700)
            summary=$(printf '%s' "$out" | tail -c 400)
            echo "::error::E2E-FAIL::$(printf '%s' "${detail}${summary}" | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g' | iconv -f UTF-8 -t UTF-8 -c)"
            exit 1
          fi
      # [F42] ?ui=v2 must ACTUALLY reach v2: normalised query, fail-visible
      # missing-v2 banner, URLSearchParams link builder, loud staging assert.
      - name: F42 ui=v2 reachability gates
        shell: bash
        run: |
          set -euo pipefail
          srv=payloads/ghrdp-server.ps1
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          # §1 normalise every literal '?' after the FIRST one, BEFORE the split
          norm=$(grep -nF ".Replace('?', '&')" "$srv" | head -1 | cut -d: -f1)
          split=$(grep -nF "(\$qNorm -split '&')" "$srv" | head -1 | cut -d: -f1)
          test -n "$norm" && test -n "$split" && test "$norm" -lt "$split" || { echo 'F42: ?->& normalisation must precede the & split' >&2; exit 1; }
          grep -qF 'Substring($qAt + 1)' "$srv"
          decode=$(grep -nF 'UnescapeDataString' "$srv" | head -1 | cut -d: -f1)
          test "$decode" -gt "$split" || { echo 'F42: pairs must be url-decoded after the split' >&2; exit 1; }
          # §2 fail-VISIBLE v2 (200 + red banner + log line), never silent v1
          grep -qF 'uiV2MissingBanner' "$srv"
          grep -qF 'ui-v2.html not staged in this run - main.yml stage step failed; re-dispatch or check CI' "$srv"
          grep -qF '[F42] V2-MISSING: ' "$srv"
          grep -qF 'background:#7f1d1d' "$srv"
          # §3 v1 link builder: URLSearchParams only, no literal ?ui= href
          grep -qF 'id="v2PreviewLink"' "$ui"
          grep -qF "u.searchParams.set('ui','v2')" "$ui"
          grep -qF "a.setAttribute('href',v2PreviewHref())" "$ui"
          if grep -qE "href=[\"']\?ui=v2" "$ui"; then echo 'F42: a literal ?ui=v2 href survives in v1' >&2; exit 1; fi
          # §4 staging assert: loud halt, not a silent v1-forever
          grep -qF 'ui-v2.html staging failed - build artifact missing' "$wf"
          grep -qF 'Test-Path -LiteralPath $v2p' "$wf"
          grep -qF 'if ($v2len -le 51200) { throw' "$wf"
          # §5 tests exist; the 219-id lock is untouched
          test -f tests/f42-ui-routing.test.js
          test -f src/tests/e2e/f42-ui-routing.spec.ts
          test -f src/tests/e2e/f42-fixture.ts
          test -f src/tests/smoke/v2-preview-link.test.ts
          grep -qF 'Get-RequestParts "GET /?key=K1?ui=v2 HTTP/1.1' tests/f27-windows.ps1
          node scripts/check-regression-ids.mjs
          test "$(grep -c 'const BASELINE_IDS' tests/f38-ui-glass.test.js)" -eq 1
          echo 'F42 gates PASS: query=normalized, staging=fail-visible, links=correct'
      # [F43] build-ui in main.yml + DEFAULT-v2 cutover + Classic UI escape.
      - name: F43 build-ui wiring + default-v2 cutover gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          srv=payloads/ghrdp-server.ps1
          # §1.4 gate greps: build-ui job + needs + download-artifact + size assert
          grep -qE '^[[:space:]]+build-ui:' "$wf"
          grep -qF 'needs: [build-ui]' "$wf"
          grep -qF 'actions/download-artifact' "$wf"
          grep -qF 'name: dist-ui' "$wf"
          grep -qF 'actions: write' "$wf"
          grep -qF 'if ($v2len -le 51200) { throw' "$wf"
          grep -qF "throw 'ui-v2.html staging failed - build artifact missing'" "$wf"
          # download-artifact must appear BEFORE the Stage files step
          dl=$(grep -nF 'actions/download-artifact' "$wf" | head -1 | cut -d: -f1)
          st=$(grep -nF 'Stage files + write config.json' "$wf" | head -1 | cut -d: -f1)
          test -n "$dl" && test -n "$st" && test "$dl" -lt "$st" || { echo 'F43: download-artifact must precede Stage files' >&2; exit 1; }
          # no in-rdp pnpm build of the v2 bundle (moved to build-ui)
          if awk '/name: Write deploy payloads/,/name: Build ghrdp-handler-kit/' "$wf" | grep -E 'pnpm (run )?build|pnpm install'; then
            echo 'F43: rdp Write-deploy still builds ui in-job (must use dist-ui artifact)' >&2
            exit 1
          fi
          # §2 default-v2 cutover
          grep -qF '$script:UiV2Default = $true' "$srv"
          if grep -qF '$script:UiV2Default = $false' "$srv"; then
            echo 'F43: UiV2Default still false' >&2; exit 1
          fi
          # Classic UI escape in v2 TopBar (en+si i18n)
