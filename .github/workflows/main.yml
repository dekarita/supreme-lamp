name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Desktop+Documents+Temp+D-Storage (AES-256) to gofile + telegraph. PUBLIC index. default OFF'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Download Tailscale
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $out = "tailscale-setup.msi"; $ok = $false
          for ($a = 1; $a -le 4; $a++) {
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null
            $LASTEXITCODE = 0
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; break }
            Start-Sleep -Seconds (3 * $a)
          }
          if (-not $ok) { for ($a = 1; $a -le 3; $a++) { try { Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; break } } catch {}; Start-Sleep -Seconds (3 * $a) } }
          if (-not $ok) { throw "Could not download Tailscale MSI." }
      - name: Install Tailscale
        shell: pwsh
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
          Start-Sleep -Seconds 5
      - name: Tailscale login (YOUR tailnet via TS_AUTHKEY, else link)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState) { $ok = $true; break } } catch {}; if ($i -eq 3) { Start-Service Tailscale -EA SilentlyContinue }; Start-Sleep 2 }
          if (-not $ok) { throw "tailscaled not started." }
          $S = $env:GITHUB_STEP_SUMMARY
          if ($env:TS_AUTHKEY) {
            & $ts up --authkey=$env:TS_AUTHKEY --accept-dns=true 2>$null | Out-Null
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $ok = $true; break } } catch {}; Start-Sleep 2 }
            if (-not $ok) { throw "TS_AUTHKEY login failed - check key is reusable + not expired." }
            "### Tailscale: joined YOUR tailnet via TS_AUTHKEY ✅  IP=" + ((& $ts ip -4).Trim()) >> $S
          } else {
            $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"; $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process $ts -ArgumentList "up" -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru
            $url = $null
            for ($i = 0; $i -lt 90; $i++) { $t = ""; foreach ($f in @($upLog, $upErr)) { if (Test-Path $f) { try { $fs = [IO.File]::Open($f, 'Open', 'Read', 'ReadWrite'); $sr = New-Object IO.StreamReader($fs); $t += $sr.ReadToEnd(); $sr.Close(); $fs.Close() } catch {} } }; if ($t -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }; Start-Sleep 2 }
            if (-not $url) { throw "Tailscale sign-in link not found." }
            "### Click to sign in" >> $S; "" >> $S; "**[$url]($url)**" >> $S
            "" >> $S; "TIP: for permanent control from YOUR network, add secret TS_AUTHKEY from YOUR Tailscale admin -> Settings -> Keys (reusable)." >> $S
            Write-Host "SIGN-IN LINK: $url"
          }
      - name: Wait Tailscale
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $a = $false
          for ($i = 0; $i -lt 120; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $a = $true; break } } catch {}; Start-Sleep 5 }
          if (-not $a) { throw "Tailscale timeout." }
          Write-Host "Tailscale IP = $((& $ts ip -4).Trim())"
      - name: Enable Funnel (optional TS_API_KEY) for public URL
        env:
          TS_KEY: ${{ secrets.TS_API_KEY }}
        shell: pwsh
        run: |
          $tok = $env:TS_KEY
          if (-not $tok) { Write-Host "TS_API_KEY not set - skipping Funnel (tailnet URL still works if you are on your tailnet)."; exit 0 }
          $base = 'https://api.tailscale.com/api/v2/tailnet/-/acl'
          $h = @{ Authorization = "Bearer $tok"; Accept = 'application/json' }
          $txt = $null
          try { $txt = (Invoke-WebRequest $base -Headers $h -UseBasicParsing -TimeoutSec 30).Content } catch { Write-Host "ACL GET failed"; exit 0 }
          $clean = $txt -replace '/\*[\s\S]*?\*/', ''
          $clean = ($clean -split "`n" | ForEach-Object { $_ -replace '//[^\r\n]*', '' }) -join "`n"
          $clean = $clean -replace ',(\s*[\]}])', '$1'
          $acl = $null; try { $acl = $clean | ConvertFrom-Json -EA Stop } catch { Write-Host "ACL parse failed - leaving unchanged"; exit 0 }
          $na = @(); if ($acl.PSObject.Properties['nodeAttrs'] -and $acl.nodeAttrs) { $na = @($acl.nodeAttrs) }
          $has = $false; foreach ($n in $na) { if ((@($n.target) -contains '*') -and (@($n.attr) -contains 'funnel')) { $has = $true } }
          if (-not $has) {
            $na = $na + , @{ target = @('*'); attr = @('funnel') }
            if ($acl.PSObject.Properties['nodeAttrs']) { $acl.nodeAttrs = $na } else { $acl | Add-Member -NotePropertyName 'nodeAttrs' -NotePropertyValue $na -Force }
            try { Invoke-WebRequest $base -Headers @{ Authorization = "Bearer $tok"; 'Content-Type' = 'application/json' } -Method Post -Body ([Text.Encoding]::UTF8.GetBytes(($acl | ConvertTo-Json -Depth 12 -Compress))) -UseBasicParsing -TimeoutSec 30 | Out-Null; Write-Host "Funnel attr added." } catch { Write-Host "Funnel POST failed." }
          } else { Write-Host "Funnel already present." }
      - name: Setup tailnet web link (Serve)
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create(); $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $b = [byte[]]::new(24); $rng.GetBytes($b); $dashToken = -join ($b | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
          Add-Content $env:GITHUB_ENV ("DASH_TOKEN=" + $dashToken)
          $so = Join-Path $env:RUNNER_TEMP 'serve.out'; $se = Join-Path $env:RUNNER_TEMP 'serve.err'
          Remove-Item $so, $se -Force -EA SilentlyContinue
          Start-Process $ts -ArgumentList @('serve', '--bg', '7331') -RedirectStandardOutput $so -RedirectStandardError $se -WindowStyle Hidden | Out-Null
          $serveUrl = ''; $dns = ''; $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) { $st = $null; try { $j = Start-Job { param($t) & $t status --json 2>$null } -ArgumentList $ts; if (Wait-Job $j -Timeout 4) { $st = Receive-Job $j | ConvertFrom-Json -EA SilentlyContinue }; Remove-Job $j -Force -EA SilentlyContinue } catch {}; if ($st -and $st.Self.DNSName) { $dns = $st.Self.DNSName.TrimEnd('.'); break }; Start-Sleep 2 }
          if ($dns) { $serveUrl = "https://$dns/?key=$dashToken" }
          Add-Content $env:GITHUB_ENV ("SERVE_URL=" + $serveUrl)
          if ($serveUrl) { "**[>>> OPEN WEB-APP <<<]($serveUrl)**" >> $env:GITHUB_STEP_SUMMARY } else { "_Serve not ready - use ghrdp paste link._" >> $env:GITHUB_STEP_SUMMARY }
      - name: Enable RDP + harden + open port
        shell: pwsh
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty $rdp fDenyTSConnections 0
          Set-ItemProperty "$rdp\WinStations\RDP-Tcp" UserAuthentication 1
          Set-ItemProperty "$rdp\WinStations\RDP-Tcp" SecurityLayer 2
          Set-ItemProperty "$rdp\WinStations\RDP-Tcp" MinEncryptionLevel 3
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -EA SilentlyContinue
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -EA SilentlyContinue | Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -EA SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'ghrdp-dash' -EA SilentlyContinue
          New-NetFirewallRule -DisplayName 'ghrdp-dash' -Direction Inbound -LocalPort 7331 -Protocol TCP -Action Allow -Profile Any -Enabled True -EA SilentlyContinue | Out-Null
          & netsh.exe advfirewall firewall add rule name="ghrdp-dash-netsh" dir=in action=allow protocol=TCP localport=7331 enable=yes | Out-Null; $LASTEXITCODE = 0
      - name: Create RDP account (safe password, never throws)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $hb = [byte[]]::new(4); $rng.GetBytes($hb); $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))
          function New-SafePassword([string]$U, [int]$Len) {
            $lo = 'abcdefghijkmnopqrstuvwxyz'; $up = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; $di = '23456789'; $sp = '!@^-_+~'; $all = $lo + $up + $di + $sp
            $buf4 = [byte[]]::new(4)
            for ($attempt = 0; $attempt -lt 500; $attempt++) {
              $arr = [char[]]::new($Len)
              $arr[0] = $lo[([BitConverter]::ToUInt32(($rng.GetBytes($buf4)), 0) % 32)]
              $arr[1] = $up[([BitConverter]::ToUInt32(($rng.GetBytes($buf4)), 0) % 32)]
              $arr[2] = $di[([BitConverter]::ToUInt32(($rng.GetBytes($buf4)), 0) % 8)]
              $arr[3] = $sp[([BitConverter]::ToUInt32(($rng.GetBytes($buf4)), 0) % 7)]
              for ($i = 4; $i -lt $Len; $i++) { $arr[$i] = $all[([BitConverter]::ToUInt32(($rng.GetBytes($buf4)), 0) % $all.Length)] }
              for ($i = $Len - 1; $i -gt 0; $i--) { $j = ([BitConverter]::ToUInt32(($rng.GetBytes($buf4)), 0) % ($i + 1)); $t = $arr[$i]; $arr[$i] = $arr[$j]; $arr[$j] = $t }
              $c = -join $arr; $low = $c.ToLower(); $bad = $U.ToLower()
              $ok = $true
              for ($i = 0; $i -le ($bad.Length - 3); $i++) { if ($low.Contains($bad.Substring($i, 3))) { $ok = $false; break } }
              if ($ok) { return $c }
            }
            throw 'password gen failed'
          }
          $created = $false; $pass = $null
          for ($try = 0; $try -lt 6; $try++) {
            $pass = New-SafePassword $user (24 + $try)
            try { New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -EA Stop | Out-Null; $created = $true; break }
            catch { if ($_.ToString() -match 'InvalidPasswordException') { Write-Host "pwd rejected $try" } else { throw } }
          }
          if (-not $created) { throw "New-LocalUser failed." }
          Add-LocalGroupMember -Group "Administrators" -Member $user -EA SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -EA SilentlyContinue
          if (Test-Path 'D:\') { New-Item -ItemType Directory 'D:\RDP-Storage' -Force | Out-Null; & icacls.exe 'D:\RDP-Storage' /grant "${user}:(OI)(CI)F" 2>$null | Out-Null; $LASTEXITCODE = 0 }
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"; Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"
          Write-Host "Created account: $user"
      - name: Show RDP credentials
        shell: pwsh
        run: |
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
          $u = $env:RDP_USER; $p = $env:RDP_PASS
          $ghrdp = "ghrdp://$ip/" + [uri]::EscapeDataString($u) + "/" + [uri]::EscapeDataString($p)
          Add-Content $env:GITHUB_ENV ("GHRDP_NOW=" + $ghrdp)
          Write-Host "RDP IP=$ip USER=$u PASS=$p"
          if ($env:SERVE_URL) { Write-Host "WEBAPP: $($env:SERVE_URL)" }
          Write-Host "PASTE: $ghrdp"
          "IP $ip / $u / $p" >> $env:GITHUB_STEP_SUMMARY
      - name: Write mirror lib (gofile NEW endpoint + telegraph)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'LIBEOF'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ErrorActionPreference = 'SilentlyContinue'
          function Read-Cfg { $b = [IO.File]::ReadAllBytes($env:GHRDP_CFG); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json) }
          function Save-Cfg($c) { [IO.File]::WriteAllText($c.cfgPath, ($c | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false)) }
          function B64U($s) { $x = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($s)); return $x.Replace('+', '-').Replace('/', '_').TrimEnd('=') }
          $global:GHRDP_PROG = @{ ts = ''; alive = $true; active = @{ name = ''; phase = 'idle'; bytesDone = 0; bytesTotal = 0; pct = 0; speedBps = 0 }; agg = @{ done = 0; active = 0; failed = 0; tracked = 0; bytesDone = 0; bytesTotal = 0; overallPct = 0; speedBps = 0 }; files = @(); log = @() }
          $global:GHRDP_PROG_PATH = $null; $global:GHRDP_LASTFLUSH = 0; $global:GHRDP_DONE_BYTES = 0; $global:GHRDP_TOTAL_BYTES = 0
          $global:GHRDP_SP = @{ t = 0; b = 0 }; $global:GHRDP_SP_A = @{ t = 0; b = 0 }
          function Init-Progress($p) { $global:GHRDP_PROG_PATH = $p; $n = [datetime]::Now.Ticks; $global:GHRDP_SP = @{ t = $n; b = 0 }; $global:GHRDP_SP_A = @{ t = $n; b = 0 } }
          function Set-Active($n, $ph, $t) { $a = $global:GHRDP_PROG.active; $a.name = $n; $a.phase = $ph; $a.bytesDone = 0; $a.bytesTotal = [long]$t; $a.pct = 0; $a.speedBps = 0; $global:GHRDP_SP_A = @{ t = [datetime]::Now.Ticks; b = 0 } }
          function Tick-Bytes($n) { $p = $global:GHRDP_PROG; $p.active.bytesDone += [long]$n; $now = [datetime]::Now.Ticks; if (($now - $global:GHRDP_LASTFLUSH) -gt 2000000) { Flush-Progress $false } }
          function Flush-Progress($force) { $now = [datetime]::Now.Ticks; if (-not $force -and ($now - $global:GHRDP_LASTFLUSH) -lt 2000000) { return }; $global:GHRDP_LASTFLUSH = $now; $p = $global:GHRDP_PROG; $p.ts = [datetime]::Now.ToString('o'); $comp = $global:GHRDP_DONE_BYTES + $(if ($p.active.phase -eq 'upload') { $p.active.bytesDone } else { 0 }); $dt = ($now - $global:GHRDP_SP.t) / 10000000.0; if ($dt -gt 0.5) { $p.agg.speedBps = [math]::Max(0, [math]::Round(($comp - $global:GHRDP_SP.b) / $dt)); $global:GHRDP_SP = @{ t = $now; b = $comp } }; if ($p.active.bytesTotal -gt 0) { $p.active.pct = [math]::Round(100.0 * $p.active.bytesDone / $p.active.bytesTotal, 1) } else { $p.active.pct = 0 }; $p.agg.bytesDone = $comp; if ($p.agg.bytesTotal -gt 0) { $p.agg.overallPct = [math]::Round(100.0 * $comp / $p.agg.bytesTotal, 1) } else { $p.agg.overallPct = 0 }; if ($global:GHRDP_PROG_PATH) { try { $t = $global:GHRDP_PROG_PATH + '.tmp'; [IO.File]::WriteAllText($t, ($p | ConvertTo-Json -Depth 6 -Compress), (New-Object System.Text.UTF8Encoding $false)); [IO.File]::Move($t, $global:GHRDP_PROG_PATH, $true) } catch {} } }
          function Encrypt-File($in, $out, $pw) { $a = [Security.Cryptography.Aes]::Create(); $a.KeySize = 256; $a.Mode = 'CBC'; $a.Padding = 'PKCS7'; $salt = [byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt); $a.IV = [byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($a.IV); $k = New-Object Security.Cryptography.Rfc2898DeriveBytes($pw, $salt, 100000, [Security.Cryptography.HashAlgorithmName]::SHA256); $a.Key = $k.GetBytes(32); $of = [IO.File]::Create($out); $of.Write($salt, 0, 16); $of.Write($a.IV, 0, 16); $cs = New-Object Security.Cryptography.CryptoStream($of, $a.CreateEncryptor(), [Security.Cryptography.CryptoStreamMode]::Write); $inf = [IO.File]::Open($in, 'Open', 'Read', 'ReadWrite'); $buf = New-Object byte[] 65536; $r = 1; while ($r -gt 0) { $r = $inf.Read($buf, 0, $buf.Length); if ($r -gt 0) { $cs.Write($buf, 0, $r); Tick-Bytes $r } }; $inf.Close(); $cs.Close(); $of.Close(); $a.Clear() }
          function Upload-Gofile($enc, $disp) {
            for ($a = 1; $a -le 4; $a++) {
              foreach ($ep in @('https://upload.gofile.io/uploadfile', 'https://store1.gofile.io/contents/uploadfile')) {
                try {
                  $raw = & curl.exe -sS --max-time 1800 -X POST $ep -F "file=@$enc;filename=$disp" 2>$null
                  $uj = $raw | ConvertFrom-Json -EA Stop
                  if ($uj.status -eq 'ok') { if ($uj.data.downloadPage) { return $uj.data.downloadPage }; if ($uj.data.code) { return "https://gofile.io/d/$($uj.data.code)" }; if ($uj.data.id) { return "https://gofile.io/d/$($uj.data.id)" } }
                  "gofile $ep status=$($uj.status)" | Out-File $env:GHRDP_LOG -Append
                } catch { "gofile $ep err $_" | Out-File $env:GHRDP_LOG -Append }
              }
              Start-Sleep (5 * $a)
            }
            return $null
          }
          function Load-Index($c) { if (Test-Path $c.idxFile) { try { return [Collections.ArrayList]@(Get-Content $c.idxFile -Raw | ConvertFrom-Json -EA Stop) } catch {} }; return (New-Object Collections.ArrayList) }
          function Save-Index($c, $i) { [IO.File]::WriteAllText($c.idxFile, ($i | ConvertTo-Json -Depth 5), (New-Object System.Text.UTF8Encoding $false)) }
          function Build-Index($c, $i) { $nodes = New-Object Collections.ArrayList; [void]$nodes.Add(@{ tag = 'h3'; children = @('GitHub RDP - mirrored files') }); [void]$nodes.Add(@{ tag = 'p'; children = @('AES-256 on gofile. Decrypt pw: ', $c.decPw) }); if ($i.Count -eq 0) { [void]$nodes.Add(@{ tag = 'p'; children = @('(none yet)') }) }; $n = 1; foreach ($it in $i) { $k = New-Object Collections.ArrayList; [void]$k.Add(("$n. " + $it.name + " [" + $it.status + "] " + $it.src + " ")); if ($it.gofile) { [void]$k.Add(@{ tag = 'a'; attrs = @{ href = $it.gofile }; children = @('gofile') }) }; [void]$nodes.Add(@{ tag = 'p'; children = $k }); $n++ }; return ($nodes | ConvertTo-Json -Depth 8 -Compress) }
          function Push-Index($c, $text) {
            if (-not $c.telegraphToken) { try { $a = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createAccount' -Body @{ short_name = 'ghrdp'; author_name = 'ghrdp' } -TimeoutSec 30; if ($a.ok) { $c.telegraphToken = $a.result.access_token } } catch { return $false } }
            if (-not $c.telegraphToken) { return $false }
            try { if (-not $c.telegraphPath) { $p = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createPage' -Body @{ access_token = $c.telegraphToken; title = 'GitHub RDP mirror'; content = $text; return_content = 'false' } -TimeoutSec 30; if ($p.ok) { $c.telegraphPath = $p.result.path; $c.rentryUrl = $p.result.url } } else { $p = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/editPage' -Body @{ access_token = $c.telegraphToken; path = $c.telegraphPath; title = 'GitHub RDP mirror'; content = $text; return_content = 'false' } -TimeoutSec 30; if ($p.ok) { $c.rentryUrl = $p.result.url } } } catch { return $false }
            Save-Cfg $c; return [bool]$c.rentryUrl
          }
          LIBEOF
      - name: Write watcher (real profile resolution)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'WATCHEOF'
          param([string]$CfgPath)
          $ErrorActionPreference = 'Continue'
          $progEarly = Join-Path (Split-Path $CfgPath -Parent) 'ghrdp_progress.json'
          $mtx = New-Object System.Threading.Mutex $true, 'Global\ghrdp-watcher-single', ([ref]$createdNew)
          if (-not $createdNew) { exit 0 }
          $cfg = $null
          try { $b = [IO.File]::ReadAllBytes($CfgPath); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; $cfg = ([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json -EA Stop } catch { throw }
          $env:GHRDP_CFG = $CfgPath; $env:GHRDP_LOG = $cfg.logFile
          . $cfg.libPath
          Init-Progress $cfg.progressPath
          function RealProf { $p = $env:USERPROFILE; try { $sid = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value; $pi = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid" -Name ProfileImagePath -EA 0).ProfileImagePath; if ($pi) { $pi = [Environment]::ExpandEnvironmentVariables($pi); if (Test-Path $pi) { $p = $pi } } } catch {}; return $p }
          $junk = @('.tmp', '.crdownload', '.partial', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak', '.!qb')
          $done = @{}; if (Test-Path $cfg.doneFile) { Get-Content $cfg.doneFile | ForEach-Object { $done[$_] = $true } }
          $idx = Load-Index $cfg
          try { Push-Index $cfg (Build-Index $cfg $idx) | Out-Null } catch {}
          function DoUpload($fi, $tag) {
            if ($done.ContainsKey($fi.FullName)) { return }
            $len = $fi.Length; $safe = $fi.Name -replace '\|', '_'; $disp = ($safe -replace '[^\x20-\x7E]', '_')
            $ex = $idx | Where-Object { $_.name -eq $safe -and $_.src -eq $tag } | Select-Object -First 1
            if (-not $ex) { $ex = @{ name = $safe; src = $tag; status = 'uploading'; payload = ''; gofile = ''; time = (Get-Date -f 'HH:mm:ss') }; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len; Save-Index $cfg $idx }
            $ex.status = 'uploading'
            $enc = Join-Path $cfg.tmpDir ('ge_' + [guid]::NewGuid().ToString('N') + '.enc')
            Set-Active $disp 'encrypt' $len
            try { Encrypt-File $fi.FullName $enc $cfg.decPw } catch {}
            Set-Active $disp 'upload' $len
            $gf = $null; try { $gf = Upload-Gofile $enc $disp } catch {}
            Remove-Item $enc -Force -EA SilentlyContinue
            if ($gf) { $ex.payload = B64U ($gf + '|' + $cfg.decPw + '|' + $safe); $ex.gofile = $gf; $ex.status = 'ok'; $done[$fi.FullName] = $true; $fi.FullName | Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Save-Index $cfg $idx; try { Push-Index $cfg (Build-Index $cfg $idx) | Out-Null } catch {} } else { $ex.status = 'limit'; Save-Index $cfg $idx }
            Set-Active '' 'idle' 0
          }
          function Scan($r) {
            if (-not (Test-Path $r.path)) { return }
            $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA SilentlyContinue } else { Get-ChildItem -LiteralPath $r.path -File -EA SilentlyContinue }
            foreach ($fi in $items) { if ($done.ContainsKey($fi.FullName)) { continue }; if ($junk -contains $fi.Extension.ToLower()) { continue }; if ($fi.Length -lt $r.min) { continue }; if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }; DoUpload $fi $r.tag }
          }
          function SyncProg { $p = $global:GHRDP_PROG; $d = 0; $u = 0; $f = 0; foreach ($it in $idx) { if ($it.status -eq 'ok') { $d++ } elseif ($it.status -eq 'limit') { $f++ } else { $u++ } }; $p.agg.done = $d; $p.agg.failed = $f; $p.agg.tracked = $idx.Count; $p.agg.active = if ($p.active.phase -ne 'idle') { 1 } else { 0 }; $p.agg.bytesTotal = $global:GHRDP_TOTAL_BYTES; $p.files = @(foreach ($it in $idx) { @{ name = $it.name; src = $it.src; status = $it.status } }); Flush-Progress $true }
          while ($true) {
            $prof = RealProf
            $roots = @( @{ path = (Join-Path $prof 'Downloads'); rec = $false; min = 0; tag = 'Downloads' }, @{ path = (Join-Path $prof 'AppData\Local\Temp'); rec = $true; min = 102400; tag = 'Temp' }, @{ path = (Join-Path $prof 'Desktop'); rec = $false; min = 0; tag = 'Desktop' } )
            if (Test-Path 'D:\RDP-Storage') { $roots += @{ path = 'D:\RDP-Storage'; rec = $true; min = 0; tag = 'D-Storage' } }
            foreach ($r in $roots) { try { Scan $r } catch {} }
            SyncProg
            try { $global:GHRDP_PROG.ts = (Get-Date -f o); $global:GHRDP_PROG.alive = $true; [IO.File]::WriteAllText($cfg.progressPath, ($global:GHRDP_PROG | ConvertTo-Json -Depth 6 -Compress), (New-Object System.Text.UTF8Encoding $false)) } catch {}
            Start-Sleep 3
          }
          WATCHEOF
      - name: Write dashboard server
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'SERVEREOF'
          function Start-GhrdpServer {
            param([int]$Port, [string]$BindAddress, [string]$UiDir, [string]$ProgressPath, [string]$CfgPath, [string]$EmergencyFlagPath, [string]$FlushFlagPath, [string]$OkFile, [int]$LimitMinutes = 330)
            $ErrorActionPreference = 'SilentlyContinue'
            $uiPath = Join-Path $UiDir 'ghrdp-ui.html'
            $uiBytes = if (Test-Path $uiPath) { [IO.File]::ReadAllBytes($uiPath) } else { [Text.Encoding]::UTF8.GetBytes('<h1>ui missing</h1>') }
            function ReadJsonSafe($p) { if (-not (Test-Path $p)) { return $null }; try { $fs = [IO.File]::Open($p, 'Open', 'Read', 'ReadWrite'); $ms = New-Object IO.MemoryStream; $fs.CopyTo($ms); $fs.Close(); $b = $ms.ToArray(); $ms.Close(); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; return ([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json -EA Stop } catch { return $null } }
            function WriteResp($s, $code, $ct, $bb) { $st = if ($code -eq 200) { 'OK' } else { 'ERR' }; $h = "HTTP/1.1 $code $st`r`nContent-Type: $ct`r`nContent-Length: $($bb.Length)`r`nConnection: close`r`nCache-Control: no-store`r`nAccess-Control-Allow-Origin: *`r`n`r`n"; $hb = [Text.Encoding]::ASCII.GetBytes($h); $s.Write($hb, 0, $hb.Length); if ($bb.Length -gt 0) { $s.Write($bb, 0, $bb.Length) }; $s.Flush() }
            $ipObj = [Net.IPAddress]::Parse($BindAddress); $listener = New-Object Net.Sockets.TcpListener $ipObj, $Port
            try { $listener.Start() } catch { Set-Content $OkFile ("LISTEN_FAIL $_") -Encoding ascii; throw }
            Set-Content $OkFile "LISTENING" -Encoding ascii
            $start = Get-Date; $limit = New-TimeSpan -Minutes $LimitMinutes
            while (((Get-Date) - $start) -lt $limit) {
              if (Test-Path $FlushFlagPath) { Remove-Item $FlushFlagPath -Force -EA SilentlyContinue }
              while ($listener.Pending()) {
                $c = $null; try { $c = $listener.AcceptTcpClient() } catch {}
                if ($c) {
                  try {
                    $stream = $c.GetStream(); $stream.ReadTimeout = 5000
                    $acc = New-Object Text.StringBuilder; $buf = New-Object byte[] 4096
                    while ($true) { $n = 0; try { $n = $stream.Read($buf, 0, $buf.Length) } catch { break }; if ($n -le 0) { break }; [void]$acc.Append([Text.Encoding]::ASCII.GetString($buf, 0, $n)); if ($acc.ToString().Contains("`r`n`r`n")) { break }; if ($acc.Length -gt 16384) { break } }
                    $req = $acc.ToString(); $path = '/'; if ($req -match '(?m)^GET\s+(\S+)') { $path = ($Matches[1] -split '\?')[0] }
                    $loop = $false; try { $loop = $c.Client.RemoteEndPoint.Address.IsLoopback } catch {}
                    $cfg = ReadJsonSafe $CfgPath
                    if ($path -eq '/emergency') { Set-Content $EmergencyFlagPath (Get-Date -f o) -Encoding ascii; WriteResp $stream 200 'application/json' ([Text.Encoding]::UTF8.GetBytes('{"ok":true}')) }
                    elseif ($path -eq '/progress') { $prog = ReadJsonSafe $ProgressPath; if (-not $prog) { $prog = @{ alive = $false } }; $obj = @{ ts = (Get-Date -f o); viaLoopback = $loop; ghrdp = $(if ($cfg) { $cfg.ghrdp } else { '' }); rentry = $(if ($cfg) { $cfg.rentryUrl } else { '' }); mirror = $(if ($cfg) { [bool]$cfg.mirror } else { $false }); creds = @{ ip = $(if ($cfg) { $cfg.rdpIp } else { '' }); user = $(if ($cfg) { $cfg.rdpUser } else { '' }); pass = $(if ($cfg) { $cfg.rdpPass } else { '' }) }; ts = $prog.ts; alive = $prog.alive; active = $prog.active; agg = $prog.agg; files = $prog.files; log = $prog.log }; WriteResp $stream 200 'application/json' ([Text.Encoding]::UTF8.GetBytes(($obj | ConvertTo-Json -Depth 8 -Compress))) }
                    else { $html = [Text.Encoding]::UTF8.GetString($uiBytes); $html = $html.Replace('__IP__', $(if ($cfg) { $cfg.rdpIp } else { '' })).Replace('__USER__', $(if ($cfg) { $cfg.rdpUser } else { '' })).Replace('__PASS__', $(if ($cfg) { $cfg.rdpPass } else { '' })).Replace('__GHRDP__', $(if ($cfg) { $cfg.ghrdp } else { '' })).Replace('__STATIC__', $(if ($loop) { '0' } else { '1' })); WriteResp $stream 200 'text/html; charset=utf-8' ([Text.Encoding]::UTF8.GetBytes($html)) }
                  } catch {}
                  try { $c.Close() } catch {}
                }
              }
              Start-Sleep -Milliseconds 200
            }
            try { $listener.Stop() } catch {}
          }
          SERVEREOF
      - name: Write dashboard UI
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-ui.html" <<'UIEOF'
          <!doctype html><html><head><meta charset="utf-8"><meta id="ghrdpStatic" content="__STATIC__"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDP Mission Control</title>
          <style>body{font-family:Segoe UI,system-ui,sans-serif;background:#0a0e12;color:#e9eef3;margin:0;padding:24px}h1{margin:0 0 8px}.sub{color:#8aa0ad;margin-bottom:20px}.panel{background:#11171d;border:1px solid #223039;border-radius:14px;padding:18px;margin:0 0 16px}code{background:#070b0e;border:1px solid #223039;border-radius:8px;padding:6px 8px;display:inline-block;min-width:120px}a.button,button{display:inline-block;background:#37c6b0;color:#04201c;font-weight:700;border:0;border-radius:10px;padding:12px 18px;text-decoration:none;cursor:pointer;margin:6px 6px 0 0}button.warn{background:#f0a830;color:#231600}pre{background:#070b0e;border:1px solid #223039;border-radius:10px;padding:12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.big{font-size:56px;font-weight:800}#mirrorBox{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body>
          <h1>RDP Mission Control</h1><div class="sub" id="mode">checking…</div>
          <div class="panel"><div><b>IP</b> <code id="vIp">__IP__</code></div><div style="margin-top:8px"><b>USER</b> <code id="vUser">__USER__</code></div><div style="margin-top:8px"><b>PASS</b> <code id="vPass">__PASS__</code></div><div style="margin-top:14px"><a id="rdp" class="button" href="__GHRDP__">Open Remote Desktop</a><button id="diagBtn">Diagnose</button></div><div style="margin-top:12px;font-size:12px;color:#8aa0ad;word-break:break-all">ghrdp: <a id="ghrdpLink" href="__GHRDP__" style="color:#37c6b0">__GHRDP__</a></div></div>
          <div class="grid"><div class="panel"><div class="sub">Overall uploaded</div><div class="big"><span id="pct">0</span>%</div><div style="margin-top:10px;color:#8aa0ad">done <b id="cDone">0</b> | active <b id="cAct">0</b> | failed <b id="cFail">0</b> | tracked <b id="cTrk">0</b></div><div id="mirrorBox" style="margin-top:14px"><button class="warn" id="emBtn">Upload everything now</button><div id="banner" style="margin-top:10px;font-weight:700"></div></div></div><div class="panel"><div class="sub">Live log</div><pre id="log">waiting…</pre><div id="rentry" style="margin-top:10px;font-size:12px;color:#8aa0ad;display:none"></div></div></div>
          <div class="panel"><div class="sub">Diagnostics</div><pre id="diagOut" style="display:none"></pre></div>
          <script>
          function fb(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB';}
          function setCreds(c){if(!c)return;document.getElementById('vIp').textContent=c.ip||'-';document.getElementById('vUser').textContent=c.user||'-';document.getElementById('vPass').textContent=c.pass||'-';}
          function setGhrdp(u){var a=document.getElementById('ghrdpLink');var r=document.getElementById('rdp');var ok=!!u&&u.indexOf('ghrdp://')===0&&u.length>10;a.href=ok?u:'#';a.textContent=u||'ghrdp://…';if(r&&ok)r.href=u;}
          function render(s){if(!s)return;var now=Date.now();var ts=s.ts?new Date(s.ts).getTime():0;var age=ts?Math.round((now-ts)/1000):999;var on=!s.mirror||(s.alive&&age<15);document.getElementById('mode').textContent=(s.viaLoopback?'Inside RDP':'Local PC')+' | watcher '+(on?'online':'stale')+' | age '+age+'s';if(s.ghrdp)setGhrdp(s.ghrdp);if(s.creds)setCreds(s.creds);if(s.rentry){var r=document.getElementById('rentry');r.style.display='block';r.textContent='index: '+s.rentry;}document.getElementById('mirrorBox').style.display=s.mirror?'block':'none';var a=s.agg||{};document.getElementById('pct').textContent=a.overallPct||0;document.getElementById('cDone').textContent=a.done||0;document.getElementById('cAct').textContent=a.active||0;document.getElementById('cFail').textContent=a.failed||0;document.getElementById('cTrk').textContent=a.tracked||0;var lg=s.log||[];if(lg.length)document.getElementById('log').textContent=lg.join('\n');var bn=document.getElementById('banner');bn.textContent='';if(s.mirror){if((a.failed||0)>0&&(a.active||0)===0)bn.textContent=(a.failed)+' failed';else if((a.tracked||0)>0&&(a.active||0)===0&&(a.failed||0)===0&&(a.done||0)>0)bn.textContent='ALL UPLOADED - safe to Cancel now.';}}
          function poll(){fetch('/progress'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){});}
          document.getElementById('diagBtn').addEventListener('click',function(){var o=document.getElementById('diagOut');o.style.display='block';o.textContent='running…';fetch('/diag'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){o.textContent=JSON.stringify(d,null,2);}).catch(function(e){o.textContent='diag failed: '+e;});});
          document.getElementById('emBtn').addEventListener('click',function(){var b=this;b.disabled=true;b.textContent='triggered…';fetch('/emergency'+(location.search||''),{cache:'no-store'}).then(function(){setTimeout(function(){b.disabled=false;b.textContent='Upload everything now';},1500);}).catch(function(){b.disabled=false;b.textContent='Upload everything now';});});
          var STATIC=(document.getElementById('ghrdpStatic')||{}).content==='1';if(!STATIC){poll();setInterval(poll,1500);}
          </script></body></html>
          UIEOF
      - name: Write launcher + installer + summary + debug
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-launcher.ps1" <<'LAUNCHEOF'
          param([string]$CfgPath, [int]$Port = 7331)
          $sd = Split-Path $CfgPath -Parent; $ws = Join-Path $sd 'ghrdp-watcher.ps1'; $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          $cfg = Get-Content $CfgPath -Raw -EA SilentlyContinue | ConvertFrom-Json -EA SilentlyContinue
          try { Start-Process ("http://127.0.0.1:$Port/") | Out-Null } catch {}
          $wr = Get-CimInstance Win32_Process -EA SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }
          if (-not $wr -and (Test-Path $ws)) { Start-Process $ps -ArgumentList "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$ws`" -CfgPath `"$CfgPath`"" -WindowStyle Hidden | Out-Null }
          while ($true) { Start-Sleep 5 }
          LAUNCHEOF
          cat > "$RUNNER_TEMP/ghrdp-install.ps1" <<'INSTALLEOF'
          param([string]$url)
          if ($url -match '^ghrdp://([^/]+)/([^/]+)/(.+)$') { $ip = $Matches[1]; $u = [uri]::UnescapeDataString($Matches[2]); $p = [uri]::UnescapeDataString($Matches[3]); cmdkey /generic:TERMSRV/$ip /user:$u /pass:$p | Out-Null; Start-Process "$env:windir\System32\mstsc.exe" "/v:$ip" }
          INSTALLEOF
          cat > "$RUNNER_TEMP/ghrdp-summary.ps1" <<'SUMMARYEOF'
          param([string]$CfgPath)
          if (-not (Test-Path $CfgPath)) { return }
          $c = Get-Content $CfgPath -Raw -EA SilentlyContinue | ConvertFrom-Json -EA SilentlyContinue
          $S = $env:GITHUB_STEP_SUMMARY
          "### RDP ready" >> $S; "" >> $S
          if ($c.funnelUrl) { "**[>>> OPEN WEB-APP <<<]$($c.funnelUrl)**" >> $S; "" >> $S }
          "Paste locally:" >> $S; '```' >> $S; $c.ghrdp >> $S; '```' >> $S; "" >> $S
          ("IP " + $c.rdpIp + " / " + $c.rdpUser + " / " + $c.rdpPass) >> $S
          SUMMARYEOF
      - name: Configure theme + apps + shortcuts + watcher startup
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $mPers = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'; if (-not (Test-Path $mPers)) { New-Item $mPers -Force | Out-Null }
          New-ItemProperty $mPers AppsUseLightTheme 0 -Type DWord -Force | Out-Null; New-ItemProperty $mPers SystemUsesLightTheme 0 -Type DWord -Force | Out-Null
          $sd = $env:RUNNER_TEMP; $cfgPath = Join-Path $sd 'ghrdp_cfg.json'; $launcher = Join-Path $sd 'ghrdp-launcher.ps1'; $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"; $user = $env:RDP_USER
          foreach ($desk in @("C:\Users\Public\Desktop", "C:\Users\$user\Desktop")) { try { New-Item -ItemType Directory $desk -Force -EA SilentlyContinue | Out-Null; $ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut((Join-Path $desk 'Mission Control.lnk')); $sc.TargetPath = $ps; $sc.Arguments = "-NoExit -ExecutionPolicy Bypass -File `"$launcher`" -CfgPath `"$cfgPath`""; $sc.Save() } catch {} }
          if ($env:MIRROR -eq 'true') { $ws2 = Join-Path $sd 'ghrdp-watcher.ps1'; $su = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'; try { $w = New-Object -ComObject WScript.Shell; $s2 = $w.CreateShortcut((Join-Path $su 'ghrdp-watcher.lnk')); $s2.TargetPath = $ps; $s2.Arguments = "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$ws2`" -CfgPath `"$cfgPath`""; $s2.Save() } catch {}; & icacls.exe $sd /grant "${user}:(OI)(CI)M" 2>$null | Out-Null; $LASTEXITCODE = 0 }
          exit 0
      - name: Prepare config
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $ip = (& $ts ip -4).Trim(); $user = $env:RDP_USER; $pass = $env:RDP_PASS
          $ghrdp = "ghrdp://$ip/" + [uri]::EscapeDataString($user) + "/" + [uri]::EscapeDataString($pass)
          $sd = $env:RUNNER_TEMP
          New-Item -ItemType Directory (Join-Path $sd 'ghrdp_tmp') -Force | Out-Null
          $mirrorOn = ($env:MIRROR -eq 'true')
          $dashToken = $env:DASH_TOKEN
          $serveUrl = $env:SERVE_URL
          $rng2 = [Security.Cryptography.RandomNumberGenerator]::Create(); $alpha2 = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b2 = [byte[]]::new(20); $rng2.GetBytes($b2); $decPw = -join ($b2 | ForEach-Object { $alpha2[[int]$_ % $alpha2.Length] })
          $cfg = @{ rdpIp = $ip; rdpUser = $user; rdpPass = $pass; ghrdp = $ghrdp; mirror = $mirrorOn; rentryUrl = ''; telegraphToken = ''; telegraphPath = ''; decPw = $decPw; dashToken = $dashToken; funnelUrl = $serveUrl; idxFile = (Join-Path $sd 'ghrdp_mirror_index.json'); doneFile = (Join-Path $sd 'ghrdp_uploaded.txt'); logFile = (Join-Path $sd 'ghrdp_mirror.log'); flushFlag = (Join-Path $sd 'ghrdp_flush.flag'); cfgPath = (Join-Path $sd 'ghrdp_cfg.json'); libPath = (Join-Path $sd 'ghrdp-lib.ps1'); emergencyFlag = (Join-Path $sd 'ghrdp_emergency.flag'); progressPath = (Join-Path $sd 'ghrdp_progress.json'); tmpDir = (Join-Path $sd 'ghrdp_tmp') }
          [IO.File]::WriteAllText((Join-Path $sd 'ghrdp_cfg.json'), ($cfg | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false))
          New-Item -ItemType Directory 'C:\ProgramData\ghrdp' -Force -EA SilentlyContinue | Out-Null
          Set-Content 'C:\ProgramData\ghrdp\cfgpath.txt' (Join-Path $sd 'ghrdp_cfg.json') -Encoding ASCII -EA SilentlyContinue
          & (Join-Path $sd 'ghrdp-summary.ps1') (Join-Path $sd 'ghrdp_cfg.json')
      - name: Keep Alive (5h30)
        shell: pwsh
        run: |
          $sd = $env:RUNNER_TEMP; $cfgPath = Join-Path $sd 'ghrdp_cfg.json'; $serverScript = Join-Path $sd 'rdp-redirect-server.ps1'; $okFile = Join-Path $sd 'ghrdp_server_ok.txt'
          Remove-Item $okFile -Force -EA SilentlyContinue
          $srvRun = Join-Path $sd 'ghrdp-server-run.ps1'
          $tpl = ". '$serverScript'`r`nStart-GhrdpServer -Port 7331 -BindAddress '0.0.0.0' -UiDir '$sd' -ProgressPath '$(Join-Path $sd 'ghrdp_progress.json')' -CfgPath '$cfgPath' -EmergencyFlagPath '$(Join-Path $sd 'ghrdp_emergency.flag')' -FlushFlagPath '$(Join-Path $sd 'ghrdp_flush.flag')' -OkFile '$okFile' -LimitMinutes 330`r`n"
          [IO.File]::WriteAllText($srvRun, $tpl, (New-Object System.Text.UTF8Encoding $false))
          foreach ($f in @($cfgPath, $serverScript, (Join-Path $sd 'ghrdp-lib.ps1'), (Join-Path $sd 'ghrdp-ui.html'), (Join-Path $sd 'ghrdp-install.ps1'), $srvRun)) { if (Test-Path $f) { & icacls.exe $f /grant "*S-1-5-18:(R)" 2>$null | Out-Null } }
          $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          & schtasks /Create /TN ghrdpserver /TR "`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$srvRun`"" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F 2>$null | Out-Null; $LASTEXITCODE = 0
          & schtasks /Run /TN ghrdpserver 2>$null | Out-Null; $LASTEXITCODE = 0
          $limit = New-TimeSpan -Hours 5 -Minutes 30; $start = Get-Date
          while (((Get-Date) - $start) -lt $limit) { Start-Sleep 60 }
      - name: Emergency upload on cancel
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        shell: pwsh
        run: |
          $sd = $env:RUNNER_TEMP; $cfgPath = Join-Path $sd 'ghrdp_cfg.json'; $lib = Join-Path $sd 'ghrdp-lib.ps1'
          if (-not ((Test-Path $cfgPath) -and (Test-Path $lib))) { exit 0 }
          Set-Content (Join-Path $sd 'ghrdp_emergency.flag') (Get-Date -f o) -Encoding ascii
          Start-Sleep 20
          $env:GHRDP_CFG = $cfgPath; . $lib; $cfg = Read-Cfg; $env:GHRDP_LOG = $cfg.logFile; Init-Progress $cfg.progressPath
          $prof = $env:USERPROFILE
          $roots = @( @{ path = (Join-Path $prof 'Downloads'); rec = $false; min = 0 }, @{ path = 'D:\RDP-Storage'; rec = $true; min = 0 } )
          $idx = Load-Index $cfg
          foreach ($r in $roots) { if (-not (Test-Path $r.path)) { continue }; $items = Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA SilentlyContinue | Sort-Object Length -Descending; foreach ($fi in $items) { if ($fi.Length -lt $r.min) { continue }; $enc = Join-Path $cfg.tmpDir ('em_' + [guid]::NewGuid().ToString('N') + '.enc'); try { Encrypt-File $fi.FullName $enc $cfg.decPw; $gf = Upload-Gofile $enc ($fi.Name); if ($gf) { Write-Host "OK $($fi.Name) -> $gf" } } catch {}; Remove-Item $enc -Force -EA SilentlyContinue } }
      - name: Secure Cleanup
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          & schtasks /Delete /TN ghrdpserver /F 2>$null | Out-Null; $LASTEXITCODE = 0
          foreach ($p in @('chrome', 'msedge', 'firefox', 'qbittorrent')) { Get-Process -Name $p -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue }
          foreach ($p in @("$env:LOCALAPPDATA\Google\Chrome\User Data", "$env:LOCALAPPDATA\Microsoft\Edge\User Data", "$env:APPDATA\Mozilla\Firefox\Profiles")) { if (Test-Path $p) { Remove-Item $p -Recurse -Force -EA SilentlyContinue } }
          if (Test-Path 'D:\RDP-Storage') { Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -EA SilentlyContinue }
          Clear-RecycleBin -Force -EA SilentlyContinue
          wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null }; $LASTEXITCODE = 0
          "### Cleanup complete" >> $env:GITHUB_STEP_SUMMARY
