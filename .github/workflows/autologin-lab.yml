          if ($tickJson.PSObject.Properties['probeError'] -and $tickJson.probeError) { Write-Host ('[X] (e2) collector probeError on this host (named, never silent): ' + $tickJson.probeError) }
          # the shipped renderer maps that fixture into the SERVER CONN LOG row
          Push-Location $ws
          try { $nodeOut = (@(& node --test tests/f30-tls-cipher.test.js 2>&1) | Out-String); $nodeRc = $LASTEXITCODE } finally { Pop-Location }
          if ($nodeRc -ne 0 -or $nodeOut -notmatch '# fail 0') { X-Fail 'node-matrix' ('the F30 node matrix failed: ' + ($nodeOut.Substring([Math]::Max(0, $nodeOut.Length - 600)))) }
          if ($nodeOut -notmatch 'F30-11') { X-Fail 'node-matrix' 'the lab fixture cell never ran' }
          Write-Host '[X] (e) PASS: synthetic RDP Operational events => reason codes (tls-forcibly-closed / auth-succeeded / cert-rejected / connection-reset), credential-shaped text redacted, newest-3 mapped into the SERVER CONN LOG row by the SHIPPED renderer'
          # hygiene: restore this runner's original Schannel priority list (the
          # backup file is the proof the backup path works).
          try {
              if (Test-Path -LiteralPath $backupPath) {
