name: launch-gates
on:
  pull_request:
  push:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: D/E launch gates
        shell: bash
        run: |
          set -euo pipefail
          if grep -E -n 'powershell|-ExecutionPolicy' payloads/ui.html; then
            echo 'ui.html still contains a script-host launch' >&2
            exit 1
          fi
          if grep -E -n 'dnsName = \$ip|dnsName = \[string\]\$ip' .github/workflows/main.yml; then
            echo 'dnsName assigned from an IP' >&2
            exit 1
          fi
          if grep -E -n 'fqdnN = \[string\]\$cfgN.rdpIp|rdpTarget = \[string\]\$cfgC.rdpIp' payloads/ghrdp-server.ps1; then
            echo 'native target still falls back to rdpIp' >&2
            exit 1
          fi
          grep -q 'hostKind = $hostKind' payloads/ghrdp-server.ps1
          grep -q "hostKind = 'ephemeral'" .github/workflows/main.yml
          if grep -E -n 'RUN SETUP|RUN INSTALL' payloads/ui.html; then
            echo 'ui.html still references RUN SETUP / RUN INSTALL buttons' >&2
            exit 1
          fi
          if grep -E -n "reasons \+= 'handler-not-seen'|handler-not-seen'" payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 still builds a handler-hello reason' >&2
            exit 1
          fi
      - name: F10 PS-free launch / gated creds / bookmark gates
        shell: bash
        run: |
          set -euo pipefail
          # §1.3 launch-gate: no script-host launch anywhere in the page or the
          # new launcher assets.
          if grep -E -n 'powershell|-ExecutionPolicy' payloads/ui.html payloads/ghrdp-rdp-launcher.cs payloads/install.cmd; then
            echo 'F10: script-host launch token found' >&2; exit 1
          fi
          # §1 install.cmd: in-box csc + HKCU ghrdp registration, nothing else.
          grep -q 'Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe' payloads/install.cmd
          grep -q 'HKCU\\Software\\Classes\\ghrdp' payloads/install.cmd
          # §1.2 .rdp directive contract (+ no password/hash lines, no resolution pins).
          for d in 'screen mode id:i:2' 'redirectclipboard:i:1' 'redirectprinters:i:1' 'redirectdrives:i:1' 'drivestoredirect:s:*' 'devicestoredirect:s:*' 'redirectcomports:i:1' 'redirectsmartcards:i:1' 'redirectposdevices:i:1' 'audiocapturemode:i:1' 'bandwidthautodetect:i:1' 'compression:i:1'; do
            grep -qF "$d" payloads/ghrdp-rdp-launcher.cs || { echo "F10: missing rdp directive $d" >&2; exit 1; }
          done
          # (comments legitimately NAME the omitted directives - strip them)
          if grep -v '^[[:space:]]*//' payloads/ghrdp-rdp-launcher.cs | grep -E -n 'password 51|desktopwidth|desktopheight|prompt for credentials'; then
            echo 'F10: launcher writes a forbidden .rdp line' >&2; exit 1
          fi
          # §3 creds: served ONLY at the /api/config creds-block write site,
          # gated by Test-CredsAllowed (token or tailnet source).
          grep -q 'function Test-CredsAllowed' payloads/ghrdp-server.ps1
          test "$(grep -c 'credsAllowed' payloads/ghrdp-server.ps1)" -ge 3
          test "$(grep -cn 'windowsPass' payloads/ghrdp-server.ps1)" -eq 2
          # §2 server fields + ping loop + client-peer capture.
          grep -q 'rdpLogonAgeSec' payloads/ghrdp-server.ps1
          grep -q 'pingPath' payloads/ghrdp-server.ps1
          grep -q 'dash-client-ip.txt' payloads/ghrdp-server.ps1
          grep -q 'LogonType=10' payloads/ghrdp-server.ps1
          grep -q 'rdpLogonAgeSec' payloads/ui.html
          grep -q 'UDP 41641' payloads/ui.html
          grep -q 'compression=6' payloads/ui.html
          grep -q 'credWinPass' payloads/ui.html
          # §2.3 latency keys in the webdesk step.
          grep -q 'PollUnderCursor' .github/workflows/main.yml
          grep -q 'CompareFB' .github/workflows/main.yml
          # §4.2 gate: no piracy-index bookmark strings anywhere in main.yml.
          # [F11-5.2] narrowed: the plain qBittorrent app is allowed, piracy
          # INDEX strings/URLs and torrent bookmarks stay banned.
          if grep -E -i -n 'fmhy|megathread|1337x|thepiratebay|pirate ?bay|rarbg|torrentz|kickass' .github/workflows/main.yml; then
            echo 'F10/F11: piracy-index string in main.yml' >&2; exit 1
          fi
          if grep -nE "name = '[^']*[Tt]orrent[^']*'" .github/workflows/main.yml; then
            echo 'F11: a torrent bookmark reappeared' >&2; exit 1
          fi
          grep -q 'ExtensionInstallForcelist' .github/workflows/main.yml
          # F10-11: ONE live resolver, dot-sourced by both the provisioning
          # workflow and the proof lane, with no literal 32-char id in the repo
          # (a hardcoded id is exactly what §4.1 forbids).
          grep -q 'edge-ext-resolve.ps1' .github/workflows/main.yml
          grep -q 'edge-ext-resolve.ps1' .github/workflows/autologin-lab.yml
          grep -q 'Resolve-StoreExtId' .github/workflows/main.yml
          test -f payloads/edge-ext-resolve.ps1
          grep -q 'Get-ExtForceListValue' payloads/edge-ext-resolve.ps1
          if grep -nE '[a-p]{32}' payloads/edge-ext-resolve.ps1; then
            echo 'F10: literal extension id in the resolver (must be discovered live)' >&2; exit 1
          fi
          if grep -nE '[a-p]{32}' .github/workflows/main.yml; then
            echo 'F10: literal extension id in main.yml' >&2; exit 1
          fi
          grep -q 'login.tailscale.com/admin/dns' .github/workflows/main.yml
          grep -q 'docs/AUTOLOGIN.md' .github/workflows/main.yml
          # F10-9: the lab harness must never block on the mstsc descendant
          # (Start-Process -Wait wedged proof step B/C in run 36147990362).
          if grep -q -- '-PassThru -Wait' .github/workflows/autologin-lab.yml; then
            echo 'F10: lab harness waits on the mstsc descendant (wedges the runner)' >&2; exit 1
          fi
          grep -q 'WaitForExit(90000)' .github/workflows/autologin-lab.yml
          grep -q 'mstsc reaped' .github/workflows/autologin-lab.yml
          # F10-10: the launcher beacon is bounded (never a wedge).
          grep -q 'HelloBounded' payloads/ghrdp-rdp-launcher.cs
          # §5 setup caches present.
          grep -q 'actions/cache@v4' .github/workflows/main.yml
          echo 'F10 gates PASS'
      - name: F11-2 VNC password memory gates (shim + postMessage, no URL creds)
        shell: bash
        run: |
          set -euo pipefail
          shim=payloads/ghrdp-cred-shim.js
          test -f "$shim"
          # §2.1 shim: opener + exact-origin gate, auto-submit, purge.
          grep -q "type !== 'ghrdp-vnc-pass'" "$shim"
          grep -q 'ev.source !== window.opener' "$shim"
          grep -q 'originAllowed(ev.origin)' "$shim"
          grep -q 'sendCredentials' "$shim"
          grep -q 'noVNC_password_input' "$shim"
          grep -q 'noVNC_credentials_dialog' "$shim"
          grep -q 'pending = null' "$shim"
          grep -q 'window.opener = null' "$shim"
          grep -q 'ghrdp-cred-origin' "$shim"
          # §2.2 never logs/echoes the value: no console/log/alert/document.title.
          if grep -vE '^[[:space:]]*(/\*|\*|//)' "$shim" | grep -nE 'console\.|alert\(|document\.title|innerHTML'; then
            echo 'F11-2: the shim must never log or echo the VNC password' >&2
            exit 1
          fi
          # §2 deploy: the shim is copied INTO the served noVNC copy and the
          # script tag + exact origin meta are injected, idempotently.
          grep -q "payloads\\\\ghrdp-cred-shim.js" .github/workflows/main.yml
          grep -q 'ghrdp-cred-shim.js' .github/workflows/main.yml
          grep -qF 'meta name="ghrdp-cred-origin"' .github/workflows/main.yml
          grep -q "http://' + \$rdpIp + ':7331'" .github/workflows/main.yml
          # §2.3 dashboard: localStorage memory + postMessage with EXACT
          # targetOrigin; the launch URL itself must never carry a password.
          grep -q 'ghrdp.vncPass' payloads/ui.html
          grep -q 'ghrdp-vnc-pass' payloads/ui.html
          grep -q 'origin=new URL(url).origin' payloads/ui.html
          grep -q "w.postMessage({type:'ghrdp-vnc-pass',pass:pass},origin)" payloads/ui.html
          grep -q 'targetOrigin' payloads/ui.html
          if grep -nE "vnc\.html[^\"']*(password|pass)=|(password|pass)=[^\"']*vnc\.html" payloads/ui.html .github/workflows/main.yml; then
            echo 'F11-2: a noVNC launch URL carries a credential parameter' >&2
            exit 1
          fi
          # The dashboard must NOT use rel/noopener for the webdesk launch (the
          # shim authenticates window.opener), and the shim must drop the opener.
          if grep -nE "window\.open\(openUrl,'_blank','noopener'\)" payloads/ui.html; then
            echo 'F11-2: webdesk launch must keep window.opener for the shim handoff' >&2
            exit 1
          fi
          echo 'F11-2 gates PASS'
      - name: F11-3 RDP usage timer gates (accumulator, freeze, persistence)
        shell: bash
        run: |
          set -euo pipefail
          srv=payloads/ghrdp-server.ps1
          grep -q 'rdp-usage.ps1' "$srv"
          grep -q 'rdp-usage.json' "$srv"
          grep -q 'Test-RdpConnected' "$srv"
          grep -q 'Test-WebdeskClient' "$srv"
          grep -q 'qwinsta.exe' "$srv"
          grep -q 'ws-clients.txt' "$srv"
          grep -q 'websockify.log' "$srv"
          grep -q '\$sec = \$sec + 5' "$srv"
          grep -q 'Start-Sleep -Seconds 5' "$srv"
          # accumulator persists into config.json on stop + every 30s while live
          grep -q "rdpUsageSec', \$sec" "$srv"
          grep -q 'rdpUsageHost' "$srv"
          grep -q 'rdpUsageActive' "$srv"
          grep -q 'rdpUsageSec = \$carryUsage' .github/workflows/main.yml
          grep -q 'rdpUsageSec carried forward' .github/workflows/main.yml
          # UI headline is RDP USAGE (logon age kept only as a fallback)
          grep -q 'RDP USAGE' payloads/ui.html
          grep -q 'id="timerRdpUsage"' payloads/ui.html
          grep -q 'window.__rdpUsage' payloads/ui.html
          grep -q 'window.__rdpLogon' payloads/ui.html
          echo 'F11-3 gates PASS'
      - name: F11-4 connectivity gates (15s ping loop, direct/relay, compression=6)
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'tailscale ping -c 1 -timeout 3s' payloads/ghrdp-server.ps1
          grep -q 'Start-Sleep -Seconds 15' payloads/ghrdp-server.ps1
          grep -q "path = 'relay'" payloads/ghrdp-server.ps1
          grep -q "path = 'direct'" payloads/ghrdp-server.ps1
          grep -q 'pingMs' payloads/ghrdp-server.ps1
          grep -q 'pingPath' payloads/ui.html
          grep -q 'UDP 41641' payloads/ui.html
          grep -q 'srv .*ms' payloads/ui.html
          grep -q 'connFps' payloads/ui.html
          grep -q 'wire.rtt' payloads/ui.html
          grep -q 'compression=6' payloads/ui.html
          grep -q 'PollUnderCursor' .github/workflows/main.yml
          grep -q 'CompareFB' .github/workflows/main.yml
          echo 'F11-4 gates PASS'
      - name: F11-5/6 provisioning + setup-time gates (hidden helpers, no mirror)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          # §5.3 every host-helper launch is hidden (or NoNewWindow for the
          # user-driven terminal exec / msiexec probes): no bare Start-Process.
          if grep -n 'Start-Process' "$wf" | grep -v '^\s*[0-9]*:\s*#' | grep -vE 'WindowStyle Hidden|NoNewWindow'; then
            echo 'F11-5.3: a host-helper launch lacks the hidden/SYSTEM form' >&2
            exit 1
          fi
          # background loops in the server always launch hidden
          for helper in wire-probe.ps1 rdp-ping.ps1 rdp-usage.ps1; do
            grep -q "'-File',(Join-Path \$Root '$helper') -WindowStyle Hidden" payloads/ghrdp-server.ps1 || {
              echo "F11-5.3: $helper is not launched hidden" >&2; exit 1; }
          done
          # SYSTEM scheduled tasks for the long-lived services (dashboard,
          # rust dash) + hidden background helpers in the server itself.
          grep -q "UserId 'SYSTEM'" "$wf"
          grep -q "LogonType ServiceAccount" "$wf"
          if grep -n 'Start-Process' payloads/ghrdp-server.ps1 | grep -v 'NoNewWindow' | grep -v 'WindowStyle Hidden'; then
            echo 'F11-5.3: a server-launched helper lacks the hidden form' >&2
            exit 1
          fi
          # §5.2 qBittorrent is a plain cached app and NEVER wired to a mirror.
          grep -q 'qBittorrent.qBittorrent' "$wf"
          grep -q 'winget download --id qBittorrent.qBittorrent' "$wf"
          grep -q 'cache\\qbittorrent' "$wf"
          if grep -nE 'qBittorrent[^\n]*(Web UI|webui|--webui|8080)' "$wf"; then
            echo 'F11-5.2: qBittorrent must stay a plain app (no Web UI wiring)' >&2
            exit 1
          fi
          # Mirror stays OFF: MIRROR_INPUT only ever compared to 'true', no
          # mirror input in workflow_dispatch, no reintroduced publish step.
          grep -q "MIRROR_INPUT -eq 'true'" "$wf"
          if grep -nE "MIRROR_INPUT'? *(-ne|-eq) *'?(true|false)'?" "$wf" | grep -v "MIRROR_INPUT -eq 'true'"; then
            echo 'F11-5.2: mirror default must stay OFF (only -eq true)' >&2
            exit 1
          fi
          if awk '/^on:/{f=1} /^permissions:/{f=0} f' "$wf" | grep -qE '^\s+mirror:'; then
            echo 'F11-5.2: a mirror dispatch input reappeared' >&2
            exit 1
          fi
          if grep -nE '^\s*Publish-AllIndexes' "$wf" | grep -v 'try {'; then
            echo 'F11-5.2: a mirror publish step reappeared outside the disabled path' >&2
            exit 1
          fi
          # §6 setup-time report + merged start/cache step + event wait.
          grep -q 'Setup time report (F11-6)' "$wf"
          grep -q 'provisioning finished in' "$wf"
          grep -q 'Record job start + pre-create cache directories' "$wf"
          grep -q 'service registered=' "$wf"
          echo 'F11-5/6 gates PASS'
      - name: F8 web-desktop honesty gates
        shell: bash
        run: |
          set -euo pipefail
          # UI must not claim ready without a webdeskUrl: every non-comment
          # 'WEB DESKTOP ready' line must reference webdeskUrl on the same line.
          if grep -n 'WEB DESKTOP ready' payloads/ui.html | grep -v '^[0-9]*:[[:space:]]*//' | grep -v 'webdeskUrl'; then
            echo 'ui.html can claim WEB DESKTOP ready without webdeskUrl' >&2
            exit 1
          fi
          grep -q 'web desktop not deployed' payloads/ui.html
          grep -q 'webdeskReason' payloads/ui.html
          grep -q 'webdeskReason' payloads/ghrdp-server.ps1
          grep -q "webdeskReason = \$wdr" payloads/ghrdp-server.ps1
          # Web-desktop step must fail LOUD: all 6 skip paths record a reason.
          grep -q 'webdeskReason' .github/workflows/main.yml
          grep -q 'VNC_PASS not set - web desktop disabled' .github/workflows/main.yml
          step=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          # NOTE (all gates in this file): grep the shell variables via
          # herestring, NEVER via `printf '%s' "$var" | grep -q`. Under
          # `set -o pipefail`, grep -q's early exit SIGPIPEs printf (141),
          # which pipefail propagates, so `if ! ...` fails DESPITE the match.
          # It is scheduler-dependent (flaky across identical runs).
          n=$(grep -c "Set-WebdeskCfg ''" <<< "$step" || true)
          if [ "$n" -lt 6 ]; then
            echo "web-desktop step has silent skip paths (only $n reason writes)" >&2
            exit 1
          fi
          # No fabricated serve URL: a URL needs a real serve mapping.
          if grep -n "serveUrl = 'https://' + \$fq" .github/workflows/main.yml; then
            echo 'web-desktop step fabricates a serve URL without a mapping' >&2
            exit 1
          fi
          # Self-test step must exist and gate on the noVNC marker.
          grep -q 'Web desktop self-test' .github/workflows/main.yml
          teststep=$(awk '/Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          grep -q 'noVNC' <<< "$teststep"
          grep -q 'self-test PASS' <<< "$teststep"
          grep -q 'self-test FAIL' <<< "$teststep"
      - name: F9l web-desktop self-heal + diagnostics gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          # Region = the self-test step through the diagnostics steps (ends at
          # the dashboard step, exactly like the F8 gate).
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF")
          # Assert against CODE, never against prose: comment text must not be
          # able to satisfy (or mask) a gate.
          code=$(grep -vE '^[[:space:]]*#' <<< "$teststep")
          # A) [F9n] The self-test must curl the EXACT advertised URL (the value
          #    the dashboard opens) plus the backend root on the tailnet IP.
          if ! grep -qF 'Invoke-Probe $url' <<< "$code"; then
            echo 'self-test does not curl the exact advertised URL (Invoke-Probe $url missing)' >&2
            exit 1
          fi
          if ! grep -qF -- "'backend-root'" <<< "$code"; then
            echo 'self-test lacks the backend-root probe' >&2
            exit 1
          fi
          # B) Dead backend must be healed by CALLING the idempotent launcher
          #    (the function definition alone proves nothing).
          if ! grep -qF '$started = Start-Websockify' <<< "$teststep"; then
            echo 'self-test cannot heal the backend leg ($started = Start-Websockify missing)' >&2
            exit 1
          fi
          # C) [F9n] serve is retired: no mapping reset may survive, and the
          #    classifier must capture firewall evidence (the GHRDP-Webdesk
          #    rule state) instead of serve status.
          if grep -qF -- "'--bg'" <<< "$code"; then
            echo 'self-test still carries a retired serve reset form' >&2
            exit 1
          fi
          if ! grep -q 'GHRDP-Webdesk' <<< "$code"; then
            echo 'self-test does not capture GHRDP-Webdesk firewall evidence' >&2
            exit 1
          fi
          # D) [F9n] The classification tokens must exist (diagnosis, not guessing).
          for tok in backend-dead firewall marker-missing; do
            if ! grep -q "verdict = '$tok'" <<< "$code"; then
              echo "self-test cannot classify: '$tok' missing" >&2
              exit 1
            fi
          done
          # E) Fail-closed: the halt must still write the locked codes + throw.
          if ! grep -q "\$cfgF.webdeskReason = 'serve-failed'" <<< "$code"; then
            echo 'self-test halt no longer writes webdeskReason=serve-failed' >&2
            exit 1
          fi
          if ! grep -q "throw ('Web desktop self-test FAILED" <<< "$code"; then
            echo 'self-test halt no longer throws (fail-closed)' >&2
            exit 1
          fi
          # F) The F9l-1 launcher must exist in BOTH steps as byte-identical text
          #    (a divergent copy silently changes recovery behaviour).
          n=$(grep -c '^          function Start-Websockify(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Start-Websockify copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Start-Websockify\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Start-Websockify copies diverged - edit both or neither' >&2
            exit 1
          fi
          launcher=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF")
          if grep -Fq -- '-WindowStyle Hidden' <<< "$launcher"; then
            echo 'Start-Websockify must not hide the websockify process window' >&2
            exit 1
          fi
          # G) Survivable diagnostics: the webdesk steps must stage + upload the
          #    'webdesk-diag' artifact, and the upload path must stay inside the
          #    workspace - upload-artifact v4 rejects absolute host paths
          #    (proven by the first lab run: 'rootDirectory ... is not a parent
          #    directory of the file C:\ghrdp\webdesk\websockify.log').
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          if ! grep -q 'actions/upload-artifact' <<< "$webdesk_all"; then
            echo 'web-desktop steps do not upload the diagnostics artifact' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+name: webdesk-diag[[:space:]]*$' <<< "$webdesk_all"; then
            echo "web-desktop steps do not upload the 'webdesk-diag' artifact" >&2
            exit 1
          fi
          upload=$(awk '/Web desktop diagnostics artifact/{f=1} f && /^      - name: / && !/Web desktop diagnostics artifact/{exit} f' "$WF")
          if ! grep -q 'if: always()' <<< "$upload"; then
            echo 'the diagnostics upload must use if: always() (it must survive a halt)' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+path: webdesk-diag[[:space:]]*$' <<< "$upload"; then
            echo 'the diagnostics upload must use the workspace-relative staging dir' >&2
            exit 1
          fi
          if grep -qE 'C:\\+ghrdp|runner\.temp' <<< "$upload"; then
            echo 'diagnostics upload uses absolute paths - upload-artifact v4 will fail (stage inside the workspace instead)' >&2
            exit 1
          fi
      - name: F9n tailnet-HTTP transport gates (serve retired for webdesk)
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          # 1) tailscale serve is retired in the webdesk path: no invocation or
          #    serve machinery may survive. The single allowed mention is the
          #    mandated retirement transport note in the deploy summary.
          rest=$(grep -v 'tailscale serve retired' <<< "$webdesk_all")
          if grep -q 'tailscale serve' <<< "$rest"; then
            echo "webdesk steps still use 'tailscale serve' (retired: Windows SYSTEM operator lock 401)" >&2
            exit 1
          fi
          for tok in 'serve status' 'set-raw' 'Get-WebdeskServeUrl' "'--bg'"; do
            if grep -qF -- "$tok" <<< "$webdesk_all"; then
              echo "webdesk steps still carry retired serve machinery: $tok" >&2
              exit 1
            fi
          done
          # 2) the CGNAT-only firewall rule must be created (idempotent) + evidenced.
          if ! grep -q "New-NetFirewallRule.*GHRDP-Webdesk" <<< "$webdesk_all"; then
            echo 'webdesk deploy step lacks the GHRDP-Webdesk firewall rule' >&2
            exit 1
          fi
          if ! grep -q "RemoteAddress '100.64.0.0/10'" <<< "$webdesk_all"; then
            echo 'GHRDP-Webdesk rule is not scoped to 100.64.0.0/10' >&2
            exit 1
          fi
          if ! grep -q "LocalPort 7333" <<< "$webdesk_all"; then
            echo 'GHRDP-Webdesk rule does not target port 7333' >&2
            exit 1
          fi
          # 3) the tailnet IP must come from config.rdpIp with CGNAT validation
          #    (fail-closed, no fabrication, no `tailscale ip` fallback).
          if ! grep -q 'cfgR.rdpIp' <<< "$webdesk_all"; then
            echo 'webdesk deploy step does not read config.rdpIp' >&2
            exit 1
          fi
          if ! grep -q 'tailnet-ip-unavailable' <<< "$webdesk_all"; then
            echo 'webdesk deploy step lacks the tailnet-ip-unavailable fail-closed path' >&2
            exit 1
          fi
          # 4) the server must enforce the webdeskUrl acceptance allowlist.
          if ! grep -q 'F9n] webdeskUrl acceptance allowlist' payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 lacks the F9n webdeskUrl acceptance allowlist' >&2
            exit 1
          fi
          if ! grep -q "6\[4-9\]" payloads/ghrdp-server.ps1; then
            echo 'server allowlist lacks the CGNAT 100.64-127 pattern' >&2
            exit 1
          fi
          if ! grep -q 'ts\\.net/' payloads/ghrdp-server.ps1; then
            echo 'server allowlist lacks the legacy https ts.net alternative' >&2
            exit 1
          fi
      - name: F9o TightVNC password-ladder gates (auth probe + labeled degrade)
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          deploy=$(awk '/Web desktop \(noVNC/{f=1} /^      - name: Web desktop self-test/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          # 1) the password mangler must be gone: no package-manager install of
          #    TightVNC may survive in EITHER webdesk step (deploy or self-test).
          for region in deploy teststep; do
            if grep -q 'choco install tightvnc' <<< "${!region}"; then
              echo "webdesk $region still carries the password-mangling install path" >&2
              exit 1
            fi
          done
          # 2) L1: ALWAYS direct msiexec with the full property list (download
          #    first; REINSTALL pair when the uninstall key exists).
          if ! grep -q 'tightvnc-2.8.85-gpl-setup-64bit.msi' <<< "$deploy"; then
            echo 'deploy step does not download the TightVNC MSI first (L1)' >&2
            exit 1
          fi
          for prop in 'VALUE_OF_PASSWORD=' 'VALUE_OF_CONTROLPASSWORD=' 'SET_PASSWORD=1' 'SET_CONTROLPASSWORD=1' 'REINSTALL=Server' 'REINSTALLMODE=omus'; do
            if ! grep -qF -- "$prop" <<< "$deploy"; then
              echo "L1 msiexec property missing: $prop" >&2
              exit 1
            fi
          done
          # 3) L2: restart + registry pin (SecurityTypes=VncAuth) + Password blob check.
          if ! grep -q "SecurityTypes.*VncAuth" <<< "$deploy"; then
            echo 'L2 must pin SecurityTypes to VncAuth' >&2
            exit 1
          fi
          if ! grep -q 'Password.*Length.*-ge 8\|\$pwdLen -ge 8\|-ge 8' <<< "$deploy"; then
            echo 'L2 must verify the Password blob length >= 8' >&2
            exit 1
          fi
          # 4) L3/L4: the REAL auth probe (vncdotool vs 127.0.0.1:5900) must exist
          #    in the deploy step, with redaction and a reinstall retry.
          if ! grep -q 'vncdotool' <<< "$deploy"; then
            echo 'deploy step lacks the vncdotool auth probe (L3)' >&2
            exit 1
          fi
          if ! grep -q '127.0.0.1::5900' <<< "$deploy"; then
            echo 'auth probe must target 127.0.0.1::5900' >&2
            exit 1
          fi
          if ! grep -q '\[redacted\]' <<< "$deploy"; then
            echo 'auth probe lacks password redaction' >&2
            exit 1
          fi
          if ! grep -q 'choco uninstall tightvnc' <<< "$deploy"; then
            echo 'L4 retry lacks the manager-held uninstall + fresh msiexec path' >&2
            exit 1
          fi
          # 5) L5: LABELED degrade - the exact WARNING string + the auth stamp +
          #    the fail-closed unverifiable detail. Never silent, never hidden.
          if ! grep -qF 'VNC password gate could not be applied; access limited to tailnet firewall 100.64.0.0/10; rotate VNC_PASS and re-dispatch to restore the gate' <<< "$deploy"; then
            echo 'L5 degrade path lacks the mandated summary WARNING string' >&2
            exit 1
          fi
          if ! grep -q "none-tailnet-only" <<< "$deploy"; then
            echo "L5 must stamp webdeskAuth='none-tailnet-only'" >&2
            exit 1
          fi
          if ! grep -q 'vnc-auth-unverifiable' <<< "$deploy"; then
            echo 'deploy step lacks the vnc-auth-unverifiable fail-closed path' >&2
            exit 1
          fi
          # 6) self-test: HTTP marker AND the mode-matching VNC probe (vnc-auth
          #    verdict on mismatch), with probe codes in the artifact payload.
          if ! grep -q 'vncdotool' <<< "$teststep"; then
            echo 'self-test lacks the vncdotool probe' >&2
            exit 1
          fi
          if ! grep -q 'webdeskAuth' <<< "$teststep"; then
            echo 'self-test lacks mode-matching (webdeskAuth)' >&2
            exit 1
          fi
          if ! grep -q "verdict = 'vnc-auth'" <<< "$teststep"; then
            echo "self-test lacks the 'vnc-auth' verdict" >&2
            exit 1
          fi
          if ! grep -q 'vncprobe-codes.txt' <<< "$teststep"; then
            echo 'self-test does not record vncprobe-codes.txt' >&2
            exit 1
          fi
          if ! grep -q 'tightvnc-tail.txt' <<< "$teststep"; then
            echo 'artifact payload lacks tightvnc-tail.txt' >&2
            exit 1
          fi
          # 7) the two probe copies must be byte-identical (like Start-Websockify).
          n=$(grep -c '^          function Invoke-VncAuthProbe(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Invoke-VncAuthProbe copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Invoke-VncAuthProbe\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Invoke-VncAuthProbe\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Invoke-VncAuthProbe copies diverged - edit both or neither' >&2
            exit 1
          fi
          # 8) server + UI must expose the verified auth mode.
          if ! grep -q 'webdeskAuth' payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 does not expose webdeskAuth' >&2
            exit 1
          fi
          if ! grep -q "webdeskAuth = \$wda" payloads/ghrdp-server.ps1; then
            echo 'native-status does not return webdeskAuth' >&2
            exit 1
          fi
          if ! grep -q 'VNC auth mode' payloads/ui.html; then
            echo 'ui.html lacks the VNC auth mode row' >&2
            exit 1
          fi
          if ! grep -q 'webdeskAuthAdvisory' payloads/ui.html; then
            echo 'ui.html lacks the degraded-mode advisory' >&2
            exit 1
          fi
      - name: F9 MagicDNS halt + link gates
        shell: bash
        run: |
          set -euo pipefail
          # F9a/F9f: every MagicDNS gate (tailscale-connect, cert-bind,
          # stage/config) must carry the actionable admin link in its failure
          # output (log + step summary + thrown message) - at least one per
          # gate, so three minimum across main.yml.
          n=$(grep -c 'login.tailscale.com/admin/dns' .github/workflows/main.yml || true)
          if [ "$n" -lt 3 ]; then
            echo "main.yml carries only $n 'login.tailscale.com/admin/dns' links (need >= 3: one per MagicDNS gate)" >&2
            exit 1
          fi
          # F9f: no MagicDNS validation may pass without a non-empty *.ts.net
          # Self.DNSName. Every step that reads Self.DNSName must validate it
          # against the ts.net pattern (empty / tailnet-IP / other names halt).
          bad=$(awk '
            /^      - name: / { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; buf = "" }
            { buf = buf $0 "\n" }
            END { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; print n + 0 }
          ' .github/workflows/main.yml)
          if [ "$bad" -ne 0 ]; then
            echo 'a step reads Self.DNSName without a non-empty *.ts.net validation - a MagicDNS gate could pass on an empty or non-ts.net name' >&2
            exit 1
          fi
      - name: F9k secret-halt + cascade gates
        shell: bash
        run: |
          set -euo pipefail
          # The TS_AUTHKEY halt must carry the clickable Tailscale admin keys link.
          if ! grep -q 'login.tailscale.com/admin/settings/keys' .github/workflows/main.yml; then
            echo "main.yml lacks 'login.tailscale.com/admin/settings/keys' (TS_AUTHKEY halt link)" >&2
            exit 1
          fi
          # Secret fix instructions must link the repo secrets settings page.
          if ! grep -q 'settings/secrets/actions' .github/workflows/main.yml; then
            echo "main.yml lacks 'settings/secrets/actions' (repo secrets settings link)" >&2
            exit 1
          fi
          # Every ghrdp-lib.ps1 dot-source must carry exactly one '# [F9k-guard]'
          # cascade guard, and the gate must not be vacuous.
          guards=$(grep -cF '# [F9k-guard]' .github/workflows/main.yml || true)
          dotsrc=$(grep -c "\. (Join-Path \$root 'ghrdp-lib.ps1')" .github/workflows/main.yml || true)
          if [ "$dotsrc" -lt 1 ]; then
            echo 'no ghrdp-lib.ps1 dot-sources found - gate would be vacuous' >&2
            exit 1
          fi
          if [ "$guards" -ne "$dotsrc" ]; then
            echo "F9k guard count ($guards) != ghrdp-lib dot-source count ($dotsrc)" >&2
            exit 1
          fi
      - name: Native UI and VPS contracts (Node)
        run: node --test tests/*.test.js
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse native PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('payloads/ghrdp-server.ps1', 'payloads/Provision-GhrdpVps.ps1', 'payloads/Enable-RdpTlsCertificate.ps1', 'payloads/helper-ghrdp-connect.ps1')) {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
              if ($errors) { throw "$file has $($errors.Count) PowerShell syntax error(s): $($errors[0].Message)" }
          }
      - name: Smoke-test VPS ACL helper in temporary files only
        shell: pwsh
        run: |
          $source = Get-Content payloads/Provision-GhrdpVps.ps1 -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$null, [ref]$null)
          $fn = $ast.Find({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Protect-Path'}, $true)
          if (-not $fn) { throw 'Protect-Path definition missing' }
          . ([scriptblock]::Create($fn.Extent.Text))
          $dir = Join-Path $env:RUNNER_TEMP ('ghrdp-acl-' + [guid]::NewGuid().ToString('N'))
          try {
              New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
              Protect-Path -Path $dir -Directory $true
              $file = Join-Path $dir 'safe.txt'
              [System.IO.File]::WriteAllText($file, 'non-secret CI test')
              Protect-Path -Path $file
              if (-not (Get-Acl $dir).AreAccessRulesProtected -or -not (Get-Acl $file).AreAccessRulesProtected) { throw 'ACL protection failed' }
          } finally { if (Test-Path $dir) { Remove-Item $dir -Recurse -Force } }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish compiled native handler
        shell: pwsh
        run: |
          dotnet run --project payloads/ghrdp-handler/GhrdpHandler.csproj -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Handler self-test failed' }
          dotnet publish payloads/ghrdp-handler/GhrdpHandler.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o "$env:RUNNER_TEMP\ghrdp-handler"
          if ($LASTEXITCODE -ne 0) { throw 'Handler publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ghrdp-handler-win-x64
          path: ${{ runner.temp }}\ghrdp-handler\GhrdpHandler.exe
