          if ($env:MIRROR -eq 'true') {
            $watcherScript = Join-Path $sd 'ghrdp-watcher.ps1'; $startupAll = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
            try { $wArgs = "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$cfgPath`""; $ws2 = New-Object -ComObject WScript.Shell; $sc2 = $ws2.CreateShortcut((Join-Path $startupAll 'ghrdp-watcher.lnk')); $sc2.TargetPath = $ps; $sc2.Arguments = $wArgs; $sc2.WindowStyle = 7; $sc2.Description = 'ghrdp mirror watcher (runs as logged-in RDP user)'; $sc2.Save(); Write-Host "watcher auto-start shortcut -> $startupAll" } catch { Write-Host "startup shortcut err: $_" }
            & icacls.exe $sd /grant "${user}:(OI)(CI)M" 2>$null | Out-Null; $LASTEXITCODE = 0; Write-Host "[perms] RDP user modify granted on $sd"
          }
