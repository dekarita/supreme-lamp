      - name: Write dashboard UI (live telemetry + clickable ghrdp + troubleshooter)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-ui.html" <<'UIEOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta id="ghrdpStatic" content="__STATIC__"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDP Mission Control</title>
          <style>body{font-family:Segoe UI,system-ui,sans-serif;background:#0a0e12;color:#e9eef3;margin:0;padding:24px}h1{margin:0 0 8px}.sub{color:#8aa0ad;margin-bottom:20px}.panel{background:#11171d;border:1px solid #223039;border-radius:14px;padding:18px;margin:0 0 16px}code{background:#070b0e;border:1px solid #223039;border-radius:8px;padding:6px 8px;display:inline-block;min-width:120px}a.button,button{display:inline-block;background:#37c6b0;color:#04201c;font-weight:700;border:0;border-radius:10px;padding:12px 18px;text-decoration:none;cursor:pointer;margin:6px 6px 0 0}button.warn{background:#f0a830;color:#231600}pre{background:#070b0e;border:1px solid #223039;border-radius:10px;padding:12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.big{font-size:56px;font-weight:800}#mirrorBox{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body>
          <h1>RDP Mission Control</h1><div class="sub" id="mode">checking…</div>
          <div class="panel"><div><b>IP</b> <code id="vIp">__IP__</code></div><div style="margin-top:8px"><b>USER</b> <code id="vUser">__USER__</code></div><div style="margin-top:8px"><b>PASS</b> <code id="vPass">__PASS__</code></div><div style="margin-top:14px"><a id="rdp" href="__GHRDP__">Open Remote Desktop</a><button id="diagBtn">Diagnose</button></div><div style="margin-top:12px;font-size:12px;color:#8aa0ad;word-break:break-all">ghrdp: <a id="ghrdpLink" href="__GHRDP__" style="color:#37c6b0">__GHRDP__</a></div></div>
          <div class="grid"><div class="panel"><div class="sub">Overall uploaded</div><div class="big"><span id="pct">0</span>%</div><div style="margin-top:10px;color:#8aa0ad">done <b id="cDone">0</b> | active <b id="cAct">0</b> | failed <b id="cFail">0</b> | tracked <b id="cTrk">0</b></div><div style="margin-top:10px;color:#8aa0ad">speed <b id="speed">0 B/s</b></div><div id="mirrorBox" style="margin-top:14px"><button class="warn" id="emBtn">Upload everything now</button><div id="banner" style="margin-top:10px;font-weight:700"></div></div></div>
          <div class="panel"><div class="sub">Live log</div><pre id="log">waiting for watcher…</pre><div id="rentry" style="margin-top:10px;font-size:12px;color:#8aa0ad;display:none"></div></div></div>
          <div class="panel"><div class="sub">Diagnostics</div><pre id="diagOut" style="display:none"></pre></div>
          <script>
          function fb(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB';}
          function setCreds(c){if(!c)return;document.getElementById('vIp').textContent=c.ip||'-';document.getElementById('vUser').textContent=c.user||'-';document.getElementById('vPass').textContent=c.pass||'-';}
          function setGhrdp(u){var a=document.getElementById('ghrdpLink');var r=document.getElementById('rdp');var ok=!!u&&u.indexOf('ghrdp://')===0&&u.length>10;a.href=ok?u:'#';a.textContent=u||'ghrdp://…';if(r&&ok)r.href=u;}
          function render(s){if(!s)return;var now=Date.now();var ts=s.ts?new Date(s.ts).getTime():0;var age=ts?Math.round((now-ts)/1000):999;var on=!s.mirror||(s.alive&&age<15);document.getElementById('mode').textContent=(s.viaLoopback?'Inside RDP':'Local PC')+' | watcher '+(on?'online':'stale')+' | age '+age+'s';if(s.ghrdp){setGhrdp(s.ghrdp);}if(s.creds){setCreds(s.creds);}if(s.rentry){var r=document.getElementById('rentry');r.style.display='block';r.textContent='index: '+s.rentry;}document.getElementById('mirrorBox').style.display=s.mirror?'block':'none';var a=s.agg||{};document.getElementById('pct').textContent=a.overallPct||0;document.getElementById('cDone').textContent=a.done||0;document.getElementById('cAct').textContent=a.active||0;document.getElementById('cFail').textContent=a.failed||0;document.getElementById('cTrk').textContent=a.tracked||0;document.getElementById('speed').textContent=fb(a.speedBps||0)+'/s';var lg=s.log||[];if(lg.length){document.getElementById('log').textContent=lg.join('\n');}var bn=document.getElementById('banner');bn.textContent='';if(s.mirror){if((a.failed||0)>0&&(a.active||0)===0){bn.textContent=(a.failed)+' failed';}else if((a.tracked||0)>0&&(a.active||0)===0&&(a.failed||0)===0&&(a.done||0)>0){bn.textContent='ALL UPLOADED - safe to Cancel now.';}}}
          function poll(){fetch('/progress'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){});}
          document.getElementById('diagBtn').addEventListener('click',function(){var o=document.getElementById('diagOut');o.style.display='block';o.textContent='running…';fetch('/diag'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){o.textContent=JSON.stringify(d,null,2);}).catch(function(e){o.textContent='diag failed: '+e;});});
          document.getElementById('emBtn').addEventListener('click',function(){var b=this;b.disabled=true;b.textContent='triggered…';fetch('/emergency'+(location.search||''),{cache:'no-store'}).then(function(){setTimeout(function(){b.disabled=false;b.textContent='Upload everything now';},1500);}).catch(function(){b.disabled=false;b.textContent='Upload everything now';});});
          var STATIC=(document.getElementById('ghrdpStatic')||{}).content==='1';if(STATIC){document.getElementById('mode').textContent='Local PC view.';}else{poll();setInterval(poll,1500);}
          </script></body></html>
          UIEOF
      - name: Write mirror watcher (real profile resolution + resilient)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'WATCHEOF'
          param([string]$CfgPath)
          $ErrorActionPreference='Continue'
          $progEarly=Join-Path (Split-Path $CfgPath -Parent) 'ghrdp_progress.json'
          function Write-HB($m){ try{ $h=@{ts=(Get-Date -f o);alive=$true;agg=@{tracked=0;done=0;active=0;failed=0};files=@();log=@($m)}; [IO.File]::WriteAllText($progEarly,($h|ConvertTo-Json -Depth 6 -Compress),(New-Object System.Text.UTF8Encoding $false)) }catch{} }
          $createdNew=$false; $mtx=New-Object Threading.Mutex $true,'Global\ghrdp-watcher-single',([ref]$createdNew); if(-not $createdNew){ Write-HB 'lock held - exit'; exit 0 }
          $cfg=$null; try{ $b=[IO.File]::ReadAllBytes($CfgPath); if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){$b=$b[3..($b.Length-1)]}; $cfg=([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF))|ConvertFrom-Json -EA Stop }catch{ Write-HB ('CFG FAIL '+$_.Exception.Message); throw }
          if(-not $cfg){ Write-HB 'CFG NULL'; throw 'cfg' }
          $env:GHRDP_CFG=$CfgPath; $env:GHRDP_LOG=$cfg.logFile; . $cfg.libPath
          if(-not (Get-Command Init-Progress -EA 0)){ Write-HB 'LIB NOT LOADED'; throw 'lib' }
          Init-Progress $cfg.progressPath
          $script:RUNLOG=New-Object Collections.ArrayList; $script:SCAN=@{}
          function LErr($t,$e){ $m=("[{0}] {1}: {2}" -f (Get-Date -f 'HH:mm:ss'),$t,$e.Exception.Message); [void]$script:RUNLOG.Add($m); try{ Add-Content $cfg.logFile $m -EA 0 }catch{} }
          function ScanLine{ $parts=@($script:SCAN.GetEnumerator()|ForEach-Object{ $v=$_.Value; $s=$_.Key+':raw='+$v.rawTotal+'/elig='+$v.eligible; if($v.error){$s+=' ERR='+$v.error}; $s }); return ('[scan] '+($parts -join ' | ')) }
          # Resolve REAL profile folders at runtime (handles suffixed profiles)
          function Build-Roots {
            $R=@(); $prof=$env:USERPROFILE
            foreach($t in @('Downloads','Desktop','Documents')){ $p=Join-Path $prof $t; if(-not (Test-Path $p)){ $g=Get-ChildItem (Split-Path $prof) -Directory -EA 0 | Where-Object { $_.Name -like "$($env:USERNAME)*" } | Select-Object -First 1; if($g){ $p=Join-Path $g.FullName $t } }; $R+=@{path=$p;rec=$false;min=0;tag=$t} }
            $R+=@{path=(Join-Path $prof 'AppData\Local\Temp');rec=$true;min=102400;tag='Temp'}
            foreach($r in $cfg.roots){ if(@('Downloads','Desktop','Documents','Temp') -notcontains $r.tag){ $R+=$r } }
            return $R
          }
          Write-HB 'watcher lib loaded'
          $junk=@('.tmp','.crdownload','.partial','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak','.!qb')
          $done=@{}; if(Test-Path $cfg.doneFile){ Get-Content $cfg.doneFile | ForEach-Object { $done[$_]=$true } }
          $idx=Load-Index $cfg
          try{ Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null }catch{ LErr 'init-err' $_ }
          function DoUpload($fi,$tag){ if($done.ContainsKey($fi.FullName)){return}; $len=$fi.Length; $safe=$fi.Name -replace '\|','_'; $disp=($safe -replace '[^\x20-\x7E]','_'); $ex=$idx|Where-Object{$_.name -eq $safe -and $_.src -eq $tag}|Select-Object -First 1; if(-not $ex){ $ex=@{name=$safe;src=$tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss')}; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len; Save-Index $cfg $idx }; $ex.status='uploading'; $enc=Join-Path $cfg.tmpDir ('ge_'+[guid]::NewGuid().ToString('N')+'.enc'); $gf=$null; Set-Active $disp 'encrypt' $len; try{ Encrypt-File $fi.FullName $enc $cfg.decPw }catch{ LErr ('enc '+$fi.Name) $_ }; Set-Active $disp 'upload' $len; try{ $gf=Upload-Gofile-Streamed $enc $disp }catch{ LErr ('up '+$fi.Name) $_ }; Remove-Item $enc -Force -EA 0; if($gf){ $ex.payload=B64U ($gf+'|'+$cfg.decPw+'|'+$safe); $ex.gofile=$gf; $ex.status='ok'; $ex.time=(Get-Date -f 'HH:mm:ss'); $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Save-Index $cfg $idx; try{Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null}catch{}; "[$(Get-Date -f o)] OK $tag $($fi.Name) ($len bytes)"|Out-File $cfg.logFile -Append } else { $ex.status='limit'; Save-Index $cfg $idx; "[$(Get-Date -f o)] LIMIT $tag $($fi.Name)"|Out-File $cfg.logFile -Append }; Set-Active '' 'idle' 0 }
          function Scan($r){ $elig=0; $rawAll=@(); $rerr=''; if(-not (Test-Path $r.path)){ $script:SCAN[$r.tag]=@{rawTotal=0;eligible=0;path=$r.path;error='path-missing'}; return }; try{ $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0}else{Get-ChildItem -LiteralPath $r.path -File -EA 0} }catch{ $script:SCAN[$r.tag]=@{rawTotal=-1;eligible=0;path=$r.path;error=$_.Exception.Message}; return }; $rawAll=@($items); foreach($fi in $rawAll){ if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}; if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}; $elig++; DoUpload $fi $r.tag }; $script:SCAN[$r.tag]=@{rawTotal=$rawAll.Count;eligible=$elig;path=$r.path;error=$rerr} }
          function SyncProg{ try{ $p=$global:GHRDP_PROG; $d=0;$u=0;$f=0; foreach($it in $idx){ if($it.status -eq 'ok'){$d++}elseif($it.status -eq 'limit'){$f++}else{$u++} }; $p.agg.done=$d; $p.agg.failed=$f; $p.agg.tracked=$idx.Count; $p.agg.active=if($p.active.phase -ne 'idle'){1}else{0}; $p.agg.bytesTotal=$global:GHRDP_TOTAL_BYTES; $p.files=@(foreach($it in $idx){@{name=$it.name;src=$it.src;status=$it.status}}); $errs=@($script:RUNLOG|Select-Object -Last 6); $ft=@(); if(Test-Path $cfg.logFile){ $g=Get-Content $cfg.logFile -Tail 12 -EA 0; if($g){$ft=@($g)} }; $p.log=@($errs)+@(ScanLine)+$ft; Flush-Progress $true }catch{ LErr 'sync-err' $_ } }
          while($true){
            if(Test-Path $cfg.emergencyFlag){ try{ foreach($p in @('qbittorrent','qbittorrent-nox')){Get-Process -Name $p -EA 0|Stop-Process -Force -EA 0}; Start-Sleep 4; foreach($r in (Build-Roots)){ Scan $r }; Save-Index $cfg $idx; try{Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null}catch{}; Remove-Item $cfg.emergencyFlag -Force -EA 0 }catch{ LErr 'em-err' $_ } }
            else { foreach($r in (Build-Roots)){ try{ Scan $r }catch{ LErr ('scan-err '+$r.tag) $_ } } }
            SyncProg
            try{ $global:GHRDP_PROG.ts=(Get-Date -f o); $global:GHRDP_PROG.alive=$true; [IO.File]::WriteAllText($cfg.progressPath,($global:GHRDP_PROG|ConvertTo-Json -Depth 6 -Compress),(New-Object System.Text.UTF8Encoding $false)) }catch{ LErr 'hb-err' $_ }
            Start-Sleep 3
          }
          WATCHEOF
      - name: Write launcher + installer + summary
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-launcher.ps1" <<'LAUNCHEOF'
          param([string]$CfgPath,[int]$Port=7331)
          $sd=Split-Path $CfgPath -Parent; $watcherScript=Join-Path $sd 'ghrdp-watcher.ps1'; $ps="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          try{ Start-Process ("http://127.0.0.1:$Port/") | Out-Null }catch{}
          $wr=Get-CimInstance Win32_Process -EA SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }
          if(-not $wr -and (Test-Path $watcherScript)){ try{ Start-Process $ps -ArgumentList "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$CfgPath`"" -WindowStyle Hidden | Out-Null }catch{} }
          while($true){ Start-Sleep 5 }
          LAUNCHEOF
          cat > "$RUNNER_TEMP/ghrdp-install.ps1" <<'INSTALLEOF'
          try{ $dir=Join-Path $env:LOCALAPPDATA 'ghrdp'; New-Item -ItemType Directory $dir -Force|Out-Null; $hp=Join-Path $dir 'ghrdp.ps1'; $helper=@'
          param([string]$url)
          if($url -match '^ghrdp://([^/]+)/([^/]+)/(.+)$'){$ip=$Matches[1];$u=[uri]::UnescapeDataString($Matches[2]);$p=[uri]::UnescapeDataString($Matches[3]);cmdkey /generic:TERMSRV/$ip /user:$u /pass:$p|Out-Null;Start-Process "$env:windir\System32\mstsc.exe" "/v:$ip"}
          '@; Set-Content $hp $helper -Encoding ASCII; $root='HKCU:\Software\Classes\ghrdp'; New-Item $root -Force|Out-Null; Set-Item $root 'URL:GitHub RDP Connect'; New-ItemProperty $root 'URL Protocol' '' -Type String -Force|Out-Null; New-Item "$root\shell\open\command" -Force|Out-Null; $pwsh=(Get-Command powershell.exe -EA 0).Source; if(-not $pwsh){$pwsh='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'}; Set-Item "$root\shell\open\command" -Value "`"$pwsh`" -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$hp`" `"%1`""; Write-Host 'SUCCESS - connector installed.' }catch{ Write-Host "INSTALL ERROR: $($_.Exception.Message)" }
          INSTALLEOF
          cat > "$RUNNER_TEMP/ghrdp-summary.ps1" <<'SUMMARYEOF'
          param([string]$CfgPath)
          if(-not (Test-Path $CfgPath)){ return }
          $cfg=Get-Content $CfgPath -Raw|ConvertFrom-Json; $S=$env:GITHUB_STEP_SUMMARY
          '### RDP ready' >> $S; '' >> $S
          if($cfg.funnelUrl){ ('**[>>> OPEN RDP WEB-APP <<<]('+$cfg.funnelUrl+')**') >> $S; '' >> $S }
          'Paste locally:' >> $S; '```' >> $S; $cfg.ghrdp >> $S; '```' >> $S; '' >> $S
          ('IP: '+$cfg.rdpIp+'  User: '+$cfg.rdpUser+'  Pass: '+$cfg.rdpPass) >> $S
          if($cfg.mirror){ ('Mirror ON. Index: '+$cfg.rentryUrl) >> $S }
          SUMMARYEOF
      - name: Configure theme + apps + shortcuts + watcher startup
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $mPers='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'; if(-not (Test-Path $mPers)){New-Item $mPers -Force|Out-Null}; New-ItemProperty $mPers 'AppsUseLightTheme' 0 -Type DWord -Force|Out-Null; New-ItemProperty $mPers 'SystemUsesLightTheme' 0 -Type DWord -Force|Out-Null
          $edgePol='HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'; if(-not (Test-Path $edgePol)){New-Item $edgePol -Force|Out-Null}; $crx='https://edge.microsoft.com/extensionwebstorebase/v1/crx'; New-ItemProperty $edgePol '1' "odfafepnkmbhccpbejgmiehpchacaeak;$crx" -Type String -Force|Out-Null; New-ItemProperty $edgePol '2' "ifoakfbpdcdoeenechcleahebpibofpc;$crx" -Type String -Force|Out-Null
          $fav='[{"name":"FMHY Torrenting","url":"https://fmhy.net/torrenting"}]'; New-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' 'ManagedFavorites' $fav -Type String -Force|Out-Null
          try{ winget install --id qBittorrent.qBittorrent -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null }catch{}; $LASTEXITCODE=0
          try{ winget install --id Parsec.Parsec -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null }catch{}; $LASTEXITCODE=0
          try{ winget install --id FreeDownloadManager.FreeDownloadManager -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null }catch{}; $LASTEXITCODE=0
          $pcfg='C:\ProgramData\Parsec'; New-Item -ItemType Directory $pcfg -Force|Out-Null; "app_host = 1`r`nprivacy_mode = 0" | Set-Content (Join-Path $pcfg 'config.txt') -Encoding ASCII -EA 0
          $sd=$env:RUNNER_TEMP; $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $launcher=Join-Path $sd 'ghrdp-launcher.ps1'; $ps="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"; $user=$env:RDP_USER
          foreach($desk in @("C:\Users\Public\Desktop","C:\Users\$user\Desktop")){ try{ New-Item -ItemType Directory $desk -Force -EA 0|Out-Null; $ws=New-Object -ComObject WScript.Shell; $sc=$ws.CreateShortcut((Join-Path $desk 'Mission Control.lnk')); $sc.TargetPath=$ps; $sc.Arguments="-NoExit -ExecutionPolicy Bypass -File `"$launcher`" -CfgPath `"$cfgPath`""; $sc.Save() }catch{} }
          if($env:MIRROR -eq 'true'){ $watcherScript=Join-Path $sd 'ghrdp-watcher.ps1'; $startupAll='C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'; try{ $ws2=New-Object -ComObject WScript.Shell; $sc2=$ws2.CreateShortcut((Join-Path $startupAll 'ghrdp-watcher.lnk')); $sc2.TargetPath=$ps; $sc2.Arguments="-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$cfgPath`""; $sc2.Save() }catch{}; & icacls $sd /grant "${user}:(OI)(CI)M" 2>$null|Out-Null; $LASTEXITCODE=0 }
          exit 0
      - name: Prepare config + publish cfg path
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        shell: pwsh
        run: |
          $ts="C:\Program Files\Tailscale\tailscale.exe"; $ip=(& $ts ip -4).Trim(); $user=$env:RDP_USER; $pass=$env:RDP_PASS
          $ghrdp="ghrdp://$ip/"+[uri]::EscapeDataString($user)+"/"+[uri]::EscapeDataString($pass); $sd=$env:RUNNER_TEMP
          New-Item -ItemType Directory (Join-Path $sd 'ghrdp_tmp') -Force|Out-Null
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $mirrorOn=($env:MIRROR -eq 'true'); $dashToken=$env:DASH_TOKEN
          if(-not $dashToken){ $rng=[Security.Cryptography.RandomNumberGenerator]::Create(); $alpha='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b=[byte[]]::new(24); $rng.GetBytes($b); $dashToken=-join ($b|ForEach-Object{$alpha[[int]$_ % $alpha.Length]}) }
