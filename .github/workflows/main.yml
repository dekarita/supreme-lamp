            document.getElementById("stV").textContent=view==="det"?"Details":"Grid";
          }
          function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
          function wire(el,c,idx){
            el.onclick=function(ev){if(ev.ctrlKey){var i=sel.indexOf(idx);if(i>=0)sel.splice(i,1);else sel.push(idx);anchor=idx;}else if(ev.shiftKey&&anchor>=0){var a=Math.min(anchor,idx),b=Math.max(anchor,idx);sel=[];for(var k=a;k<=b;k++)sel.push(k);}else{sel=[idx];anchor=idx;}render();ev.stopPropagation();};
