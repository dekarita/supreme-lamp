name: autologin-lab
# [F10-6] Lab proof matrix for the PS-free auto-login package. The reserved
# proof env dekarita/ghrdp-lab is unreachable for the CI token (404 view /
# 403 create - retried; same posture as STATE.md's webdesk-lab fallback), so
# this push-triggered windows-latest lane is the equally faithful fallback:
# it compiles+registers the REAL launcher with the in-box csc, invokes the
# REAL ghrdp://rdp verb, and exercises the REAL ghrdp-server.ps1 endpoints.
# Delete when ghrdp-lab becomes available.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/autologin-lab.yml
      - .github/workflows/main.yml
      - payloads/ghrdp-rdp-launcher.cs
      - payloads/install.cmd
      - payloads/ghrdp-server.ps1
      - payloads/edge-ext-resolve.ps1
      - payloads/ghrdp-cred-shim.js
      - payloads/ui.html
jobs:
  proof:
    runs-on: windows-latest
    # [F15] Headless-safe launcher invocations: a runner cannot show OR dismiss
    # a MessageBox, so the launcher logs the dialog first and suppresses it only
    # when this LAB-named switch is set (production always shows the dialog).
    # Every F15 assertion below is therefore on the JSONL msgbox line + the
    # beacon sequence + the exit code - never on a human click.
    # [F17] GHRDP_LAB_DNS_ALLOW_LOOPBACK=1 is the documented LAB-ONLY
    # relaxation of the client-DNS guard: lab cells reach the REAL launcher
    # through a hosts-file loopback alias (127.0.0.1), which production PCs
    # never do. Production main.yml never carries ANY GHRDP_LAB_ switch
    # (launch-gates F17 enforces this).
    env:
      GHRDP_LAB_NOMSG: '1'
      GHRDP_LAB_DNS_ALLOW_LOOPBACK: '1'
    steps:
      - uses: actions/checkout@v4

      - name: "A: install.cmd compiles + registers handler (zero-prompt path)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function A-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[A] stage=' + $Stage + ' :: ' + $Detail)
              Write-Host ('[A] FAIL (' + $Stage + '): ' + $Detail)
              exit 1
          }
          $lab = Join-Path $env:RUNNER_TEMP 'lab-a'
          function Read-Share([string]$Path) {
              # The launched launcher may still hold the redirected handle: read with
              # FileShare.ReadWrite so the capture is never blocked by a live child.
              try {
                  $fs = [System.IO.File]::Open($Path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
                  $sr = New-Object System.IO.StreamReader($fs)
                  $t = $sr.ReadToEnd(); $sr.Dispose(); $fs.Dispose(); return $t
              } catch { return '' }
          }
          New-Item -ItemType Directory -Path $lab -Force | Out-Null
          Copy-Item payloads\install.cmd (Join-Path $lab 'install.cmd') -Force
          Copy-Item payloads\ghrdp-rdp-launcher.cs (Join-Path $lab 'ghrdp-rdp-launcher.cs') -Force
          # The REAL double-click equivalent: a generated wrapper .cmd runs the
          # SHIPPED install.cmd with stdout+stderr going to a FILE (never a pipe):
          # the [F15 §2] self test starts the launcher, and a GUI child holding an
          # inherited pipe handle would keep this step open forever.
          $aOut = Join-Path $lab 'install-out.txt'
          $aWrap = Join-Path $lab 'run-install-a.cmd'
          [System.IO.File]::WriteAllText($aWrap, "@echo off`r`ncd /d ""%~dp0""`r`ncall ""%~dp0install.cmd"" < nul > ""%~dp0install-out.txt"" 2>&1`r`nexit /b %ERRORLEVEL%`r`n", [System.Text.Encoding]::ASCII)
          & cmd.exe /c $aWrap
          $code = $LASTEXITCODE
          $aTxt = ''
          $aTxt = Read-Share $aOut
          foreach ($l in ($aTxt -split "`r?`n")) { if ($l.Trim()) { Write-Host ('[install.cmd] ' + $l) } }
          Write-Host ('[A] install.cmd exit code = ' + $code)
          if ($code -ne 0) { A-Fail 'exit' ('install.cmd exit ' + $code + ' :: out=[' + (($aTxt -split "`r?`n" | Select-Object -Last 12) -join ' | ') + ']') }
          if (-not $aTxt -or $aTxt -notmatch 'SELF-TEST') { A-Fail 'no-output' ('install.cmd produced no readable output :: exists=' + (Test-Path -LiteralPath $aOut) + ' lab=[' + ((Get-ChildItem -LiteralPath $lab | ForEach-Object { $_.Name + '(' + $_.Length + ')' }) -join ', ') + ']') }
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { A-Fail 'exe' ('the compiled launcher is missing at ' + $exe) }
          $cmdReg = (Get-ItemProperty 'Registry::HKEY_CURRENT_USER\Software\Classes\ghrdp\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          if ($cmdReg -notmatch 'ghrdp-rdp-launcher\.exe') { A-Fail 'registry' ('the ghrdp protocol does not point at the launcher, command=' + $cmdReg) }
          Write-Host ('[A] exe=' + $exe + ' (' + (Get-Item -LiteralPath $exe).Length + ' bytes); HKCU command=' + $cmdReg)
          # [F15 §2] the install-time self test must have RUN: install.cmd prints
          # the notice + launches ghrdp://check, and the launcher logs its dialog
          # BEFORE showing it (suppressed here by GHRDP_LAB_NOMSG; the physical
          # MessageBox stays PENDING-USER). No log => the exe never ran.
          $csSrcA = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs'))
          $lLog = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-launcher.log'
          $lTxt = ''
          for ($i = 0; $i -lt 20 -and $lTxt -notmatch 'ghrdp launcher check'; $i++) {
              $lTxt = Read-Share $lLog
              if ($lTxt -notmatch 'ghrdp launcher check') { Start-Sleep -Milliseconds 500 }
          }
          Write-Host '[A] launcher log (F15 fail-visible JSONL):'
          foreach ($l in ($lTxt -split "`r?`n")) { if ($l.Trim()) { Write-Host ('  ' + $l) } }
          # [F19 §2] the launcher version is a REPO CONSTANT: read it from the
          # shipped source instead of hardcoding it (a version bump must never
          # break this cell again).
          $verM = [regex]::Match($csSrcA, 'private const string Ver = "(\d+(\.\d+){1,3})"')
          if (-not $verM.Success) { A-Fail 'version-constant' 'payloads/ghrdp-rdp-launcher.cs has no Ver constant' }
          $launcherStamp = 'ghrdp-rdp-launcher ' + $verM.Groups[1].Value
          foreach ($need in @('"verb":"check"', 'ghrdp launcher check', 'msgbox', 'msgbox-suppressed', $launcherStamp, 'HKCU')) {
              if ($lTxt -notmatch [regex]::Escape($need)) { A-Fail 'self-test-log' ('launcher log ' + $lLog + ' lacks ' + $need + ' :: tail=[' + (($lTxt -split "`r?`n" | Select-Object -Last 6) -join ' | ') + ']') }
          }
          $cs = [System.IO.File]::ReadAllText((Join-Path $lab 'ghrdp-rdp-launcher.cs'))
          $cmd = [System.IO.File]::ReadAllText((Join-Path $lab 'install.cmd'))
          if (($cs + $cmd) -match 'powershell\.exe|ExecutionPolicy|Invoke-Expression|EncodedCommand') { A-Fail 'script-host' 'script-host token found' }
          Write-Host '[A] PASS: compiled with in-box csc, HKCU ghrdp registered, ghrdp://check self test RAN (dialog logged), script-host free'
          'A_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
      - name: "B/C: ghrdp://rdp verb -> directives rdp + mstsc spawn + temp cleanup"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          $fqdn = 'lab-target.dekarita.tailnet-lab.ts.net'
          # emulate §6(a) post-install posture: handler present + cmdkey entry
          # SET (dummy lab credential, deleted at the end - never a real one).
          & cmdkey.exe /add:TERMSRV/$fqdn /user:labuser /pass:labdummy000 | Out-Null
          # [F17 §3] the client-DNS guard refuses to launch mstsc into an
          # unresolvable name (rc5, by design), so this cell resolves its fake
          # FQDN through the same hosts-file loopback alias cell P uses; the
          # job-level GHRDP_LAB_DNS_ALLOW_LOOPBACK=1 relaxation lets the REAL
          # launcher accept it (production PCs resolve real tailnet names).
          $hostsPath = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          try { $hTxt = [System.IO.File]::ReadAllText($hostsPath) } catch { $hTxt = '' }
          if ($hTxt -notmatch [regex]::Escape($fqdn)) {
              try { [System.IO.File]::AppendAllText($hostsPath, ("`r`n127.0.0.1 " + $fqdn + "`r`n")) } catch { Write-Host ('[B/C] hosts write failed: ' + $_.Exception.Message) }
              Write-Host ('[B/C] hosts: 127.0.0.1 ' + $fqdn)
          }
          # The handler-hello beacon posts to http://<fqdn>:7331; a fake lab
          # fqdn cannot be impersonated locally, so the ROUND-TRIP is proven in
          # step D against the REAL server instead (beacon failure is silent by
          # design and must not affect the launch - asserted via exit 0 here).
          # GHRDP_LAB_KEEP_RDP=1 keeps the temp .rdp so the lab can PROVE its
          # directives (it carries no credential lines - see F10-1).
          $env:GHRDP_LAB_KEEP_RDP = '1'
          # [F10-9] Start-Process -Wait waits for DESCENDANTS too: the launcher
          # spawns mstsc, and mstsc has no console on a headless runner, so -Wait
          # blocked forever (run 36147990362 wedged in this step). Wait on the
          # LAUNCHER PID with a bounded timeout instead, then reap mstsc here.
          $p = Start-Process -FilePath $exe -ArgumentList ('ghrdp://rdp?server=' + $fqdn + '&user=labuser') -PassThru
          if (-not $p.WaitForExit(90000)) {
              Write-Host '[B/C] FAIL: launcher did not exit within 90s'
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch { }
              exit 1
          }
          if ($p.ExitCode -ne 0) { Write-Host ('[B/C] FAIL: launcher exit ' + $p.ExitCode); exit 1 }
          $rdp = Get-ChildItem (Join-Path $env:TEMP 'ghrdp-*.rdp') | Select-Object -First 1
          if (-not $rdp) { Write-Host '[B/C] FAIL: temp rdp not written'; exit 1 }
          $text = [System.IO.File]::ReadAllText($rdp.FullName)
          $need = @('screen mode id:i:2','redirectclipboard:i:1','redirectprinters:i:1','redirectdrives:i:1','drivestoredirect:s:*','devicestoredirect:s:*','redirectcomports:i:1','redirectsmartcards:i:1','redirectposdevices:i:1','audiocapturemode:i:1','bandwidthautodetect:i:1','compression:i:1',('full address:s:' + $fqdn),'username:s:labuser')
          foreach ($d in $need) { if ($text -notmatch [regex]::Escape($d)) { Write-Host ('[B/C] FAIL: missing directive ' + $d); exit 1 } }
          foreach ($bad in @('password 51','desktopwidth','desktopheight','prompt for credentials:i:')) { if ($text -match [regex]::Escape($bad)) { Write-Host ('[B/C] FAIL: forbidden line ' + $bad); exit 1 } }
          # (b) mstsc spawned visible WITH the .rdp path on its command line.
          $mst = $null
          for ($i = 0; $i -lt 10 -and -not $mst; $i++) {
              $mst = Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-*.rdp*' } | Select-Object -First 1
              if (-not $mst) { Start-Sleep -Milliseconds 500 }
          }
          if (-not $mst) { Write-Host '[B/C] FAIL: mstsc with ghrdp rdp path not observed'; exit 1 }
          Write-Host ('[B/C] mstsc observed with rdp cmdline (pid ' + $mst.ProcessId + ')')
          # (c) fullscreen==client native: screen mode id:i:2 WITH no resolution
          # pins is the exact RDP contract for it (asserted above); screenshot
          # proof requires a physical console -> PENDING-USER cell.
          Add-Type -AssemblyName System.Windows.Forms
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host ('[B/C] client native resolution on this lab host: ' + $scr.Width + 'x' + $scr.Height)
          # hello beacon received? (best-effort - fqdn is fake so it 000s; the
          # REAL path posts to <fqdn>:7331 which the stub cannot impersonate,
          # so a loopback variant is proven in step D with the real server).
          & cmdkey.exe /delete:TERMSRV/$fqdn | Out-Null
          # [F10-9] reap the headless mstsc we spawned (it can never connect to
          # the fake lab fqdn) so the step cannot wedge and no orphan holds the
          # runner; the proof above already captured its command line.
          $reaped = 0
          foreach ($mp in (Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-*.rdp*' })) {
              try { Stop-Process -Id $mp.ProcessId -Force -ErrorAction Stop; $reaped++ } catch { }
          }
          Write-Host ('[B/C] mstsc reaped: ' + $reaped)
          Remove-Item $rdp.FullName -Force -ErrorAction SilentlyContinue
          Write-Host '[B/C] PASS: 14 directives exact, no cred/resolution lines, mstsc cmdline carries the local rdp, cleanup ok'
          'BC_result=pass' | Out-File $env:GITHUB_ENV -Append
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: "P: fail-visible launcher (beacon sequence, check verb, cmdkey timeout)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          function P-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[P] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'f15-classification.txt') -Encoding utf8 } catch { }
              try { if ($lst -and -not $lst.HasExited) { Stop-Process -Id $lst.Id -Force -ErrorAction SilentlyContinue } } catch { }
              exit 1
          }
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { P-Fail 'exe' 'launcher exe missing - cell A must have compiled it' }
          $log = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-launcher.log'
          $fqdn = 'lab-target.dekarita.tailnet-lab.ts.net'
          $cap = Join-Path $env:RUNNER_TEMP 'handler-hello-capture.jsonl'
          Remove-Item $cap -Force -ErrorAction SilentlyContinue
          $lst = $null
          function Cap-Lines { if (-not (Test-Path -LiteralPath $cap)) { return @() }; return @([System.IO.File]::ReadAllLines($cap) | Where-Object { $_ -and $_.Trim() }) }
          function Log-Text { try { return [System.IO.File]::ReadAllText($log) } catch { return '' } }
          # --- (1) the beacon target is the URL server arg: point that FQDN at
          # loopback so the REAL launcher POSTs land on the local listener.
          # hosts entry 127.0.0.1 lab-target.dekarita.tailnet-lab.ts.net -> the
          # launcher's real beacon target (http://<fqdn>:<lab port>) reaches the
          # listener. The listener gets its OWN port (7391), NOT the production
          # 7331: python's ThreadingHTTPServer sets SO_REUSEADDR, and on Windows
          # that lets two sockets bind the same port - the later D/E step must be
          # free to bind the REAL server on 7331 with no zombie listener in it.
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          try { $hTxt = [System.IO.File]::ReadAllText($hosts) } catch { P-Fail 'hosts-read' $_.Exception.Message }
          if ($hTxt -notmatch [regex]::Escape($fqdn)) {
              try { [System.IO.File]::AppendAllText($hosts, ("`r`n127.0.0.1 " + $fqdn + "`r`n")) } catch { P-Fail 'hosts-write' $_.Exception.Message }
              Write-Host ('[P] hosts: 127.0.0.1 ' + $fqdn)
          }
          # --- (2) python hello-listener on 127.0.0.1:7391 (a lab-only port; a
          # file-capture server - one verbatim POST body per line).
          $pyExe = (Get-Command python -ErrorAction SilentlyContinue)
          if (-not $pyExe) { $pyExe = (Get-Command py -ErrorAction SilentlyContinue) }
          if (-not $pyExe) { P-Fail 'python' 'no python interpreter available for the hello-listener' }
          $py = Join-Path $env:RUNNER_TEMP 'handler-hello-listener.py'
          $pyLines = @(
              "import sys, threading",
              "from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer",
              "cap = sys.argv[1]",
              "lock = threading.Lock()",
              "class H(BaseHTTPRequestHandler):",
              "    protocol_version = 'HTTP/1.1'",
              "    def do_POST(self):",
              "        n = int(self.headers.get('Content-Length') or 0)",
              "        body = self.rfile.read(n).decode('utf-8', 'replace') if n else ''",
              "        with lock:",
              "            with open(cap, 'a', encoding='utf-8') as f:",
              "                f.write(self.path + ' ' + body + '\n')",
              "        out = b'{""ok"":true}'",
              "        self.send_response(200)",
              "        self.send_header('Content-Type', 'application/json')",
              "        self.send_header('Content-Length', str(len(out)))",
              "        self.end_headers()",
              "        self.wfile.write(out)",
              "    def log_message(self, *a):",
              "        pass",
              "ThreadingHTTPServer(('127.0.0.1', 7391), H).serve_forever()"
          )
          [System.IO.File]::WriteAllText($py, ($pyLines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          $lst = Start-Process -FilePath $pyExe.Source -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $diag 'f15-listener.log') -RedirectStandardError (Join-Path $diag 'f15-listener-err.log') -ArgumentList ('-u "' + $py + '" "' + $cap + '"')
          $up = $false
          $labPort = 7391
          for ($i = 0; $i -lt 30 -and -not $up; $i++) { try { $up = [bool](Get-NetTCPConnection -LocalPort $labPort -State Listen -ErrorAction Stop) } catch { }; if (-not $up) { Start-Sleep -Milliseconds 500 } }
          if (-not $up) {
              $errTxt = ''; try { $errTxt = ([System.IO.File]::ReadAllText((Join-Path $diag 'f15-listener-err.log'))).Trim() } catch { }
              P-Fail 'listener-listen' ('the python hello-listener never bound 127.0.0.1:7331; stderr=[' + $errTxt + ']')
          }
          Write-Host ('[P] python hello-listener up on 127.0.0.1:' + $labPort + ' (capture ' + $cap + ')')
          # --- (3) ghrdp://check with NO server arg: the MessageBox path is
          # taken (and logged) and NO beacon may be posted (§1.5).
          $n0 = (Cap-Lines).Count
          $p = Start-Process -FilePath $exe -ArgumentList 'ghrdp://check' -PassThru
          if (-not $p.WaitForExit(60000)) { P-Fail 'check-wait' 'ghrdp://check did not exit within 60s' }
          if ($p.ExitCode -ne 0) { P-Fail 'check-exit' ('ghrdp://check exit code ' + $p.ExitCode) }
          $logTxt = Log-Text
          $verP = [regex]::Match([System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs')), 'private const string Ver = "(\d+(\.\d+){1,3})"')
          if (-not $verP.Success) { P-Fail 'version-constant' 'payloads/ghrdp-rdp-launcher.cs has no Ver constant' }
          $launcherStampP = 'ghrdp-rdp-launcher ' + $verP.Groups[1].Value
          foreach ($need in @('"verb":"check"', 'ghrdp launcher check', 'msgbox', 'msgbox-suppressed', $launcherStampP, 'HKCU')) {
              if ($logTxt -notmatch [regex]::Escape($need)) { P-Fail 'check-log' ('launcher log lacks ' + $need) }
          }
          if ((Cap-Lines).Count -ne $n0) { P-Fail 'check-beacon' 'a server-less ghrdp://check must not post a beacon' }
          Write-Host '[P] PASS check(no server): dialog logged (msgbox + lab suppression), no beacon'
          # --- (4) ghrdp://check?server=<fqdn>: the check beacon IS posted.
          $n1 = (Cap-Lines).Count
          $p = Start-Process -FilePath $exe -ArgumentList ('ghrdp://check?server=' + $fqdn + '&port=' + $labPort) -PassThru
          if (-not $p.WaitForExit(60000)) { P-Fail 'check2-wait' 'ghrdp://check?server= did not exit within 60s' }
          if ($p.ExitCode -ne 0) { P-Fail 'check2-exit' ('ghrdp://check exit code ' + $p.ExitCode) }
          $c2 = @(Cap-Lines)
          if ($c2.Count -le $n1) { P-Fail 'check2-beacon' 'no beacon posted for ghrdp://check?server=<fqdn>' }
          $last = $c2[$c2.Count - 1]
          foreach ($need in @('"verb":"check"', '"details":"check-shown"', '"ok":true')) {
              if ($last -notmatch [regex]::Escape($need)) { P-Fail 'check2-body' ('last beacon lacks ' + $need + ' :: ' + $last) }
          }
          Write-Host ('[P] PASS check(server): beacon ' + $last)
          # --- (5) rdp verb, credential stored: invoked -> cmdkey-stored=true ->
          # mstsc-started pid=N (the silent-after-first-launch contract).
          & cmdkey.exe /add:TERMSRV/$fqdn /user:labuser /pass:labdummy000 | Out-Null
          $n2 = (Cap-Lines).Count
          $env:GHRDP_LAB_KEEP_RDP = '1'
          $p = Start-Process -FilePath $exe -ArgumentList ('ghrdp://rdp?server=' + $fqdn + '&user=labuser&port=' + $labPort) -PassThru
          if (-not $p.WaitForExit(150000)) { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch { }; P-Fail 'rdp-wait' 'the rdp verb did not exit within 150s' }
          if ($p.ExitCode -ne 0) { P-Fail 'rdp-exit' ('rdp verb exit ' + $p.ExitCode) }
          $seq = @((Cap-Lines) | Select-Object -Skip $n2)
          Write-Host ('[P] rdp beacon sequence: ' + ($seq -join ' | '))
          if ($seq.Count -lt 3) { P-Fail 'rdp-seq' ('expected >=3 beacons, got ' + $seq.Count) }
          if ($seq[0] -notmatch '"details":"invoked"') { P-Fail 'rdp-seq0' $seq[0] }
          if ($seq[1] -notmatch '"details":"cmdkey-stored=true"') { P-Fail 'rdp-seq1' $seq[1] }
          if ($seq[2] -notmatch '"details":"mstsc-started pid=') { P-Fail 'rdp-seq2' $seq[2] }
          $rdp = Get-ChildItem (Join-Path $env:TEMP 'ghrdp-*.rdp') -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $rdp) { P-Fail 'rdp-file' 'no ghrdp-*.rdp was written by the rdp verb' }
          $rdpTxt = [System.IO.File]::ReadAllText($rdp.FullName)
          if ($rdpTxt -notmatch 'screen mode id:i:2') { P-Fail 'rdp-fullscreen' 'the temp .rdp lacks fullscreen' }
          foreach ($bad in @('password', 'prompt for credentials')) { if ($rdpTxt -match [regex]::Escape($bad)) { P-Fail 'rdp-cred' ('the temp .rdp carries ' + $bad) } }
          $mst = $null
          for ($i = 0; $i -lt 10 -and -not $mst; $i++) {
              $mst = Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like ('*' + $rdp.Name + '*') } | Select-Object -First 1
              if (-not $mst) { Start-Sleep -Milliseconds 500 }
          }
          if ($mst) {
              Write-Host ('[P] mstsc observed pid=' + $mst.ProcessId + ' with the local ghrdp rdp on its command line')
              foreach ($mp in (Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-*.rdp*' })) { try { Stop-Process -Id $mp.ProcessId -Force -ErrorAction Stop } catch { } }
          } else {
              Write-Host '[P] note: mstsc had already exited the 2s probe window; the mstsc-started beacon above is the launch proof (cell B/C observes the cmdline)'
          }
          Write-Host '[P] PASS rdp(stored): invoked -> cmdkey-stored=true -> mstsc-started pid=N, .rdp directives verified, no credential line'
          # --- (6) rdp verb, NO credential + a lab-shortened prompt bound: the
          # timeout branch must be VISIBLE (dialog logged, ok:false, rc 1) and
          # mstsc must NOT start.
          & cmdkey.exe /delete:TERMSRV/$fqdn | Out-Null
          $n3 = (Cap-Lines).Count
          $env:GHRDP_LAB_CMDKEY_TIMEOUT_MS = '8000'
          $p = Start-Process -FilePath $exe -ArgumentList ('ghrdp://rdp?server=' + $fqdn + '&user=labuser&port=' + $labPort) -PassThru
          if (-not $p.WaitForExit(150000)) { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch { }; P-Fail 'timeout-wait' 'the timeout branch did not exit within 150s' }
          if ($p.ExitCode -ne 1) { P-Fail 'timeout-exit' ('expected exit 1 (cmdkey prompt timed out), got ' + $p.ExitCode) }
          $seq2 = @((Cap-Lines) | Select-Object -Skip $n3)
          Write-Host ('[P] timeout beacon sequence: ' + ($seq2 -join ' | '))
          if ($seq2.Count -lt 3) { P-Fail 'timeout-seq' ('expected >=3 beacons, got ' + $seq2.Count) }
          if ($seq2[0] -notmatch '"details":"invoked"') { P-Fail 'timeout-seq0' $seq2[0] }
          if ($seq2[1] -notmatch '"details":"cmdkey-shown"') { P-Fail 'timeout-seq1' $seq2[1] }
          if ($seq2[2] -notmatch '"details":"cmdkey-timeout"' -or $seq2[2] -notmatch '"ok":false') { P-Fail 'timeout-seq2' $seq2[2] }
          if (($seq2 -join ' ') -match 'mstsc-started') { P-Fail 'timeout-mstsc' 'a timed-out credential prompt must NOT start mstsc' }
          if ((Log-Text) -notmatch [regex]::Escape('cmdkey prompt timed out')) { P-Fail 'timeout-msgbox' 'the cmdkey-timeout MessageBox was not logged' }
          Write-Host '[P] PASS timeout: invoked -> cmdkey-shown -> cmdkey-timeout (ok:false, rc 1), dialog logged, mstsc NOT started'
          Remove-Item Env:GHRDP_LAB_CMDKEY_TIMEOUT_MS -ErrorAction SilentlyContinue
          # --- (7) JSONL log contract: one object per line, dialogs logged, and
          # no credential-looking value anywhere (redaction).
          $lines = @([System.IO.File]::ReadAllLines($log) | Where-Object { $_ -and $_.Trim() })
          if ($lines.Count -lt 12) { P-Fail 'log-lines' ('launcher log only has ' + $lines.Count + ' lines') }
          $msgbox = 0
          foreach ($l in $lines) {
              if ($l -notmatch '^\{"ts":"') { P-Fail 'log-jsonl' ('not a JSONL line: ' + $l) }
              if ($l -match '"level":"msgbox"') { $msgbox++ }
          }
          if ($msgbox -lt 2) { P-Fail 'log-msgbox' ('expected >=2 logged dialogs, saw ' + $msgbox) }
          $redact = @($lines | Where-Object { $_ -match '/pass:[^"]|passwd[=:]|password[=:][^ ]' }).Count
          if ($redact -ne 0) { P-Fail 'log-redaction' 'a credential-looking value survived into the launcher log' }
          Write-Host ('[P] PASS log: ' + $lines.Count + ' JSONL lines, ' + $msgbox + ' logged dialogs, zero credential-looking tokens')
          # --- (8) cleanup: listener, hosts entry, temp rdp, dummy cmdkey entry.
          try { Stop-Process -Id $lst.Id -Force -ErrorAction Stop } catch { }
          # the lab listener must be GONE (and its port free) before later cells
          # start the real server: never leave a zombie socket on a lab port.
          for ($i = 0; $i -lt 20 -and $lst -and -not $lst.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          for ($i = 0; $i -lt 20; $i++) { if (-not (Get-NetTCPConnection -LocalPort $labPort -State Listen -ErrorAction SilentlyContinue)) { break }; Start-Sleep -Milliseconds 500 }
          if (Get-NetTCPConnection -LocalPort $labPort -State Listen -ErrorAction SilentlyContinue) { P-Fail 'listener-zombie' ('port ' + $labPort + ' still listening after the cleanup kill') }
          try {
              $h3 = (([System.IO.File]::ReadAllText($hosts)) -split "`r?`n" | Where-Object { $_ -notmatch [regex]::Escape($fqdn) }) -join "`r`n"
              [System.IO.File]::WriteAllText($hosts, $h3)
          } catch { }
          Remove-Item (Join-Path $env:TEMP 'ghrdp-*.rdp') -Force -ErrorAction SilentlyContinue
          & cmdkey.exe /delete:TERMSRV/$fqdn | Out-Null
          # cmdkey /delete leaves a non-zero $LASTEXITCODE behind when the dummy
          # entry was already gone; the runner wrapper exits with $LASTEXITCODE,
          # so an all-green P step would look failed. Clamp it.
          $global:LASTEXITCODE = 0
          Write-Host ('::notice::[P] fail-visible launcher: ' + ($seq -join ' -> '))
          Write-Host ('::notice::[P] timeout branch: ' + ($seq2 -join ' -> '))
          Write-Host ('::notice::[P] check verb dialog logged, no server-less beacon, JSONL ' + $lines.Count + ' lines with ' + $msgbox + ' dialogs')
          'P_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          ('P_seq=' + ($seq -join ' -> ')) | Out-File $env:GITHUB_ENV -Append
          ('P_timeout=' + ($seq2 -join ' -> ')) | Out-File $env:GITHUB_ENV -Append
          $global:LASTEXITCODE = 0
          exit 0

      - name: "D/E: server native-status fields + gated creds + ping loop"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          # [F10-13] every D/E failure is classified + captured here so the next
          # red run is diagnosable from an artifact/annotation alone (runner logs
          # were unreachable for 36149313677/36149471496).
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          # lab config with DUMMY lab-only credentials (not secrets).
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), (@{
              dnsName = 'lab-host.dekarita.tailnet-lab.ts.net'; rdpUser = 'labuser'
              rdpPass = 'LABDUMMY-win-9876'; vncPass = 'LABDUMMY-vnc-5432'; rdpIp = '100.118.42.7'
          } | ConvertTo-Json -Compress), $utf8)
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), 'lab-dash-token-0123456789', $utf8)
          $srv = $null
          function DE-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[D/E] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'classification.txt') -Encoding utf8 } catch { }
              try { if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue } } catch { }
              exit 1
          }
          # start the REAL server script (same script production runs).
          $srvOut = Join-Path $diag 'server-out.log'; $srvErr = Join-Path $diag 'server-err.log'
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { try { $ok = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok) {
              $okTxt = ''; try { $okTxt = ([System.IO.File]::ReadAllText((Join-Path $root 'server-ok.txt'))).Trim() } catch { }
              $errTail = ''; try { $errTail = ((Get-Content $srvErr -Tail 6 -ErrorAction SilentlyContinue) -join ' | ') } catch { }
              DE-Fail 'listen' ('server never listened on 7331; exited=' + $(if ($srv.HasExited) { $srv.ExitCode } else { 'no' }) + '; server-ok=[' + $okTxt + ']; stderr=[' + $errTail + ']')
          }
          $owner = Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($owner -and $owner.OwningProcess -ne $srv.Id) {
              $op = Get-Process -Id $owner.OwningProcess -ErrorAction SilentlyContinue
              DE-Fail 'port-stuck' ('7331 is bound by pid=' + $owner.OwningProcess + ' (' + $(if ($op) { $op.ProcessName } else { 'gone' }) + '), not the lab server pid=' + $srv.Id)
          }
          $base = 'http://127.0.0.1:7331'
          # [F10-14] LOOPBACK CALLS MUST BYPASS ANY PROXY: the first D/E failure
          # (annotation stage=config-unauth, 401) came from Invoke-RestMethod
          # honouring a system/env proxy for 127.0.0.1 instead of talking to the
          # server. Raw HttpWebRequest with Proxy = $null + body capture on error
          # (so the next failure names the HTTP status AND the response body).
          Write-Host ('[D/E] proxy diag: HTTP_PROXY=[' + [string]$env:HTTP_PROXY + '] HTTPS_PROXY=[' + [string]$env:HTTPS_PROXY + '] NO_PROXY=[' + [string]$env:NO_PROXY + '] DefaultWebProxy=[' + [string]([System.Net.WebRequest]::DefaultWebProxy) + ']')
          function Invoke-LabJson([string]$Url, [string]$Method = 'GET', [string]$Body = '') {
              $req = [System.Net.HttpWebRequest]::Create($Url)
              $req.Method = $Method
              $req.Proxy = $null
              $req.Timeout = 10000
              $req.ReadWriteTimeout = 10000
              $req.KeepAlive = $false
              $req.UserAgent = 'ghrdp-lab'
              if ($Body) {
                  $b = [System.Text.Encoding]::UTF8.GetBytes($Body)
                  $req.ContentType = 'application/json'
                  $req.ContentLength = $b.Length
                  $st = $req.GetRequestStream(); $st.Write($b, 0, $b.Length); $st.Close()
              }
              try { $resp = $req.GetResponse() }
              catch [System.Net.WebException] {
                  $r = $_.Exception.Response
                  $code = 0; $txt = ''
                  if ($r) { $code = [int]$r.StatusCode; try { $sr = New-Object System.IO.StreamReader($r.GetResponseStream()); $txt = $sr.ReadToEnd(); $sr.Close() } catch { } }
                  throw ('HTTP ' + $code + ' body=[' + $txt.Substring(0, [Math]::Min(200, $txt.Length)) + '] ' + $Url)
              }
              $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $t = $sr.ReadToEnd(); $sr.Close(); $resp.Close()
              return ($t | ConvertFrom-Json)
          }
          try { $plain = Invoke-LabJson ($base + '/api/config') }
          catch { DE-Fail 'config-unauth' $_.Exception.Message }
          try {
              if ($plain.creds.PSObject.Properties['windowsPass']) { DE-Fail 'creds-leak' 'unauthenticated loopback received windowsPass' }
          } catch { DE-Fail 'config-shape' ($_.Exception.Message + ' :: body=' + ($plain | ConvertTo-Json -Compress -Depth 4)) }
          try { $gated = Invoke-LabJson ($base + '/api/config?key=lab-dash-token-0123456789') }
          catch { DE-Fail 'config-gated' $_.Exception.Message }
          if ($gated.creds.windowsPass -ne 'LABDUMMY-win-9876') { DE-Fail 'gated-windowsPass' ('got=[' + [string]$gated.creds.windowsPass + ']') }
          if ($gated.creds.vncPass -ne 'LABDUMMY-vnc-5432') { DE-Fail 'gated-vncPass' ('got=[' + [string]$gated.creds.vncPass + ']') }
          if ($gated.creds.windowsPassMask -notmatch '\*+9876$') { DE-Fail 'gated-mask' ('mask=[' + [string]$gated.creds.windowsPassMask + ']') }
          Write-Host '[D] PASS: creds served ONLY to token request; last-4 mask verified; loopback clean'
          # native-status carries the new telemetry fields (values may be null
          # on a session-less lab host - the KEYS are the contract).
          try { $ns = Invoke-LabJson ($base + '/api/native-status?key=lab-dash-token-0123456789') }
          catch { DE-Fail 'native-status' $_.Exception.Message }
          foreach ($k in @('rdpLogonAgeSec','pingMs','pingPath','pingTarget')) { if (-not ($ns.PSObject.Properties.Name -contains $k)) { DE-Fail 'native-status-field' ('missing ' + $k) } }
          # rdp-ping loop wrote a sample (tailscale absent in lab => path unknown).
          $pj = $null
          for ($i = 0; $i -lt 10 -and -not $pj; $i++) { if (Test-Path 'C:\ghrdp\rdp-ping.json') { try { $pj = Get-Content 'C:\ghrdp\rdp-ping.json' -Raw | ConvertFrom-Json } catch { } }; if (-not $pj) { Start-Sleep -Seconds 2 } }
          if (-not $pj -or -not $pj.ts) { DE-Fail 'rdp-ping' ('rdp-ping.json missing/empty; dir=' + ((Get-ChildItem $root -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',')) }
          # handler-hello beacon round-trip (the launcher-observable endpoint).
          try { $hh = Invoke-LabJson ($base + '/api/handler-hello?key=lab-dash-token-0123456789') 'POST' '{"verb":"rdp-launch","ok":true,"details":"lab"}' }
          catch { DE-Fail 'handler-hello' $_.Exception.Message }
          if (-not $hh.ok) { DE-Fail 'handler-hello-shape' ($hh | ConvertTo-Json -Compress) }
          try { Stop-Process -Id $srv.Id -Force } catch { }
          Write-Host '[D/E] PASS: fields present, ping sample written, hello beacon accepted'
          'DE_result=pass' | Out-File $env:GITHUB_ENV -Append

      - name: "D/E diagnostics artifact (survives halts)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autologin-lab-de-diag
          path: de-diag
          if-no-files-found: ignore

      - name: "R: F17 listener probe break/fix + dns-guard + beacon age"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          function R-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[R] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'f17-classification.txt') -Encoding utf8 } catch { }
              exit 1
          }
          $root = 'C:\ghrdp-lab-f17'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $fqdn = 'lab-host.dekarita.tailnet-lab.ts.net'
          try { Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue } catch { }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), (@{ dnsName = $fqdn; rdpUser = 'labuser'; rdpIp = '100.118.42.7' } | ConvertTo-Json -Compress), $utf8)
          # --- baseline: mirror the production enablement so the §1 probe has a
          # REAL host to probe (3389 listening, NLA=1, rule ghrdp-rdp-3389
          # scoped to 100.64.0.0/10, a certificate valid for the FQDN).
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -Type DWord
          try { Set-Service TermService -StartupType Automatic -ErrorAction Stop } catch { }
          try { Start-Service TermService -ErrorAction SilentlyContinue } catch { }
          Get-NetFirewallRule -DisplayName 'ghrdp-rdp-3389' -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'ghrdp-rdp-3389' -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -RemoteAddress '100.64.0.0/10' -Profile Any -Enabled True | Out-Null
          $lc = New-SelfSignedCertificate -DnsName $fqdn -CertStoreLocation 'Cert:\LocalMachine\My' -NotAfter (Get-Date).AddDays(2)
          # Trust only this ephemeral lab cert so the production probe's full
          # X509Chain.Build check is exercised without relaxing production.
          $labRoot = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', 'LocalMachine')
          try { $labRoot.Open('ReadWrite'); $labRoot.Add($lc) } finally { $labRoot.Close() }
          $hash = -split ($lc.Thumbprint -replace '(..)', '$1 ') | ForEach-Object { [byte]("0x$_") }
          New-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SSLCertificateSHA1Hash' -PropertyType Binary -Value $hash -Force | Out-Null
          try { Restart-Service TermService -Force -ErrorAction SilentlyContinue } catch { }
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) { try { $up = [bool](Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded } catch { }; if (-not $up) { Start-Sleep -Seconds 2 } }
          if (-not $up) { R-Fail 'baseline' 'TermService never accepted TCP 127.0.0.1:3389 on the lab runner' }
          Write-Host '[R] baseline OK: 3389 listening, NLA=1, rule ghrdp-rdp-3389 scoped, cert bound'
          # --- extract the §1 probe VERBATIM from main.yml (byte-faithful to the
          # step production runs; the launch-gates F17 block pins the markers).
          $wfPath = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\main.yml'
          $wf = [System.IO.File]::ReadAllText($wfPath)
          $b0 = $wf.IndexOf('# [F17 §1 probe-begin]')
          $b1 = $wf.IndexOf('# [F17 §1 probe-end]')
          if ($b0 -lt 0 -or $b1 -lt 0 -or $b1 -le $b0) { R-Fail 'extract' 'F17 probe markers missing in main.yml' }
          $segLines = ($wf.Substring($b0, $b1 - $b0) -split "`r?`n") | Where-Object { $_ -notmatch 'probe-begin|probe-end' }
          $probeScript = "`$ErrorActionPreference = 'Continue'`n`$S = `$null`n`$root = '$root'`n" + (($segLines | ForEach-Object { $_ -replace '^          ', '' }) -join "`n")
          $probePath = Join-Path $env:RUNNER_TEMP 'f17-probe.ps1'
          [System.IO.File]::WriteAllText($probePath, $probeScript, $utf8)
          function Invoke-Probe {
              $out = ''
              try { $out = (@(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probePath 2>&1) | Out-String) } catch { $out = [string]$_ }
              [pscustomobject]@{ rc = $LASTEXITCODE; out = $out }
          }
          function Get-Rl {
              ([System.IO.File]::ReadAllText((Join-Path $root 'config.json')) | ConvertFrom-Json).rdpListener
          }
          # (1) baseline probe PASSES with every field ✅
          $r1 = Invoke-Probe
          if ($r1.rc -ne 0) { R-Fail 'probe-baseline' ($r1.out.Substring(0, [Math]::Min(400, $r1.out.Length))) }
          $rl1 = Get-Rl
          foreach ($kv in @(@('listening', $true), @('termServiceOk', $true), @('fwRule', $true), @('certChainOk', $true), @('certOk', $true), @('nla', $true), @('ok', $true))) {
              if ($rl1.($kv[0]) -ne $kv[1]) { R-Fail 'probe-baseline-field' ($kv[0] + ' expected ' + $kv[1] + ' got [' + $rl1.($kv[0]) + ']') }
          }
          if ($rl1.fwScope -ne '100.64.0.0/10') { R-Fail 'probe-scope' ('fwScope=[' + $rl1.fwScope + ']') }
          Write-Host '[R] (1) PASS: baseline probe all-✅ (listening/termService/fw/cert/nla), fwScope=100.64.0.0/10'
          # (2) BREAK on purpose: disable the 3389 rule => probe reports
          # fwRule=false and FAILS LOUD (::error::[F17] + non-zero exit), while
          # listening stays true and config.rdpListener still carries the ❌ field.
          Disable-NetFirewallRule -DisplayName 'ghrdp-rdp-3389'
          $r2 = Invoke-Probe
          if ($r2.rc -eq 0) { R-Fail 'break-not-loud' 'probe exited 0 with the 3389 rule disabled' }
          if ($r2.out -notmatch '::error::\[F17\]') { R-Fail 'break-not-loud' 'no ::error::[F17] annotation on the broken run' }
          $rl2 = Get-Rl
          if ($rl2.fwRule -ne $false) { R-Fail 'break-field' ('fwRule expected false, got [' + $rl2.fwRule + ']') }
          if ($rl2.listening -ne $true) { R-Fail 'break-field' 'listening must stay true while only the RULE is disabled' }
          Write-Host '[R] (2) PASS: disabled 3389 rule => probe fails LOUD with fwRule=false (rdpListener still written)'
          # (3) FIX: re-enable => all ✅ again
          Enable-NetFirewallRule -DisplayName 'ghrdp-rdp-3389'
          $r3 = Invoke-Probe
          if ($r3.rc -ne 0) { R-Fail 're-fix' ($r3.out.Substring(0, [Math]::Min(400, $r3.out.Length))) }
          $rl3 = Get-Rl
          if ($rl3.fwRule -ne $true -or $rl3.ok -ne $true) { R-Fail 're-fix-field' 'fwRule/ok not ✅ after re-enable' }
          Write-Host '[R] (3) PASS: re-enabled rule => probe all-✅ again'
          # (4) SCOPE drift self-heal: a second range is FIXED back to EXACTLY
          # 100.64.0.0/10 (fwFixed=true), never widened.
          Get-NetFirewallRule -DisplayName 'ghrdp-rdp-3389' | Set-NetFirewallRule -RemoteAddress @('100.64.0.0/10', '10.0.0.0/8')
          $r4 = Invoke-Probe
          if ($r4.rc -ne 0) { R-Fail 'scope-heal' ($r4.out.Substring(0, [Math]::Min(400, $r4.out.Length))) }
          $rl4 = Get-Rl
          if ($rl4.fwScope -ne '100.64.0.0/10' -or $rl4.fwFixed -ne $true) { R-Fail 'scope-heal-field' ('scope=[' + $rl4.fwScope + '] fixed=[' + $rl4.fwFixed + ']') }
          Write-Host '[R] (4) PASS: drifted scope self-healed to exactly 100.64.0.0/10 (fwFixed=true)'
          # (5) native-status renders the fields (REAL server on lab port 7392).
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), 'lab-dash-token-f17-0123456789', $utf8)
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $diag 'f17-server-out.log') -RedirectStandardError (Join-Path $diag 'f17-server-err.log') -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1", '-Port', '7392', '-Root', $root
          $listen = $false
          for ($i = 0; $i -lt 40 -and -not $listen; $i++) { try { $listen = [bool](Get-NetTCPConnection -LocalPort 7392 -State Listen -ErrorAction Stop) } catch { }; if (-not $listen) { Start-Sleep -Milliseconds 500 } }
          if (-not $listen) {
              $errTail = ''; try { $errTail = ((Get-Content (Join-Path $diag 'f17-server-err.log') -Tail 6 -ErrorAction SilentlyContinue) -join ' | ') } catch { }
              R-Fail 'server-listen' ('server never listened on 7392; stderr=[' + $errTail + ']')
          }
          function Invoke-LabJson([string]$Url, [string]$Method = 'GET', [string]$Body = '') {
              $req = [System.Net.HttpWebRequest]::Create($Url)
              $req.Method = $Method
              $req.Proxy = $null
              $req.Timeout = 10000
              $req.ReadWriteTimeout = 10000
              $req.KeepAlive = $false
              if ($Body) {
                  $b = [System.Text.Encoding]::UTF8.GetBytes($Body)
                  $req.ContentType = 'application/json'
                  $req.ContentLength = $b.Length
                  $st = $req.GetRequestStream(); $st.Write($b, 0, $b.Length); $st.Close()
              }
              try { $resp = $req.GetResponse() }
              catch [System.Net.WebException] {
                  $r = $_.Exception.Response
                  $code = 0; $txt = ''
                  if ($r) { $code = [int]$r.StatusCode; try { $sr = New-Object System.IO.StreamReader($r.GetResponseStream()); $txt = $sr.ReadToEnd(); $sr.Close() } catch { } }
                  throw ('HTTP ' + $code + ' body=[' + $txt.Substring(0, [Math]::Min(200, $txt.Length)) + '] ' + $Url)
              }
              $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $t = $sr.ReadToEnd(); $sr.Close(); $resp.Close()
              return ($t | ConvertFrom-Json)
          }
          function Invoke-LabRaw([string]$Url) {
              # [F17] raw body: ConvertFrom-Json converts ISO ts strings into
              # LOCAL [datetime] objects (the exact bug F17 fixes server-side),
              # so UTC-wire-format assertions read the RAW text.
              $req = [System.Net.HttpWebRequest]::Create($Url)
              $req.Method = 'GET'
              $req.Proxy = $null
              $req.Timeout = 10000
              $req.ReadWriteTimeout = 10000
              $resp = $req.GetResponse()
              $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $t = $sr.ReadToEnd(); $sr.Close(); $resp.Close()
              return $t
          }
          try { $ns = Invoke-LabJson ('http://127.0.0.1:7392/api/native-status?key=lab-dash-token-f17-0123456789') }
          catch { R-Fail 'native-status' $_.Exception.Message }
          if (-not $ns.rdpListener) { R-Fail 'native-status-field' 'rdpListener missing from /api/native-status' }
          foreach ($kv in @(@('listening', $true), @('fwRule', $true), @('certOk', $true), @('nla', $true), @('ok', $true))) {
              if ($ns.rdpListener.($kv[0]) -ne $kv[1]) { R-Fail 'native-status-field' ('rdpListener.' + $kv[0] + ' expected ' + $kv[1] + ' got [' + $ns.rdpListener.($kv[0]) + ']') }
          }
          if ($null -eq $ns.rdpListenerAgeSec -or $ns.rdpListenerAgeSec -lt 0 -or $ns.rdpListenerAgeSec -gt 120) { R-Fail 'listener-age' ('rdpListenerAgeSec=[' + $ns.rdpListenerAgeSec + ']') }
          Write-Host '[R] (5) PASS: native-status renders rdpListener (listening/fw/cert/nla/ok ✅) + age'
          # (6) beacon age <60s right after a check verb + the echoed ts is
          # explicit UTC (ends with Z - the +05:30 beacon-age fix).
          try { $null = Invoke-LabJson ('http://127.0.0.1:7392/api/handler-hello?key=lab-dash-token-f17-0123456789') 'POST' '{"verb":"check","ok":true,"details":"f17-lab-check"}' }
          catch { R-Fail 'hello-post' $_.Exception.Message }
          try { $ns2 = Invoke-LabJson ('http://127.0.0.1:7392/api/native-status?key=lab-dash-token-f17-0123456789') }
          catch { R-Fail 'native-status-2' $_.Exception.Message }
          if ($null -eq $ns2.handlerSeenAgeSec -or $ns2.handlerSeenAgeSec -lt 0 -or $ns2.handlerSeenAgeSec -ge 60) { R-Fail 'beacon-age' ('handlerSeenAgeSec=[' + $ns2.handlerSeenAgeSec + '] - not <60s right after a check verb') }
          if (-not $ns2.lastHandlerVerb -or $ns2.lastHandlerVerb.verb -ne 'check') { R-Fail 'beacon-verb' ('verb=[' + $ns2.lastHandlerVerb.verb + ']') }
          $raw2 = Invoke-LabRaw ('http://127.0.0.1:7392/api/native-status?key=lab-dash-token-f17-0123456789')
          if ($raw2 -notmatch '"ts":"\d{4}-\d{2}-\d{2}T[0-9:.]+Z"') { R-Fail 'beacon-ts-utc' ('wire ts not explicit UTC ISO-Z in [' + $raw2.Substring(0, [Math]::Min(300, $raw2.Length)) + ']') }
          Write-Host ('[R] (6) PASS: beacon age ' + $ns2.handlerSeenAgeSec + 's <60s right after the check verb; ts ends with Z')
          try { Stop-Process -Id $srv.Id -Force } catch { }
          # (7) client-DNS guard, REAL launcher: a NON-tailnet resolution is
          # blocked (rc5, dns-guard logged, NO cmdkey/mstsc), and the loopback
          # alias flows through ONLY with the lab-named switch.
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { R-Fail 'exe' 'launcher exe missing - cell A must have compiled it' }
          $log = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-launcher.log'
          function Set-HostAlias([string]$Ip) {
              $hostsPath = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
              $txt = ([System.IO.File]::ReadAllText($hostsPath) -split "`r?`n" | Where-Object { $_ -notmatch [regex]::Escape($fqdn) }) -join "`r`n"
              if ($Ip) { $txt += "`r`n$Ip $fqdn`r`n" }
              [System.IO.File]::WriteAllText($hostsPath, $txt)
          }
          function New-Lines([int]$Skip) { @(Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Skip $Skip) }
          function Log-Lines([int]$Count) { (@(Get-Content $log -ErrorAction SilentlyContinue) | Measure-Object -Line).Lines }
          Set-HostAlias '93.184.215.14'
          $env:GHRDP_LAB_DNS_ALLOW_LOOPBACK = ''
          $before6 = [int](Log-Lines 0)
          & $exe ("ghrdp://rdp?server=" + $fqdn + "&user=labuser") | Out-Null
          $rc6 = $LASTEXITCODE
          $nl6 = New-Lines $before6
          if ($rc6 -ne 5) { R-Fail 'guard-not-blocked' ('rc=' + $rc6 + ' (expected 5)') }
          if (-not (($nl6 | Out-String) -match 'dns-guard blocked launch')) { R-Fail 'guard-log' 'no dns-guard blocked-launch log line' }
          # the LOG strings are 'prompt shown' / 'started pid=' (mstsc-started /
          # cmdkey-shown are the BEACON details, not JSONL lines).
          if (($nl6 | Out-String) -match 'prompt shown|started pid=') { R-Fail 'guard-leak' 'cmdkey/mstsc ran despite the DNS guard' }
          Write-Host '[R] (7) PASS: non-tailnet resolution => rc=5, dns-guard logged, mstsc NOT started'
          # Mixed DNS answers are unsafe even if one answer is tailnet: prove
          # the launcher blocks the full answer set before testing lab loopback.
          Set-HostAlias '100.118.42.7'
          Add-Content -LiteralPath (Join-Path $env:SystemRoot 'System32\drivers\etc\hosts') -Value "93.184.215.14 $fqdn"
          $env:GHRDP_LAB_DNS_ALLOW_LOOPBACK = ''
          $beforeMix = [int](Log-Lines 0)
          & $exe ("ghrdp://rdp?server=" + $fqdn + "&user=labuser") | Out-Null
          $mixLines = New-Lines $beforeMix
          if ($LASTEXITCODE -ne 5 -or -not (($mixLines | Out-String) -match 'dns-guard blocked launch')) { R-Fail 'guard-mixed-answer' 'mixed tailnet/public answers were not blocked' }
          if (($mixLines | Out-String) -match 'started pid=|prompt shown') { R-Fail 'guard-mixed-leak' 'cmdkey/mstsc ran with mixed DNS answers' }
          Write-Host '[R] (8) PASS: mixed tailnet + public DNS answers => blocked (all answers must be tailnet)'
          Set-HostAlias '127.0.0.1'
          $env:GHRDP_LAB_DNS_ALLOW_LOOPBACK = '1'
          & cmdkey.exe /generic:TERMSRV/$fqdn /user:labuser /pass:LABDUMMY-win-9876 | Out-Null
          $before7 = [int](Log-Lines 0)
          & $exe ("ghrdp://rdp?server=" + $fqdn + "&user=labuser") | Out-Null
          $rc7 = $LASTEXITCODE
          $nl7 = New-Lines $before7
          if ($rc7 -ne 0) { R-Fail 'guard-not-allowed' ('rc=' + $rc7) }
          if (-not (($nl7 | Out-String) -match 'dns-guard ok')) { R-Fail 'guard-allow-log' 'no dns-guard ok line with the lab switch' }
          # mstsc-started is the beacon detail; the JSONL log line is
          # level=mstsc details='started pid=N' - assert THAT.
          if (-not (($nl7 | Out-String) -match 'started pid=')) { R-Fail 'guard-allow-mstsc' 'mstsc not started on the allowed alias' }
          try { & cmdkey.exe /delete:TERMSRV/$fqdn | Out-Null } catch { }
          Set-HostAlias ''
          Write-Host '[R] (9) PASS: loopback alias + GHRDP_LAB_DNS_ALLOW_LOOPBACK=1 => dns-guard ok + mstsc-started (lab-only path)'
          Write-Host '[R] PASS: F17 listener probe break/fix + native-status render + beacon age + dns-guard'
          'R_result=pass' | Out-File $env:GITHUB_ENV -Append

      # [F19 §5] LAB PROOF for the client-DNS self-diagnosis + launcher version
      # guard. ghrdp-lab is still 404, so the reserved-lab cells run here (the
      # fallback lane) exactly like F14/F15/F17 did. Three parts:
      #   (1) the SHIPPED launcher, compiled by the in-box csc, runs its
      #       --dns-selftest decision matrix with INJECTED resolver/TCP results
      #       (fail-name+reach-ip => client-dns-off remediation path;
      #        both-ok => mstsc path; no-ip/closed => dns-fail) and provably
      #       never launches mstsc or cmdkey;
      #   (2) the REAL server compares the beacon's exe stamp against
      #       config.launcherVersion: old stamp => launcherOutdated=true,
      #       current stamp => false (the version guard is not vacuous);
      #   (3) the shipped page really carries the §1 probe card, the §2
      #       outdated row and the single ghrdp:// URL builder that appends
      #       &ip= only for a CGNAT address.
      - name: "S: F19 client-DNS probe + launcher version guard (csc matrix + real server)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # [F19] every failure must be readable from the Checks API: an
          # unhandled terminating error (a missing property with EAP=Stop, a
          # native-command error) would otherwise leave this step with no
          # annotation at all, and runner logs/artifacts are not retrievable
          # from this environment.
          trap {
              Write-Host ('::error::[S] stage=unhandled :: ' + $_.Exception.GetType().FullName + ' :: ' + $_.Exception.Message + ' @ ' + (($_.InvocationInfo.PositionMessage) -replace "`r?`n", ' | '))
              exit 1
          }
          function J([object]$o, [string]$n) { if ($o -and ($o.PSObject.Properties.Name -contains $n)) { return $o.$n } return $null }
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          function S-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[S] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'f19-classification.txt') -Encoding utf8 } catch { }
              exit 1
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $labIp = '100.118.42.7'
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          if (-not (Test-Path -LiteralPath $csc)) { S-Fail 'csc' 'the in-box csc.exe is missing - install.cmd depends on it too' }
          $exe = Join-Path $env:RUNNER_TEMP 'ghrdp-rdp-launcher-lab19.exe'
          $matrix = Join-Path $env:RUNNER_TEMP 'f19-dns-selftest.txt'
          if (Test-Path -LiteralPath $matrix) { Remove-Item -LiteralPath $matrix -Force }
          & $csc /nologo /target:winexe /out:$exe /r:System.dll /r:System.Windows.Forms.dll (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs')
          if ($LASTEXITCODE -ne 0) { S-Fail 'compile' 'the SHIPPED launcher does not compile with the in-box csc' }
          Write-Host '::notice::[S] phase=compile ok'
          $env:GHRDP_LAB_OUT = $matrix
          $env:GHRDP_LAB_NOMSG = '1'
          # [F19] the launcher is /target:winexe. Two traps here: '& $exe'
          # returns WITHOUT waiting (no console handle), and piping its output
          # with -Stop can turn a native-command record into a terminating error.
          # Start-Process -PassThru plus an explicit WaitForExit() on THIS
          # process is the unambiguous construct here: -Wait would also wait for
          # the process tree (the F10-9 wedge), and WaitForExit() waits only for
          # the selftest process while still yielding its real exit code.
          $p = Start-Process -FilePath $exe -ArgumentList '--dns-selftest','lab-target.dekarita.tailnet-lab.ts.net',$labIp -PassThru
          $p.WaitForExit()
          $runRc = $p.ExitCode
          if ($runRc -ne 0) { S-Fail 'matrix-exit' ('launcher --dns-selftest exit ' + $runRc) }
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $matrix); $i++) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path -LiteralPath $matrix)) { S-Fail 'matrix-file' ('no matrix file at ' + $matrix + ' (exit=' + $runRc + ')') }
          $txt = Get-Content -LiteralPath $matrix -Raw
          Write-Host $txt
          foreach ($want in @(
            ('injectedDns=fail injectedTcp=open ip=' + $labIp + ' decision=client-dns-off expected=client-dns-off verdict=pass'),
            ('injectedDns=fail injectedTcp=closed ip=' + $labIp + ' decision=dns-fail expected=dns-fail verdict=pass'),
            ('injectedDns=ok injectedTcp=open ip=' + $labIp + ' decision=mstsc expected=mstsc verdict=pass'),
            'injectedDns=fail injectedTcp=open ip=(none) decision=dns-fail expected=dns-fail verdict=pass')) {
              if (-not $txt.Contains($want)) { S-Fail 'matrix-case' ('missing case: ' + $want) }
          }
          if ($txt -notmatch 'mstscLaunched=0 cmdkeyCalled=0') { S-Fail 'matrix-side-effects' 'a selftest case launched mstsc or called cmdkey' }
          if ($txt -match 'verdict=FAIL') { S-Fail 'matrix-verdict' 'at least one matrix case reported FAIL' }
          Write-Host '[S] (1) PASS: shipped launcher DNS-guard matrix 5/5 (injected resolver/TCP; no mstsc, no cmdkey)'
          Write-Host '::notice::[S] phase=matrix ok'
          # --- (2) REAL server: beacon exe stamp vs config.launcherVersion -------
          $root = 'C:\ghrdp-lab-f19'
          try { Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue } catch { }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          # [F20] the repo constant is READ out of the shipped source (never
          # hand-typed): the launcher moved to 2.3.0.0 with the F20 dialog, and a
          # hand-typed version here would silently unpin the guard. The beacon's
          # exe stamp is rebuilt from the same source, so a version bump can
          # never break this cell again.
          $csText = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs'))
          $sVerM = [regex]::Match($csText, 'private const string Ver = "(\d+(\.\d+){1,3})"')
          if (-not $sVerM.Success) { S-Fail 'const-missing' 'payloads/ghrdp-rdp-launcher.cs has no Ver constant' }
          $sVer = $sVerM.Groups[1].Value
          $sStampM = [regex]::Match($csText, 'private const string Stamp = "ghrdp-rdp-launcher " \+ Ver \+ " \(([^)]*)\)"')
          if (-not $sStampM.Success) { S-Fail 'stamp-missing' 'payloads/ghrdp-rdp-launcher.cs has no Stamp suffix' }
          $sStamp = 'ghrdp-rdp-launcher ' + $sVer + ' (' + $sStampM.Groups[1].Value + ')'
          Write-Host ('[S] repo constant read from source: Ver=' + $sVer + ' stamp=[' + $sStamp + ']')
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), (@{
              dnsName = 'lab-host.dekarita.tailnet-lab.ts.net'; rdpUser = 'labuser'; rdpIp = $labIp
              launcherVersion = $sVer
          } | ConvertTo-Json -Compress), $utf8)
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), 'lab-dash-token-0123456789', $utf8)
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $diag 'f19-server-out.log') -RedirectStandardError (Join-Path $diag 'f19-server-err.log') -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1",'-Port','7393','-Root',$root
          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) { try { $up = [bool](Get-NetTCPConnection -LocalPort 7393 -State Listen -ErrorAction Stop) } catch { }; if (-not $up) { Start-Sleep -Milliseconds 500 } }
          if (-not $up) {
              $errTail = ''; try { $errTail = ((Get-Content (Join-Path $diag 'f19-server-err.log') -Tail 6 -ErrorAction SilentlyContinue) -join ' | ') } catch { }
              S-Fail 'server-listen' ('the lab server never listened on 7393; stderr=[' + $errTail + ']')
          }
          Write-Host '::notice::[S] phase=server-listen ok'
          function Invoke-S19Json([string]$Url, [string]$Method = 'GET', [string]$Body = '') {
              $req = [System.Net.HttpWebRequest]::Create($Url)
              $req.Method = $Method
              $req.Proxy = $null
              $req.Timeout = 10000
              $req.ReadWriteTimeout = 10000
              $req.KeepAlive = $false
              $req.UserAgent = 'ghrdp-lab'
              if ($Body) {
                  $b = [System.Text.Encoding]::UTF8.GetBytes($Body)
                  $req.ContentType = 'application/json'
                  $req.ContentLength = $b.Length
                  $st = $req.GetRequestStream(); $st.Write($b, 0, $b.Length); $st.Close()
              }
              try { $resp = $req.GetResponse() } catch [System.Net.WebException] {
                  $r = $_.Exception.Response; $code = 0
                  if ($r) { $code = [int]$r.StatusCode }
                  throw ('HTTP ' + $code + ' ' + $Url)
              }
              $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $t = $sr.ReadToEnd(); $sr.Close(); $resp.Close()
              return ($t | ConvertFrom-Json)
          }
          $base = 'http://127.0.0.1:7393'
          $key = 'key=lab-dash-token-0123456789'
          try { $ns0 = Invoke-S19Json ($base + '/api/native-status?' + $key) } catch { S-Fail 'native-status' $_.Exception.Message }
          foreach ($k in @('launcherVersion','launcherSeenVersion','launcherOutdated')) {
              if (-not ($ns0.PSObject.Properties.Name -contains $k)) { S-Fail 'field-missing' ('native-status lacks ' + $k) }
          }
          if ([string](J $ns0 'launcherVersion') -ne $sVer) { S-Fail 'const-served' ('launcherVersion=[' + [string](J $ns0 'launcherVersion') + '] expected [' + $sVer + ']') }
          if ([bool](J $ns0 'launcherOutdated') -ne $false) { S-Fail 'no-false-alarm' 'an outdated flag was raised before any beacon' }
          try { $null = Invoke-S19Json ($base + '/api/handler-hello?' + $key) 'POST' '{"verb":"rdp","ok":true,"details":"lab-old-exe","exe":"ghrdp-rdp-launcher 2.1.0.0 (F17 dns-guard)"}' } catch { S-Fail 'beacon-old' $_.Exception.Message }
          try { $nsOld = Invoke-S19Json ($base + '/api/native-status?' + $key) } catch { S-Fail 'native-status-old' $_.Exception.Message }
          if ([string](J $nsOld 'launcherSeenVersion') -ne '2.1.0.0') { S-Fail 'seen-old' ('launcherSeenVersion=[' + [string](J $nsOld 'launcherSeenVersion') + ']') }
          if ([bool](J $nsOld 'launcherOutdated') -ne $true) { S-Fail 'outdated-not-flagged' ('a 2.1.0.0 beacon against the ' + $sVer + ' repo constant must set launcherOutdated=true') }
          $beaconNew = '{"verb":"rdp","ok":true,"details":"lab-current-exe","exe":"' + $sStamp + '"}'
          try { $null = Invoke-S19Json ($base + '/api/handler-hello?' + $key) 'POST' $beaconNew } catch { S-Fail 'beacon-new' $_.Exception.Message }
          try { $nsNew = Invoke-S19Json ($base + '/api/native-status?' + $key) } catch { S-Fail 'native-status-new' $_.Exception.Message }
          if ([bool](J $nsNew 'launcherOutdated') -ne $false) { S-Fail 'outdated-stuck' 'the CURRENT exe stamp must clear launcherOutdated' }
          if ([string](J $nsNew 'launcherSeenVersion') -ne $sVer) { S-Fail 'seen-new' ('launcherSeenVersion=[' + [string](J $nsNew 'launcherSeenVersion') + '] expected [' + $sVer + ']') }
          $vh = J $nsNew 'lastHandlerVerb'
          if ([string](J $vh 'exe') -notmatch [regex]::Escape($sVer)) { S-Fail 'beacon-exe-echo' ('lastHandlerVerb.exe=[' + [string](J $vh 'exe') + ']') }
          try { Stop-Process -Id $srv.Id -Force } catch { }
          Write-Host ('[S] (2) PASS: beacon 2.1.0.0 => launcherOutdated=true; ' + $sVer + ' => false; constant served from config.json')
          Write-Host '::notice::[S] phase=version-guard ok'
          # --- (3) shipped page: probe card + outdated row + ONE URL builder -----
          $ui = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'payloads\ui.html'))
          foreach ($tok in @(
            'id="clientDnsRow"', 'id="clientDnsFix1"', 'function clientDnsCore(fqdn,ip,scheme,aOk,bOk)',
            "YOUR PC's Tailscale DNS is off (name not resolvable, IP reachable)", 'tailscale set --accept-dns=true',
            'Use Tailscale DNS', 'mode:''no-cors''', 'CDNS_PERIOD_MS=30000',
            'id="nrLauncherOutdatedRow"', 'launcher outdated - re-run install.cmd once',
            'function ghrdpRdpUrl(fqdn,user,ip)', "[F19 §1 client-DNS probe-begin]")) {
              # .Contains, never -like: the probe markers carry [ ] which are
              # wildcard metacharacters (WildcardPatternException killed this
              # step before the fix).
              if (-not $ui.Contains($tok)) { S-Fail 'ui-token' ('ui.html lacks ' + $tok) }
          }
          if ($ui -notmatch "u\+='&ip='") { S-Fail 'ui-ip-param' 'the ghrdp:// builder never appends the tailnet IP' }
          $tplCount = ([regex]::Matches($ui, [regex]::Escape("'ghrdp://rdp?server='+encodeURIComponent(fqdn)"))).Count
          if ($tplCount -ne 1) { S-Fail 'ui-url-templates' ('expected exactly 1 executable ghrdp://rdp template, found ' + $tplCount) }
          if ($ui -match "ghrdp://rdp[^']*(pass|pwd|token|secret)=") { S-Fail 'ui-url-secret' 'a ghrdp:// URL template carries a credential-ish parameter' }
          Write-Host '[S] (3) PASS: probe card + version row + single credential-free ghrdp:// builder present in the shipped page'
          Write-Host '[S] PASS: F19 client-DNS probe + launcher version guard (ghrdp-lab fallback lane)'
          'S_result=pass' | Out-File $env:GITHUB_ENV -Append

      # [F20 §4] T proves the CORRECTED diagnostics against the SHIPPED files:
      #   (1) nslookup is no longer offered as a copy-line anywhere on the page
      #       (it bypasses the Windows DNS client service, so Tailscale's NRPT
      #       split-DNS never applies and its timeout against the router is a
      #       false alarm); Resolve-DnsName took its place, is wired to the live
      #       FQDN, and the false-alarm note explains the nslookup timeout;
      #   (2) the collapsed "if mstsc still fails (0x904/0x7)" block inside
      #       CONNECTION DIAGNOSTICS carries the client + runner wevtutil export
      #       lines and stays copy-only (no exec control, no weakening advice);
      #   (3) the SHIPPED launcher still compiles with the in-box csc, logs the
      #       mstsc exit code (decimal + hex) and its immediate-exit dialog
      #       points the user at that dashboard block.
      - name: "T: F20 nslookup false alarm + evidence-based 0x904 fallback"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
              Write-Host ('::error::[T] stage=unhandled :: ' + $_.Exception.GetType().FullName + ' :: ' + $_.Exception.Message)
              exit 1
          }
          function T-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[T] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          $ui = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'payloads\ui.html'))
          $cs = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs'))
          # --- (1) nslookup retired, Resolve-DnsName offered -------------------
          if ($ui -match '<code[^>]*>[^<]*nslookup') { T-Fail 'nslookup-copy-line' 'the page still offers nslookup as a copy-line diagnostic' }
          if ($ui.Contains('id="connDiagNs"')) { T-Fail 'nslookup-element' 'the retired nslookup copy-line element survived' }
          foreach ($tok in @(
            'id="connDiagRd"', 'Resolve-DnsName &lt;fqdn&gt;', "dn.textContent='Resolve-DnsName '+diagF",
            'nslookup bypasses Tailscale split-DNS', 'a nslookup timeout while ping works is EXPECTED and not a fault',
            'id="connDiagPing"', 'id="connDiagTnc"')) {
              # .Contains, never -like: several of these carry [ ] wildcards.
              if (-not $ui.Contains($tok)) { T-Fail 'ui-token' ('ui.html lacks ' + $tok) }
          }
          # --- (2) the collapsed 0x904/0x7 evidence block ----------------------
          $a = $ui.IndexOf('<details id="connDiagFailBox"')
          $b = $ui.IndexOf('</details>', $a)
          if ($a -lt 0 -or $b -lt $a) { T-Fail 'fallback-block' 'the collapsed 0x904/0x7 block is missing from ui.html' }
          $blk = $ui.Substring($a, $b - $a)
          if (-not $blk.Contains('if mstsc still fails (0x904/0x7)')) { T-Fail 'fallback-summary' 'the block does not name the case it covers' }
          foreach ($tok in @(
            'wevtutil epl Microsoft-Windows-TerminalServices-ClientActiveXCore/Operational %TEMP%\rdp-client.evtx',
            'wevtutil el | findstr /i "terminal credssp schannel"',
            'wevtutil epl Security %TEMP%\rdp-security.evtx /q:"*[System[(EventID=4624 or EventID=4625)]]"',
            "wevtutil epl System %TEMP%\rdp-system.evtx /q:""*[System[Provider[@Name='Schannel']]]""",
            'wevtutil epl Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational %TEMP%\rdp-termgr.evtx',
            'Paste the exports into this session')) {
              if (-not $blk.Contains($tok)) { T-Fail 'fallback-export' ('the block lacks the export line: ' + $tok) }
          }
          $handlers = [regex]::Matches($blk, 'onclick="([^"]*)"')
          if ($handlers.Count -lt 5) { T-Fail 'fallback-copy-count' ('expected a copy control per export line, found ' + $handlers.Count) }
          foreach ($h in $handlers) {
              if (-not $h.Groups[1].Value.StartsWith('copyById(')) { T-Fail 'fallback-exec' ('a non-copy control reached the block: ' + $h.Groups[1].Value) }
          }
          if ($blk -match 'authentication level|enablecredsspsupport|authlvloverride|prompt for credentials') {
              T-Fail 'fallback-weakening' 'the block suggests weakening NLA / CredSSP / cert validation'
          }
          Write-Host '[T] (1-2) PASS: nslookup retired (Resolve-DnsName + false-alarm note); collapsed 0x904/0x7 export block is copy-only'
          # --- (3) the shipped launcher compiles + points at the block ---------
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          if (-not (Test-Path -LiteralPath $csc)) { T-Fail 'csc' 'the in-box csc.exe is missing - install.cmd depends on it too' }
          $exe = Join-Path $env:RUNNER_TEMP 'ghrdp-rdp-launcher-lab20.exe'
          & $csc /nologo /target:winexe /out:$exe /r:System.dll /r:System.Windows.Forms.dll (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs')
          if ($LASTEXITCODE -ne 0) { T-Fail 'compile' 'the SHIPPED launcher does not compile with the in-box csc' }
          if (-not (Test-Path -LiteralPath $exe)) { T-Fail 'compile-output' ('no exe at ' + $exe) }
          $vM = [regex]::Match($cs, 'private const string Ver = "(\d+(\.\d+){1,3})"')
          if (-not $vM.Success) { T-Fail 'ver-missing' 'the launcher has no Ver constant' }
          if ([version]$vM.Groups[1].Value -lt [version]'2.3.0.0') { T-Fail 'ver-stale' ('launcher version ' + $vM.Groups[1].Value + ' predates the F20 build (clients would never be told to update)') }
          foreach ($tok in @(
            'mstsc exited within 2s, code=',
            'code.ToString("X", CultureInfo.InvariantCulture)',
            'see dashboard -> CONNECTION DIAGNOSTICS -> \"if mstsc still fails\" and send the exports',
            'mstsc-exited=')) {
              if (-not $cs.Contains($tok)) { T-Fail 'launcher-token' ('the launcher lacks ' + $tok) }
          }
          Write-Host ('[T] (3) PASS: shipped launcher compiles (in-box csc), Ver=' + $vM.Groups[1].Value + ', exit code logged dec+hex, dialog points at the dashboard fallback')
          Write-Host '[T] PASS: F20 nslookup false alarm killed + evidence-based 0x904/0x7 fallback (ghrdp-lab fallback lane)'
          'T_result=pass' | Out-File $env:GITHUB_ENV -Append

      # [F24 §6] AUTH-REJECT DISCRIMINATOR proof: (1) the ValidateCredentials
      # mechanism executed against a REAL local account on this runner (fresh
      # password => true, wrong password => false), (2) the SHIPPED 4625
      # collector block extracted VERBATIM from main.yml and executed against
      # synthetic events with a secret-fish fixture (the output must map status
      # codes AND never carry the account fields), (3) the shipped node suite
      # (which executes the ui.html authDecision core verbatim) run on Windows.
      - name: "U: F24 cred proof + 4625 collector parse + matrix render"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
              Write-Host ('::error::[U] stage=unhandled :: ' + $_.Exception.GetType().FullName + ' :: ' + $_.Exception.Message)
              exit 1
          }
          function U-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[U] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          $wf = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\workflows\main.yml'))
          # --- (1) the credential-proof mechanism on a REAL local account ------
          $labU = 'ghrdplabu' + [guid]::NewGuid().ToString('N').Substring(0, 6)
          $labP = 'Lab!' + [guid]::NewGuid().ToString('N') + '9a'
          try {
              New-LocalUser -Name $labU -Password (ConvertTo-SecureString $labP -AsPlainText -Force) -PasswordNeverExpires -ErrorAction Stop | Out-Null
              Add-Type -AssemblyName System.DirectoryServices.AccountManagement
              $ctxU = New-Object System.DirectoryServices.AccountManagement.PrincipalContext([System.DirectoryServices.AccountManagement.ContextType]::Machine)
              $good = [bool]$ctxU.ValidateCredentials($labU, $labP)
              $wrong = [bool]$ctxU.ValidateCredentials($labU, 'Nope!' + $labP)
              try { $ctxU.Dispose() } catch { }
          } finally {
              Remove-LocalUser -Name $labU -ErrorAction SilentlyContinue
          }
          if (-not $good) { U-Fail 'validate-true' 'ValidateCredentials rejected a freshly created correct password - the F24 §1 probe would false-FAIL healthy runs' }
          if ($wrong) { U-Fail 'validate-false' 'ValidateCredentials ACCEPTED a wrong password - a dead credential would be advertised' }
          # the shipped §1 probe is the same call shape and loud-fails; it must
          # never interpolate the password into the log (only $credValid/$credWhy).
          $a1 = $wf.IndexOf('# [F24 §1 proof-begin]')
          $b1 = $wf.IndexOf('# [F24 §1 proof-end]')
          if ($a1 -lt 0 -or $b1 -lt $a1) { U-Fail 'proof-markers' 'F24 §1 proof markers missing in main.yml' }
          $proof = $wf.Substring($a1, $b1 - $a1)
          foreach ($tok in @(
            'Add-Type -AssemblyName System.DirectoryServices.AccountManagement',
            'PrincipalContext([System.DirectoryServices.AccountManagement.ContextType]::Machine)',
            '$env:RDP_USER', '$env:RDP_PASS', 'ValidateCredentials', 'rdpListener.credValid=')) {
              if (-not $proof.Contains($tok)) { U-Fail 'proof-token' ('shipped §1 probe body lacks: ' + $tok) }
          }
          foreach ($line in ($proof -split "`r?`n")) {
              if ($line -match '^\s*#' -or $line -match 'ValidateCredentials\(') { continue }
              if ($line -match 'RDP_PASS') { U-Fail 'proof-secret' ('§1 probe handles RDP_PASS outside ValidateCredentials: ' + $line.Trim()) }
          }
          if (-not $wf.Contains('server-side credential invalid - user creation bug')) { U-Fail 'proof-loudfail' 'main.yml lost the loud-fail text for a dead credential' }
          if (-not $wf.Contains("throw 'F24 server-side credential invalid - user creation bug'")) { U-Fail 'proof-throw' 'main.yml F24 §1 must THROW on credValid=false' }
          Write-Host '[U] (1) PASS: ValidateCredentials true/false on a real local account; shipped probe = same call, secret-free, loud-fails'
          # --- (2) the SHIPPED collector vs synthetic 4625 events --------------
          $a2 = $wf.IndexOf('# [F24 §2 collector-fn-begin]')
          $b2 = $wf.IndexOf('# [F24 §2 collector-fn-end]')
          if ($a2 -lt 0 -or $b2 -lt $a2) { U-Fail 'collector-markers' 'F24 §2 collector markers missing in main.yml' }
          $fnSrc = $wf.Substring($a2, $b2 - $a2)
          $fish = 'LABSECRET-' + [guid]::NewGuid().ToString('N')
          $script:synthetic = @(
              [pscustomobject]@{ Id = 4624; Properties = @([pscustomobject]@{ Name = 'Status'; Value = '0x0' }, [pscustomobject]@{ Name = 'TargetUserName'; Value = $fish }) },
              [pscustomobject]@{ Id = 4625; Properties = @([pscustomobject]@{ Name = 'Status'; Value = '0xC000006A' }, [pscustomobject]@{ Name = 'TargetUserName'; Value = $fish }) },
              [pscustomobject]@{ Id = 4625; Properties = @([pscustomobject]@{ Name = 'Status'; Value = '0xC000015B' }, [pscustomobject]@{ Name = 'SubStatus'; Value = '0x0' }) },
              [pscustomobject]@{ Id = 4624; Properties = @() }
          )
          function Get-WinEvent { param($FilterHashtable, $ErrorAction) return $script:synthetic }
          Invoke-Expression $fnSrc
          $evU = Get-F24AuthEvidence -WindowMinutes 5
          if ([int]$evU.ok4624 -ne 2) { U-Fail 'collector-4624' ('expected 2 successes, got ' + [string]$evU.ok4624) }
          if ([int]$evU.bad4625 -ne 2) { U-Fail 'collector-4625' ('expected 2 failures, got ' + [string]$evU.bad4625) }
          if (@($evU.statuses) -notcontains '0xc000006a') { U-Fail 'collector-status' ('missing mapped status: ' + (@($evU.statuses) -join ',')) }
          if (@($evU.reasons) -notcontains 'wrong-password') { U-Fail 'collector-reason-6a' ('0xC000006A did not map to wrong-password: ' + (@($evU.reasons) -join ',')) }
          if (@($evU.reasons) -notcontains 'logon-type-denied') { U-Fail 'collector-reason-15b' ('0xC000015B did not map to logon-type-denied: ' + (@($evU.reasons) -join ',')) }
          $evJson = $evU | ConvertTo-Json -Compress -Depth 6
          if ($evJson.Contains($fish)) { U-Fail 'collector-secret' 'collector output carried the planted account-name fixture - NOT secret-free' }
          if ($evJson -match 'TargetUserName|SubStatus') { U-Fail 'collector-fields' 'collector surfaced non-Status event fields' }
          # event-query failure must degrade to notes, never throw
          function Get-WinEvent { param($FilterHashtable, $ErrorAction) throw 'Access is denied' }
          $evD = Get-F24AuthEvidence -WindowMinutes 5
          if (-not ([string]$evD.notes).StartsWith('event-query-unavailable')) { U-Fail 'collector-degrade' 'a failing Security query did not degrade to notes=' + [string]$evD.notes }
          if ([int]$evD.bad4625 -ne 0) { U-Fail 'collector-degrade2' 'degraded path reported failures without events' }
          Write-Host ('[U] (2) PASS: shipped collector parsed synthetic 4625s - ' + $evJson)
          # --- (3) AUTH DECISION matrix: the shipped node suite on Windows -------
          Push-Location $env:GITHUB_WORKSPACE
          try {
              & node --test tests/f24-auth-reject.test.js
              $rc = $LASTEXITCODE
          } finally { Pop-Location }
          if ($rc -ne 0) { U-Fail 'matrix' ('tests/f24-auth-reject.test.js (authDecision executed against the shipped ui.html) failed with exit ' + $rc) }
          Write-Host '[U] (3) PASS: F24 node suite green on Windows (credValid=false red, stale 6A/6D yellow + cmdkey/KEYS copy-lines, no-4625 CAPI2 exports, verbatim codes, never bare FAIL: pending)'
          Write-Host '[U] PASS: F24 auth-reject discriminator - server cred proof + 4625 evidence + lab matrix'
          'U_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "F: Edge policy proof (live-resolved IDs -> registry readout)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function F-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[F] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          # [F10-11] SAME resolver text as production: dot-sourced from the
          # repo checkout - the lab can never drift from what the runner runs.
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\edge-ext-resolve.ps1')
          $a1 = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill','uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          if (-not $a1) { F-Fail 'resolve-ublock' 'no live page yielded a verifiable uBlock Origin id (see [ext] warnings above)' }
          $a2 = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill','uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          $d1 = Resolve-StoreExtId -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('darkreader.org','Dark Reader') -VendorPages @('https://raw.githubusercontent.com/darkreader/darkreader/main/README.md')
          if (-not $d1) { F-Fail 'resolve-darkreader' 'no live page yielded a verifiable Dark Reader id (see [ext] warnings above)' }
          if (-not $a2 -or $a1.id -ne $a2.id) { F-Fail 'unstable' ('first=' + $(if ($a1) { $a1.id } else { '' }) + ' second=' + $(if ($a2) { $a2.id } else { '' })) }
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
          New-Item -Path $pol -Force | Out-Null
          Set-ItemProperty -Path $pol -Name '1' -Value (Get-ExtForceListValue -Resolved $a1)
          Set-ItemProperty -Path $pol -Name '2' -Value (Get-ExtForceListValue -Resolved $d1)
          $rb = Get-ItemProperty -Path $pol
          if ($rb.'1' -notmatch ('^' + $a1.id) -or $rb.'2' -notmatch ('^' + $d1.id)) { F-Fail 'registry-readback' ('got 1=[' + $rb.'1' + '] 2=[' + $rb.'2' + ']') }
          Write-Host ('[F] PASS: uBlock Origin=' + $a1.id + ' [' + $a1.store + ' via ' + $a1.source + ']')
          Write-Host ('[F] PASS: Dark Reader=' + $d1.id + ' [' + $d1.store + ' via ' + $d1.source + ']')
          # Bookmarks policy readout: exactly the three F10 managed bookmarks.
          $bm = @(@{ toplevel_name = 'GHRDP Session'; children = @(
              @{ name = 'Mission Control'; url = 'http://100.118.42.7:7331' },
              @{ name = 'Auto-login guide (docs/AUTOLOGIN.md)'; url = 'https://github.com/dekarita/supreme-lamp/blob/main/docs/AUTOLOGIN.md' },
              @{ name = 'Tailscale Admin - DNS'; url = 'https://login.tailscale.com/admin/dns' }) })
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value (ConvertTo-Json $bm -Depth 6 -Compress)
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Edge').ManagedFavorites -notmatch 'docs/AUTOLOGIN.md') { Write-Host '[F] FAIL: bookmarks readout'; exit 1 }
          Write-Host '[F] PASS: extension forcelist + managed bookmark policy readback (edge://policy source of truth; edge://extensions UI cell = PENDING-USER)'
          'F_result=pass' | Out-File $env:GITHUB_ENV -Append
          ('F_ubo=' + $a1.id + ' via ' + $a1.source) | Out-File $env:GITHUB_ENV -Append
          ('F_dr=' + $d1.id + ' via ' + $d1.source) | Out-File $env:GITHUB_ENV -Append

      - name: "H: VNC cred shim auto-fill (REAL shim executed under node)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function H-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[H] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          # The shim is executed for real: a DOM stub provides window.opener, the
          # exact-origin meta and the noVNC credentials input; the harness feeds a
          # postMessage from the opener and asserts (a) the input is auto-filled
          # and submitted, (b) a wrong-origin / non-opener message is IGNORED,
          # (c) nothing was logged (the shim must never echo the value).
          $js = Join-Path $env:RUNNER_TEMP 'shim-harness.js'
          $lines = @(
              "const fs=require('fs'),vm=require('vm');",
              "const src=fs.readFileSync(process.argv[2],'utf8');",
              "const listeners={},els={},logs=[];",
              "function el(id){return els[id]||(els[id]={id:id,value:'',dispatchEvent(){return true;},querySelector(){return {click(){els.clicked=true;}};}});}",
              "el('noVNC_password_input');el('noVNC_credentials_dialog');",
              "const win={opener:{n:'dash'},addEventListener(t,f){(listeners[t]=listeners[t]||[]).push(f);}};",
              "const ctx={window:win,document:{querySelector(){return {content:'http://100.118.42.7:7331'};},getElementById:el},Event:function(t){this.type=t;},setInterval(){return 1;},clearInterval(){},console:{log(){logs.push('LOG');},error(){logs.push('ERR');},warn(){logs.push('WARN');}}};",
              "vm.createContext(ctx);vm.runInContext(src,ctx);",
              "const send=(o,s,d)=>listeners.message[0]({origin:o,source:s,data:d});",
              "send('http://evil.example',win.opener,{type:'ghrdp-vnc-pass',pass:'LEAK'});",
              "send('http://100.118.42.7:7331',{n:'other'},{type:'ghrdp-vnc-pass',pass:'LEAK'});",
              "send('http://100.118.42.7:7331',win.opener,{type:'other',pass:'LEAK'});",
              "if(els.noVNC_password_input.value!==''){console.log('FAIL:unauthorized payload reached the dialog');process.exit(2);}",
              "send('http://100.118.42.7:7331',win.opener,{type:'ghrdp-vnc-pass',pass:'VNC-lab-secret'});",
              "if(els.noVNC_password_input.value!=='VNC-lab-secret'){console.log('FAIL:dialog not auto-filled');process.exit(3);}",
              "if(!els.clicked){console.log('FAIL:dialog not submitted');process.exit(4);}",
              "if(logs.length){console.log('FAIL:shim logged ('+logs.join(',')+')');process.exit(5);}",
              "console.log('PASS: auto-filled='+(els.noVNC_password_input.value.length>0)+' submitted='+!!els.clicked+' unauthorized=ignored logs='+logs.length);"
          )
          [System.IO.File]::WriteAllText($js, ($lines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          & node.exe $js (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-cred-shim.js')
          if ($LASTEXITCODE -ne 0) { H-Fail 'shim-exec' ('node harness exit ' + $LASTEXITCODE) }
          Write-Host '[H] PASS: real shim auto-fills the credentials dialog from the opener origin only and never logs the value'
          'H_result=pass' | Out-File $env:GITHUB_ENV -Append

      - name: "I: RDP USAGE timer ticks / freezes / resumes (REAL server + REAL loop)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          function I-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[I] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'usage-classification.txt') -Encoding utf8 } catch { }
              try { if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue } } catch { }
              exit 1
          }
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path (Join-Path $root 'webdesk') -Force | Out-Null
          # The usage loop consumes the SAME file the Rust dash writes when a
          # webdesk client attaches (ws-clients.txt) - the lab plays that client.
          $sig = Join-Path $root 'webdesk\ws-clients.txt'
          function Usage-Read {
              $u = Invoke-RestMethod -Uri ('http://127.0.0.1:7331/api/native-status?key=lab-dash-token-0123456789') -Proxy $null -TimeoutSec 10
              return $u
          }
          $srvOut = Join-Path $diag 'usage-server.log'; $srvErr = Join-Path $diag 'usage-server-err.log'
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { try { $ok = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok) { I-Fail 'server-listen' 'ghrdp-server.ps1 did not bind 7331 in 20s' }
          # (1) TICK: webdesk client attached -> usage grows
          [System.IO.File]::WriteAllText($sig, '1', (New-Object System.Text.UTF8Encoding($false)))
          $active = $false; $tickA = $null
          for ($i = 0; $i -lt 20 -and -not $active; $i++) {
              Start-Sleep -Seconds 2
              try { $u = Usage-Read; if ($u.rdpUsageActive -and $u.rdpUsageSec -gt 0) { $active = $true; $tickA = [int]$u.rdpUsageSec } } catch { }
          }
          if (-not $active) { I-Fail 'tick' 'rdpUsageSec did not start accumulating with a webdesk client attached' }
          Start-Sleep -Seconds 12
          try { $u2 = Usage-Read; $tickB = [int]$u2.rdpUsageSec } catch { I-Fail 'tick-read' $_.Exception.Message }
          if ($tickB -le $tickA) { I-Fail 'tick-growth' ('sec ' + $tickA + ' -> ' + $tickB + ' (must grow while active)') }
          Write-Host ('[I] TICK ok: ' + $tickA + 's -> ' + $tickB + 's while a webdesk client is attached')
          # (2) FREEZE within 20s of the last signal dropping
          Remove-Item -LiteralPath $sig -Force -ErrorAction SilentlyContinue
          $frozen = $false; $freezeAt = $null
          for ($i = 0; $i -lt 12 -and -not $frozen; $i++) {
              Start-Sleep -Seconds 2
              try { $u3 = Usage-Read; if (-not $u3.rdpUsageActive) { $frozen = $true; $freezeAt = [int]$u3.rdpUsageSec } } catch { }
          }
          if (-not $frozen) { I-Fail 'freeze' 'rdpUsageActive stayed true more than 20s after both signals dropped' }
          Start-Sleep -Seconds 12
          try { $u4 = Usage-Read; $stillFrozen = [int]$u4.rdpUsageSec } catch { I-Fail 'freeze-read' $_.Exception.Message }
          if ($stillFrozen -ne $freezeAt) { I-Fail 'freeze-drift' ('sec moved while frozen: ' + $freezeAt + ' -> ' + $stillFrozen) }
          Write-Host ('[I] FREEZE ok: frozen at ' + $freezeAt + 's and unchanged for 12s')
          # (3) RESUME + persistence into config.json
          [System.IO.File]::WriteAllText($sig, '1', (New-Object System.Text.UTF8Encoding($false)))
          $resumed = $false
          for ($i = 0; $i -lt 10 -and -not $resumed; $i++) {
              Start-Sleep -Seconds 2
              try { $u5 = Usage-Read; if ($u5.rdpUsageActive -and ([int]$u5.rdpUsageSec -gt $stillFrozen)) { $resumed = $true } } catch { }
          }
          if (-not $resumed) { I-Fail 'resume' 'usage did not resume after the client re-attached' }
          Write-Host '[I] RESUME ok: accumulation continued from the frozen value'
          Start-Sleep -Seconds 32   # the loop persists to config.json at most every 30s
          try { $cfgNow = [System.IO.File]::ReadAllText((Join-Path $root 'config.json')) | ConvertFrom-Json } catch { I-Fail 'config-read' $_.Exception.Message }
          if ($null -eq $cfgNow.rdpUsageSec) { I-Fail 'config-persist' 'config.json carries no rdpUsageSec' }
          $persisted = [int]$cfgNow.rdpUsageSec
          if ($persisted -le $stillFrozen) { I-Fail 'config-persist-value' ('persisted=' + $persisted + ' frozen=' + $stillFrozen) }
          Write-Host ('[I] PERSIST ok: config.json rdpUsageSec=' + $persisted + ' host=' + $cfgNow.rdpUsageHost)
          try { Stop-Process -Id $srv.Id -Force } catch { }
          Start-Sleep -Seconds 2
          # (4) CONTINUITY on the same host: a fresh server resumes from the
          # persisted accumulator instead of starting at zero.
          $srv2 = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $diag 'usage-server2.log') -RedirectStandardError (Join-Path $diag 'usage-server2-err.log') -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok2 = $false
          for ($i = 0; $i -lt 40 -and -not $ok2; $i++) { try { $ok2 = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok2) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok2) { I-Fail 'server2-listen' 'second server start did not bind 7331 in 20s' }
          $carried = $null
          for ($i = 0; $i -lt 8 -and -not $carried; $i++) {
              Start-Sleep -Seconds 2
              try { $u6 = Usage-Read; if ($null -ne $u6.rdpUsageSec -and [int]$u6.rdpUsageSec -ge $persisted) { $carried = [int]$u6.rdpUsageSec } } catch { }
          }
          if ($null -eq $carried) { I-Fail 'continuity' ('restart did not continue from ' + $persisted + 's') }
          Stop-Process -Id $srv2.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $sig -Force -ErrorAction SilentlyContinue
          Write-Host ('[I] PASS: usage timer ticks -> freezes (<=20s) -> resumes -> persists (' + $carried + 's) -> continues across a restart')
          'I_result=pass' | Out-File $env:GITHUB_ENV -Append
          ('I_usage=' + $carried) | Out-File $env:GITHUB_ENV -Append

      - name: "J: qBittorrent planted as a plain app (winget, cached)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cache = 'C:\ghrdp\cache\qbittorrent'
          New-Item -ItemType Directory -Path $cache -Force -ErrorAction SilentlyContinue | Out-Null
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (-not $winget) { Write-Host '::error::[J] stage=winget :: winget.exe missing on the lab runner'; exit 1 }
          & $winget install --id qBittorrent.qBittorrent --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3 | Out-Null
          $LASTEXITCODE = 0
          $exe = Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::[J] stage=presence :: qBittorrent not present after winget install'; exit 1 }
          # plain app: no Web UI listener, no autostart Run key, no mirror wiring
          $runKey = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          $auto = $false
          if ($runKey) { foreach ($p in $runKey.PSObject.Properties) { if ($p.Name -like 'qBittorrent*') { $auto = $true } } }
          Write-Host ('[J] PASS: qBittorrent present at ' + $exe.FullName + '; autostart=' + $auto + '; webui-listener=absent-by-default')
          'J_result=pass' | Out-File $env:GITHUB_ENV -Append

      - name: "N: handler overwrite (stale value planted)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-1 §1.1] Plant the exact class of stale value the client PC had
          # (a pre-F2 registration pointing at a script host), then run the REAL
          # install.cmd and prove it OVERWRITES it, prints before/after and
          # verifies the readback.
          $stale = '"C:\Windows\System32\cmd.exe" /c echo stale "%1"'
          New-Item -Path 'HKCU:\Software\Classes\ghrdp\shell\open\command' -Force | Out-Null
          Set-Item -LiteralPath 'HKCU:\Software\Classes\ghrdp\shell\open\command' -Value $stale
          $before = [string](Get-Item -LiteralPath 'HKCU:\Software\Classes\ghrdp\shell\open\command').GetValue('')
          Write-Host ('[N] planted stale value: ' + $before)
          $lab = Join-Path $env:RUNNER_TEMP 'lab-n'
          function Read-Share([string]$Path) {
              # The launched launcher may still hold the redirected handle: read with
              # FileShare.ReadWrite so the capture is never blocked by a live child.
              try {
                  $fs = [System.IO.File]::Open($Path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
                  $sr = New-Object System.IO.StreamReader($fs)
                  $t = $sr.ReadToEnd(); $sr.Dispose(); $fs.Dispose(); return $t
              } catch { return '' }
          }
          New-Item -ItemType Directory -Path $lab -Force | Out-Null
          Copy-Item payloads\install.cmd (Join-Path $lab 'install.cmd') -Force
          Copy-Item payloads\ghrdp-rdp-launcher.cs (Join-Path $lab 'ghrdp-rdp-launcher.cs') -Force
          # [F15] file redirect (never a pipe): the shipped install.cmd now runs
          # its ghrdp://check self test, and a GUI child holding an inherited
          # pipe handle would keep this step open until the launcher exited.
          $nOut = Join-Path $lab 'install-out.txt'
          $nWrap = Join-Path $lab 'run-install-n.cmd'
          [System.IO.File]::WriteAllText($nWrap, "@echo off`r`ncd /d ""%~dp0""`r`ncall ""%~dp0install.cmd"" < nul > ""%~dp0install-out.txt"" 2>&1`r`nexit /b %ERRORLEVEL%`r`n", [System.Text.Encoding]::ASCII)
          & cmd.exe /c $nWrap
          $code = $LASTEXITCODE
          $out = @((Read-Share $nOut) -split "`r?`n")
          $out | ForEach-Object { Write-Host ('[N install.cmd] ' + $_) }
          $after = [string](Get-Item -LiteralPath 'HKCU:\Software\Classes\ghrdp\shell\open\command').GetValue('')
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          $printedBefore = [bool](($out -join "`n") -match 'BEFORE:')
          $printedAfter  = [bool](($out -join "`n") -match 'AFTER:')
          $overwritten   = ($after -match 'ghrdp-rdp-launcher\.exe') -and ($after -notmatch 'cmd\.exe')
          $ok = ($code -eq 0) -and $printedBefore -and $printedAfter -and $overwritten -and (Test-Path -LiteralPath $exe)
          Write-Host ('[N] exit=' + $code + ' printedBefore=' + $printedBefore + ' printedAfter=' + $printedAfter + ' overwritten=' + $overwritten + ' after=' + $after)
          if (-not $ok) { Write-Host '::error::[N] stage=overwrite :: install.cmd did not overwrite the stale registration'; exit 1 }
          Write-Host '[N] PASS: stale value printed, overwritten and verified by install.cmd'
          'N_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "O: one-click kit /dl route (zip sha-compare, allowlist 404s, on-page guide)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # [F14 §5] stage + serve + download proof on the REAL server: build the
          # kit EXACTLY like the F14 main.yml step, serve it via GET /dl, download
          # all three allowlisted objects and sha-compare them vs source, prove
          # every non-allowlisted file 404s, and prove the button href + guide
          # are rendered on the dashboard page.
          # [F10-13 pattern] EVERY failure is classified (::error::[O] stage=...)
          # + captured into the f14-diag artifact; an uncaught throw is re-armed
          # as stage=unclassified so the next red run is never blind.
          $diag = Join-Path $env:GITHUB_WORKSPACE 'f14-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $phase = 'setup'
          $srv = $null
          function O-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[O] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'phase=' + $phase + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'o-classification.txt') -Encoding utf8 } catch { }
              try { if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue } } catch { }
              exit 1
          }
          try {
          $phase = 'stage'
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), (@{ dnsName = 'lab-host.dekarita.tailnet-lab.ts.net'; rdpUser = 'labuser'; rdpIp = '100.118.42.7' } | ConvertTo-Json -Compress), $utf8)
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), 'lab-dash-token-0123456789', $utf8)
          # mirror the production flow: payloads -> stage dir -> $root (main.yml
          # copies stage\* into C:\ghrdp; the kit zip + both payloads must sit in
          # $root for /dl to serve them).
          $stage = Join-Path $env:RUNNER_TEMP 'ghrdp-stage-f14'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item payloads\install.cmd (Join-Path $stage 'install.cmd') -Force
          Copy-Item payloads\ghrdp-rdp-launcher.cs (Join-Path $stage 'ghrdp-rdp-launcher.cs') -Force
          Copy-Item (Join-Path $stage 'install.cmd') (Join-Path $root 'install.cmd') -Force
          Copy-Item (Join-Path $stage 'ghrdp-rdp-launcher.cs') (Join-Path $root 'ghrdp-rdp-launcher.cs') -Force
          # decoys: real files that sit next to the kit in $root - /dl must 404 them
          Copy-Item payloads\ui.html (Join-Path $root 'ui.html') -Force
          Copy-Item payloads\ghrdp-server.ps1 (Join-Path $root 'ghrdp-server.ps1') -Force
          $zip = Join-Path $root 'ghrdp-handler-kit.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage 'install.cmd'),(Join-Path $stage 'ghrdp-rdp-launcher.cs') -DestinationPath $zip -Force
          try { Add-Type -AssemblyName System.IO.Compression.FileSystem } catch { }
          $zv = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entryCount = @($zv.Entries).Count
          $zv.Dispose()
          if ($entryCount -ne 2) { O-Fail 'zip' ('kit holds ' + $entryCount + ' entries (must be 2)') }
          $phase = 'serve'
          try { $old = Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop; foreach ($o in $old) { try { Stop-Process -Id $o.OwningProcess -Force -ErrorAction SilentlyContinue } catch { } }; Start-Sleep -Seconds 1 } catch { }
          $srvOut = Join-Path $diag 'server-out.log'; $srvErr = Join-Path $diag 'server-err.log'
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { try { $ok = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok) { O-Fail 'listen' ('server never bound 7331; exited=' + $(if ($srv.HasExited) { $srv.ExitCode } else { 'no' }) + '; stderr=[' + ((Get-Content $srvErr -Tail 5 -ErrorAction SilentlyContinue) -join ' | ') + ']') }
          function O-RawGet([string]$UrlPath, [string]$OutFile) {
              # raw socket client (F10-14 pattern): no proxy, byte-exact proof.
              # On ANY malformed reply the annotation carries a hex dump of the
              # actual first 160 bytes so a red run is diagnosable from GitHub
              # alone (runner logs + artifacts are EOF-unreachable here).
              $c = New-Object System.Net.Sockets.TcpClient
              $c.Connect('127.0.0.1', 7331)
              $ns = $c.GetStream()
              $req = [System.Text.Encoding]::ASCII.GetBytes(('GET ' + $UrlPath + ' HTTP/1.1' + "`r`n" + 'Host: 127.0.0.1' + "`r`n" + 'Connection: close' + "`r`n`r`n"))
              $ns.Write($req, 0, $req.Length)
              $ms = New-Object System.IO.MemoryStream
              $buf = New-Object byte[] 65536
              try { $ns.ReadTimeout = 20000 } catch { }
              while ($true) { $n = 0; try { $n = $ns.Read($buf, 0, $buf.Length) } catch { break }; if ($n -le 0) { break }; $ms.Write($buf, 0, $n) }
              $c.Close()
              $all = $ms.ToArray()
              $idx = -1
              for ($i = 0; $i -le $all.Length - 4; $i++) { if ($all[$i] -eq 13 -and $all[$i + 1] -eq 10 -and $all[$i + 2] -eq 13 -and $all[$i + 3] -eq 10) { $idx = $i; break } }
              if ($idx -lt 0) {
                  $hex = ($all[0..([Math]::Min(159, $all.Length - 1))] | ForEach-Object { $_.ToString('x2') }) -join ''
                  O-Fail 'rawdump' ($UrlPath + ' no header terminator; first=' + $hex)
              }
              foreach ($b in $all[0..($idx + 3)]) { if ($b -eq 0) { $hex = ($all[0..([Math]::Min(159, $all.Length - 1))] | ForEach-Object { $_.ToString('x2') }) -join ''; O-Fail 'rawdump' ($UrlPath + ' NUL in header block; first=' + $hex) } }
              $head = [System.Text.Encoding]::ASCII.GetString($all, 0, $idx)
              $body = New-Object byte[] ($all.Length - $idx - 4)
              [Array]::Copy($all, $idx + 4, $body, 0, $body.Length)
              [System.IO.File]::WriteAllBytes($OutFile, $body)
              return ,@($head, $body)
          }
          $phase = 'download+sha'
          $dlDir = Join-Path $env:RUNNER_TEMP 'f14-dl'
          New-Item -ItemType Directory -Path $dlDir -Force | Out-Null
          foreach ($pair in @(@('ghrdp-handler-kit.zip', $zip), @('install.cmd', (Join-Path $env:GITHUB_WORKSPACE 'payloads\install.cmd')), @('ghrdp-rdp-launcher.cs', (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs')))) {
              $out = Join-Path $dlDir $pair[0]
              $r = O-RawGet ('/dl/' + $pair[0]) $out
              $head = [string]$r[0]
              if ($head -notmatch '^HTTP/1\.1 200') { O-Fail 'download' ($pair[0] + ' status=[' + $head + ']') }
              $got = (Get-FileHash $out -Algorithm SHA256).Hash
              $want = (Get-FileHash $pair[1] -Algorithm SHA256).Hash
              if ($got -ne $want) { O-Fail 'sha' ($pair[0] + ' sha mismatch got=' + $got + ' want=' + $want) }
              if ($pair[0] -eq 'ghrdp-handler-kit.zip') { $script:KitHead = $head }
          }
          if ($script:KitHead -notmatch 'Content-Disposition: attachment; filename="ghrdp-handler-kit\.zip"') { O-Fail 'disposition' ($script:KitHead -replace "`r`n", ' | ') }
          if ($script:KitHead -notmatch 'Cache-Control: no-store') { O-Fail 'cache' ($script:KitHead -replace "`r`n", ' | ') }
          Expand-Archive -Path (Join-Path $dlDir 'ghrdp-handler-kit.zip') -DestinationPath (Join-Path $dlDir 'unzipped') -Force
          foreach ($n in @('install.cmd', 'ghrdp-rdp-launcher.cs')) {
              $a = (Get-FileHash (Join-Path $dlDir ('unzipped\' + $n)) -Algorithm SHA256).Hash
              $b = (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE ('payloads\' + $n)) -Algorithm SHA256).Hash
              if ($a -ne $b) { O-Fail 'zip-member-sha' ($n + ' differs inside the kit zip') }
          }
          $phase = 'allowlist-404'
          foreach ($bad in @('ui.html', 'ghrdp-server.ps1', 'config.json', 'dash-token.txt', 'ghrdp-install.ps1')) {
              $r = O-RawGet ('/dl/' + $bad) (Join-Path $dlDir 'x.bin')
              if (([string]$r[0]) -notmatch '^HTTP/1\.1 404') { O-Fail 'allowlist' ('/dl/' + $bad + ' status=[' + ([string]$r[0]) + '] - NOT 404') }
          }
          foreach ($bare in @('/dl/', '/dl')) {
              $r = O-RawGet $bare (Join-Path $dlDir 'x.bin')
              if (([string]$r[0]) -notmatch '^HTTP/1\.1 404') { O-Fail 'listing' ($bare + ' status=[' + ([string]$r[0]) + '] - no directory listing allowed') }
          }
          $phase = 'guide-render'
          $r = O-RawGet '/' (Join-Path $dlDir 'page.html')
          $page = [string]$r[0] + [System.Text.Encoding]::UTF8.GetString($r[1])
          foreach ($mark in @('href="/dl/ghrdp-handler-kit.zip"', 'DOWNLOAD INSTALL KIT', 'id="kitGuideA"', 'id="kitPathB"')) {
              if ($page -notmatch [regex]::Escape($mark)) { O-Fail 'guide' ('dashboard page missing ' + $mark) }
          }
          $phase = 'cleanup'
          try { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue } catch { }
          Write-Host '[O] PASS: 3/3 objects downloaded + sha-identical (zip members too), attachment+no-store headers, 5 decoys + 2 bare /dl = 404, button href + guide rendered'
          'O_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          } catch { O-Fail 'unclassified' ($phase + ' :: ' + $_.Exception.Message + ' :: ' + $_.InvocationInfo.PositionMessage) }

      - name: "O diagnostics artifact (survives halts)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: f14-diag
          path: f14-diag
          if-no-files-found: ignore


      - name: "K: browser policies + extensions readback"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-3 §3.1/§3.2] The REAL live resolver populates the REAL policy
          # keys; the SHARED readback helper (payloads/ghrdp-provision-apps.ps1)
          # reports what edge://policy and chrome://policy will render; Edge is
          # then launched so the forced extension is actually downloaded and
          # unpacked into the profile (the extensions-page equivalent for CI).
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\edge-ext-resolve.ps1')
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-provision-apps.ps1')
          $ubo = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill', 'uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          $dr  = Resolve-StoreExtId -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('darkreader.org', 'Dark Reader') -VendorPages @('https://raw.githubusercontent.com/darkreader/darkreader/main/README.md')
          $cubo = Resolve-StoreExtId -Store 'cws' -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('uBlock Origin', 'gorhill')
          $cdr  = Resolve-StoreExtId -Store 'cws' -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('Dark Reader', 'darkreader.org')
          foreach ($pair in @(@('edge', $ubo, 'uBlock Origin'), @('edge', $dr, 'Dark Reader'), @('cws', $cubo, 'uBlock Origin'), @('cws', $cdr, 'Dark Reader'))) {
              if (-not $pair[1]) { Write-Host ('::error::[K] stage=resolve :: ' + $pair[0] + ' ' + $pair[2] + ' could not be resolved from a live store page'); exit 1 }
          }
          $edgePol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
          $cwsPol  = 'HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist'
          New-Item -Path $edgePol -Force | Out-Null
          New-Item -Path $cwsPol -Force | Out-Null
          Remove-Item -Path ($edgePol + '\*') -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ($cwsPol + '\*') -Force -ErrorAction SilentlyContinue
          New-ItemProperty -Path $edgePol -Name '1' -Value (Get-ExtForceListValue -Resolved $ubo) -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePol -Name '2' -Value (Get-ExtForceListValue -Resolved $dr)  -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $cwsPol  -Name '1' -Value (Get-ExtForceListValue -Resolved $cubo) -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $cwsPol  -Name '2' -Value (Get-ExtForceListValue -Resolved $cdr)  -PropertyType String -Force | Out-Null
          $edgeBack = Get-ForcedEntryCount $edgePol
          $cwsBack  = Get-ForcedEntryCount $cwsPol
          $edgeShape = @()
          foreach ($v in @((Get-Item -LiteralPath $edgePol).GetValueNames())) {
              if ($v -notmatch '^\d+$') { continue }
              $val = [string](Get-ItemProperty -Path $edgePol -Name $v).$v
              if (-not (Test-ForcedEntryShape $val)) { Write-Host ('::error::[K] stage=shape :: Edge forcelist value ' + $v + ' is malformed'); exit 1 }
              $edgeShape += $val
          }
          Write-Host ('[K] policy readback: Edge=' + $edgeBack + ' Chrome=' + $cwsBack + ' edge-ids=' + $ubo.id + ',' + $dr.id + ' chrome-ids=' + $cubo.id + ',' + $cdr.id)
          if ($edgeBack -ne 2 -or $cwsBack -ne 2) { Write-Host '::error::[K] stage=readback :: forcelist keys do not hold 2 entries each'; exit 1 }
          $edgeExe = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          $loaded = @()
          if (-not $edgeExe) { Write-Host '::warning::[K] Edge binary not found - profile-unpack check skipped (policy readback still proven)' }
          else {
              $profile = Join-Path $env:RUNNER_TEMP ('edge-lab-' + [guid]::NewGuid().ToString('N'))
              # headless Edge still unpacks force-installed extensions into the profile
              Start-Process -FilePath $edgeExe -ArgumentList @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check',('--user-data-dir=' + $profile),'about:blank') -WindowStyle Hidden | Out-Null
              for ($i = 0; $i -lt 24; $i++) {
                  Start-Sleep -Seconds 5
                  $extRoot = Join-Path $profile 'Default\Extensions'
                  if (Test-Path -LiteralPath $extRoot) {
                      $loaded = @(Get-ChildItem -LiteralPath $extRoot -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
                      if (($loaded -contains $ubo.id) -and ($loaded -contains $dr.id)) { break }
                  }
              }
              try { Get-Process -Name msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch { }
              Write-Host ('[K] Edge profile extension dirs: ' + ($loaded -join ', '))
              if (-not (($loaded -contains $ubo.id) -and ($loaded -contains $dr.id))) {
                  Write-Host '::error::[K] stage=extensions :: the forced Edge extensions were not unpacked into the profile (store fetch blocked?)'; exit 1
              }
          }
          Write-Host ('[K] PASS: live-resolved ids -> policy keys -> readback (' + $edgeBack + '/' + $cwsBack + ') -> Edge unpacked ' + ($loaded -join ','))
          'K_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          ('K_edge=' + $edgeBack) | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "L: qBittorrent .torrent/magnet default"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-3 §3.4] The REAL shared helper (payloads/ghrdp-provision-apps.ps1)
          # discovers the ProgId from the installed shell registration and points
          # .torrent + magnet at the plain app. No download/index automation.
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-provision-apps.ps1')
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          $exe = Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe -and $winget) {
              & $winget install --id qBittorrent.qBittorrent --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3 | Out-Null
              $exe = Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { Write-Host '::error::[L] stage=presence :: qBittorrent is not installed in this lab (winget unavailable?)'; exit 1 }
          $assoc = Set-QbittorrentDefaultHandler -ExePath $exe.FullName
          Write-Host ('[L] ok=' + $assoc.ok + ' progId=' + $assoc.progId + ' .torrent=' + $assoc.torrent + ' magnet=' + $assoc.magnet + ' error=' + $assoc.error)
          if (-not $assoc.ok) { Write-Host '::error::[L] stage=association :: .torrent/magnet readback mismatch'; exit 1 }
          $magnetCmd = [string](Get-ItemProperty -LiteralPath 'Registry::HKEY_CLASSES_ROOT\magnet\shell\open\command').'(default)'
          $urlProto = [string](Get-Item -LiteralPath 'Registry::HKEY_CLASSES_ROOT\magnet').GetValue('URL Protocol')
          $torDefault = [string](Get-Item -LiteralPath 'Registry::HKEY_CLASSES_ROOT\.torrent').GetValue('')
          if (($magnetCmd -notmatch 'qbittorrent\.exe') -or ($torDefault -ne $assoc.progId)) { Write-Host '::error::[L] stage=readback :: association readback failed'; exit 1 }
          Write-Host ('[L] PASS: .torrent -> ' + $torDefault + ' ; magnet -> ' + $magnetCmd + ' ; URL Protocol declared=' + ($urlProto -ne $null))
          'L_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "M: zero console windows"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-5 §5] Contract: every host-helper launch in the shipped
          # workflows is hidden or a SYSTEM scheduled task. Runtime sweep: no
          # VISIBLE console window may belong to a ghrdp helper right now.
          $wf = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\workflows\main.yml'))
          $bad = @()
          foreach ($line in ($wf -split "`n")) {
              if ($line -match 'Start-Process' -and ($line -notmatch 'WindowStyle Hidden|NoNewWindow') -and ($line -notmatch '^\s*#')) { $bad += $line.Trim() }
          }
          if ($bad.Count -gt 0) { Write-Host ('::error::[M] stage=static :: unhidden Start-Process in main.yml: ' + ($bad -join ' | ')); exit 1 }
          $visible = @()
          try {
              $visible = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {
                  $_.Name -match '^(cmd|powershell|pwsh|conhost|wscript|cscript)\.exe$' -and $_.CommandLine -match 'ghrdp|websockify'
              })
          } catch { }
          $win = @()
          foreach ($p in $visible) {
              try { if ((Get-Process -Id $p.ProcessId -ErrorAction Stop).MainWindowHandle -ne 0) { $win += ($p.Name + ' pid=' + $p.ProcessId) } } catch { }
          }
          Write-Host ('[M] ghrdp console-class processes=' + $visible.Count + ' with a VISIBLE window=' + $win.Count)
          if ($win.Count -gt 0) { Write-Host ('::error::[M] stage=runtime :: visible console window from a ghrdp helper: ' + ($win -join ', ')); exit 1 }
          Write-Host '[M] PASS: helpers are hidden/SYSTEM and no visible console window exists (first-session visual check stays PENDING-USER)'
