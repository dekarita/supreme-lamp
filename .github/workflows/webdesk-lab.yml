# [F9n-lab] RESERVED-ENV FALLBACK LAB (tailnet-HTTP web desktop proof).
#
# Intent (stated once): the reserved lab env `dekarita/ghrdp-lab` is the
# intended home for this job (see PR body / session notes). It is NOT
# reachable from CI tooling: `gh repo view dekarita/ghrdp-lab` -> 404
# (the token cannot read repos outside the installation's allow-list).
# Retried, then this in-repo fallback is used so the F9n proof is not
# blocked:
#
#   * same runner class (windows-latest, Azure, ephemeral) as main.yml's rdp job
#   * REAL Tailscale login (repo secret TS_AUTHKEY)
#   * NO `tailscale serve` anywhere (retired: Windows SYSTEM operator lock 401)
#   * REAL noVNC clone + REAL websockify bound to the lab runner tailnet IP
#   * the production Start-Websockify launcher is EXTRACTED VERBATIM from
#     .github/workflows/main.yml and executed, so the lab exercises the exact
#     production code (CGNAT guard + stale-kill + paired redirects + LISTEN wait)
#   * the F9n self-test is EXTRACTED VERBATIM from main.yml and executed with
#     `pwsh -File`, so the lab proves the exact production classifier
#
# Phase 1 (BIND):   extract the production launcher, read config rdpIp (the
#   ONLY tailnet-IP source - no `tailscale ip` fallback), create the
#   GHRDP-Webdesk CGNAT-only firewall rule, bind <rdpIp>:7333, curl the
#   advertised URL 3x5s expecting the noVNC marker. An evidence-only
#   `tailscale ip -4` probe is logged first: whether it 401s (SYSTEM lock)
#   or succeeds, the verdict must not depend on it.
# Phase 2 (SELFTEST): run the extracted production self-test verbatim against
#   the Phase-1 backend; expect exit 0 + noVNC marker + PASS annotation.
# Phase 3 (NEGATIVE): point config at an unroutable CGNAT address, kill
#   websockify, run the SAME extracted self-test: it must classify
#   backend-dead, write the diagnostics payload, clear the URL with the
#   locked serve-failed/self-test-failed codes, and throw (fail-closed).
#
# LAB_REV=5 (F9n: tailnet-HTTP proof; serve retired from the webdesk path).
# Evidence channel: run logs/artifacts live on the results blob host, which is
# not always reachable from the tooling that drives this lab, so every probe
# also emits a ::warning::/::notice:: annotation - annotations are readable
# through the ordinary GitHub API (GET /check-runs/<id>/annotations).
#
# Artifacts are secret-free by construction: websockify never receives
# VNC_PASS (its argument list is dir + tailnet bind + loopback VNC target
# only), and Tailscale credentials never appear in the files this job uploads.
name: webdesk-lab (F9n tailnet-HTTP proof)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/webdesk-lab.yml'

permissions:
  contents: read

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo (main.yml source of truth)
        uses: actions/checkout@v4

      - name: Lab bootstrap (host layout + lab hostname)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $labRoot = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $labRoot -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $labRoot 'webdesk') -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_HOST=webdesk-lab-' + $env:GITHUB_RUN_NUMBER)
          Write-Host ('[lab] hostname will be webdesk-lab-' + $env:GITHUB_RUN_NUMBER)
          exit 0

      - name: Install Tailscale (msi)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          & curl.exe -fL --retry 3 --connect-timeout 30 --max-time 300 -o tailscale-setup.msi $url 2>$null
          $LASTEXITCODE = 0
          if (-not (Test-Path 'tailscale-setup.msi')) { throw '[lab] tailscale msi download failed' }
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'tailscale-setup.msi', '/quiet', '/norestart'
          Start-Sleep -Seconds 5
          Write-Host ('[lab] tailscale installed: ' + ((& 'C:\Program Files\Tailscale\tailscale.exe' version 2>$null | Select-Object -First 1) -join ' '))
          exit 0

      - name: Tailscale up (lab node) + capture LAB_IP
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not $env:TS_AUTHKEY) { throw '[lab] TS_AUTHKEY secret missing in dekarita/supreme-lamp - lab cannot run.' }
          $upLog = Join-Path $env:RUNNER_TEMP 'lab-ts-up.log'
          $upErr = Join-Path $env:RUNNER_TEMP 'lab-ts-up.err'
          Start-Process -FilePath $ts -ArgumentList @('up', ('--authkey=' + $env:TS_AUTHKEY), '--accept-dns=true', ('--hostname=' + $env:LAB_HOST)) -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $j = ((& $ts status --json 2>$null) -join "`n") | ConvertFrom-Json
                  if ($j.BackendState -eq 'Running') { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
          }
          if (-not $ok) {
              $tail = ''
              foreach ($f in @($upLog, $upErr)) { if (Test-Path -LiteralPath $f) { $tail += [System.IO.File]::ReadAllText($f) } }
              if ($env:TS_AUTHKEY) { $tail = $tail -replace [regex]::Escape($env:TS_AUTHKEY), '[redacted]' }
              Write-Host ('[lab] tailscale up tail: ' + (($tail -split "`r?`n" | Select-Object -Last 10) -join ' | '))
              throw '[lab] tailscale up did not reach Running'
          }
          $dns = [string](((& $ts status --json 2>$null) -join "`n") | ConvertFrom-Json).Self.DNSName
          $dns = $dns.TrimEnd('.')
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_DNS=' + $dns)
          Write-Host ('[lab] tailscale Running as ' + $dns)
          # LAB_IP capture (this step is the ONLY lab step allowed CLI calls;
          # the F9n proof steps below must use config rdpIp only, by design).
          $labIp = ''
          $ipProbe = ''
          try {
              $ipProbe = ((& $ts ip -4 2>&1 | ForEach-Object { [string]$_ }) -join ' | ')
              $LASTEXITCODE = 0
              $cand = ($ipProbe -split '\s+' | Where-Object { $_ -match '^100\.' } | Select-Object -First 1)
              if ($cand -match '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') { $labIp = ([string]$cand).Trim() }
          } catch { }
          Write-Host ('[lab] tailscale ip -4 probe: ' + $ipProbe)
          if (-not $labIp) {
              try {
                  $js = ((& $ts status --json 2>$null) -join "`n") | ConvertFrom-Json
                  $LASTEXITCODE = 0
                  foreach ($a in @($js.Self.TailscaleIPs)) {
                      if ([string]$a -match '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') { $labIp = [string]$a; break }
                  }
              } catch { Write-Host ('[lab] status --json fallback failed: ' + $_.Exception.Message) }
          }
          if ($ipProbe -match '401|already in use') { Write-Host '[lab] NOTE: step-context CLI shows the 401 SYSTEM-operator lock; the F9n proof uses config rdpIp only.' }
          if (-not $labIp) { throw '[lab] no tailnet IPv4 for the lab node (ip -4 + status fallback both failed)' }
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_IP=' + $labIp)
          Write-Host ('[lab] LAB_IP = ' + $labIp)
          exit 0

      - name: Seed host layout (noVNC + websockify + config.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $novnc = Join-Path $root 'novnc'
          if (-not (Test-Path -LiteralPath (Join-Path $novnc 'vnc.html'))) {
              & git.exe clone --depth 1 https://github.com/novnc/noVNC.git $novnc 2>&1 | Select-Object -Last 2 | Out-Null
          }
          & python -m pip install --disable-pip-version-check --quiet websockify 2>&1 | Select-Object -Last 2 | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $novnc 'vnc.html'))) { throw '[lab] noVNC assets missing' }
          $labIp = [string]$env:LAB_IP
          if ($labIp -notmatch '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') { throw '[lab] LAB_IP is not a CGNAT address; refusing to seed (fail-closed input contract)' }
          $url = 'http://' + $labIp + ':7333/vnc.html?autoconnect=1&resize=remote'
          $cfg = [ordered]@{ hostKind = 'ephemeral'; hostname = $env:LAB_HOST; rdpIp = $labIp; webdeskUrl = $url; webdeskReason = ''; webdeskDetail = '' }
          $enc = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), ($cfg | ConvertTo-Json -Depth 6), $enc)
          Write-Host ('[lab] seeded config.rdpIp = ' + $labIp)
          Write-Host ('[lab] seeded config.webdeskUrl = ' + $url)
          exit 0

      - name: F9n BIND PROOF - production launcher + firewall + marker curl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # EVIDENCE-ONLY: does the step-context CLI 401 on this host? This probe
          # never fails the step; the verdict below must not depend on it (F9n design).
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          try {
              $probe401 = ((& $ts ip -4 2>&1 | ForEach-Object { [string]$_ }) -join ' | ')
              $LASTEXITCODE = 0
              Write-Host ('[lab] evidence: `tailscale ip -4` in bind-proof context says: ' + $probe401)
              if ($probe401 -match '401|already in use') { Write-Host '[lab] evidence: 401 SYSTEM-operator lock CONFIRMED in this context; proceeding via config rdpIp (F9n design)' }
          } catch { Write-Host ('[lab] evidence probe error: ' + $_.Exception.Message) }
          # Extract the production launcher verbatim from main.yml (first copy).
          $all = Get-Content -LiteralPath '.github/workflows/main.yml'
          $start = -1
          for ($i = 0; $i -lt $all.Count; $i++) { if ($all[$i] -match '^          function Start-Websockify\(') { $start = $i; break } }
          if ($start -lt 0) { throw '[lab] production Start-Websockify not found in main.yml' }
          $end = $start
          while ($end -lt $all.Count -and $all[$end] -ne '          }') { $end++ }
          if ($end -ge $all.Count) { throw '[lab] production launcher end not found' }
          $fnText = ($all[$start..$end] -join "`n")
          if ($fnText -notmatch '\$BindIp') { throw '[lab] extracted launcher is not the F9n BindIp form (prod/lab skew)' }
          . ([scriptblock]::Create($fnText))
          Write-Host ('[lab] extracted production Start-Websockify: ' + ($end - $start + 1) + ' lines')
          # F9n section 1: config rdpIp -> validate -> firewall -> bind -> curl marker.
          $cfgPath = 'C:\ghrdp\config.json'
          $rdpIp = ([string](([System.IO.File]::ReadAllText($cfgPath) | ConvertFrom-Json).rdpIp)).Trim()
          if ($rdpIp -notmatch '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') { throw '[lab] config rdpIp invalid; refusing to fabricate (tailnet-ip-unavailable)' }
          Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -Direction Inbound -Protocol TCP -LocalPort 7333 -RemoteAddress '100.64.0.0/10' -Action Allow -Profile Any -Enabled True -ErrorAction Stop | Out-Null
          Write-Host '[lab] firewall: GHRDP-Webdesk inbound TCP 7333 from 100.64.0.0/10 ALLOW'
          $wsUp = Start-Websockify -BindIp $rdpIp
          Write-Host ('[lab] websockify ' + $rdpIp + ':7333 LISTEN: ' + $wsUp)
          if (-not $wsUp) { throw '[lab] production launcher failed to bind the tailnet IP' }
          $url = 'http://' + $rdpIp + ':7333/vnc.html?autoconnect=1&resize=remote'
          $pass = $false
          for ($i = 1; $i -le 3; $i++) {
              $bf = Join-Path $env:RUNNER_TEMP ('lab-bind-' + $i + '.html')
              $code = ((& curl.exe -s --max-time 20 -o $bf -w '%{http_code}' $url 2>$null) -join '').Trim()
              $LASTEXITCODE = 0
              $marker = $false
              try { if ((Test-Path -LiteralPath $bf) -and ([System.IO.File]::ReadAllText($bf) -match 'noVNC')) { $marker = $true } } catch { }
              Write-Host ('[lab] bind proof curl ' + $i + ' HTTP [' + $code + '] noVNC=' + $marker)
              if ($code -eq '200' -and $marker) { $pass = $true; break }
              Start-Sleep -Seconds 5
          }
          $fwPresent = [bool](Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction SilentlyContinue)
          $listen = [bool](Get-NetTCPConnection -LocalAddress $rdpIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue)
          if ($pass) {
              Write-Host ('::notice title=lab BIND PROOF (tailnet HTTP)::url=' + $url + ' ; HTTP 200 + noVNC marker ; listen=' + $listen + ' ; firewall=' + $fwPresent)
              exit 0
          } else {
              Write-Host ('::warning title=lab BIND PROOF FAILED::url=' + $url + ' ; listen=' + $listen + ' ; firewall=' + $fwPresent)
              throw '[lab] bind proof FAILED: advertised URL did not serve the noVNC marker'
          }

      - name: F9n SELFTEST PROOF - extracted production self-test (verbatim from main.yml)
        id: selftest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $all = Get-Content -LiteralPath '.github/workflows/main.yml'
          $start = -1
          for ($i = 0; $i -lt $all.Count; $i++) { if ($all[$i] -match '^      - name: Web desktop self-test') { $start = $i; break } }
          if ($start -lt 0) { throw '[lab] self-test step not found in main.yml' }
          $end = $all.Count
          for ($i = $start + 1; $i -lt $all.Count; $i++) { if ($all[$i] -match '^      - name: ') { $end = $i; break } }
          $runLine = -1
          for ($i = $start; $i -lt $end; $i++) { if ($all[$i] -match '^        run: \|') { $runLine = $i; break } }
          if ($runLine -lt 0) { throw '[lab] self-test step has no block run script' }
          $script = @()
          for ($i = $runLine + 1; $i -lt $end; $i++) {
              $l = $all[$i]
              if ($l.Trim() -eq '') { $script += ''; continue }
              if ($l -notmatch '^          ') { break }
              $script += $l.Substring(10)
          }
          if (($script -join "`n") -notmatch "'backend-root'") { throw '[lab] extracted self-test is not the F9n form (prod/lab skew)' }
          $out = Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'
          [System.IO.File]::WriteAllLines($out, $script, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host ('[lab] extracted self-test: ' + $script.Count + ' lines -> ' + $out)
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $out
          $rc = $LASTEXITCODE
          Write-Host ('[lab] extracted self-test exit code = ' + $rc + ' (0 = PASS, as designed)')
          exit $rc

      - name: SELFTEST PROBE - survival + listener + firewall after the self-test
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
          $lines = @()
          $pids = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | Select-Object -ExpandProperty ProcessId)
          $labIp = [string]$env:LAB_IP
          $listen = $false
          if ($labIp) { $listen = [bool](Get-NetTCPConnection -LocalAddress $labIp -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue) }
          $lines += ('probe=SELFTEST-PROBE python-websockify-pids=' + ($pids -join ',') + ' tailnet-listen-7333=' + $listen)
          $cfg = ''
          try { $cfg = [System.IO.File]::ReadAllText('C:\ghrdp\config.json') } catch { }
          $lines += ('probe=SELFTEST-PROBE config=' + (($cfg -replace '\s+', ' ')))
          $url = 'http://' + $labIp + ':7333/vnc.html?autoconnect=1&resize=remote'
          $sf = Join-Path $env:RUNNER_TEMP 'selftest-probe.html'
          $sc = ((& curl.exe -s --max-time 25 -o $sf -w '%{http_code}' $url 2>$null) -join '').Trim()
          $LASTEXITCODE = 0
          $lines += ('probe=SELFTEST-PROBE advertised-http=' + $sc)
          if (Test-Path -LiteralPath $sf) { $body = [System.IO.File]::ReadAllText($sf); if ($body.Length -gt 120) { $body = $body.Substring(0, 120) }; $lines += ('probe=SELFTEST-PROBE first120=' + ($body -replace '\s+', ' ')) }
          $lines += ('probe=SELFTEST-PROBE firewall=' + ([bool](Get-NetFirewallRule -DisplayName 'GHRDP-Webdesk' -ErrorAction SilentlyContinue)))
          $lines | ForEach-Object { Write-Host ('[lab] ' + $_) }
          Add-Content -LiteralPath (Join-Path $diagDir 'lab-selftest-probe.txt') -Value ($lines -join "`n")
          Write-Host ('::notice title=lab SELFTEST PROBE (after extracted self-test)::' + ($lines -join ' ; '))
          exit 0

      - name: F9n NEGATIVE PROOF - classified halt on unroutable IP (expect halt)
        if: always()
        # NOTE: NO continue-on-error here - a failed negative proof must fail
        # the job (a green run is the proof; masking it would be vacuous).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'))) {
              Write-Host '[lab] negative proof SKIPPED: no extracted self-test.'
              exit 0
          }
          # Point config at an unroutable CGNAT address (bind must fail: not a
          # local address), kill websockify, then run the SAME extracted
          # self-test: it must classify backend-dead, write the diagnostics
          # payload, clear the URL with the locked codes, and throw (fail-closed).
          $cfgPath = 'C:\ghrdp\config.json'
          $enc = New-Object System.Text.UTF8Encoding($false)
          $orig = [System.IO.File]::ReadAllText($cfgPath)
          try {
              $cfg = $orig | ConvertFrom-Json
              $cfg.rdpIp = '100.127.255.250'
              $cfg.webdeskUrl = 'http://100.127.255.250:7333/vnc.html?autoconnect=1&resize=remote'
              [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 6), $enc)
              try { Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } } catch { }
              Write-Host '[lab] negative: config pointed at unroutable 100.127.255.250, websockify killed'
              $out = Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'
              $p = Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $out) -Wait -PassThru -NoNewWindow
              Write-Host ('[lab] negative: extracted self-test exit = ' + $p.ExitCode + ' (non-zero = fail-closed halt, as designed)')
              $cl = Join-Path $env:RUNNER_TEMP 'webdesk-diag\classification.txt'
              $clTxt = ''
              if (Test-Path -LiteralPath $cl) { $clTxt = (([System.IO.File]::ReadAllText($cl)) -replace "`r?`n", ' | ') }
              else { $clTxt = 'classification.txt MISSING (payload incomplete)' }
              Write-Host ('[lab] negative classification.txt: ' + $clTxt)
              $cfgCheck = [System.IO.File]::ReadAllText($cfgPath) | ConvertFrom-Json
              $cfgAfter = (([System.IO.File]::ReadAllText($cfgPath)) -replace '\s+', ' ')
              Write-Host ('::warning title=lab NEGATIVE proof (classified halt)::exit=' + $p.ExitCode + ' ; ' + $clTxt + ' ; config=' + $cfgAfter)
              if ($p.ExitCode -eq 0) { throw '[lab] NEGATIVE PROOF FAILED: self-test exited 0 on an unroutable URL (fail-open)' }
              if ($clTxt -notmatch 'backend-dead') { throw '[lab] NEGATIVE PROOF FAILED: expected backend-dead classification' }
              if ([string]$cfgCheck.webdeskUrl -ne '') { throw '[lab] NEGATIVE PROOF FAILED: advertised URL not cleared' }
              if ([string]$cfgCheck.webdeskReason -ne 'serve-failed' -or [string]$cfgCheck.webdeskDetail -ne 'self-test-failed') { throw '[lab] NEGATIVE PROOF FAILED: locked codes not stamped' }
              Write-Host '[lab] negative proof VERIFIED: backend-dead + URL cleared + locked codes + halt'
          } finally {
              [System.IO.File]::WriteAllText($cfgPath, $orig, $enc)
          }
          exit 0

      - name: Stage diagnostics inside the workspace (upload-artifact v4 root)
        if: always()
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'webdesk-diag'
          New-Item -ItemType Directory -Path $stage -Force -ErrorAction SilentlyContinue | Out-Null
          try {
              Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'webdesk-diag\*') -Destination $stage -Force -Recurse -ErrorAction SilentlyContinue
          } catch { }
          foreach ($f in @('C:\ghrdp\webdesk\websockify.log', 'C:\ghrdp\webdesk\websockify.err.log')) {
              if (Test-Path -LiteralPath $f) { Copy-Item -LiteralPath $f -Destination (Join-Path $stage ([System.IO.Path]::GetFileName($f))) -Force -ErrorAction SilentlyContinue }
          }
          Add-Content -LiteralPath (Join-Path $stage 'MANIFEST.txt') -Value ('lab staged at ' + (Get-Date).ToUniversalTime().ToString('o'))
          Write-Host ('[lab] staged ' + (Get-ChildItem -LiteralPath $stage -ErrorAction SilentlyContinue).Count + ' file(s)')

      - name: Upload webdesk-diag artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdesk-diag
          if-no-files-found: warn
          retention-days: 14
          path: webdesk-diag

      - name: Lab teardown (logout lab node)
        if: always()
        shell: pwsh
        run: |
          try { & 'C:\Program Files\Tailscale\tailscale.exe' logout 2>&1 | Select-Object -First 3 | ForEach-Object { Write-Host ('[lab] ' + $_) } } catch { }
          exit 0
