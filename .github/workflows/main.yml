          .tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:8px}
          .tile.done .n{color:var(--teal)}.tile.act .n{color:var(--amber)}.tile.fail .n{color:var(--red)}.tile.trk .n{color:var(--ink)}
          .crow{display:grid;grid-template-columns:48px 1fr 60px;gap:10px;align-items:center;margin:8px 0}
          .crow .ck{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mut)}
          .crow code{font-family:var(--mono);font-size:12.5px;background:#070b0f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
          .cp{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:#14202a;color:var(--teal);border:1px solid var(--teal-d);border-radius:8px;padding:8px 4px;cursor:pointer;transition:background .15s ease}
          .cp:hover{background:var(--teal-d)}.cp.done{color:var(--green);border-color:#1f6f43}
          .btn{display:block;width:100%;text-align:center;border:0;cursor:pointer;font-family:var(--disp);font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:12px;padding:15px;font-size:14px;transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;text-decoration:none}
          .btn.rdp{background:linear-gradient(180deg,#3fd9bd,#1f9d89);color:#04201c;box-shadow:0 10px 24px rgba(52,211,182,.22);margin-bottom:12px}
          .btn.rdp:hover{filter:brightness(1.07);transform:translateY(-1px)}
          .btn.em{background:linear-gradient(180deg,#f0644c,#c83a26);color:#fff;box-shadow:0 10px 26px rgba(239,93,69,.28)}
          .btn.em:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.em:active{transform:scale(.98)}
          .banner{display:none;margin-top:12px;padding:14px;border-radius:12px;text-align:center;font-family:var(--disp);font-weight:700;font-size:14px}
          .banner.safe{display:block;background:linear-gradient(180deg,#16402c,#0f2a1d);color:var(--green);border:1px solid #1f6f43}
          .banner.warn{display:block;background:var(--amber-d);color:var(--amber);border:1px solid #6b4414}
          .lower{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}
          .files .head,.frow{display:grid;grid-template-columns:74px 1fr 96px 60px;gap:10px;align-items:center}
          .files .head{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:0 4px 10px;border-bottom:1px solid var(--line)}
          .flist{max-height:300px;overflow:auto;margin-top:6px}
          .frow{padding:9px 4px;border-bottom:1px solid #141c23;transition:background .15s ease,transform .15s ease}
          .frow:hover{background:#131b22;transform:translateX(2px)}
          .frow .nm{font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .frow .src{font-family:var(--mono);font-size:10px;color:var(--mut)}
          .st{font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:3px 8px;border-radius:6px;text-align:center}
          .st.ok{background:var(--teal-d);color:var(--teal)}.st.limit{background:var(--red-d);color:var(--red)}.st.uploading{background:var(--amber-d);color:var(--amber)}
          .bar{height:6px;border-radius:999px;background:#070b0f;border:1px solid var(--line);overflow:hidden}
          .bar.ok>i{display:block;height:100%;width:100%;background:var(--teal)}
          .bar.up>i{display:block;height:100%;width:40%;background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 6px,#7a5612 6px,#7a5612 12px);animation:slide 1s linear infinite}
          .bar.limit>i{display:block;height:100%;width:100%;background:var(--red)}
          @keyframes slide{to{background-position:24px 0}}
          .log pre{font-family:var(--mono);font-size:11px;line-height:1.6;color:#9fe7d6;background:#060a0e;border:1px solid var(--line);border-radius:10px;padding:12px;height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}
          .empty{color:var(--mut);font-family:var(--mono);font-size:12px;padding:18px 4px}
          .code{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--mut);background:#060a0e;border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all}
          .diagbtn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--amber-d);color:var(--amber);border:1px solid #5a4414;border-radius:8px;padding:7px 12px;cursor:pointer;transition:background .15s ease}
          .diagbtn:hover{background:#2a2008}
          #diagBox{display:none;margin-top:16px}
          #diagBox .verdict{font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap}
          #diagBox .verdict .ok{color:var(--green)}#diagBox .verdict .bad{color:var(--red)}#diagBox .verdict .warn{color:var(--amber)}
          details.setup{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
          details.setup>summary{cursor:pointer;padding:13px 16px;font-family:var(--disp);font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:9px}
          details.setup>summary::-webkit-details-marker{display:none}
          details.setup>summary .ar{transition:transform .2s ease;color:var(--mut)}
          details.setup[open]>summary .ar{transform:rotate(90deg)}
          details.setup .body{padding:0 16px 16px;font-family:var(--mono);font-size:11.5px;color:var(--mut);line-height:1.7}
          details.setup .body b{color:var(--ink)}
          details.setup .body .dl{display:inline-block;margin:10px 0 4px;background:linear-gradient(180deg,#9b8cff,#6a5ad0);color:#fff;text-decoration:none;font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:10px;padding:11px 18px;font-size:12.5px}
          .hint{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:10px;display:none}
          @media(max-width:900px){.grid,.lower{grid-template-columns:1fr}}
          ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#243340;border-radius:9px}
          </style>
          </head>
          <body>
          <div class="wrap">
            <header>
              <div class="brand"><div class="logo">R</div><div><h1>Mission Control</h1><span class="tag">live mirror telemetry · RDP</span></div></div>
              <div class="hstat"><span class="clock" id="clock">--:--:--</span><span class="chip" id="mode">checking…</span><button class="diagbtn" id="diagBtn" type="button">🔍 DIAGNOSE</button><span class="pill" id="alive"><span class="d"></span><span id="alivetxt">checking</span></span></div>
            </header>
            <div class="grid">
              <div class="stack">
                <div class="panel hero"><div class="lbl">Overall uploaded</div><div class="pct"><span id="pct">0</span><small>%</small></div><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span><b id="bDone">0 B</b> / <span id="bTotal">0 B</span></span><span>throughput <b id="speed">0 B/s</b></span><span>eta <b id="eta">—</b></span></div></div>
                <div class="panel active"><div class="lbl">Active transfer</div><div class="row1"><span class="fname" id="aName">idle</span><span class="phase idle" id="aPhase">idle</span></div><div class="mini"><i id="aBar"></i></div><div class="meta" style="margin-top:10px"><span><b id="aBytes">0 B</b> / <span id="aTotal">0 B</span></span><span><b id="aSpeed">0 B/s</b></span></div><div class="eyes" id="eyes"></div></div>
              </div>
              <div class="stack">
                <div class="panel">
                  <div class="lbl" style="margin-bottom:12px">RDP credentials <span style="color:var(--mut);text-transform:none;letter-spacing:0">(auto-filled by handler)</span></div>
                  <div class="crow" data-k="ip"><span class="ck">IP</span><code id="vIp">__IP__</code><button class="cp" type="button">copy</button></div>
                  <div class="crow" data-k="user"><span class="ck">USER</span><code id="vUser">__USER__</code><button class="cp" type="button">copy</button></div>
                  <div class="crow" data-k="pass"><span class="ck">PASS</span><code id="vPass">__PASS__</code><button class="cp" type="button">copy</button></div>
                  <a class="btn rdp" id="rdp" href="__GHRDP__">⚡ Open Remote Desktop (zero typing)</a>
                  <div class="hint" id="setupHint">RDP didn't open? Expand “First-time setup” below and run the connector once.</div>
                  <details class="setup" id="setupBox"><summary><span class="ar">▶</span> First-time setup (one click, only if handler missing)</summary><div class="body">The <b>ghrdp://</b> link auto-fills your password and opens RDP — but your browser needs the tiny connector installed <b>once</b>.<br><a class="dl" href="/install.ps1" download>⬇ Download connector</a><br>Then right-click <b>ghrdp-install.ps1</b> → <b>Run with PowerShell</b>. If blocked, in PowerShell run:<br><code>Set-ExecutionPolicy -Scope CurrentUser Bypass -Force</code><br>After it says SUCCESS, click <b>Open Remote Desktop</b> again. Tick <b>Always allow</b> on the browser prompt once.</div></details>
                </div>
                <div class="panel"><div class="lbl" style="margin-bottom:12px">Counters</div><div class="stats"><div class="tile done"><div class="n" id="cDone">0</div><div class="k">done</div></div><div class="tile act"><div class="n" id="cAct">0</div><div class="k">active</div></div><div class="tile fail"><div class="n" id="cFail">0</div><div class="k">failed</div></div><div class="tile trk"><div class="n" id="cTrk">0</div><div class="k">tracked</div></div></div></div>
                <div class="panel" id="mirrorBox" style="display:none"><div class="lbl" style="margin-bottom:12px">Mirror control</div><button class="btn em" id="emBtn" type="button">⚡ Upload everything now</button><div class="banner" id="banner"></div><p style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:10px;line-height:1.6">Click it, wait for the green banner, <b style="color:var(--ink)">then</b> press Cancel workflow. A 2nd Cancel force-kills.</p></div>
              </div>
            </div>
            <div class="lower">
              <div class="panel files"><div class="lbl" style="margin-bottom:10px">File queue</div><div class="head"><span>status</span><span>file</span><span>progress</span><span>src</span></div><div class="flist" id="flist"><div class="empty">No files tracked yet.</div></div></div>
              <div class="panel"><div class="lbl" style="margin-bottom:10px">Live log</div><pre id="log">waiting for watcher…</pre><div class="code" id="rentry" style="display:none"></div><div id="diagBox"><div class="lbl" style="margin-bottom:8px">Diagnostics (rendered)</div><div class="verdict" id="diagOut"></div></div></div>
            </div>
          </div>
          <script>
          (function(){
            var STATIC=(document.getElementById('ghrdpStatic')||{}).content==='1';
            var currentGhrdp='__GHRDP__';
            function fb(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB';}
            function fe(rem,sp){sp=+sp||0;if(sp<=0||rem<=0)return '—';var s=rem/sp;if(s<60)return Math.round(s)+'s';if(s<3600)return Math.round(s/60)+'m';return (s/3600).toFixed(1)+'h';}
            function tick(){/* smooth % via global set in render */requestAnimationFrame(tick);} requestAnimationFrame(tick);
            function clk(){var d=new Date();document.getElementById('clock').textContent=d.toTimeString().slice(0,8);} setInterval(clk,1000);clk();
            function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
            function copyBtn(btn,val){function ok(){btn.textContent='copied';btn.classList.add('done');setTimeout(function(){btn.textContent='copy';btn.classList.remove('done');},1200);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(val).then(ok).catch(function(){fallbackCopy(val);ok();});}else{fallbackCopy(val);ok();}}
            document.querySelectorAll('.crow .cp').forEach(function(b){b.addEventListener('click',function(){var row=b.closest('.crow');var c=row?row.querySelector('code'):null;copyBtn(b,c?c.textContent:'');});});
            ['ip','user','pass'].forEach(function(k){var row=document.querySelector('.crow[data-k="'+k+'"]');if(row){var c=row.querySelector('code');if(c)row.dataset.val=c.textContent;}});
            function setGhrdp(u){currentGhrdp=u||currentGhrdp;var a=document.getElementById('ghrdpLink');var ok=!!currentGhrdp&&currentGhrdp.indexOf('ghrdp://')===0&&currentGhrdp.length>10;var r=document.getElementById('rdp');if(r){r.setAttribute('data-ok',ok?'1':'0');if(ok)r.href=currentGhrdp;}}
            function fireGhrdp(){var u=currentGhrdp;if(!u||u.indexOf('ghrdp://')!==0)return;try{var ifr=document.createElement('iframe');ifr.style.display='none';ifr.setAttribute('aria-hidden','true');ifr.src=u;document.body.appendChild(ifr);setTimeout(function(){try{ifr.remove();}catch(e){}},4000);}catch(e){}document.getElementById('setupHint').style.display='block';}
            document.getElementById('rdp').addEventListener('click',function(e){e.preventDefault();fireGhrdp();});
            function renderEyes(scan){var box=document.getElementById('eyes');if(!box)return;var keys=scan?Object.keys(scan):[];if(!keys.length){box.innerHTML='<div class="lbl" style="margin-bottom:6px">Watcher eyes</div><div class="eye-row"><span class="t">no scan yet</span><span class="v">starting…</span></div>';return;}var h='<div class="lbl" style="margin-bottom:6px">Watcher eyes (what it actually sees)</div>';keys.forEach(function(k){var o=scan[k]||{};var cls='v';var txt='raw '+o.rawTotal+' / elig '+o.eligible;if(o.error){cls+=' bad';txt+=' · '+o.error;}else if(o.rawTotal>0&&o.eligible===0){cls+=' warn';txt+=' · in progress / filtered';}else if(o.rawTotal>0){cls+=' ok';}h+='<div class="eye-row"><span class="t">'+k+'</span><span class="'+cls+'">'+txt+'</span></div>';});box.innerHTML=h;}
            function render(s){
              if(!s)return;
              var now=Date.now();var ts=s.ts?new Date(s.ts).getTime():0;var age=ts?Math.round((now-ts)/1000):999;
              var on=!s.mirror||(s.alive&&age<15);
              var al=document.getElementById('alive');al.className='pill'+(on?' on':'');document.getElementById('alivetxt').textContent=on?'online':(s.alive?'stale '+age+'s':'offline');
              if(s.ghrdp){setGhrdp(s.ghrdp);}
              if(s.creds){['ip','user','pass'].forEach(function(k){var row=document.querySelector('.crow[data-k="'+k+'"]');if(row){var c=row.querySelector('code');var val=s.creds[k]||'-';if(c)c.textContent=val;row.dataset.val=val;}});}
              // ---- Index box ----
              if(s.rentry){var r=document.getElementById('rentry');r.style.display='block';var ib='';var lg2=s.log||[];for(var q=0;q<lg2.length;q++){if(String(lg2[q]).indexOf('[INDEX]')===0){ib=lg2[q];break;}}var be='',ed='';var mm=ib.match(/backend=(\S+)\s+url=(\S+)\s+edit=(\S+)/);if(mm){be=mm[1];ed=mm[3];}r.innerHTML='index ('+(be||s.indexBackend||'?')+'): <a href="'+s.rentry+'" target="_blank" style="color:#37c6b0">'+s.rentry+'</a>'+(ed?'<br>rentry edit code: <b style="color:#e9eef3">'+ed+'</b>':'');}
              // ---- Live log: strip [INDEX] and [scan] lines ----
              var lg=s.log||[];var clean=[];for(var c=0;c<lg.length;c++){if(String(lg[c]).indexOf('[INDEX]')===0||String(lg[c]).indexOf('[scan]')===0)continue;clean.push(lg[c]);}
              if(clean.length){var el=document.getElementById('log');var ab=el.scrollHeight-el.scrollTop-el.clientHeight<60;el.textContent=clean.join('\n');if(ab)el.scrollTop=el.scrollHeight;}
              document.getElementById('mirrorBox').style.display=s.mirror?'block':'none';
              var a=s.agg||{};document.getElementById('pct').textContent=a.overallPct||0;document.getElementById('fill').style.width=Math.min(100,a.overallPct||0)+'%';
              document.getElementById('cDone').textContent=a.done||0;document.getElementById('cAct').textContent=a.active||0;document.getElementById('cFail').textContent=a.failed||0;document.getElementById('cTrk').textContent=a.tracked||0;
              document.getElementById('speed').textContent=fb(a.speedBps||0)+'/s';document.getElementById('bDone').textContent=fb(a.bytesDone||0);document.getElementById('bTotal').textContent=fb(a.bytesTotal||0);
              var ac=s.active||{};document.getElementById('aName').textContent=ac.name||'idle';var ph=document.getElementById('aPhase');ph.textContent=ac.phase||'idle';ph.className='phase '+(ac.phase||'idle');document.getElementById('aBar').style.width=(ac.pct||0)+'%';document.getElementById('aBytes').textContent=fb(ac.bytesDone);document.getElementById('aTotal').textContent=fb(ac.bytesTotal);document.getElementById('aSpeed').textContent=fb(ac.speedBps)+'/s';
              renderEyes(s.scan);
              // ---- File queue with per-file pct and bar width ----
              var f=s.files||[];var fl=document.getElementById('flist');
              if(!f.length){fl.innerHTML='<div class="empty">No files tracked yet.</div>';}
              else{var h='';for(var i=0;i<f.length;i++){var it=f[i];var st=(it.status||'uploading');var bc=st==='ok'?'ok':(st==='limit'?'limit':'up');var pct=(st==='ok')?100:(+it.pct||0);var w=bc==='up'?Math.max(4,pct):pct;h+='<div class="frow"><span class="st '+st+'">'+(st==='ok'?'OK':(st==='limit'?'FAIL':pct+'%'))+'</span><span class="nm" title="'+(it.name||'')+'">'+(it.name||'')+'</span><span class="bar '+bc+'"><i style="width:'+w+'%"></i></span><span class="src">'+(it.src||'')+'</span></div>';}fl.innerHTML=h;}
              var bn=document.getElementById('banner');bn.className='banner';
              if(s.mirror){if((a.failed||0)>0&&(a.active||0)===0){bn.className='banner warn';bn.textContent=(a.failed)+' file(s) failed — check log.';}else if((a.tracked||0)>0&&(a.active||0)===0&&(a.failed||0)===0&&(a.done||0)>0){bn.className='banner safe';bn.textContent='ALL UPLOADED — safe to Cancel workflow now.';}}
            }
            function runDiag(){
              var box=document.getElementById('diagBox');var out=document.getElementById('diagOut');box.style.display='block';out.innerHTML='running diagnostics…';
              Promise.all([fetch('/diag'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).catch(function(e){return {_err:String(e)};}),fetch('/progress'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).catch(function(e){return {_err:String(e)};})]).then(function(res){
                var d=res[0]||{},p=res[1]||{};var L=[];
                L.push('server cfgLoaded '+(d.cfgLoaded?'<span class="ok">PASS</span>':'<span class="bad">FAIL</span>')+'  port7331 '+(d.portListening?'<span class="ok">PASS</span>':'<span class="bad">FAIL</span>')+'  firewall '+(d.firewallRulePresent?'<span class="ok">PASS</span>':'<span class="bad">FAIL</span>'));
                L.push('progressLoaded '+(d.progressLoaded?'<span class="ok">PASS</span>':'<span class="bad">FAIL</span>')+(d.progressError?('  ('+d.progressError+')'):''));
                L.push('request path : '+(d.requestLoopback?'loopback (inside RDP)':'tailnet serve (local pc) — expected')+'  host='+(d.requestHost||'-'));
                var scan=p.scan||{};var keys=Object.keys(scan);
                if(keys.length){L.push('');L.push('WATCHER EYES:');keys.forEach(function(k){var o=scan[k]||{};var line='  '+k+': raw='+o.rawTotal+' eligible='+o.eligible;if(o.error)line+='  -> <span class="bad">'+o.error+'</span>';else if(o.rawTotal>0&&o.eligible===0)line+='  -> <span class="warn">files present but not eligible (still downloading / incomplete / filtered)</span>';else if(o.rawTotal>0)line+='  -> <span class="ok">will upload</span>';else line+='  -> folder empty / not found';L.push(line);});}
                var agg=p.agg||{};L.push('');L.push('tracked='+(agg.tracked||0)+' done='+(agg.done||0)+' active='+(agg.active||0)+' failed='+(agg.failed||0));
                var verdict;
                if(d._err){verdict='<span class="bad">server unreachable: '+d._err+'</span>';}
                else if(keys.length&&keys.some(function(k){return (scan[k]||{}).rawTotal>0&&(scan[k]||{}).eligible>0;})){verdict='<span class="ok">UPLOADING / HEALTHY</span> — files detected and processing.';}
                else if(keys.length&&keys.some(function(k){var o=scan[k]||{};return o.rawTotal>0&&o.eligible===0&&!o.error;})){verdict='<span class="warn">FILES PRESENT BUT NOT ELIGIBLE</span> — likely still downloading (incomplete) or filtered extension. Wait for completion; watcher auto-picks them up.';}
                else if(keys.length&&keys.some(function(k){return (scan[k]||{}).error;})){verdict='<span class="bad">PATH/PERMISSION ERROR</span> — see eyes above (the watcher now resolves the real Downloads path incl. OneDrive; check the listed paths).';}
                else if(keys.length){verdict='<span class="warn">WATCHER ALIVE</span> but watched folders empty — drop a file into Downloads / Desktop / D:\\RDP-Storage inside RDP.';}
                else {verdict='<span class="warn">NO SCAN YET</span> — watcher starting; refresh in a few seconds.';}
                L.push('');L.push('>>> VERDICT: '+verdict);
                out.innerHTML=L.join('\n');
              });
            }
            document.getElementById('diagBtn').addEventListener('click',runDiag);
            document.getElementById('emBtn').addEventListener('click',function(){var b=this;b.disabled=true;b.textContent='triggered…';fetch('/emergency'+(location.search||''),{cache:'no-store'}).then(function(){setTimeout(function(){b.disabled=false;b.textContent='⚡ Upload everything now';},1500);}).catch(function(){b.disabled=false;b.textContent='⚡ Upload everything now';});});
            // ---- unified guarded live polling (works on local pc too; in-flight guard prevents abort floods) ----
            var __inflight=false;
            function pollOnce(){if(__inflight)return;__inflight=true;fetch('/progress'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(s){render(s);}).catch(function(){}).then(function(){__inflight=false;});}
            render({mirror:false,ghrdp:currentGhrdp,creds:{ip:document.getElementById('vIp').textContent,user:document.getElementById('vUser').textContent,pass:document.getElementById('vPass').textContent},viaLoopback:!STATIC,alive:true,ts:new Date().toISOString()});
            if(STATIC){document.getElementById('mode').className='chip mode-funnel';document.getElementById('mode').textContent='⬈ local pc (live)';}else{document.getElementById('mode').className='chip mode-loop';document.getElementById('mode').textContent='◉ inside rdp (live)';}
            pollOnce();setInterval(pollOnce,3000);
          })();
          </script>
          </body>
          </html>
          UIEOF

      - name: Write safe desktop debug script (read-only, accurate Tailscale + qBittorrent + incomplete detection)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Debug-GHRDP.ps1" <<'DEBUGEOF'
          param([switch]$NoPause,[switch]$ShowSecrets)
          $ErrorActionPreference = 'Continue'; $Report = New-Object System.Collections.ArrayList; $script:CurrentPID = $PID
          function Say($t = '') { Write-Host $t; [void]$Report.Add([string]$t) }
          function SayKV($k, $v) { Say (('{0,-34}: {1}' -f $k, [string]$v)) }
          function SayHeader($t) { Say ''; Say ('==================== ' + $t + ' ====================') }
          function Mask($s) { if ([string]::IsNullOrEmpty($s)) { return '' }; if ($ShowSecrets) { return $s }; if ($s.Length -le 6) { return '****' }; return $s.Substring(0, 2) + '****' + $s.Substring($s.Length - 2) }
