      - name: Verify Pages site responds 200 (print remediation if 404)
        shell: pwsh
        run: |
          $url = 'https://' + (($env:GITHUB_REPOSITORY -split '/')[0]) + '.github.io/' + (($env:GITHUB_REPOSITORY -split '/')[1]) + '/'
          $code = 0
          try { $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop; $code = [int]$r.StatusCode } catch { try { $code = [int]$_.Exception.Response.StatusCode.value__ } catch { $code = 0 } }
          Write-Host ("[verify] GET $url -> $code")
          if ($code -ne 200) {
            Write-Host '[verify] NOT 200. Remediation: (1) Settings -> Pages -> Source = Deploy from a branch -> main / /docs -> Save; (2) wait 1-2 min; (3) re-run this workflow.'
          }
          exit 0

      - name: Publish Windows 11 Explorer UI (explorer.html + search.html + index redirect)
        env:
