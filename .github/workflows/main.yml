          $up = $false; for ($i = 0; $i -lt 40; $i++) { if ((Test-Path $okFile) -and ((Get-Content $okFile -Raw) -match 'LISTENING')) { $up = $true; Write-Host "[server] $((Get-Content $okFile -Raw).Trim())"; break }; Start-Sleep -Milliseconds 500 }
          $self = $false; try { Invoke-WebRequest -Uri 'http://127.0.0.1:7331/' -UseBasicParsing -TimeoutSec 3 | Out-Null; $self = $true } catch {}; Write-Host "[selftest] server up=$up loopback7331=$self"
          Write-Host "Keep Alive 5h30"; $limit = New-TimeSpan -Hours 5 -Minutes 30; $start = Get-Date; while (((Get-Date) - $start) -lt $limit) { Start-Sleep -Seconds 60 }; Write-Host "5h30 done."

      - name: Emergency upload on cancel (always)
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        env:
          STATUS: ${{ job.status }}
        shell: pwsh
        run: |
          $sd = $env:RUNNER_TEMP; $cfgPath = Join-Path $sd 'ghrdp_cfg.json'; $lib = Join-Path $sd 'ghrdp-lib.ps1'
          if (-not ((Test-Path $cfgPath) -and (Test-Path $lib))) { Write-Host "no mirror cfg/lib - skip"; exit 0 }
          $emf = Join-Path $sd 'ghrdp_emergency.flag'; $progressPath = Join-Path $sd 'ghrdp_progress.json'; Set-Content $emf (Get-Date -f o) -Encoding ascii
          Write-Host "EMERGENCY (status=$env:STATUS) - signalled watcher; monitoring..."
          $deadline = (Get-Date).AddMinutes(12); $watcherSeen = $false
          while ((Get-Date) -lt $deadline) { $prog = $null; if (Test-Path $progressPath) { try { $prog = Get-Content $progressPath -Raw | ConvertFrom-Json -ErrorAction Stop } catch {} }; if ($prog -and $prog.ts) { $age = [int]((Get-Date) - (Get-Date $prog.ts)).TotalSeconds; if ($age -lt 15) { $watcherSeen = $true } else { Write-Host "watcher stale (${age}s) - fallback."; break } }; if ($prog -and $prog.agg) { $u = [int]$prog.agg.active; $f = [int]$prog.agg.failed; $d = [int]$prog.agg.done; $pct = $prog.agg.overallPct; Write-Host "...done=$d active=$u failed=$f overall=${pct}%" }; if ($watcherSeen -and $prog -and $prog.agg -and [int]$prog.agg.active -eq 0 -and [int]($prog.agg.tracked) -gt 0 -and [int]($prog.agg.done) -ge ([int]($prog.agg.tracked) - [int]($prog.agg.failed))) { Write-Host "Watcher finished all transfers."; break }; Start-Sleep -Seconds 5 }
          $needFallback = -not $watcherSeen; if (-not $needFallback -and (Test-Path $progressPath)) { try { $pp = Get-Content $progressPath -Raw | ConvertFrom-Json -ErrorAction Stop; if ($pp.agg -and [int]$pp.agg.active -gt 0) { $needFallback = $true } } catch {} }
          if ($needFallback) {
            Write-Host "DIRECT fallback upload..."; $env:GHRDP_CFG = $cfgPath; . $lib; $cfg = Read-Cfg; $env:GHRDP_LOG = $cfg.logFile; Init-Progress $progressPath
            foreach ($p in @('qbittorrent', 'qbittorrent-nox')) { Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue }; Start-Sleep -Seconds 4
            $junk = @('.tmp', '.crdownload', '.partial', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak'); $done = @{}; if (Test-Path $cfg.doneFile) { Get-Content $cfg.doneFile | ForEach-Object { $done[$_] = $true } }; $idx = Load-Index $cfg
            foreach ($r in $cfg.roots) { if (-not (Test-Path $r.path)) { continue }; $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending } else { Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending }; foreach ($fi in $items) { if ($done.ContainsKey($fi.FullName)) { continue }; if ($junk -contains $fi.Extension.ToLower()) { continue }; if ($fi.Length -lt $r.min) { continue }; if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }; $len = $fi.Length; $safe = $fi.Name -replace '\|', '_'; $disp = ($safe -replace '[^\x20-\x7E]', '_'); $ex = $idx | Where-Object { $_.name -eq $safe -and $_.src -eq $r.tag } | Select-Object -First 1; if (-not $ex) { $ex = @{ name = $safe; src = $r.tag; status = 'uploading'; payload = ''; gofile = ''; time = (Get-Date -f 'HH:mm:ss') }; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len }; $ex.status = 'uploading'; $enc = Join-Path $cfg.tmpDir ('em_' + [guid]::NewGuid().ToString('N') + '.enc'); $gf = $null; Set-Active $disp 'encrypt' $len; try { Encrypt-File $fi.FullName $enc $cfg.decPw } catch {}; Set-Active $disp 'upload' $len; try { $gf = Upload-Gofile-Streamed $enc $disp } catch {}; Remove-Item $enc -Force -ErrorAction SilentlyContinue; if ($gf) { $ex.payload = B64U ($gf + '|' + $cfg.decPw + '|' + $safe); $ex.gofile = $gf; $ex.status = 'ok'; $ex.time = (Get-Date -f 'HH:mm:ss'); $done[$fi.FullName] = $true; $fi.FullName | Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Write-Host "DIRECT OK $($fi.Name) ($len bytes)" } else { $ex.status = 'limit'; Write-Host "DIRECT LIMIT $($fi.Name)" }; Set-Active '' 'idle' 0 } }
            Save-Index $cfg $idx; Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null; Write-Host "DIRECT fallback upload complete."
          }
          Write-Host "Emergency handling complete."

      - name: Secure Cleanup (wipe all data)
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          & schtasks /End /TN ghrdpserver 2>$null | Out-Null; & schtasks /Delete /TN ghrdpserver /F 2>$null | Out-Null; & schtasks /End /TN ghrdpwatcher 2>$null | Out-Null; & schtasks /Delete /TN ghrdpwatcher /F 2>$null | Out-Null; $LASTEXITCODE = 0
          $ml = Join-Path $env:RUNNER_TEMP 'ghrdp_mirror.log'; if (Test-Path $ml) { Write-Host "----- mirror log tail -----"; Get-Content $ml -Tail 120 | ForEach-Object { Write-Host $_ } }
          foreach ($p in @('chrome', 'msedge', 'firefox', 'iexplore', 'brave', 'opera', 'qbittorrent')) { Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue }; Start-Sleep -Seconds 3
          foreach ($p in @("$env:LOCALAPPDATA\Google\Chrome\User Data", "$env:LOCALAPPDATA\Microsoft\Edge\User Data", "$env:APPDATA\Mozilla\Firefox\Profiles", "$env:LOCALAPPDATA\Mozilla\Firefox\Profiles", "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data", "$env:APPDATA\Opera Software\Opera Stable")) { if (Test-Path $p) { try { Remove-Item -Path $p -Recurse -Force -ErrorAction Stop } catch { Start-Sleep 2; Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue } } }
          foreach ($p in @("$env:USERPROFILE\Downloads", "$env:USERPROFILE\Desktop", "$env:USERPROFILE\Documents")) { if (Test-Path $p) { Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue } }
          if ($env:RDP_USER) { foreach ($s in @('Downloads', 'AppData\Local\Temp')) { $d = "C:\Users\$($env:RDP_USER)\$s"; if (Test-Path $d) { Remove-Item "$d\*" -Recurse -Force -ErrorAction SilentlyContinue } } }
          if (Test-Path 'D:\RDP-Storage') { Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -ErrorAction SilentlyContinue }
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item "$env:APPDATA\Microsoft\Windows\Recent\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU' -Name '*' -ErrorAction SilentlyContinue; Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths' -ErrorAction SilentlyContinue; Set-Clipboard -Value "" -ErrorAction SilentlyContinue; Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null }; $LASTEXITCODE = 0
          & "C:\Program Files\Tailscale\tailscale.exe" funnel --bg 7331 off 2>$null | Out-Null; $LASTEXITCODE = 0; & "C:\Program Files\Tailscale\tailscale.exe" serve reset 2>$null | Out-Null; $LASTEXITCODE = 0
          "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY

      - name: Overwrite free space (skip on cancel)
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Overwriting free space (cipher /w)..."; cipher /w:C:\; $LASTEXITCODE = 0; "Free-space overwrite complete." >> $env:GITHUB_STEP_SUMMARY
