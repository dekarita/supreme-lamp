          $tick = Update-RdpConnLog -StatePath $tickPath -ScanStartedUtc $start
          if (-not (Test-Path -LiteralPath $tickPath)) { X-Fail 'connlog-tick' 'the tick did not write a state file' }
          $tickJson = [System.IO.File]::ReadAllText($tickPath) | ConvertFrom-Json
