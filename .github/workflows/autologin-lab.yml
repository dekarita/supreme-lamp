          if ($env:N_result -eq 'pass') { Write-Host ('::notice::[N] handler overwrite: stale registration printed+overwritten+verified by the REAL install.cmd (cell n)') }
          if ($env:K_result -eq 'pass') { Write-Host ('::notice::[K] browser policies: live-resolved ids -> forcelist readback -> Edge unpacked the forced extensions (cell k2)') }
          if ($env:H2_result -eq 'pass') { Write-Host ('::notice::[H2] webdesk E2E: opener handoff -> shim auto-fill -> VNC-auth completed -> connected, zero manual typing, zero password leaks (cell h2)') }
          if ($env:K2_result -eq 'pass') { Write-Host ('::notice::[K2] policy UIs: edge://policy + edge://extensions + chrome://policy render the enforced extensions (cell k3)') }
          if ($env:L_result -eq 'pass') { Write-Host ('::notice::[L] qBittorrent default handler: .torrent + magnet wired to the plain app, readback ok (cell l)') }
          if ($env:F_result -eq 'pass') { Write-Host ('::notice::[G] uBlock Origin=' + $env:F_ubo); Write-Host ('::notice::[G] Dark Reader=' + $env:F_dr) }
          Write-Host ('::notice::[G] physical-PC cells (0 prompts, live peripherals, screenshot-native) remain PENDING-USER per §6; no LIVE claim is made here')
          '' | Add-Content -Path $S
          'STOP-condition note: §6(a-c) are proven at the launcher/protocol level in this lab; the physical-PC cells (0 prompts, live peripherals, physical-native screenshot) stay PENDING-USER per §6, so the AUTO-LOGIN REDIRECT LIVE line is NOT claimed.' | Add-Content -Path $S
