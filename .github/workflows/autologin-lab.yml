          Write-Host '[X] (d) PASS: 19-directive template writes > 400 bytes and the launcher read-back assert precedes the mstsc launch'
          # --- (e) synthetic RDP Operational events -> reason codes -> the row --
          $c0 = $srv.IndexOf('# [F30 §3 connlog-begin]')
          $c1 = $srv.IndexOf('# [F30 §3 connlog-end]')
          if ($c0 -lt 0 -or $c1 -le $c0) { X-Fail 'connlog-extract' 'the F30 conn-log markers are missing from ghrdp-server.ps1' }
          $clBlock = $srv.Substring($c0, $c1 - $c0)
          $errors2 = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($clBlock, [ref]$null, [ref]$errors2)
          if ($errors2 -and $errors2.Count -gt 0) { X-Fail 'connlog-parse' ('the conn-log block has ' + $errors2.Count + ' syntax error(s): ' + $errors2[0].Message) }
          . ([scriptblock]::Create($clBlock))
          if (-not (Get-Command Get-RdpConnLog -ErrorAction SilentlyContinue)) { X-Fail 'connlog-extract' 'Get-RdpConnLog was not defined by the extracted block' }
          function New-XEvent([int]$Id, [string]$TimeUtc, [string]$Msg, [int]$Level) {
              $tpl = '<Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event"><System><EventID>{ID}</EventID><Level>{LV}</Level><TimeCreated SystemTime="{T}"/></System><RenderingInfo><Message>{M}</Message></RenderingInfo></Event>'
              return $tpl.Replace('{ID}', [string]$Id).Replace('{LV}', [string]$Level).Replace('{T}', $TimeUtc).Replace('{M}', $Msg)
          }
          $start = (Get-Date).ToUniversalTime()
          function X-Iso([int]$DeltaSec) { return $start.AddSeconds($DeltaSec).ToString('o') }
          $eTls = Get-RdpConnLogEventFields -Xml ([xml](New-XEvent 105 (X-Iso -40) 'An error occurred when connecting to the server: the connection was forcibly closed by the remote host.' 2)) -Provider 'RDPServer-RdpCoreTS'
          $eAuth = Get-RdpConnLogEventFields -Xml ([xml](New-XEvent 1149 (X-Iso -30) 'Remote Desktop Services: User authentication succeeded.' 4)) -Provider 'TerminalServices-RemoteConnectionManager'
          $eCert = Get-RdpConnLogEventFields -Xml ([xml](New-XEvent 36888 (X-Iso -20) 'The certificate received from the remote server is not valid. The TLS connection request has failed.' 2)) -Provider 'Schannel'
          $eReset = Get-RdpConnLogEventFields -Xml ([xml](New-XEvent 1102 (X-Iso -10) 'The connection was reset by the peer transport.') ) -Provider 'RDPServer-RdpCoreTS'
          $eRedact = Get-RdpConnLogEventFields -Xml ([xml](New-XEvent 9001 (X-Iso -5) 'Transport retry with password=Sup3rSecretValue and SubjectUserName=must-not-leak.' 3)) -Provider 'RDPServer-RdpCoreTS'
          $got = @{ 'tls-forcibly-closed' = $eTls.reason; 'auth-succeeded' = $eAuth.reason; 'cert-rejected' = $eCert.reason; 'connection-reset' = $eReset.reason }
          foreach ($k in @('tls-forcibly-closed', 'auth-succeeded', 'cert-rejected', 'connection-reset')) {
              if ($got[$k] -ne $k) { X-Fail 'connlog-reason' ('expected reason ' + $k + ', got ' + $got[$k]) }
          }
          if ($eRedact.desc -match 'Sup3rSecretValue' -or $eRedact.desc -match 'must-not-leak') { X-Fail 'connlog-redact' ('the stored description leaked credential-shaped text: ' + $eRedact.desc) }
          if ($eRedact.desc -notmatch '\[redacted\]') { X-Fail 'connlog-redact' 'the credential-shaped token was not redacted' }
          $sum = Get-RdpConnLog -Items @($eTls, $eAuth, $eCert, $eReset, $eRedact) -ScanStartedUtc $start
          if ($sum.items.Count -ne 5) { X-Fail 'connlog-shape' ('the collector kept ' + $sum.items.Count + ' of 5 events') }
          if ($sum.newest.Count -ne 3) { X-Fail 'connlog-shape' ('the row shape is not newest-3: ' + $sum.newest.Count) }
          if ($sum.items[0].timeUtc -ne $eRedact.timeUtc) { X-Fail 'connlog-shape' ('the events are not newest-first (first is ' + $sum.items[0].timeUtc + ', expected ' + $eRedact.timeUtc + ')') }
          if (-not $sum.scanTs -or -not $sum.ts) { X-Fail 'connlog-shape' 'the sample carries no scanTs' }
          if ($sum.intervalSec -ne 30) { X-Fail 'connlog-shape' ('intervalSec=' + $sum.intervalSec) }
          $fxPath = Join-Path $env:RUNNER_TEMP 'f30-connlog-fixture.json'
