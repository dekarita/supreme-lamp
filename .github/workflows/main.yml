          }
          function navTo(node,reset){if(!reset){hist=hist.slice(0,hi+1);hist.push(node);hi++;}else{hist=[node];hi=0;}cur=node;sel=[];anchor=-1;render();renderSide();}
          function renderSide(){var el=document.getElementById("side");el.innerHTML="";(function walk(node,depth){var d=document.createElement("div");d.className="node"+(node===cur?" on":"");d.style.paddingLeft=(8+depth*14)+"px";d.textContent=(node.type==="folder"?"📁 ":"📄 ")+node.name;d.onclick=function(){if(node.type==="folder")navTo(node);};el.appendChild(d);(node.children||[]).filter(function(c){return c.type==="folder";}).forEach(function(c){walk(c,depth+1);});})(FS,0);}
          function render(){
            var q=document.getElementById("q").value.toLowerCase();
            var items=(cur.children||[]).filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0;});
            items.sort(function(a,b){if(a.type!==b.type)return a.type==="folder"?-1:1;return a.name.localeCompare(b.name);});
            document.getElementById("stL").textContent=items.length+" item"+(items.length===1?"":"s")+(sel.length?(" | "+sel.length+" selected"):"");
            var addr=document.getElementById("addr");addr.innerHTML="";var path=[];var p=cur;while(p&&p!==FS){path.unshift(p);p=p.parent;}
            function crumb(node,label){var s=document.createElement("span");s.textContent=label;s.onclick=function(){navTo(node);};addr.appendChild(s);}
            crumb(FS,"This PC");path.forEach(function(n){var iv=document.createElement("i");iv.innerHTML="&#8250;";addr.appendChild(iv);crumb(n,n.name);});
            var rows=document.getElementById("rows"),grid=document.getElementById("grid");
            rows.innerHTML="";grid.innerHTML="";
            items.forEach(function(c,idx){
              c.parent=cur;
              var isSel=sel.indexOf(idx)>=0;
              if(view==="det"){var tr=document.createElement("tr");if(isSel)tr.className="selected";tr.innerHTML="<td>"+icon(c.name)+" "+esc(c.name)+"</td><td>"+(c.dateModified||"")+"</td><td>"+typeOf(c.name)+"</td><td>"+(c.type==="folder"?"":fmt(c.size))+"</td>";wire(tr,c,idx);rows.appendChild(tr);}
              else{var g=document.createElement("div");g.className="gi"+(isSel?" selected":"");g.innerHTML="<div class=\"ic\">"+icon(c.name)+"</div><div class=\"nm\">"+esc(c.name)+"</div>";wire(g,c,idx);grid.appendChild(g);}
            });
