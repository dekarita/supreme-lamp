      - name: Emergency upload on cancel
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        shell: pwsh
        run: |
          $sd=$env:RUNNER_TEMP; $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $lib=Join-Path $sd 'ghrdp-lib.ps1'
          if(-not ((Test-Path $cfgPath) -and (Test-Path $lib))){ exit 0 }
          Set-Content (Join-Path $sd 'ghrdp_emergency.flag') (Get-Date -f o) -Encoding ascii
          $deadline=(Get-Date).AddMinutes(12); $seen=$false
          while((Get-Date) -lt $deadline){ $prog=$null; if(Test-Path (Join-Path $sd 'ghrdp_progress.json')){ try{ $prog=Get-Content (Join-Path $sd 'ghrdp_progress.json') -Raw|ConvertFrom-Json -EA Stop }catch{} }; if($prog -and $prog.ts){ $age=[int]((Get-Date)-(Get-Date $prog.ts)).TotalSeconds; if($age -lt 15){$seen=$true}else{break} }; if($seen -and $prog -and $prog.agg -and [int]$prog.agg.active -eq 0 -and [int]$prog.agg.tracked -gt 0){break}; Start-Sleep 5 }
          $needFallback=-not $seen
          if($needFallback){ $env:GHRDP_CFG=$cfgPath; . $lib; $cfg=Read-Cfg; $env:GHRDP_LOG=$cfg.logFile; Init-Progress (Join-Path $sd 'ghrdp_progress.json'); $prof=$env:USERPROFILE; $roots=@(); foreach($s in 'Downloads','Desktop','Documents'){ $roots+=@{path=(Join-Path $prof $s);rec=$false;min=0;tag=$s} }; $roots+=@{path=(Join-Path $prof 'AppData\Local\Temp');rec=$true;min=102400;tag='Temp'}; foreach($r in $cfg.roots){ if(@('Downloads','Desktop','Documents','Temp') -notcontains $r.tag){ $roots+=$r } }; $junk=@('.tmp','.crdownload','.partial','.part','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak','.!qb'); $done=@{}; if(Test-Path $cfg.doneFile){Get-Content $cfg.doneFile|ForEach-Object{$done[$_]=$true}}; $idx=Load-Index $cfg; foreach($r in $roots){ if(-not (Test-Path $r.path)){continue}; $items=Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0|Sort-Object Length -Descending; foreach($fi in $items){ if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}; $len=$fi.Length; $safe=$fi.Name -replace '\|','_'; $disp=($safe -replace '[^\x20-\x7E]','_'); $ex=$idx|Where-Object{$_.name -eq $safe -and $_.src -eq $r.tag}|Select-Object -First 1; if(-not $ex){ $ex=@{name=$safe;src=$r.tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss')}; [void]$idx.Add($ex) }; $enc=Join-Path $cfg.tmpDir ('em_'+[guid]::NewGuid().ToString('N')+'.enc'); $gf=$null; try{ Encrypt-File $fi.FullName $enc $cfg.decPw; $gf=Upload-Gofile-Streamed $enc $disp }catch{}; Remove-Item $enc -Force -EA 0; if($gf){ $ex.gofile=$gf; $ex.status='ok'; $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; Write-Host "OK $($fi.Name)" } else { $ex.status='limit'; Write-Host "LIMIT $($fi.Name)" } } }; Save-Index $cfg $idx; Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null }
