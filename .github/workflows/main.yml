            [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false))
          }
          New-Item -ItemType Directory -Path 'C:\ProgramData\ghrdp' -Force -ErrorAction SilentlyContinue | Out-Null; Set-Content 'C:\ProgramData\ghrdp\cfgpath.txt' $cfgPath -Encoding ASCII -ErrorAction SilentlyContinue
          Write-Host "Config written. mirror=$mirrorOn."; & (Join-Path $sd 'ghrdp-summary.ps1') $cfgPath

