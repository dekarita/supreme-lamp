      # transport selection in /api/fetch, the §1 aria2c CLI pins and the two labs.
      # [F59 §4] ADDITIVE: ONE new counted bash gate. It runs the F59 contract
      # suites and asserts the flipped defaults, the prebuilt asset path, the
      # startup-timing instrumentation and the preserved auto-path encryption
      # floor against the SHIPPED files. The three values it pins are exactly the
      # ones F59 flips, so the F48/F52/F56-d assertions for those same three
      # values were rewritten in place (no gate deleted, no floor weakened).
      - name: F59 default flips + prebuilt assets + startup timing gates
        shell: bash
        run: |
          set -euo pipefail
          # [F97] the parallel-prewarm lab proves concurrency by INTERVAL OVERLAP
          # (never a fixed wall-clock budget: Start-Job spawn cost reddened main
          # with wall=17s while the three leg windows did overlap).
          grep -qF 'the three leg windows overlap' tests/f59-prewarm-parallel.ps1
          grep -qF 'every leg body slept the full 3s window' tests/f59-prewarm-parallel.ps1
          if grep -qF 'wall < serial sum 9s' tests/f59-prewarm-parallel.ps1; then
            echo 'F97: the fixed 9s wall budget is back (flaky on loaded runners)' >&2
            exit 1
          fi
          node --test tests/f59-defaults.test.js tests/f59-verify-failclosed.test.js
          node --test tests/f48-tokenless-mirror.test.js tests/f46-mirror-contract.test.js tests/f52-mirror-telemetry.test.js
          for f in payloads/f59-prebuilt-pins.json payloads/f59-prebuilt-verify.ps1 payloads/f59-timing.ps1 \
                   scripts/f59-verify-sha256.mjs .github/workflows/build-ui.yml \
                   .github/workflows/f59-prebuilt-binaries.yml docs/F59-PREBUILT-BINARIES.md; do
            test -f "$f" || { echo "F59: missing $f" >&2; exit 1; }
          done
          wf=.github/workflows/main.yml
          awk '/mirror_enable:/{f=1} f&&/default:/{print;exit}' "$wf" | grep -qF 'default: true'
          awk '/mirror_encrypt:/{f=1} f&&/default:/{print;exit}' "$wf" | grep -qF 'default: false'
          awk '/search_enable:/{f=1} f&&/default:/{print;exit}' "$wf" | grep -qF 'default: true'
          grep -qF 'startup-timing.jsonl' "$wf" || { echo 'F59: startup-timing.jsonl instrumentation missing' >&2; exit 1; }
          grep -qF 'name: startup-timing' "$wf" || { echo 'F59: startup-timing artifact missing' >&2; exit 1; }
          grep -qF 'Wait-Job -Job $all' "$wf" || { echo 'F59: parallel Wait-Job missing' >&2; exit 1; }
          if grep -nE 'choco install (aria2|qbittorrent)' "$wf"; then echo 'F59: Chocolatey must not be on the transport lane' >&2; exit 1; fi
          if sed -n '/^  rdp:/,/^  [a-z][a-z-]*:/p' "$wf" | grep -qF 'self-hosted'; then echo 'F59: self-hosted runner scope creep (F60)' >&2; exit 1; fi
          python3 - <<'PY'
          import json, re, sys
          pins = json.load(open('payloads/f59-prebuilt-pins.json', encoding='utf-8'))
          errs = []
          if pins.get('release_tag') != 'prebuilt-binaries': errs.append('release tag')
          for k in ('aria2c', 'qbittorrent'):
              a = pins['assets'][k]
              if not a.get('name'): errs.append(k + ' name')
              if not a.get('source', '').startswith('https://'): errs.append(k + ' source')
              if not re.match(r'^[0-9a-f]{64}$', a.get('sha256') or ''): errs.append(k + ' pin not 64-hex (bootstrap incomplete)')
          mod = open('payloads/ghrdp-mirror.ps1', encoding='utf-8').read()
          if "if ($Auto) { return 'all' }" not in mod: errs.append('auto lane floor')
          if "if (Get-F49RuntimeOptIn -Cfg $Cfg) { return 'all' }" not in mod: errs.append('runtime lane floor')
          if 'PLAINTEXT MODE' not in open('payloads/ui.html', encoding='utf-8').read(): errs.append('v1 banner')
          if 'PLAINTEXT MODE' not in open('src/components/domain/MirrorCard.tsx', encoding='utf-8').read(): errs.append('v2 banner')
          if errs:
              print('F59 pins/floor check failed: ' + ', '.join(errs), file=sys.stderr)
              sys.exit(1)
          print('F59 pins: aria2c=%s qbittorrent=%s (sha256 pinned, official sources)' % (pins['assets']['aria2c']['name'], pins['assets']['qbittorrent']['name']))
          PY
          echo 'F59 gates PASS: mirror_enable=true, mirror_encrypt=false+banner, search_enable=true, prebuilt=release-assets, startup-timing=jsonl, auto-path-floor=preserved'
      - name: F56-d torrent lane gates (qBittorrent-nox + Tailnet-only + dispatch)
