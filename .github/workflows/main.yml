      - name: Register watcher autostart (ONLOGON)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          $pwshPath = 'powershell.exe'
          try { $c = Get-Command pwsh.exe -ErrorAction Stop; if ($c) { $pwshPath = $c.Source } } catch { }
          $argLine = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-watcher.ps1"'
          $registered = $false
          try {
              $action = New-ScheduledTaskAction -Execute $pwshPath -Argument $argLine
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $user
              $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpWatcher' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              $registered = $true
              Write-Host '[watcher] GhrdpWatcher ONLOGON task registered for the RDP user'
          } catch {
              Write-Host ('[watcher] Register-ScheduledTask failed: ' + $_.Exception.Message)
          }
          if (-not $registered) {
              try {
                  & schtasks.exe /Create /F /SC ONLOGON /TN GhrdpWatcher /TR ('"{0}" {1}' -f $pwshPath, $argLine) 2>$null
                  $LASTEXITCODE = 0
                  Write-Host '[watcher] schtasks ONLOGON fallback registered'
              } catch {
                  Write-Host ('[watcher] schtasks fallback failed: ' + $_.Exception.Message)
              }
          }
          Write-Host '[watcher] autostart coverage (3 mechanisms):'
          Write-Host '  (a) startup-folder shortcut - created by the watcher itself at first logon'
          Write-Host '  (b) ONLOGON scheduled task running as the RDP user (above)'
          Write-Host '  (c) dashboard Start-watcher button + servers auto-heal the task every 60s'
          exit 0

