<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHRDP Session Archive</title><style>body{font-family:system-ui,sans-serif;background:#0b0f14;color:#e8eef3;margin:0;padding:24px}h1{font-size:22px}input{padding:8px;border-radius:8px;border:1px solid #2b3a4a;background:#101820;color:#e8eef3;width:260px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #1b2530}th{color:#8aa0ad}.det{display:none;background:#0d131a}tr.open+.det{display:table-row}button{cursor:pointer}.sub{color:#8aa0ad}a{color:#7dd3fc}</style></head><body><h1>GHRDP Session Archive</h1><p class="sub">Past RDP sessions. Search + expand rows - no endless scrolling (10 per page).</p><input id="q" placeholder="search session / file / key..."> <button id="prev">&laquo;</button> <button id="next">&raquo;</button> <span id="pg"></span><table><thead><tr><th></th><th>Session</th><th>Date</th><th>Files</th><th>Size</th><th>Key</th><th>Links</th></tr></thead><tbody id="tb"></tbody></table><script>var data={sessions:[]},page=0,PER=10,filtered=[];async function load(){try{var r=await fetch("archive.json",{cache:"no-store"});if(r.ok)data=await r.json();}catch(e){}filtered=data.sessions||[];draw();}function draw(){var q=document.getElementById("q").value.toLowerCase();var f=(data.sessions||[]).filter(function(s){var blob=(s.id+" "+s.date+" "+s.key+" "+(s.files||[]).map(function(x){return x.n}).join(" ")).toLowerCase();return !q||blob.includes(q);});filtered=f;var pages=Math.max(1,Math.ceil(f.length/PER));if(page>=pages)page=pages-1;if(page<0)page=0;var slice=f.slice(page*PER,page*PER+PER);var html="";slice.forEach(function(s,i){html+='<tr onclick="this.classList.toggle('open')"><td>+</td><td>'+s.id+'</td><td>'+s.date+'</td><td>'+s.filesCount+'</td><td>'+s.bytes+'</td><td>'+s.key+'</td><td><a href="'+s.telegraph+'" target="_blank">telegraph</a> <a href="'+s.rentry+'" target="_blank">rentry</a></td></tr>';html+='<tr class="det"><td colspan="7">'+(s.files||[]).map(function(x){return '<a href="'+x.l+'" target="_blank">'+(x.f? x.f+' / ':'')+x.n+'</a> ('+x.s+')'+(x.e==='true'?' [enc]':'')}).join('<br>')+'</td></tr>';});document.getElementById("tb").innerHTML=html||'<tr><td colspan="7">no sessions yet</td></tr>';document.getElementById("pg").textContent="page "+(page+1)+"/"+pages;}document.getElementById("q").oninput=function(){page=0;draw();};document.getElementById("prev").onclick=function(){page--;draw();};document.getElementById("next").onclick=function(){page++;draw();};load();</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}</script></body></html>
