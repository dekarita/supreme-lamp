          Write-Host ('[X] .rdp written from the shipped template: ' + $rdpBytes + ' bytes, ' + $lines.Count + ' directives')
          if ($rdpBytes -le 400) { X-Fail 'rdp-floor' ('.rdp is only ' + $rdpBytes + ' bytes (floor 400) - the truncated-file class') }
          $src = [System.IO.File]::ReadAllText((Join-Path $ws 'payloads\ghrdp-rdp-launcher.cs'))
          foreach ($tok in @('private const int RdpMinBytes = 400;', 'bytes <= RdpMinBytes', 'File.ReadAllText(rdp)', 'rdp-file-truncated')) {
