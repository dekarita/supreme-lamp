          <script>
          (function(){
          "use strict";
          var G=function(id){return document.getElementById(id)};
          var bd=G('pvBackdrop'),bdy=G('pvContent'),spn=G('pvSpinner'),ttl=G('pvTitle'),met=G('pvMeta'),ico=G('pvIcon'),dlb=G('pvDownload'),xbt=G('pvClose'),ebt=G('pvEdit'),sta=G('pvStatus');
          var cur=null,knd='',oUrl=null,tSt=null,edg=false,lF=null;
          var TY={i:'jpg jpeg png gif webp svg bmp ico'.split(' '),v:'mp4 webm ogv mov m4v'.split(' '),a:'mp3 wav ogg flac m4a aac'.split(' '),t:'txt json md markdown log csv nfo srt js css html htm xml yml yaml ps1 sh py bat'.split(' ')};
          var IC={i:'🖼️',v:'🎬',a:'🎵',p:'📕',t:'📄',u:'📦'};
          function proxyUrl(u){var w=(localStorage.getItem('ghrdp:worker')||'').replace(/\/+$/,'');return w?(w+'/proxy?url='+encodeURIComponent(u)):u;}
          function ext(n){var m=/\.([a-z0-9]+)$/i.exec(n||'');return m?m[1].toLowerCase():'';}
          function kOf(e){if(TY.i.indexOf(e)>-1)return'i';if(TY.v.indexOf(e)>-1)return'v';if(TY.a.indexOf(e)>-1)return'a';if(e==='pdf')return'p';if(TY.t.indexOf(e)>-1)return't';return'u';}
          function fB(n){n=+n||0;if(n<1024)return n+' B';var u=['KB','MB','GB','TB'],i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return n.toFixed(1)+' '+u[i];}
          function mk(t,c){var d=document.createElement(t);if(c)d.className=c;return d;}
          function sS(on){spn.hidden=!on;}
          function sT(t){sta.textContent=t||'';}
          function clr(){bdy.querySelectorAll('video,audio').forEach(function(m){try{m.pause();m.removeAttribute('src');m.load();}catch(e){}});if(oUrl){try{URL.revokeObjectURL(oUrl);}catch(e){} oUrl=null;}bdy.innerHTML='';}
          function dBtn(){var b=mk('a','pv-btn pv-primary');b.textContent='⬇ Download File';b.href=cur.url;b.target='_blank';b.rel='noopener';return b;}
          function fbc(msg){clr();sS(false);var w=mk('div','pv-fallback');w.appendChild(Object.assign(mk('div','big'),{textContent:IC[knd]||IC.u}));w.appendChild(Object.assign(mk('div','nm'),{textContent:cur.name}));w.appendChild(Object.assign(mk('div','sz'),{textContent:fB(cur.size)+' \xB7 '+(msg||'Cannot preview this file type.')}));w.appendChild(dBtn());bdy.appendChild(w);sT(msg||'Download offered.');}
          function rst(msg){clr();sS(false);var w=mk('div','pv-fallback');w.appendChild(Object.assign(mk('div','big'),{textContent:'🔒'}));w.appendChild(Object.assign(mk('div','nm'),{textContent:'Preview restricted by host'}));w.appendChild(Object.assign(mk('div','sz'),{textContent:msg||'Cross-origin blocked.'}));w.appendChild(dBtn());bdy.appendChild(w);sT('CORS blocked.');}
          function med(tag){var m=mk(tag);m.controls=true;m.preload='metadata';m.src=proxyUrl(cur.url);m.addEventListener('loadeddata',function(){sS(false);sT('Streaming.');},{once:true});m.addEventListener('error',function(){rst('Host refused streaming.');},{once:true});bdy.appendChild(m);}
          function mPre(txt){var p=mk('pre');var c=mk('code');c.textContent=txt;p.appendChild(c);return p;}
          function lTx(){sS(true);sT('Fetching…');fetch(proxyUrl(cur.url),{mode:'cors'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(txt){sS(false);tSt=txt.length>300000?txt.slice(0,300000)+'\n… [truncated]':txt;bdy.appendChild(mPre(tSt));ebt.hidden=false;sT(tSt.length+' chars');}).catch(function(err){rst('Fetch: '+err.message);});}
          function pvOpen(nd){cur=nd;knd=kOf(ext(nd.name));edg=false;tSt=null;lF=document.activeElement;ttl.textContent=nd.name;met.textContent=fB(nd.size)+' \xB7 .'+ext(nd.name);ico.textContent=IC[knd]||IC.u;dlb.href=nd.url;dlb.download='';dlb.target='_blank';dlb.rel='noopener';ebt.hidden=(knd!=='t');ebt.textContent='✎ Edit';clr();bd.hidden=false;document.body.style.overflow='hidden';xbt.focus();
          if(knd==='i'){sS(true);sT('Loading…');var img=mk('img');img.alt=nd.name;img.src=proxyUrl(nd.url);img.addEventListener('load',function(){sS(false);sT('Loaded.');},{once:true});img.addEventListener('error',function(){rst('Image blocked.');},{once:true});bdy.appendChild(img);}
          else if(knd==='v'){sS(true);sT('Buffering…');med('video');}
          else if(knd==='a'){sS(true);sT('Buffering…');med('audio');}
          else if(knd==='p'){sS(true);sT('Embedding…');var fr=mk('iframe');fr.src=nd.url;fr.title=nd.name;fr.addEventListener('load',function(){sS(false);sT('PDF loaded.');},{once:true});fr.addEventListener('error',function(){rst('Framing refused.');},{once:true});bdy.appendChild(fr);}
