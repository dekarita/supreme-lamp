                  if ($orig.Count -gt 0) { New-ItemProperty -Path $script:F30FunctionsKey -Name 'Functions' -PropertyType MultiString -Value $orig -Force | Out-Null; Write-Host ('[X] restored the original Schannel order (' + $orig.Count + ' entries) from ' + $backupPath) }
              }
          } catch { Write-Host ('[X] order restore skipped: ' + $_.Exception.Message) }
          Write-Host '[X] PASS: F30 ordered ciphers + TLS 1.2/1.3 + purge-before-write + .rdp floor + conn-log row all proven on a real Windows host'
          'X_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      # [F31/F31b] RDP-Tcp PRIVATE-KEY PERSISTENCE FIX + SELF-PROBE + MATRIX
      - name: "Y: F31 private-key persistence + self-probe + cross-process lab matrix"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ws = $env:GITHUB_WORKSPACE
          $summaryFile = $env:GITHUB_STEP_SUMMARY

          function Dump-CellDiagnostics([string]$cellName, [string]$reasonCode, [object]$cert, [string]$keyPath, [string]$probeError) {
              $line = "::error::cell=$cellName reason=$reasonCode"
              Write-Host $line
              if ($summaryFile) { Add-Content -Path $summaryFile -Value $line }
              
