      - name: F21 CredSSP/NLA handshake verification gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          srv=payloads/ghrdp-server.ps1
          # --- §1 main.yml must carry the F21 CredSSP/NLA verification step ---
          step=$(awk '/name: CredSSP\/NLA handshake verification.*F21/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F21: main.yml lacks CredSSP/NLA handshake verification step' >&2; exit 1; }
          for tok in 'UserAuthentication' 'SSLCertificateSHA1Hash' 'AllowEncryptionOracle' 'Get-TlsCipherSuite' 'AES_256_GCM' 'credsspStatus' 'failed-' '::error::[F21]' 'throw' '[F21 §1 probe-end]'; do
            grep -qF "$tok" <<< "$step" || { echo "F21: verification step missing token: $tok" >&2; exit 1; }
          done
          # credsspStatus must be written BEFORE the loud fail (like F17 pattern)
          wl=$(grep -nF 'Write-CredsspStatus' <<< "$step" | head -1 | cut -d: -f1)
          wf2=$(grep -nF '::error::[F21]' <<< "$step" | head -1 | cut -d: -f1)
          test -n "$wl" && test -n "$wf2" && test "$wl" -lt "$wf2"
          # §4(a) the step must NOT proceed if credsspStatus is failed -
          # AUTO-LOGIN must stay disabled (gated in ui.html __listenerOk).
          grep -qF 'credsspStatus===' "$ui" || { echo 'F21: ui.html does not gate WINDOWS AUTO-LOGIN on credsspStatus' >&2; exit 1; }
          grep -qF "__listenerOk=!!(rl&&rl.listening===true&&rl.fwRule===true&&rl.certOk===true&&rl.nla===true&&credsspOk)" "$ui" || { echo 'F21: ui.html __listenerOk does not include credsspOk' >&2; exit 1; }
          # --- §2 client-side CredSSP diagnostics must exist (copy-only) ------
          grep -qF 'id="connCredsspBox"' "$ui" || { echo 'F21: ui.html lacks CredSSP diagnostics box' >&2; exit 1; }
          # [F21 §2] CredSSP diagnostics box (copy-only) block ends at its </details>
          blk2=$(awk '/id="connCredsspBox"/{f=1} f && /<\/details>/{print; exit} f{print}' "$ui")
          for tok in 'connDiagCredsspPol' 'connDiagLmCompat' 'connDiagMstscVerbose' 'Get-ItemProperty' 'CredSSP\Parameters' 'LmCompatibilityLevel' 'mstsc /v:' 'TcpStateFrontAuth' 'AllowEncryptionOracle=0' 'NEVER weaken NLA' 'credssp-support-off' 'auth-level overrides'; do
            grep -qF "$tok" <<< "$blk2" || { echo "F21: CredSSP diagnostics missing token: $tok" >&2; exit 1; }
          done
          # --- §4(b) NO password auto-type / SendKeys / UIAutomation -----------
          # (F19 already scans repo-wide; verify no new tokens introduced near credssp)
          if grep -rInE 'SendKeys|UIAutomation|keybd_event|mouse_event' payloads/ui.html .github/workflows/main.yml | grep -i 'cred'; then
            echo 'F21: credential-UI automation token found near CredSSP code' >&2
            exit 1
          fi
          # --- §4(c) NO NLA/CredSSP weakening suggestions anywhere ------------
          # The warning line (line 345) may NAME the banned strings as part of
          # the prohibition ("NEVER weaken NLA/CredSSP (X, Y, Z)"); executable
          # suggestions (anywhere else in non-comment code) must not appear.
          weak=$(grep -nEi 'authentication level|enablecredsspsupport|authlvloverride|authenticationleveloverride|certificate.*bypass|bypass.*cert' "$ui" | grep -v 'NEVER weaken NLA' || true)
          if [ -n "$weak" ]; then
            echo "F21: ui.html suggests weakening NLA/CredSSP/cert validation (outside the mandated warning line): $weak" >&2
            exit 1
          fi
          # --- §4(d) no cert validation bypass in the F21 step itself ---------
          if grep -nEi 'ServerCertificateValidationCallback|TrustAllCerts|SslPolicyErrors|callback.*true' <<< "$step"; then
            echo 'F21: verification step contains a cert-validation bypass' >&2
            exit 1
          fi
          # --- §3 AUTO-FIX A allowed (AllowEncryptionOracle=0 strict mode) ----
          grep -qF 'AUTO-FIX A applied' <<< "$step" || { echo 'F21: step lacks auto-fix A for AllowEncryptionOracle strict mode' >&2; exit 1; }
          # --- CredSSP status row exists in the UI ----------------------------
          grep -qF 'id="nrCredssp"' "$ui" || { echo 'F21: ui.html lacks CredSSP status row (id=nrCredssp)' >&2; exit 1; }
          grep -qF "cs==='ok'" "$ui" || { echo 'F21: ui.html does not render credssp ok/fail' >&2; exit 1; }
          echo 'F21 gates PASS'

      - name: F23 cipher-probe 3-layer robustness gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          step=$(awk '/name: CredSSP\/NLA handshake verification.*F21/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F23: main.yml lacks the F21 verification step' >&2; exit 1; }
          # --- §1 cipher branch = section (4) up to the NLA reassert ----------
          cipher=$(awk '/# \(4\) Schannel cipher suites/{f=1} /# NLA reassert/{exit} f' <<< "$step")
          test -n "$cipher" || { echo 'F23: cipher branch (section 4) not found in the F21 step' >&2; exit 1; }
          # L1: cmdlet enumeration with all three per-object Name-read strategies
          for tok in 'foreach ($o in @(Get-TlsCipherSuite -ErrorAction Stop))' "PSObject.Properties['Name']" 'Format-List | Out-String'; do
            grep -qF -- "$tok" <<< "$cipher" || { echo "F23: L1 cmdlet probe missing token: $tok" >&2; exit 1; }
          done
          # the brittle one-liner that false-halted the 2026-09-26 run must stay GONE
          if grep -qF 'Get-TlsCipherSuite -ErrorAction Stop | Select-Object -ExpandProperty Name' "$wf"; then
            echo 'F23: brittle Select-Object -ExpandProperty Name cipher probe reappeared' >&2; exit 1
          fi
          # L2: registry fallback with BOTH keys, the Functions value, comma split
          for tok in 'HKLM:\SYSTEM\CurrentControlSet\Control\Cryptography\Configuration\Local\SSL\00010002' \
                   'HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002' \
                   "-Name 'Functions'" "-split ','"; do
            grep -qF -- "$tok" <<< "$cipher" || { echo "F23: L2 registry fallback missing token: $tok" >&2; exit 1; }
          done
          # L3: probe-failure path (between the F23 markers) warns + stamps and
          # NEVER halts: no throw, no failReasons - a probe failure is not a
          # weak-config verdict.
          l3=$(awk '/\[F23 L3 probe-failure begin\]/{f=1;next} /\[F23 L3 probe-failure end\]/{exit} f' <<< "$step")
          test -n "$l3" || { echo 'F23: L3 probe-failure block (F23 markers) not found' >&2; exit 1; }
          for tok in '::warning::[F21] cipher probe could not enumerate (cmdlet+registry failed); Windows defaults include AES-256-GCM; proceeding with warning' \
                   "Write-CredsspStatus -Status 'ok-with-cipher-warn' -Detail 'cipher-probe-failed'"; do
            grep -qF -- "$tok" <<< "$l3" || { echo "F23: L3 probe-failure path missing token: $tok" >&2; exit 1; }
          done
          if grep -q 'throw' <<< "$l3"; then
            echo 'F23: probe-failure path contains throw (must warn and proceed)' >&2; exit 1
          fi
          if grep -qF 'failReasons +=' <<< "$l3"; then
            echo 'F23: probe-failure path adds a failReason (must not)' >&2; exit 1
          fi
          # a REAL weak config (suites enumerated, zero strong) still halts
          grep -qF "failReasons += ('schannel-cipher-weak" <<< "$cipher" || { echo 'F23: weak-config verdict no longer feeds failReasons' >&2; exit 1; }
          grep -qF "'AES_256_GCM|CHACHA20_POLY1305'" <<< "$cipher" || { echo 'F23: strong-suite match pattern missing' >&2; exit 1; }
          # handshake determinants stay loud-fail (unchanged by F23)
          for tok in "failReasons += ('nla-off" "failReasons += ('cert-untrusted" "failReasons += ('credssp-policy-mismatch" "throw ('F21 CredSSP/NLA loud-fail: ' + \$failText)"; do
            grep -qF -- "$tok" <<< "$step" || { echo "F23: loud-fail determinant missing: $tok" >&2; exit 1; }
          done
          # the all-clear path re-stamps ok-with-cipher-warn (never plain ok) when the probe failed
          okpath=$(awk '/if \(\$failReasons\.Count -eq 0\) \{/{f=1} f && /^[[:space:]]*exit 0[[:space:]]*$/{print; exit} f' <<< "$step")
          grep -qF '$cipherProbeFailed' <<< "$okpath" || { echo 'F23: success path does not branch on the probe-failure flag' >&2; exit 1; }
          grep -qF "Write-CredsspStatus -Status 'ok-with-cipher-warn' -Detail 'cipher-probe-failed'" <<< "$okpath" || { echo 'F23: success path does not stamp ok-with-cipher-warn' >&2; exit 1; }
          grep -qF "Write-CredsspStatus -Status 'ok'" <<< "$okpath" || { echo 'F23: success path lost the plain ok stamp' >&2; exit 1; }
          # --- §2 dashboard accepts the warn status: OK render + AUTO-LOGIN gate
          # (pinned as FULL definition lines - the bare token appears in more
          # than one gate, so a token grep would miss a single-line rollback)
          grep -qF "cs==='ok-with-cipher-warn'" "$ui" || { echo 'F23: ui.html status row does not accept ok-with-cipher-warn' >&2; exit 1; }
          grep -qF 'OK (cipher probe warn)' "$ui" || { echo 'F23: ui.html lacks the OK (cipher probe warn) render' >&2; exit 1; }
          # [F28 §4] the inline expression moved into credsspVerdict(), which
          # keeps the F23 stamp semantics verbatim ('ok-with-cipher-warn' = the
          # determinants verified, only the cipher PROBE failed) and adds the
          # live probe as the primary source. The gate now pins BOTH halves.
          grep -qF "var credsspOk=credsspVerdict(rl).ok;" "$ui" || { echo 'F23: ui.html AUTO-LOGIN gate does not use the shared credssp verdict' >&2; exit 1; }
          grep -qF "function credsspVerdict(rl)" "$ui" || { echo 'F23/F28: credsspVerdict is missing' >&2; exit 1; }
          grep -qF "rl.credsspStatus==='ok-with-cipher-warn'" "$ui" || { echo 'F23: ui.html AUTO-LOGIN gate (credsspOk) does not accept ok-with-cipher-warn' >&2; exit 1; }
          # [F28 §4] the listener marks now render credsspVerdict(rl) - the same
          # function the CREDSSP row uses; the 'ok-with-cipher-warn' stamp stays
          # an accepted OK (probe failure, not a config verdict).
          grep -qF "var csv=credsspVerdict(rl);" "$ui" || { echo 'F23: ui.html listener marks do not use the shared credssp verdict' >&2; exit 1; }
          grep -qF "rl.credsspStatus==='ok-with-cipher-warn'" "$ui" || { echo 'F23: ui.html listener marks (csOk) do not accept ok-with-cipher-warn' >&2; exit 1; }
          # the warn render must never read as FAIL/BLOCKED
          if grep -qF "'FAIL: '+cs" "$ui" && ! grep -qF "csGood?((cs==='ok')?'OK':'OK (cipher probe warn)'):('FAIL: '+cs)" "$ui"; then
            echo 'F23: ui.html status row no longer routes the warn status to the OK render' >&2; exit 1
          fi
          echo 'F23 gates PASS'

      - name: F24 auth-reject discriminator gates (server cred proof + 4625/CAPI2 matrix)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          # --- §1 SERVER-SIDE CREDENTIAL PROOF (ValidateCredentials + loud fail) --
          step=$(awk '/name: Server-side credential proof \(F24/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F24: main.yml lacks the server-side credential proof step' >&2; exit 1; }
          for tok in 'ValidateCredentials' 'System.DirectoryServices.AccountManagement' "PrincipalContext('Machine')" 'credValid' 'credValidProbeError' 'Write-CredValid' '::error::[F24]' 'server-side credential invalid - user creation bug' 'throw'; do
            grep -qF -- "$tok" <<< "$step" || { echo "F24: credential proof step missing token: $tok" >&2; exit 1; }
          done
          # the PROBE itself (not just a mention): the SDAM context + the exact
          # credential-validation call must be there.
          grep -qF "\$ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')" <<< "$step" || { echo 'F24: the SDAM PrincipalContext(machine) probe is missing' >&2; exit 1; }
          grep -qF '$valid = [bool]$ctx.ValidateCredentials($UserName, $Password)' <<< "$step" || { echo 'F24: the ValidateCredentials call is missing' >&2; exit 1; }
          # the verdict is stamped BEFORE the loud fail (the dashboard must see it)
          wl=$(grep -nF 'Write-CredValid -Valid $valid' <<< "$step" | head -1 | cut -d: -f1)
          ff=$(grep -nF 'server-side credential invalid - user creation bug' <<< "$step" | head -1 | cut -d: -f1)
          test -n "$wl" && test -n "$ff" && test "$wl" -lt "$ff" || { echo 'F24: credValid is not written before the loud fail' >&2; exit 1; }
          # the proof never prints credential material (field names only)
          if grep -nE '(Write-Host|Add-Content)[^$]*(RDP_PASS|RDP_USER)' <<< "$step"; then
            echo 'F24: the credential proof prints credential material' >&2; exit 1
          fi
          # --- §2 THE SECRET-FREE 60s 4625 COLLECTOR -----------------------------
          col=$(awk '/\[F24 §2 collector-begin\]/{f=1;next} /\[F24 §2 collector-end\]/{exit} f' "$wf")
          test -n "$col" || { echo 'F24: main.yml lacks the F24 §2 collector block (markers)' >&2; exit 1; }
          for tok in 'Get-WinEvent' "LogName = 'Security'" '4624' '4625' '0XC000006A' '0XC000006D' '0XC000015B' 'wrong-password' 'authEvents' 'Get-RdpAuthEventSummary' 'Get-RdpAuthEventFields'; do
            grep -qF -- "$tok" <<< "$col" || { echo "F24: collector missing token: $tok" >&2; exit 1; }
          done
          for leak in 'RDP_PASS' 'RDP_USER' 'env:RDP_' 'SubjectUserName' 'Password' 'IpAddress'; do
            if grep -qF -- "$leak" <<< "$col"; then
              echo "F24: collector references credential/identity material: $leak" >&2; exit 1
            fi
          done
          grep -qF 'Update-RdpAuthEvents -CfgPath $cfgPath' "$wf" || { echo 'F24: the collector never ticks in the keep-alive loop' >&2; exit 1; }
          # --- §3b the F17 rebuild carries the verdict fields forward -----------
          grep -qF '[F24 §3b]' "$wf" || { echo 'F24: the F17 probe does not carry the F21 verdict fields forward' >&2; exit 1; }
          # [F37] the list legitimately gained 'telescope' (the live telescope must
          # survive the F17 rebuild, exactly like the F21 verdict fields do).
          grep -qF "foreach (\$k in @('credsspStatus', 'credsspWhy', 'credValid', 'credValidAt', 'credValidWhy', 'credValidProbeError', 'authEvents', 'telescope'))" "$wf" || { echo 'F24: the carry-forward field list is wrong (all F21 verdict fields + the F37 telescope)' >&2; exit 1; }
          # --- §3 ONE decision row with the three branches -----------------------
          grep -qF 'id="rdpAuthRow"' "$ui" || { echo 'F24: ui.html lacks the auth-reject discriminator row' >&2; exit 1; }
          for tok in 'SERVER credential bug - re-dispatch' 'YOUR stored password is stale' 'copy CURRENT password from KEYS' 'TLS-layer suspect' 'cmdkey /delete:TERMSRV/' 'capi2.evtx' 'system.evtx' 'authEvents' 'credValid' 'credValidProbeError' 'PROBE FAILED' 'paste the copied password EXACTLY' 'no tooling deletes credentials'; do
            grep -qF -- "$tok" "$ui" || { echo "F24: ui.html matrix missing token: $tok" >&2; exit 1; }
          done
          grep -qF "kd.textContent='cmdkey /delete:TERMSRV/'+(fqdn||'<fqdn>')" "$ui" || { echo 'F24: the cmdkey copy-line is not wired to the live FQDN' >&2; exit 1; }
          grep -qF "onclick=\"copyById('credWinPass',this)\"" "$ui" || { echo 'F24: the stale-password branch lacks the KEYS password copy-line' >&2; exit 1; }
          # the bare "FAIL: pending" credssp render must never come back
          if grep -qF "'FAIL: '+cs" "$ui"; then
            echo 'F24: ui.html renders a bare FAIL for an unreported credsspStatus' >&2; exit 1
          fi
          grep -qF 'not reported yet (F21 step: CredSSP/NLA handshake verification)' "$ui" || { echo 'F24: the pending CredSSP render is missing' >&2; exit 1; }
          # copy-only + no execution/automation + no weakening advice in the row
          blk=$(awk '/id="rdpAuthRow"/{f=1} f{print} f && /^  <\/div>$/{exit}' "$ui")
          test -n "$blk" || { echo 'F24: the discriminator row could not be extracted' >&2; exit 1; }
          if grep -oE 'onclick="[^"]*"' <<< "$blk" | grep -v '^onclick="copyById' | grep .; then
            echo 'F24: a non-copy control appeared in the discriminator row' >&2; exit 1
          fi
          if grep -nEi 'powershell|mshta|wscript|cscript|Invoke-Expression|SendKeys|UIAutomation|keybd_event' <<< "$blk"; then
            echo 'F24: an execution/automation token appeared in the discriminator row' >&2; exit 1
          fi
          if grep -nEi 'authentication level|enablecredsspsupport|authlvloverride|prompt for credentials|certificate.*bypass|bypass.*cert' <<< "$blk" | grep -v 'NEVER weaken NLA' | grep .; then
            echo 'F24: the discriminator row suggests weakening NLA/CredSSP/cert validation' >&2; exit 1
          fi
          # --- §4 locked rule: the launcher gains NO delete verb -----------------
          if grep -nE 'cmdkey[^"]*/delete' "$cs"; then
            echo 'F24: the launcher gained a credential-deletion verb (the dashboard copy-lines are the only reset path)' >&2; exit 1
          fi
          echo 'F24 gates PASS'

      - name: F8 web-desktop honesty gates
        shell: bash
        run: |
          set -euo pipefail
