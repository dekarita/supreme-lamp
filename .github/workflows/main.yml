          try { $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop; $code = [int]$r.StatusCode } catch { try { $code = [int]$_.Exception.Response.StatusCode.value__ } catch { $code = 0 } }
          Write-Host ("[verify] GET $url -> $code")
