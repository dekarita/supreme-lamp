          $editCode = [string]$env:RENTRY_EDIT_PASSWORD
          if (-not $editCode) { $editCode = [string]$env:RENTRY_EDIT_CODE }
          if (-not $editCode -and ($env:MIRROR_INPUT -eq 'true')) {
              Write-Host '[stage] FATAL: mirror enabled but RENTRY_EDIT_PASSWORD missing - refusing to stage a bypass config.'
