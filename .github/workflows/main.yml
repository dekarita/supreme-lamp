      - name: Stage files + write config.json (UTF8 no BOM, Rentry secrets + provided edit code, token, ACLs)
        env:
          RENTRY_EDIT_PASSWORD: ${{ secrets.RENTRY_EDIT_PASSWORD }}
          RENTRY_EDIT_COOKIE: ${{ secrets.RENTRY_EDIT_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $stage = Join-Path $env:RUNNER_TEMP 'ghrdp-stage'
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item -Path (Join-Path $stage '*') -Destination $root -Recurse -Force -ErrorAction SilentlyContinue
          . (Join-Path $root 'ghrdp-lib.ps1')
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ''
          $dns = ''
          $ghName = ''
          try { $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim(); $LASTEXITCODE = 0 } catch { }
          try {
              $j = (& $ts status --json 2>$null) | ConvertFrom-Json
              $ghName = [string]$j.Self.HostName
              $dns = ([string]$j.Self.DNSName).TrimEnd('.')
              $LASTEXITCODE = 0
          } catch { }
          if (-not $ip) { Write-Host '[stage] WARNING: no Tailscale IP resolved yet' }
          $mirrorOn = ($env:MIRROR_INPUT -eq 'true')
          $tokSet = 'abcdefghijklmnopqrstuvwxyz0123456789'
          $tok = ''
          for ($i = 0; $i -lt 32; $i++) { $tok = $tok + (Pick-Char -Set $tokSet) }
          $editCode = [string]$env:RENTRY_EDIT_PASSWORD
          if (-not $editCode) { $editCode = [string]$env:RENTRY_EDIT_CODE }
          if (-not $editCode -and ($env:MIRROR_INPUT -eq 'true')) {
              Write-Host '[stage] FATAL: mirror enabled but RENTRY_EDIT_PASSWORD missing - refusing to stage a bypass config.'
              Write-Host '[stage] RENTRY_EDIT_PASSWORD not set - OK (myurl0 is frozen; github.io is the primary index).'
          }
          $cfg = [ordered]@{
              rdpIp = $ip
              rdpUser = [string]$env:RDP_USER
              rdpPass = [string]$env:RDP_PASS
              ghrdp = $ghName
              dnsName = $dns
              repo = [string]$env:GITHUB_REPOSITORY
              dashToken = $tok
              mirror = $mirrorOn
              encryptMode = [string]$env:ENCRYPT_MODE
              mirrorKey = New-MirrorPassword -Length 40
              telegraphToken = ''
              telegraphPath = ''
              mirrorIndexUrl = ''
              serveUrl = ''
              funnelUrl = ''
              startedAt = $(try { if ($env:JOB_STARTED_AT) { ([datetime]$env:JOB_STARTED_AT).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } else { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } } catch { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') })
              runStartedAt = $(try { if ($env:RUN_STARTED_AT) { ([datetime]$env:RUN_STARTED_AT).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } elseif ($env:JOB_STARTED_AT) { ([datetime]$env:JOB_STARTED_AT).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } else { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } } catch { (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') })
              sessionStartedAt = ''
              legacyIndexUrl = ''
              legacyDecryptKey = ''
              legacyLinks = @()
              rentryNewUrl = ''
              rentryEditKey = ''
              rentryEditCode = $editCode
              rentryEditCookie = [string]$env:RENTRY_EDIT_COOKIE
              runnerEgressIp = ''
              githubDeadline = $(try { (([datetime]$(if ($env:JOB_STARTED_AT) { $env:JOB_STARTED_AT } else { (Get-Date -Format o) })).AddMinutes(357)).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } catch { (Get-Date).AddMinutes(357).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') })
              keepAliveDeadline = ''
              keepAlivePhase = 'idle-wait'
              watcherDeadline = ''
              hiddenFiles = @()
              sessionId = ('s-' + (Get-Date -Format 'yyyyMMdd-HHmmss'))
              pagesBase = ('https://' + (([string]$env:GITHUB_REPOSITORY -split '/')[0]) + '.github.io/' + (([string]$env:GITHUB_REPOSITORY -split '/')[1]))
              searchUrl = (('https://' + (([string]$env:GITHUB_REPOSITORY -split '/')[0]) + '.github.io/' + (([string]$env:GITHUB_REPOSITORY -split '/')[1]) + '/search.html'))
          }
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), ($cfg | ConvertTo-Json -Depth 10), $global:GhrdpEncNoBom)
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), $tok, $global:GhrdpEncNoBom)
          [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'false', $global:GhrdpEncNoBom)
          try { [System.IO.File]::WriteAllText((Join-Path $root 'gh-pages-token.txt'), [string]$env:GITHUB_TOKEN, $global:GhrdpEncNoBom) } catch { }
          & icacls.exe $root /grant 'Users:(OI)(CI)M' 2>$null | Out-Null
          $LASTEXITCODE = 0
          Write-Host '[stage] ACLs set: Users get modify on C:\ghrdp (watcher runs as the RDP user)'
          $batPath = Join-Path $root 'DEBUG-GHRDP.bat'
          if (Test-Path -LiteralPath $batPath) {
              $t = ([System.IO.File]::ReadAllText($batPath)) -replace "`r?`n", "`r`n"
              [System.IO.File]::WriteAllText($batPath, $t, $global:GhrdpEncNoBom)
          }
          try { Copy-Item -Path (Join-Path $root 'DEBUG-GHRDP.bat') -Destination 'C:\Users\Public\Desktop' -Force -ErrorAction Stop } catch { Write-Host '[stage] debug bat copy failed (benign)' }
          try {
              $pwshPath = 'powershell.exe'
              $c = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($c) { $pwshPath = $c.Source }
              $ws = New-Object -ComObject WScript.Shell
              $sc = $ws.CreateShortcut('C:\Users\Public\Desktop\GHRDP Start (watcher + dashboard).lnk')
              $sc.TargetPath = $pwshPath
              $sc.Arguments = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-launcher.ps1"'
              $sc.WorkingDirectory = 'C:\ghrdp'
              $sc.WindowStyle = 7
              $sc.Save()
              Write-Host '[stage] GHRDP Start shortcut created'
          } catch { Write-Host ('[stage] start shortcut failed: ' + $_.Exception.Message) }
          Write-Host ('[stage] staged files: ' + ((Get-ChildItem $root | ForEach-Object { $_.Name }) -join ', '))
          Write-Host ('[stage] mirror=' + $mirrorOn + '; rentry edit credential ' + $(if ($editCode -or $env:RENTRY_EDIT_COOKIE) { 'PROVIDED (official page myurl0 will be updated append-only)' } else { 'NOT set (new rentry page will be created with full history)' }))
          $testEdit = [string]$cfg.rentryEditCode
          if ($testEdit) {
              $tJar = Join-Path $env:TEMP 'ghrdp-test-jar.txt'
              $tEditUrl = 'https://rentry.co/myurl0/edit'
              $tUa = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
              $tPage = (& curl.exe -sL -c $tJar --max-time 15 -A $tUa $tEditUrl 2>$null) -join "`n"
              $tCsrf = ''
              if ($tPage -match 'name="csrfmiddlewaretoken"\s+value="([^"]+)"') { $tCsrf = $Matches[1] }
              if ($tCsrf) {
                  $tOut = (& curl.exe -sL -o NUL -w '%{http_code} %{url_effective}' -b $tJar -A $tUa -e $tEditUrl -X POST $tEditUrl --data-urlencode ('csrfmiddlewaretoken=' + $tCsrf) --data-urlencode ('edit_code=' + $testEdit) --data-urlencode 'text=' 2>$null) -join ' '
                  if ($tOut -match '^200' -and $tOut -notmatch '/edit$') {
                      $cfg | Add-Member -NotePropertyName rentryEditOk -NotePropertyValue $true -Force
                      Write-Host '[rentry] SELF-TEST OK: myurl0 edit code accepted - myurl0 will be updated every run (permanent link)'
                  } else {
                      $cfg | Add-Member -NotePropertyName rentryEditOk -NotePropertyValue $false -Force
                      Write-Host '[rentry] SELF-TEST FAIL: myurl0 edit code REJECTED - using per-run new rentry page. Fix: set the ORIGINAL edit code as secret RENTRY_EDIT_PASSWORD, or create a new rentry page and update RENTRY_MAIN_URL.'
                  }
              } else {
                  Write-Host '[rentry] SELF-TEST SKIP: could not fetch myurl0 edit page (CSRF/Cloudflare)'
              }
              [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), ($cfg | ConvertTo-Json -Depth 10), $global:GhrdpEncNoBom)
          }
          exit 0

      - name: Enable GitHub Pages automatically (main /docs, idempotent, post-branch-surgery safe)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = $env:GITHUB_REPOSITORY
          $owner = ($repo -split '/')[0]; $name = ($repo -split '/')[1]
          $base = "https://api.github.com/repos/$repo/pages"
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; 'Content-Type' = 'application/json' }
          function Put-GhFileEarly {
            param([string]$Path, [string]$Text)
            $api = "https://api.github.com/repos/$repo/contents/$Path"
            $sha = $null
            try { $g = Invoke-RestMethod -Uri $api -Headers $h -ErrorAction Stop; $sha = $g.sha } catch { }
            $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($Text))
            $body = @{ message = "docs: ensure $Path"; content = $b64; branch = 'main' }
            if ($sha) { $body.sha = $sha }
            try { Invoke-RestMethod -Uri $api -Headers $h -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null; Write-Host "[pages] ensured $Path" } catch { Write-Host ("[pages] ensure $Path failed: " + $_.Exception.Message) }
          }
          Put-GhFileEarly 'docs/.nojekyll' ''
          Put-GhFileEarly 'docs/index.html' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=search.html"><title>GHRDP Mirror</title><style>body{font-family:system-ui,sans-serif;background:#0b0f14;color:#e8eef3;display:grid;place-items:center;height:100vh;margin:0}a{color:#7dd3fc}</style></head><body><p>Loading... <a href="search.html">search</a> | <a href="archive.html">archive</a> | <a href="decrypt.html">decrypt</a></p></body></html>'
          $site = $null
          try { $site = Invoke-RestMethod -Uri $base -Headers $h -ErrorAction Stop } catch {
            $code = 0; try { $code = [int]$_.Exception.Response.StatusCode.value__ } catch { }
            if ($code -eq 404) {
              Write-Host '[pages] site missing - creating'
              try { $site = Invoke-RestMethod -Uri $base -Headers $h -Method Post -Body (@{ source = @{ branch = 'main'; path = '/docs' } } | ConvertTo-Json -Compress) -ErrorAction Stop } catch { Write-Host ('[pages] create failed: ' + $_.Exception.Message) }
            } else { Write-Host ("[pages] GET failed code $code") }
          }
          if ($site) {
            $src = $site.source
            $needPut = (-not $src) -or ([string]$src.branch -ne 'main') -or ([string]$src.path -ne '/docs')
            if ($needPut) {
              try { Invoke-RestMethod -Uri $base -Headers $h -Method Put -Body (@{ source = @{ branch = 'main'; path = '/docs' } } | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null; Write-Host '[pages] source set to main:/docs' } catch { Write-Host ('[pages] source PUT failed: ' + $_.Exception.Message) }
            } else { Write-Host '[pages] source already main:/docs' }
          } else {
            Write-Host '[pages] API enable failed - MANUAL FALLBACK: Settings -> Pages -> Deploy from a branch -> main / /docs -> Save'
          }
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 5
            try {
              $st = Invoke-RestMethod -Uri $base -Headers $h -ErrorAction Stop
              Write-Host ('[pages] status: ' + [string]$st.status)
              if ([string]$st.status -eq 'built') { Write-Host ('[pages] built: ' + [string]$st.html_url); break }
            } catch { }
          }
          Write-Host ('[pages] site URL: https://' + $owner + '.github.io/' + $name + '/')
          exit 0

      - name: Start Mission Control dashboard EARLY (PS 7331, SYSTEM task, confirm LISTENING)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $okFile = Join-Path $root 'server-ok.txt'
          Remove-Item -LiteralPath $okFile -Force -ErrorAction SilentlyContinue
          $pwshPath = 'powershell.exe'
          try { $c = Get-Command pwsh.exe -ErrorAction Stop; if ($c) { $pwshPath = $c.Source } } catch { }
          $argLine = ('-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f (Join-Path $root 'ghrdp-server.ps1'))
          try {
              $action = New-ScheduledTaskAction -Execute $pwshPath -Argument $argLine
              $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(2)
              $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpServer' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              Start-ScheduledTask -TaskName 'GhrdpServer' -ErrorAction Stop
              Write-Host '[dashboard] GhrdpServer SYSTEM task started'
          } catch {
              Write-Host ('[dashboard] task registration failed: ' + $_.Exception.Message + ' (falling back to background process)')
          }
          $listening = $false
          for ($i = 0; $i -lt 30; $i++) {
              if (Test-Path -LiteralPath $okFile) {
                  $txt = ''
                  try { $txt = [System.IO.File]::ReadAllText($okFile) } catch { }
                  if ($txt.StartsWith('LISTENING')) { $listening = $true; break }
                  if ($txt.StartsWith('LISTEN_FAIL')) { break }
              }
              $tcp = $null
              try { $tcp = Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction SilentlyContinue } catch { }
              if ($tcp) { $listening = $true; break }
              Start-Sleep -Seconds 2
          }
          if (-not $listening) {
              try {
                  Start-Process -FilePath $pwshPath -ArgumentList $argLine -WindowStyle Hidden
                  Write-Host '[dashboard] background fallback process launched'
              } catch {
                  Write-Host ('[dashboard] background fallback failed: ' + $_.Exception.Message)
              }
              for ($i = 0; $i -lt 30; $i++) {
                  if (Test-Path -LiteralPath $okFile) {
                      $txt = ''
                      try { $txt = [System.IO.File]::ReadAllText($okFile) } catch { }
                      if ($txt.StartsWith('LISTENING')) { $listening = $true; break }
                  }
                  $tcp = $null
                  try { $tcp = Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction SilentlyContinue } catch { }
                  if ($tcp) { $listening = $true; break }
                  Start-Sleep -Seconds 2
              }
          }
          if ($listening) {
              Write-Host '[dashboard] CONFIRMED PowerShell dashboard listening on 0.0.0.0:7331 (before any public link is printed)'
          } else {
              Write-Host '[dashboard] WARNING: 7331 listener not confirmed; Serve setup will still be attempted. RDP itself is unaffected.'
          }
          exit 0

      - name: Start Rust WebSocket dashboard (build, verify, GhrdpRustDash, acceptance, advertise)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $rustSrc = Join-Path $env:RUNNER_TEMP 'ghrdp-rust'
          $exe = Join-Path $rustSrc 'target\release\ghrdp-dash.exe'
          $okFile = Join-Path $root 'rust-ok.txt'
          Remove-Item -LiteralPath $okFile -Force -ErrorAction SilentlyContinue
          try { Unregister-ScheduledTask -TaskName 'GhrdpRustDash' -Confirm:$false -ErrorAction SilentlyContinue } catch { }
          $built = $false
          if (Test-Path -LiteralPath (Join-Path $rustSrc 'Cargo.toml')) {
              & rustup.exe default stable 2>$null
              $LASTEXITCODE = 0
              for ($a = 1; $a -le 2; $a++) {
                  Push-Location $rustSrc
                  try {
                      & cargo.exe build --release 2>&1 | ForEach-Object { Write-Host $_ }
                      $code = $LASTEXITCODE
                      $LASTEXITCODE = 0
                      Write-Host ('[rust] cargo build --release attempt {0} exit={1}' -f $a, $code)
                      if ($code -eq 0) { $built = $true }
                  } catch {
                      Write-Host ('[rust] build attempt {0} error: {1}' -f $a, $_.Exception.Message)
                  } finally {
                      Pop-Location
                  }
                  if ($built) { break }
                  Start-Sleep -Seconds 5
              }
          } else {
              Write-Host ('[rust] ERROR: Cargo.toml not found in ' + $rustSrc + ' - the Rust source step did not run or failed')
          }
          $exeOk = $false
          if ($built -and (Test-Path -LiteralPath $exe)) {
              $size = (Get-Item -LiteralPath $exe).Length
              if ($size -gt 100KB) {
                  $exeOk = $true
                  Write-Host ('[rust] exe verified: {0} bytes' -f $size)
              } else {
                  Write-Host ('[rust] exe too small ({0} bytes) - treating as build failure' -f $size)
              }
          }
          if (-not $exeOk) {
              Write-Host '[rust] HONEST DEGRADATION: Rust build failed - NO 7332 URL will be printed or advertised anywhere; the PowerShell dashboard on 7331 serves this run.'
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_AVAILABLE=false'
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_URL='
              [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'false', (New-Object System.Text.UTF8Encoding($false)))
              exit 0
          }
          New-Item -ItemType Directory -Path (Join-Path $root 'rust') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'rust\static') -Force | Out-Null
          Copy-Item -Path $exe -Destination (Join-Path $root 'rust\ghrdp-dash.exe') -Force
          if (Test-Path -LiteralPath (Join-Path $root 'ui.html')) {
              Copy-Item -Path (Join-Path $root 'ui.html') -Destination (Join-Path $root 'rust\static\index.html') -Force -ErrorAction SilentlyContinue
          }
          & icacls.exe (Join-Path $root 'rust') /grant 'Users:(OI)(CI)RX' 2>$null | Out-Null
          $LASTEXITCODE = 0
          $rustExe = Join-Path $root 'rust\ghrdp-dash.exe'
          $started = $false
          try {
              $action = New-ScheduledTaskAction -Execute $rustExe -Argument '' -WorkingDirectory $root
              $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(2)
              $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpRustDash' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              Start-ScheduledTask -TaskName 'GhrdpRustDash' -ErrorAction Stop
              $started = $true
              Write-Host '[rust] GhrdpRustDash SYSTEM task started'
          } catch {
              Write-Host ('[rust] task registration failed: ' + $_.Exception.Message + ' (falling back to background process)')
              try {
                  Start-Process -FilePath $rustExe -WorkingDirectory $root -WindowStyle Hidden
                  $started = $true
                  Write-Host '[rust] background fallback process launched'
              } catch {
                  Write-Host ('[rust] background fallback failed: ' + $_.Exception.Message)
              }
          }
          $listening = $false
          if ($started) {
              for ($i = 0; $i -lt 30; $i++) {
                  if (Test-Path -LiteralPath $okFile) {
                      $txt = ''
                      try { $txt = [System.IO.File]::ReadAllText($okFile) } catch { }
                      if ($txt.StartsWith('LISTENING')) { $listening = $true; break }
                      if ($txt.StartsWith('BIND_FAIL')) { Write-Host ('[rust] bind failure marker: ' + $txt); break }
                  }
                  $tcp = $null
                  try { $tcp = Get-NetTCPConnection -LocalPort 7332 -State Listen -ErrorAction SilentlyContinue } catch { }
                  if ($tcp) { $listening = $true; break }
                  Start-Sleep -Seconds 2
              }
          }
          Write-Host ('[rust] listening={0}' -f $listening)
          $tncOk = $false
          $healthOk = $false
          if ($listening) {
              Write-Host '[accept] on runner: Test-NetConnection 127.0.0.1 -Port 7332 ...'
              $tnc = $null
              try { $tnc = Test-NetConnection -ComputerName 127.0.0.1 -Port 7332 -WarningAction SilentlyContinue } catch { }
              if ($tnc -and $tnc.TcpTestSucceeded) { $tncOk = $true }
              Write-Host ('[accept] runner TCP 127.0.0.1:7332 -> ' + $tncOk)
              Write-Host '[accept] on runner: curl.exe -s http://127.0.0.1:7332/health ...'
              $h = & curl.exe -s --max-time 5 http://127.0.0.1:7332/health 2>$null
              $LASTEXITCODE = 0
              $hTxt = [string]($h -join '')
              Write-Host ('[accept] runner /health -> ' + $hTxt)
              if ($hTxt -match '"ok"\s*:\s*true') { $healthOk = $true }
              Write-Host ('[accept] /health ok:true -> ' + $healthOk)
          }
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ''
          try { $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim(); $LASTEXITCODE = 0 } catch { }
          if ($listening -and $tncOk -and $healthOk) {
              $rustUrl = ''
              if ($ip) { $rustUrl = 'http://' + $ip + ':7332/' }
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_AVAILABLE=true'
              Add-Content -Path $env:GITHUB_ENV -Value ("RUST_URL=" + $rustUrl)
              [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'true', (New-Object System.Text.UTF8Encoding($false)))
              Write-Host ('[rust] VERIFIED LISTENING + healthy: ' + $rustUrl + '  (tailnet-only; NOT funneled)')
          } else {
              Write-Host ('[rust] HONEST DEGRADATION: listening={0} tcp={1} health={2} - NO 7332 URL will be advertised; PowerShell dashboard on 7331 serves this run.' -f $listening, $tncOk, $healthOk)
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_AVAILABLE=false'
              Add-Content -Path $env:GITHUB_ENV -Value 'RUST_URL='
              [System.IO.File]::WriteAllText((Join-Path $root 'rust-flag.txt'), 'false', (New-Object System.Text.UTF8Encoding($false)))
          }
          exit 0

      - name: Expose dashboard via Tailscale Serve/Funnel + print all links
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $S = $env:GITHUB_STEP_SUMMARY
          $root = 'C:\ghrdp'
          . (Join-Path $root 'ghrdp-lib.ps1')
          $cfg = Read-MirrorCfg -Path (Join-Path $root 'config.json')
          $ip = [string]$cfg.rdpIp
          $user = [string]$cfg.rdpUser
          $pass = [string]$cfg.rdpPass
          $tok = [string]$cfg.dashToken
          $keyPart = ''
          if ($tok) { $keyPart = '?key=' + $tok }
          $rustOn = ($env:RUST_AVAILABLE -eq 'true')
          $rustUrl = [string]$env:RUST_URL
          if (-not [string]$cfg.legacyIndexUrl) {
              $leg = Invoke-LegacyScrape -Url $global:GhrdpLegacyUrl
              $cfg.legacyIndexUrl = $global:GhrdpLegacyUrl
              if ($leg.ok) {
                  $cfg.legacyDecryptKey = [string]$leg.key
                  $cfg.legacyLinks = @($leg.links)
                  Write-Host ('[index] legacy rentry scraped: key ' + $(if ($leg.key) { 'recovered' } else { 'not found' }) + ', ' + @($leg.links).Count + ' legacy links')
              } else {
                  Write-Host '[index] legacy page unreachable (continuing without legacy)'
              }
          }
          if (-not [string]$cfg.runnerEgressIp) {
              $eg = Get-RunnerEgressIp
              if ($eg) {
                  $cfg.runnerEgressIp = $eg
                  Write-Host ('[net] runner egress IP: ' + $eg)
              } else {
                  Write-Host '[net] runner egress IP lookup failed - uploads still run on the runner'
              }
          }
          Save-MirrorCfg -Cfg $cfg -Path (Join-Path $root 'config.json')
          $legacyUrl = [string]$cfg.legacyIndexUrl
          if (-not $legacyUrl) { $legacyUrl = 'https://rentry.co/myurl0' }
          $legacyKey = [string]$cfg.legacyDecryptKey
          $rentryNew = [string]$cfg.rentryNewUrl
          $telegraph = [string]$cfg.mirrorIndexUrl
          $egress = [string]$cfg.runnerEgressIp
          $serveOk = $false
          $serveUrl = ''
          foreach ($argSet in @(
              @('--bg', 'http://127.0.0.1:7331'),
              @('--bg', '7331')
          )) {
              try {
                  $outTxt = (& $ts serve @argSet 2>$null) -join ' '
                  $code = $LASTEXITCODE
                  $LASTEXITCODE = 0
                  Write-Host ('[serve] tailscale serve {0} -> exit {1} {2}' -f ($argSet -join ' '), $code, $outTxt)
                  if ($code -eq 0) { $serveOk = $true; break }
              } catch {
                  Write-Host ('[serve] attempt error: ' + $_.Exception.Message)
              }
          }
          if ($serveOk) {
              try {
                  $st = (& $ts serve status 2>$null) -join ' '
                  $LASTEXITCODE = 0
                  $m = [regex]::Match($st, 'https://[A-Za-z0-9.\-]+\.ts\.net')
                  if ($m.Success) { $serveUrl = $m.Value }
              } catch { }
              if (-not $serveUrl -and $cfg.dnsName) { $serveUrl = 'https://' + [string]$cfg.dnsName }
          } else {
              Write-Host '[serve] tailscale serve did not succeed (dashboard still reachable at http://<ts-ip>:7331 over the tailnet)'
          }
          $funnelOk = $false
          $funnelUrl = ''
          if ($serveOk) {
              foreach ($argSet in @(
                  @('--bg', '7331'),
                  @('--bg', 'http://127.0.0.1:7331')
              )) {
                  try {
                      $outTxt = (& $ts funnel @argSet 2>$null) -join ' '
                      $code = $LASTEXITCODE
                      $LASTEXITCODE = 0
                      Write-Host ('[funnel] tailscale funnel {0} -> exit {1} {2}' -f ($argSet -join ' '), $code, $outTxt)
                      if ($code -eq 0) { $funnelOk = $true; break }
                  } catch {
                      Write-Host ('[funnel] attempt error: ' + $_.Exception.Message)
                  }
              }
          }
          if ($funnelOk) {
              if ($serveUrl) { $funnelUrl = $serveUrl } elseif ($cfg.dnsName) { $funnelUrl = 'https://' + [string]$cfg.dnsName }
              Write-Host ('[funnel] public funnel active: ' + $funnelUrl)
          } else {
              Write-Host '[funnel] Funnel not enabled (optional). Tailnet Serve already works with ZERO secrets.'
          }
          if ($cfg) {
              $cfg | Add-Member -NotePropertyName serveUrl -NotePropertyValue $serveUrl -Force
              $cfg | Add-Member -NotePropertyName funnelUrl -NotePropertyValue $funnelUrl -Force
              Save-MirrorCfg -Cfg $cfg -Path (Join-Path $root 'config.json')
          }
          $runUrl = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID
          $cancelCli = 'gh run cancel ' + $env:GITHUB_RUN_ID + ' -R ' + $env:GITHUB_REPOSITORY
          Write-Host '============================================================'
          Write-Host '  MISSION CONTROL READY  (PS 7331 verified; Rust 7332 gated)'
          Write-Host '------------------------------------------------------------'
          Write-Host ('  Tailscale IP ........: ' + $ip)
          Write-Host ('  RDP ................: mstsc /v:' + $ip + '   (user: ' + $user + ')')
          Write-Host ('  RDP password .......: ' + $pass + '   (also shown in Mission Control)')
          Write-Host ('  Dashboard (PS) .....: http://' + $ip + ':7331/' + $keyPart)
          if ($rustOn -and $rustUrl) {
              Write-Host ('  Dashboard (real-time) : ' + $rustUrl + '   (Rust, WebSocket; tailnet-only, NOT funneled)')
          } else {
              Write-Host '  Dashboard (real-time): unavailable this run (PowerShell dashboard on 7331 is serving)'
          }
          if ($serveUrl) { Write-Host ('  Dashboard (serve) ..: ' + $serveUrl + $keyPart + '   (tailnet only)') }
          if ($funnelUrl) { Write-Host ('  Dashboard (funnel) .: ' + $funnelUrl + $keyPart + '   (public)') }
          Write-Host '  ---- INDEXES & KEYS -------------------------------------'
          Write-Host ('  Legacy Rentry .......: ' + $legacyUrl)
          if ($legacyKey) {
              Write-Host ('  LEGACY decrypt key ..: ' + $legacyKey + '   (files uploaded before this run)')
          } else {
              Write-Host '  LEGACY decrypt key ..: (not found on the legacy page)'
          }
          if ($rentryNew) { Write-Host ('  New Rentry ..........: ' + $rentryNew) } else { Write-Host '  New Rentry ..........: (created when the first file uploads)' }
          if ($telegraph) { Write-Host ('  Telegraph ...........: ' + $telegraph) } else { Write-Host '  Telegraph ...........: (created when the first file uploads)' }
          Write-Host ('  Current decrypt key .: ' + [string]$cfg.mirrorKey + '   (current run)')
          Write-Host '  ---- EMERGENCY STOP --------------------------------------'
          Write-Host ('  web : open ' + $runUrl + '  and press "Cancel workflow"')
          Write-Host ('  cli : ' + $cancelCli + '   (copy: triple-click + Ctrl+C)')
          Write-Host '============================================================'
          if ($S) {
              '## Mission Control READY' | Add-Content -Path $S
              ('- **Tailscale IP**: ' + $ip) | Add-Content -Path $S
              ('- **RDP**: `mstsc /v:' + $ip + '` as `' + $user + '` (password: `' + $pass + '`, also in the dashboard)') | Add-Content -Path $S
              ('- **Dashboard (PS)**: http://' + $ip + ':7331/' + $keyPart) | Add-Content -Path $S
              if ($rustOn -and $rustUrl) { ('- **Dashboard (real-time)**: ' + $rustUrl) | Add-Content -Path $S } else { '- **Dashboard (real-time)**: unavailable this run (PowerShell dashboard on 7331 is serving)' | Add-Content -Path $S }
              if ($serveUrl) { ('- **Dashboard (serve)**: ' + $serveUrl + $keyPart) | Add-Content -Path $S }
              if ($funnelUrl) { ('- **Dashboard (funnel)**: ' + $funnelUrl + $keyPart) | Add-Content -Path $S }
              ('- **Legacy Rentry**: ' + $legacyUrl) | Add-Content -Path $S
              if ($legacyKey) { ('- **LEGACY decrypt key**: `' + $legacyKey + '` (files uploaded before this run)') | Add-Content -Path $S }
              if ($rentryNew) { ('- **New Rentry**: ' + $rentryNew) | Add-Content -Path $S }
              if ($telegraph) { ('- **Telegraph**: ' + $telegraph) | Add-Content -Path $S }
              ('- **Current decrypt key**: `' + [string]$cfg.mirrorKey + '`') | Add-Content -Path $S
              if ($egress) { ('- Uploads execute ON THE RUNNER (egress IP ' + $egress + ')') | Add-Content -Path $S }
              ('- Emergency stop: open the run page and Cancel workflow, or run `' + $cancelCli + '`') | Add-Content -Path $S
          }
          exit 0

      - name: Publish GitHub Pages tools (decrypt.html + archive.html + search.html + archive.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = $env:GITHUB_REPOSITORY
          $hdr = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          function Put-GhFile {
              param([string]$Path, [string]$Text)
              $api = "https://api.github.com/repos/$repo/contents/$Path"
              $sha = $null
              try { $g = Invoke-RestMethod -Uri $api -Headers $hdr -ErrorAction Stop; $sha = $g.sha } catch { }
              $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($Text))
              $body = @{ message = "update $Path"; content = $b64 }
              if ($sha) { $body.sha = $sha }
              try { Invoke-RestMethod -Uri $api -Headers $hdr -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null; Write-Host "[pages] pushed $Path" } catch { Write-Host ("[pages] push failed $Path : " + $_.Exception.Message) }
          }
          $dSb = [System.Text.StringBuilder]::new()
          [void]$dSb.Append('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHRDP Decryptor</title>')
          [void]$dSb.Append('<style>body{font-family:system-ui,sans-serif;background:#0b0f14;color:#e8eef3;margin:0;padding:24px;max-width:720px;margin:auto}h1{font-size:22px}label{display:block;margin:12px 0}input,button{padding:10px;border-radius:8px;border:1px solid #2b3a4a;background:#101820;color:#e8eef3}button{cursor:pointer;background:#153e5c}.sub{color:#8aa0ad}#out{margin-top:14px;color:#41d18f}</style></head><body>')
          [void]$dSb.Append('<h1>GHRDP Web Decryptor</h1><p class="sub">Decrypt .ghenc files locally in your browser. Nothing is uploaded. Key is saved on THIS device for permanent unlock.</p>')
          [void]$dSb.Append('<div id="info"></div><label>Pick .ghenc file <input type="file" id="f" accept=".ghenc"></label>')
          [void]$dSb.Append('<label>Decrypt key <input id="key" type="password"></label>')
          [void]$dSb.Append('<button id="go">Decrypt &amp; Download</button><div id="out"></div>')
          [void]$dSb.Append('<script>')
          [void]$dSb.Append('var params=new URLSearchParams(location.hash.slice(1));var fileUrl=params.get("file")||"",key=params.get("key")||"";')
          [void]$dSb.Append('if(key)document.getElementById("key").value=key;')
          [void]$dSb.Append('if(fileUrl){document.getElementById("info").innerHTML="Step 1: <a href=\""+fileUrl+"\" target=\"_blank\">download the .ghenc file</a>, then pick it below. Key auto-filled.";}')
          [void]$dSb.Append('async function sha256(buf){var d=await crypto.subtle.digest("SHA-256",buf);return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,"0")}).join("");}')
          [void]$dSb.Append('document.getElementById("go").onclick=async function(){')
          [void]$dSb.Append('var fi=document.getElementById("f").files[0];if(!fi){alert("pick a .ghenc file");return;}')
          [void]$dSb.Append('var buf=await fi.arrayBuffer();var u8=new Uint8Array(buf);var hash=await sha256(buf);')
          [void]$dSb.Append('var k=document.getElementById("key").value||localStorage.getItem("ghkey:"+hash)||"";')
          [void]$dSb.Append('if(!k){alert("enter decrypt key");return;}localStorage.setItem("ghkey:"+hash,k);')
          [void]$dSb.Append('try{var salt=u8.slice(0,16),iv=u8.slice(16,32),data=u8.slice(32);var enc=new TextEncoder();')
          [void]$dSb.Append('var keyMat=await crypto.subtle.importKey("raw",enc.encode(k),{name:"PBKDF2"},false,["deriveKey"]);')
          [void]$dSb.Append('var aes=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},keyMat,{name:"AES-CBC",length:256},false,["decrypt"]);')
          [void]$dSb.Append('var plain=await crypto.subtle.decrypt({name:"AES-CBC",iv:iv},aes,data);')
          [void]$dSb.Append('var name=fi.name.replace(/\.ghenc$/,"");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([plain]));a.download=name;a.click();')
          [void]$dSb.Append('document.getElementById("out").textContent="Decrypted "+name+" ("+plain.byteLength+" bytes). Key saved on this device.";')
          [void]$dSb.Append('}catch(e){alert("Decrypt failed: wrong key or corrupt file. "+e);}};')
          [void]$dSb.Append('</script></body></html>')
          $decryptHtml = $dSb.ToString()
          $aSb = [System.Text.StringBuilder]::new()
          [void]$aSb.Append('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHRDP Session Archive</title>')
          [void]$aSb.Append('<style>body{font-family:system-ui,sans-serif;background:#0b0f14;color:#e8eef3;margin:0;padding:24px}h1{font-size:22px}input{padding:8px;border-radius:8px;border:1px solid #2b3a4a;background:#101820;color:#e8eef3;width:260px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #1b2530}th{color:#8aa0ad}.det{display:none;background:#0d131a}tr.open+.det{display:table-row}button{cursor:pointer}.sub{color:#8aa0ad}a{color:#7dd3fc}</style></head><body>')
          [void]$aSb.Append('<h1>GHRDP Session Archive</h1><p class="sub">Past RDP sessions. Search + expand rows - no endless scrolling (10 per page).</p>')
          [void]$aSb.Append('<input id="q" placeholder="search session / file / key..."> <button id="prev">&laquo;</button> <button id="next">&raquo;</button> <span id="pg"></span>')
          [void]$aSb.Append('<table><thead><tr><th></th><th>Session</th><th>Date</th><th>Files</th><th>Size</th><th>Key</th><th>Links</th></tr></thead><tbody id="tb"></tbody></table>')
          [void]$aSb.Append('<script>var data={sessions:[]},page=0,PER=10,filtered=[];')
          [void]$aSb.Append('async function load(){try{var r=await fetch("archive.json",{cache:"no-store"});if(r.ok)data=await r.json();}catch(e){}filtered=data.sessions||[];draw();}')
          [void]$aSb.Append('function draw(){var q=document.getElementById("q").value.toLowerCase();')
          [void]$aSb.Append('var f=(data.sessions||[]).filter(function(s){var blob=(s.id+" "+s.date+" "+s.key+" "+(s.files||[]).map(function(x){return x.n}).join(" ")).toLowerCase();return !q||blob.includes(q);});')
          [void]$aSb.Append('filtered=f;var pages=Math.max(1,Math.ceil(f.length/PER));if(page>=pages)page=pages-1;if(page<0)page=0;')
          [void]$aSb.Append('var slice=f.slice(page*PER,page*PER+PER);var html="";')
          [void]$aSb.Append('slice.forEach(function(s,i){html+=''<tr onclick="this.classList.toggle(')
          [void]$aSb.Append("'open'")
          [void]$aSb.Append(')"><td>+</td><td>''+s.id+''</td><td>''+s.date+''</td><td>''+s.filesCount+''</td><td>''+s.bytes+''</td><td>''+s.key+''</td><td><a href="''+s.telegraph+''" target="_blank">telegraph</a> <a href="''+s.rentry+''" target="_blank">rentry</a></td></tr>'';')
          [void]$aSb.Append('html+=''<tr class="det"><td colspan="7">''+(s.files||[]).map(function(x){return ''<a href="''+x.l+''" target="_blank">''+(x.f? x.f+'' / '':'''')+x.n+''</a> (''+x.s+'')''+(x.e===''true''?'' [enc]'':'''')}).join(''<br>'')+''</td></tr>'';});')
          [void]$aSb.Append('document.getElementById("tb").innerHTML=html||''<tr><td colspan="7">no sessions yet</td></tr>'';')
          [void]$aSb.Append('document.getElementById("pg").textContent="page "+(page+1)+"/"+pages;}')
          [void]$aSb.Append('document.getElementById("q").oninput=function(){page=0;draw();};')
          [void]$aSb.Append('document.getElementById("prev").onclick=function(){page--;draw();};')
          [void]$aSb.Append('document.getElementById("next").onclick=function(){page++;draw();};')
          [void]$aSb.Append('load();</script></body></html>')
          $archiveHtml = $aSb.ToString()
          $searchHtml = @'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHRDP File Explorer</title>
          <style>
          :root{--bg:#f3f3f3;--surface:#fbfbfb;--acryl:rgba(243,243,243,.72);--text:#1b1b1b;--text2:#5c5c5c;--border:#e5e5e5;--hover:rgba(0,0,0,.06);--sel:rgba(0,103,192,.18);--accent:#0067c0;--gis:160px}
          html[data-theme=dark]{--bg:#202020;--surface:#282828;--acryl:rgba(40,40,40,.78);--text:#fff;--text2:#a6a6a6;--border:#333;--hover:rgba(255,255,255,.08);--sel:rgba(0,103,192,.35)}
          *{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;font-size:14px}
          #cmd{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--acryl);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
          #cmd button,#cmd .nb{border:0;background:transparent;color:var(--text);padding:6px 9px;border-radius:4px;cursor:pointer;font-size:13px}
          #cmd button:hover,#cmd .nb:hover{background:var(--hover)}
          #crumbs{display:flex;align-items:center;gap:4px;flex:1;min-width:120px;overflow:hidden;white-space:nowrap}
          #crumbs span{padding:4px 7px;border-radius:4px;cursor:pointer}#crumbs span:hover{background:var(--hover)}#crumbs i{color:var(--text2);font-style:normal}
          #q{flex:0 0 220px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text)}
          #shell{flex:1;display:flex;min-height:0}
          #side{width:220px;flex:0 0 220px;overflow:auto;background:var(--acryl);backdrop-filter:blur(20px);border-right:1px solid var(--border);padding:8px 6px}
          #side .g{color:var(--text2);font-size:11px;margin:8px 8px 4px}#side div.it{padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center}
          #side div.it:hover{background:var(--hover)}#side div.it.on{background:var(--sel)}
          #main{flex:1;overflow:auto;position:relative;background:var(--surface)}
          table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
          th{color:var(--text2);font-weight:600;position:sticky;top:0;background:var(--surface)}
          .item{cursor:pointer;outline:none}.item:hover{background:var(--hover)}.item.sel{background:var(--sel)}.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
          #main.grid table{display:none}#main.grid #grid{display:flex;flex-wrap:wrap;gap:8px;padding:10px}
          #grid{display:none}#main.grid .gc{display:flex}
          .gc{flex-direction:column;align-items:center;width:var(--gis);padding:10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
          .gc:hover{background:var(--hover)}.gc.sel{background:var(--sel);border-color:var(--accent)}
          .gc .ic{font-size:44px;line-height:1.2}.gc .nm{font-size:12px;text-align:center;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          #st{display:flex;align-items:center;gap:12px;padding:5px 12px;border-top:1px solid var(--border);background:var(--acryl);backdrop-filter:blur(20px);font-size:12px;color:var(--text2)}
          #st .r{margin-left:auto;display:flex;align-items:center;gap:8px}#zoom{width:120px}
          .menu,.submenu{position:fixed;list-style:none;margin:0;padding:4px;background:var(--acryl);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;min-width:180px}
          .menu li,.submenu li{padding:6px 12px;border-radius:4px;cursor:pointer;position:relative}
          .menu li:hover,.submenu li:hover{background:var(--hover)}.menu li:focus-visible,.submenu li:focus-visible{outline:2px solid var(--accent)}
          .submenu{display:none;top:0;left:100%}.menu li.hs:hover>.submenu,.menu li.hs.open>.submenu{display:block}
          .menu{display:none}.menu.show{display:block}
          #burger{display:none}@media(max-width:768px){#side{display:none}#side.open{display:block;position:absolute;z-index:40;height:100%}#burger{display:inline-block}}
          </style></head><body>
          <div id="cmd">
          <button id="burger" title="Menu">&#9776;</button>
          <button id="bBack" title="Back">&#8592;</button><button id="bFwd" title="Forward">&#8594;</button><button id="bUp" title="Up">&#8593;</button>
          <nav id="crumbs"></nav>
          <input id="q" placeholder="Search" autocomplete="off">
          <button id="vDet" title="Details">&#9776;</button><button id="vGrid" title="Grid">&#9638;</button>
          <span class="nb hs" id="nb" tabindex="0">New &#9662;</span>
          <button id="th" title="Toggle theme">&#127769;</button>
          </div>
          <div id="shell">
          <nav id="side">
          <div class="g">Quick access</div>
          <div class="it" data-nav="root">&#127968; Home</div>
          <div class="it" data-nav="gallery">&#128444; Gallery</div>
          <div class="it" data-nav="Downloads">&#11015; Downloads</div>
          <div class="it" data-nav="Desktop">&#128421; Desktop</div>
          <div class="it" data-nav="Documents">&#128196; Documents</div>
          <div class="it" data-nav="Pictures">&#128444; Pictures</div>
          <div class="g">This PC</div>
          <div class="it" data-nav="root">&#128187; This PC</div>
          <div class="it" data-nav="Archive">&#128193; Archive (past sessions)</div>
          </nav>
          <main id="main"><table><thead><tr><th>Name</th><th>Date modified</th><th>Type</th><th>Size</th></tr></thead><tbody id="rows"></tbody></table><div id="grid"></div></main>
          </div>
          <div id="st"><span id="stL"></span><span class="r"><span id="vLbl">Details view</span><input type="range" id="zoom" min="96" max="256" value="160" title="Icon size"></span></div>
          <ul class="menu" id="ctx">
          <li class="hs" tabindex="0">New &#9656;<ul class="submenu"><li data-new="folder" tabindex="0">Folder</li><li data-new="txt" tabindex="0">Text Document</li></ul></li>
          <li data-act="open" tabindex="0">Open</li>
          <li data-act="copy" tabindex="0">Copy link</li>
          <li data-act="rename" tabindex="0">Rename</li>
          <li data-act="del" tabindex="0">Delete</li>
          </ul>
          <script>
          (function(){
          "use strict";
          var root={name:"This PC",type:"folder",children:[]},cur=root,hist=[root],hi=0,sel=[],anchor=-1,view="details",ctxTarget=null;
          function nd(n,t){return{name:n,type:t,children:[],meta:null}}
          function typeOf(n){if(n.type==="folder")return"File folder";var e=(n.name.split(".").pop()||"").toLowerCase();return{mp4:"Video file",mkv:"Video file",avi:"Video file",mp3:"Audio file",flac:"Audio file",wav:"Audio file",png:"PNG image",jpg:"JPG image",jpeg:"JPG image",gif:"GIF image",txt:"Text Document",nfo:"Text Document",log:"Text Document",iso:"Disc image"}[e]||"File"}
          function iconOf(n){if(n.type==="folder")return"\uD83D\uDCC1";var e=(n.name.split(".").pop()||"").toLowerCase();return{mp4:"\uD83C\uDFAC",mkv:"\uD83C\uDFAC",avi:"\uD83C\uDFAC",mp3:"\uD83C\uDFB5",flac:"\uD83C\uDFB5",wav:"\uD83C\uDFB5",png:"\uD83D\uDDBC",jpg:"\uD83D\uDDBC",jpeg:"\uD83D\uDDBC",gif:"\uD83D\uDDBC",txt:"\uD83D\uDCC4",nfo:"\uD83D\uDCC4",log:"\uD83D\uDCC4",iso:"\uD83D\uDCBF"}[e]||"\uD83D\uDCC4"}
          function addFile(parts,meta){var n=root;for(var i=0;i<parts.length-1;i++){var f=null;for(var j=0;j<n.children.length;j++){if(n.children[j].type==="folder"&&n.children[j].name===parts[i]){f=n.children[j];break}}if(!f){f=nd(parts[i],"folder");n.children.push(f)}n=f}
          var leaf=nd(parts[parts.length-1],"file");leaf.meta=meta;n.children.push(leaf)}
          function load(){var p1=fetch("data.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
          var p2=fetch("archive.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
          Promise.all([p1,p2]).then(function(rs){
          var d=rs[0],a=rs[1];
          if(d)(d.files||[]).forEach(function(f){addFile(((f.f||"Downloads")+"\\"+f.n).split(/[\\/]/).filter(Boolean),f)});
          if(a)(a.sessions||[]).forEach(function(s){(s.files||[]).forEach(function(f){addFile(("Archive\\"+(s.id||"session")+"\\"+(f.f||"")+"\\"+f.n).split(/[\\/]/).filter(Boolean),f)})});
          setParents();render()})}
          function pathOf(n){var p=[],c=n;while(c&&c!==root){p.unshift(c.name);c=c.parent}return p}
          function setParents(){(function w(n){n.children.forEach(function(c){c.parent=n;w(c)})})(root)}
          setParents();
          function kids(){var q=(document.getElementById("q").value||"").toLowerCase();var cs=cur.children.slice().sort(function(a,b){return(a.type===b.type)?a.name.localeCompare(b.name):(a.type==="folder"?-1:1)});return q?cs.filter(function(c){return c.name.toLowerCase().indexOf(q)>=0}):cs}
          function render(){var cs=kids();document.getElementById("rows").innerHTML=cs.map(function(c,i){return "<tr class=\"item\" tabindex=\"0\" data-i=\""+i+"\"><td>"+iconOf(c)+" "+c.name+"</td><td>"+(c.meta&&c.meta.d?c.meta.d:"")+"</td><td>"+typeOf(c)+"</td><td>"+(c.type==="folder"?"":fmt(c.meta&&c.meta.s))+"</td></tr>"}).join("");
          document.getElementById("grid").innerHTML=cs.map(function(c,i){return "<div class=\"gc item\" tabindex=\"0\" data-i=\""+i+"\"><span class=\"ic\">"+iconOf(c)+"</span><span class=\"nm\">"+c.name+"</span></div>"}).join("");
          var cr=document.getElementById("crumbs");cr.innerHTML="<span data-p=\"-1\">This PC</span>"+pathOf(cur).map(function(p,i){return "<i>&#8250;</i><span data-p=\""+i+"\">"+p+"</span>"}).join("");
          cr.querySelectorAll("span").forEach(function(s){s.onclick=function(){var p=+s.dataset.p;navTo(p<0?root:nodeAt(p))}});
          document.getElementById("stL").textContent=cs.length+" items"+(sel.length?" | "+sel.length+" item(s) selected":"");
          document.querySelectorAll("#side .it").forEach(function(el){el.classList.toggle("on",el.dataset.nav===cur.name||(el.dataset.nav==="root"&&cur===root))});
          markSel()}
          function nodeAt(i){var p=pathOf(cur);var n=root;for(var k=0;k<=i;k++){n=n.children.find(function(c){return c.name===p[k]&&c.type==="folder"})}return n||root}
          function fmt(b){b=+b||0;if(b<1024)return b+" B";var u=["KB","MB","GB","TB"],i=-1;do{b/=1024;i++}while(b>=1024&&i<u.length-1);return b.toFixed(1)+" "+u[i]}
          function navTo(n){if(!n)return;hist=hist.slice(0,hi+1);hist.push(n);hi++;cur=n;sel=[];anchor=-1;render()}
          document.getElementById("bBack").onclick=function(){if(hi>0){hi--;cur=hist[hi];sel=[];render()}};
          document.getElementById("bFwd").onclick=function(){if(hi<hist.length-1){hi++;cur=hist[hi];sel=[];render()}};
          document.getElementById("bUp").onclick=function(){navTo(cur.parent||root)};
          document.getElementById("q").oninput=render;
          document.getElementById("vDet").onclick=function(){view="details";document.getElementById("main").classList.remove("grid");document.getElementById("vLbl").textContent="Details view"};
          document.getElementById("vGrid").onclick=function(){view="grid";document.getElementById("main").classList.add("grid");document.getElementById("vLbl").textContent="Grid view"};
          document.getElementById("zoom").oninput=function(){document.documentElement.style.setProperty("--gis",this.value+"px")};
          document.getElementById("burger").onclick=function(){document.getElementById("side").classList.toggle("open")};
          document.getElementById("th").onclick=function(){var h=document.documentElement;var d=h.dataset.theme==="dark";h.dataset.theme=d?"light":"dark";try{localStorage.setItem("ghx-theme",d?"light":"dark")}catch(e){}this.textContent=d?"\uD83C\uDF19":"\u2600"};
          (function(){try{var t=localStorage.getItem("ghx-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;document.getElementById("th").textContent=t==="dark"?"\u2600":"\uD83C\uDF19"}catch(e){}})();
          document.querySelectorAll("#side .it").forEach(function(el){el.onclick=function(){var n=el.dataset.nav;if(n==="root")navTo(root);else if(n==="gallery"){var g=nd("Gallery","folder");g.children=[];(function w(x){x.children.forEach(function(c){if(c.type==="folder")w(c);else if(/png|jpe?g|gif/i.test(c.name))g.children.push(c)})})(root);navTo(g)}else{var f=root.children.find(function(c){return c.name===n&&c.type==="folder"});navTo(f||nd(n,"folder"))}}});
          function items(){return Array.prototype.slice.call(document.querySelectorAll("#main .item"))}
          function markSel(){items().forEach(function(el){el.classList.toggle("sel",sel.indexOf(+el.dataset.i)>=0)});document.getElementById("stL").textContent=kids().length+" items"+(sel.length?" | "+sel.length+" item(s) selected":"")}
          document.getElementById("main").addEventListener("click",function(e){var el=e.target.closest(".item");if(!el){sel=[];anchor=-1;markSel();return}
          var i=+el.dataset.i;
          if(e.shiftKey&&anchor>=0){var a=Math.min(anchor,i),b=Math.max(anchor,i);sel=[];for(var k=a;k<=b;k++)sel.push(k)}
          else if(e.ctrlKey){var x=sel.indexOf(i);if(x>=0)sel.splice(x,1);else sel.push(i);anchor=i}
          else{sel=[i];anchor=i}
          markSel()});
          document.getElementById("main").addEventListener("dblclick",function(e){var el=e.target.closest(".item");if(!el)return;openItem(kids()[+el.dataset.i])});
          document.getElementById("main").addEventListener("keydown",function(e){var el=e.target.closest(".item");if(!el)return;if(e.key==="Enter"){openItem(kids()[+el.dataset.i])}});
          function openItem(c){if(!c)return;if(c.type==="folder")navTo(c);else if(c.meta&&c.meta.l)FilePreview.open({name:c.name,size:+(c.meta&&c.meta.s)||0,url:c.meta.l})}
          var ctx=document.getElementById("ctx");
          document.getElementById("main").addEventListener("contextmenu",function(e){e.preventDefault();var el=e.target.closest(".item");if(el){var i=+el.dataset.i;if(sel.indexOf(i)<0){sel=[i];anchor=i;markSel()}ctxTarget=kids()[i]}else ctxTarget=null;
          ctx.classList.add("show");ctx.style.left=Math.min(e.clientX,innerWidth-200)+"px";ctx.style.top=Math.min(e.clientY,innerHeight-220)+"px"});
          document.addEventListener("click",function(e){if(!e.target.closest("#ctx"))ctx.classList.remove("show")});
          document.addEventListener("keydown",function(e){if(e.key==="Escape"){ctx.classList.remove("show");var hs=ctx.querySelector(".hs");if(hs)hs.classList.remove("open")}});
          ctx.querySelector(".hs").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){this.classList.toggle("open");e.preventDefault()}});
          ctx.querySelectorAll("[data-act]").forEach(function(li){li.onclick=function(){var a=li.dataset.act;var c=ctxTarget;if(a==="open"&&c)openItem(c);
          if(a==="copy"&&c&&c.meta&&c.meta.l){(navigator.clipboard?navigator.clipboard.writeText(c.meta.l):Promise.reject()).then(function(){},function(){prompt("Copy:",c.meta.l)})}
          if(a==="rename"&&c){var n=prompt("Rename (client-side only):",c.name);if(n)c.name=n;render()}
          if(a==="del"&&c){var p=c.parent||cur;p.children=p.children.filter(function(x){return x!==c});sel=[];render()}
          ctx.classList.remove("show")}});
          ctx.querySelectorAll("[data-new]").forEach(function(li){li.onclick=function(){var t=li.dataset.new;var name=t==="folder"?("New folder"):("New Text Document.txt");var n=nd(name,t==="folder"?"folder":"file");n.parent=cur;n.meta={n:name,s:0,d:new Date().toISOString().substring(0,10),e:"false",l:""};cur.children.push(n);render();ctx.classList.remove("show")}});
          load();
          })();
          </script>
          <style>
          .pv-backdrop{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:24px}.pv-backdrop[hidden]{display:none}
          .pv-modal{display:flex;flex-direction:column;width:min(920px,100%);max-height:min(86vh,900px);background:var(--pv-sf,#f3f3f3);color:var(--pv-tx,#1b1b1b);border:1px solid var(--pv-bd,#e5e5e5);border-radius:8px;overflow:hidden;box-shadow:0 32px 64px rgba(0,0,0,.4);animation:pvIn .18s ease-out}
          html[data-theme="dark"] .pv-modal,html[data-theme=dark] .pv-modal{--pv-sf:#2b2b2b;--pv-tx:#fff;--pv-bd:#333}
          @keyframes pvIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
          .pv-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--pv-bd,#e5e5e5);background:var(--pv-hd,rgba(255,255,255,.6));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
          html[data-theme="dark"] .pv-head,html[data-theme=dark] .pv-head{--pv-hd:rgba(43,43,43,.6)}
          .pv-icon{font-size:20px;line-height:1}.pv-titles{display:flex;flex-direction:column;min-width:0;flex:1}
          .pv-title{font:600 13px/1.3 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .pv-meta{font-size:11px;color:var(--pv-mt,#616161)}
          html[data-theme="dark"] .pv-meta,html[data-theme=dark] .pv-meta{--pv-mt:#a6a6a6}
          .pv-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:4px;border:1px solid var(--pv-bd,#e5e5e5);background:var(--pv-bt,rgba(255,255,255,.7));color:inherit;font:600 12px/1 'Segoe UI',system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:background .15s}
          .pv-btn:hover{background:var(--pv-bh,rgba(0,0,0,.06))}
          html[data-theme="dark"] .pv-btn,html[data-theme=dark] .pv-btn{--pv-bt:rgba(255,255,255,.08);--pv-bh:rgba(255,255,255,.14)}
          .pv-primary{background:var(--accent,#0067C0);border-color:transparent;color:#fff}.pv-primary:hover{filter:brightness(1.1);background:var(--accent,#0067C0)}
          .pv-x{margin-left:4px}
