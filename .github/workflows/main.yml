            '' >> $S
            ('**පියවර 3 - Token එක GitHub secret එකක් විදිහට දාන්න:** මේ link එක click කරන්න (ඒක ඔයාගේ repo එකේ secret page එකටම යනවා) → **[GitHub Secrets පිටුව](' + $secretPage + ')** → **Name** = `TS_API_KEY` (capital අකුරින්) → **Value** = copy කරපු token එක paste → **Add secret**.') >> $S
