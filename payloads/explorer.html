<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHRDP Unified Explorer</title>
<style>
:root {
    --bg: #202020; /* Win11 Dark Mica base */
    --panel: rgba(32, 32, 32, 0.75); /* Acrylic */
    --line: #333;
    --ink: #fff;
    --mut: #a6a6a6;
    --acc: #0067C0; /* Win11 Accent */
    --sel: rgba(0, 103, 192, 0.2);
    --radius-lg: 8px;
    --radius-sm: 4px;
    --font-ui: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; font-family: var(--font-ui); background: var(--bg); color: var(--ink); display: flex; flex-direction: column; font-size: 14px; -webkit-font-smoothing: antialiased; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
button { background: rgba(255,255,255,0.05); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 13px; transition: background 0.1s; }
button:hover { background: rgba(255,255,255,0.1); border-color: var(--acc); }
#crumbs { display: flex; gap: 4px; align-items: center; flex: 1; min-width: 200px; overflow: hidden; font-size: 13px; }
#crumbs span { cursor: pointer; color: var(--acc); padding: 4px 8px; border-radius: var(--radius-sm); }
#crumbs span:hover { background: var(--sel); }
#crumbs i { color: var(--mut); font-style: normal; margin: 0 2px; }
.search-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 4px 8px; }
#q { background: transparent; border: none; color: var(--ink); outline: none; width: 180px; font-family: inherit; font-size: 13px; }
.toggle-global { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mut); cursor: pointer; user-select: none; white-space: nowrap; }
.toggle-global input { accent-color: var(--acc); cursor: pointer; }
#main { flex: 1; display: flex; min-height: 0; }
#side { width: 260px; min-width: 200px; border-right: 1px solid var(--line); overflow: auto; background: var(--panel); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: 8px; }
#view { flex: 1; overflow: auto; padding: 12px; background: rgba(0,0,0,0.1); }
.tnode { padding: 6px 8px; cursor: pointer; white-space: nowrap; border-radius: var(--radius-sm); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.tnode:hover { background: rgba(255,255,255,0.05); }
.tnode.sel { background: var(--sel); color: var(--ink); font-weight: 500; }
.tnode .tw { width: 16px; text-align: center; color: var(--mut); font-size: 10px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
#grid .item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; border-radius: var(--radius-lg); cursor: pointer; border: 1px solid transparent; text-align: center; transition: background 0.1s; }
#grid .item:hover { background: rgba(255,255,255,0.05); }
#grid .item.sel { border-color: var(--acc); background: var(--sel); }
#grid .ic { font-size: 42px; line-height: 1; }
#grid .nm { font-size: 12px; word-break: break-all; max-height: 2.8em; overflow: hidden; line-height: 1.4; }
#list table { width: 100%; border-collapse: collapse; font-size: 13px; }
#list th, #list td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
#list th { color: var(--mut); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
tr.item { cursor: pointer; }
tr.item:hover { background: rgba(255,255,255,0.05); }
tr.item.sel { background: var(--sel); }
.badge { font-size: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 2px 6px; color: var(--mut); margin-left: 6px; display: inline-block; }
.badge.enc { color: #fbbf24; border-color: #fbbf24; background: rgba(251,191,36,0.1); }
.badge.live { color: #34d399; border-color: #34d399; background: rgba(52,211,153,0.1); }
.badge.hist { color: #a78bfa; border-color: #a78bfa; background: rgba(167,139,250,0.1); }
a.dl { color: var(--acc); text-decoration: none; font-weight: 500; }
a.dl:hover { text-decoration: underline; }
#status { padding: 8px 16px; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--line); color: var(--mut); display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; }
.path-text { font-family: monospace; color: var(--mut); font-size: 11px; }
@media(max-width: 760px) { #side { display: none; } #q { width: 120px; } }
</style>
</head>
<body>
<header>
    <button id="btnBack" title="Back">&#8592;</button>
    <button id="btnUp" title="Up">&#8593;</button>
    <div id="crumbs"></div>
    <div class="search-box">
        <input id="q" placeholder="Search files...">
        <label class="toggle-global" title="Search across ALL sessions and folders">
            <input type="checkbox" id="globalToggle"> Global
        </label>
    </div>
    <button id="btnGrid" title="Grid view">&#9638;</button>
    <button id="btnList" title="List view">&#9776;</button>
</header>
<div id="main">
    <nav id="side"></nav>
    <section id="view">
        <div id="grid"></div>
        <div id="list" style="display:none">
            <table>
                <thead><tr><th>Name</th><th>Path / Session</th><th>Size</th><th>Uploaded</th><th>Status</th><th></th></tr></thead>
                <tbody id="lbody"></tbody>
            </table>
        </div>
    </section>
</div>
<div id="status">
    <span id="stCount"></span>
    <span id="stSize"></span>
    <span class="path-text" id="stPath"></span>
</div>

<script>
"use strict";
var ICONS = {video:'🎬', audio:'🎵', image:'🖼️', archive:'📦', text:'📄', code:'💻', exe:'⚙️', file:'📄', dir:'📁'};
var EXT = {video:['mp4','mkv','avi','mov','wmv','flv','webm','m4v'], audio:['mp3','flac','wav','aac','ogg','wma','m4a','opus'], image:['png','jpg','jpeg','gif','webp','svg','bmp'], archive:['zip','rar','7z','tar','gz','iso'], text:['txt','md','log','nfo','srt'], code:['js','ps1','py','html','css','json','yml'], exe:['exe','msi']};

function kindOf(name) { var e = (String(name).split('.').pop() || '').toLowerCase(); for(var k in EXT) { if(EXT[k].indexOf(e) >= 0) return k; } return 'file'; }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtB(n) { n=+n||0; if(n<1024) return n+' B'; var u=['KB','MB','GB','TB']; var i=-1; do { n/=1024; i++; } while(n>=1024 && i<u.length-1); return n.toFixed(1)+' '+u[i]; }

var SESSIONS = [], cur = {s:0, node:null, hist:[]}, mode = 'grid', filter = '', isGlobal = false;
var allFilesFlat = [];

function buildTree(files) {
    var root = {name:'/', type:'dir', children:[]};
    (files||[]).forEach(function(f) {
        var parts = String(f.f || '.').split(/[\\/]/).filter(function(p){return p && p!=='.';});
        var n = root;
        parts.forEach(function(p) {
            var found = null;
            for(var i=0; i<n.children.length; i++) { if(n.children[i].type==='dir' && n.children[i].name===p) { found=n.children[i]; break; } }
            if(!found) { found={name:p, type:'dir', children:[]}; n.children.push(found); }
            n = found;
        });
        n.children.push({name:f.n, type:'file', size:f.s, link:f.l, enc:f.e, time:f.t});
    });
    sortTree(root); return root;
}
function sortTree(n) { if(n.type!=='dir') return; n.children.sort(function(a,b){ if(a.type!==b.type) return a.type==='dir'?-1:1; return String(a.name).localeCompare(String(b.name)); }); n.children.forEach(sortTree); }

function buildFlatIndex() {
    allFilesFlat = [];
    SESSIONS.forEach(function(s) {
        function traverse(node, path) {
            if(!node.children) return;
            node.children.forEach(function(c) {
                if(c.type === 'dir') {
                    traverse(c, path + c.name + '/');
                } else {
                    allFilesFlat.push({
                        name: c.name, size: c.size, link: c.link, enc: c.enc, time: c.time,
                        path: path, session: s.id, live: s.live
                    });
                }
            });
        }
        traverse(s.tree, '');
    });
}

async function load() {
    SESSIONS = [];
    try { var r = await fetch('tree.json?'+Date.now(), {cache:'no-store'}); if(r.ok) { var t = await r.json(); if(t && t.files) SESSIONS.push({id:t.sessionId||'live', date:t.updated||'', live:true, tree:buildTree(t.files)}); } } catch(e){}
    try { var r2 = await fetch('archive.json?'+Date.now(), {cache:'no-store'}); if(r2.ok) { var a = await r2.json(); (a.sessions||[]).forEach(function(s){ if(s && s.files && s.id !== ((SESSIONS[0]||{}).id)) SESSIONS.push({id:s.id, date:s.date||'', live:false, tree:buildTree(s.files)}); }); } } catch(e){}
    if(!SESSIONS.length) SESSIONS.push({id:'empty', date:'', live:false, tree:{name:'/', type:'dir', children:[]}});

    buildFlatIndex();
    renderSide();
    navigate(0, SESSIONS[0].tree, true);
}

function renderSide() {
    var el = document.getElementById('side'); el.innerHTML = '';
    SESSIONS.forEach(function(s, si) {
        var d = document.createElement('div'); d.className = 'tnode'; d.style.fontWeight = '600';
        d.innerHTML = '<span class="tw">'+(si===cur.s?'▼':'▶')+'</span>' + (s.live?'🟢 ':'📁 ') + esc(s.id) + (s.live?' (LIVE)':'');
        d.onclick = function() { navigate(si, s.tree); };
        el.appendChild(d);
        if(si === cur.s) appendSide(el, s.tree);
    });
}
function appendSide(el, node) {
    (node.children||[]).filter(function(c){return c.type==='dir';}).forEach(function(c) {
        var isCur = (cur.node === c);
        var d = document.createElement('div'); d.className = 'tnode';
        if(isCur) d.classList.add('sel');
        d.style.paddingLeft = (24) + 'px';
        d.innerHTML = '<span class="tw">'+(isCur?'▼':'▶')+'</span>📁 '+esc(c.name);
        d.onclick = function(ev) { ev.stopPropagation(); navigate(cur.s, c); };
        el.appendChild(d);
        if(isCur) appendSide(el, c);
    });
}

function navigate(si, node, noHist) {
    if(!noHist && cur.node && cur.node !== node) cur.hist.push({s:cur.s, node:cur.node});
    cur.s = si; cur.node = node;
    isGlobal = false; document.getElementById('globalToggle').checked = false;
    renderSide(); renderMain();
}

function pathNames() {
    function find(node, target, trail) { if(node===target) return trail; for(var i=0; i<(node.children||[]).length; i++) { var r = find(node.children[i], target, trail.concat([node.children[i].name])); if(r) return r; } return null; }
    return find(SESSIONS[cur.s].tree, cur.node, []) || [];
}

function renderCrumbs() {
    var el = document.getElementById('crumbs'); el.innerHTML = '';
    if(isGlobal) {
        var s = document.createElement('span'); s.textContent = '🔍 Global Search Results'; s.style.fontWeight = '600';
        el.appendChild(s); return;
    }
    var trail = pathNames();
    function mk(label, si, node) { var s = document.createElement('span'); s.textContent = label; s.onclick = function(){ navigate(si, node); }; el.appendChild(s); }
    mk(SESSIONS[cur.s].id, cur.s, SESSIONS[cur.s].tree);
    var acc = SESSIONS[cur.s].tree;
    trail.forEach(function(nm) {
        var next = null;
        for(var i=0; i<(acc.children||[]).length; i++) { if(acc.children[i].name === nm && acc.children[i].type==='dir') { next = acc.children[i]; break; } }
        if(next) { var sep = document.createElement('i'); sep.textContent = '❯'; el.appendChild(sep); mk(nm, cur.s, next); acc = next; }
    });
}

function items() {
    if(isGlobal && filter) {
        return allFilesFlat.filter(function(f) {
            return f.name.toLowerCase().indexOf(filter) >= 0 || f.path.toLowerCase().indexOf(filter) >= 0;
        });
    }
    var cs = (cur.node && cur.node.children) || [];
    if(!filter) return cs;
    return cs.filter(function(c){ return String(c.name).toLowerCase().indexOf(filter) >= 0; });
}

function renderMain() {
    renderCrumbs();
    var cs = items();
    var isFlat = isGlobal && filter;

    var dirs = isFlat ? [] : cs.filter(function(c){return c.type==='dir';});
    var files = isFlat ? cs : cs.filter(function(c){return c.type==='file';});
    var tot = files.reduce(function(a,b){return a+(+b.size||0);}, 0);

    document.getElementById('stCount').textContent = (isFlat ? files.length + ' global match(es)' : dirs.length + ' folder(s), ' + files.length + ' file(s)');
    document.getElementById('stSize').textContent = fmtB(tot);
    document.getElementById('stPath').textContent = isFlat ? 'Searching all sessions...' : '/' + pathNames().join('/');

    var g = document.getElementById('grid'), lb = document.getElementById('lbody');
    g.innerHTML = ''; lb.innerHTML = '';

    if(mode === 'grid' && !isFlat) {
        g.style.display = 'grid'; document.getElementById('list').style.display = 'none';
        cs.forEach(function(c) {
            var d = document.createElement('div'); d.className = 'item';
            var ic = c.type==='dir' ? ICONS.dir : ICONS[kindOf(c.name)];
            d.innerHTML = '<div class="ic">'+ic+'</div><div class="nm">'+esc(c.name)+'</div>' + (c.type==='file'&&c.enc==='true'?'<span class="badge enc">ENC</span>':'');
            d.ondblclick = function() { openItem(c); };
            d.onclick = function() { sel(d); };
            g.appendChild(d);
        });
    } else {
        g.style.display = 'none'; document.getElementById('list').style.display = '';
        var listItems = isFlat ? files : cs;
        listItems.forEach(function(c) {
            var tr = document.createElement('tr'); tr.className = 'item';
            var ic = c.type==='dir' ? ICONS.dir : ICONS[kindOf(c.name)];
            var pathCol = isFlat ? (c.path + ' <span class="badge '+(c.live?'live':'hist')+'">'+esc(c.session)+'</span>') : '';
            var sizeCol = c.type==='dir' ? '' : fmtB(c.size);
            var statusCol = c.type==='file' ? (c.enc==='true' ? '<span class="badge enc">ENC</span>' : '') : '';
            var linkCol = c.link ? '<a class="dl" href="'+esc(c.link)+'" target="_blank" rel="noopener">download</a>' : '';

            tr.innerHTML = '<td>'+ic+' '+esc(c.name)+'</td><td>'+pathCol+'</td><td>'+sizeCol+'</td><td>'+(c.time||'')+'</td><td>'+statusCol+'</td><td>'+linkCol+'</td>';
            tr.ondblclick = function() { openItem(c); };
            tr.onclick = function() { sel(tr); };
            lb.appendChild(tr);
        });
    }
}

function sel(el) { var old = document.querySelector('.item.sel, tr.sel'); if(old) old.classList.remove('sel'); el.classList.add('sel'); }
function openItem(c) { if(c.type==='dir') { navigate(cur.s, c); } else if(c.link) { window.open(c.link, '_blank'); } }

document.getElementById('btnBack').onclick = function() { var h = cur.hist.pop(); if(h) { cur.s = h.s; cur.node = h.node; renderSide(); renderMain(); } };
document.getElementById('btnUp').onclick = function() { var trail = pathNames(); if(!trail.length) return; var parent = SESSIONS[cur.s].tree; for(var i=0; i<trail.length-1; i++) { for(var j=0; j<(parent.children||[]).length; j++) { if(parent.children[j].name === trail[i] && parent.children[j].type==='dir') { parent = parent.children[j]; break; } } } navigate(cur.s, parent); };
document.getElementById('q').oninput = function() { filter = this.value.toLowerCase(); renderMain(); };
document.getElementById('globalToggle').onchange = function() { isGlobal = this.checked; if(isGlobal) mode = 'list'; renderMain(); };
document.getElementById('btnGrid').onclick = function() { mode = 'grid'; isGlobal = false; document.getElementById('globalToggle').checked = false; renderMain(); };
document.getElementById('btnList').onclick = function() { mode = 'list'; renderMain(); };

setInterval(function(){ if(!document.hidden) load(); }, 60000);
load();
</script>
</body>
</html>
