            exit 1
          fi
          if grep -nEi 'powershell|mshta|wscript|cscript|Invoke-Expression|iex ' <<< "$blk"; then
            echo 'F20: an execution token appeared inside CONNECTION DIAGNOSTICS' >&2
            exit 1
          fi
          # [F21] The F21 CredSSP diagnostics box also contains a prohibition
          # warning naming "bypass cert validation" — that warning IS the fix,
