# These are steps for the existing Windows job, not a replacement workflow.
# Put the first two steps BEFORE server startup; D1 goes AFTER startup.
- name: D0 PowerShell source gate
  shell: powershell
  run: |
    & "$env:GITHUB_WORKSPACE\payloads\ghrdp-ci-gate.ps1" -Root $env:GITHUB_WORKSPACE
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

- name: Stage verified enrollment payload and route module
  shell: powershell
  run: |
    $ErrorActionPreference = 'Stop'
    $root = Join-Path $env:GITHUB_WORKSPACE 'payloads'
    New-Item -ItemType Directory -Path 'C:\ghrdp' -Force | Out-Null
    foreach ($name in @('ghrdp-enroll.ps1', 'ghrdp-payload-routes.ps1')) {
      $src = Join-Path $root $name
      $dst = Join-Path 'C:\ghrdp' $name
      Copy-Item -LiteralPath $src -Destination $dst -Force
      $a = (Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
      $b = (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash
      if ($a -ne $b) { throw ('Staging mismatch: ' + $name) }
      Write-Host ('STAGED ' + $name + ' sha256=' + $b.ToLowerInvariant() + ' size=' + (Get-Item -LiteralPath $dst).Length)
    }

# Existing staging of agent, diag, acceptance, UI and server startup remains here.
# Do not run D1 until the server is listening on the configured Tailscale IP.
- name: D1 synthetic tailnet agent gate
  id: d1
  continue-on-error: true
  shell: powershell
  run: |
    & "$env:GITHUB_WORKSPACE\payloads\ghrdp-d1-gate.ps1"
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# Run any existing diagnostic collection between D1 and this verdict step.
- name: Enforce D1 verdict after diagnostic collection
  if: ${{ always() && steps.d1.outcome != 'success' }}
  shell: powershell
  run: |
    throw 'D1 failed or did not run. Inspect D1 FAIL stage; do not publish a green result.'
