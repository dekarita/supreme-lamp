              try {
                  $scEvents = Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Schannel' } -MaxEvents 5 -ErrorAction SilentlyContinue
                  if ($scEvents) {
                      foreach ($ev in $scEvents) {
                          $d5 = "DUMP: Schannel Event ID=" + $ev.Id + " Time=" + $ev.TimeCreated.ToString('o') + " Msg=" + ($ev.Message -replace "`r`n", " ")
                          Write-Host $d5; if ($summaryFile) { Add-Content -Path $summaryFile -Value $d5 }
                      }
                  } else { $d5 = "DUMP: Schannel Events: none"; Write-Host $d5; if ($summaryFile) { Add-Content -Path $summaryFile -Value $d5 } }
              } catch { $d5 = "DUMP: Schannel query error: $_"; Write-Host $d5; if ($summaryFile) { Add-Content -Path $summaryFile -Value $d5 } }
          }

          function Report-Cell([string]$name, [string]$expect, [string]$observed, [bool]$pass, [string]$reasonCode, [object]$cert, [string]$keyPath, [string]$probeErr) {
              $res = if ($pass) { 'pass' } else { 'fail' }
              $msg = "CELL $name EXPECT $expect OBSERVED $observed RESULT $res"
              Write-Host $msg
              if ($summaryFile) { Add-Content -Path $summaryFile -Value $msg }
              if (-not $pass) {
                  Dump-CellDiagnostics -cellName $name -reasonCode $reasonCode -cert $cert -keyPath $keyPath -probeError $probeErr
              }
              return $pass
          }

          $allPass = $true

          # Generate pfx file for lab test
          $pfxPath = Join-Path $env:RUNNER_TEMP 'f31-lab.pfx'
          $eScript = '$rsa = [System.Security.Cryptography.RSA]::Create(2048); ' +
                     '$req = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new("CN=localhost", $rsa, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1); ' +
                     '$cert = $req.CreateSelfSigned([datetime]::UtcNow.AddDays(-1), [datetime]::UtcNow.AddDays(1)); ' +
                     '$pfxBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, ""); ' +
                     '[System.IO.File]::WriteAllBytes("' + $pfxPath.Replace('\', '\\') + '", $pfxBytes)'
          pwsh -Command $eScript

          # --- CELL 1: Negative case (DefaultKeySet imported in CHILD pwsh process) ---
          $childScript = '$pfxPath = "' + $pfxPath.Replace('\', '\\') + '"; ' +
                         '$imported = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, "", [System.Security.Cryptography.X509KeyStorageFlags]::DefaultKeySet); ' +
                         '$store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "LocalMachine"); ' +
                         '$store.Open("ReadWrite"); foreach ($old in @($store.Certificates | Where-Object { $_.Subject -match "CN=localhost" })) { try { $store.Remove($old) } catch { } }; $store.Add($imported); $store.Close(); ' +
                         '$thumb = $imported.Thumbprint; ' +
                         '$rdpKey = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; ' +
                         '$hashBytes = -split ($thumb -replace "(..)", "\$1 ") | ForEach-Object { [byte]("0x\$_") }; ' +
                         'New-ItemProperty -Path $rdpKey -Name "SSLCertificateSHA1Hash" -PropertyType Binary -Value $hashBytes -Force | Out-Null; ' +
                         'Restart-Service TermService -Force'
          $childFile = Join-Path $env:RUNNER_TEMP 'f31-child-import.ps1'
          [System.IO.File]::WriteAllText($childFile, $childScript)
          
          $p = Start-Process pwsh -ArgumentList "-File `"$childFile`"" -PassThru
          $p.WaitForExit()
          
          $negProbeOk = $false
          $negProbeErr = ''
          try {
              $tc = [System.Net.Sockets.TcpClient]::new()
              $tc.Connect('127.0.0.1', 3389)
              $st = $tc.GetStream()
              [byte[]]$x224Cr = @(0x03, 0x00, 0x00, 0x13, 0x0e, 0xe0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x08, 0x00, 0x03, 0x00, 0x00, 0x00)
              $st.Write($x224Cr, 0, $x224Cr.Length)
              $st.Flush()
              $resp = New-Object byte[] 11
              [void]$st.Read($resp, 0, $resp.Length)
              $ssl = [System.Net.Security.SslStream]::new($st, $false, [System.Net.Security.RemoteCertificateValidationCallback]{ $true })
              $ssl.AuthenticateAsClient('localhost')
              $negProbeOk = $true
              $ssl.Dispose(); $tc.Dispose()
          } catch {
              $negProbeErr = $_.Exception.Message
          }

          $negPass = (-not $negProbeOk)
          $negObserved = if ($negProbeOk) { 'handshake-succeeded' } else { '36870/reset' }
          if (-not (Report-Cell 'negative' '36870/reset' $negObserved $negPass 'H1-reproduction-failed' $null '' $negProbeErr)) {
              $allPass = $false
          }

          # --- CELL 2: Positive case (MachineKeySet|PersistKeySet|Exportable) ---
          $posCert = $null
          $posKeyPath = $null
          $posProbeErr = ''
          $posProbeOk = $false
          $posStage = 'init'
          try {
              $posStage = 'pfx-import'
              $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::MachineKeySet -bor `
                       [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor `
                       [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
              $pfxBytes = [System.IO.File]::ReadAllBytes($pfxPath)
              $posCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes, '', $flags)
              if (-not $posCert.HasPrivateKey) { throw 'cert-imported-without-persisted-key' }

              $posStage = 'store-add'
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'LocalMachine')
              $store.Open('ReadWrite')
              foreach ($old in @($store.Certificates | Where-Object { $_.Subject -match 'CN=localhost' })) {
                  try { $store.Remove($old) } catch { }
              }
              $store.Add($posCert)
              $posCertFromStore = @($store.Certificates | Where-Object { $_.Subject -match 'CN=localhost' }) | Select-Object -First 1
              if ($posCertFromStore) { $posCert = $posCertFromStore }
              $store.Close()
              $thumb = $posCert.Thumbprint

              $posStage = 'key-lookup'
              $privKey = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($posCert)
              if (-not $privKey) { $privKey = [System.Security.Cryptography.X509Certificates.ECDsaCertificateExtensions]::GetECDsaPrivateKey($posCert) }
              $cngUniqueName = $null
              $cspUniqueName = $null
              try { if ($privKey -is [System.Security.Cryptography.RSACng] -or $privKey -is [System.Security.Cryptography.ECDsaCng]) { $cngUniqueName = $privKey.Key.UniqueName } } catch { }
              try { if ($privKey -is [System.Security.Cryptography.RSACryptoServiceProvider]) { $cspUniqueName = $privKey.CspKeyContainerInfo.UniqueKeyContainerName } } catch { }
              if (-not $cngUniqueName -and -not $cspUniqueName) {
                  try { if ($privKey.Key -and $privKey.Key.UniqueName) { $cngUniqueName = $privKey.Key.UniqueName } } catch { }
                  try { if ($privKey.CspKeyContainerInfo -and $privKey.CspKeyContainerInfo.UniqueKeyContainerName) { $cspUniqueName = $privKey.CspKeyContainerInfo.UniqueKeyContainerName } } catch { }
              }
              $cngDir = Join-Path $env:ProgramData 'Microsoft\Crypto\Keys'
              $legacyDir = Join-Path $env:ProgramData 'Microsoft\Crypto\RSA\MachineKeys'
              $cryptoRoot = Join-Path $env:ProgramData 'Microsoft\Crypto'
              if ($cngUniqueName -and (Test-Path -LiteralPath (Join-Path $cngDir $cngUniqueName))) { $posKeyPath = Join-Path $cngDir $cngUniqueName }
              elseif ($cspUniqueName -and (Test-Path -LiteralPath (Join-Path $legacyDir $cspUniqueName))) { $posKeyPath = Join-Path $legacyDir $cspUniqueName }
              elseif ($cngUniqueName -and (Test-Path -LiteralPath (Join-Path $legacyDir $cngUniqueName))) { $posKeyPath = Join-Path $legacyDir $cngUniqueName }
              elseif ($cspUniqueName -and (Test-Path -LiteralPath (Join-Path $cngDir $cspUniqueName))) { $posKeyPath = Join-Path $cngDir $cspUniqueName }
              elseif ($cngUniqueName) {
                  $found = Get-ChildItem -Path $cryptoRoot -Filter $cngUniqueName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($found) { $posKeyPath = $found.FullName }
              }
              if (-not $posKeyPath -and $cspUniqueName) {
                  $found = Get-ChildItem -Path $cryptoRoot -Filter $cspUniqueName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($found) { $posKeyPath = $found.FullName }
              }

              if (-not $posKeyPath -or -not (Test-Path -LiteralPath $posKeyPath)) {
                  throw "H3-key-container-not-found cngName=$cngUniqueName cspName=$cspUniqueName"
              }

              $posStage = 'acl-set'
              $acl = Get-Acl -LiteralPath $posKeyPath
              $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule('NT AUTHORITY\NETWORK SERVICE', 'Read', 'Allow')))
              $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule('NT AUTHORITY\SYSTEM', 'FullControl', 'Allow')))
              Set-Acl -LiteralPath $posKeyPath -AclObject $acl

              $posStage = 'bind'
              try {
                  $tsSetting = Get-CimInstance -Namespace 'root/cimv2/TerminalServices' -ClassName 'Win32_TSGeneralSetting' -Filter "TerminalName='RDP-Tcp'" -ErrorAction Stop
                  Invoke-CimMethod -InputObject $tsSetting -MethodName 'SetSSLCertificateSHA1Hash' -Arguments @{ SSLCertificateSHA1Hash = $thumb } -ErrorAction Stop | Out-Null
              } catch { }
              $rdpKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
              $hashBytes = -split ($thumb -replace '(..)', '$1 ') | ForEach-Object { [byte]("0x$_") }
              New-ItemProperty -Path $rdpKey -Name 'SSLCertificateSHA1Hash' -PropertyType Binary -Value $hashBytes -Force | Out-Null

              $posStage = 'restart-service'
              Restart-Service TermService -Force

              $posStage = 'wait-listen'
              $listenOk = $false
              for ($i = 0; $i -lt 20; $i++) {
                  try {
                      $tcCheck = [System.Net.Sockets.TcpClient]::new()
                      $tcCheck.Connect('127.0.0.1', 3389)
                      if ($tcCheck.Connected) { $tcCheck.Close(); $listenOk = $true; break }
                  } catch { Start-Sleep -Milliseconds 500 }
              }
              if (-not $listenOk) { throw 'H2-listener-not-listening-on-3389' }

              $posStage = 'tls-probe'
              $tc = [System.Net.Sockets.TcpClient]::new()
              $tc.Connect('127.0.0.1', 3389)
              $st = $tc.GetStream()
              [byte[]]$x224Cr = @(0x03, 0x00, 0x00, 0x13, 0x0e, 0xe0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x08, 0x00, 0x03, 0x00, 0x00, 0x00)
              $st.Write($x224Cr, 0, $x224Cr.Length)
              $st.Flush()

              $resp = New-Object byte[] 11
              $totalRead = 0
              while ($totalRead -lt 11) {
                  $r = $st.Read($resp, $totalRead, 11 - $totalRead)
                  if ($r -le 0) { break }
                  $totalRead += $r
              }
              if ($totalRead -lt 11) { throw ("x224-response-truncated: read " + $totalRead + " bytes") }

              $ssl = [System.Net.Security.SslStream]::new($st, $false, [System.Net.Security.RemoteCertificateValidationCallback]{ $true })
              $ssl.AuthenticateAsClient('localhost')
              $posProbeOk = $true
              $ssl.Dispose(); $tc.Dispose()
          } catch {
              $posProbeErr = "[$posStage] " + $_.Exception.Message
          }

          $posObserved = if ($posProbeOk) { 'listener-handshake-ok' } else { 'probe-failed: ' + $posProbeErr }
          if (-not (Report-Cell 'positive' 'listener-handshake-ok' $posObserved $posProbeOk 'H2-positive-cell-failed' $posCert $posKeyPath $posProbeErr)) {
              $allPass = $false
          }

          # --- CELL 3: ACL-denied variant ---
          $aclDenProbeOk = $false
          $aclDenErr = ''
          try {
              if ($posKeyPath -and (Test-Path -LiteralPath $posKeyPath)) {
                  $acl = Get-Acl -LiteralPath $posKeyPath
                  $acl.PurgeAccessRules([System.Security.Principal.NTAccount]::new('NT AUTHORITY\NETWORK SERVICE'))
                  Set-Acl -LiteralPath $posKeyPath -AclObject $acl
                  Restart-Service TermService -Force
                  Start-Sleep -Seconds 1

                  $tc = [System.Net.Sockets.TcpClient]::new()
                  $tc.Connect('127.0.0.1', 3389)
                  $st = $tc.GetStream()
                  [byte[]]$x224Cr = @(0x03, 0x00, 0x00, 0x13, 0x0e, 0xe0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x08, 0x00, 0x03, 0x00, 0x00, 0x00)
                  $st.Write($x224Cr, 0, $x224Cr.Length)
                  $st.Flush()
                  $resp = New-Object byte[] 11
                  [void]$st.Read($resp, 0, $resp.Length)
                  $ssl = [System.Net.Security.SslStream]::new($st, $false, [System.Net.Security.RemoteCertificateValidationCallback]{ $true })
                  $ssl.AuthenticateAsClient('localhost')
                  $aclDenProbeOk = $true
                  $ssl.Dispose(); $tc.Dispose()
              }
          } catch {
              $aclDenErr = $_.Exception.Message
          } finally {
              if ($posKeyPath -and (Test-Path -LiteralPath $posKeyPath)) {
                  try {
                      $acl = Get-Acl -LiteralPath $posKeyPath
                      $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule('NT AUTHORITY\NETWORK SERVICE', 'Read', 'Allow')))
                      Set-Acl -LiteralPath $posKeyPath -AclObject $acl
                      Restart-Service TermService -Force
                  } catch { }
              }
          }

          $aclDenPass = (-not $aclDenProbeOk)
          $aclDenObserved = if ($aclDenProbeOk) { 'handshake-succeeded' } else { '36870/reset' }
          if (-not (Report-Cell 'acl-denied' '36870/reset' $aclDenObserved $aclDenPass 'acl-denied-failed' $posCert $posKeyPath $aclDenErr)) {
              $allPass = $false
          }

          if (-not $allPass) {
              Write-Host "::error::F31 matrix proof failed"
              'Y_result=fail' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
              exit 1
          }
          Write-Host "[Y] PASS: F31 matrix proof green (negative cell 36870 reproduced cross-process, positive cell listener-handshake-ok, acl-denied cell 36870 reproduced)"
          'Y_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
      - name: "G: setup-time measurement + lab matrix summary"
