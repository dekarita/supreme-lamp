          <div id="status"><span id="stL">0 items</span><span id="stS"></span><span class="right"><span id="stV">Details</span><input type="range" id="zoom" min="64" max="160" value="96" title="Icon size"></span></div>
          <div id="ctx" role="menu"></div>
          <script>
          (function(){
          "use strict";
          var FS={name:"This PC",type:"folder",children:[]};
          var cur=FS,hist=[],hi=-1,sel=[],anchor=-1,view="det";
          function ext(n){var m=String(n).match(/\.([^.]+)$/);return m?m[1].toLowerCase():"";}
          function typeOf(n){var e=ext(n);if(["mp4","mkv","avi","mov","webm"].indexOf(e)>=0)return "Video";if(["mp3","flac","wav","aac","ogg"].indexOf(e)>=0)return "Audio";if(["jpg","jpeg","png","gif","webp"].indexOf(e)>=0)return "Image";if(["zip","rar","7z","iso"].indexOf(e)>=0)return "Archive";if(!e)return "File folder";return e.toUpperCase()+" File";}
          function icon(n){var e=ext(n);if(["mp4","mkv","avi","mov","webm"].indexOf(e)>=0)return "🎬";if(["mp3","flac","wav","aac","ogg"].indexOf(e)>=0)return "🎵";if(["jpg","jpeg","png","gif","webp"].indexOf(e)>=0)return "🖼";if(["zip","rar","7z","iso"].indexOf(e)>=0)return "📦";if(!e)return "📁";return "📄";}
          function fmt(n){n=+n||0;if(n<1024)return n+" B";var u=["KB","MB","GB","TB"],i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return n.toFixed(1)+" "+u[i];}
          function addFolder(parent,name){for(var i=0;i<parent.children.length;i++){var c=parent.children[i];if(c.type==="folder"&&c.name===name)return c;}var f={name:name,type:"folder",children:[]};parent.children.push(f);return f;}
          function addFile(parent,o){parent.children.push({name:o.n,type:"file",size:o.s||0,dateModified:o.d||o.t||"",link:o.l||"",enc:o.e||"false",extension:ext(o.n)});}
          function ingest(sessionNode,files){(files||[]).forEach(function(o){var parts=String(o.f||"").split(/[\\/]/).filter(Boolean);var node=sessionNode;parts.forEach(function(p){node=addFolder(node,p);});addFile(node,o);});}
          function load(){
            Promise.all([fetch("data.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),fetch("archive.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})]).then(function(js){
              var d=js[0],a=js[1];
              FS.children=[];
              if(d&&(d.files||[]).length){var curNode={name:"Current run",type:"folder",children:[]};FS.children.push(curNode);ingest(curNode,d.files);}
              if(a&&(a.sessions||[]).length){a.sessions.slice().reverse().forEach(function(s){var n={name:(s.id||"session")+" ("+(s.date||"")+")",type:"folder",children:[]};FS.children.push(n);ingest(n,s.files);});}
