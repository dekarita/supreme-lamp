            'wevtutil epl Microsoft-Windows-TerminalServices-ClientActiveXCore/Operational %TEMP%\rdp-client.evtx' \
            'wevtutil el | findstr /i "terminal credssp schannel"' \
            'wevtutil epl Security %TEMP%\rdp-security.evtx /q:"*[System[(EventID=4624 or EventID=4625)]]"' \
            "wevtutil epl System %TEMP%\rdp-system.evtx /q:\"*[System[Provider[@Name='Schannel']]]\"" \
            'wevtutil epl Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational %TEMP%\rdp-termgr.evtx' \
            'Paste the exports into this session'
          do
            grep -qF "$tok" <<< "$blk" || { echo "F20: fallback block missing export line: $tok" >&2; exit 1; }
          done
          # copy-only + no execution token (the page never runs anything) + no
          # NLA/CredSSP/cert weakening suggestion anywhere in the row.
          if grep -oE 'onclick="[^"]*"' <<< "$blk" | grep -v '^onclick="copyById' | grep .; then
            echo 'F20: a non-copy control appeared inside CONNECTION DIAGNOSTICS' >&2
            exit 1
          fi
          if grep -nEi 'powershell|mshta|wscript|cscript|Invoke-Expression|iex ' <<< "$blk"; then
            echo 'F20: an execution token appeared inside CONNECTION DIAGNOSTICS' >&2
            exit 1
          fi
          # [F21] The F21 CredSSP diagnostics box also contains a prohibition
          # warning naming "bypass cert validation" — that warning IS the fix,
          # not a suggestion to weaken; exclude it from the weakening scan.
          weak=$(grep -nEi 'authentication level|enablecredsspsupport|authlvloverride|prompt for credentials|certificate.*bypass|bypass.*cert' <<< "$blk" | grep -v 'NEVER weaken NLA' || true)
          if [ -n "$weak" ]; then
            echo 'F20: the fallback block suggests weakening NLA/CredSSP/cert validation' >&2
            echo "$weak" >&2
            exit 1
          fi
          # --- §2 launcher: exit code logged + dashboard pointer in the dialog --
          grep -qF 'mstsc exited within 2s, code=' "$cs" || { echo 'F20: the mstsc exit code is not logged' >&2; exit 1; }
          # (the C# source carries the escaped form \"if mstsc still fails\").
          grep -qF 'see dashboard -> CONNECTION DIAGNOSTICS -> \"if mstsc still fails\" and send the exports' "$cs" || { echo 'F20: the launcher dialog lacks the dashboard pointer' >&2; exit 1; }
          grep -qF 'mstsc exit code ' "$cs"
          # the exe changed, so the repo constant it stamps into every beacon
          # MUST be at least the F20 build (else no client is ever told to update).
          ver=$(grep -oE 'private const string Ver = "[0-9]+(\.[0-9]+){1,3}"' "$cs" | grep -oE '[0-9]+(\.[0-9]+){1,3}' | head -1)
          test -n "$ver" || { echo 'F20: the launcher version constant is missing' >&2; exit 1; }
          test "$(printf '2.3.0.0\n%s\n' "$ver" | sort -V | head -1)" = '2.3.0.0' || { echo "F20: launcher version $ver predates the F20 build" >&2; exit 1; }
          # --- §3 the standing bans still hold on the touched surfaces ----------
          if grep -InE 'SendKeys|UIAutomation|AutomationElement|ValuePattern|keybd_event' "$ui" "$cs"; then
            echo 'F20: credential-UI automation token found' >&2
            exit 1
          fi
          if grep -nE "ghrdp://rdp\?[^'\"]*(pass|pwd|token|secret|apikey|authkey)[=:]" "$ui"; then
            echo 'F20: a ghrdp:// URL carries a credential parameter' >&2
            exit 1
          fi
          if grep -nE 'powershell\.exe|-ExecutionPolicy|Invoke-Expression|-EncodedCommand' "$ui"; then
            echo 'F20: a script-host launch token reached the page' >&2
            exit 1
          fi
          echo 'F20 gates PASS'

      - name: F21 CredSSP/NLA handshake verification gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          srv=payloads/ghrdp-server.ps1
          # --- §1 main.yml must carry the F21 CredSSP/NLA verification step ---
          step=$(awk '/name: CredSSP\/NLA handshake verification.*F21/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F21: main.yml lacks CredSSP/NLA handshake verification step' >&2; exit 1; }
          for tok in 'UserAuthentication' 'SSLCertificateSHA1Hash' 'AllowEncryptionOracle' 'Get-TlsCipherSuite' 'AES_256_GCM' 'credsspStatus' 'failed-' '::error::[F21]' 'throw' '[F21 §1 probe-end]'; do
            grep -qF "$tok" <<< "$step" || { echo "F21: verification step missing token: $tok" >&2; exit 1; }
          done
          # credsspStatus must be written BEFORE the loud fail (like F17 pattern)
          wl=$(grep -nF 'Write-CredsspStatus' <<< "$step" | head -1 | cut -d: -f1)
          wf2=$(grep -nF '::error::[F21]' <<< "$step" | head -1 | cut -d: -f1)
          test -n "$wl" && test -n "$wf2" && test "$wl" -lt "$wf2"
          # §4(a) the step must NOT proceed if credsspStatus is failed -
          # AUTO-LOGIN must stay disabled (gated in ui.html __listenerOk).
          grep -qF 'credsspStatus===' "$ui" || { echo 'F21: ui.html does not gate WINDOWS AUTO-LOGIN on credsspStatus' >&2; exit 1; }
          grep -qF "__listenerOk=!!(rl&&rl.listening===true&&rl.fwRule===true&&rl.certOk===true&&rl.nla===true&&credsspOk)" "$ui" || { echo 'F21: ui.html __listenerOk does not include credsspOk' >&2; exit 1; }
          # --- §2 client-side CredSSP diagnostics must exist (copy-only) ------
          grep -qF 'id="connCredsspBox"' "$ui" || { echo 'F21: ui.html lacks CredSSP diagnostics box' >&2; exit 1; }
          # [F21 §2] CredSSP diagnostics box (copy-only) block ends at its </details>
          blk2=$(awk '/id="connCredsspBox"/{f=1} f && /<\/details>/{print; exit} f{print}' "$ui")
          for tok in 'connDiagCredsspPol' 'connDiagLmCompat' 'connDiagMstscVerbose' 'Get-ItemProperty' 'CredSSP\Parameters' 'LmCompatibilityLevel' 'mstsc /v:' 'TcpStateFrontAuth' 'AllowEncryptionOracle=0' 'NEVER weaken NLA' 'credssp-support-off' 'auth-level overrides'; do
            grep -qF "$tok" <<< "$blk2" || { echo "F21: CredSSP diagnostics missing token: $tok" >&2; exit 1; }
          done
          # --- §4(b) NO password auto-type / SendKeys / UIAutomation -----------
          # (F19 already scans repo-wide; verify no new tokens introduced near credssp)
          if grep -rInE 'SendKeys|UIAutomation|keybd_event|mouse_event' payloads/ui.html .github/workflows/main.yml | grep -i 'cred'; then
            echo 'F21: credential-UI automation token found near CredSSP code' >&2
            exit 1
          fi
          # --- §4(c) NO NLA/CredSSP weakening suggestions anywhere ------------
          # The warning line (line 345) may NAME the banned strings as part of
          # the prohibition ("NEVER weaken NLA/CredSSP (X, Y, Z)"); executable
          # suggestions (anywhere else in non-comment code) must not appear.
          weak=$(grep -nEi 'authentication level|enablecredsspsupport|authlvloverride|authenticationleveloverride|certificate.*bypass|bypass.*cert' "$ui" | grep -v 'NEVER weaken NLA' || true)
          if [ -n "$weak" ]; then
            echo "F21: ui.html suggests weakening NLA/CredSSP/cert validation (outside the mandated warning line): $weak" >&2
            exit 1
          fi
          # --- §4(d) no cert validation bypass in the F21 step itself ---------
          if grep -nEi 'ServerCertificateValidationCallback|TrustAllCerts|SslPolicyErrors|callback.*true' <<< "$step"; then
            echo 'F21: verification step contains a cert-validation bypass' >&2
            exit 1
          fi
          # --- §3 AUTO-FIX A allowed (AllowEncryptionOracle=0 strict mode) ----
          grep -qF 'AUTO-FIX A applied' <<< "$step" || { echo 'F21: step lacks auto-fix A for AllowEncryptionOracle strict mode' >&2; exit 1; }
          # --- CredSSP status row exists in the UI ----------------------------
          grep -qF 'id="nrCredssp"' "$ui" || { echo 'F21: ui.html lacks CredSSP status row (id=nrCredssp)' >&2; exit 1; }
          grep -qF "cs==='ok'" "$ui" || { echo 'F21: ui.html does not render credssp ok/fail' >&2; exit 1; }
          echo 'F21 gates PASS'

      - name: F23 cipher-probe 3-layer robustness gates
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          step=$(awk '/name: CredSSP\/NLA handshake verification.*F21/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F23: main.yml lacks the F21 verification step' >&2; exit 1; }
          # --- §1 cipher branch = section (4) up to the NLA reassert ----------
          cipher=$(awk '/# \(4\) Schannel cipher suites/{f=1} /# NLA reassert/{exit} f' <<< "$step")
          test -n "$cipher" || { echo 'F23: cipher branch (section 4) not found in the F21 step' >&2; exit 1; }
          # L1: cmdlet enumeration with all three per-object Name-read strategies
          for tok in 'foreach ($o in @(Get-TlsCipherSuite -ErrorAction Stop))' "PSObject.Properties['Name']" 'Format-List | Out-String'; do
            grep -qF -- "$tok" <<< "$cipher" || { echo "F23: L1 cmdlet probe missing token: $tok" >&2; exit 1; }
          done
          # the brittle one-liner that false-halted the 2026-09-26 run must stay GONE
          if grep -qF 'Get-TlsCipherSuite -ErrorAction Stop | Select-Object -ExpandProperty Name' "$wf"; then
            echo 'F23: brittle Select-Object -ExpandProperty Name cipher probe reappeared' >&2; exit 1
          fi
          # L2: registry fallback with BOTH keys, the Functions value, comma split
          for tok in 'HKLM:\SYSTEM\CurrentControlSet\Control\Cryptography\Configuration\Local\SSL\00010002' \
                   'HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002' \
                   "-Name 'Functions'" "-split ','"; do
            grep -qF -- "$tok" <<< "$cipher" || { echo "F23: L2 registry fallback missing token: $tok" >&2; exit 1; }
          done
          # L3: probe-failure path (between the F23 markers) warns + stamps and
          # NEVER halts: no throw, no failReasons - a probe failure is not a
          # weak-config verdict.
          l3=$(awk '/\[F23 L3 probe-failure begin\]/{f=1;next} /\[F23 L3 probe-failure end\]/{exit} f' <<< "$step")
          test -n "$l3" || { echo 'F23: L3 probe-failure block (F23 markers) not found' >&2; exit 1; }
          for tok in '::warning::[F21] cipher probe could not enumerate (cmdlet+registry failed); Windows defaults include AES-256-GCM; proceeding with warning' \
                   "Write-CredsspStatus -Status 'ok-with-cipher-warn' -Detail 'cipher-probe-failed'"; do
            grep -qF -- "$tok" <<< "$l3" || { echo "F23: L3 probe-failure path missing token: $tok" >&2; exit 1; }
          done
          if grep -q 'throw' <<< "$l3"; then
            echo 'F23: probe-failure path contains throw (must warn and proceed)' >&2; exit 1
          fi
          if grep -qF 'failReasons +=' <<< "$l3"; then
            echo 'F23: probe-failure path adds a failReason (must not)' >&2; exit 1
          fi
          # a REAL weak config (suites enumerated, zero strong) still halts
          grep -qF "failReasons += ('schannel-cipher-weak" <<< "$cipher" || { echo 'F23: weak-config verdict no longer feeds failReasons' >&2; exit 1; }
          grep -qF "'AES_256_GCM|CHACHA20_POLY1305'" <<< "$cipher" || { echo 'F23: strong-suite match pattern missing' >&2; exit 1; }
          # handshake determinants stay loud-fail (unchanged by F23)
          for tok in "failReasons += ('nla-off" "failReasons += ('cert-untrusted" "failReasons += ('credssp-policy-mismatch" "throw ('F21 CredSSP/NLA loud-fail: ' + \$failText)"; do
            grep -qF -- "$tok" <<< "$step" || { echo "F23: loud-fail determinant missing: $tok" >&2; exit 1; }
          done
          # the all-clear path re-stamps ok-with-cipher-warn (never plain ok) when the probe failed
          okpath=$(awk '/if \(\$failReasons\.Count -eq 0\) \{/{f=1} f && /^[[:space:]]*exit 0[[:space:]]*$/{print; exit} f' <<< "$step")
          grep -qF '$cipherProbeFailed' <<< "$okpath" || { echo 'F23: success path does not branch on the probe-failure flag' >&2; exit 1; }
          grep -qF "Write-CredsspStatus -Status 'ok-with-cipher-warn' -Detail 'cipher-probe-failed'" <<< "$okpath" || { echo 'F23: success path does not stamp ok-with-cipher-warn' >&2; exit 1; }
          grep -qF "Write-CredsspStatus -Status 'ok'" <<< "$okpath" || { echo 'F23: success path lost the plain ok stamp' >&2; exit 1; }
          # --- §2 dashboard accepts the warn status: OK render + AUTO-LOGIN gate
          # (pinned as FULL definition lines - the bare token appears in more
          # than one gate, so a token grep would miss a single-line rollback)
          grep -qF "cs==='ok-with-cipher-warn'" "$ui" || { echo 'F23: ui.html status row does not accept ok-with-cipher-warn' >&2; exit 1; }
          grep -qF 'OK (cipher probe warn)' "$ui" || { echo 'F23: ui.html lacks the OK (cipher probe warn) render' >&2; exit 1; }
          grep -qF "var credsspOk=(!rl||rl.credsspStatus===undefined||rl.credsspStatus==='ok'||rl.credsspStatus==='ok-with-cipher-warn');" "$ui" || { echo 'F23: ui.html AUTO-LOGIN gate (credsspOk) does not accept ok-with-cipher-warn' >&2; exit 1; }
          grep -qF "var csOk=(!rl.credsspStatus||rl.credsspStatus==='ok'||rl.credsspStatus==='ok-with-cipher-warn');" "$ui" || { echo 'F23: ui.html listener marks (csOk) do not accept ok-with-cipher-warn' >&2; exit 1; }
          # the warn render must never read as FAIL/BLOCKED
          if grep -qF "'FAIL: '+cs" "$ui" && ! grep -qF "csGood?((cs==='ok')?'OK':'OK (cipher probe warn)'):('FAIL: '+cs)" "$ui"; then
            echo 'F23: ui.html status row no longer routes the warn status to the OK render' >&2; exit 1
          fi
          echo 'F23 gates PASS'

      - name: F24 auth-reject discriminator gates (server cred proof + 4625/CAPI2 matrix)
        shell: bash
        run: |
          set -euo pipefail
          wf=.github/workflows/main.yml
          ui=payloads/ui.html
          cs=payloads/ghrdp-rdp-launcher.cs
          # --- §1 SERVER-SIDE CREDENTIAL PROOF (ValidateCredentials + loud fail) --
          step=$(awk '/name: Server-side credential proof \(F24/{f=1;next} f && /^      - name: /{exit} f' "$wf")
          test -n "$step" || { echo 'F24: main.yml lacks the server-side credential proof step' >&2; exit 1; }
          for tok in 'ValidateCredentials' 'System.DirectoryServices.AccountManagement' "PrincipalContext('Machine')" 'credValid' 'credValidProbeError' 'Write-CredValid' '::error::[F24]' 'server-side credential invalid - user creation bug' 'throw'; do
            grep -qF -- "$tok" <<< "$step" || { echo "F24: credential proof step missing token: $tok" >&2; exit 1; }
          done
          # the PROBE itself (not just a mention): the SDAM context + the exact
          # credential-validation call must be there.
          grep -qF "\$ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')" <<< "$step" || { echo 'F24: the SDAM PrincipalContext(machine) probe is missing' >&2; exit 1; }
          grep -qF '$valid = [bool]$ctx.ValidateCredentials($UserName, $Password)' <<< "$step" || { echo 'F24: the ValidateCredentials call is missing' >&2; exit 1; }
          # the verdict is stamped BEFORE the loud fail (the dashboard must see it)
          wl=$(grep -nF 'Write-CredValid -Valid $valid' <<< "$step" | head -1 | cut -d: -f1)
          ff=$(grep -nF 'server-side credential invalid - user creation bug' <<< "$step" | head -1 | cut -d: -f1)
          test -n "$wl" && test -n "$ff" && test "$wl" -lt "$ff" || { echo 'F24: credValid is not written before the loud fail' >&2; exit 1; }
          # the proof never prints credential material (field names only)
          if grep -nE '(Write-Host|Add-Content)[^$]*(RDP_PASS|RDP_USER)' <<< "$step"; then
            echo 'F24: the credential proof prints credential material' >&2; exit 1
          fi
          # --- §2 THE SECRET-FREE 60s 4625 COLLECTOR -----------------------------
          col=$(awk '/\[F24 §2 collector-begin\]/{f=1;next} /\[F24 §2 collector-end\]/{exit} f' "$wf")
          test -n "$col" || { echo 'F24: main.yml lacks the F24 §2 collector block (markers)' >&2; exit 1; }
          for tok in 'Get-WinEvent' "LogName = 'Security'" '4624' '4625' '0XC000006A' '0XC000006D' '0XC000015B' 'wrong-password' 'authEvents' 'Get-RdpAuthEventSummary' 'Get-RdpAuthEventFields'; do
            grep -qF -- "$tok" <<< "$col" || { echo "F24: collector missing token: $tok" >&2; exit 1; }
          done
          for leak in 'RDP_PASS' 'RDP_USER' 'env:RDP_' 'SubjectUserName' 'Password' 'IpAddress'; do
            if grep -qF -- "$leak" <<< "$col"; then
              echo "F24: collector references credential/identity material: $leak" >&2; exit 1
            fi
          done
          grep -qF 'Update-RdpAuthEvents -CfgPath $cfgPath' "$wf" || { echo 'F24: the collector never ticks in the keep-alive loop' >&2; exit 1; }
          # --- §3b the F17 rebuild carries the verdict fields forward -----------
          grep -qF '[F24 §3b]' "$wf" || { echo 'F24: the F17 probe does not carry the F21 verdict fields forward' >&2; exit 1; }
          grep -qF "foreach (\$k in @('credsspStatus', 'credsspWhy', 'credValid', 'credValidAt', 'credValidWhy', 'credValidProbeError', 'authEvents'))" "$wf" || { echo 'F24: the carry-forward field list is wrong' >&2; exit 1; }
          # --- §3 ONE decision row with the three branches -----------------------
          grep -qF 'id="rdpAuthRow"' "$ui" || { echo 'F24: ui.html lacks the auth-reject discriminator row' >&2; exit 1; }
          for tok in 'SERVER credential bug - re-dispatch' 'YOUR stored password is stale' 'copy CURRENT password from KEYS' 'TLS-layer suspect' 'cmdkey /delete:TERMSRV/' 'capi2.evtx' 'system.evtx' 'authEvents' 'credValid' 'credValidProbeError' 'PROBE FAILED' 'paste the copied password EXACTLY' 'no tooling deletes credentials'; do
            grep -qF -- "$tok" "$ui" || { echo "F24: ui.html matrix missing token: $tok" >&2; exit 1; }
          done
          grep -qF "kd.textContent='cmdkey /delete:TERMSRV/'+(fqdn||'<fqdn>')" "$ui" || { echo 'F24: the cmdkey copy-line is not wired to the live FQDN' >&2; exit 1; }
          grep -qF "onclick=\"copyById('credWinPass',this)\"" "$ui" || { echo 'F24: the stale-password branch lacks the KEYS password copy-line' >&2; exit 1; }
          # the bare "FAIL: pending" credssp render must never come back
          if grep -qF "'FAIL: '+cs" "$ui"; then
            echo 'F24: ui.html renders a bare FAIL for an unreported credsspStatus' >&2; exit 1
          fi
          grep -qF 'not reported yet (F21 step: CredSSP/NLA handshake verification)' "$ui" || { echo 'F24: the pending CredSSP render is missing' >&2; exit 1; }
          # copy-only + no execution/automation + no weakening advice in the row
          blk=$(awk '/id="rdpAuthRow"/{f=1} f{print} f && /^  <\/div>$/{exit}' "$ui")
          test -n "$blk" || { echo 'F24: the discriminator row could not be extracted' >&2; exit 1; }
          if grep -oE 'onclick="[^"]*"' <<< "$blk" | grep -v '^onclick="copyById' | grep .; then
            echo 'F24: a non-copy control appeared in the discriminator row' >&2; exit 1
          fi
          if grep -nEi 'powershell|mshta|wscript|cscript|Invoke-Expression|SendKeys|UIAutomation|keybd_event' <<< "$blk"; then
            echo 'F24: an execution/automation token appeared in the discriminator row' >&2; exit 1
          fi
          if grep -nEi 'authentication level|enablecredsspsupport|authlvloverride|prompt for credentials|certificate.*bypass|bypass.*cert' <<< "$blk" | grep -v 'NEVER weaken NLA' | grep .; then
            echo 'F24: the discriminator row suggests weakening NLA/CredSSP/cert validation' >&2; exit 1
          fi
          # --- §4 locked rule: the launcher gains NO delete verb -----------------
          if grep -nE 'cmdkey[^"]*/delete' "$cs"; then
            echo 'F24: the launcher gained a credential-deletion verb (the dashboard copy-lines are the only reset path)' >&2; exit 1
          fi
          echo 'F24 gates PASS'

      - name: F8 web-desktop honesty gates
        shell: bash
        run: |
          set -euo pipefail
          # UI must not claim ready without a webdeskUrl: every non-comment
          # 'WEB DESKTOP ready' line must reference webdeskUrl on the same line.
          if grep -n 'WEB DESKTOP ready' payloads/ui.html | grep -v '^[0-9]*:[[:space:]]*//' | grep -v 'webdeskUrl'; then
            echo 'ui.html can claim WEB DESKTOP ready without webdeskUrl' >&2
            exit 1
          fi
          grep -q 'web desktop not deployed' payloads/ui.html
          grep -q 'webdeskReason' payloads/ui.html
          grep -q 'webdeskReason' payloads/ghrdp-server.ps1
          grep -q "webdeskReason = \$wdr" payloads/ghrdp-server.ps1
          # Web-desktop step must fail LOUD: all 6 skip paths record a reason.
          grep -q 'webdeskReason' .github/workflows/main.yml
          grep -q 'VNC_PASS not set - web desktop disabled' .github/workflows/main.yml
          step=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          # NOTE (all gates in this file): grep the shell variables via
          # herestring, NEVER via `printf '%s' "$var" | grep -q`. Under
          # `set -o pipefail`, grep -q's early exit SIGPIPEs printf (141),
          # which pipefail propagates, so `if ! ...` fails DESPITE the match.
          # It is scheduler-dependent (flaky across identical runs).
          n=$(grep -c "Set-WebdeskCfg ''" <<< "$step" || true)
          if [ "$n" -lt 6 ]; then
            echo "web-desktop step has silent skip paths (only $n reason writes)" >&2
            exit 1
          fi
          # No fabricated serve URL: a URL needs a real serve mapping.
          if grep -n "serveUrl = 'https://' + \$fq" .github/workflows/main.yml; then
            echo 'web-desktop step fabricates a serve URL without a mapping' >&2
            exit 1
          fi
          # Self-test step must exist and gate on the noVNC marker.
          grep -q 'Web desktop self-test' .github/workflows/main.yml
          teststep=$(awk '/Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' .github/workflows/main.yml)
          grep -q 'noVNC' <<< "$teststep"
          grep -q 'self-test PASS' <<< "$teststep"
          grep -q 'self-test FAIL' <<< "$teststep"
      - name: F9l web-desktop self-heal + diagnostics gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          # Region = the self-test step through the diagnostics steps (ends at
          # the dashboard step, exactly like the F8 gate).
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF")
          # Assert against CODE, never against prose: comment text must not be
          # able to satisfy (or mask) a gate.
          code=$(grep -vE '^[[:space:]]*#' <<< "$teststep")
          # A) [F9n] The self-test must curl the EXACT advertised URL (the value
          #    the dashboard opens) plus the backend root on the tailnet IP.
          if ! grep -qF 'Invoke-Probe $url' <<< "$code"; then
            echo 'self-test does not curl the exact advertised URL (Invoke-Probe $url missing)' >&2
            exit 1
          fi
          if ! grep -qF -- "'backend-root'" <<< "$code"; then
            echo 'self-test lacks the backend-root probe' >&2
            exit 1
          fi
          # B) Dead backend must be healed by CALLING the idempotent launcher
          #    (the function definition alone proves nothing).
          if ! grep -qF '$started = Start-Websockify' <<< "$teststep"; then
            echo 'self-test cannot heal the backend leg ($started = Start-Websockify missing)' >&2
            exit 1
          fi
          # C) [F9n] serve is retired: no mapping reset may survive, and the
          #    classifier must capture firewall evidence (the GHRDP-Webdesk
          #    rule state) instead of serve status.
          if grep -qF -- "'--bg'" <<< "$code"; then
            echo 'self-test still carries a retired serve reset form' >&2
            exit 1
          fi
          if ! grep -q 'GHRDP-Webdesk' <<< "$code"; then
            echo 'self-test does not capture GHRDP-Webdesk firewall evidence' >&2
            exit 1
          fi
          # D) [F9n] The classification tokens must exist (diagnosis, not guessing).
          for tok in backend-dead firewall marker-missing; do
            if ! grep -q "verdict = '$tok'" <<< "$code"; then
              echo "self-test cannot classify: '$tok' missing" >&2
              exit 1
            fi
          done
          # E) Fail-closed: the halt must still write the locked codes + throw.
          if ! grep -q "\$cfgF.webdeskReason = 'serve-failed'" <<< "$code"; then
            echo 'self-test halt no longer writes webdeskReason=serve-failed' >&2
            exit 1
          fi
          if ! grep -q "throw ('Web desktop self-test FAILED" <<< "$code"; then
            echo 'self-test halt no longer throws (fail-closed)' >&2
            exit 1
          fi
          # F) The F9l-1 launcher must exist in BOTH steps as byte-identical text
          #    (a divergent copy silently changes recovery behaviour).
          n=$(grep -c '^          function Start-Websockify(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Start-Websockify copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Start-Websockify\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Start-Websockify copies diverged - edit both or neither' >&2
            exit 1
          fi
          launcher=$(awk '/^          function Start-Websockify\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF")
          # [F11-5.3] SUPERSEDES the F9n 'must not hide' rule: websockify is a
          # host helper, so it MUST launch hidden - the first interactive RDP
          # session must show no stray console window. The byte-identical
          # two-copy contract above is unchanged.
          if ! grep -Fq -- '-WindowStyle Hidden' <<< "$launcher"; then
            echo 'Start-Websockify must launch hidden (F11-5.3: no console window in the interactive session)' >&2
            exit 1
          fi
          # G) Survivable diagnostics: the webdesk steps must stage + upload the
          #    'webdesk-diag' artifact, and the upload path must stay inside the
          #    workspace - upload-artifact v4 rejects absolute host paths
          #    (proven by the first lab run: 'rootDirectory ... is not a parent
          #    directory of the file C:\ghrdp\webdesk\websockify.log').
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          if ! grep -q 'actions/upload-artifact' <<< "$webdesk_all"; then
            echo 'web-desktop steps do not upload the diagnostics artifact' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+name: webdesk-diag[[:space:]]*$' <<< "$webdesk_all"; then
            echo "web-desktop steps do not upload the 'webdesk-diag' artifact" >&2
            exit 1
          fi
          upload=$(awk '/Web desktop diagnostics artifact/{f=1} f && /^      - name: / && !/Web desktop diagnostics artifact/{exit} f' "$WF")
          if ! grep -q 'if: always()' <<< "$upload"; then
            echo 'the diagnostics upload must use if: always() (it must survive a halt)' >&2
            exit 1
          fi
          if ! grep -qE '^[[:space:]]+path: webdesk-diag[[:space:]]*$' <<< "$upload"; then
            echo 'the diagnostics upload must use the workspace-relative staging dir' >&2
            exit 1
          fi
          if grep -qE 'C:\\+ghrdp|runner\.temp' <<< "$upload"; then
            echo 'diagnostics upload uses absolute paths - upload-artifact v4 will fail (stage inside the workspace instead)' >&2
            exit 1
          fi
      - name: F9n tailnet-HTTP transport gates (serve retired for webdesk)
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          webdesk_all=$(awk '/Web desktop \(noVNC/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          # 1) tailscale serve is retired in the webdesk path: no invocation or
          #    serve machinery may survive. The single allowed mention is the
          #    mandated retirement transport note in the deploy summary.
          rest=$(grep -v 'tailscale serve retired' <<< "$webdesk_all")
          if grep -q 'tailscale serve' <<< "$rest"; then
            echo "webdesk steps still use 'tailscale serve' (retired: Windows SYSTEM operator lock 401)" >&2
            exit 1
          fi
          for tok in 'serve status' 'set-raw' 'Get-WebdeskServeUrl' "'--bg'"; do
            if grep -qF -- "$tok" <<< "$webdesk_all"; then
              echo "webdesk steps still carry retired serve machinery: $tok" >&2
              exit 1
            fi
          done
          # 2) the CGNAT-only firewall rule must be created (idempotent) + evidenced.
          if ! grep -q "New-NetFirewallRule.*GHRDP-Webdesk" <<< "$webdesk_all"; then
            echo 'webdesk deploy step lacks the GHRDP-Webdesk firewall rule' >&2
            exit 1
          fi
          if ! grep -q "RemoteAddress '100.64.0.0/10'" <<< "$webdesk_all"; then
            echo 'GHRDP-Webdesk rule is not scoped to 100.64.0.0/10' >&2
            exit 1
          fi
          if ! grep -q "LocalPort 7333" <<< "$webdesk_all"; then
            echo 'GHRDP-Webdesk rule does not target port 7333' >&2
            exit 1
          fi
          # 3) the tailnet IP must come from config.rdpIp with CGNAT validation
          #    (fail-closed, no fabrication). [F25] The read is now a L1/L2/L3
          #    ladder over config.json + step env (see the F25 gate below); the
          #    `tailscale ip` LocalAPI fallback is still banned, so the 401 the
          #    F9n evidence documents cannot recur here.
          if ! grep -q 'cfgR.rdpIp' <<< "$webdesk_all"; then
            echo 'webdesk deploy step does not read config.rdpIp' >&2
            exit 1
          fi
          if ! grep -q 'tailnet-ip-unavailable' <<< "$webdesk_all"; then
            echo 'webdesk deploy step lacks the tailnet-ip-unavailable fail-closed path' >&2
            exit 1
          fi
          # 4) the server must enforce the webdeskUrl acceptance allowlist.
          if ! grep -q 'F9n] webdeskUrl acceptance allowlist' payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 lacks the F9n webdeskUrl acceptance allowlist' >&2
            exit 1
          fi
          if ! grep -q "6\[4-9\]" payloads/ghrdp-server.ps1; then
            echo 'server allowlist lacks the CGNAT 100.64-127 pattern' >&2
            exit 1
          fi
          if ! grep -q 'ts\\.net/' payloads/ghrdp-server.ps1; then
            echo 'server allowlist lacks the legacy https ts.net alternative' >&2
            exit 1
          fi
      - name: F25 tailnet IP ladder + writer assertion gates
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          # The two steps F25 changes, isolated as regions so a marker found in
          # some other step cannot satisfy a gate.
          webdesk=$(awk '/^      - name: Web desktop \(noVNC/{f=1} /^      - name: Web desktop self-test/{f=0} f' "$WF")
          stage=$(awk '/^      - name: Stage files \+ write config\.json/{f=1} /^      - name: RDP listener self-probe/{f=0} f' "$WF")
          if [ -z "$webdesk" ]; then echo 'webdesk deploy step not found' >&2; exit 1; fi
          if [ -z "$stage" ]; then echo 'stage config writer step not found' >&2; exit 1; fi

          # --- 1) the L1/L2/L3 ladder exists and every rung is CGNAT-validated --
          for tok in 'cfgR.rdpIp' 'cfgR.runnerResolvedIP' 'env:RUNNER_RESOLVED_IP' 'Resolve-DnsName'; do
            if ! grep -qF -- "$tok" <<< "$webdesk"; then
              echo "webdesk step lacks ladder source: $tok" >&2; exit 1
            fi
          done
          # Each rung is gated on the ONE shared CGNAT pattern AND on "not already
          # won", which is what makes this an ordered, first-valid-wins ladder.
          for tok in 'if ($rawL1.Trim() -match $cgnat)' \
                     '-not $rdpIp -and $rawL2.Trim() -match $cgnat' \
                     '-not $rdpIp -and $dnsCand -match $cgnat' \
                     '-not $rdpIp -and $rawL3.Trim() -match $cgnat'; do
            if ! grep -qF -- "$tok" <<< "$webdesk"; then
              echo "webdesk IP rung missing or not CGNAT-validated: $tok" >&2; exit 1
            fi
          done
          if ! grep -qF -- '100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.' <<< "$webdesk"; then
            echo 'webdesk ladder lost the CGNAT 100.64.0.0/10 pattern' >&2; exit 1
          fi
          # Anchored at BOTH ends. The bare §2 prefix form also accepts
          # "100.83.13.45evil" / "100.83.13.45.attacker.tld", and this is the one
          # place where the accepted value is pasted into the advertised webdesk
          # URL and the websockify BindIp (§6: no URL fabrication).
          if ! grep -qE "\\\$cgnat = '\^100.*\\\$'" <<< "$webdesk"; then
            echo 'the ladder CGNAT pattern must be anchored at both ends (^...$)' >&2; exit 1
          fi
          # [F9n] preserved: `tailscale ip` must STILL never be CALLED in this step
          # (post-connect LocalAPI returns 401 - node owned by NT AUTHORITY\SYSTEM).
          # Comments may still discuss the command, so strip them before checking.
          webdesk_code=$(grep -vE '^[[:space:]]*#' <<< "$webdesk")
          if grep -qE 'tailscale(\.exe)? ip' <<< "$webdesk_code"; then
            echo 'webdesk step calls `tailscale ip` (F9n SYSTEM-operator 401 lock)' >&2; exit 1
          fi

          # --- 2) the per-source diagnostic dump on the fail-closed path --------
          # The dump string is composed at runtime, so pin the CONSTRUCTION:
          # the 'L1 .. | L2 .. | L3 ..' assembly plus each per-source raw label.
          for tok in 'tailnet-ip-source-dump' \
                     "\$ipDump = ('L1 ' + \$ipDiag.L1 + ' | L2 ' + \$ipDiag.L2 + ' | L3 ' + \$ipDiag.L3)" \
                     "('rdpIp=' + \$(if (\$rawL1)" \
                     "('runnerResolvedIP=' + \$(if (\$rawL2)" \
                     "('env=' + \$(if (\$rawL3)" \
                     'PSObject.Properties' 'tailnet-ip-unavailable' \
                     'tailnet-ip-sources.txt'; do
            if ! grep -qF -- "$tok" <<< "$webdesk"; then
              echo "webdesk step lacks the per-source diagnostic dump token: $tok" >&2; exit 1
            fi
          done
          # The dump must be printed BEFORE the throw, so a halting run still
          # shows which source was empty (the F25 post-mortem requirement).
          dump_line=$(grep -nF -- 'tailnet-ip-source-dump' <<< "$webdesk" | head -1 | cut -d: -f1)
          throw_line=$(grep -nF -- "throw 'Web desktop not deployed: tailnet-ip-unavailable" <<< "$webdesk" | head -1 | cut -d: -f1)
          if [ -z "$dump_line" ] || [ -z "$throw_line" ] || [ "$dump_line" -ge "$throw_line" ]; then
            echo 'per-source dump must be emitted before the tailnet-ip-unavailable throw' >&2; exit 1
          fi

          # --- 3) the stage step READS BACK what it wrote -----------------------
          for tok in 'config-writer lost tailnet IP' 'F25 read-back assertion PASS' \
                     'ReadAllText($cfgPathStage)' 'runnerResolvedIP'; do
            if ! grep -qF -- "$tok" <<< "$stage"; then
              echo "stage step lacks the F25 read-back assertion token: $tok" >&2; exit 1
            fi
          done
          wr_line=$(grep -nF -- "WriteAllText((Join-Path \$root 'config.json')" <<< "$stage" | head -1 | cut -d: -f1)
          rd_line=$(grep -nF -- 'ReadAllText($cfgPathStage)' <<< "$stage" | head -1 | cut -d: -f1)
          if [ -z "$wr_line" ] || [ -z "$rd_line" ] || [ "$rd_line" -le "$wr_line" ]; then
            echo 'stage read-back must read config.json AFTER the write' >&2; exit 1
          fi

          # --- 4) no overwrite-style config.json writer (§3.2/§3.3) -------------
          # Every step region that WRITES config.json must also READ it in the
          # same region. An overwrite-style writer rebuilds config.json from a
          # partial object and drops properties - the F25 failure class.
          python3 tests/config-writer-audit.py "$WF"
      - name: F9o TightVNC password-ladder gates (auth probe + labeled degrade)
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/main.yml
          deploy=$(awk '/Web desktop \(noVNC/{f=1} /^      - name: Web desktop self-test/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          teststep=$(awk '/^      - name: Web desktop self-test/{f=1} /Start Mission Control dashboard EARLY/{f=0} f' "$WF" | grep -vE '^[[:space:]]*#')
          # 1) the password mangler must be gone: no package-manager install of
          #    TightVNC may survive in EITHER webdesk step (deploy or self-test).
          for region in deploy teststep; do
            if grep -q 'choco install tightvnc' <<< "${!region}"; then
              echo "webdesk $region still carries the password-mangling install path" >&2
              exit 1
            fi
          done
          # 2) L1: ALWAYS direct msiexec with the full property list (download
          #    first; REINSTALL pair when the uninstall key exists).
          if ! grep -q 'tightvnc-2.8.85-gpl-setup-64bit.msi' <<< "$deploy"; then
            echo 'deploy step does not download the TightVNC MSI first (L1)' >&2
            exit 1
          fi
          for prop in 'VALUE_OF_PASSWORD=' 'VALUE_OF_CONTROLPASSWORD=' 'SET_PASSWORD=1' 'SET_CONTROLPASSWORD=1' 'REINSTALL=Server' 'REINSTALLMODE=omus'; do
            if ! grep -qF -- "$prop" <<< "$deploy"; then
              echo "L1 msiexec property missing: $prop" >&2
              exit 1
            fi
          done
          # 3) L2: restart + registry pin (SecurityTypes=VncAuth) + Password blob check.
          if ! grep -q "SecurityTypes.*VncAuth" <<< "$deploy"; then
            echo 'L2 must pin SecurityTypes to VncAuth' >&2
            exit 1
          fi
          if ! grep -q 'Password.*Length.*-ge 8\|\$pwdLen -ge 8\|-ge 8' <<< "$deploy"; then
            echo 'L2 must verify the Password blob length >= 8' >&2
            exit 1
          fi
          # 4) L3/L4: the REAL auth probe (vncdotool vs 127.0.0.1:5900) must exist
          #    in the deploy step, with redaction and a reinstall retry.
          if ! grep -q 'vncdotool' <<< "$deploy"; then
            echo 'deploy step lacks the vncdotool auth probe (L3)' >&2
            exit 1
          fi
          if ! grep -q '127.0.0.1::5900' <<< "$deploy"; then
            echo 'auth probe must target 127.0.0.1::5900' >&2
            exit 1
          fi
          if ! grep -q '\[redacted\]' <<< "$deploy"; then
            echo 'auth probe lacks password redaction' >&2
            exit 1
          fi
          if ! grep -q 'choco uninstall tightvnc' <<< "$deploy"; then
            echo 'L4 retry lacks the manager-held uninstall + fresh msiexec path' >&2
            exit 1
          fi
          # 5) L5: LABELED degrade - the exact WARNING string + the auth stamp +
          #    the fail-closed unverifiable detail. Never silent, never hidden.
          if ! grep -qF 'VNC password gate could not be applied; access limited to tailnet firewall 100.64.0.0/10; rotate VNC_PASS and re-dispatch to restore the gate' <<< "$deploy"; then
            echo 'L5 degrade path lacks the mandated summary WARNING string' >&2
            exit 1
          fi
          if ! grep -q "none-tailnet-only" <<< "$deploy"; then
            echo "L5 must stamp webdeskAuth='none-tailnet-only'" >&2
            exit 1
          fi
          if ! grep -q 'vnc-auth-unverifiable' <<< "$deploy"; then
            echo 'deploy step lacks the vnc-auth-unverifiable fail-closed path' >&2
            exit 1
          fi
          # 6) self-test: HTTP marker AND the mode-matching VNC probe (vnc-auth
          #    verdict on mismatch), with probe codes in the artifact payload.
          if ! grep -q 'vncdotool' <<< "$teststep"; then
            echo 'self-test lacks the vncdotool probe' >&2
            exit 1
          fi
          if ! grep -q 'webdeskAuth' <<< "$teststep"; then
            echo 'self-test lacks mode-matching (webdeskAuth)' >&2
            exit 1
          fi
          if ! grep -q "verdict = 'vnc-auth'" <<< "$teststep"; then
            echo "self-test lacks the 'vnc-auth' verdict" >&2
            exit 1
          fi
          if ! grep -q 'vncprobe-codes.txt' <<< "$teststep"; then
            echo 'self-test does not record vncprobe-codes.txt' >&2
            exit 1
          fi
          if ! grep -q 'tightvnc-tail.txt' <<< "$teststep"; then
            echo 'artifact payload lacks tightvnc-tail.txt' >&2
            exit 1
          fi
          # 7) the two probe copies must be byte-identical (like Start-Websockify).
          n=$(grep -c '^          function Invoke-VncAuthProbe(' "$WF" || true)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 Invoke-VncAuthProbe copies (deploy + self-test), found $n" >&2
            exit 1
          fi
          h1=$(awk '/^          function Invoke-VncAuthProbe\(/{f=1} f{print} f && /^          \}$/{exit}' "$WF" | sha256sum | cut -d' ' -f1)
          h2=$(awk 'BEGIN{c=0} /^          function Invoke-VncAuthProbe\(/{c++} c==2{f=1} f{print} f && /^          \}$/{if (c==2) exit}' "$WF" | sha256sum | cut -d' ' -f1)
          if [ "$h1" != "$h2" ]; then
            echo 'the two Invoke-VncAuthProbe copies diverged - edit both or neither' >&2
            exit 1
          fi
          # 8) server + UI must expose the verified auth mode.
          if ! grep -q 'webdeskAuth' payloads/ghrdp-server.ps1; then
            echo 'ghrdp-server.ps1 does not expose webdeskAuth' >&2
            exit 1
          fi
          if ! grep -q "webdeskAuth = \$wda" payloads/ghrdp-server.ps1; then
            echo 'native-status does not return webdeskAuth' >&2
            exit 1
          fi
          if ! grep -q 'VNC auth mode' payloads/ui.html; then
            echo 'ui.html lacks the VNC auth mode row' >&2
            exit 1
          fi
          if ! grep -q 'webdeskAuthAdvisory' payloads/ui.html; then
            echo 'ui.html lacks the degraded-mode advisory' >&2
            exit 1
          fi
      - name: F9 MagicDNS halt + link gates
        shell: bash
        run: |
          set -euo pipefail
          # F9a/F9f: every MagicDNS gate (tailscale-connect, cert-bind,
          # stage/config) must carry the actionable admin link in its failure
          # output (log + step summary + thrown message) - at least one per
          # gate, so three minimum across main.yml.
          n=$(grep -c 'login.tailscale.com/admin/dns' .github/workflows/main.yml || true)
          if [ "$n" -lt 3 ]; then
            echo "main.yml carries only $n 'login.tailscale.com/admin/dns' links (need >= 3: one per MagicDNS gate)" >&2
            exit 1
          fi
          # F9f: no MagicDNS validation may pass without a non-empty *.ts.net
          # Self.DNSName. Every step that reads Self.DNSName must validate it
          # against the ts.net pattern (empty / tailnet-IP / other names halt).
          bad=$(awk '
            /^      - name: / { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; buf = "" }
            { buf = buf $0 "\n" }
            END { if (buf != "" && index(buf, "Self.DNSName") && !index(buf, "\\.ts\\.net$")) n++; print n + 0 }
          ' .github/workflows/main.yml)
          if [ "$bad" -ne 0 ]; then
            echo 'a step reads Self.DNSName without a non-empty *.ts.net validation - a MagicDNS gate could pass on an empty or non-ts.net name' >&2
            exit 1
          fi
      - name: F9k secret-halt + cascade gates
        shell: bash
        run: |
          set -euo pipefail
          # The TS_AUTHKEY halt must carry the clickable Tailscale admin keys link.
          if ! grep -q 'login.tailscale.com/admin/settings/keys' .github/workflows/main.yml; then
            echo "main.yml lacks 'login.tailscale.com/admin/settings/keys' (TS_AUTHKEY halt link)" >&2
            exit 1
          fi
          # Secret fix instructions must link the repo secrets settings page.
          if ! grep -q 'settings/secrets/actions' .github/workflows/main.yml; then
            echo "main.yml lacks 'settings/secrets/actions' (repo secrets settings link)" >&2
            exit 1
          fi
          # Every ghrdp-lib.ps1 dot-source must carry exactly one '# [F9k-guard]'
          # cascade guard, and the gate must not be vacuous.
          guards=$(grep -cF '# [F9k-guard]' .github/workflows/main.yml || true)
          dotsrc=$(grep -c "\. (Join-Path \$root 'ghrdp-lib.ps1')" .github/workflows/main.yml || true)
          if [ "$dotsrc" -lt 1 ]; then
            echo 'no ghrdp-lib.ps1 dot-sources found - gate would be vacuous' >&2
            exit 1
          fi
          if [ "$guards" -ne "$dotsrc" ]; then
            echo "F9k guard count ($guards) != ghrdp-lib dot-source count ($dotsrc)" >&2
            exit 1
          fi
      - name: F27 ticket and password-sink gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/f27-copy.test.js tests/f27-handoff.test.js
      - name: Native UI and VPS contracts (Node)
        run: node --test tests/*.test.js
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # [F19 §5] REAL unit test of the shipped launcher's DNS-guard decision:
      # compile payloads/ghrdp-rdp-launcher.cs with the same in-box csc that
      # install.cmd uses, run --dns-selftest (injected resolver/TCP results) and
      # require the full matrix - fail-name+reach-ip => client-dns-off,
      # both-ok => mstsc, no-ip/closed => dns-fail - with ZERO mstsc/cmdkey calls.
      - name: F19 launcher DNS-guard decision matrix (csc compile + injected resolver)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matrixTxt = ''
          try {
            $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            if (-not (Test-Path -LiteralPath $csc)) { $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
            if (-not (Test-Path -LiteralPath $csc)) { throw 'the in-box csc.exe is missing (install.cmd depends on it too)' }
            $exe = Join-Path $env:RUNNER_TEMP 'ghrdp-rdp-launcher-f19.exe'
            $out = Join-Path $env:RUNNER_TEMP 'ghrdp-dns-selftest.txt'
            if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Force }
            $cs = Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-rdp-launcher.cs'
            Write-Host ('[F19] csc=' + $csc)
            $cscOut = (& $csc /nologo /target:winexe /out:$exe /r:System.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll $cs 2>&1 | Out-String)
            $cscRc = $LASTEXITCODE
            Write-Host ('[F19] csc exit=' + $cscRc + ' output=' + $cscOut.Trim())
            if ($cscRc -ne 0) { throw ('csc exit ' + $cscRc + ' :: ' + $cscOut.Trim()) }
            $env:GHRDP_LAB_OUT = $out
            $env:GHRDP_LAB_NOMSG = '1'
            # the launcher is /target:winexe: '& $exe' would return without
            # waiting (that race is what made this step flaky), so wait on the
            # process object explicitly.
            $p = Start-Process -FilePath $exe -ArgumentList '--dns-selftest','lab-target.dekarita.tailnet-lab.ts.net','100.64.0.7' -PassThru
            $p.WaitForExit()    # waits for the selftest process only, never the tree
            $runRc = $p.ExitCode
            Write-Host ('[F19] selftest exit=' + $runRc)
            if ($runRc -ne 0) { throw ('--dns-selftest exit ' + $runRc) }
            for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $out); $i++) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path -LiteralPath $out)) { throw '--dns-selftest wrote no matrix file' }
            $matrixTxt = Get-Content -LiteralPath $out -Raw
            Write-Host $matrixTxt
            foreach ($want in @(
              'injectedDns=fail injectedTcp=open ip=100.64.0.7 decision=client-dns-off expected=client-dns-off verdict=pass',
              'injectedDns=fail injectedTcp=closed ip=100.64.0.7 decision=dns-fail expected=dns-fail verdict=pass',
              'injectedDns=ok injectedTcp=open ip=100.64.0.7 decision=mstsc expected=mstsc verdict=pass',
              'injectedDns=fail injectedTcp=open ip=(none) decision=dns-fail expected=dns-fail verdict=pass',
              'injectedDns=notailnet injectedTcp=open ip=100.64.0.7 decision=client-dns-off expected=client-dns-off verdict=pass'
            )) { if (-not $matrixTxt.Contains($want)) { throw ('matrix case missing: ' + $want) } }
            if (-not $matrixTxt.Contains('mstscLaunched=0 cmdkeyCalled=0')) { throw 'the selftest touched mstsc/cmdkey' }
            if ($matrixTxt -like '*verdict=FAIL*') { throw 'a matrix case reported FAIL' }
            Write-Host '[F19] launcher DNS-guard matrix: 5/5 pass (no mstsc, no cmdkey)'
          } catch {
            Write-Host ('::error::[F19] launcher DNS-guard matrix stage failed :: ' + $_.Exception.Message)
            Write-Host ('::error::[F19] matrix file=[' + $matrixTxt.Replace("`r", ' ').Replace("`n", ' | ') + ']')
            exit 1
          }
      - name: Parse native PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('payloads/ghrdp-server.ps1', 'payloads/Provision-GhrdpVps.ps1', 'payloads/Enable-RdpTlsCertificate.ps1', 'payloads/helper-ghrdp-connect.ps1')) {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
              if ($errors) { throw "$file has $($errors.Count) PowerShell syntax error(s): $($errors[0].Message)" }
          }
      # [F24] The F24 blocks live INSIDE main.yml (inline pwsh) and are extracted
      # verbatim by the lab cell U + the F24 gate. Parse them here with the
      # PowerShell language parser so a syntax error is caught in ~1 min instead
      # of after a 20-minute lab run. This step never executes them.
      - name: Parse the F24 extracted blocks (main.yml inline PowerShell)
        shell: pwsh
        run: |
          $wf = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github/workflows/main.yml'))
          function Get-Block([string]$Begin, [string]$End) {
              $a = $wf.IndexOf($Begin)
              $b = $wf.IndexOf($End, [Math]::Max($a, 0))
              if ($a -lt 0 -or $b -lt 0 -or $b -le $a) { throw ('F24 marker missing in main.yml: ' + $Begin) }
              return ((($wf.Substring($a, $b - $a)) -split "`r?`n") | Where-Object { $_ -notmatch 'begin\]|end\]' } | ForEach-Object { $_ -replace '^\s+', '' }) -join "`n"
          }
          foreach ($pair in @(@('# [F24 §1 cred-proof-begin]', '# [F24 §1 cred-proof-end]'), @('# [F24 §2 collector-begin]', '# [F24 §2 collector-end]'))) {
              $text = Get-Block $pair[0] $pair[1]
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) { throw ($pair[0] + ' has ' + $errors.Count + ' PowerShell syntax error(s): ' + $errors[0].Message) }
              Write-Host ('[F24] extracted block parses OK: ' + $pair[0] + ' (' + $text.Length + ' chars)')
          }
      - name: Smoke-test VPS ACL helper in temporary files only
        shell: pwsh
        run: |
          $source = Get-Content payloads/Provision-GhrdpVps.ps1 -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$null, [ref]$null)
          $fn = $ast.Find({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Protect-Path'}, $true)
          if (-not $fn) { throw 'Protect-Path definition missing' }
          . ([scriptblock]::Create($fn.Extent.Text))
          $dir = Join-Path $env:RUNNER_TEMP ('ghrdp-acl-' + [guid]::NewGuid().ToString('N'))
          try {
              New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
              Protect-Path -Path $dir -Directory $true
              $file = Join-Path $dir 'safe.txt'
              [System.IO.File]::WriteAllText($file, 'non-secret CI test')
              Protect-Path -Path $file
              if (-not (Get-Acl $dir).AreAccessRulesProtected -or -not (Get-Acl $file).AreAccessRulesProtected) { throw 'ACL protection failed' }
          } finally { if (Test-Path $dir) { Remove-Item $dir -Recurse -Force } }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish compiled native handler
        shell: pwsh
        run: |
          dotnet run --project payloads/ghrdp-handler/GhrdpHandler.csproj -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Handler self-test failed' }
          dotnet publish payloads/ghrdp-handler/GhrdpHandler.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o "$env:RUNNER_TEMP\ghrdp-handler"
          if ($LASTEXITCODE -ne 0) { throw 'Handler publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ghrdp-handler-win-x64
          path: ${{ runner.temp }}\ghrdp-handler\GhrdpHandler.exe

      - name: F27 Windows credential handoff mechanics (not live NLA)
        shell: powershell
        run: ./tests/f27-windows.ps1
