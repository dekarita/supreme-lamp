      # === EDIT 3: installer part - robust, self-verifying, friendly (no admin, first-time safe) ===
      - name: Write ghrdp installer part (registry; helper embedded as base64 marker)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-install.part.ps1" <<'PARTEOF'
          param()
          # friendly top-level guard: never crash with a raw red error for a first-time user
          try {
            $hb64 = 'REPLACE_ME_B64'
            $dir = Join-Path $env:LOCALAPPDATA 'ghrdp'
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            $helperPath = Join-Path $dir 'ghrdp.ps1'
            $helperText = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($hb64))
            Set-Content -Path $helperPath -Value $helperText -Encoding ASCII
            $root='HKCU:\Software\Classes\ghrdp'
            New-Item -Path $root -Force | Out-Null
            Set-Item -Path $root -Value 'URL:GitHub RDP Connect'
            New-ItemProperty -Path $root -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null
            New-Item -Path "$root\shell\open\command" -Force | Out-Null
            $pwsh=(Get-Command powershell.exe -ErrorAction SilentlyContinue).Source
            if(-not $pwsh){ $pwsh='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' }
            Set-Item -Path "$root\shell\open\command" -Value "`"$pwsh`" -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$helperPath`" `"%1`""
            # ---- self verify (so a first-time user never wonders if it worked) ----
            $ok = [bool](Get-ItemProperty -Path "$root\shell\open\command" -ErrorAction SilentlyContinue)
            $ok = $ok -and (Test-Path $helperPath)
            Write-Host ''
            if($ok){
              Write-Host '====================================================' -ForegroundColor Green
              Write-Host '  SUCCESS - RDP connector installed.' -ForegroundColor Green
              Write-Host '  Now go back and CLICK the RDP link again.' -ForegroundColor Green
              Write-Host '  RDP will open with NO typing.' -ForegroundColor Green
              Write-Host '  (If the browser asks "Open app?" tick Always-allow + Open once.)' -ForegroundColor Yellow
              Write-Host '====================================================' -ForegroundColor Green
            } else {
              Write-Host '====================================================' -ForegroundColor Red
              Write-Host '  INSTALL LOOKS INCOMPLETE - registry key missing.' -ForegroundColor Red
              Write-Host '  Re-run this script by RIGHT-CLICK -> Run with PowerShell.' -ForegroundColor Yellow
              Write-Host '  If blocked: file Properties -> Unblock, or run in PowerShell:' -ForegroundColor Yellow
              Write-Host '    Set-ExecutionPolicy -Scope CurrentUser Bypass -Force' -ForegroundColor Cyan
              Write-Host '====================================================' -ForegroundColor Red
            }
          } catch {
            Write-Host ''
            Write-Host '====================================================' -ForegroundColor Red
            Write-Host '  INSTALL ERROR (copy this line if you need help):' -ForegroundColor Red
            Write-Host ("  " + $_.Exception.Message) -ForegroundColor Red
            Write-Host '  Most common fix - run this once in PowerShell then retry:' -ForegroundColor Yellow
            Write-Host '    Set-ExecutionPolicy -Scope CurrentUser Bypass -Force' -ForegroundColor Cyan
            Write-Host '====================================================' -ForegroundColor Red
          }
          try { Write-Host ''; Read-Host 'Press Enter to close this window' } catch {}
          PARTEOF

      - name: Configure theme + bookmarks + apps + Mission Control shortcut
        run: |
          $ErrorActionPreference = 'Continue'
          function Reset-Exit { $script:LASTEXITCODE = 0 }
          $mPers='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if(-not(Test-Path $mPers)){New-Item -Path $mPers -Force|Out-Null}
          New-ItemProperty -Path $mPers -Name 'AppsUseLightTheme'    -Value 0 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mPers -Name 'SystemUsesLightTheme' -Value 0 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mPers -Name 'ColorPrevalence'      -Value 0 -PropertyType DWord -Force|Out-Null
          $mAcc='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Accent'
          if(-not(Test-Path $mAcc)){New-Item -Path $mAcc -Force|Out-Null}
          New-ItemProperty -Path $mAcc -Name 'AccentColorMenu' -Value 0x8c2bc4 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mAcc -Name 'StartColor'      -Value 0x8c2bc4 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mAcc -Name 'AccentColor'     -Value 0xffc42b8c -PropertyType DWord -Force|Out-Null
          try{ $mag=[byte[]](0x8C,0x2B,0xC4,0xFF,0x9E,0x33,0xD0,0xFF,0xB0,0x3B,0xDC,0xFF,0xC2,0x43,0xE8,0xFF,0x7A,0x22,0xB0,0xFF,0x66,0x1A,0x9C,0xFF,0x52,0x12,0x88,0xFF,0x3E,0x0A,0x74,0xFF); Set-ItemProperty -Path $mAcc -Name 'AccentPalette' -Value $mag -PropertyType Binary -Force|Out-Null }catch{}
