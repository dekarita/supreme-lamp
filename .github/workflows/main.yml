          [IO.File]::WriteAllText($wdRun,$wdTpl,(New-Object System.Text.UTF8Encoding $false))
          & schtasks /Create /TN ghrdpwatchdog /TR "`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$wdRun`"" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F 2>$null|Out-Null; $LASTEXITCODE=0; & schtasks /Run /TN ghrdpwatchdog 2>$null|Out-Null; $LASTEXITCODE=0
          if($env:MIRROR -eq 'true' -and $env:RDP_USER){ $wTr="`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$cfgPath`""; & schtasks /Create /TN ghrdpwatcher /TR $wTr /SC ONLOGON /RU $env:RDP_USER /RP $env:RDP_PASS /RL LIMITED /F 2>$null|Out-Null; $LASTEXITCODE=0 }
          $up=$false; for($i=0;$i -lt 40;$i++){ if((Test-Path $okFile) -and ((Get-Content $okFile -Raw) -match 'LISTENING')){ $up=$true; break }; Start-Sleep -Milliseconds 500 }
