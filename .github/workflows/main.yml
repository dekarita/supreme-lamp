name: Windows RDP

on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Desktop+Documents+Temp+D-Storage+qBittorrent (AES-256) to gofile+telegraph. PUBLIC index. default OFF'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Tailscale
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $out = "tailscale-setup.msi"; $ok = $false
          for ($a = 1; $a -le 4; $a++) {
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null
            $LASTEXITCODE = 0
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; Write-Host "Downloaded via curl (attempt $a), size=$((Get-Item $out).Length)"; break }
            Write-Host "curl attempt $a failed, retrying in $((3 * $a))s..."; Start-Sleep -Seconds (3 * $a)
          }
          if (-not $ok) {
            for ($a = 1; $a -le 3; $a++) {
              try { Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; Write-Host "Downloaded via IWR (attempt $a)"; break } } catch { Write-Host "IWR attempt $a failed: $_" }
              Start-Sleep -Seconds (3 * $a)
            }
          }
          if (-not $ok) { throw "Could not download Tailscale MSI after retries. Re-run the workflow." }

      - name: Install Tailscale
        shell: pwsh
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
          Start-Sleep -Seconds 5

      - name: Get Tailscale sign-in link (auto if TS_AUTHKEY secret set, else guided)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $daemonOk = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState) { $daemonOk = $true; break } } catch {}
            if ($i -eq 3) { Start-Service Tailscale -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          if (-not $daemonOk) { throw "tailscaled not started." }
          $S = $env:GITHUB_STEP_SUMMARY
          if ($env:TS_AUTHKEY) {
            $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"; $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process -FilePath $ts -ArgumentList @("up", "--authkey=$($env:TS_AUTHKEY)", "--accept-dns=true") -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState -eq 'Running') { $ok = $true; break } } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ok) { throw "TS_AUTHKEY login did not reach Running. Check the key is valid, not expired, and reusable/ephemeral as intended." }
            $ip = (& $ts ip -4).Trim()
            Write-Host "TAILSCALE AUTO-LOGGED-IN via TS_AUTHKEY (hands-free, permanent). IP = $ip"
            "### Tailscale: auto-logged-in via TS_AUTHKEY (hands-free) ✅" >> $S
          } else {
            $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"; $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process -FilePath $ts -ArgumentList "up" -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru
            $url = $null
            for ($i = 0; $i -lt 90; $i++) {
              $txt = ""
              foreach ($f in @($upLog, $upErr)) { if (Test-Path $f) { try { $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'ReadWrite'); $sr = New-Object System.IO.StreamReader($fs); $txt += $sr.ReadToEnd(); $sr.Close(); $fs.Close() } catch {} } }
              if ($txt -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }
              Start-Sleep -Seconds 2
            }
            if (-not $url) { Write-Host $txt; throw "Tailscale sign-in link not found." }
            $keysPage  = "https://login.tailscale.com/admin/settings/keys"
            $secretPage = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"
            Write-Host "TAILSCALE SIGN-IN LINK (click now): $url"
            Write-Host ""
            Write-Host "=== ONE-TIME SETUP = make every FUTURE run PERMANENT / hands-free (no link to click) ==="
            Write-Host "STEP 1  Open Tailscale auth-keys page (click): $keysPage"
            Write-Host "        Generate auth key -> tick REUSABLE + EXPIRE 90 DAYS -> copy the tskey-auth-... string"
            Write-Host "STEP 2  Open your GitHub secret page (click): $secretPage"
            Write-Host "        Name = TS_AUTHKEY  -> Value = paste the tskey-auth-... -> Add secret"
            Write-Host "STEP 3  Re-run. Tailscale then logs in BY ITSELF forever (rotate by repeating 1-2 when it expires)."
            Write-Host "        NO extra credentials are needed for file uploads (gofile + telegraph are anonymous)."
            Write-Host "========================================================================================"
            $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8
            "### Tailscale Sign-in (click now - works while job runs)" >> $S
            "" >> $S; "**[$url]($url)**" >> $S; "" >> $S
            "### Make future runs hands-free (one-time)" >> $S
            "1. Open **[$keysPage]($keysPage)** -> generate a **reusable** auth key." >> $S
            "2. Open **[$secretPage]($secretPage)** -> add secret ``TS_AUTHKEY``." >> $S
            "3. Re-run -> Tailscale auto-logs-in forever (no link)." >> $S
          }

      - name: Wait for Tailscale sign-in
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $authed = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState -eq 'Running') { $authed = $true; break } } catch {}
            Start-Sleep -Seconds 5
          }
          if (-not $authed) { throw "Tailscale sign-in timeout." }
          Write-Host "Tailscale connected. IP = $((& $ts ip -4).Trim())"

      - name: Auto-enable Funnel on tailnet (Tailscale API, one-time TS_API_KEY secret)
        env:
          TS_KEY: ${{ secrets.TS_API_KEY }}
        shell: pwsh
        run: |
          $tok = $env:TS_KEY
          $secretPage = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"
          $actionsPage = "https://github.com/$($env:GITHUB_REPOSITORY)/actions"
          $tokenPage = "https://login.tailscale.com/admin/settings/keys"
          $aclPage = "https://login.tailscale.com/admin/acls"
          if (-not $tok) {
            Write-Host "############################################################"
            Write-Host "#  TS_API_KEY not set -> Funnel/Serve must be enabled once."
            Write-Host "#  One-time setup (click the links):"
            Write-Host "#  1) $tokenPage  -> generate access token (tskey-api-...)"
            Write-Host "#  2) $secretPage -> Name=TS_API_KEY Value=tskey-api-..."
            Write-Host "#  3) $actionsPage -> re-run"
            Write-Host "#  MANUAL: $aclPage -> add nodeAttrs:[{target:[*],attr:[funnel]}]"
            Write-Host "############################################################"
            exit 0
          }
          $base = 'https://api.tailscale.com/api/v2/tailnet/-/acl'
          $authH = @{ Authorization = ("Bearer " + $tok); Accept = 'application/json' }
          $txt = $null
          try { $r = Invoke-WebRequest -Uri $base -Headers $authH -UseBasicParsing -TimeoutSec 30; $txt = $r.Content } catch { Write-Host "[acl] GET failed: $($_.Exception.Message)" }
          $acl = $null
          if ($txt) {
            $clean = $txt -replace '/\*[\s\S]*?\*/', ''
            $clean = ($clean -split "`n" | ForEach-Object { $_ -replace '//[^\r\n]*', '' }) -join "`n"
            $clean = $clean -replace ',(\s*[\]}])', '$1'
            try { $acl = $clean | ConvertFrom-Json -ErrorAction Stop } catch { Write-Host "[acl] Could not parse ACL text. Will NOT clobber your rules."; $acl = $null }
          }
          $needPost = $false
          if ($acl) {
            $na = @(); if ($acl.PSObject.Properties['nodeAttrs'] -and $acl.nodeAttrs) { $na = @($acl.nodeAttrs) }
            $has = $false; foreach ($n in $na) { $tg = @($n.target); $at = @($n.attr); if (($tg -contains '*') -and ($at -contains 'funnel')) { $has = $true } }
            if (-not $has) {
              $na = $na + , @{ target = @('*'); attr = @('funnel') }
              if ($acl.PSObject.Properties['nodeAttrs']) { $acl.nodeAttrs = $na } else { $acl | Add-Member -NotePropertyName 'nodeAttrs' -NotePropertyValue $na -Force }
              $needPost = $true
            } else { Write-Host "[acl] funnel attr already present." }
          }
          if ($needPost) {
            $body = [System.Text.Encoding]::UTF8.GetBytes(($acl | ConvertTo-Json -Depth 12 -Compress))
            try { Invoke-WebRequest -Uri $base -Headers (@{ Authorization = ("Bearer " + $tok); 'Content-Type' = 'application/json' }) -Method Post -Body $body -UseBasicParsing -TimeoutSec 30 | Out-Null; Write-Host "[acl] SUCCESS - Funnel attr added via API." } catch { Write-Host "[acl] POST failed: $($_.Exception.Message)" }
          }
          if (-not $acl) { Write-Host "[acl] Left ACL unchanged. If Funnel still fails, regenerate token with admin rights." }

      - name: Setup tailnet web link (Tailscale Serve - clickable, no secret needed)
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $b = [byte[]]::new(24); $rng.GetBytes($b); $dashToken = -join ($b | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
          Add-Content $env:GITHUB_ENV ("DASH_TOKEN=" + $dashToken)
          $serveOut = Join-Path $env:RUNNER_TEMP 'serve.out'; $serveErr = Join-Path $env:RUNNER_TEMP 'serve.err'
          Remove-Item $serveOut, $serveErr -Force -ErrorAction SilentlyContinue
          try { Start-Process -FilePath $ts -ArgumentList @('serve', '--bg', '7331') -RedirectStandardOutput $serveOut -RedirectStandardError $serveErr -WindowStyle Hidden | Out-Null; Write-Host '[serve] launched detached' } catch { Write-Host ('[serve] launch err: ' + $_) }
          $serveUrl = ''; $dns = ''; $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            $stj = $null
            try { $j = Start-Job -ScriptBlock { param($t) & $t status --json 2>$null } -ArgumentList $ts; if (Wait-Job $j -Timeout 4) { $stj = Receive-Job $j | ConvertFrom-Json -ErrorAction SilentlyContinue }; Remove-Job $j -Force -ErrorAction SilentlyContinue } catch { try { Remove-Job $j -Force -ErrorAction SilentlyContinue } catch {} }
            if ($stj -and $stj.Self.DNSName) { $dns = $stj.Self.DNSName.TrimEnd('.'); break }
            Start-Sleep -Seconds 2
          }
          if ($dns) { $serveUrl = ('https://' + $dns + '/?key=' + $dashToken) }
          Add-Content $env:GITHUB_ENV ('SERVE_URL=' + $serveUrl)
          Start-Sleep -Seconds 2
          $slog = ''; if (Test-Path $serveOut) { $slog = (Get-Content $serveOut -Raw -ErrorAction SilentlyContinue) }
          $serr = ''; if (Test-Path $serveErr) { $serr = (Get-Content $serveErr -Raw -ErrorAction SilentlyContinue) }
          $alltext = (($slog + "`n" + $serr) -replace "`r`n", ' ')
          $enableLink = $null; if ($alltext -match 'https://login\.tailscale\.com/f/serve\?[^\s]+') { $enableLink = $Matches[0] }
          $serveDisabled = ($alltext -match 'Serve is not enabled')
          if ($serveDisabled) {
            Write-Host '============================================================'; Write-Host '  Serve is OFF on your tailnet. Enable once:'
            if ($enableLink) { Write-Host ('  ' + $enableLink) } else { Write-Host '  Tailscale admin -> your machine -> enable HTTPS/Serve.' }
            Write-Host '  Until then use the ghrdp paste link from Show RDP credentials.'; Write-Host '============================================================'; $serveUrl = ''
          } else { if ($slog) { Write-Host ('[serve out] ' + $alltext.Trim()) } }
          Write-Host '============================================================'
          if ($serveUrl) { Write-Host '  TAILNET WEB LINK:'; Write-Host ('  SERVE_WEBAPP_LINK: ' + $serveUrl) } else { Write-Host '  Serve link not ready. Use ghrdp paste link later.' }
          Write-Host '============================================================'
          '### Tailnet web-app link' >> $env:GITHUB_STEP_SUMMARY
          if ($serveUrl) { ('**[>>> OPEN RDP WEB-APP <<<](' + $serveUrl + ')**') >> $env:GITHUB_STEP_SUMMARY } else { '_Serve link not ready - use ghrdp paste link._' >> $env:GITHUB_STEP_SUMMARY }

      - name: Enable RDP + harden + open dashboard port (all profiles)
        shell: pwsh
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $rdp -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 2
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Value 3
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -ErrorAction SilentlyContinue | Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'ghrdp-dash' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'ghrdp-dash' -Direction Inbound -LocalPort 7331 -Protocol TCP -Action Allow -Profile Any -Enabled True -ErrorAction SilentlyContinue | Out-Null
          & netsh.exe advfirewall firewall add rule name="ghrdp-dash-netsh" dir=in action=allow protocol=TCP localport=7331 enable=yes | Out-Null; $LASTEXITCODE = 0
          & net.exe accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30 2>$null | Out-Null; $LASTEXITCODE = 0

      - name: Create secure random RDP account + D-RDP-Storage + pre-create profile folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $hb = [byte[]]::new(4); $rng.GetBytes($hb); $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))
          function New-SafePassword {
            param([string]$UserName, [string]$FullName, [int]$Length = 24)
            $lower = 'abcdefghijkmnopqrstuvwxyz'; $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; $digit = '23456789'; $special = '!@^-_+~'
            $all = $lower + $upper + $digit + $special; $buf4 = [byte[]]::new(4)
            function RandInt([int]$max) { $rng.GetBytes($buf4); $u = [BitConverter]::ToUInt32($buf4, 0); return [int]($u % [uint32]$max) }
            function Pick([string]$set) { return [string]$set[(RandInt $set.Length)] }
            $bad = New-Object System.Collections.Generic.HashSet[string]
            foreach ($src in @($UserName, $FullName)) { $s = ([string]$src).ToLower(); for ($i = 0; $i -le ($s.Length - 3); $i++) { [void]$bad.Add($s.Substring($i, 3)) } }
            for ($attempt = 0; $attempt -lt 500; $attempt++) {
              $arr = [char[]]::new($Length); $arr[0] = (Pick $lower)[0]; $arr[1] = (Pick $upper)[0]; $arr[2] = (Pick $digit)[0]; $arr[3] = (Pick $special)[0]
              for ($i = 4; $i -lt $Length; $i++) { $arr[$i] = (Pick $all)[0] }
              for ($i = $Length - 1; $i -gt 0; $i--) { $j = RandInt ($i + 1); $tmp = $arr[$i]; $arr[$i] = $arr[$j]; $arr[$j] = $tmp }
              $cand = -join $arr; $low = $cand.ToLower(); $ok = $true
              foreach ($t in $bad) { if ($t -and $low.Contains($t)) { $ok = $false; break } }
              if ($ok) { return $cand }
            }
            throw 'Could not generate a policy-safe password.'
          }
          $created = $false; $pass = $null
          for ($try = 0; $try -lt 6; $try++) {
            $pass = New-SafePassword -UserName $user -FullName 'RDP Session' -Length (24 + $try)
            try { New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -ErrorAction Stop | Out-Null; $created = $true; break }
            catch {
              $isPwd = ($_.Exception -is [Microsoft.PowerShell.Commands.InvalidPasswordException]) -or ($_.Exception.InnerException -is [Microsoft.PowerShell.Commands.InvalidPasswordException]) -or ($_.ToString() -match 'InvalidPasswordException')
              if ($isPwd) { Write-Host "Local policy rejected the password (attempt $try); regenerating..." } else { throw }
            }
          }
          if (-not $created) { throw "New-LocalUser kept rejecting passwords - the runner image has a non-standard local password policy." }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          # pre-create the profile shell folders NOW so the watcher never sees path-missing and the browser/qBittorrent have real targets
          $prof = "C:\Users\$user"
          foreach ($sub in @('Downloads', 'Desktop', 'Documents', 'AppData\Local\Temp', 'AppData\Roaming\qBittorrent')) {
            try { New-Item -ItemType Directory -Path (Join-Path $prof $sub) -Force -ErrorAction SilentlyContinue | Out-Null } catch {}
          }
          if (Test-Path 'D:\') {
            $big = 'D:\RDP-Storage'; New-Item -ItemType Directory -Path $big -Force | Out-Null
            & icacls.exe $big /grant "${user}:(OI)(CI)F" 2>$null | Out-Null; $LASTEXITCODE = 0
            $ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk"); $sc.TargetPath = $big; $sc.Save()
            Write-Host "D:\RDP-Storage ready."
          } else { Write-Host "No D: drive detected." }
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"; Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"
          Write-Host "Created account: $user (profile folders pre-created)"

      - name: Show RDP credentials (open THIS step for IP/user/pass + clickable link)
        shell: pwsh
        run: |
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
          $user = $env:RDP_USER; $pass = $env:RDP_PASS
          $ghrdp = "ghrdp://" + $ip + "/" + [uri]::EscapeDataString($user) + "/" + [uri]::EscapeDataString($pass)
          Add-Content $env:GITHUB_ENV ("GHRDP_NOW=" + $ghrdp)
          $serveUrl = $env:SERVE_URL
          Write-Host '============================================================'
          Write-Host ('  RDP CREDENTIALS  IP=' + $ip + '  USER=' + $user + '  PASS=' + $pass)
          Write-Host '============================================================'
          if ($serveUrl) { Write-Host ''; Write-Host '>>> CLICKABLE WEB-APP LINK:'; Write-Host ('    WEBAPP_LINK: ' + $serveUrl) }
          Write-Host ''; Write-Host '>>> ZERO-TYPING now (PASTE in LOCAL browser bar):'; Write-Host ('    ' + $ghrdp)
          Write-Host ''; Write-Host ('>>> Manual mstsc: mstsc -> ' + $ip + '  user ' + $user + '  pass ' + $pass); Write-Host '============================================================'

      # ======================== EDITED STEP 1 ========================
      - name: Write mirror lib (shared functions; hardened gofile + rentry/telegraph index + per-file progress)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'LIBEOF'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ErrorActionPreference = 'SilentlyContinue'
          function Read-Cfg { $b=[System.IO.File]::ReadAllBytes($env:GHRDP_CFG); if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){ $b=$b[3..($b.Length-1)] }; $t=[System.Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF); return ($t | ConvertFrom-Json) }
          function Save-Cfg($c){ [System.IO.File]::WriteAllText($c.cfgPath, ($c | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false)) }
          function B64U($s){ $x=[Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($s)); return $x.Replace('+','-').Replace('/','_').TrimEnd('=') }
          $global:GHRDP_PROG = @{ ts=''; alive=$true; rentryEdit=''; indexBackend=''; active=@{name='';phase='idle';bytesDone=0;bytesTotal=0;pct=0;speedBps=0}; agg=@{total=0;done=0;active=0;failed=0;tracked=0;bytesDone=0;bytesTotal=0;overallPct=0;speedBps=0}; files=@(); log=@(); scan=@{} }
          $global:GHRDP_PROG_PATH=$null; $global:GHRDP_LASTFLUSH=0; $global:GHRDP_DONE_BYTES=0; $global:GHRDP_TOTAL_BYTES=0
          $global:GHRDP_SP=@{t=0;b=0}; $global:GHRDP_SP_A=@{t=0;b=0}; $global:GHRDP_CUR=$null
          function Init-Progress($path){ $global:GHRDP_PROG_PATH=$path; $n=[datetime]::Now.Ticks; $global:GHRDP_SP=@{t=$n;b=0}; $global:GHRDP_SP_A=@{t=$n;b=0} }
          function Set-Active($name,$phase,$total){ $a=$global:GHRDP_PROG.active; $a.name=$name; $a.phase=$phase; $a.bytesDone=0; $a.bytesTotal=[long]$total; $a.pct=0; $a.speedBps=0; $global:GHRDP_SP_A=@{t=[datetime]::Now.Ticks;b=0}; if($global:GHRDP_CUR){ $global:GHRDP_CUR.phase=$phase; $global:GHRDP_CUR.bytesDone=0; $global:GHRDP_CUR.bytesTotal=[long]$total; $global:GHRDP_CUR.pct=0 } }
          function Tick-Bytes($n){ $p=$global:GHRDP_PROG; $p.active.bytesDone += [long]$n; if($global:GHRDP_CUR){ $global:GHRDP_CUR.bytesDone += [long]$n; if($global:GHRDP_CUR.bytesTotal -gt 0){ $global:GHRDP_CUR.pct=[math]::Round(100.0*$global:GHRDP_CUR.bytesDone/$global:GHRDP_CUR.bytesTotal,1) } }; $now=[datetime]::Now.Ticks; if(($now-$global:GHRDP_LASTFLUSH) -gt 1500000){ Flush-Progress $false } }
          function Flush-Progress($force){ $now=[datetime]::Now.Ticks; if(-not $force -and ($now-$global:GHRDP_LASTFLUSH) -lt 1500000){ return }; $global:GHRDP_LASTFLUSH=$now; $p=$global:GHRDP_PROG; $p.ts=[datetime]::Now.ToString('o'); $comp=$global:GHRDP_DONE_BYTES + $(if($p.active.phase -eq 'upload'){ $p.active.bytesDone }else{0}); $dt=($now-$global:GHRDP_SP.t)/10000000.0; if($dt -gt 0.5){ $p.agg.speedBps=[math]::Max(0,[math]::Round(($comp-$global:GHRDP_SP.b)/$dt)); $global:GHRDP_SP=@{t=$now;b=$comp} }; $dta=($now-$global:GHRDP_SP_A.t)/10000000.0; if($dta -gt 0.5){ $p.active.speedBps=[math]::Max(0,[math]::Round(($p.active.bytesDone-$global:GHRDP_SP_A.b)/$dta)); $global:GHRDP_SP_A=@{t=$now;b=$p.active.bytesDone} }; if($p.active.bytesTotal -gt 0){ $p.active.pct=[math]::Round(100.0*$p.active.bytesDone/$p.active.bytesTotal,1) }else{ $p.active.pct=0 }; $p.agg.bytesDone=$comp; if($p.agg.bytesTotal -gt 0){ $p.agg.overallPct=[math]::Round(100.0*$comp/$p.agg.bytesTotal,1) }else{ $p.agg.overallPct=0 }; if($global:GHRDP_PROG_PATH){ try{ $tmp=$global:GHRDP_PROG_PATH+'.tmp'; [System.IO.File]::WriteAllText($tmp, ($p | ConvertTo-Json -Depth 7 -Compress), (New-Object System.Text.UTF8Encoding $false)); [System.IO.File]::Move($tmp,$global:GHRDP_PROG_PATH,$true) }catch{} } }
          function Encrypt-File($inPath,$outPath,$password){ $aes=[System.Security.Cryptography.Aes]::Create(); $aes.KeySize=256; $aes.Mode='CBC'; $aes.Padding='PKCS7'; $salt=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt); $aes.IV=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($aes.IV); $kdf=New-Object System.Security.Cryptography.Rfc2898DeriveBytes($password,$salt,100000,[System.Security.Cryptography.HashAlgorithmName]::SHA256); $aes.Key=$kdf.GetBytes(32); $outFs=[System.IO.File]::Create($outPath); $outFs.Write($salt,0,16); $outFs.Write($aes.IV,0,16); $cs=New-Object System.Security.Cryptography.CryptoStream($outFs,$aes.CreateEncryptor(),[System.Security.Cryptography.CryptoStreamMode]::Write); $inFs=[System.IO.File]::Open($inPath,[System.IO.FileMode]::Open,[System.IO.FileAccess]::Read,[System.IO.FileShare]::ReadWrite); $buf=New-Object byte[] 65536; $r=1; while($r -gt 0){ $r=$inFs.Read($buf,0,$buf.Length); if($r -gt 0){ $cs.Write($buf,0,$r); Tick-Bytes $r } }; $inFs.Close(); $cs.Close(); $outFs.Close(); $aes.Clear() }
          # === HARDENED GOFILE: curl primary (TLS/CF-robust) + cookie jar + server rotation + backoff; auto-retry handled by watcher loop ===
          function Upload-Gofile-Streamed($encPath,$dispName){
            $jar=Join-Path $env:TEMP ('gf_'+[guid]::NewGuid().ToString('N')+'.txt'); $ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) ghrdp/1'
            for($a=1;$a -le 6;$a++){
              $srv=$null
              try{ $raw=& curl.exe -sS -b $jar -c $jar -A $ua --tlsv1.2 --max-time 30 'https://api.gofile.io/getServer'; $gj=$raw|ConvertFrom-Json -EA Stop; $srv=$gj.data.server }catch{ "gf getServer a$a err $_"|Out-File $env:GHRDP_LOG -Append; $LASTEXITCODE=0; Start-Sleep (4*$a); continue }
              if(-not $srv){ Start-Sleep (4*$a); continue }
              $code=$null
              try{ $raw=& curl.exe -sS -b $jar -c $jar -A $ua --tlsv1.2 --connect-timeout 30 --max-time 1800 -X POST ("https://$srv.gofile.io/contents/uploadfile") -F ("file=@$encPath;filename=$dispName"); $uj=$raw|ConvertFrom-Json -EA Stop; if($uj.status -eq 'ok'){ $code=if($uj.data.downloadPage){$uj.data.downloadPage}elseif($uj.data.code){"https://gofile.io/d/$($uj.data.code)"}elseif($uj.data.id){"https://gofile.io/d/$($uj.data.id)"} }else{ "gf status a$a=$($uj.status)"|Out-File $env:GHRDP_LOG -Append } }catch{ "gf upload a$a err $_"|Out-File $env:GHRDP_LOG -Append; $LASTEXITCODE=0 }
              if($code){ Remove-Item $jar -Force -EA 0; return $code }
              Start-Sleep ([math]::Min(60,6*$a))
            }
            Remove-Item $jar -Force -EA 0; return $null
          }
          function Load-Index($cfg){ if(Test-Path $cfg.idxFile){ try{ return [System.Collections.ArrayList]@(Get-Content $cfg.idxFile -Raw|ConvertFrom-Json -EA Stop) }catch{} }; return (New-Object System.Collections.ArrayList) }
          function Save-Index($cfg,$idx){ [System.IO.File]::WriteAllText($cfg.idxFile, ($idx|ConvertTo-Json -Depth 6), (New-Object System.Text.UTF8Encoding $false)) }
          function Build-IndexText($cfg,$idx){ $L=New-Object System.Collections.ArrayList; [void]$L.Add('# GitHub RDP - mirrored files'); [void]$L.Add(''); [void]$L.Add('Files are AES-256 encrypted on gofile.'); [void]$L.Add('Decrypt password: '+$cfg.decPw); [void]$L.Add(''); if($idx.Count -eq 0){ [void]$L.Add('_(no files yet)_') }; $n=1; foreach($it in $idx){ $line="$n. **$($it.name)** [$($it.status)] ($($it.src)) $($it.time)"; if($it.gofile){ $line += '  ->  '+$it.gofile }; [void]$L.Add($line); $n++ }; return ($L -join "`r`n") }
          function Build-IndexNodes($text){ $nodes=New-Object System.Collections.ArrayList; foreach($ln in ($text -split "`r?`n")){ if($ln -match '^\s*$'){ continue }; if($ln -match '^#\s*(.*)$'){ [void]$nodes.Add(@{tag='h3';children=@($Matches[1])}) } else { [void]$nodes.Add(@{tag='p';children=@($ln)}) } }; return ($nodes|ConvertTo-Json -Depth 8 -Compress) }
          # === INDEX = RENTRY (permanent, known edit code) PRIMARY + TELEGRAPH FALLBACK; expose backend+url+edit everywhere ===
          function Push-Index($cfg,$text){
            $nodes=Build-IndexNodes $text; $slug=$cfg.rentrySlug; $code=$cfg.rentryEditCode; $url='https://rentry.co/'+$slug; $ok=$false
            if($slug -and $code){
              try{
                $jar=New-Object System.Net.CookieContainer; $g=[System.Net.HttpWebRequest]::Create('https://rentry.co/'); $g.CookieContainer=$jar; $g.UserAgent='ghrdp/1'; $g.Timeout=20000; try{ $gr=$g.GetResponse(); $gr.Close() }catch{}
                $csrf=''; try{ $csrf=$jar.GetCookies('https://rentry.co/')['csrftoken'].Value }catch{}
                foreach($ep in @('edit','new')){
                  try{ $body='edit_code='+[uri]::EscapeDataString($code)+'&text='+[uri]::EscapeDataString($text)+'&url='+[uri]::EscapeDataString($slug); $p=[System.Net.HttpWebRequest]::Create('https://rentry.co/api/'+$ep); $p.Method='POST'; $p.CookieContainer=$jar; $p.UserAgent='ghrdp/1'; $p.ContentType='application/x-www-form-urlencoded'; if($csrf){ $p.Headers.Add('X-CSRFToken',$csrf) }; $p.Referer=$url; $p.Timeout=25000; $b=[Text.Encoding]::UTF8.GetBytes($body); $rs=$p.GetRequestStream(); $rs.Write($b,0,$b.Length); $rs.Close(); $pr=$p.GetResponse(); $sr=New-Object IO.StreamReader($pr.GetResponseStream()); $raw=$sr.ReadToEnd(); $sr.Close(); $pr.Close(); $j=$raw|ConvertFrom-Json -EA 0; if($j -and ($j.status -eq 'success' -or $j.content)){ $ok=$true; break } }catch{ "rentry $ep err $_"|Out-File $cfg.logFile -Append; $LASTEXITCODE=0 }
                }
              }catch{ "rentry session err $_"|Out-File $cfg.logFile -Append; $LASTEXITCODE=0 }
            }
            if($ok){ $cfg.rentryUrl=$url; $cfg.indexBackend='rentry' }
            else{
              $title='GitHub RDP - mirrored files'
              if(-not $cfg.telegraphToken){ try{ $acc=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createAccount' -Body @{short_name='ghrdp';author_name='GitHub RDP Mirror'} -TimeoutSec 30; if($acc.ok){ $cfg.telegraphToken=$acc.result.access_token } }catch{ $LASTEXITCODE=0 } }
              if($cfg.telegraphToken){ try{ if(-not $cfg.telegraphPath){ $pg=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createPage' -Body @{access_token=$cfg.telegraphToken;title=$title;content=$nodes;return_content='false'} -TimeoutSec 30; if($pg.ok){ $cfg.telegraphPath=$pg.result.path; $cfg.rentryUrl=$pg.result.url; $cfg.indexBackend='telegraph' } }else{ $pg=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/editPage' -Body @{access_token=$cfg.telegraphToken;path=$cfg.telegraphPath;title=$title;content=$nodes;return_content='false'} -TimeoutSec 30; if($pg.ok){ $cfg.rentryUrl=$pg.result.url; $cfg.indexBackend='telegraph' } } }catch{ "telegraph err $_"|Out-File $cfg.logFile -Append; $LASTEXITCODE=0 } }
            }
            Save-Cfg $cfg; $global:GHRDP_PROG.rentryEdit=$code; $global:GHRDP_PROG.indexBackend=$cfg.indexBackend; return [bool]$cfg.rentryUrl
          }
          LIBEOF

      # ======================== EDITED STEP 2 ========================
      - name: Write mirror watcher script
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'WATCHEOF'
          param([string]$CfgPath)
          $ErrorActionPreference='Continue'
          $progEarly=Join-Path (Split-Path $CfgPath -Parent) 'ghrdp_progress.json'
          function Write-HB($msg){ try{ $h=@{ts=(Get-Date -f o);alive=$true;rentryEdit='';indexBackend='';agg=@{tracked=0;done=0;active=0;failed=0};files=@();log=@($msg);scan=@{}}; [System.IO.File]::WriteAllText($progEarly,($h|ConvertTo-Json -Depth 7 -Compress),(New-Object System.Text.UTF8Encoding $false)) }catch{} }
          $createdNew=$false; $mtx=New-Object System.Threading.Mutex $true,'Global\ghrdp-watcher-single',([ref]$createdNew); if(-not $createdNew){ Write-HB 'another watcher holds lock - exit'; exit 0 }
          $cfg=$null
          try{ $b=[System.IO.File]::ReadAllBytes($CfgPath); if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){ $b=$b[3..($b.Length-1)] }; $cfg=([System.Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF))|ConvertFrom-Json -EA Stop }catch{ Write-HB ('CFG FAIL '+$_.Exception.Message); throw }
          if(-not $cfg){ Write-HB 'CFG NULL'; throw 'cfg null' }
          $env:GHRDP_CFG=$CfgPath; $env:GHRDP_LOG=$cfg.logFile; . $cfg.libPath
          if(-not (Get-Command Init-Progress -EA 0)){ Write-HB ('LIB NOT LOADED '+$cfg.libPath); throw 'lib' }
          Init-Progress $cfg.progressPath; $script:RUNLOG=New-Object System.Collections.ArrayList; $script:SCAN=@{}
          function LErr($t,$e){ $m=("[{0}] {1}: {2}" -f (Get-Date -f 'HH:mm:ss'),$t,$e.Exception.Message); [void]$script:RUNLOG.Add($m); try{ Add-Content $cfg.logFile $m -EA 0 }catch{} }
          function ScanLine{ $parts=@($script:SCAN.GetEnumerator()|ForEach-Object{ $v=$_.Value; $s=$_.Key+':raw='+$v.rawTotal+'/elig='+$v.eligible+' @'+$v.path; if($v.error){ $s+=' ERR='+$v.error }; $s }); return ('[scan] '+($parts -join ' | ')) }
          # === ROOT DISCOVERY: COM shell: (honours OneDrive/Known-Folder redirection) + registry GUID + env + qBittorrent ===
          function Add-Root($list,$path,$tag,$rec,$min){ if(-not $path){ return $list }; $p=$path.TrimEnd('\'); if(-not $p){ return $list }; foreach($r in $list){ if($r.path.TrimEnd('\').ToLower() -eq $p.ToLower()){ return $list } }; try{ New-Item -ItemType Directory -Path $p -Force -EA 0|Out-Null }catch{}; $list += @{path=$p;tag=$tag;rec=[bool]$rec;min=[long]$min}; return $list }
          function Resolve-COM($names){ foreach($n in $names){ try{ $sh=New-Object -ComObject Shell.Application; $ns=$sh.NameSpace($n); if($ns -and $ns.Self -and $ns.Self.Path){ return $ns.Self.Path } }catch{} }; return $null }
          function Build-Roots{
            $R=@(); foreach($r in $cfg.roots){ $R=Add-Root $R $r.path $r.tag $r.rec $r.min }
            $map=@{ Downloads=@('shell:Downloads'); Desktop=@('shell:Desktop'); Documents=@('shell:Personal','shell:Documents') }
            $guids=@{ Downloads=@('{374DE290-123F-45C5-91F6-3D0D0A7C3D2D}','{7D83EE9B-2244-4E70-B1F5-5393042AF1E4}'); Desktop=@('{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}'); Documents=@('{FDD39AD0-238F-46AF-ADB4-6C85480369C7}','{24D89E24-2F19-4534-9DDE-6A6671FBB8FE}') }
            $keys=@('HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders','HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders')
            foreach($tag in 'Downloads','Desktop','Documents'){
              $p=Resolve-COM $map[$tag]
              if(-not $p){ foreach($k in $keys){ if(Test-Path $k){ $pr=Get-ItemProperty -Path $k -EA 0; foreach($gn in $guids[$tag]){ $v=$pr.$gn; if($v -and $v -is [string]){ $p=[Environment]::ExpandEnvironmentVariables($v); if($p -and (Test-Path -LiteralPath $p -PathType Container)){ break } else { $p=$null } } }; if($p){ break } } } }
              if(-not $p){ $p=Join-Path $env:USERPROFILE $tag }
              $R=Add-Root $R $p $tag $false 0
              foreach($base in @((Join-Path $env:USERPROFILE 'OneDrive'),$env:OneDrive,$env:OneDriveConsumer,$env:OneDriveCommercial)){ if($base){ $R=Add-Root $R (Join-Path $base $tag) $tag $false 0 } }
            }
            $qini=Join-Path $env:APPDATA 'qBittorrent\qBittorrent.ini'
            if(Test-Path $qini){ $q=Get-Content $qini -Raw -EA 0; if($q){ if($q -match '(?m)^\s*SavePath\s*=\s*(.+)$'){ $R=Add-Root $R $Matches[1].Trim() 'qB-Save' $true 0 }; if($q -match '(?m)^\s*TempPath\s*=\s*(.+)$'){ $R=Add-Root $R $Matches[1].Trim() 'qB-Temp' $true 102400 } } }
            $R=Add-Root $R (Join-Path $env:LOCALAPPDATA 'Temp') 'Temp' $true 102400
            return $R
          }
          $roots=Build-Roots
          Write-HB ('watcher roots('+$roots.Count+')='+(($roots|ForEach-Object{ $_.tag+'='+(Test-Path -LiteralPath $_.path -PathType Container) }) -join ','))
          $junk=@('.tmp','.crdownload','.partial','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak','.!qb')
          $done=@{}; if(Test-Path $cfg.doneFile){ Get-Content $cfg.doneFile|ForEach-Object{ $done[$_]=$true } }
          $idx=Load-Index $cfg; try{ Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null }catch{ LErr 'init-idx' $_ }
          function DoUpload($fi,$tag){
            if($done.ContainsKey($fi.FullName)){ return }
            $len=$fi.Length; $safe=$fi.Name -replace '\|','_'; $disp=($safe -replace '[^\x20-\x7E]','_')
            $ex=$idx|Where-Object{ $_.name -eq $safe -and $_.src -eq $tag }|Select-Object -First 1
            if(-not $ex){ $ex=@{name=$safe;src=$tag;status='queued';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss');pct=0;phase='queued';bytesDone=0;bytesTotal=$len;attempts=0;nextTry=0}; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len; Save-Index $cfg $idx }
            if($ex.nextTry -and ([datetime]::Now -lt [datetime]$ex.nextTry)){ return }   # per-file cooldown (anti-throttle)
            $ex.status='uploading'; $ex.time=(Get-Date -f 'HH:mm:ss'); $ex.bytesTotal=$len; $ex.phase='encrypt'; $global:GHRDP_CUR=$ex
            $enc=Join-Path $cfg.tmpDir ('ge_'+[guid]::NewGuid().ToString('N')+'.enc'); $gofile=$null
            Set-Active $disp 'encrypt' $len; try{ Encrypt-File $fi.FullName $enc $cfg.decPw }catch{ LErr ('enc '+$fi.Name) $_ }
            $ex.phase='upload'; Set-Active $disp 'upload' $len; try{ $gofile=Upload-Gofile-Streamed $enc $disp }catch{ LErr ('up '+$fi.Name) $_ }
            Remove-Item $enc -Force -EA 0; $global:GHRDP_CUR=$null
            if($gofile){ $ex.payload=B64U ($gofile+'|'+$cfg.decPw+'|'+$safe); $ex.gofile=$gofile; $ex.status='ok'; $ex.pct=100; $ex.phase='done'; $ex.time=(Get-Date -f 'HH:mm:ss'); $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Save-Index $cfg $idx; try{ Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null }catch{ LErr 'push' $_ }; "[$(Get-Date -f o)] OK $tag $($fi.Name) ($len bytes)"|Out-File $cfg.logFile -Append }
            else { $ex.status='retry'; $ex.phase='wait'; $ex.attempts=([int]$ex.attempts)+1; $ex.nextTry=([datetime]::Now.AddSeconds([math]::Min(120,10*$ex.attempts))).ToString('o'); Save-Index $cfg $idx; "[$(Get-Date -f o)] RETRY $tag $($fi.Name) (attempt $($ex.attempts))"|Out-File $cfg.logFile -Append }
            Set-Active '' 'idle' 0
          }
          function Scan($r){
            $elig=0; $rawAll=@(); $rerr=''
            if(-not (Test-Path -LiteralPath $r.path -PathType Container)){ $script:SCAN[$r.tag]=@{rawTotal=0;eligible=0;path=$r.path;error='path-missing';rawSamples=@()}; return }
            try{ $items=if($r.rec){ Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0 }else{ Get-ChildItem -LiteralPath $r.path -File -EA 0 } }catch{ $script:SCAN[$r.tag]=@{rawTotal=-1;eligible=0;path=$r.path;error=$_.Exception.Message;rawSamples=@()}; return }
            $rawAll=@($items); $rawNames=@($rawAll|Select-Object -First 4|ForEach-Object{ $_.Name })
            foreach($fi in $rawAll){ if($done.ContainsKey($fi.FullName)){ continue }; if($junk -contains $fi.Extension.ToLower()){ continue }; if($fi.Length -lt $r.min){ continue }; if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){ continue }; $elig++; DoUpload $fi $tag_or($r) }
            $script:SCAN[$r.tag]=@{rawTotal=$rawAll.Count;eligible=$elig;path=$r.path;error=$rerr;rawSamples=$rawNames}
          }
          function tag_or($r){ return $r.tag }
          function SweepAll($r){ if(-not (Test-Path -LiteralPath $r.path -PathType Container)){ return }; $items=if($r.rec){ Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0|Sort-Object Length -Descending }else{ Get-ChildItem -LiteralPath $r.path -File -EA 0|Sort-Object Length -Descending }; foreach($fi in $items){ if($done.ContainsKey($fi.FullName)){ continue }; if($junk -contains $fi.Extension.ToLower()){ continue }; if($fi.Length -lt $r.min){ continue }; if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){ continue }; DoUpload $fi $r.tag } }
          function EmergencyPass{ "[$(Get-Date -f o)] EMERGENCY start"|Out-File $cfg.logFile -Append; foreach($p in @('qbittorrent','qbittorrent-nox')){ Get-Process -Name $p -EA 0|Stop-Process -Force -EA 0 }; Start-Sleep 4; for($rd=0;$rd -lt 3;$rd++){ foreach($r in $roots){ Scan $r }; Start-Sleep 4 }; foreach($r in $roots){ SweepAll $r }; Save-Index $cfg $idx; try{ Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null }catch{}; Remove-Item $cfg.emergencyFlag -Force -EA 0; "[$(Get-Date -f o)] EMERGENCY end"|Out-File $cfg.logFile -Append }
          function SyncProg{
            try{
              $p=$global:GHRDP_PROG; $d=0;$u=0;$f=0; foreach($it in $idx){ if($it.status -eq 'ok'){$d++}elseif($it.status -eq 'limit'){$f++}else{$u++} }
              $p.agg.done=$d; $p.agg.failed=$f; $p.agg.tracked=$idx.Count; $p.agg.active=if($p.active.phase -ne 'idle'){1}else{0}; $p.agg.bytesTotal=$global:GHRDP_TOTAL_BYTES
              $p.files=@( foreach($it in $idx){ @{name=$it.name;src=$it.src;status=$it.status;pct=$it.pct;phase=$it.phase;bytesDone=$it.bytesDone;bytesTotal=$it.bytesTotal} } )
              $p.scan=@{}; foreach($k in @($script:SCAN.Keys)){ $p.scan[$k]=$script:SCAN[$k] }
              $marker='[INDEX] backend='+$cfg.indexBackend+' url='+$cfg.rentryUrl+' edit='+$cfg.rentryEditCode
              $errs=@($script:RUNLOG|Select-Object -Last 5); $filetail=@(); if(Test-Path $cfg.logFile){ $g=Get-Content $cfg.logFile -Tail 10 -EA 0; if($g){ $filetail=@($g) } }
              $p.log=@($marker)+@($errs)+@(ScanLine)+$filetail; Flush-Progress $true
            }catch{ LErr 'sync' $_ }
          }
          while($true){
            if(Test-Path $cfg.emergencyFlag){ try{ EmergencyPass }catch{ LErr 'em' $_ } }
            else { $roots=Build-Roots; foreach($r in $roots){ try{ Scan $r }catch{ LErr ('scan '+$r.tag) $_ } }; if(Test-Path $cfg.flushFlag){ try{ "[$(Get-Date -f o)] FLUSH"|Out-File $cfg.logFile -Append; for($p=0;$p -lt 8;$p++){ foreach($r in $roots){Scan $r}; if(-not ($idx|Where-Object{ $_.status -ne 'ok' -and $_.status -ne 'retry' })){break}; Start-Sleep 8 }; Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null; Remove-Item $cfg.flushFlag -Force -EA 0 }catch{ LErr 'flush' $_ } } }
            SyncProg
            try{ $global:GHRDP_PROG.ts=(Get-Date -f o); $global:GHRDP_PROG.alive=$true; [System.IO.File]::WriteAllText($cfg.progressPath,($global:GHRDP_PROG|ConvertTo-Json -Depth 7 -Compress),(New-Object System.Text.UTF8Encoding $false)) }catch{ LErr 'hb' $_ }
            Start-Sleep 3
          }
          WATCHEOF

      - name: Write Mission Control launcher (server observe + watcher fallback)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-launcher.ps1" <<'LAUNCHEOF'
          param([string]$CfgPath, [int]$Port = 7331)
          $sd = Split-Path $CfgPath -Parent; $progressPath = Join-Path $sd 'ghrdp_progress.json'; $watcherScript = Join-Path $sd 'ghrdp-watcher.ps1'
          $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          function Line($c, $m) { Write-Host ("[{0}] {1}" -f (Get-Date -f 'HH:mm:ss'), $m) -ForegroundColor $c }
          if (-not (Test-Path $CfgPath)) { Line Red "Config missing: $CfgPath"; Start-Sleep -Seconds 30; exit 0 }
          $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json
          Line Cyan "Mission Control (OBSERVE mode)."; Line White ("IP={0}  USER={1}  MIRROR={2}" -f $cfg.rdpIp, $cfg.rdpUser, $cfg.mirror)
          try { Start-Process ("http://127.0.0.1:{0}/" -f $Port) | Out-Null; Line Green "[browser] opened dashboard tab inside RDP" } catch {}
          $wrunning = Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }
          if (-not $wrunning -and (Test-Path $watcherScript)) { try { $wArgs = "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$CfgPath`""; Start-Process -FilePath $ps -ArgumentList $wArgs -WindowStyle Hidden | Out-Null; Line Green "[watcher] started in RDP session fallback (mutex prevents doubles)" } catch { Line Red ("[watcher] start err " + $_.Exception.Message) } } else { Line Cyan "[watcher] already running or not required" }
          while ($true) { $listen = [bool](Get-NetTCPConnection -LocalPort $Port -State Listen -ErrorAction SilentlyContinue); $done = 0; $act = 0; $fail = 0; $trk = 0; $pct = 0; if (Test-Path $progressPath) { try { $p = Get-Content $progressPath -Raw | ConvertFrom-Json -ErrorAction SilentlyContinue; if ($p -and $p.agg) { $done = $p.agg.done; $act = $p.agg.active; $fail = $p.agg.failed; $trk = $p.agg.tracked; $pct = $p.agg.overallPct } } catch {} }; Line $(if ($listen) { 'Green' } else { 'Red' }) ("listen={0} | done={1} active={2} fail={3} tracked={4} overall={5}%" -f $listen, $done, $act, $fail, $trk, $pct); Start-Sleep -Seconds 2 }
          LAUNCHEOF

      - name: Write summary helper
        env:
