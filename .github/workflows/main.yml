          .brand{font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--acc)}
          #q{flex:1;min-width:160px;max-width:520px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#0d1420;color:var(--ink);font-size:14px;outline:none}
          #q:focus{border-color:var(--acc)}
