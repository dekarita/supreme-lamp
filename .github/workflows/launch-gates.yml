          }
          Write-Host $outText
          $lines = @(($outText -split "`r?`n") | Where-Object { $_.Trim() -ne '' })
          $decisive = @($lines | Where-Object { $_ -match '::error|FAIL|SKIP ' } | Select-Object -Last 1)
          if (@($decisive).Count -eq 0) { $decisive = @($lines | Select-Object -Last 1) }
          $desc = (([string](@($decisive) -join ' | ')) -replace '::error[^:]*::', '').Trim()
          if ($desc.Length -gt 130) { $desc = $desc.Substring(0, 130) }
          if ($env:GH_TOKEN) {
