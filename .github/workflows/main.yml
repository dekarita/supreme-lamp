      - name: Publish redesigned search UI + offline service worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = $env:GITHUB_REPOSITORY
          $hdr = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          function Put-GhFile2 { param([string]$Path,[string]$Text)
            $api = "https://api.github.com/repos/$repo/contents/$Path"; $sha = $null
            try { $g = Invoke-RestMethod -Uri $api -Headers $hdr -ErrorAction Stop; $sha = $g.sha } catch { }
            $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($Text))
            $body = @{ message = "redesign $Path"; content = $b64 }
            if ($sha) { $body.sha = $sha }
            try { Invoke-RestMethod -Uri $api -Headers $hdr -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null; Write-Host "[ui] pushed $Path" } catch { Write-Host ("[ui] push failed $Path : " + $_.Exception.Message) }
          }
