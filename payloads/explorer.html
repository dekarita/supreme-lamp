<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHRDP Explorer — Windows 11</title>
<style>
:root{
  --mica:rgba(32,32,32,.72);
  --acrylic:rgba(43,43,43,.72);
  --stroke:rgba(255,255,255,.08);
  --stroke-hi:rgba(255,255,255,.16);
  --text:#ffffff; --text2:#a6a6a6;
  --accent:#4cc2ff; --accent-fill:rgba(0,103,192,.25);
  --hover:rgba(255,255,255,.06); --press:rgba(255,255,255,.04);
  --r8:8px;
  --r4:4px;
  --font:'Segoe UI Variable Text','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--text); overflow:hidden;
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(76,194,255,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(0,103,192,.10), transparent 60%),
    #202020;
}
#app{display:flex;flex-direction:column;height:100%}
.navbar{display:flex;align-items:center;gap:10px;padding:6px 10px;
  background:var(--acrylic);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--stroke)}
.navbtns{display:flex;gap:2px}
.cbtn{font-family:var(--font);font-size:13px;color:var(--text);background:transparent;border:0;border-radius:var(--r4);
  padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s ease}
.cbtn:hover{background:var(--hover)} .cbtn:active{background:var(--press)}
.cbtn:disabled{opacity:.4;cursor:default} .cbtn:disabled:hover{background:transparent}
.cbtn.danger:hover{background:rgba(196,43,43,.25)}
.cbtn.on{background:var(--accent-fill);box-shadow:inset 0 0 0 1px rgba(76,194,255,.4)}
.sep{width:1px;height:20px;background:var(--stroke);margin:0 4px}
.spacer{flex:1}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:120px;overflow:hidden;white-space:nowrap;font-size:13px}
.crumbs .c{padding:4px 8px;border-radius:var(--r4);cursor:pointer;color:var(--text)}
.crumbs .c:hover{background:var(--hover)}
.crumbs .c:last-child{font-weight:600}
.crumbs .chev{color:var(--text2);font-size:11px}
.search{font-family:var(--font);font-size:13px;color:var(--text);background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);border-bottom:2px solid var(--stroke-hi);border-radius:var(--r4);
  padding:6px 10px;width:220px;outline:none;transition:border-color .12s ease,background .12s ease}
.search:focus{border-bottom-color:var(--accent);background:rgba(255,255,255,.09)}
.cmdbar{display:flex;align-items:center;gap:2px;padding:4px 10px;
  background:var(--acrylic);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--stroke)}
.body{flex:1;display:flex;min-height:0;position:relative}
.pane{background:var(--mica);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);min-width:0}
.tree{width:260px;flex:0 0 auto;overflow:auto;padding:8px 6px;border-right:1px solid var(--stroke)}
.ptitle{font-size:12px;color:var(--text2);padding:6px 10px 8px;letter-spacing:.02em}
.tnode{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--r4);cursor:pointer;font-size:13px;white-space:nowrap;transition:background .12s ease}
.tnode:hover{background:var(--hover)}
.tnode.cur{background:var(--accent-fill);box-shadow:inset 2px 0 0 var(--accent)}
.tnode .tw{width:12px;color:var(--text2);font-size:10px;flex:0 0 auto}
.main{flex:1;overflow:auto;padding:8px 10px}
.divider{flex:0 0 4px;cursor:col-resize;background:transparent;position:relative}
.divider::after{content:'';position:absolute;inset:0 1px;background:transparent;transition:background .12s ease}
.divider:hover::after,.divider.drag::after{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:rgba(43,43,43,.9);backdrop-filter:blur(20px);color:var(--text2);
  font-weight:600;font-size:12px;text-align:left;padding:6px 10px;border-bottom:1px solid var(--stroke);z-index:2}
tbody tr{border-radius:var(--r4);cursor:default;transition:background .12s ease}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--accent-fill);box-shadow:inset 2px 0 0 var(--accent)}
tbody td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gis,140px),1fr));gap:8px}
.gcard{border:1px solid transparent;border-radius:var(--r4);padding:10px 8px;text-align:center;cursor:default;transition:background .12s ease,border-color .12s ease}
.gcard:hover{background:var(--hover)}
.gcard.sel{background:var(--accent-fill);border-color:rgba(76,194,255,.4)}
.gcard .ic{font-size:calc(var(--gis,140px)*.34);line-height:1.15}
.gcard .nm{font-size:12px;margin-top:6px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview{width:360px;flex:0 0 auto;overflow:auto;border-left:1px solid var(--stroke);display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--stroke);font-size:13px}
.phead span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pbody img{max-width:100%;border-radius:var(--r8);border:1px solid var(--stroke)}
.pbody video,.pbody audio{max-width:100%;border-radius:var(--r8)}
.pbody pre{width:100%;max-height:60vh;overflow:auto;background:rgba(0,0,0,.35);border:1px solid var(--stroke);border-radius:var(--r8);
  padding:10px;font:12px/1.5 Consolas,'Cascadia Mono',monospace;color:#d6d6d6;white-space:pre-wrap;word-break:break-word}
.pfall{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text2);font-size:12px;text-align:center}
.pfall .big{font-size:44px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--stroke-hi);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.statusbar{display:flex;align-items:center;gap:14px;padding:5px 12px;font-size:12px;color:var(--text2);
  background:var(--acrylic);backdrop-filter:blur(20px);border-top:1px solid var(--stroke)}
.statusbar input[type=range]{accent-color:var(--accent);width:120px}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--acrylic);backdrop-filter:blur(20px);
  border:1px solid var(--stroke-hi);border-radius:var(--r8);padding:8px 16px;font-size:13px;color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .18s ease;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:768px){ .tree{position:absolute;z-index:5;height:100%;box-shadow:8px 0 24px rgba(0,0,0,.4)} .preview{position:absolute;right:0;z-index:6;height:100%} }
</style>
</head>
<body>
<div id="app">
  <div class="navbar">
    <div class="navbtns">
      <button class="cbtn" id="bBack" title="Back">&#8592;</button>
      <button class="cbtn" id="bFwd" title="Forward">&#8594;</button>
      <button class="cbtn" id="bUp" title="Up">&#8593;</button>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <input class="search" id="search" placeholder="Search current folder" autocomplete="off">
  </div>
  <div class="cmdbar" role="toolbar" aria-label="Commands">
    <button class="cbtn" id="bNew">&#xFF0B; New</button>
    <span class="sep"></span>
    <button class="cbtn" id="bCopy" disabled>&#x29C9; Copy</button>
    <button class="cbtn" id="bMove" disabled>&#x21C4; Move</button>
    <button class="cbtn" id="bRename" disabled>&#x270E; Rename</button>
    <button class="cbtn danger" id="bDelete" disabled>&#x1F5D1; Delete</button>
    <span class="spacer"></span>
    <button class="cbtn on" id="bViewD" title="Details">&#x2630;</button>
    <button class="cbtn" id="bViewG" title="Grid">&#x25A6;</button>
    <span class="sep"></span>
    <button class="cbtn" id="bPrev" title="Toggle preview pane">Preview</button>
  </div>
  <div class="body" id="bodySplit">
    <aside class="pane tree" id="treePane"><div class="ptitle">Explorer</div><div id="tree"></div></aside>
    <div class="divider" id="divTree" title="Drag to resize"></div>
    <main class="pane main" id="mainPane"><div id="content"></div></main>
    <div class="divider" id="divPrev" title="Drag to resize" style="display:none"></div>
    <aside class="pane preview" id="prevPane" style="display:none">
      <div class="phead"><button class="cbtn" id="pvPrev" title="Previous (←)">&#8592;</button><button class="cbtn" id="pvNext" title="Next (→)">&#8594;</button><span id="pvName"></span><button class="cbtn" id="pvClose" title="Close">&#215;</button></div>
      <div class="pbody" id="pvBody"></div>
    </aside>
  </div>
  <footer class="statusbar">
    <span id="stCount"></span><span id="stSel"></span><span class="spacer"></span>
    <span id="stView">Details</span><input type="range" id="zoom" min="96" max="220" value="140" title="Icon size">
  </footer>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
var root={name:'This PC',type:'folder',children:[],opath:''};
var cur=root, hist=[root], hi=0, sel=[], anchor=null, view='details';
var expanded={}; var nodeMap={};
var OV={ren:{},hid:[],mov:{}};
try{ OV=JSON.parse(localStorage.getItem('ghx-overrides')||'{}'); }catch(e){}
var PROXY_BASE=(window.GHRDP_WORKER_URL||localStorage.getItem('ghx-proxy')||'').replace(/\/$/,'');
function saveOV(){ localStorage.setItem('ghx-overrides', JSON.stringify(OV)); }
function $(id){return document.getElementById(id);}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtB(n){n=+n||0;if(n<1024)return n+' B';var u=['KB','MB','GB','TB'];var i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return n.toFixed(1)+' '+u[i];}
function childFolder(parent,name){
  for(var i=0;i<parent.children.length;i++){var c=parent.children[i];if(c.type==='folder'&&c.name===name)return c;}
  var f={name:name,type:'folder',children:[],parent:parent,opath:parent.opath+'/'+name};
  parent.children.push(f);return f;
}
function fileNode(f,parent){return {name:f.n,type:'file',size:f.s,link:f.l,enc:f.e,date:f.d||f.t||'',parent:parent,opath:parent.opath+'/'+f.n};}
function sessionNode(s){
  var n={name:(s.id||'session'),type:'folder',children:[],parent:root,opath:'/'+(s.id||'session'),session:true};
  (s.files||[]).forEach(function(f){
    var parts=String(f.f||'').split(/[\\/]/).filter(Boolean), p=n;
    parts.forEach(function(seg){ p=childFolder(p,seg); });
    p.children.push(fileNode(f,p));
  });
  return n;
}
function collect(node,list){ nodeMap[node.opath]=node; (node.children||[]).forEach(function(c){collect(c,list);}); list.push(node); return list; }
function isAncestor(a,b){ var p=b.parent; while(p){ if(p===a)return true; p=p.parent; } return false; }
function applyOverrides(){
  var list=collect(root,[]);
  var hid={}; (OV.hid||[]).forEach(function(p){hid[p]=1;});
  (function filt(n){ n.children=n.children.filter(function(c){return !hid[c.opath];}); n.children.forEach(filt); })(root);
  list.forEach(function(n){ if(OV.ren&&OV.ren[n.opath]) n.name=OV.ren[n.opath]; });
  Object.keys(OV.mov||{}).forEach(function(op){
    var n=nodeMap[op], t=nodeMap[OV.mov[op]];
    if(n&&t&&t.type==='folder'&&n!==t&&!isAncestor(n,t)&&n.parent!==t){
      n.parent.children.splice(n.parent.children.indexOf(n),1);
      n.parent=t; t.children.push(n);
    }
  });
}
function load(){
  Promise.all([
    fetch('./tree.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch('./archive.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch('./data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(rs){
    root.children=[];
    var live=(rs[0]&&rs[0].files)|| (rs[2]&&rs[2].files)||[];
    if(live.length) root.children.push(sessionNode({id:'Current session',files:live}));
    if(rs[1]&&rs[1].sessions) rs[1].sessions.slice().reverse().forEach(function(s){ root.children.push(sessionNode(s)); });
    if(!root.children.length) root.children.push({name:'(empty)',type:'folder',children:[],parent:root,opath:'/(empty)'});
    nodeMap={}; applyOverrides();
    expanded[root.opath]=1; if(root.children[0]) expanded[root.children[0].opath]=1;
    renderAll();
  });
}
function navigate(n){ if(!n||n===cur)return; hist=hist.slice(0,hi+1); hist.push(n); hi++; cur=n; sel=[]; anchor=null; expanded[n.opath]=1; renderAll(); }
$('bBack').onclick=function(){ if(hi>0){hi--;cur=hist[hi];sel=[];renderAll();} };
$('bFwd').onclick=function(){ if(hi<hist.length-1){hi++;cur=hist[hi];sel=[];renderAll();} };
$('bUp').onclick=function(){ if(cur.parent) navigate(cur.parent); };
function renderCrumbs(){
  var chain=[],p=cur; while(p){chain.unshift(p);p=p.parent;}
  var el=$('crumbs'); el.innerHTML='';
  chain.forEach(function(n,i){
    if(i){var ch=document.createElement('span');ch.className='chev';ch.textContent='›';el.appendChild(ch);}
    var c=document.createElement('span'); c.className='c'; c.textContent=n.name; c.title='Open '+n.name;
    c.onclick=function(){ navigate(n); };
    el.appendChild(c);
  });
}
function renderTree(){
  var el=$('tree'); el.innerHTML='';
  (function walk(node,depth){
    var d=document.createElement('div'); d.className='tnode'+(node===cur?' cur':''); d.style.paddingLeft=(8+depth*12)+'px';
    var tw=document.createElement('span'); tw.className='tw';
    var kids=(node.children||[]).filter(function(c){return c.type==='folder';});
    tw.textContent = kids.length ? (expanded[node.opath]?'▾':'▸') : '';
    d.appendChild(tw);
    var ic=document.createElement('span'); ic.textContent = node.type==='folder' ? (node.session?'🖥':'') : '📄';
    d.appendChild(ic);
    var nm=document.createElement('span'); nm.textContent=node.name; nm.style.overflow='hidden'; nm.style.textOverflow='ellipsis';
    d.appendChild(nm);
    d.onclick=function(){ if(kids.length) expanded[node.opath]=!expanded[node.opath]; navigate(node); };
    el.appendChild(d);
    if(kids.length&&expanded[node.opath]) kids.forEach(function(k){walk(k,depth+1);});
  })(root,0);
}
function sortedChildren(){
  var q=($('search').value||'').toLowerCase();
  var cs=(cur.children||[]).filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0;});
  return cs.sort(function(a,b){ if(a.type!==b.type)return a.type==='folder'?-1:1; return a.name.localeCompare(b.name); });
}
function renderContent(){
  var cs=sortedChildren(); window.__curItems=cs; var el=$('content');
  $('stCount').textContent=cs.length+' item'+(cs.length===1?'':'s');
  $('stSel').textContent=sel.length? (sel.length+' selected'):'';
  $('stView').textContent = view==='details'?'Details':'Grid';
  if(view==='grid'){
    el.className='grid'; el.innerHTML='';
    cs.forEach(function(c,i){
      var d=document.createElement('div'); d.className='gcard'+(sel.indexOf(c)>=0?' sel':''); d.dataset.i=i;
      d.innerHTML='<div class="ic">'+(c.type==='folder'?'📁':iconOf(c.name))+'</div><div class="nm">'+esc(c.name)+'</div>';
      wire(d,c,i); el.appendChild(d);
    });
  } else {
    el.className='';
    var t=document.createElement('table');
    t.innerHTML='<thead><tr><th>Name</th><th>Date modified</th><th>Type</th><th>Size</th></tr></thead>';
    var tb=document.createElement('tbody');
    cs.forEach(function(c,i){
      var tr=document.createElement('tr'); if(sel.indexOf(c)>=0)tr.className='sel'; tr.dataset.i=i;
      tr.innerHTML='<td>'+(c.type==='folder'?'📁 ':iconOf(c.name)+' ')+esc(c.name)+(c.enc==='true'?' 🔒':'')+'</td>'
        +'<td>'+esc(c.date||'')+'</td><td>'+esc(c.type==='folder'?'File folder':typeName(c.name))+'</td>'
        +'<td>'+(c.type==='folder'?'':fmtB(c.size))+'</td>';
      wire(tr,c,i); tb.appendChild(tr);
    });
    t.appendChild(tb); el.innerHTML=''; el.appendChild(t);
  }
}
function wire(el,c,i){
  el.onclick=function(e){ select(c,i,e); };
  el.ondblclick=function(){ if(c.type==='folder') navigate(c); else showPreview(c); };
}
function select(c,i,e){
  if(e&&e.ctrlKey){ var x=sel.indexOf(c); if(x>=0)sel.splice(x,1); else sel.push(c); anchor=i; }
  else if(e&&e.shiftKey&&anchor!=null){ var a=Math.min(anchor,i),b=Math.max(anchor,i); var cs=sortedChildren(); sel=cs.slice(a,b+1); }
  else { sel=[c]; anchor=i; if(c.type==='file') showPreview(c); }
  syncSel();
}
function syncSel(){
  document.querySelectorAll('#content .sel').forEach(function(el){el.classList.remove('sel');});
  var cs=sortedChildren();
  sel.forEach(function(n){ var i=cs.indexOf(n); if(i>=0){ var el=document.querySelector('#content [data-i="'+i+'"]'); if(el)el.classList.add('sel'); } });
  $('stSel').textContent=sel.length?(sel.length+' selected'):'';
  var has=sel.length>0;
  ['bCopy','bMove','bRename','bDelete'].forEach(function(id){ $(id).disabled=!has; });
}
function renderAll(){ renderCrumbs(); renderTree(); renderContent(); syncSel(); }
$('search').oninput=function(){ renderContent(); syncSel(); };
$('bViewD').onclick=function(){view='details';$('bViewD').classList.add('on');$('bViewG').classList.remove('on');renderContent();syncSel();};
$('bViewG').onclick=function(){view='grid';$('bViewG').classList.add('on');$('bViewD').classList.remove('on');renderContent();syncSel();};
$('zoom').oninput=function(){ document.documentElement.style.setProperty('--gis', this.value+'px'); };
$('bCopy').onclick=function(){
  var links=[]; sel.forEach(function(n){ if(n.type==='file'&&n.link)links.push(n.link); else (function walk(x){(x.children||[]).forEach(function(c){ if(c.type==='file'&&c.link)links.push(c.link); else walk(c); });})(n); });
  if(!links.length){toast('Nothing to copy');return;}
  (navigator.clipboard?navigator.clipboard.writeText(links.join('\n')):Promise.reject()).then(function(){toast(links.length+' link(s) copied');},function(){prompt('Copy:',links.join('\n'));});
};
$('bMove').onclick=function(){
  if(!sel.length)return;
  var moved=0;
  sel.slice().forEach(function(n){
    if(n===cur||isAncestor(n,cur))return;
    n.parent.children.splice(n.parent.children.indexOf(n),1);
    n.parent=cur; cur.children.push(n);
    OV.mov[n.opath]=cur.opath; moved++;
  });
  saveOV(); sel=[]; renderAll(); toast(moved+' item(s) moved here');
};
$('bRename').onclick=function(){
  if(sel.length!==1){toast('Select exactly one item');return;}
  var n=sel[0], nn=prompt('Rename:',n.name);
  if(nn&&nn.trim()&&nn.trim()!==n.name){ n.name=nn.trim(); OV.ren[n.opath]=n.name; saveOV(); renderAll(); toast('Renamed'); }
};
$('bDelete').onclick=function(){
  if(!sel.length)return;
  if(!confirm('Delete '+sel.length+' item(s) from view? (persisted locally)'))return;
  sel.slice().forEach(function(n){ n.parent.children.splice(n.parent.children.indexOf(n),1); OV.hid.push(n.opath); });
  saveOV(); sel=[]; renderAll(); toast('Deleted from view');
};
$('bNew').onclick=function(){
  var n=prompt('New folder name:','New folder'); if(!n)return;
  var f={name:n,type:'folder',children:[],parent:cur,opath:cur.opath+'/'+n+'#'+Date.now()};
  cur.children.push(f); renderAll(); toast('Folder created (session-only)');
};
function dragSplit(div, apply){
  div.addEventListener('pointerdown', function(e){
    div.setPointerCapture(e.pointerId); div.classList.add('drag');
    var move=function(ev){ apply(ev); };
    var up=function(ev){ div.releasePointerCapture(ev.pointerId); div.classList.remove('drag'); div.removeEventListener('pointermove',move); div.removeEventListener('pointerup',up); };
    div.addEventListener('pointermove',move); div.addEventListener('pointerup',up);
  });
}
dragSplit($('divTree'), function(e){
  var r=$('bodySplit').getBoundingClientRect();
  var w=Math.min(480,Math.max(180,e.clientX-r.left));
  $('treePane').style.width=w+'px'; localStorage.setItem('ghx-treew',w);
});
dragSplit($('divPrev'), function(e){
  var r=$('bodySplit').getBoundingClientRect();
  var w=Math.min(560,Math.max(260,r.right-e.clientX));
  $('prevPane').style.width=w+'px'; localStorage.setItem('ghx-prevw',w);
});
(function(){ var w=localStorage.getItem('ghx-treew'); if(w)$('treePane').style.width=w+'px';
  var pw=localStorage.getItem('ghx-prevw'); if(pw)$('prevPane').style.width=pw+'px'; })();
var IMG={jpg:1,jpeg:1,png:1,gif:1,webp:1,bmp:1,svg:1}, AUD={mp3:1,wav:1,ogg:1,flac:1,m4a:1,aac:1,opus:1},
    VID={mp4:1,webm:1,mov:1,m4v:1}, TXT={txt:1,md:1,nfo:1,log:1,cue:1,srt:1,json:1,xml:1,csv:1};
function extOf(n){var m=String(n).match(/\.([^.]+)$/);return m?m[1].toLowerCase():'';}
function iconOf(n){var e=extOf(n);if(IMG[e])return '🖼';if(AUD[e])return '🎵';if(VID[e])return '🎬';if(TXT[e])return '📄';if(/zip|rar|7z|iso/.test(e))return '📦';return '📄';}
function typeName(n){var e=extOf(n);if(IMG[e])return e.toUpperCase()+' Image';if(AUD[e])return 'Audio';if(VID[e])return 'Video';if(TXT[e])return 'Text';return e?e.toUpperCase()+' File':'File';}
var __pvCur=null, __pvFiles=[];
function pvFileList(){ return (window.__curItems||[]).filter(function(c){return c.type==='file';}); }
function proxyUrl(url){
  if(!PROXY_BASE||!url) return url;
  if(!/gofile\.io/i.test(url)) return url;
  return PROXY_BASE+'/proxy?url='+encodeURIComponent(url);
}
function pvNav(dir){
  __pvFiles=pvFileList(); if(!__pvFiles.length)return;
  var i=__pvFiles.indexOf(__pvCur);
  if(i<0) i=0; else i+=dir;
  if(i<0) i=__pvFiles.length-1; if(i>=__pvFiles.length) i=0;
  showPreview(__pvFiles[i]);
}
function showPreview(n){
  __pvCur=n; __pvFiles=pvFileList();
  var idx=__pvFiles.indexOf(n), total=__pvFiles.length;
  $('pvPrev').disabled=total<2; $('pvNext').disabled=total<2;
  $('prevPane').style.display='flex'; $('divPrev').style.display='block'; $('bPrev').classList.add('on');
  $('pvName').textContent=n.name+(total>1?' ('+(idx+1)+'/'+total+')':'');
  var b=$('pvBody'); b.innerHTML='<div class="spin"></div>';
  var e=extOf(n.name), raw=n.link||'', url=proxyUrl(raw);
  function fall(msg){ b.innerHTML='<div class="pfall"><div class="big">'+iconOf(n.name)+'</div><div>'+esc(msg)+'</div><div>'+fmtB(n.size)+'</div>'+(raw?'<a class="cbtn" href="'+esc(raw)+'" target="_blank" rel="noopener">⬇ Download</a>':'')+'</div>'; }
  if(IMG[e]){
    var im=new Image(), tried=false;
    im.onload=function(){b.innerHTML='';b.appendChild(im);};
    im.onerror=function(){ if(!tried&&url!==raw){tried=true;im.src=raw;} else fall('Preview blocked by host (CORS/hotlink).'); };
    im.src=url; im.alt=n.name;
  }
  else if(AUD[e]){ var a=document.createElement('audio'); a.controls=true; a.src=url; a.onerror=function(){fall('Audio blocked by host.');}; b.innerHTML=''; b.appendChild(a); }
  else if(VID[e]){ var v=document.createElement('video'); v.controls=true; v.src=url; v.onerror=function(){fall('Video blocked by host.');}; b.innerHTML=''; b.appendChild(v); }
  else if(TXT[e]){ fetch(url,{mode:'cors'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){ b.innerHTML=''; var pre=document.createElement('pre'); pre.textContent=t.slice(0,200000); b.appendChild(pre); }).catch(function(){fall('Text preview blocked by host (CORS).');}); }
  else fall('No inline preview for this type.');
}
$('pvPrev').onclick=function(){pvNav(-1);};
$('pvNext').onclick=function(){pvNav(1);};
$('pvClose').onclick=function(){ $('prevPane').style.display='none'; $('divPrev').style.display='none'; $('bPrev').classList.remove('on'); };
document.addEventListener('keydown',function(e){
  if($('prevPane').style.display==='none')return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowLeft'){e.preventDefault();pvNav(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();pvNav(1);}
  else if(e.key==='Escape'){e.preventDefault();$('pvClose').onclick();}
});
$('bPrev').onclick=function(){ if($('prevPane').style.display==='none'){ if(sel.length===1&&sel[0].type==='file')showPreview(sel[0]); else {$('prevPane').style.display='flex';$('divPrev').style.display='block';$('pvName').textContent='';$('pvBody').innerHTML='<div class="pfall"><div class="big">👁</div><div>Select a file to preview</div></div>';} $('bPrev').classList.add('on'); } else $('pvClose').onclick(); };
load();
</script>
</body>
</html>
