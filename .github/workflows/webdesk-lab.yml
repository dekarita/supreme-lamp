# [F9l-lab] RESERVED-ENV FALLBACK LAB (web desktop 502 reproduction + proof).
#
# Intent (stated once): the reserved lab env `dekarita/ghrdp-lab` is the
# intended home for this job (see PR body / session notes). It is NOT
# reachable from CI tooling right now: `gh repo view dekarita/ghrdp-lab` ->
# 404 and `gh repo create dekarita/ghrdp-lab` -> 403 "Resource not accessible
# by integration" (the token cannot read or create repos outside the
# installation's allow-list). Retried once, then this in-repo fallback is
# used so the F9l proof is not blocked:
#
#   * same runner class (windows-latest, Azure, ephemeral) as main.yml's rdp job
#   * REAL Tailscale login (repo secret TS_AUTHKEY) + REAL `tailscale serve`
#   * REAL noVNC clone + REAL websockify on 127.0.0.1:7333
#   * the F9l-2 self-test is NOT re-implemented here: it is EXTRACTED VERBATIM
#     from .github/workflows/main.yml and executed with `pwsh -File`, so the
#     lab exercises the exact production code (including the F9l-1
#     Start-Websockify function and the F9l-3 diagnostics payload).
#
# Phase 1 (REPRO): legacy-style start (plain Start-Process) in one step, then
#   probe from the NEXT step - this reproduces the observed "deploy green,
#   self-test 502" leg and answers whether the websockify process survives a
#   GitHub Actions step boundary.
# Phase 2 (FIX):   runs the extracted production self-test and proves the
#   classified self-heal (backend restart + serve-mapping reset) ends green.
# Phase 3 (E):     points config.webdeskUrl at a non-resolvable tailnet name
#   and proves the failure path writes the classification + 'webdesk-diag'
#   payload and still halts fail-closed.
#
# LAB_REV=4 (F9l follow-up: no hidden websockify process window; push trigger reruns proof).
# Evidence channel: run logs/artifacts live on the results blob host, which is
# not always reachable from the tooling that drives this lab, so every probe
# also emits a ::warning::/::notice:: annotation - annotations are readable
# through the ordinary GitHub API (GET /check-runs/<id>/annotations).
#
# Artifacts are secret-free by construction: websockify never receives
# VNC_PASS (its argument list is dir + loopback ports only), and Tailscale
# credentials never appear in the files this job uploads.
name: webdesk-lab (F9l 502 reproduction + proof)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/webdesk-lab.yml'

permissions:
  contents: read

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo (main.yml source of truth)
        uses: actions/checkout@v4

      - name: Lab bootstrap (host layout + lab hostname)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $labRoot = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $labRoot -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $labRoot 'webdesk') -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_HOST=webdesk-lab-' + $env:GITHUB_RUN_NUMBER)
          Write-Host ('[lab] hostname will be webdesk-lab-' + $env:GITHUB_RUN_NUMBER)
          exit 0

      - name: Install Tailscale (msi)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          & curl.exe -fL --retry 3 --connect-timeout 30 --max-time 300 -o tailscale-setup.msi $url 2>$null
          $LASTEXITCODE = 0
          if (-not (Test-Path 'tailscale-setup.msi')) { throw '[lab] tailscale msi download failed' }
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'tailscale-setup.msi', '/quiet', '/norestart'
          Start-Sleep -Seconds 5
          Write-Host ('[lab] tailscale installed: ' + ((& 'C:\Program Files\Tailscale\tailscale.exe' version 2>$null | Select-Object -First 1) -join ' '))
          exit 0

      - name: Tailscale up (lab node)
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not $env:TS_AUTHKEY) { throw '[lab] TS_AUTHKEY secret missing in dekarita/supreme-lamp - lab cannot run.' }
          $upLog = Join-Path $env:RUNNER_TEMP 'lab-ts-up.log'
          $upErr = Join-Path $env:RUNNER_TEMP 'lab-ts-up.err'
          Start-Process -FilePath $ts -ArgumentList @('up', ('--authkey=' + $env:TS_AUTHKEY), '--accept-dns=true', ('--hostname=' + $env:LAB_HOST)) -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
              try {
                  $j = ((& $ts status --json 2>$null) -join "`n") | ConvertFrom-Json
                  if ($j.BackendState -eq 'Running') { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
          }
          if (-not $ok) {
              $tail = ''
              foreach ($f in @($upLog, $upErr)) { if (Test-Path -LiteralPath $f) { $tail += [System.IO.File]::ReadAllText($f) } }
              if ($env:TS_AUTHKEY) { $tail = $tail -replace [regex]::Escape($env:TS_AUTHKEY), '[redacted]' }
              Write-Host ('[lab] tailscale up tail: ' + (($tail -split "`r?`n" | Select-Object -Last 10) -join ' | '))
              throw '[lab] tailscale up did not reach Running'
          }
          $dns = [string](((& $ts status --json 2>$null) -join "`n") | ConvertFrom-Json).Self.DNSName
          $dns = $dns.TrimEnd('.')
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_DNS=' + $dns)
          Write-Host ('[lab] tailscale Running as ' + $dns)
          exit 0

      - name: Seed host layout (noVNC + websockify + config.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ghrdp'
          $novnc = Join-Path $root 'novnc'
          if (-not (Test-Path -LiteralPath (Join-Path $novnc 'vnc.html'))) {
              & git.exe clone --depth 1 https://github.com/novnc/noVNC.git $novnc 2>&1 | Select-Object -Last 2 | Out-Null
          }
          & python -m pip install --disable-pip-version-check --quiet websockify 2>&1 | Select-Object -Last 2 | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $novnc 'vnc.html'))) { throw '[lab] noVNC assets missing' }
          $url = 'https://' + $env:LAB_DNS + '/vnc.html?autoconnect=1&resize=remote'
          $cfg = [ordered]@{ hostKind = 'ephemeral'; hostname = $env:LAB_HOST; webdeskUrl = $url; webdeskReason = ''; webdeskDetail = '' }
          $enc = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), ($cfg | ConvertTo-Json -Depth 6), $enc)
          Write-Host ('[lab] seeded config.webdeskUrl = ' + $url)
          exit 0

      - name: REPRO A - legacy-style websockify start + tailscale serve mapping
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $wsLog = 'C:\ghrdp\webdesk\websockify.log'
          $wsErr = 'C:\ghrdp\webdesk\websockify.err.log'
          # Exactly the pre-F9l deploy-step shape: kill stale, Start-Process with
          # paired redirect files, wait for LISTEN, then map the tailnet.
          try { Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } } catch { }
          Start-Process -FilePath python -ArgumentList @('-m','websockify','--web','C:\ghrdp\novnc','127.0.0.1:7333','127.0.0.1:5900') -RedirectStandardOutput $wsLog -RedirectStandardError $wsErr | Out-Null
          $up = $false
          for ($i = 0; $i -lt 20; $i++) {
              $c = Get-NetTCPConnection -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue
              if ($c) { $up = $true; break }
              Start-Sleep -Seconds 1
          }
          $pids = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | Select-Object -ExpandProperty ProcessId)
          Write-Host ('[lab] REPRO A: websockify LISTEN=' + $up + ' pids=' + ($pids -join ','))
          $serveOut = ((& $ts serve --bg http://127.0.0.1:7333 2>&1 | ForEach-Object { [string]$_ }) -join ' | ')
          Write-Host ('[lab] REPRO A: serve exit=' + $LASTEXITCODE + ' out=' + $serveOut)
          $LASTEXITCODE = 0
          Start-Sleep -Seconds 3
          $st = ((& $ts serve status --json 2>$null) -join "`n")
          Write-Host ('[lab] REPRO A: serve status = ' + $st)
          $b = Join-Path $env:RUNNER_TEMP 'repro-a-backend.html'
          $bc = ((& curl.exe -sk --max-time 20 -o $b -w '%{http_code}' 'http://127.0.0.1:7333/vnc.html' 2>$null) -join '').Trim()
          $LASTEXITCODE = 0
          Write-Host ('[lab] REPRO A: backend curl HTTP ' + $bc)
          exit 0

      - name: REPRO B - next-step probe (step-boundary survival + serve leg)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
          $lines = @()
          $pids = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | Select-Object -ExpandProperty ProcessId)
          $listen = [bool](Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue)
          $lines += ('probe=REPRO-B step=2 python-websockify-pids=' + ($pids -join ',') + ' loopback-listen-7333=' + $listen)
          $bf = Join-Path $env:RUNNER_TEMP 'repro-b-backend.html'
          $bc = ((& curl.exe -sk --max-time 20 -o $bf -w '%{http_code}' 'http://127.0.0.1:7333/vnc.html' 2>$null) -join '').Trim()
          $LASTEXITCODE = 0
          $lines += ('probe=REPRO-B backend-http=' + $bc)
          $url = 'https://' + $env:LAB_DNS + '/vnc.html?autoconnect=1&resize=remote'
          $sf = Join-Path $env:RUNNER_TEMP 'repro-b-serve.html'
          $sh = Join-Path $env:RUNNER_TEMP 'repro-b-serve.hdr'
          $sc = ((& curl.exe -sk --max-time 25 -D $sh -o $sf -w '%{http_code}' $url 2>$null) -join '').Trim()
          $LASTEXITCODE = 0
          $lines += ('probe=REPRO-B serve-http=' + $sc + ' url=' + $url)
          if (Test-Path -LiteralPath $sh) { $lines += ('probe=REPRO-B serve-headers=' + (((Get-Content -LiteralPath $sh | Select-Object -First 5) -join ' | '))) }
          try { $lines += ('probe=REPRO-B serve-status-json=' + (((& $ts serve status --json 2>$null) -join ' '))) } catch { }
          $lines | ForEach-Object { Write-Host ('[lab] ' + $_) }
          Add-Content -LiteralPath (Join-Path $diagDir 'lab-repro.txt') -Value ($lines -join "`n")
          Write-Host ('::warning title=lab REPRO (legacy start, next step)::' + ($lines -join ' ; '))
          Exit 0

      - name: FIX - extracted production self-test (verbatim from main.yml)
        id: fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $all = Get-Content -LiteralPath '.github/workflows/main.yml'
          if (-not ($all -match '\[F9l-2\]')) {
              Write-Host '[lab] Phase 2 PENDING: main.yml does not carry the [F9l-2] self-test yet; skipping the extracted run.'
              exit 0
          }
          $start = -1
          for ($i = 0; $i -lt $all.Count; $i++) { if ($all[$i] -match '^      - name: Web desktop self-test') { $start = $i; break } }
          if ($start -lt 0) { throw '[lab] self-test step not found in main.yml' }
          $end = $all.Count
          for ($i = $start + 1; $i -lt $all.Count; $i++) { if ($all[$i] -match '^      - name: ') { $end = $i; break } }
          $runLine = -1
          for ($i = $start; $i -lt $end; $i++) { if ($all[$i] -match '^        run: \|') { $runLine = $i; break } }
          if ($runLine -lt 0) { throw '[lab] self-test step has no block run script' }
          $script = @()
          for ($i = $runLine + 1; $i -lt $end; $i++) {
              $l = $all[$i]
              if ($l.Trim() -eq '') { $script += ''; continue }
              if ($l -notmatch '^          ') { break }
              $script += $l.Substring(10)
          }
          $out = Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'
          [System.IO.File]::WriteAllLines($out, $script, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host ('[lab] extracted self-test: ' + $script.Count + ' lines -> ' + $out)
          Add-Content -Path $env:GITHUB_ENV -Value ('LAB_EXTRACTED=' + $out)
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $out
          $rc = $LASTEXITCODE
          Write-Host ('[lab] extracted self-test exit code = ' + $rc)
          exit $rc

      - name: FIX PROBE - survival + serve status after the self-test
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $diagDir = Join-Path $env:RUNNER_TEMP 'webdesk-diag'
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
          $lines = @()
          $pids = @(Get-CimInstance Win32_Process -Filter "Name='python.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*websockify*7333*' } | Select-Object -ExpandProperty ProcessId)
          $listen = [bool](Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue)
          $lines += ('probe=FIX-PROBE step=' + $env:GITHUB_JOB + ' python-websockify-pids=' + ($pids -join ',') + ' loopback-listen-7333=' + $listen)
          $cfg = ''
          try { $cfg = [System.IO.File]::ReadAllText('C:\ghrdp\config.json') } catch { }
          $lines += ('probe=FIX-PROBE config=' + (($cfg -replace '\s+', ' ')))
          $url = 'https://' + $env:LAB_DNS + '/vnc.html?autoconnect=1&resize=remote'
          $sf = Join-Path $env:RUNNER_TEMP 'fix-probe-serve.html'
          $sc = ((& curl.exe -sk --max-time 25 -o $sf -w '%{http_code}' $url 2>$null) -join '').Trim()
          $LASTEXITCODE = 0
          $lines += ('probe=FIX-PROBE serve-http=' + $sc)
          if (Test-Path -LiteralPath $sf) { $body = [System.IO.File]::ReadAllText($sf); if ($body.Length -gt 120) { $body = $body.Substring(0, 120) }; $lines += ('probe=FIX-PROBE serve-first120=' + ($body -replace '\s+', ' ')) }
          try { $lines += ('probe=FIX-PROBE serve-status-json=' + (((& $ts serve status --json 2>$null) -join ' '))) } catch { }
          $lines | ForEach-Object { Write-Host ('[lab] ' + $_) }
          Add-Content -LiteralPath (Join-Path $diagDir 'lab-fix-probe.txt') -Value ($lines -join "`n")
          Write-Host ('::notice title=lab FIX PROBE (after extracted self-test)::' + ($lines -join ' ; '))
          exit 0

      - name: E PROOF - classification path (unresolvable ts.net URL, expect halt)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'))) {
              Write-Host '[lab] Phase 3 SKIPPED: no extracted self-test (Phase 2 pending).'
              exit 0
          }
          # Point the advertised URL at a tailnet name that cannot resolve, then
          # run the SAME extracted self-test: it must classify dns-tls, write the
          # diagnostics payload, clear the URL and throw (fail-closed).
          $cfgPath = 'C:\ghrdp\config.json'
          $enc = New-Object System.Text.UTF8Encoding($false)
          $cfg = [System.IO.File]::ReadAllText($cfgPath) | ConvertFrom-Json
          $cfg.webdeskUrl = 'https://webdesk-lab-nonexistent-name.ts.net/vnc.html?autoconnect=1&resize=remote'
          [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 6), $enc)
          Write-Host '[lab] Phase 3: config.webdeskUrl pointed at an unresolvable ts.net name'
          $out = Join-Path $env:RUNNER_TEMP 'extracted-selftest.ps1'
          $p = Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $out) -Wait -PassThru -NoNewWindow
          Write-Host ('[lab] Phase 3: extracted self-test exit code = ' + $p.ExitCode + ' (non-zero = fail-closed halt, as designed)')
          $cl = Join-Path $env:RUNNER_TEMP 'webdesk-diag\classification.txt'
          $clTxt = ''
          if (Test-Path -LiteralPath $cl) { $clTxt = (([System.IO.File]::ReadAllText($cl)) -replace "`r?`n", ' | ') }
          else { $clTxt = 'classification.txt MISSING (F9l-3 payload incomplete)' }
          Write-Host ('[lab] Phase 3 classification.txt: ' + $clTxt)
          $cfgAfter = ''
          try { $cfgAfter = ([System.IO.File]::ReadAllText($cfgPath) -replace '\s+', ' ') } catch { }
          Write-Host ('::warning title=lab Phase 3 (classification proof)::exit=' + $p.ExitCode + ' ; ' + $clTxt + ' ; config.json=' + $cfgAfter)
          exit 0

      - name: Stage diagnostics inside the workspace (upload-artifact v4 root)
        if: always()
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'webdesk-diag'
          New-Item -ItemType Directory -Path $stage -Force -ErrorAction SilentlyContinue | Out-Null
          try {
              Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'webdesk-diag\*') -Destination $stage -Force -Recurse -ErrorAction SilentlyContinue
          } catch { }
          foreach ($f in @('C:\ghrdp\webdesk\websockify.log', 'C:\ghrdp\webdesk\websockify.err.log')) {
              if (Test-Path -LiteralPath $f) { Copy-Item -LiteralPath $f -Destination (Join-Path $stage ([System.IO.Path]::GetFileName($f))) -Force -ErrorAction SilentlyContinue }
          }
          Add-Content -LiteralPath (Join-Path $stage 'MANIFEST.txt') -Value ('lab staged at ' + (Get-Date).ToUniversalTime().ToString('o'))
          Write-Host ('[lab] staged ' + (Get-ChildItem -LiteralPath $stage -ErrorAction SilentlyContinue).Count + ' file(s)')

      - name: Upload webdesk-diag artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdesk-diag
          if-no-files-found: warn
          retention-days: 14
          path: webdesk-diag

      - name: Lab teardown (logout lab node)
        if: always()
        shell: pwsh
        run: |
          try { & 'C:\Program Files\Tailscale\tailscale.exe' logout 2>&1 | Select-Object -First 3 | ForEach-Object { Write-Host ('[lab] ' + $_) } } catch { }
          exit 0
