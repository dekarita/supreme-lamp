<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GHRDP WebRTC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#view{width:100vw;height:100vh;object-fit:contain;background:#000;display:block;cursor:default}
#toolbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
  padding:6px 12px;background:rgba(0,0,0,0.85);color:#ccc;font-size:13px;
  z-index:10;transition:opacity 0.3s;opacity:0}
#toolbar:hover,#toolbar.show{opacity:1}
#toolbar .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-red{background:#e55}
.dot-yellow{background:#ea3}
.dot-green{background:#4d4}
#stats{margin-left:auto;font-family:monospace;font-size:12px;color:#888}
.btn{background:rgba(255,255,255,0.1);border:none;color:#ccc;padding:4px 10px;
  border-radius:4px;cursor:pointer;font-size:12px}
.btn:hover{background:rgba(255,255,255,0.2)}
#mode{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);
  color:#ccc;padding:3px 6px;border-radius:4px;font-size:12px}
#badge{position:fixed;bottom:6px;right:8px;z-index:11;font-family:monospace;
  font-size:11px;color:#666;background:rgba(0,0,0,0.6);padding:2px 6px;
  border-radius:3px;pointer-events:none;transition:opacity 0.3s;opacity:0}
#badge.show{opacity:1}
#badge .sha{color:#8ab}
</style>
</head>
<body>
<video id="view" autoplay playsinline muted></video>
<div id="toolbar">
  <span id="dot" class="dot dot-red"></span>
  <span id="status">connecting</span>
  <select id="mode" title="Capture mode">
    <option value="">512x384 @15</option>
    <option value="640x480">640x480 @15</option>
  </select>
  <span id="stats"></span>
  <button class="btn" onclick="toggleFs()">Fullscreen</button>
</div>
<div id="badge"><span id="badge-txt"></span></div>
<script>
(function(){
'use strict';
var view = document.getElementById('view');
var dot = document.getElementById('dot');
var statusEl = document.getElementById('status');
var statsEl = document.getElementById('stats');
var toolbar = document.getElementById('toolbar');

var ws, pc, dc;
var connected = false;
var hideTimer;
var modeSel = document.getElementById('mode');
var badge = document.getElementById('badge');
var badgeTxt = document.getElementById('badge-txt');

function currentMode() {
  var q = new URLSearchParams(location.search).get('mode');
  if (q) return q;
  try { return localStorage.getItem('ghrdp-mode') || ''; } catch (e) { return ''; }
}

function setStatus(txt, color) {
  statusEl.textContent = txt;
  dot.className = 'dot dot-' + color;
}

function showToolbar() {
  toolbar.classList.add('show');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function(){ toolbar.classList.remove('show'); }, 2500);
}

// Server stamp badge (P2): the operator must be able to see at a glance which
// commit/session is actually serving, without opening devtools.
var badgeTimer;
function showBadge() {
  badge.classList.add('show');
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(function(){ badge.classList.remove('show'); }, 8000);
}

function renderBadge(v) {
  var sha = (v.git_commit || 'unknown').slice(0, 8);
  var warn = (v.session_id !== 2) ? ' !!session' + v.session_id : '';
  badgeTxt.innerHTML = '<span class="sha">' + sha + '</span> ' +
    v.capture + ' ' + v.mode + ' ' + (v.encoder || '') +
    ' s' + v.session_id + ' ' + (v.target_fps || '') + 'fps ' +
    (v.bitrate_kbps || '') + 'k' + warn;
  showBadge();
}

function loadVersion() {
  var q = currentMode();
  fetch('/version' + (q ? ('?mode=' + encodeURIComponent(q)) : ''))
    .then(function(r){ return r.json(); })
    .then(renderBadge)
    .catch(function(){ badgeTxt.textContent = 'version fetch failed'; showBadge(); });
}

function connect() {
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var q = currentMode();
  ws = new WebSocket(proto + '//' + location.host + '/ws' + (q ? ('?mode=' + encodeURIComponent(q)) : ''));
  ws.onopen = function() {
    setStatus('signaling', 'yellow');
    startWebRTC();
  };
  ws.onmessage = function(ev) {
    var msg = JSON.parse(ev.data);
    if (msg.type === 'answer') {
      pc.setRemoteDescription(new RTCSessionDescription({type:'answer', sdp:msg.sdp}));
    } else if (msg.type === 'candidate' && msg.candidate) {
      pc.addIceCandidate(new RTCIceCandidate({
        candidate: msg.candidate,
        sdpMid: msg.sdpMid,
        sdpMLineIndex: msg.sdpMLineIndex
      }));
    }
  };
  ws.onclose = function() {
    setStatus('disconnected', 'red');
    connected = false;
    if (pc) { try { pc.close(); } catch(e){} pc = null; }
    setTimeout(connect, 2000);
  };
  ws.onerror = function() {};
}

// fps via requestVideoFrameCallback
var fpsFrameCount = 0;
var fpsLastTime = 0;
var currentFps = 0;

function onVideoFrame(now) {
  fpsFrameCount++;
  if (fpsLastTime === 0) fpsLastTime = now;
  var delta = now - fpsLastTime;
  if (delta >= 1000) {
    currentFps = Math.round(fpsFrameCount * 1000 / delta);
    fpsFrameCount = 0;
    fpsLastTime = now;
  }
  view.requestVideoFrameCallback(onVideoFrame);
}

// fallback fps via currentTime delta
var fallbackFps = 0;
var lastCT = 0;
var ctFrames = 0;
var ctStart = 0;

function startWebRTC() {
  var config = {
    iceServers: [
      { urls: ['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] }
    ]
  };
  pc = new RTCPeerConnection(config);

  pc.addTransceiver('video', { direction: 'recvonly' });

  dc = pc.createDataChannel('input', { ordered: true });
  dc.onopen = function() {
    setStatus('connected', 'green');
    connected = true;
  };
  dc.onclose = function() {
    connected = false;
    setStatus('dc closed', 'yellow');
  };

  pc.ontrack = function(ev) {
    var stream;
    if (ev.streams && ev.streams[0]) {
      stream = ev.streams[0];
    } else {
      stream = new MediaStream();
      stream.addTrack(ev.track);
    }
    view.srcObject = stream;
    if (ev.receiver && typeof ev.receiver.jitterBufferTarget !== 'undefined') {
      ev.receiver.jitterBufferTarget = 0;
    }
    if ('requestVideoFrameCallback' in view) {
      view.requestVideoFrameCallback(onVideoFrame);
    }
  };

  pc.onicecandidate = function(ev) {
    if (ev.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'candidate',
        candidate: ev.candidate.candidate,
        sdpMid: ev.candidate.sdpMid,
        sdpMLineIndex: ev.candidate.sdpMLineIndex
      }));
    }
  };

  pc.onconnectionstatechange = function() {
    var s = pc.connectionState;
    if (s === 'connected') {
      setStatus('streaming', 'green');
      connected = true;
    } else if (s === 'failed' || s === 'closed') {
      setStatus(s, 'red');
      connected = false;
    }
  };

  pc.createOffer().then(function(offer) {
    return pc.setLocalDescription(offer);
  }).then(function() {
    ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription.sdp }));
  });

  setInterval(updateStats, 1000);
}

var prevBytes = 0;
var prevTime = 0;

function updateStats() {
  if (!pc) return;

  // fallback fps from currentTime
  var ct = view.currentTime;
  if (lastCT > 0 && ct > lastCT) {
    ctFrames++;
  }
  if (ctStart === 0) ctStart = Date.now();
  var ctElapsed = (Date.now() - ctStart) / 1000;
  if (ctElapsed > 2) {
    fallbackFps = Math.round(ctFrames / ctElapsed);
    ctFrames = 0;
    ctStart = Date.now();
  }
  lastCT = ct;

  pc.getStats().then(function(rtcStats) {
    var fps = currentFps || fallbackFps;
    var w = 0, h = 0, kbps = 0;
    rtcStats.forEach(function(report) {
      if (report.type === 'inbound-rtp' && report.kind === 'video') {
        if (report.framesPerSecond) fps = Math.round(report.framesPerSecond);
        w = report.frameWidth || 0;
        h = report.frameHeight || 0;
        var nowMs = Date.now();
        if (prevTime > 0 && nowMs > prevTime) {
          kbps = Math.round((report.bytesReceived - prevBytes) * 8 / (nowMs - prevTime));
        }
        prevBytes = report.bytesReceived || 0;
        prevTime = nowMs;
      }
    });
    var txt = w + 'x' + h + ' ' + fps + 'fps ' + kbps + 'kbps';
    // fetch server stats for extra fields
    if (!window._srvStatsBusy) {
      window._srvStatsBusy = true;
      fetch('/stats').then(function(r){ return r.json(); }).then(function(s){
        window._srvStats = s;
        window._srvStatsBusy = false;
      }).catch(function(){ window._srvStatsBusy = false; });
    }
    var ss = window._srvStats;
    if (ss) {
      if (ss.drops > 0) txt += ' d:' + ss.drops;
      txt += ' ' + (ss.capture_mode || '');
      if (ss.input_to_frame_ms > 0) txt += ' itf:' + ss.input_to_frame_ms + 'ms';
    }
    statsEl.textContent = txt;
  });
}

// --- Input ---
function send(obj) {
  if (connected && dc && dc.readyState === 'open') {
    dc.send(JSON.stringify(obj));
  }
}

function normCoords(e) {
  var rect = view.getBoundingClientRect();
  var vw = view.videoWidth || rect.width;
  var vh = view.videoHeight || rect.height;
  var videoAspect = vw / vh;
  var elemAspect = rect.width / rect.height;
  var rw, rh, ox, oy;
  if (videoAspect > elemAspect) {
    rw = rect.width;
    rh = rect.width / videoAspect;
    ox = 0;
    oy = (rect.height - rh) / 2;
  } else {
    rh = rect.height;
    rw = rect.height * videoAspect;
    ox = (rect.width - rw) / 2;
    oy = 0;
  }
  var nx = (e.clientX - rect.left - ox) / rw;
  var ny = (e.clientY - rect.top - oy) / rh;
  return { nx: Math.max(0, Math.min(1, nx)), ny: Math.max(0, Math.min(1, ny)) };
}

var lastMove = 0;
view.addEventListener('mousemove', function(e) {
  var now = Date.now();
  if (now - lastMove < 16) return;
  lastMove = now;
  var c = normCoords(e);
  send({ t:'m', nx:c.nx, ny:c.ny });
});

view.addEventListener('mousedown', function(e) {
  e.preventDefault();
  var c = normCoords(e);
  send({ t:'m', nx:c.nx, ny:c.ny });
  send({ t: e.button === 2 ? 'rd' : 'ld' });
});

view.addEventListener('mouseup', function(e) {
  e.preventDefault();
  send({ t: e.button === 2 ? 'ru' : 'lu' });
});

view.addEventListener('wheel', function(e) {
  e.preventDefault();
  var d = e.deltaY > 0 ? -1 : 1;
  send({ t:'w', d:d });
}, { passive: false });

view.addEventListener('contextmenu', function(e) { e.preventDefault(); });

var VK_MAP = {
  'Backspace':8,'Tab':9,'Enter':13,'ShiftLeft':16,'ShiftRight':16,
  'ControlLeft':17,'ControlRight':17,'AltLeft':18,'AltRight':18,
  'Pause':19,'CapsLock':20,'Escape':27,'Space':32,'PageUp':33,'PageDown':34,
  'End':35,'Home':36,'ArrowLeft':37,'ArrowUp':38,'ArrowRight':39,'ArrowDown':40,
  'PrintScreen':44,'Insert':45,'Delete':46,
  'Digit0':48,'Digit1':49,'Digit2':50,'Digit3':51,'Digit4':52,
  'Digit5':53,'Digit6':54,'Digit7':55,'Digit8':56,'Digit9':57,
  'KeyA':65,'KeyB':66,'KeyC':67,'KeyD':68,'KeyE':69,'KeyF':70,
  'KeyG':71,'KeyH':72,'KeyI':73,'KeyJ':74,'KeyK':75,'KeyL':76,
  'KeyM':77,'KeyN':78,'KeyO':79,'KeyP':80,'KeyQ':81,'KeyR':82,
  'KeyS':83,'KeyT':84,'KeyU':85,'KeyV':86,'KeyW':87,'KeyX':88,
  'KeyY':89,'KeyZ':90,'MetaLeft':91,'MetaRight':92,
  'F1':112,'F2':113,'F3':114,'F4':115,'F5':116,'F6':117,
  'F7':118,'F8':119,'F9':120,'F10':121,'F11':122,'F12':123,
  'NumLock':144,'ScrollLock':145,
  'Semicolon':186,'Equal':187,'Comma':188,'Minus':189,'Period':190,
  'Slash':191,'Backquote':192,'BracketLeft':219,'Backslash':220,
  'BracketRight':221,'Quote':222
};

document.addEventListener('keydown', function(e) {
  e.preventDefault();
  var vk = VK_MAP[e.code];
  if (vk) send({ t:'kd', vk:vk });
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    send({ t:'k', ch:e.key });
  }
});

document.addEventListener('keyup', function(e) {
  e.preventDefault();
  var vk = VK_MAP[e.code];
  if (vk) send({ t:'ku', vk:vk });
});

var lastTouch = null;
view.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var t = e.touches[0];
  var c = normCoords(t);
  send({ t:'m', nx:c.nx, ny:c.ny });
  send({ t:'ld' });
}, { passive: false });

view.addEventListener('touchmove', function(e) {
  e.preventDefault();
  var t = e.touches[0];
  var c = normCoords(t);
  send({ t:'m', nx:c.nx, ny:c.ny });
}, { passive: false });

view.addEventListener('touchend', function(e) {
  e.preventDefault();
  send({ t:'lu' });
}, { passive: false });

document.addEventListener('mousemove', function(e) {
  if (e.clientY < 40) showToolbar();
});

window.toggleFs = function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};

// Operator-initiated mode switch: persists the choice and reconnects so the
// server spins a fresh pipeline with the requested capture size (P7).
if (modeSel) {
  var savedMode = currentMode();
  if (savedMode === '640x480') modeSel.value = '640x480';
  modeSel.addEventListener('change', function() {
    try { localStorage.setItem('ghrdp-mode', modeSel.value); } catch (e) {}
    setStatus('switching mode', 'yellow');
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (ws) { try { ws.close(); } catch (e) {} }
    loadVersion();
  });
  modeSel.addEventListener('mouseenter', function() { showToolbar(); });
}

loadVersion();
showToolbar();
connect();
})();
</script>
</body>
</html>
