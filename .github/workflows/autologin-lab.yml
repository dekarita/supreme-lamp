              if ($keyPath -and (Test-Path -LiteralPath $keyPath)) {
                  try {
                      $acls = (Get-Acl -LiteralPath $keyPath).Access | ForEach-Object { $_.IdentityReference.Value + '=>' + $_.FileSystemRights }
