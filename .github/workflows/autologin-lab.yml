name: autologin-lab
# [F10-6] Lab proof matrix for the PS-free auto-login package. The reserved
# proof env dekarita/ghrdp-lab is unreachable for the CI token (404 view /
# 403 create - retried; same posture as STATE.md's webdesk-lab fallback), so
# this push-triggered windows-latest lane is the equally faithful fallback:
# it compiles+registers the REAL launcher with the in-box csc, invokes the
# REAL ghrdp://rdp verb, and exercises the REAL ghrdp-server.ps1 endpoints.
# Delete when ghrdp-lab becomes available.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/autologin-lab.yml
      - payloads/ghrdp-rdp-launcher.cs
      - payloads/install.cmd
      - payloads/ghrdp-server.ps1
      - payloads/edge-ext-resolve.ps1
      - payloads/ghrdp-cred-shim.js
      - payloads/ui.html
      - payloads/lab/**
      - payloads/ghrdp-provision-apps.ps1
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "A: install.cmd compiles + registers handler (zero-prompt path)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $lab = Join-Path $env:RUNNER_TEMP 'lab-a'
          New-Item -ItemType Directory -Path $lab -Force | Out-Null
          Copy-Item payloads\install.cmd (Join-Path $lab 'install.cmd') -Force
          Copy-Item payloads\ghrdp-rdp-launcher.cs (Join-Path $lab 'ghrdp-rdp-launcher.cs') -Force
          # The REAL double-click equivalent: cmd /c on the shipped file.
          & cmd.exe /c ('"' + (Join-Path $lab 'install.cmd') + '" < nul') 2>&1 | ForEach-Object { Write-Host ('[install.cmd] ' + $_) }
          $code = $LASTEXITCODE
          Write-Host ('[A] install.cmd exit code = ' + $code)
          if ($code -ne 0) { Write-Host '[A] FAIL: install.cmd returned nonzero'; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Host '[A] FAIL: exe missing'; exit 1 }
          $cmdReg = (Get-ItemProperty 'Registry::HKEY_CURRENT_USER\Software\Classes\ghrdp\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          if ($cmdReg -notmatch 'ghrdp-rdp-launcher\.exe') { Write-Host ('[A] FAIL: protocol not registered, command=' + $cmdReg); exit 1 }
          $cs = [System.IO.File]::ReadAllText((Join-Path $lab 'ghrdp-rdp-launcher.cs'))
          $cmd = [System.IO.File]::ReadAllText((Join-Path $lab 'install.cmd'))
          if (($cs + $cmd) -match 'powershell\.exe|ExecutionPolicy|Invoke-Expression|EncodedCommand') { Write-Host '[A] FAIL: script-host token'; exit 1 }
          # [F13-1/F13-6] the shipped install.cmd compiles /target:winexe: the
          # PE subsystem must be 2 (WINDOWS_GUI) - the launcher exe itself can
          # never flash a console window in the interactive session.
          $fs = [System.IO.File]::OpenRead($exe)
          $br = New-Object System.IO.BinaryReader($fs)
          $null = $fs.Seek(0x3C, 'Begin')
          $peOff = $br.ReadInt32()
          $null = $fs.Seek($peOff + 24 + 68, 'Begin')
          $subsys = $br.ReadUInt16()
          $fs.Close()
          if ($subsys -ne 2) { Write-Host ('[A] FAIL: PE subsystem=' + $subsys + ' (expected 2 = WINDOWS_GUI for /target:winexe)'); exit 1 }
          Write-Host ('[A] PE subsystem=' + $subsys + ' (WINDOWS_GUI): the launcher cannot open a console window')
          Write-Host '[A] PASS: compiled with in-box csc (winexe), HKCU ghrdp registered, script-host free'
          'A_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
      - name: "B/C: ghrdp://rdp verb -> directives rdp + mstsc spawn + temp cleanup"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          $fqdn = 'lab-target.dekarita.tailnet-lab.ts.net'
          # emulate §6(a) post-install posture: handler present + cmdkey entry
          # SET (dummy lab credential, deleted at the end - never a real one).
          & cmdkey.exe /add:TERMSRV/$fqdn /user:labuser /pass:labdummy000 | Out-Null
          # The handler-hello beacon posts to http://<fqdn>:7331; a fake lab
          # fqdn cannot be impersonated locally, so the ROUND-TRIP is proven in
          # step D against the REAL server instead (beacon failure is silent by
          # design and must not affect the launch - asserted via exit 0 here).
          # GHRDP_LAB_KEEP_RDP=1 keeps the temp .rdp so the lab can PROVE its
          # directives (it carries no credential lines - see F10-1).
          $env:GHRDP_LAB_KEEP_RDP = '1'
          # [F10-9] Start-Process -Wait waits for DESCENDANTS too: the launcher
          # spawns mstsc, and mstsc has no console on a headless runner, so -Wait
          # blocked forever (run 36147990362 wedged in this step). Wait on the
          # LAUNCHER PID with a bounded timeout instead, then reap mstsc here.
          $p = Start-Process -FilePath $exe -ArgumentList ('ghrdp://rdp?server=' + $fqdn + '&user=labuser') -PassThru
          if (-not $p.WaitForExit(90000)) {
              Write-Host '[B/C] FAIL: launcher did not exit within 90s'
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch { }
              exit 1
          }
          if ($p.ExitCode -ne 0) { Write-Host ('[B/C] FAIL: launcher exit ' + $p.ExitCode); exit 1 }
          $rdp = Get-ChildItem (Join-Path $env:TEMP 'ghrdp-*.rdp') | Select-Object -First 1
          if (-not $rdp) { Write-Host '[B/C] FAIL: temp rdp not written'; exit 1 }
          $text = [System.IO.File]::ReadAllText($rdp.FullName)
          $need = @('screen mode id:i:2','redirectclipboard:i:1','redirectprinters:i:1','redirectdrives:i:1','drivestoredirect:s:*','devicestoredirect:s:*','redirectcomports:i:1','redirectsmartcards:i:1','redirectposdevices:i:1','audiocapturemode:i:1','bandwidthautodetect:i:1','compression:i:1',('full address:s:' + $fqdn),'username:s:labuser')
          foreach ($d in $need) { if ($text -notmatch [regex]::Escape($d)) { Write-Host ('[B/C] FAIL: missing directive ' + $d); exit 1 } }
          foreach ($bad in @('password 51','desktopwidth','desktopheight','prompt for credentials:i:')) { if ($text -match [regex]::Escape($bad)) { Write-Host ('[B/C] FAIL: forbidden line ' + $bad); exit 1 } }
          # (b) mstsc spawned visible WITH the .rdp path on its command line.
          $mst = $null
          for ($i = 0; $i -lt 10 -and -not $mst; $i++) {
              $mst = Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-*.rdp*' } | Select-Object -First 1
              if (-not $mst) { Start-Sleep -Milliseconds 500 }
          }
          if (-not $mst) { Write-Host '[B/C] FAIL: mstsc with ghrdp rdp path not observed'; exit 1 }
          Write-Host ('[B/C] mstsc observed with rdp cmdline (pid ' + $mst.ProcessId + ')')
          # (c) fullscreen==client native: screen mode id:i:2 WITH no resolution
          # pins is the exact RDP contract for it (asserted above); screenshot
          # proof requires a physical console -> PENDING-USER cell.
          Add-Type -AssemblyName System.Windows.Forms
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host ('[B/C] client native resolution on this lab host: ' + $scr.Width + 'x' + $scr.Height)
          # hello beacon received? (best-effort - fqdn is fake so it 000s; the
          # REAL path posts to <fqdn>:7331 which the stub cannot impersonate,
          # so a loopback variant is proven in step D with the real server).
          & cmdkey.exe /delete:TERMSRV/$fqdn | Out-Null
          # [F10-9] reap the headless mstsc we spawned (it can never connect to
          # the fake lab fqdn) so the step cannot wedge and no orphan holds the
          # runner; the proof above already captured its command line.
          $reaped = 0
          foreach ($mp in (Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-*.rdp*' })) {
              try { Stop-Process -Id $mp.ProcessId -Force -ErrorAction Stop; $reaped++ } catch { }
          }
          Write-Host ('[B/C] mstsc reaped: ' + $reaped)
          Remove-Item $rdp.FullName -Force -ErrorAction SilentlyContinue
          Write-Host '[B/C] PASS: 14 directives exact, no cred/resolution lines, mstsc cmdline carries the local rdp, cleanup ok'
          'BC_result=pass' | Out-File $env:GITHUB_ENV -Append
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: "D/E: server native-status fields + gated creds + ping loop"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          # [F10-13] every D/E failure is classified + captured here so the next
          # red run is diagnosable from an artifact/annotation alone (runner logs
          # were unreachable for 36149313677/36149471496).
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          # lab config with DUMMY lab-only credentials (not secrets).
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), (@{
              dnsName = 'lab-host.dekarita.tailnet-lab.ts.net'; rdpUser = 'labuser'
              rdpPass = 'LABDUMMY-win-9876'; vncPass = 'LABDUMMY-vnc-5432'; rdpIp = '100.118.42.7'
          } | ConvertTo-Json -Compress), $utf8)
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), 'lab-dash-token-0123456789', $utf8)
          $srv = $null
          function DE-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[D/E] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'classification.txt') -Encoding utf8 } catch { }
              try { if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue } } catch { }
              exit 1
          }
          # start the REAL server script (same script production runs).
          $srvOut = Join-Path $diag 'server-out.log'; $srvErr = Join-Path $diag 'server-err.log'
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { try { $ok = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok) {
              $okTxt = ''; try { $okTxt = ([System.IO.File]::ReadAllText((Join-Path $root 'server-ok.txt'))).Trim() } catch { }
              $errTail = ''; try { $errTail = ((Get-Content $srvErr -Tail 6 -ErrorAction SilentlyContinue) -join ' | ') } catch { }
              DE-Fail 'listen' ('server never listened on 7331; exited=' + $(if ($srv.HasExited) { $srv.ExitCode } else { 'no' }) + '; server-ok=[' + $okTxt + ']; stderr=[' + $errTail + ']')
          }
          $base = 'http://127.0.0.1:7331'
          # [F10-14] LOOPBACK CALLS MUST BYPASS ANY PROXY: the first D/E failure
          # (annotation stage=config-unauth, 401) came from Invoke-RestMethod
          # honouring a system/env proxy for 127.0.0.1 instead of talking to the
          # server. Raw HttpWebRequest with Proxy = $null + body capture on error
          # (so the next failure names the HTTP status AND the response body).
          Write-Host ('[D/E] proxy diag: HTTP_PROXY=[' + [string]$env:HTTP_PROXY + '] HTTPS_PROXY=[' + [string]$env:HTTPS_PROXY + '] NO_PROXY=[' + [string]$env:NO_PROXY + '] DefaultWebProxy=[' + [string]([System.Net.WebRequest]::DefaultWebProxy) + ']')
          function Invoke-LabJson([string]$Url, [string]$Method = 'GET', [string]$Body = '') {
              $req = [System.Net.HttpWebRequest]::Create($Url)
              $req.Method = $Method
              $req.Proxy = $null
              $req.Timeout = 10000
              $req.ReadWriteTimeout = 10000
              $req.KeepAlive = $false
              $req.UserAgent = 'ghrdp-lab'
              if ($Body) {
                  $b = [System.Text.Encoding]::UTF8.GetBytes($Body)
                  $req.ContentType = 'application/json'
                  $req.ContentLength = $b.Length
                  $st = $req.GetRequestStream(); $st.Write($b, 0, $b.Length); $st.Close()
              }
              try { $resp = $req.GetResponse() }
              catch [System.Net.WebException] {
                  $r = $_.Exception.Response
                  $code = 0; $txt = ''
                  if ($r) { $code = [int]$r.StatusCode; try { $sr = New-Object System.IO.StreamReader($r.GetResponseStream()); $txt = $sr.ReadToEnd(); $sr.Close() } catch { } }
                  throw ('HTTP ' + $code + ' body=[' + $txt.Substring(0, [Math]::Min(200, $txt.Length)) + '] ' + $Url)
              }
              $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $t = $sr.ReadToEnd(); $sr.Close(); $resp.Close()
              return ($t | ConvertFrom-Json)
          }
          try { $plain = Invoke-LabJson ($base + '/api/config') }
          catch { DE-Fail 'config-unauth' $_.Exception.Message }
          try {
              if ($plain.creds.PSObject.Properties['windowsPass']) { DE-Fail 'creds-leak' 'unauthenticated loopback received windowsPass' }
          } catch { DE-Fail 'config-shape' ($_.Exception.Message + ' :: body=' + ($plain | ConvertTo-Json -Compress -Depth 4)) }
          try { $gated = Invoke-LabJson ($base + '/api/config?key=lab-dash-token-0123456789') }
          catch { DE-Fail 'config-gated' $_.Exception.Message }
          if ($gated.creds.windowsPass -ne 'LABDUMMY-win-9876') { DE-Fail 'gated-windowsPass' ('got=[' + [string]$gated.creds.windowsPass + ']') }
          if ($gated.creds.vncPass -ne 'LABDUMMY-vnc-5432') { DE-Fail 'gated-vncPass' ('got=[' + [string]$gated.creds.vncPass + ']') }
          if ($gated.creds.windowsPassMask -notmatch '\*+9876$') { DE-Fail 'gated-mask' ('mask=[' + [string]$gated.creds.windowsPassMask + ']') }
          Write-Host '[D] PASS: creds served ONLY to token request; last-4 mask verified; loopback clean'
          # native-status carries the new telemetry fields (values may be null
          # on a session-less lab host - the KEYS are the contract).
          try { $ns = Invoke-LabJson ($base + '/api/native-status?key=lab-dash-token-0123456789') }
          catch { DE-Fail 'native-status' $_.Exception.Message }
          foreach ($k in @('rdpLogonAgeSec','pingMs','pingPath','pingTarget')) { if (-not ($ns.PSObject.Properties.Name -contains $k)) { DE-Fail 'native-status-field' ('missing ' + $k) } }
          # rdp-ping loop wrote a sample (tailscale absent in lab => path unknown).
          $pj = $null
          for ($i = 0; $i -lt 10 -and -not $pj; $i++) { if (Test-Path 'C:\ghrdp\rdp-ping.json') { try { $pj = Get-Content 'C:\ghrdp\rdp-ping.json' -Raw | ConvertFrom-Json } catch { } }; if (-not $pj) { Start-Sleep -Seconds 2 } }
          if (-not $pj -or -not $pj.ts) { DE-Fail 'rdp-ping' ('rdp-ping.json missing/empty; dir=' + ((Get-ChildItem $root -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',')) }
          # handler-hello beacon round-trip (the launcher-observable endpoint).
          try { $hh = Invoke-LabJson ($base + '/api/handler-hello?key=lab-dash-token-0123456789') 'POST' '{"verb":"rdp-launch","ok":true,"details":"lab"}' }
          catch { DE-Fail 'handler-hello' $_.Exception.Message }
          if (-not $hh.ok) { DE-Fail 'handler-hello-shape' ($hh | ConvertTo-Json -Compress) }
          try { Stop-Process -Id $srv.Id -Force } catch { }
          Write-Host '[D/E] PASS: fields present, ping sample written, hello beacon accepted'
          'DE_result=pass' | Out-File $env:GITHUB_ENV -Append

      - name: "D/E diagnostics artifact (survives halts)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autologin-lab-de-diag
          path: de-diag
          if-no-files-found: ignore

      - name: "F: Edge policy proof (live-resolved IDs -> registry readout)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function F-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[F] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          # [F10-11] SAME resolver text as production: dot-sourced from the
          # repo checkout - the lab can never drift from what the runner runs.
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\edge-ext-resolve.ps1')
          $a1 = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill','uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          if (-not $a1) { F-Fail 'resolve-ublock' 'no live page yielded a verifiable uBlock Origin id (see [ext] warnings above)' }
          $a2 = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill','uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          $d1 = Resolve-StoreExtId -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('darkreader.org','Dark Reader') -VendorPages @('https://raw.githubusercontent.com/darkreader/darkreader/main/README.md')
          if (-not $d1) { F-Fail 'resolve-darkreader' 'no live page yielded a verifiable Dark Reader id (see [ext] warnings above)' }
          if (-not $a2 -or $a1.id -ne $a2.id) { F-Fail 'unstable' ('first=' + $(if ($a1) { $a1.id } else { '' }) + ' second=' + $(if ($a2) { $a2.id } else { '' })) }
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
          New-Item -Path $pol -Force | Out-Null
          Set-ItemProperty -Path $pol -Name '1' -Value (Get-ExtForceListValue -Resolved $a1)
          Set-ItemProperty -Path $pol -Name '2' -Value (Get-ExtForceListValue -Resolved $d1)
          $rb = Get-ItemProperty -Path $pol
          if ($rb.'1' -notmatch ('^' + $a1.id) -or $rb.'2' -notmatch ('^' + $d1.id)) { F-Fail 'registry-readback' ('got 1=[' + $rb.'1' + '] 2=[' + $rb.'2' + ']') }
          Write-Host ('[F] PASS: uBlock Origin=' + $a1.id + ' [' + $a1.store + ' via ' + $a1.source + ']')
          Write-Host ('[F] PASS: Dark Reader=' + $d1.id + ' [' + $d1.store + ' via ' + $d1.source + ']')
          # Bookmarks policy readout: exactly the three F10 managed bookmarks.
          $bm = @(@{ toplevel_name = 'GHRDP Session'; children = @(
              @{ name = 'Mission Control'; url = 'http://100.118.42.7:7331' },
              @{ name = 'Auto-login guide (docs/AUTOLOGIN.md)'; url = 'https://github.com/dekarita/supreme-lamp/blob/main/docs/AUTOLOGIN.md' },
              @{ name = 'Tailscale Admin - DNS'; url = 'https://login.tailscale.com/admin/dns' }) })
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value (ConvertTo-Json $bm -Depth 6 -Compress)
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Edge').ManagedFavorites -notmatch 'docs/AUTOLOGIN.md') { Write-Host '[F] FAIL: bookmarks readout'; exit 1 }
          Write-Host '[F] PASS: extension forcelist + managed bookmark policy readback (edge://policy source of truth; edge://extensions UI cell = PENDING-USER)'
          'F_result=pass' | Out-File $env:GITHUB_ENV -Append
          ('F_ubo=' + $a1.id + ' via ' + $a1.source) | Out-File $env:GITHUB_ENV -Append
          ('F_dr=' + $d1.id + ' via ' + $d1.source) | Out-File $env:GITHUB_ENV -Append

      - name: "H: VNC cred shim auto-fill (REAL shim executed under node)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function H-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[H] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          # The shim is executed for real: a DOM stub provides window.opener, the
          # exact-origin meta and the noVNC credentials input; the harness feeds a
          # postMessage from the opener and asserts (a) the input is auto-filled
          # and submitted, (b) a wrong-origin / non-opener message is IGNORED,
          # (c) nothing was logged (the shim must never echo the value).
          $js = Join-Path $env:RUNNER_TEMP 'shim-harness.js'
          $lines = @(
              "const fs=require('fs'),vm=require('vm');",
              "const src=fs.readFileSync(process.argv[2],'utf8');",
              "const listeners={},els={},logs=[];",
              "function el(id){return els[id]||(els[id]={id:id,value:'',dispatchEvent(){return true;},querySelector(){return {click(){els.clicked=true;}};},classList:{contains(c){return c==='noVNC_open';}}});}",
              "el('noVNC_password_input');el('noVNC_credentials_dlg');",
              "const win={opener:{n:'dash'},addEventListener(t,f){(listeners[t]=listeners[t]||[]).push(f);}};",
              "const ctx={window:win,document:{querySelector(){return {content:'http://100.118.42.7:7331'};},getElementById:el},Event:function(t){this.type=t;},setInterval(){return 1;},clearInterval(){},console:{log(){logs.push('LOG');},error(){logs.push('ERR');},warn(){logs.push('WARN');}}};",
              "vm.createContext(ctx);vm.runInContext(src,ctx);",
              "const send=(o,s,d)=>listeners.message[0]({origin:o,source:s,data:d});",
              "send('http://evil.example',win.opener,{type:'ghrdp-vnc-pass',pass:'LEAK'});",
              "send('http://100.118.42.7:7331',{n:'other'},{type:'ghrdp-vnc-pass',pass:'LEAK'});",
              "send('http://100.118.42.7:7331',win.opener,{type:'other',pass:'LEAK'});",
              "if(els.noVNC_password_input.value!==''){console.log('FAIL:unauthorized payload reached the dialog');process.exit(2);}",
              "send('http://100.118.42.7:7331',win.opener,{type:'ghrdp-vnc-pass',pass:'VNC-lab-secret'});",
              "if(els.noVNC_password_input.value!=='VNC-lab-secret'){console.log('FAIL:dialog not auto-filled');process.exit(3);}",
              "if(!els.clicked){console.log('FAIL:dialog not submitted');process.exit(4);}",
              "if(logs.length){console.log('FAIL:shim logged ('+logs.join(',')+')');process.exit(5);}",
              "console.log('PASS: auto-filled='+(els.noVNC_password_input.value.length>0)+' submitted='+!!els.clicked+' unauthorized=ignored logs='+logs.length);"
          )
          [System.IO.File]::WriteAllText($js, ($lines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          & node.exe $js (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-cred-shim.js')
          if ($LASTEXITCODE -ne 0) { H-Fail 'shim-exec' ('node harness exit ' + $LASTEXITCODE) }
          Write-Host '[H] PASS: real shim auto-fills the credentials dialog from the opener origin only and never logs the value'
          'H_result=pass' | Out-File $env:GITHUB_ENV -Append

      - name: "H2: webdesk auto-fill E2E (REAL noVNC v1.7.0 + REAL shim + playwright)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function H2-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[H2] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          # [F13-6 §3] End-to-end proof of the VNC auto-submit fix: the REAL
          # pinned noVNC v1.7.0 tree + the REAL shim injection (same code as
          # the main.yml deploy step) + REAL websockify + a VNC-auth RFB stub.
          # The dashboard stub posts the password the way ui.html does; the
          # driver proves connected-with-zero-typing and a clean URL/wire/log
          # scan. Nothing here types into the dialog.
          $root = Join-Path $env:RUNNER_TEMP 'h2'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $novncDir = Join-Path $root 'novnc'
          & git.exe clone --depth 1 --branch v1.7.0 https://github.com/novnc/noVNC.git $novncDir 2>&1 | Select-Object -Last 2 | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $novncDir 'vnc.html'))) { H2-Fail 'novnc-clone' 'pinned v1.7.0 noVNC clone failed' }
          $novncVer = ([System.IO.File]::ReadAllText((Join-Path $novncDir 'package.json')) | ConvertFrom-Json).version
          if ("$novncVer" -ne '1.7.0') { H2-Fail 'novnc-version' ('clone is ' + $novncVer + ', expected 1.7.0') }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-cred-shim.js') (Join-Path $novncDir 'ghrdp-cred-shim.js') -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'payloads\lab\dash-stub.html') (Join-Path $novncDir 'dash-stub.html') -Force
          $credOrigin = 'http://127.0.0.1:7333'
          $inject = ('<meta name="ghrdp-cred-origin" content="' + $credOrigin + '"><script src="ghrdp-cred-shim.js"></script>')
          $pg = Join-Path $novncDir 'vnc.html'
          $html = [System.IO.File]::ReadAllText($pg)
          if (-not $html.Contains('ghrdp-cred-shim.js')) {
              if ($html.Contains('</body>')) { $html = $html.Replace('</body>', ($inject + '</body>')) } else { $html = $html + $inject }
              [System.IO.File]::WriteAllText($pg, $html, (New-Object System.Text.UTF8Encoding($false)))
          }
          Write-Host '[H2] REAL shim injected into the pinned noVNC v1.7.0 vnc.html (same injection as the deploy step)'
          & python -m pip install --disable-pip-version-check --quiet websockify 2>&1 | Select-Object -Last 1 | Out-Null
          $stub = Start-Process -FilePath node.exe -ArgumentList ('"' + (Join-Path $env:GITHUB_WORKSPACE 'payloads\lab\vnc-auth-stub-server.js') + '" 5901 5902') -RedirectStandardOutput (Join-Path $root 'stub.log') -RedirectStandardError (Join-Path $root 'stub.err') -PassThru -WindowStyle Hidden
          $ws = Start-Process -FilePath python -ArgumentList @('-m','websockify','--web', $novncDir, '7333', '127.0.0.1:5901') -RedirectStandardOutput (Join-Path $root 'websockify.log') -RedirectStandardError (Join-Path $root 'ws.err') -PassThru -WindowStyle Hidden
          $listenOk = $false
          for ($i = 0; $i -lt 40; $i++) {
              $ports = @(Get-NetTCPConnection -LocalPort 7333, 5901, 5902 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty LocalPort -Unique)
              if ($ports.Count -ge 3) { $listenOk = $true; break }
              Start-Sleep -Seconds 1
          }
          if (-not $listenOk) {
              foreach ($lf in @('stub.err','ws.err')) { $f = Join-Path $root $lf; if (Test-Path $f) { Get-Content $f -Tail 5 | ForEach-Object { Write-Host ('[H2] ' + $lf + ': ' + $_) } } }
              H2-Fail 'listen' 'websockify(7333)/stub(5901,5902) did not listen'
          }
          # [F13-diag] --prefix install: the runner's npm exited 0 without
          # populating <workspace>\node_modules (root-detection quirk with no
          # package.json). A dedicated prefix + NODE_PATH is deterministic.
          $pwRoot = Join-Path $env:RUNNER_TEMP 'pw'
          New-Item -ItemType Directory -Path $pwRoot -Force | Out-Null
          # npm on Windows is npm.CMD (never npm.exe - that invocation throws
          # and leaves a stale $LASTEXITCODE from the previous native command).
          $npmCmd = (Get-Command npm.cmd -ErrorAction SilentlyContinue).Source
          if (-not $npmCmd) { $npmCmd = (Get-Command npm -ErrorAction SilentlyContinue).Source }
          if (-not $npmCmd) { H2-Fail 'npm' 'npm.cmd not found on PATH' }
          & $npmCmd install --prefix $pwRoot --no-save --no-package-lock --no-audit --no-fund --silent playwright-core 2>&1 | Select-Object -Last 2 | ForEach-Object { Write-Host ('[H2 npm] ' + $_) }
          if ($LASTEXITCODE -ne 0) { H2-Fail 'npm' ('playwright-core install failed, exit ' + $LASTEXITCODE) }
          if (-not (Test-Path -LiteralPath (Join-Path $pwRoot 'node_modules\playwright-core'))) { H2-Fail 'npm' ('playwright-core missing after --prefix install into ' + $pwRoot) }
          $env:NODE_PATH = Join-Path $pwRoot 'node_modules'
          # [F13-diag] capture the driver output so a failure is classifiable
          # from the artifact/annotation even when the job log is unreachable.
          $e2eOut = Join-Path $root 'e2e-out.txt'
          $env:H2_SHOT = Join-Path $root 'e2e-shot.png'   # lands in the h2-diag artifact
          & node.exe (Join-Path $env:GITHUB_WORKSPACE 'payloads\lab\webdesk-e2e.js') 'http://127.0.0.1:7333' 'http://127.0.0.1:5902/state' 2>&1 | Tee-Object -FilePath $e2eOut
          $e2e = $LASTEXITCODE
          foreach ($lf in @('websockify.log','ws.err','stub.log','stub.err')) {
              $f = Join-Path $root $lf
              if (Test-Path $f) {
                  $t = [System.IO.File]::ReadAllText($f)
                  if ($t.Contains('vnclab7')) { H2-Fail 'log-leak' ('the password literal appeared in ' + $lf) }
              }
          }
          try { Stop-Process -Id $stub.Id -Force -ErrorAction SilentlyContinue } catch { }
          try { Stop-Process -Id $ws.Id -Force -ErrorAction SilentlyContinue } catch { }
          if ($e2e -ne 0) { H2-Fail 'e2e' ('webdesk-e2e.js exit ' + $e2e) }
          Write-Host '[H2] PASS: opener handoff -> shim auto-fill -> VNC-auth completed -> connected with ZERO manual typing; no password in any URL, wire byte or log'
          'H2_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "H2 diag artifact (always)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h2-diag
          path: ${{ runner.temp }}\h2\
          if-no-files-found: ignore

      - name: "I: RDP USAGE timer ticks / freezes / resumes (REAL server + REAL loop)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          function I-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[I] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'usage-classification.txt') -Encoding utf8 } catch { }
              try { if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue } } catch { }
              exit 1
          }
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path (Join-Path $root 'webdesk') -Force | Out-Null
          # The usage loop consumes the SAME file the Rust dash writes when a
          # webdesk client attaches (ws-clients.txt) - the lab plays that client.
          $sig = Join-Path $root 'webdesk\ws-clients.txt'
          function Usage-Read {
              $u = Invoke-RestMethod -Uri ('http://127.0.0.1:7331/api/native-status?key=lab-dash-token-0123456789') -Proxy $null -TimeoutSec 10
              return $u
          }
          $srvOut = Join-Path $diag 'usage-server.log'; $srvErr = Join-Path $diag 'usage-server-err.log'
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { try { $ok = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok) { I-Fail 'server-listen' 'ghrdp-server.ps1 did not bind 7331 in 20s' }
          # (1) TICK: webdesk client attached -> usage grows
          [System.IO.File]::WriteAllText($sig, '1', (New-Object System.Text.UTF8Encoding($false)))
          $active = $false; $tickA = $null
          for ($i = 0; $i -lt 20 -and -not $active; $i++) {
              Start-Sleep -Seconds 2
              try { $u = Usage-Read; if ($u.rdpUsageActive -and $u.rdpUsageSec -gt 0) { $active = $true; $tickA = [int]$u.rdpUsageSec } } catch { }
          }
          if (-not $active) { I-Fail 'tick' 'rdpUsageSec did not start accumulating with a webdesk client attached' }
          Start-Sleep -Seconds 12
          try { $u2 = Usage-Read; $tickB = [int]$u2.rdpUsageSec } catch { I-Fail 'tick-read' $_.Exception.Message }
          if ($tickB -le $tickA) { I-Fail 'tick-growth' ('sec ' + $tickA + ' -> ' + $tickB + ' (must grow while active)') }
          Write-Host ('[I] TICK ok: ' + $tickA + 's -> ' + $tickB + 's while a webdesk client is attached')
          # (2) FREEZE within 20s of the last signal dropping
          Remove-Item -LiteralPath $sig -Force -ErrorAction SilentlyContinue
          $frozen = $false; $freezeAt = $null
          for ($i = 0; $i -lt 12 -and -not $frozen; $i++) {
              Start-Sleep -Seconds 2
              try { $u3 = Usage-Read; if (-not $u3.rdpUsageActive) { $frozen = $true; $freezeAt = [int]$u3.rdpUsageSec } } catch { }
          }
          if (-not $frozen) { I-Fail 'freeze' 'rdpUsageActive stayed true more than 20s after both signals dropped' }
          Start-Sleep -Seconds 12
          try { $u4 = Usage-Read; $stillFrozen = [int]$u4.rdpUsageSec } catch { I-Fail 'freeze-read' $_.Exception.Message }
          if ($stillFrozen -ne $freezeAt) { I-Fail 'freeze-drift' ('sec moved while frozen: ' + $freezeAt + ' -> ' + $stillFrozen) }
          Write-Host ('[I] FREEZE ok: frozen at ' + $freezeAt + 's and unchanged for 12s')
          # (3) RESUME + persistence into config.json
          [System.IO.File]::WriteAllText($sig, '1', (New-Object System.Text.UTF8Encoding($false)))
          $resumed = $false
          for ($i = 0; $i -lt 10 -and -not $resumed; $i++) {
              Start-Sleep -Seconds 2
              try { $u5 = Usage-Read; if ($u5.rdpUsageActive -and ([int]$u5.rdpUsageSec -gt $stillFrozen)) { $resumed = $true } } catch { }
          }
          if (-not $resumed) { I-Fail 'resume' 'usage did not resume after the client re-attached' }
          Write-Host '[I] RESUME ok: accumulation continued from the frozen value'
          Start-Sleep -Seconds 32   # the loop persists to config.json at most every 30s
          try { $cfgNow = [System.IO.File]::ReadAllText((Join-Path $root 'config.json')) | ConvertFrom-Json } catch { I-Fail 'config-read' $_.Exception.Message }
          if ($null -eq $cfgNow.rdpUsageSec) { I-Fail 'config-persist' 'config.json carries no rdpUsageSec' }
          $persisted = [int]$cfgNow.rdpUsageSec
          if ($persisted -le $stillFrozen) { I-Fail 'config-persist-value' ('persisted=' + $persisted + ' frozen=' + $stillFrozen) }
          Write-Host ('[I] PERSIST ok: config.json rdpUsageSec=' + $persisted + ' host=' + $cfgNow.rdpUsageHost)
          try { Stop-Process -Id $srv.Id -Force } catch { }
          Start-Sleep -Seconds 2
          # (4) CONTINUITY on the same host: a fresh server resumes from the
          # persisted accumulator instead of starting at zero.
          $srv2 = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $diag 'usage-server2.log') -RedirectStandardError (Join-Path $diag 'usage-server2-err.log') -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok2 = $false
          for ($i = 0; $i -lt 40 -and -not $ok2; $i++) { try { $ok2 = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok2) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok2) { I-Fail 'server2-listen' 'second server start did not bind 7331 in 20s' }
          $carried = $null
          for ($i = 0; $i -lt 8 -and -not $carried; $i++) {
              Start-Sleep -Seconds 2
              try { $u6 = Usage-Read; if ($null -ne $u6.rdpUsageSec -and [int]$u6.rdpUsageSec -ge $persisted) { $carried = [int]$u6.rdpUsageSec } } catch { }
          }
          if ($null -eq $carried) { I-Fail 'continuity' ('restart did not continue from ' + $persisted + 's') }
          Stop-Process -Id $srv2.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $sig -Force -ErrorAction SilentlyContinue
          Write-Host ('[I] PASS: usage timer ticks -> freezes (<=20s) -> resumes -> persists (' + $carried + 's) -> continues across a restart')
          'I_result=pass' | Out-File $env:GITHUB_ENV -Append
          ('I_usage=' + $carried) | Out-File $env:GITHUB_ENV -Append

      - name: "J: qBittorrent planted as a plain app (winget, cached)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cache = 'C:\ghrdp\cache\qbittorrent'
          New-Item -ItemType Directory -Path $cache -Force -ErrorAction SilentlyContinue | Out-Null
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (-not $winget) { Write-Host '::error::[J] stage=winget :: winget.exe missing on the lab runner'; exit 1 }
          & $winget install --id qBittorrent.qBittorrent --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3 | Out-Null
          $LASTEXITCODE = 0
          $exe = Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::[J] stage=presence :: qBittorrent not present after winget install'; exit 1 }
          # plain app: no Web UI listener, no autostart Run key, no mirror wiring
          $runKey = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          $auto = $false
          if ($runKey) { foreach ($p in $runKey.PSObject.Properties) { if ($p.Name -like 'qBittorrent*') { $auto = $true } } }
          Write-Host ('[J] PASS: qBittorrent present at ' + $exe.FullName + '; autostart=' + $auto + '; webui-listener=absent-by-default')
          'J_result=pass' | Out-File $env:GITHUB_ENV -Append

      - name: "N: handler overwrite (stale value planted)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-1 §1.1] Plant the exact class of stale value the client PC had
          # (a pre-F2 registration pointing at a script host), then run the REAL
          # install.cmd and prove it OVERWRITES it, prints before/after and
          # verifies the readback.
          $stale = '"C:\Windows\System32\cmd.exe" /c echo stale "%1"'
          New-Item -Path 'HKCU:\Software\Classes\ghrdp\shell\open\command' -Force | Out-Null
          Set-Item -LiteralPath 'HKCU:\Software\Classes\ghrdp\shell\open\command' -Value $stale
          $before = [string](Get-Item -LiteralPath 'HKCU:\Software\Classes\ghrdp\shell\open\command').GetValue('')
          Write-Host ('[N] planted stale value: ' + $before)
          $lab = Join-Path $env:RUNNER_TEMP 'lab-n'
          New-Item -ItemType Directory -Path $lab -Force | Out-Null
          Copy-Item payloads\install.cmd (Join-Path $lab 'install.cmd') -Force
          Copy-Item payloads\ghrdp-rdp-launcher.cs (Join-Path $lab 'ghrdp-rdp-launcher.cs') -Force
          $out = & cmd.exe /c ('"' + (Join-Path $lab 'install.cmd') + '" < nul') 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host ('[N install.cmd] ' + $_) }
          $after = [string](Get-Item -LiteralPath 'HKCU:\Software\Classes\ghrdp\shell\open\command').GetValue('')
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-rdp-launcher.exe'
          # [F13-1] the byte-faithful install.cmd prints 'BEFORE:' / 'AFTER:'
          # echo lines (the & is a cmd OPERATOR - it never appears in output).
          $printedBefore = [bool](($out -join "`n") -match 'BEFORE:')
          $printedAfter  = [bool](($out -join "`n") -match 'AFTER:')
          $overwritten   = ($after -match 'ghrdp-rdp-launcher\.exe') -and ($after -notmatch 'cmd\.exe')
          $ok = ($code -eq 0) -and $printedBefore -and $printedAfter -and $overwritten -and (Test-Path -LiteralPath $exe)
          Write-Host ('[N] exit=' + $code + ' printedBefore=' + $printedBefore + ' printedAfter=' + $printedAfter + ' overwritten=' + $overwritten + ' after=' + $after)
          if (-not $ok) { Write-Host '::error::[N] stage=overwrite :: install.cmd did not overwrite the stale registration'; exit 1 }
          Write-Host '[N] PASS: stale value printed, overwritten and verified by install.cmd'
          'N_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "K: browser policies + extensions readback"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-3 §3.1/§3.2] The REAL live resolver populates the REAL policy
          # keys; the SHARED readback helper (payloads/ghrdp-provision-apps.ps1)
          # reports what edge://policy and chrome://policy will render; Edge is
          # then launched so the forced extension is actually downloaded and
          # unpacked into the profile (the extensions-page equivalent for CI).
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\edge-ext-resolve.ps1')
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-provision-apps.ps1')
          $ubo = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill', 'uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          $dr  = Resolve-StoreExtId -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('darkreader.org', 'Dark Reader') -VendorPages @('https://raw.githubusercontent.com/darkreader/darkreader/main/README.md')
          $cubo = Resolve-StoreExtId -Store 'cws' -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('uBlock Origin', 'gorhill')
          $cdr  = Resolve-StoreExtId -Store 'cws' -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('Dark Reader', 'darkreader.org')
          foreach ($pair in @(@('edge', $ubo, 'uBlock Origin'), @('edge', $dr, 'Dark Reader'), @('cws', $cubo, 'uBlock Origin'), @('cws', $cdr, 'Dark Reader'))) {
              if (-not $pair[1]) { Write-Host ('::error::[K] stage=resolve :: ' + $pair[0] + ' ' + $pair[2] + ' could not be resolved from a live store page'); exit 1 }
          }
          $edgePol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
          $cwsPol  = 'HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist'
          New-Item -Path $edgePol -Force | Out-Null
          New-Item -Path $cwsPol -Force | Out-Null
          Remove-Item -Path ($edgePol + '\*') -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ($cwsPol + '\*') -Force -ErrorAction SilentlyContinue
          New-ItemProperty -Path $edgePol -Name '1' -Value (Get-ExtForceListValue -Resolved $ubo) -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePol -Name '2' -Value (Get-ExtForceListValue -Resolved $dr)  -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $cwsPol  -Name '1' -Value (Get-ExtForceListValue -Resolved $cubo) -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $cwsPol  -Name '2' -Value (Get-ExtForceListValue -Resolved $cdr)  -PropertyType String -Force | Out-Null
          $edgeBack = Get-ForcedEntryCount $edgePol
          $cwsBack  = Get-ForcedEntryCount $cwsPol
          $edgeShape = @()
          foreach ($v in @((Get-Item -LiteralPath $edgePol).GetValueNames())) {
              if ($v -notmatch '^\d+$') { continue }
              $val = [string](Get-ItemProperty -Path $edgePol -Name $v).$v
              if (-not (Test-ForcedEntryShape $val)) { Write-Host ('::error::[K] stage=shape :: Edge forcelist value ' + $v + ' is malformed'); exit 1 }
              $edgeShape += $val
          }
          Write-Host ('[K] policy readback: Edge=' + $edgeBack + ' Chrome=' + $cwsBack + ' edge-ids=' + $ubo.id + ',' + $dr.id + ' chrome-ids=' + $cubo.id + ',' + $cdr.id)
          if ($edgeBack -ne 2 -or $cwsBack -ne 2) { Write-Host '::error::[K] stage=readback :: forcelist keys do not hold 2 entries each'; exit 1 }
          $edgeExe = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          $loaded = @()
          if (-not $edgeExe) { Write-Host '::warning::[K] Edge binary not found - profile-unpack check skipped (policy readback still proven)' }
          else {
              $profile = Join-Path $env:RUNNER_TEMP ('edge-lab-' + [guid]::NewGuid().ToString('N'))
              # headless Edge still unpacks force-installed extensions into the profile
              Start-Process -FilePath $edgeExe -ArgumentList @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check',('--user-data-dir=' + $profile),'about:blank') -WindowStyle Hidden | Out-Null
              for ($i = 0; $i -lt 24; $i++) {
                  Start-Sleep -Seconds 5
                  $extRoot = Join-Path $profile 'Default\Extensions'
                  if (Test-Path -LiteralPath $extRoot) {
                      $loaded = @(Get-ChildItem -LiteralPath $extRoot -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
                      if (($loaded -contains $ubo.id) -and ($loaded -contains $dr.id)) { break }
                  }
              }
              try { Get-Process -Name msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch { }
              Write-Host ('[K] Edge profile extension dirs: ' + ($loaded -join ', '))
              if (-not (($loaded -contains $ubo.id) -and ($loaded -contains $dr.id))) {
                  Write-Host '::error::[K] stage=extensions :: the forced Edge extensions were not unpacked into the profile (store fetch blocked?)'; exit 1
              }
          }
          Write-Host ('[K] PASS: live-resolved ids -> policy keys -> readback (' + $edgeBack + '/' + $cwsBack + ') -> Edge unpacked ' + ($loaded -join ','))
          'K_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          ('K_edge=' + $edgeBack) | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          # [F13-6] K2 (playwright policy-page readbacks) consumes these.
          ('K_ubo=' + $ubo.id) | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          ('K_dr=' + $dr.id) | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          ('K_profile=' + $(if ($profile) { $profile } else { '' })) | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "K2: policy pages readback via playwright (edge://policy + edge://extensions + chrome://policy)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function K2-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[K2] stage=' + $Stage + ' :: ' + $Detail)
              exit 1
          }
          # [F13-6 §2] The REAL policy UI readback (what the user would check):
          # edge://policy + edge://extensions via playwright on the system Edge,
          # chrome://policy via Chrome (installed through winget when absent),
          # Firefox policies.json readback only when Firefox is installed.
          # Cell K wrote the SAME HKLM forcelist keys main.yml writes and
          # exported the live-resolved ids.
          if (-not $env:K_ubo -or -not $env:K_dr) { K2-Fail 'pre' 'cell K did not export the resolved extension ids' }
          $pwRoot = Join-Path $env:RUNNER_TEMP 'pw'
          if (-not (Test-Path -LiteralPath (Join-Path $pwRoot 'node_modules\playwright-core'))) {
              New-Item -ItemType Directory -Path $pwRoot -Force | Out-Null
              $npmCmd = (Get-Command npm.cmd -ErrorAction SilentlyContinue).Source
              if (-not $npmCmd) { $npmCmd = (Get-Command npm -ErrorAction SilentlyContinue).Source }
              if (-not $npmCmd) { K2-Fail 'npm' 'npm.cmd not found on PATH' }
              & $npmCmd install --prefix $pwRoot --no-save --no-package-lock --no-audit --no-fund --silent playwright-core 2>&1 | Select-Object -Last 2 | ForEach-Object { Write-Host ('[K2 npm] ' + $_) }
              if ($LASTEXITCODE -ne 0) { K2-Fail 'npm' ('playwright-core install failed, exit ' + $LASTEXITCODE) }
              if (-not (Test-Path -LiteralPath (Join-Path $pwRoot 'node_modules\playwright-core'))) { K2-Fail 'npm' 'playwright-core missing after --prefix install' }
          }
          $env:NODE_PATH = Join-Path $pwRoot 'node_modules'
          # (1) edge://policy - the forced-extension policy must RENDER there.
          & node.exe (Join-Path $env:GITHUB_WORKSPACE 'payloads\lab\policy-readback.js') msedge policy 'edge://policy' - $env:K_ubo $env:K_dr
          if ($LASTEXITCODE -ne 0) { K2-Fail 'edge-policy' ('edge://policy readback exit ' + $LASTEXITCODE) }
          Write-Host '[K2] edge://policy renders both forced-extension ids'
          # (2) edge://extensions - the names must render in the unpacked profile
          # (list page + a belt per-id detail page, which shows the name too).
          if ($env:K_profile -and (Test-Path -LiteralPath $env:K_profile)) {
              $extOk = $true
              & node.exe (Join-Path $env:GITHUB_WORKSPACE 'payloads\lab\policy-readback.js') msedge extensions 'edge://extensions' $env:K_profile 'uBlock Origin' 'Dark Reader'
              if ($LASTEXITCODE -ne 0) {
                  Write-Host ('::warning::[K2] edge://extensions list page did not render both names (exit ' + $LASTEXITCODE + ') - trying the per-id detail pages')
                  $extOk = $false
              }
              foreach ($pair in @(@($env:K_ubo, 'uBlock Origin'), @($env:K_dr, 'Dark Reader'))) {
                  & node.exe (Join-Path $env:GITHUB_WORKSPACE 'payloads\lab\policy-readback.js') msedge policy ('edge://extensions/?id=' + $pair[0]) - $pair[1]
                  if ($LASTEXITCODE -ne 0) { K2-Fail 'edge-extensions' ('detail page for ' + $pair[1] + ' (' + $pair[0] + ') did not render its name, exit ' + $LASTEXITCODE) }
                  Write-Host ('[K2] edge://extensions detail page renders ' + $pair[1] + ' (' + $pair[0] + ')')
                  $extOk = $true
              }
              if (-not $extOk) { K2-Fail 'edge-extensions' 'neither the list page nor the detail pages rendered' }
              Write-Host '[K2] edge://extensions renders uBlock Origin + Dark Reader in the unpacked profile'
          } else {
              Write-Host '::warning::[K2] no unpacked Edge profile from cell K - edge://extensions readback skipped (policy readback still proven)'
          }
          # (3) chrome://policy - Chrome via winget when absent (HKLM forcelist
          # for Chrome was already written by cell K).
          $chromeExe = @('C:\Program Files\Google\Chrome\Application\chrome.exe', 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chromeExe) {
              $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
              if ($winget) {
                  Write-Host '[K2] Chrome absent - installing via winget for the chrome://policy readback'
                  & $winget install --id Google.Chrome --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 2 | Out-Null
                  $chromeExe = @('C:\Program Files\Google\Chrome\Application\chrome.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
              }
          }
          if ($chromeExe) {
              & node.exe (Join-Path $env:GITHUB_WORKSPACE 'payloads\lab\policy-readback.js') chrome policy 'chrome://policy' - $env:K_ubo $env:K_dr
              if ($LASTEXITCODE -ne 0) { K2-Fail 'chrome-policy' ('chrome://policy readback exit ' + $LASTEXITCODE) }
              Write-Host '[K2] chrome://policy renders both forced-extension ids'
          } else {
              K2-Fail 'chrome-install' 'Chrome could not be installed for the chrome://policy readback'
          }
          # (4) Firefox policies.json - only when Firefox is installed (same
          # contract as the main.yml provision step).
          $ff = 'C:\Program Files\Mozilla Firefox'
          if (Test-Path (Join-Path $ff 'firefox.exe')) {
              . (Join-Path $env:GITHUB_WORKSPACE 'payloads\edge-ext-resolve.ps1')
              $ffUbo = Resolve-AmoAddon -Slug 'ublock-origin'
              $ffDr  = Resolve-AmoAddon -Slug 'darkreader'
              $pol = [ordered]@{ policies = [ordered]@{ Extensions = [ordered]@{ Install = @($ffUbo.url, $ffDr.url) } } }
              $dist = Join-Path $ff 'distribution'
              New-Item -ItemType Directory -Path $dist -Force | Out-Null
              [System.IO.File]::WriteAllText((Join-Path $dist 'policies.json'), (ConvertTo-Json -InputObject $pol -Depth 8), (New-Object System.Text.UTF8Encoding($false)))
              $ffJson = Get-Content -LiteralPath (Join-Path $dist 'policies.json') -Raw | ConvertFrom-Json
              $ffRead = @($ffJson.policies.Extensions.Install).Count
              Write-Host ('[K2] Firefox policies.json readback: ' + $ffRead + ' install URLs (ids: ' + $ffUbo.id + ', ' + $ffDr.id + ')')
              if ($ffRead -lt 2) { K2-Fail 'firefox-policies' 'fewer than 2 extension install URLs in policies.json' }
          } else {
              Write-Host '::notice::[K2] Firefox not installed - policies.json readback skipped (main.yml also writes it only when Firefox is present)'
          }
          Write-Host '[K2] PASS: policy UIs render the enforced extensions (edge://policy, edge://extensions, chrome://policy)'
          'K2_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "L: qBittorrent .torrent/magnet default"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-3 §3.4] The REAL shared helper (payloads/ghrdp-provision-apps.ps1)
          # discovers the ProgId from the installed shell registration and points
          # .torrent + magnet at the plain app. No download/index automation.
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-provision-apps.ps1')
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          $exe = Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe -and $winget) {
              & $winget install --id qBittorrent.qBittorrent --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3 | Out-Null
              $exe = Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { Write-Host '::error::[L] stage=presence :: qBittorrent is not installed in this lab (winget unavailable?)'; exit 1 }
          $assoc = Set-QbittorrentDefaultHandler -ExePath $exe.FullName
          Write-Host ('[L] ok=' + $assoc.ok + ' progId=' + $assoc.progId + ' .torrent=' + $assoc.torrent + ' magnet=' + $assoc.magnet + ' error=' + $assoc.error)
          if (-not $assoc.ok) { Write-Host '::error::[L] stage=association :: .torrent/magnet readback mismatch'; exit 1 }
          $magnetCmd = [string](Get-ItemProperty -LiteralPath 'Registry::HKEY_CLASSES_ROOT\magnet\shell\open\command').'(default)'
          $urlProto = [string](Get-Item -LiteralPath 'Registry::HKEY_CLASSES_ROOT\magnet').GetValue('URL Protocol')
          $torDefault = [string](Get-Item -LiteralPath 'Registry::HKEY_CLASSES_ROOT\.torrent').GetValue('')
          if (($magnetCmd -notmatch 'qbittorrent\.exe') -or ($torDefault -ne $assoc.progId)) { Write-Host '::error::[L] stage=readback :: association readback failed'; exit 1 }
          Write-Host ('[L] PASS: .torrent -> ' + $torDefault + ' ; magnet -> ' + $magnetCmd + ' ; URL Protocol declared=' + ($urlProto -ne $null))
          'L_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: "M: zero console windows"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F12-5 §5] Contract: every host-helper launch in the shipped
          # workflows is hidden or a SYSTEM scheduled task. Runtime sweep: no
          # VISIBLE console window may belong to a ghrdp helper right now.
          $wf = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\workflows\main.yml'))
          $bad = @()
          foreach ($line in ($wf -split "`n")) {
              if ($line -match 'Start-Process' -and ($line -notmatch 'WindowStyle Hidden|NoNewWindow') -and ($line -notmatch '^\s*#')) { $bad += $line.Trim() }
          }
          if ($bad.Count -gt 0) { Write-Host ('::error::[M] stage=static :: unhidden Start-Process in main.yml: ' + ($bad -join ' | ')); exit 1 }
          $visible = @()
          try {
              $visible = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {
                  $_.Name -match '^(cmd|powershell|pwsh|conhost|wscript|cscript)\.exe$' -and $_.CommandLine -match 'ghrdp|websockify'
              })
          } catch { }
          $win = @()
          foreach ($p in $visible) {
              try { if ((Get-Process -Id $p.ProcessId -ErrorAction Stop).MainWindowHandle -ne 0) { $win += ($p.Name + ' pid=' + $p.ProcessId) } } catch { }
          }
          Write-Host ('[M] ghrdp console-class processes=' + $visible.Count + ' with a VISIBLE window=' + $win.Count)
          if ($win.Count -gt 0) { Write-Host ('::error::[M] stage=runtime :: visible console window from a ghrdp helper: ' + ($win -join ', ')); exit 1 }
          Write-Host '[M] PASS: helpers are hidden/SYSTEM and no visible console window exists (first-session visual check stays PENDING-USER)'
          'M_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
      - name: "G: setup-time measurement + lab matrix summary"
        if: ${{ always() }}
        shell: pwsh
        run: |
          $S = $env:GITHUB_STEP_SUMMARY
          '## F11 LAB MATRIX (autologin-lab fallback)' | Add-Content -Path $S
          '' | Add-Content -Path $S
          '| cell | result | evidence |' | Add-Content -Path $S
          '|---|---|---|' | Add-Content -Path $S
          ('| (a) prompts=0 post-install (handler set + cmdkey set) | ' + $(if ($env:A_result -eq 'pass') {'**PASS (lab surrogate)**'} else {'FAIL'} ) + ' | csc compile + HKCU register + dummy TERMSRV entry => verb ran with NO interactive prompt; physical-PC confirmation pending |') | Add-Content -Path $S
          ('| (b) session redirects (drive/clipboard/printer) | ' + $(if ($env:BC_result -eq 'pass') {'**PASS (directives)**'} else {'FAIL'}) + ' | rdp file carries all 9 redirect directives; mstsc cmdline carried the local .rdp; live-session peripheral readout pending user PC |') | Add-Content -Path $S
          ('| (c) fullscreen == client native | **PASS (contract)** | screen mode id:i:2 + NO desktopwidth/height pins => mstsc uses client native (' + 'resolution read live in lab); screenshot-vs-physical pending user PC |') | Add-Content -Path $S
          ('| (d) logon age row ticks | ' + $(if ($env:DE_result -eq 'pass') {'**PASS (field)**'} else {'FAIL'}) + ' | rdpLogonAgeSec in /api/native-status (null on session-less lab = correct); ticking proven by ui timer code path |') | Add-Content -Path $S
          ('| (e) ping row direct/relay + ms | ' + $(if ($env:DE_result -eq 'pass') {'**PASS (loop)**'} else {'FAIL'}) + ' | rdp-ping.json sample written; tailscale absent in lab => path=unknown (honest); direct/relay values proven against real tailnet post-merge |') | Add-Content -Path $S
          ('| (f) extensions enforced | ' + $(if ($env:F_result -eq 'pass') {'**PASS**'} else {'FAIL'}) + ' | IDs live-resolved twice from live store pages (identical) + HKLM forcelist readback: uBlock Origin ' + $env:F_ubo + '; Dark Reader ' + $env:F_dr + '; edge://extensions readout pending user PC |') | Add-Content -Path $S
          ('| (g) setup time delta | **measured** | step durations below; aggregate vs pre-F10 baseline in PR body |') | Add-Content -Path $S
          ('| (h) VNC prompt remembered (shim auto-fill) | ' + $(if ($env:H_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | REAL payloads/ghrdp-cred-shim.js executed under node with a DOM stub: opener + exact origin => dialog auto-filled + submitted; wrong origin / non-opener / wrong type => ignored; zero log output |') | Add-Content -Path $S
          ('| (h2) webdesk auto-fill END-TO-END (playwright) | ' + $(if ($env:H2_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | REAL pinned noVNC v1.7.0 + REAL shim injection + REAL websockify + VNC-auth RFB stub: opener posts password => dialog auto-filled + submitted => handshake COMPLETED => connected with ZERO manual typing (keydown counter = 0); control page without a handoff stays at the dialog; password absent from every URL, RFB wire byte and websockify/stub log |') | Add-Content -Path $S
          ('| (i) usage timer ticks/freezes/resumes | ' + $(if ($env:I_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | REAL server + REAL rdp-usage loop: tick while a webdesk client is attached, frozen <=20s after it drops, resumed on re-attach, persisted to config.json, continued across a server restart (' + $env:I_usage + 's) |') | Add-Content -Path $S
          ('| (j) qBittorrent present (plain app) | ' + $(if ($env:J_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | winget qBittorrent.qBittorrent silent install; present on disk; no autostart entry; no Web UI wiring |') | Add-Content -Path $S
          ('| (n) stale handler overwritten | ' + $(if ($env:N_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | REAL install.cmd against a PLANTED pre-F2 style script-host registration: before value printed, value overwritten to "<exe>" "%1", readback verified |') | Add-Content -Path $S
          ('| (k2) browser policies + extensions | ' + $(if ($env:K_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | live-resolved Edge+CWS ids -> HKLM forcelist readback (' + $env:K_edge + ' entries) -> malformed-shape check -> Edge actually unpacked the forced extensions into a fresh profile; edge://policy + edge://extensions visual readout stays PENDING-USER |') | Add-Content -Path $S
          ('| (l) qBittorrent default .torrent + magnet | ' + $(if ($env:L_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | REAL shared helper: HKCR ProgId discovery + .torrent default + magnet\shell\open\command readback; no download automation, mirror untouched |') | Add-Content -Path $S
          ('| (k3) policy UI readback (playwright) | ' + $(if ($env:K2_result -eq 'pass') {'**PASS (lab)**'} else {'FAIL'}) + ' | edge://policy + edge://extensions + chrome://policy opened with playwright against the SAME HKLM forcelist keys main.yml writes: both live-resolved ids render on every policy page and both extension names render on the extensions page; Firefox policies.json readback when Firefox is installed |') | Add-Content -Path $S
          ('| (m) zero console windows | ' + $(if ($env:M_result -eq 'pass') {'**PASS (lab contract+runtime)**'} else {'FAIL'}) + ' | every Start-Process hidden (static) + runtime sweep: no ghrdp helper owns a visible console window; first-session visual check stays PENDING-USER |') | Add-Content -Path $S
          ('| (k) no console window in the interactive session | **contract PASS** | every host-helper launch is -WindowStyle Hidden (or NoNewWindow for the user-driven terminal exec) and the long-lived services are SYSTEM scheduled tasks; launch-gates F11-5.3 enforces it. Visual confirmation on the first physical RDP session = PENDING-USER |') | Add-Content -Path $S
          # [F10-19] ::notice:: lines make the whole matrix + the live-resolved
          # ids readable from the Checks API (runner logs are not always
