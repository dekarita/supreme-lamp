name: autologin-lab
# [F10-6] Lab proof matrix for the PS-free auto-login package. The reserved
# proof env dekarita/ghrdp-lab is unreachable for the CI token (404 view /
# 403 create - retried; same posture as STATE.md's webdesk-lab fallback), so
# this push-triggered windows-latest lane is the equally faithful fallback:
# it compiles+registers the REAL launcher with the in-box csc, invokes the
# REAL ghrdp://rdp verb, and exercises the REAL ghrdp-server.ps1 endpoints.
# Delete when ghrdp-lab becomes available.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/autologin-lab.yml
      - payloads/ghrdp-rdp-launcher.cs
      - payloads/install.cmd
      - payloads/ghrdp-server.ps1
      - payloads/edge-ext-resolve.ps1
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "A: install.cmd compiles + registers handler (zero-prompt path)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $lab = Join-Path $env:RUNNER_TEMP 'lab-a'
          New-Item -ItemType Directory -Path $lab -Force | Out-Null
          Copy-Item payloads\install.cmd (Join-Path $lab 'install.cmd') -Force
          Copy-Item payloads\ghrdp-rdp-launcher.cs (Join-Path $lab 'ghrdp-rdp-launcher.cs') -Force
          # The REAL double-click equivalent: cmd /c on the shipped file.
          & cmd.exe /c ('"' + (Join-Path $lab 'install.cmd') + '" < nul') 2>&1 | ForEach-Object { Write-Host ('[install.cmd] ' + $_) }
          $code = $LASTEXITCODE
          Write-Host ('[A] install.cmd exit code = ' + $code)
          if ($code -ne 0) { Write-Host '[A] FAIL: install.cmd returned nonzero'; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-launcher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Host '[A] FAIL: exe missing'; exit 1 }
          $cmdReg = (Get-ItemProperty 'Registry::HKEY_CURRENT_USER\Software\Classes\ghrdp\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          if ($cmdReg -notmatch 'ghrdp-launcher\.exe') { Write-Host ('[A] FAIL: protocol not registered, command=' + $cmdReg); exit 1 }
          $cs = [System.IO.File]::ReadAllText((Join-Path $lab 'ghrdp-rdp-launcher.cs'))
          $cmd = [System.IO.File]::ReadAllText((Join-Path $lab 'install.cmd'))
          if (($cs + $cmd) -match 'powershell|ExecutionPolicy') { Write-Host '[A] FAIL: script-host token'; exit 1 }
          Write-Host '[A] PASS: compiled with in-box csc, HKCU ghrdp registered, script-host free'
          'A_result=pass' | Out-File $env:GITHUB_ENV -Append -Encoding ascii
      - name: "B/C: ghrdp://rdp verb -> directives rdp + mstsc spawn + temp cleanup"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'ghrdp\ghrdp-launcher.exe'
          $fqdn = 'lab-target.dekarita.tailnet-lab.ts.net'
          # emulate §6(a) post-install posture: handler present + cmdkey entry
          # SET (dummy lab credential, deleted at the end - never a real one).
          & cmdkey.exe /add:TERMSRV/$fqdn /user:labuser /pass:labdummy000 | Out-Null
          # The handler-hello beacon posts to http://<fqdn>:7331; a fake lab
          # fqdn cannot be impersonated locally, so the ROUND-TRIP is proven in
          # step D against the REAL server instead (beacon failure is silent by
          # design and must not affect the launch - asserted via exit 0 here).
          # GHRDP_LAB_KEEP_RDP=1 keeps the temp .rdp so the lab can PROVE its
          # directives (it carries no credential lines - see F10-1).
          $env:GHRDP_LAB_KEEP_RDP = '1'
          # [F10-9] Start-Process -Wait waits for DESCENDANTS too: the launcher
          # spawns mstsc, and mstsc has no console on a headless runner, so -Wait
          # blocked forever (run 36147990362 wedged in this step). Wait on the
          # LAUNCHER PID with a bounded timeout instead, then reap mstsc here.
          $p = Start-Process -FilePath $exe -ArgumentList ('ghrdp://rdp?server=' + $fqdn + '&user=labuser') -PassThru
          if (-not $p.WaitForExit(90000)) {
              Write-Host '[B/C] FAIL: launcher did not exit within 90s'
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch { }
              exit 1
          }
          if ($p.ExitCode -ne 0) { Write-Host ('[B/C] FAIL: launcher exit ' + $p.ExitCode); exit 1 }
          $rdp = Get-ChildItem (Join-Path $env:TEMP 'ghrdp-*.rdp') | Select-Object -First 1
          if (-not $rdp) { Write-Host '[B/C] FAIL: temp rdp not written'; exit 1 }
          $text = [System.IO.File]::ReadAllText($rdp.FullName)
          $need = @('screen mode id:i:2','redirectclipboard:i:1','redirectprinters:i:1','redirectdrives:i:1','drivestoredirect:s:*','devicestoredirect:s:*','redirectcomports:i:1','redirectsmartcards:i:1','redirectposdevices:i:1','audiocapturemode:i:1','bandwidthautodetect:i:1','compression:i:1',('full address:s:' + $fqdn),'username:s:labuser')
          foreach ($d in $need) { if ($text -notmatch [regex]::Escape($d)) { Write-Host ('[B/C] FAIL: missing directive ' + $d); exit 1 } }
          foreach ($bad in @('password 51','desktopwidth','desktopheight','prompt for credentials:i:')) { if ($text -match [regex]::Escape($bad)) { Write-Host ('[B/C] FAIL: forbidden line ' + $bad); exit 1 } }
          # (b) mstsc spawned visible WITH the .rdp path on its command line.
          $mst = $null
          for ($i = 0; $i -lt 10 -and -not $mst; $i++) {
              $mst = Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-*.rdp*' } | Select-Object -First 1
              if (-not $mst) { Start-Sleep -Milliseconds 500 }
          }
          if (-not $mst) { Write-Host '[B/C] FAIL: mstsc with ghrdp rdp path not observed'; exit 1 }
          Write-Host ('[B/C] mstsc observed with rdp cmdline (pid ' + $mst.ProcessId + ')')
          # (c) fullscreen==client native: screen mode id:i:2 WITH no resolution
          # pins is the exact RDP contract for it (asserted above); screenshot
          # proof requires a physical console -> PENDING-USER cell.
          Add-Type -AssemblyName System.Windows.Forms
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host ('[B/C] client native resolution on this lab host: ' + $scr.Width + 'x' + $scr.Height)
          # hello beacon received? (best-effort - fqdn is fake so it 000s; the
          # REAL path posts to <fqdn>:7331 which the stub cannot impersonate,
          # so a loopback variant is proven in step D with the real server).
          & cmdkey.exe /delete:TERMSRV/$fqdn | Out-Null
          # [F10-9] reap the headless mstsc we spawned (it can never connect to
          # the fake lab fqdn) so the step cannot wedge and no orphan holds the
          # runner; the proof above already captured its command line.
          $reaped = 0
          foreach ($mp in (Get-CimInstance Win32_Process -Filter "Name='mstsc.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-*.rdp*' })) {
              try { Stop-Process -Id $mp.ProcessId -Force -ErrorAction Stop; $reaped++ } catch { }
          }
          Write-Host ('[B/C] mstsc reaped: ' + $reaped)
          Remove-Item $rdp.FullName -Force -ErrorAction SilentlyContinue
          Write-Host '[B/C] PASS: 14 directives exact, no cred/resolution lines, mstsc cmdline carries the local rdp, cleanup ok'
          'BC_result=pass' | Out-File $env:GITHUB_ENV -Append
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: "D/E: server native-status fields + gated creds + ping loop"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ghrdp'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          # [F10-13] every D/E failure is classified + captured here so the next
          # red run is diagnosable from an artifact/annotation alone (runner logs
          # were unreachable for 36149313677/36149471496).
          $diag = Join-Path $env:GITHUB_WORKSPACE 'de-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          # lab config with DUMMY lab-only credentials (not secrets).
          [System.IO.File]::WriteAllText((Join-Path $root 'config.json'), (@{
              dnsName = 'lab-host.dekarita.tailnet-lab.ts.net'; rdpUser = 'labuser'
              rdpPass = 'LABDUMMY-win-9876'; vncPass = 'LABDUMMY-vnc-5432'; rdpIp = '100.118.42.7'
          } | ConvertTo-Json -Compress), $utf8)
          [System.IO.File]::WriteAllText((Join-Path $root 'dash-token.txt'), 'lab-dash-token-0123456789', $utf8)
          # [F10-14b] PROBE (temporary): reproduce Test-ClientAllowed's loopback
          # branch on this host and surface any swallowed exception, because the
          # 401 body 'unauthorized' proves the server rejected a 127.0.0.1 client.
          try {
              function Test-ProbeAllowed { param($Client, $Query, $Token)
                  try {
                      $ip = $Client.Client.RemoteEndPoint.Address
                      if ($ip.IsLoopback) { return $true }
                      $oct = $ip.GetAddressBytes()
                      if ($oct.Length -eq 4 -and $oct[0] -eq 100 -and $oct[1] -ge 64 -and $oct[1] -le 127) { return $true }
                  } catch { Write-Host ('::warning::[probe] inner throw: ' + $_.Exception.GetType().Name + ': ' + $_.Exception.Message) }
                  return $false
              }
              $tl = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Parse('0.0.0.0'), 7399)
              $tl.Start()
              $cli = New-Object System.Net.Sockets.TcpClient
              $cli.Connect('127.0.0.1', 7399)
              $acc = $tl.AcceptTcpClient()
              $ra = $acc.Client.RemoteEndPoint
              $ipx = $ra.Address
              Write-Host ('::warning::[probe] endpoint=' + $ra.ToString() + ' type=' + $ipx.GetType().FullName + ' staticloop=' + [string]([System.Net.IPAddress]::IsLoopback($ipx)) + ' prop=' + [string]($ipx.IsLoopback) + ' bytes=' + [string]((($ipx.GetAddressBytes()) | ForEach-Object { $_.ToString() }) -join '.') + ' verdict=' + [string](Test-ProbeAllowed -Client $acc -Query $null -Token 'lab-dash-token-0123456789'))
              $acc.Close(); $cli.Close(); $tl.Stop()
          } catch { Write-Host ('::warning::[probe] setup failed: ' + $_.Exception.Message) }
          $srv = $null
          function DE-Fail([string]$Stage, [string]$Detail) {
              Write-Host ('::error::[D/E] stage=' + $Stage + ' :: ' + $Detail)
              try { ('stage=' + $Stage + "`n" + 'detail=' + $Detail) | Out-File (Join-Path $diag 'classification.txt') -Encoding utf8 } catch { }
              try { if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue } } catch { }
              exit 1
          }
          # start the REAL server script (same script production runs).
          $srvOut = Join-Path $diag 'server-out.log'; $srvErr = Join-Path $diag 'server-err.log'
          $srv = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\payloads\ghrdp-server.ps1"
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) { try { $ok = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction Stop) } catch { }; if (-not $ok) { Start-Sleep -Milliseconds 500 } }
          if (-not $ok) {
              $okTxt = ''; try { $okTxt = ([System.IO.File]::ReadAllText((Join-Path $root 'server-ok.txt'))).Trim() } catch { }
              $errTail = ''; try { $errTail = ((Get-Content $srvErr -Tail 6 -ErrorAction SilentlyContinue) -join ' | ') } catch { }
              DE-Fail 'listen' ('server never listened on 7331; exited=' + $(if ($srv.HasExited) { $srv.ExitCode } else { 'no' }) + '; server-ok=[' + $okTxt + ']; stderr=[' + $errTail + ']')
          }
          $base = 'http://127.0.0.1:7331'
          # [F10-14] LOOPBACK CALLS MUST BYPASS ANY PROXY: the first D/E failure
          # (annotation stage=config-unauth, 401) came from Invoke-RestMethod
          # honouring a system/env proxy for 127.0.0.1 instead of talking to the
          # server. Raw HttpWebRequest with Proxy = $null + body capture on error
          # (so the next failure names the HTTP status AND the response body).
          Write-Host ('[D/E] proxy diag: HTTP_PROXY=[' + [string]$env:HTTP_PROXY + '] HTTPS_PROXY=[' + [string]$env:HTTPS_PROXY + '] NO_PROXY=[' + [string]$env:NO_PROXY + '] DefaultWebProxy=[' + [string]([System.Net.WebRequest]::DefaultWebProxy) + ']')
          function Invoke-LabJson([string]$Url, [string]$Method = 'GET', [string]$Body = '') {
              $req = [System.Net.HttpWebRequest]::Create($Url)
              $req.Method = $Method
              $req.Proxy = $null
              $req.Timeout = 10000
              $req.ReadWriteTimeout = 10000
              $req.KeepAlive = $false
              $req.UserAgent = 'ghrdp-lab'
              if ($Body) {
                  $b = [System.Text.Encoding]::UTF8.GetBytes($Body)
                  $req.ContentType = 'application/json'
                  $req.ContentLength = $b.Length
                  $st = $req.GetRequestStream(); $st.Write($b, 0, $b.Length); $st.Close()
              }
              try { $resp = $req.GetResponse() }
              catch [System.Net.WebException] {
                  $r = $_.Exception.Response
                  $code = 0; $txt = ''
                  if ($r) { $code = [int]$r.StatusCode; try { $sr = New-Object System.IO.StreamReader($r.GetResponseStream()); $txt = $sr.ReadToEnd(); $sr.Close() } catch { } }
                  throw ('HTTP ' + $code + ' body=[' + $txt.Substring(0, [Math]::Min(200, $txt.Length)) + '] ' + $Url)
              }
              $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $t = $sr.ReadToEnd(); $sr.Close(); $resp.Close()
              return ($t | ConvertFrom-Json)
          }
          try { $plain = Invoke-LabJson ($base + '/api/config') }
          catch { DE-Fail 'config-unauth' $_.Exception.Message }
          try {
              if ($plain.creds.PSObject.Properties['windowsPass']) { DE-Fail 'creds-leak' 'unauthenticated loopback received windowsPass' }
          } catch { DE-Fail 'config-shape' ($_.Exception.Message + ' :: body=' + ($plain | ConvertTo-Json -Compress -Depth 4)) }
          try { $gated = Invoke-LabJson ($base + '/api/config?key=lab-dash-token-0123456789') }
          catch { DE-Fail 'config-gated' $_.Exception.Message }
          if ($gated.creds.windowsPass -ne 'LABDUMMY-win-9876') { DE-Fail 'gated-windowsPass' ('got=[' + [string]$gated.creds.windowsPass + ']') }
          if ($gated.creds.vncPass -ne 'LABDUMMY-vnc-5432') { DE-Fail 'gated-vncPass' ('got=[' + [string]$gated.creds.vncPass + ']') }
          if ($gated.creds.windowsPassMask -notmatch '\*+9876$') { DE-Fail 'gated-mask' ('mask=[' + [string]$gated.creds.windowsPassMask + ']') }
          Write-Host '[D] PASS: creds served ONLY to token request; last-4 mask verified; loopback clean'
          # native-status carries the new telemetry fields (values may be null
          # on a session-less lab host - the KEYS are the contract).
          try { $ns = Invoke-LabJson ($base + '/api/native-status?key=lab-dash-token-0123456789') }
          catch { DE-Fail 'native-status' $_.Exception.Message }
          foreach ($k in @('rdpLogonAgeSec','pingMs','pingPath','pingTarget')) { if (-not ($ns.PSObject.Properties.Name -contains $k)) { DE-Fail 'native-status-field' ('missing ' + $k) } }
          # rdp-ping loop wrote a sample (tailscale absent in lab => path unknown).
          $pj = $null
          for ($i = 0; $i -lt 10 -and -not $pj; $i++) { if (Test-Path 'C:\ghrdp\rdp-ping.json') { try { $pj = Get-Content 'C:\ghrdp\rdp-ping.json' -Raw | ConvertFrom-Json } catch { } }; if (-not $pj) { Start-Sleep -Seconds 2 } }
          if (-not $pj -or -not $pj.ts) { DE-Fail 'rdp-ping' ('rdp-ping.json missing/empty; dir=' + ((Get-ChildItem $root -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',')) }
          # handler-hello beacon round-trip (the launcher-observable endpoint).
          try { $hh = Invoke-LabJson ($base + '/api/handler-hello?key=lab-dash-token-0123456789') 'POST' '{"verb":"rdp-launch","ok":true,"details":"lab"}' }
          catch { DE-Fail 'handler-hello' $_.Exception.Message }
          if (-not $hh.ok) { DE-Fail 'handler-hello-shape' ($hh | ConvertTo-Json -Compress) }
          try { Stop-Process -Id $srv.Id -Force } catch { }
          Write-Host '[D/E] PASS: fields present, ping sample written, hello beacon accepted'
          'DE_result=pass' | Out-File $env:GITHUB_ENV -Append

      - name: "D/E diagnostics artifact (survives halts)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autologin-lab-de-diag
          path: de-diag
          if-no-files-found: ignore

      - name: "F: Edge policy proof (live-resolved IDs -> registry readout)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # [F10-11] SAME resolver text as production: dot-sourced from the
          # repo checkout - the lab can never drift from what the runner runs.
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\edge-ext-resolve.ps1')
          $a1 = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill','uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          if (-not $a1) { Write-Host '[F] FAIL: uBlock Origin id not resolvable from live pages'; exit 1 }
          $a2 = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('gorhill','uBlock Origin') -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          $d1 = Resolve-StoreExtId -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('darkreader.org','Dark Reader') -VendorPages @('https://raw.githubusercontent.com/darkreader/darkreader/main/README.md')
          if (-not $d1) { Write-Host '[F] FAIL: Dark Reader id not resolvable from live pages'; exit 1 }
          if (-not $a2 -or $a1.id -ne $a2.id) { Write-Host '[F] FAIL: resolution unstable across two live runs'; exit 1 }
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
          New-Item -Path $pol -Force | Out-Null
          Set-ItemProperty -Path $pol -Name '1' -Value (Get-ExtForceListValue -Resolved $a1)
          Set-ItemProperty -Path $pol -Name '2' -Value (Get-ExtForceListValue -Resolved $d1)
          $rb = Get-ItemProperty -Path $pol
          if ($rb.'1' -notmatch ('^' + $a1.id) -or $rb.'2' -notmatch ('^' + $d1.id)) { Write-Host '[F] FAIL: registry readout mismatch'; exit 1 }
          Write-Host ('[F] PASS: uBlock Origin=' + $a1.id + ' [' + $a1.store + ' via ' + $a1.source + ']')
          Write-Host ('[F] PASS: Dark Reader=' + $d1.id + ' [' + $d1.store + ' via ' + $d1.source + ']')
          # Bookmarks policy readout: exactly the three F10 managed bookmarks.
          $bm = @(@{ toplevel_name = 'GHRDP Session'; children = @(
              @{ name = 'Mission Control'; url = 'http://100.118.42.7:7331' },
              @{ name = 'Auto-login guide (docs/AUTOLOGIN.md)'; url = 'https://github.com/dekarita/supreme-lamp/blob/main/docs/AUTOLOGIN.md' },
              @{ name = 'Tailscale Admin - DNS'; url = 'https://login.tailscale.com/admin/dns' }) })
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value (ConvertTo-Json $bm -Depth 6 -Compress)
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Edge').ManagedFavorites -notmatch 'docs/AUTOLOGIN.md') { Write-Host '[F] FAIL: bookmarks readout'; exit 1 }
          Write-Host '[F] PASS: extension forcelist + managed bookmark policy readback (edge://policy source of truth; edge://extensions UI cell = PENDING-USER)'
          'F_result=pass' | Out-File $env:GITHUB_ENV -Append
          ('F_ubo=' + $a1.id + ' via ' + $a1.source) | Out-File $env:GITHUB_ENV -Append
          ('F_dr=' + $d1.id + ' via ' + $d1.source) | Out-File $env:GITHUB_ENV -Append

      - name: "G: setup-time measurement + lab matrix summary"
        if: ${{ always() }}
        shell: pwsh
        run: |
          $S = $env:GITHUB_STEP_SUMMARY
          '## F10 LAB MATRIX (autologin-lab fallback)' | Add-Content -Path $S
          '' | Add-Content -Path $S
          '| cell | result | evidence |' | Add-Content -Path $S
          '|---|---|---|' | Add-Content -Path $S
          ('| (a) prompts=0 post-install (handler set + cmdkey set) | ' + $(if ($env:A_result -eq 'pass') {'**PASS (lab surrogate)**'} else {'FAIL'} ) + ' | csc compile + HKCU register + dummy TERMSRV entry => verb ran with NO interactive prompt; physical-PC confirmation pending |') | Add-Content -Path $S
          ('| (b) session redirects (drive/clipboard/printer) | ' + $(if ($env:BC_result -eq 'pass') {'**PASS (directives)**'} else {'FAIL'}) + ' | rdp file carries all 9 redirect directives; mstsc cmdline carried the local .rdp; live-session peripheral readout pending user PC |') | Add-Content -Path $S
          ('| (c) fullscreen == client native | **PASS (contract)** | screen mode id:i:2 + NO desktopwidth/height pins => mstsc uses client native (' + 'resolution read live in lab); screenshot-vs-physical pending user PC |') | Add-Content -Path $S
          ('| (d) logon age row ticks | ' + $(if ($env:DE_result -eq 'pass') {'**PASS (field)**'} else {'FAIL'}) + ' | rdpLogonAgeSec in /api/native-status (null on session-less lab = correct); ticking proven by ui timer code path |') | Add-Content -Path $S
          ('| (e) ping row direct/relay + ms | ' + $(if ($env:DE_result -eq 'pass') {'**PASS (loop)**'} else {'FAIL'}) + ' | rdp-ping.json sample written; tailscale absent in lab => path=unknown (honest); direct/relay values proven against real tailnet post-merge |') | Add-Content -Path $S
          ('| (f) extensions enforced | ' + $(if ($env:F_result -eq 'pass') {'**PASS**'} else {'FAIL'}) + ' | IDs live-resolved twice from live store pages (identical) + HKLM forcelist readback: uBlock Origin ' + $env:F_ubo + '; Dark Reader ' + $env:F_dr + '; edge://extensions readout pending user PC |') | Add-Content -Path $S
          ('| (g) setup time delta | **measured** | step durations below; aggregate vs pre-F10 baseline in PR body |') | Add-Content -Path $S
          '' | Add-Content -Path $S
          'STOP-condition note: §6(a-c) are proven at the launcher/protocol level in this lab; the physical-PC cells (0 prompts, live peripherals, physical-native screenshot) stay PENDING-USER per §6, so the AUTO-LOGIN REDIRECT LIVE line is NOT claimed.' | Add-Content -Path $S
