            echo "::error title=F57 Explorer ops::${detail}"
            exit 1
          fi
          echo 'F57 gates PASS: command-bar=live, ctx-menu=live, preview=full, drag-drop=live, trash=soft+30d, undo=20, queue=durable'

      # ---- F60 GATE 1 (counted): the warm-runner provisioning lane. The pin file ----
      # ---- must be fail-closed shaped (https, explicit versions, no '-latest-', ----
      # ---- empty pin = bootstrap state, never an invented digest), the provision ----
      # ---- workflow must halt on a broad SP scope before touching Azure, mask every ----
      # ---- secret, be fail-closed on BOOTSTRAP_OK/FAILED, poll 30x10s, deny 3389 and ----
      # ---- all inbound Internet, and the bootstrap must be idempotent + pinned. ----
      - name: F60 warm-runner provisioning + pinned bootstrap gates
        shell: bash
        run: |
          set -euo pipefail
          echo '===== F60 gate: provisioning workflow + pinned warm-VM bootstrap ====='
          for f in .github/workflows/provision-warm-runner.yml .github/workflows/f60-warm-pins-bootstrap.yml scripts/f60-bootstrap.ps1 scripts/f60-scrub-runcommand.ps1 payloads/f60-warm-pins.json payloads/f59-prebuilt-pins.json docs/F60-OPERATOR-SETUP.md; do
            test -f "$f" || { echo "F60: $f missing" >&2; exit 1; }
          done
          # YAML must actually parse (PyYAML is preinstalled on ubuntu-latest; if it is
          # ever missing this gate installs it or FAILS CLOSED - it must not silently skip).
          for yml in .github/workflows/provision-warm-runner.yml .github/workflows/f60-warm-pins-bootstrap.yml .github/workflows/warm-dispatch.yml; do
            python3 -c "
          import sys, yaml
          try:
              yaml.safe_load(open('$yml'))
          except ModuleNotFoundError:
              print('F60: PyYAML missing - installing for the parse gate')
              import subprocess
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', '--user', 'pyyaml'], check=True)
              yaml.safe_load(open('$yml'))
          except Exception as e:
              print('F60: $yml does not parse: ' + str(e), file=sys.stderr)
              sys.exit(1)
          print('F60 yaml parse ok: $yml')
          "
          done
          wf=.github/workflows/provision-warm-runner.yml
          for tok in "workflow_dispatch:" "action:" "create" "verify" "teardown" "region:" "southeastasia" "centralindia" "vm_size:" "Standard_B2s" "timeout-minutes: 45" "contents: read" "actions: write" "concurrency:" "runs-on: ubuntu-latest" "uses: actions/checkout@v4" "az login --service-principal" "az account set --subscription" "az logout" "NO THIRD-PARTY ACTIONS" "runner_token" "RUNNER_REGISTRATION_TOKEN" "secrets.AZURE_CREDENTIALS" "Preflight" "f59-prebuilt-pins.json" "f60-warm-pins.json" "SP scope too broad" "F60 HALT" "DenyRdpInternet" "DenyAllInternetInbound" "default-allow-rdp" "MicrosoftWindowsServer:WindowsServer:2022-datacenter" "--os-disk-size-gb 128" "--data-disk-sizes-gb 32" "--public-ip-sku Standard" "--no-wait" "az vm wait" "registration-token" "::add-mask::" "az vm run-command invoke" "RunPowerShellScript" "@scripts/f60-bootstrap.ps1" "BOOTSTRAP_OK" "BOOTSTRAP_FAILED" "f60-scrub-runcommand.ps1" "seq 1 30" "sleep 10" "F60 STOP" "MagicDNS hostname" "runner id" "temporary public IP" "az group delete" "NO ARC / NO Kubernetes / NO GitHub Larger Runners"; do
            grep -qF -- "$tok" "$wf" || { echo "F60: provision-warm-runner.yml missing: $tok" >&2; exit 1; }
          done
          # F60 references NO third-party action. A mutable tag such as
          # azure/login@v2 both (a) makes GitHub reject the whole file when the repo's
          # Actions policy only allows GitHub-authored actions - the run then dies in
          # 0 s as "workflow file issue" and the workflow cannot even be dispatched -
          # and (b) contradicts F60's own pinning rule. `az` is preinstalled on
          # ubuntu-latest, so the SP login is plain CLI.
          third=$(grep -hE '^[[:space:]]*uses: ' .github/workflows/provision-warm-runner.yml .github/workflows/warm-dispatch.yml .github/workflows/f60-warm-pins-bootstrap.yml | grep -vE 'uses: actions/' || true)
          test -z "$third" || { echo "F60: an F60 workflow references a non-actions/* action:" >&2; printf '%s\n' "$third" >&2; exit 1; }
          echo 'F60 action-provenance gate PASS: every uses: in the three F60 workflows is actions/*'
          # ... and every permissions key must be one GitHub actually accepts: an
          # unknown key (e.g. `administration`) invalidates the entire workflow file.
          python3 - <<'PYEOF'
          import sys, yaml
          ok = {'actions', 'attestations', 'checks', 'contents', 'deployments', 'discussions',
                'id-token', 'issues', 'metadata', 'packages', 'pages', 'pull-requests',
                'repository-projects', 'security-events', 'statuses'}
          files = ['.github/workflows/provision-warm-runner.yml',
                   '.github/workflows/warm-dispatch.yml',
                   '.github/workflows/f60-warm-pins-bootstrap.yml']
          for f in files:
              d = yaml.safe_load(open(f))
              def check(perms, where, f=f):
                  for k in (perms or {}):
                      if k not in ok:
                          print('F60: ' + f + ' ' + where + ' declares an unknown permissions key: ' + str(k))
                          sys.exit(1)
              check(d.get('permissions'), 'at workflow level')
              for jn, j in (d.get('jobs') or {}).items():
                  check(j.get('permissions'), 'in job ' + str(jn))
