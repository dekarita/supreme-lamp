          '#### Paste this in your LOCAL browser address bar:' >> $S; '' >> $S; '```' >> $S; $ghrdp >> $S; '```' >> $S; '' >> $S
          ('IP: ' + $ip + '   User: ' + $user + '   Pass: ' + $pass) >> $S; '' >> $S
          if ($cfg.mirror) { ('Mirror ON. Index: ' + $cfg.rentryUrl) >> $S }
          SUMMARYEOF

      - name: Write ghrdp installer (local PC protocol connector)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-install.ps1" <<'INSTALLEOF'
          param()
          try {
            $dir = Join-Path $env:LOCALAPPDATA 'ghrdp'; New-Item -ItemType Directory -Path $dir -Force | Out-Null; $helperPath = Join-Path $dir 'ghrdp.ps1'
            $helper = @'
          param([string]$url)
          if ($url -match '^ghrdp://([^/]+)/([^/]+)/(.+)$') { $ip = $Matches[1]; $user = [uri]::UnescapeDataString($Matches[2]); $pass = [uri]::UnescapeDataString($Matches[3]); cmdkey /generic:TERMSRV/$ip /user:$user /pass:$pass | Out-Null; Start-Process "$env:windir\System32\mstsc.exe" "/v:$ip" }
          '@
            Set-Content -Path $helperPath -Value $helper -Encoding ASCII
            $root = 'HKCU:\Software\Classes\ghrdp'; New-Item -Path $root -Force | Out-Null; Set-Item -Path $root -Value 'URL:GitHub RDP Connect'; New-ItemProperty -Path $root -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null; New-Item -Path "$root\shell\open\command" -Force | Out-Null
            $pwsh = (Get-Command powershell.exe -ErrorAction SilentlyContinue).Source; if (-not $pwsh) { $pwsh = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' }
            Set-Item -Path "$root\shell\open\command" -Value "`"$pwsh`" -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$helperPath`" `"%1`""
            $ok = [bool](Get-ItemProperty -Path "$root\shell\open\command" -ErrorAction SilentlyContinue); $ok = $ok -and (Test-Path $helperPath)
            Write-Host ''; if ($ok) { Write-Host 'SUCCESS - RDP connector installed. Now click the ghrdp link again.' -ForegroundColor Green; Write-Host 'If the browser asks "Open app?" tick Always-allow + Open once.' -ForegroundColor Yellow } else { Write-Host 'INSTALL LOOKS INCOMPLETE - re-run via Right-click -> Run with PowerShell.' -ForegroundColor Red }
          } catch { Write-Host "INSTALL ERROR: $($_.Exception.Message)"; Write-Host 'Common fix: Set-ExecutionPolicy -Scope CurrentUser Bypass -Force' -ForegroundColor Cyan }
          try { Read-Host 'Press Enter to close' } catch {}
          INSTALLEOF

