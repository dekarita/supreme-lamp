              assert i not in earlier, ('collision with an earlier additive id', i)
              assert i not in parent and i.replace('.', '-') not in parent, ('219 collision', i)
          tmpl = arr('src/pages/file-explorer/ids.ops.ts', 'F57_OPS_TEMPLATES')
          assert tmpl and set(tmpl) <= set(ops), 'F57 template missing from the ops inventory'
          print('F57 ops ids:', len(ops), 'additive entries, collision-free')
          PY
          # §5 i18n: 78 new operations keys x 2 catalogs, byte-verified Sinhala.
          python3 - <<'PY'
          import json, re
          def flat(d, p=''):
              out = {}
              for k, v in d.items():
                  if isinstance(v, dict): out.update(flat(v, p + k + '.'))
                  else: out[p + k] = str(v)
              return out
          fe = flat(json.load(open('src/i18n/en.json', encoding='utf-8')))
          fs = flat(json.load(open('src/i18n/si.json', encoding='utf-8')))
          en = sorted(k for k in fe if k.startswith('files.ops.'))
          si = sorted(k for k in fs if k.startswith('files.ops.'))
          assert en == si, ('files.ops en/si key sets drifted', len(en), len(si))
          assert len(en) == 78, ('files.ops key count', len(en))
          for k in si:
              v = fs[k]
              assert v.strip(), ('empty si value', k)
              assert v.encode('utf-8').decode('utf-8') == v, ('si byte round-trip', k)
              assert sorted(re.findall(r'\{\{\s*\w+\s*\}\}', v)) == sorted(re.findall(r'\{\{\s*\w+\s*\}\}', fe[k])), ('placeholder drift', k)
          assert any(re.search(r'[\u0D80-\u0DFF]', fs[k]) for k in si), 'si ops keys must carry Sinhala'
          print('F57 i18n:', len(en), 'ops keys x 2 catalogs, parity OK')
          PY
          # §5 node lab: id lock + i18n + op fence + gate wiring, against the
