<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>GHRDP Terminal</title>
<style>
:root{
 --ink:#eef2f7;--mut:#9aa6b8;--acc:#4f8cff;--acc2:#22d3ee;--ok:#34d399;--bad:#f87171;
 --line:rgba(255,255,255,.16);--line-hi:rgba(255,255,255,.24);
 --glass:rgba(255,255,255,.08);--glass-hi:rgba(255,255,255,.14);
 --spring:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;color:var(--ink);background:#05070d;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
body::before{
 content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(40px) saturate(1.6);
 background:
  radial-gradient(48vw 48vw at 12% 18%,rgba(34,211,238,.30),transparent 60%),
  radial-gradient(46vw 46vw at 82% 32%,rgba(79,140,255,.28),transparent 60%),
  radial-gradient(60vw 60vw at 50% 92%,rgba(167,139,250,.22),transparent 60%);
 animation:drift 18s ease-in-out infinite alternate;
}
@keyframes drift{
 0%{transform:translate3d(0,0,0) scale(1)}
 100%{transform:translate3d(4vw,-3vh,0) scale(1.06)}
}
.glass{
 background:var(--glass);
 border:1px solid var(--line);
 border-radius:18px;
 backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
 box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
}
@supports (backdrop-filter: url(#liquid-refraction)){
 .glass{backdrop-filter:url(#liquid-refraction) blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6)}
}
@supports not (backdrop-filter: blur(1px)){
 .glass{background:rgba(20,22,28,.92);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (prefers-reduced-transparency: reduce){
 body::before{display:none}
 .glass{background:rgba(20,22,28,.92);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (prefers-reduced-motion: reduce){
 body::before{animation:none}
}
.page{display:flex;flex-direction:column;height:100%;padding:12px;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.bar .grow{flex:1;min-width:220px}
input,select,textarea,button{
 font:400 13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
 color:var(--ink);
}
input,select,textarea{
 background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
 padding:8px 12px;outline:none;transition:border-color .18s var(--spring),background .18s var(--spring),box-shadow .18s var(--spring);
}
input:focus,select:focus,textarea:focus{
 border-color:rgba(34,211,238,.6);background:rgba(0,0,0,.5);box-shadow:0 0 0 3px rgba(34,211,238,.20)
}
button{
 appearance:none;cursor:pointer;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--ink);
 background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
 border:1px solid rgba(255,255,255,.20);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
 transition:transform .12s var(--spring),background .18s var(--spring),border-color .18s var(--spring),box-shadow .18s var(--spring);
}
button:hover{background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.14));border-color:var(--line-hi)}
button:active{transform:scale(.97)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(34,211,238,.35),inset 0 1px 0 rgba(255,255,255,.16)}
button.primary{
 background:linear-gradient(180deg,#4f8cff,#2f6bff);border-color:transparent;color:#fff;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 6px 18px rgba(47,107,255,.35);
}
button.primary:hover{background:linear-gradient(180deg,#5f97ff,#3a75ff)}
.pill{
 display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
 border:1px solid var(--line);background:var(--glass);font-size:11px;color:var(--mut);
 font-variant-numeric:tabular-nums;
}
.pill b{color:var(--ink)}
label.k{color:var(--mut);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.paste{padding:10px 12px;flex:0 0 26vh;display:flex;flex-direction:column;gap:8px}
.paste textarea{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;resize:none}
.out{
 flex:1;min-height:0;
 background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:16px;
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
}
.out .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.out .body{flex:1;min-height:0;overflow:auto;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:12px;padding:12px}
.out pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;color:#e8f2f7;white-space:pre-wrap;word-break:break-all}
.out pre.stderr{color:#fda4af;margin-top:12px;border-top:1px dashed rgba(248,113,113,.35);padding-top:10px}
.pill.ok b{color:var(--ok)}.pill.bad b{color:var(--bad)}
.hint{font-size:11px;color:var(--mut);padding:0 4px}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <filter id="liquid-refraction" x="0%" y="0%" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" seed="4"/>
  <feDisplacementMap in="SourceGraphic" scale="8"/>
  <feSpecularLighting surfaceScale="2" specularConstant=".35" specularExponent="20" lighting-color="#ffffff" result="spec">
   <feDistantLight azimuth="235" elevation="55"/>
  </feSpecularLighting>
  <feComposite in="spec" in2="SourceGraphic" operator="in" result="specIn"/>
  <feColorMatrix in="specIn" type="matrix" values="1 .05 0 0 0  0 1 .05 0 0  .05 0 1 0 0  0 0 0 .5 0"/>
 </filter>
</svg>
</head>
<body>
<div class="page">
 <section class="glass bar" role="toolbar" aria-label="Command bar">
  <label class="k">Inline</label>
  <input id="inCmd" class="grow" placeholder="whoami; Get-Date; Get-Process | select -First 3" autocomplete="off" spellcheck="false">
  <button class="primary" id="btnRunCmd">Run Cmd</button>
  <label class="k">File</label>
  <input id="inFile" class="grow" placeholder="C:\ghrdp\ghrdp-pub2.ps1" autocomplete="off" spellcheck="false">
  <button id="btnRunFile">Run File</button>
  <label class="k">Session</label>
  <select id="inSession"><option value="system">SYSTEM (0)</option><option value="interactive">INTERACTIVE (active)</option></select>
  <label class="k">Timeout</label>
  <input id="inTimeout" type="number" min="1000" max="300000" step="1000" value="60000" style="width:100px" title="ms (max 300000)">
  <button id="btnRunPaste">Run Paste</button>
  <button id="btnCopyOut">Copy Out</button>
  <span class="pill" id="pillWho"><span>token:</span><b id="tokWho">…</b></span>
 </section>

 <section class="glass paste" aria-label="Paste script">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
   <label class="k" for="paste">Paste multi-line PowerShell here for Run Paste (UTF-8, base64-encoded before send)</label>
   <div class="hint">Ctrl/Cmd+Enter = Run Paste · Ctrl/Cmd+K = clear output</div>
  </div>
  <textarea id="paste" spellcheck="false" placeholder="# multi-line script
Get-Location
Get-Date
1..5 | ForEach-Object { $_ * $_ }"></textarea>
 </section>

 <section class="out" aria-live="polite" aria-label="Execution output">
  <div class="head">
   <span class="pill" id="pillExit"><span>exit:</span><b id="mExit">—</b></span>
   <span class="pill" id="pillTo"><span>timedOut:</span><b id="mTo">—</b></span>
   <span class="pill"><span>duration:</span><b id="mMs">— ms</b></span>
   <span class="pill"><span>session:</span><b id="mSess">—</b></span>
   <span class="pill"><span>scriptPath:</span><b id="mFile">—</b></span>
  </div>
  <div class="body" id="body"><pre id="stdout">Ready. Enter a command above and press Run Cmd.</pre></div>
 </section>
</div>

<script>
(function(){
 "use strict";
 var qs = new URLSearchParams(location.search);
 var token = qs.get('token') || '';
 var tokWho = document.getElementById('tokWho');
 tokWho.textContent = token ? (token.length > 24 ? token.slice(0,20) + '…' : token) : '(missing)';
 tokWho.title = token || 'no token in URL';

 function $(id){ return document.getElementById(id); }
 function show(resp){
  var stdout = String(resp.output || '');
  var stderr = String(resp.error || '');
  var body = $('body');
  body.innerHTML = '';
  var preOut = document.createElement('pre');
  preOut.id = 'stdout';
  preOut.textContent = stdout || '(no stdout)';
  body.appendChild(preOut);
  if (stderr) {
   var preErr = document.createElement('pre');
   preErr.className = 'stderr';
   preErr.textContent = 'STDERR:\n' + stderr;
   body.appendChild(preErr);
  }
  $('mExit').textContent = (resp.exitCode === null || resp.exitCode === undefined) ? '—' : String(resp.exitCode);
  $('mTo').textContent = resp.timedOut ? 'yes' : 'no';
  $('mMs').textContent = (Number(resp.durationMs) || 0) + ' ms';
  $('mSess').textContent = resp.session || '—';
  $('mFile').textContent = resp.scriptPath || '—';
  $('pillExit').className = 'pill ' + ((resp.exitCode === 0) ? 'ok' : (resp.exitCode ? 'bad' : ''));
  $('pillTo').className = 'pill ' + (resp.timedOut ? 'bad' : 'ok');
 }
 function loading(){
  var body = $('body');
  body.innerHTML = '<pre id="stdout" style="color:#9aa6b8">running…</pre>';
  $('mExit').textContent = '…'; $('mTo').textContent = '…'; $('mMs').textContent = '… ms'; $('mSess').textContent = '…'; $('mFile').textContent = '…';
 }
 function utf8ToB64(s){ return btoa(unescape(encodeURIComponent(String(s || '')))); }
 async function run(payload){
  loading();
  try {
   var r = await fetch('/terminal-exec', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(payload),
   });
   if (r.status === 401) { show({ output:'', error:'HTTP 401: bad or missing token in URL', exitCode:null, timedOut:false, durationMs:0, session:payload.session, scriptPath:'' }); return; }
   var j = null;
   try { j = await r.json(); } catch(e) { j = { error:'invalid JSON: '+e.message }; }
   if (!r.ok && !j.error) j.error = 'HTTP '+r.status;
   show({
    output:j.output||'', error:j.error||'',
    exitCode:(j.exitCode===null||j.exitCode===undefined)?null:j.exitCode,
    timedOut:!!j.timedOut, durationMs:Number(j.durationMs)||0,
    session:j.session||payload.session, scriptPath:j.scriptPath||'',
   });
  } catch (e) {
   show({ output:'', error:'network: '+e.message, exitCode:null, timedOut:false, durationMs:0, session:payload.session, scriptPath:'' });
  }
 }
 function baseOpts(){
  return { session:$('inSession').value, timeout: Math.min(300000, Math.max(1000, Number($('inTimeout').value)||60000)) };
 }
 $('btnRunCmd').addEventListener('click', function(){
  var cmd = $('inCmd').value; if (!cmd.trim()) { alert('Enter an inline command first.'); return; }
  run(Object.assign(baseOpts(), { mode:'inline', cmd:cmd }));
 });
 $('btnRunFile').addEventListener('click', function(){
  var f = $('inFile').value.trim(); if (!f) { alert('Enter a file path first.'); return; }
  run(Object.assign(baseOpts(), { mode:'file', file:f }));
 });
 $('btnRunPaste').addEventListener('click', function(){
  var t = $('paste').value; if (!t.trim()) { alert('Paste a script first.'); return; }
  run(Object.assign(baseOpts(), { mode:'upload', script_b64: utf8ToB64(t) }));
 });
 $('btnCopyOut').addEventListener('click', async function(){
  var text = ($('stdout') ? $('stdout').textContent : '') + '\n' + (document.querySelector('pre.stderr') ? document.querySelector('pre.stderr').textContent : '');
  try { await navigator.clipboard.writeText(text); this.textContent = 'Copied'; setTimeout((function(b){ return function(){ b.textContent='Copy Out'; }; })(this), 1200); }
  catch(e) { alert('Clipboard blocked: '+e.message); }
 });
 window.addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); $('btnRunPaste').click(); }
  else if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); $('body').innerHTML='<pre id="stdout" style="color:#9aa6b8">(cleared)</pre>'; }
 });
})();
</script>
</body>
</html>
